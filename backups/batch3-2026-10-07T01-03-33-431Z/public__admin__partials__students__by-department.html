<!-- Admin → Students → By Department -->
<section class="page-head">
  <div>
    <h2 id="dept-page-title">Department Students</h2>
    <p class="muted small" id="dept-page-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('students')">← All Departments</button>
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN.exportTableAsCSV(document.querySelector('.table-admin'), 'students.csv')">
      Export CSV
    </button>
  </div>
</section>

<!-- Department stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total</div>
    <div class="value" id="dept-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Active</div>
    <div class="value" id="dept-stat-active">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">ND</div>
    <div class="value" id="dept-stat-nd">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">HND</div>
    <div class="value" id="dept-stat-hnd">—</div>
  </div>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Level</label>
    <select class="form-select" id="dept-filter-level" onchange="FPU_ADMIN.loadDepartmentStudents()">
      <option value="">All levels</option>
      <option>ND</option>
      <option>HND</option>
      <option>CERT</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Programme</label>
    <select class="form-select" id="dept-filter-programme"
            data-lookup="programmes" data-param="departmentId"
            data-placeholder="All programmes"
            onchange="FPU_ADMIN.loadDepartmentStudents()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">Status</label>
    <select class="form-select" id="dept-filter-status" onchange="FPU_ADMIN.loadDepartmentStudents()">
      <option value="">All</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="dept-filter-search"
           placeholder="Matric, name, or email…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadDepartmentStudents()" />
  </div>
</div>

<!-- Bulk actions -->
<div class="bulk-bar">
  <div>
    <label style="display:flex;align-items:center;gap:.5rem;font-size:13px;">
      <input type="checkbox" id="dept-select-all" />
      <span class="muted">Select all on this page</span>
    </label>
  </div>
  <div class="bulk-actions">
    <button class="btn btn-sm btn-primary" onclick="FPU_ADMIN.bulkStudentAction('activate')">Activate</button>
    <button class="btn btn-sm btn-ghost" onclick="FPU_ADMIN.bulkStudentAction('deactivate')">Deactivate</button>
    <button class="btn btn-sm btn-outline" onclick="FPU_ADMIN.bulkStudentAction('reset-password')">Reset Password</button>
  </div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-head">
    <h3 id="dept-table-title">Students</h3>
    <span class="small muted">Click a row to view the student's profile</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th style="width:32px;"></th>
            <th>Matric</th>
            <th>Name</th>
            <th>Level</th>
            <th>Programme</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="dept-students-tbody">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
