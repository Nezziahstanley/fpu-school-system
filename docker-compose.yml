# ============================================================
# FPU School Management System — Local Postgres + App
# ------------------------------------------------------------
# Start:  docker compose up -d
# Stop:   docker compose down
# Wipe:   docker compose down -v
# ============================================================
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: fpu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fpu_school_system
      POSTGRES_USER: fpu_user
      POSTGRES_PASSWORD: fpu_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fpu_user -d fpu_school_system"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fpu-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://fpu_user:fpu_pass@db:5432/fpu_school_system
      DATABASE_SSL: "false"
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./db:/app/db
      - ./migrations:/app/migrations
      - ./routes:/app/routes
      - ./utils:/app/utils
      - ./config:/app/config

volumes:
  pgdata: