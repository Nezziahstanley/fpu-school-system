<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin — Federal Polytechnic Ugep</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="stylesheet" href="/css/admin.css" />
</head>
<body class="admin-app">
  <script>
    (function () {
      try {
        const keys = ['fpu_portal_user', 'portal_user', 'fpu_admin_user'];
        let user = null;
        for (const k of keys) {
          const v = localStorage.getItem(k);
          if (v) { try { user = JSON.parse(v); break; } catch {} }
        }
        if (!user) return;
        const role = String(user.role || '').toLowerCase();
        const allowed = ['admin', 'superadmin'];
        if (!allowed.includes(role)) {
          window.location.replace('/portal/app.html');
        }
      } catch {}
    })();
  </script>

  <noscript>
    <div style="padding:40px;text-align:center;font-family:system-ui,sans-serif;">
      <h1 style="color:#065f46;">JavaScript Required</h1>
      <p>The FPU Admin Panel requires JavaScript to run. Please enable it in your browser settings and reload this page.</p>
    </div>
  </noscript>

  <!-- SIDEBAR SCRIM -->
  <div class="admin-sidebar-scrim" id="admin-sidebar-scrim"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/images/logo.png" alt="FPU" />
      <span>FPU Admin</span>
    </div>
    <nav id="sidebar-nav">
      <div class="loading" style="color:#a7f3d0;padding:1rem;">
        <span class="spinner"></span> Loading…
      </div>
    </nav>
    <div class="sidebar-footer">
      <span>&copy; <span id="sb-year"></span> FPU</span>
      <span style="font-size:.68rem;">v1.0</span>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="toggle" id="sidebar-toggle" aria-label="Toggle sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <div>
        <h1 id="page-title">Dashboard</h1>
        <div class="subtitle" id="page-subtitle">Welcome back to FPU Admin</div>
      </div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" title="Notifications" id="topbar-notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/>
          <path d="M10 21a2 2 0 0 0 4 0"/>
        </svg>
        <span class="dot" id="pending-badge" style="display:none;">0</span>
      </button>

      <div class="user-chip-wrap">
        <div class="user-chip" id="topbar-user-chip" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false">
          <div class="avatar" id="topbar-avatar">A</div>
          <div>
            <div class="name" id="topbar-name">Admin</div>
            <div class="role" id="topbar-role">admin</div>
          </div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>

        <div class="user-menu" id="topbar-user-menu" role="menu" hidden>
          <div class="user-menu-header">
            <div class="avatar" id="user-menu-avatar">A</div>
            <div>
              <div class="name" id="user-menu-name">Admin</div>
              <div class="email" id="user-menu-email">admin@fedpolyugep.edu.ng</div>
            </div>
          </div>
          <div class="user-menu-divider" role="separator"></div>
          <button class="user-menu-item" role="menuitem" data-action="profile">👤 My Profile</button>
          <button class="user-menu-item" role="menuitem" data-action="password">🔒 Change Password</button>
          <button class="user-menu-item" role="menuitem" data-action="settings">⚙️ System Settings</button>
          <button class="user-menu-item" role="menuitem" data-action="login-history">🕐 Login History</button>
          <div class="user-menu-divider" role="separator"></div>
          <button class="user-menu-item user-menu-danger" role="menuitem" data-action="logout">🚪 Sign Out</button>
        </div>
      </div>

      <button class="icon-btn" title="Sign out" id="topbar-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <path d="M16 17l5-5-5-5"/>
          <path d="M21 12H9"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <div id="page-view">
      <div class="loading">
        <span class="spinner"></span> Loading FPU Admin…
      </div>
    </div>
  </main>

  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- ============================================================
       MOBILE STYLES
       ============================================================ -->
  <style id="admin-mobile-styles">
    @media (min-width: 1025px) {
      .admin-sidebar-scrim { display: none !important; }
    }

    @media (max-width: 1024px) {
      html, body.admin-app {
        overflow-x: hidden !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .admin-sidebar-scrim {
        position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.55);
        z-index: 1090; opacity: 0;
        pointer-events: none;
        transition: opacity .22s ease;
      }
      body.admin-sidebar-open .admin-sidebar-scrim {
        opacity: 1; pointer-events: auto;
      }
      body.admin-sidebar-open { overflow: hidden !important; }

      body.admin-app aside.sidebar,
      body.admin-app #sidebar {
        position: fixed !important;
        top: 0 !important; bottom: 0 !important; left: 0 !important;
        height: 100vh !important; height: 100dvh !important;
        width: 280px !important; max-width: 84vw !important;
        transform: translateX(-105%) !important;
        transition: transform .25s ease !important;
        z-index: 1100 !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
        box-shadow: 6px 0 28px rgba(15, 23, 42, 0.28);
      }
      body.admin-sidebar-open aside.sidebar,
      body.admin-sidebar-open #sidebar {
        transform: translateX(0) !important;
      }

      body.admin-app #sidebar-toggle {
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        -webkit-tap-highlight-color: transparent;
        transition: background .15s;
      }
      body.admin-app #sidebar-toggle:active {
        background: rgba(0, 0, 0, 0.08);
      }
      body.admin-app #sidebar-toggle svg {
        transition: transform .25s ease;
      }
      body.admin-sidebar-open #sidebar-toggle svg {
        transform: rotate(90deg);
      }

      body.admin-app main.main,
      body.admin-app .main {
        width: 100% !important;
        max-width: 100% !important;
        margin: 0 !important;
        padding-left: .75rem !important;
        padding-right: .75rem !important;
      }

      body.admin-app header.topbar,
      body.admin-app .topbar {
        width: 100% !important;
        max-width: 100% !important;
        padding-left: .75rem !important;
        padding-right: .75rem !important;
      }

      body.admin-app .tile-grid,
      body.admin-app .stat-grid,
      body.admin-app .grid {
        grid-template-columns: 1fr !important;
        gap: .75rem !important;
      }
      body.admin-app .chart-grid {
        grid-template-columns: 1fr !important;
      }

      body.admin-app .table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }
      body.admin-app table { min-width: 560px; }

      body.admin-app input,
      body.admin-app select,
      body.admin-app textarea { font-size: 16px !important; }

      body.admin-app #topbar-user-menu {
        right: -6px !important;
        max-width: calc(100vw - 16px) !important;
      }
    }

    @media (max-width: 640px) {
      body.admin-app aside.sidebar,
      body.admin-app #sidebar {
        width: 260px !important;
        max-width: 86vw !important;
      }
      body.admin-app main.main {
        padding-left: .5rem !important;
        padding-right: .5rem !important;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      body.admin-app aside.sidebar,
      body.admin-app #sidebar { width: 230px !important; }
      body.admin-app main.main { padding: .5rem .6rem !important; }
    }
  </style>

  <!-- SCRIPTS -->
  <script src="/js/partials-loader.js"></script>
  <script src="/js/pagination.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin-lookups.js"></script>
  <script src="/js/admin-spa.js"></script>
  <script src="/js/admin-forms.js"></script>

  <script>
    (function () {
      'use strict';

      document.getElementById('sb-year').textContent = new Date().getFullYear();

      function getToken() {
        return localStorage.getItem('fpu_admin_token') || localStorage.getItem('portal_token');
      }
      function getUser() {
        try {
          const raw = localStorage.getItem('fpu_admin_user') || localStorage.getItem('portal_user');
          return raw ? JSON.parse(raw) : null;
        } catch { return null; }
      }
      function clearSession() {
        localStorage.removeItem('fpu_admin_token');
        localStorage.removeItem('fpu_admin_user');
        localStorage.removeItem('portal_token');
        localStorage.removeItem('portal_user');
      }

      if (!getToken()) {
        window.location.href = '/login.html';
        return;
      }

      const user = getUser();
      if (user) {
        const fullName = `${user.firstName || ''} ${user.lastName || ''}`.trim() || 'Admin';
        const initials = (
          (user.firstName || '')[0] || (user.email || '')[0] || 'A'
        ).toUpperCase() + ((user.lastName || '')[0] || '').toUpperCase();

        ['topbar-name', 'user-menu-name'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.textContent = fullName;
        });
        ['topbar-role'].forEach((id) => {
          const el = document.getElementById(id);
          if (el) el.textContent = String(user.role || 'admin').replace(/_/g, ' ');
        });
        const emailEl = document.getElementById('user-menu-email');
        if (emailEl) emailEl.textContent = user.email || '';

        ['topbar-avatar', 'user-menu-avatar'].forEach((id) => {
          const el = document.getElementById(id);
          if (!el) return;
          if (user.photoUrl) {
            el.innerHTML = `<img src="${user.photoUrl}" alt="" />`;
          } else {
            el.textContent = initials || 'A';
          }
        });
      }

      // ============================================================
      // SIDEBAR TOGGLE — works as a drawer on mobile
      // Tapping ☰ toggles open/closed. Tapping outside closes.
      // ============================================================
      const sidebarToggle = document.getElementById('sidebar-toggle');
      const scrim = document.getElementById('admin-sidebar-scrim');
      const sidebar = document.getElementById('sidebar');

      function isMobile() { return window.innerWidth <= 1024; }
      function isOpen() { return document.body.classList.contains('admin-sidebar-open'); }
      function openSidebar() {
        document.body.classList.add('admin-sidebar-open');
        if (sidebarToggle) sidebarToggle.setAttribute('aria-expanded', 'true');
      }
      function closeSidebar() {
        document.body.classList.remove('admin-sidebar-open');
        if (sidebarToggle) sidebarToggle.setAttribute('aria-expanded', 'false');
      }
      function toggleSidebar() {
        isOpen() ? closeSidebar() : openSidebar();
      }

      if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();

          if (isMobile()) {
            // On mobile: tap to open, tap again to close
            toggleSidebar();
          } else {
            // On desktop: toggle collapse
            document.body.classList.toggle('sidebar-collapsed');
          }
        });
      }

      // Tap the scrim → close
      if (scrim) {
        scrim.addEventListener('click', function (e) {
          e.preventDefault();
          closeSidebar();
        });
      }

      // Tap anywhere outside the sidebar (on mobile) → close
      document.addEventListener('click', function (e) {
        if (!isMobile() || !isOpen()) return;
        // Ignore clicks inside the sidebar
        if (sidebar && sidebar.contains(e.target)) return;
        // Ignore clicks on the toggle (handled above)
        if (sidebarToggle && sidebarToggle.contains(e.target)) return;
        closeSidebar();
      });

      // Tap a nav link → close
      if (sidebar) {
        sidebar.addEventListener('click', function (e) {
          if (!isMobile()) return;
          if (e.target.closest('a') || e.target.closest('[data-page]') || e.target.closest('[data-nav]')) {
            setTimeout(closeSidebar, 100);
          }
        });
      }

      // Press Escape → close
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && isOpen()) closeSidebar();
      });

      // Resize to desktop → close
      window.addEventListener('resize', function () {
        if (window.innerWidth > 1024 && isOpen()) closeSidebar();
      });

      // ============================================================
      // LOGOUT
      // ============================================================
      async function doLogout() {
        if (!confirm('Log out of the admin panel?')) return;
        const token = getToken();
        if (token) {
          try {
            await fetch('/api/admin/auth/logout', {
              method: 'POST',
              headers: { Authorization: 'Bearer ' + token },
            });
          } catch { /* ignore */ }
        }
        clearSession();
        window.location.href = '/login.html';
      }

      const logoutBtn = document.getElementById('topbar-logout');
      if (logoutBtn) logoutBtn.addEventListener('click', doLogout);

      // ============================================================
      // PROFILE DROPDOWN
      // ============================================================
      const chip = document.getElementById('topbar-user-chip');
      const menu = document.getElementById('topbar-user-menu');

      function openMenu() {
        if (!menu) return;
        menu.hidden = false;
        chip.setAttribute('aria-expanded', 'true');
        const firstItem = menu.querySelector('.user-menu-item');
        if (firstItem) firstItem.focus();
      }
      function closeMenu() {
        if (!menu) return;
        menu.hidden = true;
        chip.setAttribute('aria-expanded', 'false');
      }
      function toggleMenu() {
        if (!menu) return;
        menu.hidden ? openMenu() : closeMenu();
      }

      if (chip && menu) {
        chip.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleMenu();
        });

        chip.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleMenu();
          } else if (e.key === 'Escape') {
            closeMenu();
          }
        });

        document.addEventListener('click', (e) => {
          if (!menu.hidden && !menu.contains(e.target) && !chip.contains(e.target)) {
            closeMenu();
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !menu.hidden) closeMenu();
        });

        menu.querySelectorAll('[data-action]').forEach((item) => {
          item.addEventListener('click', async (e) => {
            e.preventDefault();
            const action = item.dataset.action;
            closeMenu();

            switch (action) {
              case 'profile':
                if (window.FPU_ADMIN_SPA) window.FPU_ADMIN_SPA.navigateTo('settings');
                break;
              case 'password':
                if (window.FPU_ADMIN_SPA) window.FPU_ADMIN_SPA.navigateTo('settings');
                setTimeout(() => {
                  const pwd = document.querySelector('[data-setting-key="admin_password"]');
                  if (pwd) pwd.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 400);
                break;
              case 'settings':
                if (window.FPU_ADMIN_SPA) window.FPU_ADMIN_SPA.navigateTo('settings');
                break;
              case 'login-history':
                if (window.FPU_ADMIN_SPA) window.FPU_ADMIN_SPA.navigateTo('login-history');
                break;
              case 'logout':
                await doLogout();
                break;
            }
          });
        });
      }

      // ============================================================
      // NOTIFICATIONS
      // ============================================================
      const notifBtn = document.getElementById('topbar-notifications');
      if (notifBtn) {
        notifBtn.addEventListener('click', function () {
          if (window.FPU_ADMIN_SPA && typeof window.FPU_ADMIN_SPA.navigateTo === 'function') {
            window.FPU_ADMIN_SPA.navigateTo('notifications');
          }
        });
      }
    })();
  </script>
</body>
</html>
