<!-- Admin → Academics → Session Form -->
<section class="page-head">
  <div><h2>New Academic Session</h2><p class="muted small">e.g. 2026/2027</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('sessions')">← Back</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Session Details</h3></div>
  <div class="panel-body">
    <form id="session-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Name <span class="req">*</span></label><input class="form-control" name="name" placeholder="2026/2027" required /></div>
        <div class="form-group"><label class="form-label">Start Date</label><input class="form-control" type="date" name="startDate" /></div>
        <div class="form-group"><label class="form-label">End Date</label><input class="form-control" type="date" name="endDate" /></div>
        <div class="form-group"><label class="form-label"><input type="checkbox" name="isCurrent" /> Set as current session</label></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Session</button>
        <button type="button" class="btn btn-ghost" onclick="FPU_ADMIN_SPA.navigateTo('sessions')">Cancel</button>
      </div>
    </form>
  </div>
</div>
