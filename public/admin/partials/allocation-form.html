<!-- Admin → Allocations → Form -->
<section class="page-head">
  <div><h2>New Allocation</h2><p class="muted small">Assign a lecturer to a course</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('allocations')">← Back</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Allocation Details</h3></div>
  <div class="panel-body">
    <form id="allocation-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Session <span class="req">*</span></label>
          <select class="form-select" name="sessionId" data-lookup="sessions" required></select>
        </div>
        <div class="form-group"><label class="form-label">Semester <span class="req">*</span></label>
          <select class="form-select" name="semester"><option value="first">First</option><option value="second">Second</option></select>
        </div>
        <div class="form-group"><label class="form-label">Department</label>
          <select class="form-select" id="alloc-dept" data-lookup="departments">
            <option value="">—</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Course <span class="req">*</span></label>
          <select class="form-select" name="courseId" data-lookup="courses" data-depends-on="alloc-dept" required>
            <option value="">Select department first…</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Lecturer <span class="req">*</span></label>
          <select class="form-select" name="lecturerId" data-lookup="lecturers" data-depends-on="alloc-dept" required>
            <option value="">Select department first…</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Allocation</button>
        <button type="button" class="btn btn-ghost" onclick="FPU_ADMIN_SPA.navigateTo('allocations')">Cancel</button>
      </div>
    </form>
  </div>
</div>
