<!-- ============================================================
     Admin → Allocations → Overview
     ------------------------------------------------------------
     Department-first view of every course allocation.
     Two levels:
       1. Department grid — total allocations, distinct lecturers,
          total credit units taught per department
       2. Department drill-down (allocations-by-dept) —
          grouped by lecturer, showing every course + unit each
          lecturer is teaching this session/semester
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Course Allocations</h2>
    <p class="muted small">
      Which lecturer teaches which course — grouped by department
    </p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadAllocationDepartments()">
      Refresh
    </button>
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('allocation-bulk')">
      Bulk Paste
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('allocation-form')">
      + New Allocation
    </button>
  </div>
</section>

<!-- Session + semester filter bar -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="alloc-filter-session"
            data-lookup="sessions" data-placeholder="Current session"
            onchange="FPU_ADMIN.loadAllocationDepartments()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">Semester</label>
    <select class="form-select" id="alloc-filter-semester"
            onchange="FPU_ADMIN.loadAllocationDepartments()">
      <option value="">All semesters</option>
      <option value="first">First</option>
      <option value="second">Second</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search lecturer or course</label>
    <input class="form-control" id="alloc-filter-search"
           placeholder="Name, matric code, or course code…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadAllocationDepartments()" />
  </div>
  <button class="btn btn-primary" onclick="FPU_ADMIN.loadAllocationDepartments()">Apply</button>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total Allocations</div>
    <div class="value" id="al-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Lecturers Involved</div>
    <div class="value" id="al-stat-lecturers">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Credit Units Taught</div>
    <div class="value" id="al-stat-units">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Departments</div>
    <div class="value" id="al-stat-depts">—</div>
  </div>
</div>

<!-- Department cards -->
<div id="alloc-dept-grid" class="alloc-dept-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading allocations…
  </div>
</div>

<style>
  .alloc-dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-top: 20px;
  }
  .alloc-dept-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
  }
  .alloc-dept-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #065f46, #f59e0b);
  }
  .alloc-dept-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .alloc-dept-card.empty {
    opacity: 0.65;
    cursor: default;
  }
  .alloc-dept-card.empty:hover { transform: none; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }

  .adc-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .adc-code {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .adc-school {
    background: linear-gradient(135deg,#065f46,#047857);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .alloc-dept-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }
  .adc-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .adc-stat {
    background: #f8fafc;
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .adc-stat .num {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 1.25rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .adc-stat.units .num { color: #f59e0b; }
  .adc-stat.lect  .num { color: #8b5cf6; }
  .adc-stat .label {
    display: block;
    font-size: 9.5px;
    color: #6b7280;
    font-weight: 700;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .adc-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }
  .adc-footer .arrow {
    color: #f59e0b;
    font-family: 'Poppins', sans-serif;
  }
</style>

<script>
  // No inline loader — SPA init calls FPU_ADMIN.loadAllocationDepartments()
</script>
