<!-- ============================================================
     Admin → Announcements → Detail
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="ad-title">Announcement</h2>
    <p class="muted small" id="ad-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('announcements')">← Back</button>
    <button class="btn btn-outline btn-sm" id="ad-toggle-publish">Toggle Publish</button>
    <button class="btn btn-primary btn-sm" id="ad-edit">Edit</button>
    <button class="btn btn-danger btn-sm" id="ad-delete">Delete</button>
  </div>
</section>

<div id="ad-root">
  <div class="loading"><span class="spinner"></span> Loading…</div>
</div>

<style>
  .ann-detail {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    padding: 32px 36px;
    box-shadow: 0 4px 20px rgba(15,23,42,0.06);
  }
  .ann-detail-head {
    padding-bottom: 20px;
    border-bottom: 2px solid var(--fpu-border);
    margin-bottom: 20px;
  }
  .ann-detail-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .ann-detail-head h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.6rem;
    color: #0f172a;
    margin: 0 0 8px;
    line-height: 1.3;
  }
  .ann-detail-meta {
    display: flex;
    gap: 16px;
    font-size: 12.5px;
    color: #6b7280;
    flex-wrap: wrap;
  }
  .ann-detail-body {
    font-size: 15px;
    line-height: 1.8;
    color: #1f2937;
    white-space: pre-wrap;
  }
  .ann-detail-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--fpu-border);
  }
  .ann-detail-stat {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px 14px;
    text-align: center;
  }
  .ann-detail-stat .num {
    font-family: 'Poppins', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .ann-detail-stat .label {
    font-size: 11px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const root = document.getElementById('ad-root');

    if (!id) {
      root.innerHTML = '<div class="alert alert-warning">No announcement selected.</div>';
      return;
    }

    let cache = null;

    async function load() {
      root.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await A.adminFetch(`/api/admin/announcements/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const a = json.data;
        cache = a;

        const priority = a.priority || 'normal';
        const audience = a.audience || 'all';
        const now = Date.now();
        const isExpired = a.expiresAt && new Date(a.expiresAt).getTime() < now;

        document.getElementById('ad-title').textContent = a.title;
        document.getElementById('ad-subtitle').textContent =
          `Published ${A.fmtDateTime(a.publishedAt || a.createdAt)} · ${a.authorName || 'Admin'}`;

        root.innerHTML = `
          <div class="ann-detail">
            <div class="ann-detail-head">
              <div class="ann-detail-badges">
                <span class="anc-badge priority-${priority}">
                  ${priority === 'high' ? '🔴 Urgent' : priority === 'low' ? '📝 General' : '📢 Normal'}
                </span>
                <span class="anc-badge audience">${escapeHtml(audience === 'all' ? 'Everyone' : audience)}</span>
                ${a.isPublished === false ? '<span class="anc-badge unpublished">Draft</span>' : ''}
                ${isExpired ? '<span class="anc-badge expired">Expired</span>' : ''}
              </div>
              <h1>${escapeHtml(a.title)}</h1>
              <div class="ann-detail-meta">
                <span>📅 ${A.fmtDateTime(a.publishedAt || a.createdAt)}</span>
                ${a.expiresAt ? `<span>⏳ Expires ${A.fmtDateTime(a.expiresAt)}</span>` : ''}
              </div>
            </div>

            <div class="ann-detail-body">${escapeHtml(a.body || '')}</div>

            <div class="ann-detail-stats">
              <div class="ann-detail-stat">
                <div class="num">${escapeHtml(audience === 'all' ? '🌍' : '👥')}</div>
                <div class="label">Audience</div>
              </div>
              <div class="ann-detail-stat">
                <div class="num">${escapeHtml(priority.toUpperCase())}</div>
                <div class="label">Priority</div>
              </div>
              <div class="ann-detail-stat">
                <div class="num">${a.isPublished === false ? '📝' : '✅'}</div>
                <div class="label">Status</div>
              </div>
            </div>
          </div>
        `;

        // Wire actions
        document.getElementById('ad-edit').onclick = () =>
          A.FPU_ADMIN_SPA.navigateToWithQuery('announcement-form', { id });

        document.getElementById('ad-delete').onclick = async () => {
          if (!confirm('Delete this announcement?')) return;
          try {
            await A.adminFetch(`/api/admin/announcements/${id}`, { method: 'DELETE' });
            A.showToast('🗑️ Deleted.');
            A.FPU_ADMIN_SPA.navigateTo('announcements');
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

        document.getElementById('ad-toggle-publish').onclick = async () => {
          try {
            await A.adminFetch(`/api/admin/announcements/${id}`, {
              method: 'PUT',
              body: JSON.stringify({ isPublished: a.isPublished === false }),
            });
            A.showToast('✅ Toggled.');
            load();
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };
      } catch (err) {
        root.innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
      }
    }

    function escapeHtml(str) {
      return A.escapeHtml(str);
    }

    load();
  })();
</script>
