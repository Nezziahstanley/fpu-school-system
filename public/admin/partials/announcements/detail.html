<!-- ============================================================
     Admin → Announcements → Detail
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="ad-title">Announcement</h2>
    <p class="muted small" id="ad-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#announcements'">← Back</button>
    <button class="btn btn-outline btn-sm" id="ad-toggle-publish">Toggle Publish</button>
    <button class="btn btn-primary btn-sm" id="ad-edit">Edit</button>
    <button class="btn btn-ghost btn-sm" style="color:#dc2626;" id="ad-delete">Delete</button>
  </div>
</section>

<div id="ad-root">
  <div class="loading" style="padding:40px;text-align:center;"><span class="spinner"></span> Loading…</div>
</div>

<style>
  .ann-detail { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 32px 36px; box-shadow: 0 4px 20px rgba(15,23,42,0.06); }
  .ann-detail-head { padding-bottom: 20px; border-bottom: 2px solid #e2e8f0; margin-bottom: 20px; }
  .ann-detail-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .ann-detail-head h1 { font-family: 'Poppins', sans-serif; font-size: 1.6rem; color: #0f172a; margin: 0 0 8px; line-height: 1.3; }
  .ann-detail-meta { display: flex; gap: 16px; font-size: 12.5px; color: #6b7280; flex-wrap: wrap; }
  .ann-detail-body { font-size: 15px; line-height: 1.8; color: #1f2937; white-space: pre-wrap; }
  .ann-detail-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
  .ann-detail-stat { background: #f8fafc; border-radius: 8px; padding: 12px 14px; text-align: center; }
  .ann-detail-stat .num { font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 800; color: #065f46; line-height: 1; }
  .ann-detail-stat .label { font-size: 11px; color: #6b7280; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  
  .anc-badge { padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  .anc-badge.priority-high { background: #fee2e2; color: #991b1b; }
  .anc-badge.priority-normal { background: #dbeafe; color: #1e40af; }
  .anc-badge.priority-low { background: #f1f5f9; color: #475569; }
  .anc-badge.audience { background: #ecfdf5; color: #065f46; }
  .anc-badge.unpublished { background: #fef3c7; color: #92400e; }
  .anc-badge.expired { background: #fee2e2; color: #991b1b; }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const root = document.getElementById('ad-root');

    if (!id) {
      root.innerHTML = '<div class="alert alert-warning" style="margin:20px;">No announcement selected.</div>';
      return;
    }

    async function load() {
      root.innerHTML = '<div class="loading" style="padding:40px;text-align:center;"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await A.adminFetch(`/api/admin/announcements/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const a = json.data;

        const priority = String(a.priority || 'normal').toLowerCase();
        const audience = String(a.audience || 'all').toLowerCase();
        const isExpired = a.expiresAt && new Date(a.expiresAt) < new Date();

        document.getElementById('ad-title').textContent = a.title;
        document.getElementById('ad-subtitle').textContent = `Published ${A.fmtDateTime(a.publishedAt || a.createdAt)}`;

        // Priority Badge
        let pClass = 'priority-normal';
        let pIcon = '📢';
        let pLabel = 'Normal';
        if (priority === 'high') { pClass = 'priority-high'; pIcon = '🔴'; pLabel = 'Urgent'; }
        if (priority === 'low') { pClass = 'priority-low'; pIcon = '📝'; pLabel = 'General'; }

        root.innerHTML = `
          <div class="ann-detail">
            <div class="ann-detail-head">
              <div class="ann-detail-badges">
                <span class="anc-badge ${pClass}">${pIcon} ${pLabel}</span>
                <span class="anc-badge audience">${A.escapeHtml(audience === 'all' ? 'Everyone' : audience)}</span>
                ${a.isPublished === false ? '<span class="anc-badge unpublished">Draft</span>' : ''}
                ${isExpired ? '<span class="anc-badge expired">Expired</span>' : ''}
              </div>
              <h1>${A.escapeHtml(a.title)}</h1>
              <div class="ann-detail-meta">
                <span>📅 ${A.fmtDateTime(a.publishedAt || a.createdAt)}</span>
                ${a.expiresAt ? `<span>⏳ Expires ${A.fmtDateTime(a.expiresAt)}</span>` : ''}
              </div>
            </div>

            <div class="ann-detail-body">${A.escapeHtml(a.body || '')}</div>

            <div class="ann-detail-stats">
              <div class="ann-detail-stat">
                <div class="num">${audience === 'all' ? '🌍' : '👥'}</div>
                <div class="label">Audience</div>
              </div>
              <div class="ann-detail-stat">
                <div class="num">${priority.toUpperCase()}</div>
                <div class="label">Priority</div>
              </div>
              <div class="ann-detail-stat">
                <div class="num">${a.isPublished === false ? '📝' : '✅'}</div>
                <div class="label">Status</div>
              </div>
            </div>
          </div>
        `;

        // ✅ FIXED: Wire Edit button with hash routing
        document.getElementById('ad-edit').onclick = () => {
          window.location.hash = `#announcement-form?id=${id}`;
        };

        // ✅ FIXED: Wire Delete button
        document.getElementById('ad-delete').onclick = async () => {
          if (!confirm('Delete this announcement? This cannot be undone.')) return;
          try {
            const res = await A.adminFetch(`/api/admin/announcements/${id}`, { method: 'DELETE' });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            A.showToast('🗑️ Deleted.', 'success');
            window.location.hash = '#announcements';
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

        // ✅ FIXED: Wire Toggle Publish button
        document.getElementById('ad-toggle-publish').onclick = async () => {
          try {
            await A.adminFetch(`/api/admin/announcements/${id}`, {
              method: 'PUT',
              body: JSON.stringify({ isPublished: a.isPublished === false }),
            });
            A.showToast('✅ Toggled.', 'success');
            load(); // Reload to reflect new state
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

      } catch (err) {
        root.innerHTML = `<div class="alert alert-danger" style="margin:20px;"><strong>Error:</strong> ${A.escapeHtml(err.message)}</div>`;
      }
    }

    load();
  })();
</script>
