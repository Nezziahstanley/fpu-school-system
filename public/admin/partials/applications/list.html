<!-- Admin → Applications → List -->
<section class="page-head">
  <div>
    <h2>Applications</h2>
    <p class="muted small">Review, approve, and register applicant accounts</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN.exportTableAsCSV(document.querySelector('.table-admin'), 'applications.csv')">
      Export CSV
    </button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadApplications()">Refresh</button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('application-form')">
      + New Application
    </button>
  </div>
</section>

<!-- Inline stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total</div>
    <div class="value" id="app-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Pending</div>
    <div class="value" id="app-stat-pending">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Approved</div>
    <div class="value" id="app-stat-approved">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Registered</div>
    <div class="value" id="app-stat-registered">—</div>
  </div>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Status</label>
    <select class="form-select" id="applications-status-filter" onchange="FPU_ADMIN.loadApplications()">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="under_review">Under Review</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
      <option value="registered">Registered</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Type</label>
    <select class="form-select" id="applications-type-filter" onchange="FPU_ADMIN.loadApplications()">
      <option value="">ND + HND</option>
      <option value="ND">ND</option>
      <option value="HND">HND</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Country</label>
    <select class="form-select" id="applications-country-filter"
            data-lookup="countries" data-placeholder="All countries"
            onchange="FPU_ADMIN.loadApplications()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">State</label>
    <select class="form-select" id="applications-state-filter"
            data-lookup="states" data-depends-on="applications-country-filter"
            data-param="country" data-placeholder="All states"
            onchange="FPU_ADMIN.loadApplications()"></select>
  </div>
  <div class="form-group" style="flex:2 1 260px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="applications-search"
           placeholder="Name, email, application number…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadApplications()" />
  </div>
</div>

<!-- Bulk actions bar -->
<div class="bulk-bar">
  <div>
    <label style="display:flex;align-items:center;gap:.5rem;font-size:13px;">
      <input type="checkbox" id="apps-select-all" />
      <span class="muted">Select all</span>
    </label>
  </div>
  <div class="bulk-actions">
    <button class="btn btn-sm btn-primary" onclick="FPU_ADMIN.bulkApplicationAction('approve')">Approve selected</button>
    <button class="btn btn-sm btn-ghost" onclick="FPU_ADMIN.bulkApplicationAction('reject')">Reject selected</button>
    <button class="btn btn-sm btn-danger" onclick="FPU_ADMIN.bulkApplicationAction('delete')">Delete selected</button>
  </div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-head">
    <h3>All Applications</h3>
    <span class="small muted">Click a row to view details</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th style="width:32px;"></th>
            <th>Application No</th>
            <th>Applicant</th>
            <th>Type</th>
            <th>Status</th>
            <th>Submitted</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="applications-tbody">
          <tr><td colspan="7" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
