<!-- Admin → Applications → View -->
<section class="page-head">
  <div>
    <h2>Application Details</h2>
    <p class="muted small" id="app-view-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('applications')">
      ← Back to list
    </button>
    <button class="btn btn-outline btn-sm" id="app-print-btn">Print</button>
  </div>
</section>

<div class="grid grid-2" style="gap:20px; align-items:flex-start;">

  <!-- Left: passport + status -->
  <div>
    <div class="panel">
      <div class="panel-head"><h3>Passport</h3></div>
      <div class="panel-body" style="text-align:center;">
        <div id="app-passport-wrap" style="
          width:200px;height:200px;margin:0 auto 14px;
          border-radius:14px;overflow:hidden;
          background:linear-gradient(135deg,#065f46,#f59e0b);
          color:#fff;display:flex;align-items:center;justify-content:center;
          font-family:'Poppins',sans-serif;font-size:3rem;font-weight:700;
          box-shadow:0 8px 24px rgba(15,23,42,0.15);
        ">—</div>
        <div id="app-status-pill" style="margin-top:8px;">—</div>
        <div class="small muted" style="margin-top:12px;" id="app-status-meta"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Timeline</h3></div>
      <div class="panel-body" id="app-timeline">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>

  <!-- Right: bio + location + academic -->
  <div>
    <div class="panel">
      <div class="panel-head"><h3>Applicant Bio</h3></div>
      <div class="panel-body" id="app-bio">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Location</h3></div>
      <div class="panel-body" id="app-location">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Academic</h3></div>
      <div class="panel-body" id="app-academic">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Actions panel -->
<div class="panel" id="app-actions-panel" style="display:none;">
  <div class="panel-head"><h3>Actions</h3></div>
  <div class="panel-body">
    <div class="row-actions">
      <button class="btn btn-outline btn-sm" id="app-review">Mark Under Review</button>
      <button class="btn btn-primary btn-sm" id="app-approve">Approve</button>
      <button class="btn btn-ghost btn-sm" id="app-reject">Reject</button>
      <button class="btn btn-accent btn-sm" id="app-register">Register &amp; Assign Matric</button>
    </div>
    <p class="small muted" style="margin-top:12px;">
      Registering creates a student account, assigns a matric number, and copies the passport photo to the student profile.
    </p>
  </div>
</div>

<style>
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed #e5e7eb;
    font-size: 13.5px;
    gap: 12px;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .k { color: #6b7280; flex-shrink: 0; }
  .field-row .v { color: #0f172a; font-weight: 500; text-align: right; word-break: break-word; }
  .timeline-item {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot {
    width: 10px; height: 10px; border-radius: 50%;
    margin-top: 6px; flex-shrink: 0;
    background: #065f46;
  }
  .timeline-dot.pending { background: #f59e0b; }
  .timeline-dot.rejected { background: #dc2626; }
  .timeline-dot.approved { background: #10b981; }
  .timeline-content strong { display: block; font-size: 13.5px; color: #0f172a; }
  .timeline-content span { font-size: 12px; color: #6b7280; }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');

    if (!id) {
      $('app-bio').innerHTML = '<p class="muted">No application ID provided. <a href="#applications">Back to list</a></p>';
      return;
    }

    function fieldRow(label, value) {
      return `<div class="field-row"><span class="k">${A.escapeHtml(label)}</span><span class="v">${A.escapeHtml(value || '—')}</span></div>`;
    }

    async function load() {
      try {
        const res = await A.adminFetch(`/api/admin/applications/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const a = json.data;

        // Subtitle
        $('app-view-subtitle').textContent = `${a.applicationNumber} · submitted ${A.fmtDateTime(a.createdAt)}`;

        // Passport
        const wrap = $('app-passport-wrap');
        if (a.passportUrl) {
          wrap.innerHTML = `<img src="${A.escapeHtml(a.passportUrl)}" alt="Passport" style="width:100%;height:100%;object-fit:cover;" />`;
        } else {
          const initials = ((a.firstName || ' ')[0] + (a.lastName || ' ')[0]).toUpperCase().trim() || 'A';
          wrap.textContent = initials;
        }

        // Status
        $('app-status-pill').innerHTML = A.statusPill(a.status);
        $('app-status-meta').textContent =
          a.status === 'registered' && a.matricNumber ? `Matric: ${a.matricNumber}` :
          a.reviewedAt ? `Reviewed ${A.fmtDateTime(a.reviewedAt)}` : '';

        // Bio
        $('app-bio').innerHTML = [
          fieldRow('First Name', a.firstName),
          fieldRow('Middle Name', a.middleName),
          fieldRow('Last Name', a.lastName),
          fieldRow('Email', a.email),
          fieldRow('Phone', a.phone),
          fieldRow('Gender', a.gender),
          fieldRow('Date of Birth', a.dateOfBirth ? A.fmtDate(a.dateOfBirth) : ''),
        ].join('');

        // Location
        $('app-location').innerHTML = [
          fieldRow('Country', a.country || 'Nigeria'),
          fieldRow('State of Origin', a.stateOfOrigin),
          fieldRow('LGA', a.lga),
          fieldRow('Address', a.address),
        ].join('');

        // Academic
        $('app-academic').innerHTML = [
          fieldRow('Application Type', a.type),
          fieldRow('Level', a.level),
          fieldRow('JAMB Score', a.jambScore),
          fieldRow('JAMB Reg No', a.jambRegNo),
          fieldRow('Matric (if registered)', a.matricNumber),
        ].join('');

        // Timeline
        const events = [
          { label: 'Application submitted', at: a.createdAt, cls: 'pending' },
          a.reviewedAt ? { label: `Reviewed — ${a.status}`, at: a.reviewedAt, cls: a.status === 'rejected' ? 'rejected' : 'approved' } : null,
          a.admittedAt ? { label: 'Approved', at: a.admittedAt, cls: 'approved' } : null,
          a.status === 'registered' ? { label: 'Registered as student', at: a.updatedAt, cls: 'approved' } : null,
        ].filter(Boolean);

        $('app-timeline').innerHTML = events.map((e) => `
          <div class="timeline-item">
            <div class="timeline-dot ${e.cls}"></div>
            <div class="timeline-content">
              <strong>${A.escapeHtml(e.label)}</strong>
              <span>${A.fmtDateTime(e.at)}</span>
            </div>
          </div>
        `).join('');

        // Actions panel
        $('app-actions-panel').style.display = 'block';
        const reviewBtn   = $('app-review');
        const approveBtn  = $('app-approve');
        const rejectBtn   = $('app-reject');
        const registerBtn = $('app-register');

        reviewBtn.disabled   = a.status !== 'pending';
        approveBtn.disabled  = a.status === 'approved' || a.status === 'registered' || a.status === 'rejected';
        rejectBtn.disabled   = a.status === 'registered';
        registerBtn.disabled = a.status !== 'approved';

        reviewBtn.onclick = async () => {
          try {
            await A.adminFetch(`/api/admin/applications/${id}/review`, { method: 'POST' });
            A.showToast('Marked under review.');
            load();
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

        approveBtn.onclick = async () => {
          try {
            await A.adminFetch(`/api/admin/applications/${id}/approve`, { method: 'POST' });
            A.showToast('Application approved.');
            load();
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

        rejectBtn.onclick = async () => {
          const reason = prompt('Reason for rejection:');
          if (reason === null) return;
          if (!reason.trim()) { A.showToast('⚠️ A reason is required.', 'warning'); return; }
          try {
            await A.adminFetch(`/api/admin/applications/${id}/reject`, {
              method: 'POST',
              body: JSON.stringify({ reason }),
            });
            A.showToast('Application rejected.', 'warning');
            load();
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

        registerBtn.onclick = async () => {
          if (!confirm('Create the student account and assign a matric number?')) return;
          try {
            const r = await A.adminFetch(`/api/admin/applications/${id}/register`, { method: 'POST' });
            const j = await r.json();
            if (!j.success) throw new Error(j.error);
            A.showToast(`Registered. Matric: ${j.data.matricNumber}`);
            load();
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

        // Print
        $('app-print-btn').onclick = () => window.print();
      } catch (err) {
        $('app-bio').innerHTML = `<div class="alert alert-danger">${A.escapeHtml(err.message)}</div>`;
      }
    }

    load();
  })();
</script>
