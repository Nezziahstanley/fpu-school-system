<!-- ============================================================
     Admin → Attendance → By Department
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="abd-title">Department Attendance</h2>
    <p class="muted small" id="abd-subtitle">Loading courses…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#attendance'">
      ← All Departments
    </button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadDepartmentAttendance()">
      Refresh
    </button>
  </div>
</section>

<!-- Stats -->
<div class="stats-inline" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #3b82f6;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Courses w/ Records</div>
    <div id="abdc-stat-courses" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #8b5cf6;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Total Records</div>
    <div id="abdc-stat-records" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #10b981;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Overall Rate</div>
    <div id="abdc-stat-rate" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #f59e0b;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Students Tracked</div>
    <div id="abdc-stat-students" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
</div>

<!-- Filters -->
<div class="filters" style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 24px; display: flex; gap: 16px; flex-wrap: wrap;">
  <div class="form-group" style="flex: 1; min-width: 190px;">
    <label class="form-label">Academic Session</label>
    <select class="form-select" id="abd-filter-session"><option value="">Current / Latest Session</option></select>
  </div>
  <div class="form-group" style="flex: 1; min-width: 150px;">
    <label class="form-label">Level</label>
    <select class="form-select" id="abd-filter-level" onchange="FPU_ADMIN.loadDepartmentAttendance()">
      <option value="">All Levels</option>
      <option value="ND">ND</option>
      <option value="HND">HND</option>
      <option value="CERT">CERT</option>
    </select>
  </div>
  <div class="form-group" style="flex: 1; min-width: 150px;">
    <label class="form-label">Semester</label>
    <select class="form-select" id="abd-filter-semester" onchange="FPU_ADMIN.loadDepartmentAttendance()">
      <option value="">All Semesters</option>
      <option value="first">First</option>
      <option value="second">Second</option>
    </select>
  </div>
  <div class="form-group" style="flex: 2; min-width: 200px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="abd-filter-search" placeholder="Course code or title…" onkeydown="if(event.key==='Enter')FPU_ADMIN.loadDepartmentAttendance()" />
  </div>
</div>

<!-- Grid -->
<div id="abd-course-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
  <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8;">
    <span class="spinner"></span> Loading courses…
  </div>
</div>
