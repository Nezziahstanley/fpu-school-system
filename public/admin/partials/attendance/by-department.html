<!-- ============================================================
     Admin → Attendance → By Department
     ------------------------------------------------------------
     Every course in a department with an attendance summary:
       • total records
       • overall attendance rate
       • # students tracked
       • last class date
     Click a course → per-student roster.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="abd-title">Department Attendance</h2>
    <p class="muted small" id="abd-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('attendance')">
      ← All Departments
    </button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadDepartmentAttendance()">
      Refresh
    </button>
  </div>
</section>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Courses w/ Records</div>
    <div class="value" id="abdc-stat-courses">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Total Records</div>
    <div class="value" id="abdc-stat-records">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Overall Rate</div>
    <div class="value" id="abdc-stat-rate">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Students Tracked</div>
    <div class="value" id="abdc-stat-students">—</div>
  </div>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Level</label>
    <select class="form-select" id="abd-filter-level"
            onchange="FPU_ADMIN.loadDepartmentAttendance()">
      <option value="">All</option>
      <option>ND</option>
      <option>HND</option>
      <option>CERT</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Semester</label>
    <select class="form-select" id="abd-filter-semester"
            onchange="FPU_ADMIN.loadDepartmentAttendance()">
      <option value="">All</option>
      <option value="first">First</option>
      <option value="second">Second</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search course</label>
    <input class="form-control" id="abd-filter-search"
           placeholder="Code or title…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadDepartmentAttendance()" />
  </div>
</div>

<!-- Course grid -->
<div id="abd-course-grid" class="abd-course-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading courses…
  </div>
</div>

<style>
  .abd-course-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .abd-course-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
  }
  .abd-course-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
    border-radius: 12px 0 0 12px;
  }
  .abd-course-card.healthy::before  { background: #10b981; }
  .abd-course-card.warning::before  { background: #f59e0b; }
  .abd-course-card.critical::before { background: #dc2626; }
  .abd-course-card.empty::before    { background: #cbd5e1; }
  .abd-course-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .abd-course-card.empty { opacity: 0.65; cursor: default; }
  .abd-course-card.empty:hover { transform: none; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }

  .abcc-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .abcc-code {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Courier New', monospace;
    font-size: 12.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
  }
  .abcc-level {
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 3px 9px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .abcc-level.nd  { background: #dbeafe; color: #1e40af; }
  .abcc-level.hnd { background: #fef3c7; color: #92400e; }
  .abcc-level.cert{ background: #dcfce7; color: #15803d; }
  .abd-course-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.3;
  }
  .abcc-rate {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .abcc-rate .num {
    font-family: 'Poppins', sans-serif;
    font-size: 1.7rem;
    font-weight: 800;
    line-height: 1;
    color: #065f46;
  }
  .abcc-rate .num.warning  { color: #b45309; }
  .abcc-rate .num.critical { color: #b91c1c; }
  .abcc-rate .num.empty    { color: #94a3b8; }
  .abcc-rate .label {
    font-size: 11.5px;
    color: #6b7280;
    font-weight: 600;
  }
  .abcc-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .abcc-stat {
    background: #f8fafc;
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
  }
  .abcc-stat .num {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .abcc-stat .label {
    display: block;
    font-size: 9px;
    color: #6b7280;
    font-weight: 700;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .abcc-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 8px;
    border-top: 1px solid #f1f5f9;
    font-size: 11.5px;
    color: #94a3b8;
    font-weight: 600;
  }
  .abcc-footer .arrow { color: #f59e0b; font-family: 'Poppins', sans-serif; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadDepartmentAttendance()
</script>
