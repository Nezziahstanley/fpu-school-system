<!-- ============================================================
     Admin → Attendance → Overview (department-first)
     ------------------------------------------------------------
     One card per department showing:
       • # courses with attendance records
       • total records
       • overall attendance rate (%)
       • number of students tracked
     Click a card → course-level breakdown.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Attendance</h2>
    <p class="muted small">
      Class attendance grouped by department — click a department to view its courses
    </p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadAttendanceDepartments()">
      Refresh
    </button>
  </div>
</section>

<!-- Session + semester filter -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="att-filter-session"
            data-lookup="sessions" data-placeholder="Current session"
            onchange="FPU_ADMIN.loadAttendanceDepartments()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">Semester</label>
    <select class="form-select" id="att-filter-semester"
            onchange="FPU_ADMIN.loadAttendanceDepartments()">
      <option value="">All semesters</option>
      <option value="first">First</option>
      <option value="second">Second</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">School</label>
    <select class="form-select" id="att-filter-school"
            data-lookup="schools" data-placeholder="All schools"
            onchange="FPU_ADMIN.loadAttendanceDepartments()"></select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="att-filter-search"
           placeholder="Department code or name…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadAttendanceDepartments()" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Departments Tracked</div>
    <div class="value" id="att-stat-depts">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Courses</div>
    <div class="value" id="att-stat-courses">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Overall Rate</div>
    <div class="value" id="att-stat-rate">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Total Records</div>
    <div class="value" id="att-stat-total">—</div>
  </div>
</div>

<!-- Department grid -->
<div id="att-dept-grid" class="att-dept-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading departments…
  </div>
</div>

<style>
  .att-dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-top: 20px;
  }
  .att-dept-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
  }
  .att-dept-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .att-dept-card.healthy::before { background: linear-gradient(90deg, #10b981, #34d399); }
  .att-dept-card.warning::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .att-dept-card.critical::before { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .att-dept-card.empty::before    { background: linear-gradient(90deg, #cbd5e1, #e2e8f0); }
  .att-dept-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .att-dept-card.empty { opacity: 0.7; cursor: default; }
  .att-dept-card.empty:hover { transform: none; box-shadow: 0 1px 2px rgba(15,23,42,0.04); }

  .adc-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .adc-code {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .adc-school {
    background: linear-gradient(135deg,#065f46,#047857);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .att-dept-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }
  .adc-rate {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .adc-rate-num {
    font-family: 'Poppins', sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    line-height: 1;
    color: #065f46;
  }
  .adc-rate-num.warning  { color: #b45309; }
  .adc-rate-num.critical { color: #b91c1c; }
  .adc-rate-num.empty    { color: #94a3b8; }
  .adc-rate .label {
    font-size: 12px;
    color: #6b7280;
    font-weight: 600;
  }
  .adc-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .adc-stat {
    background: #f8fafc;
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .adc-stat .num {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .adc-stat .label {
    display: block;
    font-size: 9.5px;
    color: #6b7280;
    font-weight: 700;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .adc-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }
  .adc-footer .arrow {
    color: #f59e0b;
    font-family: 'Poppins', sans-serif;
  }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadAttendanceDepartments()
</script>
