<!-- ============================================================
     Admin → Attendance → Overview
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Attendance</h2>
    <p class="muted small">Class attendance grouped by department — click a card to view detailed courses.</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadAttendanceDepartments()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:6px;vertical-align:middle;"><path d="M21 2v6h-6M3 12a9 9 0 1 0 2.64-6.36L21 8"/></svg>
      Refresh
    </button>
  </div>
</section>

<!-- Filters -->
<div class="filters" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px;">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="att-filter-session">
      <option value="">Current Session</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Semester</label>
    <select class="form-select" id="att-filter-semester">
      <option value="">All Semesters</option>
      <option value="first">First Semester</option>
      <option value="second">Second Semester</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">School</label>
    <select class="form-select" id="att-filter-school">
      <option value="">All Schools</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Search</label>
    <input class="form-control" id="att-search" placeholder="Department code or name…" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline" style="margin-bottom: 20px;">
  <div class="stat-inline">
    <div class="label">Departments Tracked</div>
    <div class="value" id="att-stat-depts">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Courses</div>
    <div class="value" id="att-stat-courses">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Overall Rate</div>
    <div class="value" id="att-stat-rate">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Total Records</div>
    <div class="value" id="att-stat-total">—</div>
  </div>
</div>

<!-- Data Grid Container -->
<div id="att-dept-grid" style="display: block; width: 100%;">
  <div class="loading" style="text-align:center;padding:40px;color:#94a3b8;">
    <span class="spinner"></span> Loading attendance data…
  </div>
</div>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadAttendanceDepartments) {
    setTimeout(window.FPU_ADMIN.loadAttendanceDepartments, 100);
  }
</script>
