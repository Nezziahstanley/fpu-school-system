<!-- ============================================================
     Admin → Clearances → By Department
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="cd-title">Department Clearances</h2>
    <p class="muted small" id="cd-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#clearances'">← All Departments</button>
    <button class="btn btn-outline btn-sm" id="cd-export">⬇ Export CSV</button>
  </div>
</section>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline"><div class="label">Students</div><div class="value" id="cdd-stat-students">—</div></div>
  <div class="stat-inline stat-inline-success"><div class="label">Cleared</div><div class="value" id="cdd-stat-cleared">—</div></div>
  <div class="stat-inline stat-inline-accent"><div class="label">Pending</div><div class="value" id="cdd-stat-pending">—</div></div>
  <div class="stat-inline stat-inline-primary"><div class="label">Rate</div><div class="value" id="cdd-stat-rate">—</div></div>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Status</label>
    <select class="form-select" id="cdd-filter-status" onchange="FPU_ADMIN.loadDepartmentClearances()">
      <option value="">All</option>
      <option value="cleared">Cleared</option>
      <option value="pending">Pending</option>
      <option value="rejected">Rejected</option>
      <option value="missing">No clearance record</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="cdd-search" placeholder="Name or matric…" onkeyup="FPU_ADMIN.loadDepartmentClearances()" />
  </div>
</div>

<!-- Bulk Actions Bar -->
<div class="bulk-bar" style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:10px 16px; border-radius:10px; margin-bottom:16px; border:1px solid #e2e8f0;">
  <label style="display:flex; align-items:center; gap:10px; font-size:13px; cursor:pointer; margin:0;">
    <input type="checkbox" id="cd-select-all" style="width:16px; height:16px; accent-color:#065f46;" />
    <span class="muted">Select all on this page</span>
  </label>
  <div style="display:flex; gap:8px;">
    <button class="btn btn-sm btn-primary" onclick="FPU_ADMIN.bulkClearClearances('cleared')">✓ Mark Cleared</button>
    <button class="btn btn-sm btn-ghost" style="color:#dc2626;" onclick="FPU_ADMIN.bulkClearClearances('rejected')">✕ Mark Rejected</button>
  </div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-head">
    <h3>Students</h3>
    <span class="small muted" id="cdd-count">Loading…</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th style="width:32px;"></th>
            <th>Matric</th>
            <th>Student</th>
            <th style="width:80px;">Level</th>
            <th style="width:120px;">Status</th>
            <th>Remarks</th>
            <th style="width:200px; text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="cdd-tbody">
          <tr><td colspan="7" class="empty" style="text-align:center; padding:20px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; }
  .badge-cleared  { background: #d1fae5; color: #065f46; }
  .badge-pending  { background: #fef3c7; color: #92400e; }
  .badge-rejected { background: #fee2e2; color: #991b1b; }
  .badge-missing  { background: #f1f5f9; color: #475569; }
</style>

<script>
  // Auto-load on page render
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadDepartmentClearances) {
    setTimeout(window.FPU_ADMIN.loadDepartmentClearances, 100);
  }
</script>
