<!-- ============================================================
     Admin → Clearances → Department Overview
     ------------------------------------------------------------
     Per department:
       • Total students
       • Cleared / Pending / Rejected counts
       • Clearance completion %
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Clearances</h2>
    <p class="muted small">
      Student clearance status grouped by department
    </p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadClearanceDepartments()">
      Refresh
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('clearances-bulk')">
      + Bulk Clear
    </button>
  </div>
</section>

<!-- Session picker -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="clr-session"
            data-lookup="sessions" data-placeholder="Current session"
            onchange="FPU_ADMIN.loadClearanceDepartments()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">School</label>
    <select class="form-select" id="clr-school"
            data-lookup="schools" data-placeholder="All schools"
            onchange="FPU_ADMIN.loadClearanceDepartments()"></select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="clr-search"
           placeholder="Department code or name…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadClearanceDepartments()" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Departments</div>
    <div class="value" id="clr-stat-depts">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Cleared</div>
    <div class="value" id="clr-stat-cleared">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Pending</div>
    <div class="value" id="clr-stat-pending">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Overall Rate</div>
    <div class="value" id="clr-stat-rate">—</div>
  </div>
</div>

<!-- Department grid -->
<div id="clr-dept-grid" class="clr-dept-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading departments…
  </div>
</div>

<style>
  .clr-dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .clr-dept-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .clr-dept-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
  }
  .clr-dept-card.healthy  { }
  .clr-dept-card.healthy::before  { background: linear-gradient(90deg, #10b981, #34d399); }
  .clr-dept-card.warning::before  { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  .clr-dept-card.critical::before { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .clr-dept-card.empty::before    { background: linear-gradient(90deg, #cbd5e1, #e2e8f0); }
  .clr-dept-card.empty { opacity: 0.65; cursor: default; }
  .clr-dept-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .cdc-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .cdc-code {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .cdc-school {
    background: linear-gradient(135deg,#065f46,#047857);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .clr-dept-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }
  .cdc-rate {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .cdc-rate-num {
    font-family: 'Poppins', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    line-height: 1;
    color: #065f46;
  }
  .cdc-rate-num.warning  { color: #b45309; }
  .cdc-rate-num.critical { color: #b91c1c; }
  .cdc-rate-num.empty    { color: #94a3b8; }
  .cdc-rate .label {
    font-size: 12px;
    color: #6b7280;
    font-weight: 600;
  }
  .cdc-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    text-align: center;
  }
  .cdc-stats .item {
    background: #f8fafc;
    border-radius: 6px;
    padding: 6px 4px;
  }
  .cdc-stats .item .n {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    color: #065f46;
    font-size: 1rem;
    display: block;
  }
  .cdc-stats .item.pending .n  { color: #b45309; }
  .cdc-stats .item.cleared .n  { color: #047857; }
  .cdc-stats .item.rejected .n { color: #b91c1c; }
  .cdc-stats .item .l {
    display: block;
    font-size: 9px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }
  .cdc-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }
  .cdc-footer .arrow { color: #f59e0b; font-family: 'Poppins', sans-serif; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadClearanceDepartments()
</script>
