<!-- ============================================================
     Admin → Clearances → List
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Clearances</h2>
    <p class="muted small">Student clearance status grouped by department</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadClearanceDepartments()">Refresh</button>
    <button class="btn btn-outline btn-sm" id="clr-export">⬇ Export CSV</button>
    <button class="btn btn-primary btn-sm" onclick="window.location.hash='#clearances-bulk'">+ Bulk Clear</button>
  </div>
</section>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="clr-session" onchange="FPU_ADMIN.loadClearanceDepartments()">
      <option value="">Current session</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">School</label>
    <select class="form-select" id="clr-school" onchange="FPU_ADMIN.loadClearanceDepartments()">
      <option value="">All schools</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="clr-search" placeholder="Department code or name…" onkeyup="FPU_ADMIN.loadClearanceDepartments()" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline"><div class="label">Departments</div><div class="value" id="clr-stat-depts">—</div></div>
  <div class="stat-inline stat-inline-success"><div class="label">Cleared</div><div class="value" id="clr-stat-cleared">—</div></div>
  <div class="stat-inline stat-inline-accent"><div class="label">Pending</div><div class="value" id="clr-stat-pending">—</div></div>
  <div class="stat-inline stat-inline-primary"><div class="label">Overall Rate</div><div class="value" id="clr-stat-rate">—</div></div>
</div>

<!-- Grid -->
<div id="clr-dept-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:16px; margin-top:20px;">
  <div class="loading" style="grid-column:1/-1; text-align:center; padding:40px;"><span class="spinner"></span> Loading…</div>
</div>

<style>
  .clr-dept-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; gap: 12px; }
  .clr-dept-card:hover { box-shadow: 0 12px 28px rgba(15,23,42,0.10); transform: translateY(-3px); border-color: rgba(6,95,70,0.3); }
  .clr-dept-card.critical { border-left: 4px solid #dc2626; }
  .clr-dept-card.warning  { border-left: 4px solid #f59e0b; }
  .clr-dept-card.healthy  { border-left: 4px solid #10b981; }
  .clr-dept-card.empty    { border-left: 4px solid #94a3b8; opacity: 0.7; }
  .clr-card-head { display: flex; justify-content: space-between; align-items: center; }
  .clr-code { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; background: #065f46; color: #fff; padding: 3px 9px; border-radius: 6px; }
  .clr-school { font-size: 11px; font-weight: 700; color: #64748b; }
  .clr-dept-card h3 { font-size: 14px; color: #0f172a; margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; line-height: 1.3; }
  .clr-rate { font-size: 32px; font-weight: 800; font-family: 'Poppins', sans-serif; line-height: 1; display: flex; align-items: baseline; gap: 6px; }
  .clr-rate-label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
  .clr-rate.critical { color: #dc2626; }
  .clr-rate.warning  { color: #f59e0b; }
  .clr-rate.healthy  { color: #10b981; }
  .clr-rate.empty    { color: #94a3b8; }
  .clr-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .clr-stat { background: #f8fafc; padding: 8px; border-radius: 8px; text-align: center; }
  .clr-stat .num { font-family: 'Poppins', sans-serif; font-size: 16px; font-weight: 800; line-height: 1; color: #0f172a; display: block; }
  .clr-stat .lbl { font-size: 9px; text-transform: uppercase; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; display: block; margin-top: 2px; }
  .clr-stat.cleared .num { color: #10b981; }
  .clr-stat.pending .num { color: #f59e0b; }
  .clr-stat.rejected .num { color: #dc2626; }
  .clr-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; padding-top: 8px; border-top: 1px dashed #e2e8f0; }
  .clr-footer .arrow { color: #065f46; font-weight: 700; font-size: 16px; }
</style>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadClearanceDepartments) {
    setTimeout(window.FPU_ADMIN.loadClearanceDepartments, 100);
  }
</script>
