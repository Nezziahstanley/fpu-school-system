<!-- ============================================================
     Admin → Complaints → View / Respond
     ------------------------------------------------------------
     Full complaint thread with:
       • Author info
       • Original message
       • Response (if any)
       • Response form (with status change + assignment)
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Complaint Detail</h2>
    <p class="muted small" id="cv-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('complaints')">← Back</button>
    <button class="btn btn-outline btn-sm" id="cv-assign">Assign</button>
    <button class="btn btn-ghost btn-sm" id="cv-close">Close</button>
  </div>
</section>

<div id="cv-root">
  <div class="loading"><span class="spinner"></span> Loading…</div>
</div>

<style>
  .cmp-view {
    max-width: 780px;
    margin: 0 auto;
  }
  .cmp-message {
    background: #fff;
    border-radius: 14px;
    padding: 24px 28px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.05);
    border-left: 5px solid #dc2626;
  }
  .cmp-message.response {
    border-left-color: #10b981;
    background: #f0fdf4;
  }
  .cmp-message-head {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .cmp-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, #065f46, #f59e0b);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
  }
  .cmp-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .cmp-avatar.staff {
    background: linear-gradient(135deg, #10b981, #34d399);
  }
  .cmp-message-meta { flex: 1; min-width: 0; }
  .cmp-message-meta .name {
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #0f172a;
  }
  .cmp-message-meta .detail {
    font-size: 12px;
    color: #6b7280;
    margin-top: 2px;
  }
  .cmp-message-body {
    font-size: 14.5px;
    line-height: 1.75;
    color: #1f2937;
    white-space: pre-wrap;
  }
  .cmp-message-subject {
    font-family: 'Poppins', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #065f46;
    margin: 0 0 12px;
  }
  .cmp-badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const root = $('cv-root');

    if (!id) {
      root.innerHTML = '<div class="alert alert-warning">No complaint selected.</div>';
      return;
    }

    // ---- Assign handler ----
    $('cv-assign').onclick = async () => {
      const res = await A.adminFetch('/api/admin/user-list?role=admin');
      const json = await res.json();
      const admins = json.data || [];
      const choice = prompt(
        'Assign to user ID:\n' + admins.slice(0, 10).map((u) => `${u.id} — ${u.firstName} ${u.lastName}`).join('\n')
      );
      if (!choice) return;
      try {
        await A.adminFetch(`/api/admin/complaints/${id}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'in_review', assignedTo: Number(choice) }),
        });
        A.showToast('✅ Assigned.');
        load();
      } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
    };

    // ---- Close handler ----
    $('cv-close').onclick = async () => {
      if (!confirm('Close this complaint?')) return;
      try {
        await A.adminFetch(`/api/admin/complaints/${id}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'closed' }),
        });
        A.showToast('✅ Closed.');
        load();
      } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
    };

    async function load() {
      root.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await A.adminFetch(`/api/admin/complaints/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const c = json.data;

        $('cv-subtitle').textContent = `${c.subject} · ${c.status}`;

        const author = c.user || c.complaint?.user || {};
        const authorName = `${author.firstName || ''} ${author.lastName || ''}`.trim() || 'User';
        const authorInitials = ((author.firstName || ' ')[0] + (author.lastName || ' ')[0]).toUpperCase().trim() || 'U';

        const statusClass =
          c.status === 'resolved' ? 'success' :
          c.status === 'closed' ? 'muted' :
          c.status === 'in_review' ? 'info' :
          'warning';

        root.innerHTML = `
          <div class="cmp-view">
            <!-- Original message -->
            <div class="cmp-message">
              <div class="cmp-message-head">
                <div class="cmp-avatar">${
                  author.photoUrl
                    ? `<img src="${A.escapeHtml(author.photoUrl)}" alt="" />`
                    : A.escapeHtml(authorInitials)
                }</div>
                <div class="cmp-message-meta">
                  <div class="name">${A.escapeHtml(authorName)}</div>
                  <div class="detail">${A.escapeHtml(author.email || '')} · ${A.fmtDateTime(c.createdAt)}</div>
                </div>
                <div class="cmp-badges">
                  <span class="badge badge-${statusClass}">${A.escapeHtml(c.status.replace('_', ' '))}</span>
                  ${c.category ? `<span class="tag-pill">${A.escapeHtml(c.category)}</span>` : ''}
                </div>
              </div>
              <h3 class="cmp-message-subject">${A.escapeHtml(c.subject)}</h3>
              <div class="cmp-message-body">${A.escapeHtml(c.body)}</div>
            </div>

            <!-- Response (if any) -->
            ${c.response ? `
              <div class="cmp-message response">
                <div class="cmp-message-head">
                  <div class="cmp-avatar staff">🛡️</div>
                  <div class="cmp-message-meta">
                    <div class="name">Staff Response</div>
                    <div class="detail">${c.respondedAt ? A.fmtDateTime(c.respondedAt) : ''}</div>
                  </div>
                </div>
                <div class="cmp-message-body">${A.escapeHtml(c.response)}</div>
              </div>
            ` : ''}

            <!-- Response form -->
            <div class="panel">
              <div class="panel-head">
                <h3>${c.response ? 'Follow-up Response' : 'Respond'}</h3>
              </div>
              <div class="panel-body">
                <form id="cv-response-form">
                  <div class="form-group">
                    <label class="form-label">Response <span class="req">*</span></label>
                    <textarea class="form-control" name="response" rows="4" required
                              placeholder="Type your response…"></textarea>
                  </div>
                  <div class="form-grid">
                    <div class="form-group">
                      <label class="form-label">Set status to</label>
                      <select class="form-select" name="status">
                        <option value="in_review" ${c.status === 'in_review' ? 'selected' : ''}>In Review</option>
                        <option value="resolved" ${c.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                        <option value="closed" ${c.status === 'closed' ? 'selected' : ''}>Closed</option>
                      </select>
                    </div>
                  </div>
                  <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Send Response</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        `;

        $('cv-response-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const payload = Object.fromEntries(fd);
          try {
            await A.adminFetch(`/api/admin/complaints/${id}/respond`, {
              method: 'POST',
              body: JSON.stringify(payload),
            });
            A.showToast('✅ Response sent.');
            load();
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        });
      } catch (err) {
        root.innerHTML = `<div class="alert alert-danger">${A.escapeHtml(err.message)}</div>`;
      }
    }

    load();
  })();
</script>
