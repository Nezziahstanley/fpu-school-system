<!-- ============================================================
     Admin → Complaints → View / Respond
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Complaint Detail</h2>
    <p class="muted small" id="cv-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('complaints')">← Back</button>
    <button class="btn btn-outline btn-sm" id="cv-assign">Assign</button>
    <button class="btn btn-ghost btn-sm" id="cv-close">Close</button>
  </div>
</section>

<div id="cv-root">
  <div class="loading" style="padding:40px;text-align:center;"><span class="spinner"></span> Loading…</div>
</div>

<style>
  .cmp-view { max-width: 780px; margin: 0 auto; }
  .cmp-message { background: #fff; border-radius: 14px; padding: 24px 28px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(15,23,42,0.05); border-left: 5px solid #dc2626; }
  .cmp-message.response { border-left-color: #10b981; background: #f0fdf4; }
  .cmp-message-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .cmp-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #065f46, #f59e0b); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 800; flex-shrink: 0; overflow: hidden; }
  .cmp-avatar.staff { background: linear-gradient(135deg, #10b981, #34d399); }
  .cmp-message-meta { flex: 1; min-width: 0; }
  .cmp-message-meta .name { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; color: #0f172a; }
  .cmp-message-meta .detail { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .cmp-message-body { font-size: 14.5px; line-height: 1.75; color: #1f2937; white-space: pre-wrap; }
  .cmp-message-subject { font-family: 'Poppins', sans-serif; font-size: 1.1rem; font-weight: 700; color: #065f46; margin: 0 0 12px; }
  .cmp-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; display:inline-block; }
  .badge-success { background: #dcfce7; color: #166534; }
  .badge-info { background: #e0f2fe; color: #075985; }
  .badge-warning { background: #fef3c7; color: #d97706; }
  .badge-danger { background: #fee2e2; color: #991b1b; }
</style>

<script>
  (async function () {
    const $ = (id) => document.getElementById(id);

    // 1. Get ID from URL Hash
    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const root = $('cv-root');

    if (!id || id === 'undefined') {
      root.innerHTML = '<div class="alert alert-warning" style="margin:20px;">No complaint selected. The ID is missing from the URL.</div>';
      return;
    }

    // 2. Assign handler
    $('cv-assign').onclick = async () => {
      try {
        const res = await adminFetch('/api/admin/user-list?role=admin');
        const json = await res.json();
        const admins = json.data || [];
        const choice = prompt(
          'Assign to user ID:\n' + admins.slice(0, 10).map((u) => `${u.id} — ${u.firstName} ${u.lastName}`).join('\n')
        );
        if (!choice) return;
        
        await adminFetch(`/api/admin/complaints/${id}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'in_review', assignedTo: Number(choice) }),
        });
        showToast('✅ Assigned.', 'success');
        loadComplaint();
      } catch (err) { showToast('❌ ' + err.message, 'error'); }
    };

    // 3. Close handler
    $('cv-close').onclick = async () => {
      if (!confirm('Close this complaint?')) return;
      try {
        await adminFetch(`/api/admin/complaints/${id}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'closed' }),
        });
        showToast('✅ Closed.', 'success');
        loadComplaint();
      } catch (err) { showToast('❌ ' + err.message, 'error'); }
    };

    // 4. Load Data
    async function loadComplaint() {
      root.innerHTML = '<div class="loading" style="padding:40px;text-align:center;"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await adminFetch(`/api/admin/complaints/${id}`);
        const json = await res.json();
        
        const c = json.data || json; 
        if (!c || !c.id) throw new Error('Complaint not found');

        // Exact database columns
        const subject = c.subject || 'No Subject';
        const message = c.body || c.message || '';
        const status = String(c.status || 'open').toLowerCase();
        const category = c.category || 'General';
        const dateStr = c.created_at || c.createdAt || Date.now();
        
        const u = c.user || c.student || c;
        const firstName = u.first_name || u.firstName || '';
        const lastName = u.last_name || u.lastName || '';
        const authorName = `${firstName} ${lastName}`.trim() || 'Unknown User';
        const authorInitials = authorName !== 'Unknown User' ? authorName.charAt(0).toUpperCase() : 'U';
        const authorEmail = u.email || '';

        $('cv-subtitle').textContent = `${subject} · ${status}`;

        let badgeCls = 'warning';
        if (status.includes('resolve')) badgeCls = 'success';
        if (status.includes('review')) badgeCls = 'info';
        if (status.includes('close')) badgeCls = 'danger';

        // Check for existing response
        const existingResponse = c.response ? `
          <div class="cmp-message response">
            <div class="cmp-message-head">
              <div class="cmp-avatar staff">🛡️</div>
              <div class="cmp-message-meta">
                <div class="name">Staff Response</div>
                <div class="detail">${fmtDateTime(c.responded_at || Date.now())}</div>
              </div>
            </div>
            <div class="cmp-message-body">${escapeHtml(c.response)}</div>
          </div>
        ` : '';

        root.innerHTML = `
          <div class="cmp-view">
            <!-- Original message -->
            <div class="cmp-message">
              <div class="cmp-message-head">
                <div class="cmp-avatar">${authorInitials}</div>
                <div class="cmp-message-meta">
                  <div class="name">${escapeHtml(authorName)}</div>
                  <div class="detail">${escapeHtml(authorEmail)} · ${fmtDateTime(dateStr)}</div>
                </div>
                <div class="cmp-badges">
                  <span class="badge badge-${badgeCls}">${status.replace('_', ' ').toUpperCase()}</span>
                  <span class="badge badge-info">${escapeHtml(category)}</span>
                </div>
              </div>
              <h3 class="cmp-message-subject">${escapeHtml(subject)}</h3>
              <div class="cmp-message-body">${escapeHtml(message)}</div>
            </div>

            ${existingResponse}

            <!-- Response form -->
            <div class="panel">
              <div class="panel-head"><h3>Respond to Complaint</h3></div>
              <div class="panel-body">
                <form id="cv-response-form">
                  <div class="form-group">
                    <label class="form-label">Response <span class="req">*</span></label>
                    <textarea class="form-control" name="response" rows="4" required placeholder="Type your response to the student..."></textarea>
                  </div>
                  <div class="form-grid">
                    <div class="form-group">
                      <label class="form-label">Set status to</label>
                      <select class="form-select" name="status">
                        <option value="in_review" ${status === 'in_review' ? 'selected' : ''}>In Review</option>
                        <option value="resolved" ${status === 'resolved' ? 'selected' : ''}>Resolved</option>
                        <option value="closed" ${status === 'closed' ? 'selected' : ''}>Closed</option>
                      </select>
                    </div>
                  </div>
                  <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Send Response</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        `;

        // 5. Handle Response Submit
        $('cv-response-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const payload = Object.fromEntries(fd);
          try {
            await adminFetch(`/api/admin/complaints/${id}/respond`, {
              method: 'POST',
              body: JSON.stringify(payload),
            });
            showToast('✅ Response sent.', 'success');
            loadComplaint(); 
          } catch (err) { showToast('❌ ' + err.message, 'error'); }
        });

      } catch (err) {
        root.innerHTML = `<div class="alert alert-danger" style="margin:20px;"><strong>Error:</strong> ${escapeHtml(err.message)}</div>`;
      }
    }

    loadComplaint();
  })();
</script>
