<section class="page-head">
  <div>
    <h2>Document Request</h2>
    <p class="muted small" id="dd-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('documents')">← Back</button>
    <button class="btn btn-outline btn-sm" id="dd-print">🖨 Print</button>
  </div>
</section>

<div id="dd-root">
  <div class="loading" style="padding:60px;text-align:center;">
    <span class="spinner"></span> Loading…
  </div>
</div>

<style>
  /* --- Existing Card Styles --- */
  .doc-detail { max-width: 720px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 32px 36px; box-shadow: 0 4px 20px rgba(15,23,42,0.06); border-top: 5px solid #065f46; }
  .doc-detail-head { display: flex; gap: 16px; align-items: flex-start; padding-bottom: 20px; border-bottom: 2px solid var(--fpu-border); margin-bottom: 20px; flex-wrap: wrap; }
  .doc-detail-icon { width: 64px; height: 64px; border-radius: 12px; background: linear-gradient(135deg,#065f46,#10b981); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
  .doc-detail-meta { flex: 1; min-width: 0; }
  .doc-detail-meta h2 { font-family: 'Poppins', sans-serif; font-size: 1.3rem; color: #0f172a; margin: 0 0 4px; line-height: 1.3; }
  .doc-detail-meta .sub { font-size: 13px; color: #6b7280; }
  .doc-detail-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .doc-detail-row { background: #f8fafc; border-radius: 8px; padding: 12px 14px; }
  .doc-detail-row .k { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #94a3b8; margin-bottom: 4px; }
  .doc-detail-row .v { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; color: #0f172a; word-break: break-word; }
  .doc-actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--fpu-border); }

  /* --- Document Preview Wrapper --- */
  .doc-preview-wrap { max-width: 840px; margin: 24px auto 0; }
  .doc-preview-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 16px; background: #065f46; color: #fff; border-radius: 12px 12px 0 0; font-size: 13px; font-weight: 600; }
  .doc-preview-outer { background: #e2e8f0; padding: 30px; border-radius: 0 0 12px 12px; display: flex; justify-content: center; overflow-x: auto; }
  
  /* --- The A4 Paper Look --- */
  .official-doc { 
    background: #fff; 
    width: 210mm; /* A4 Width */
    min-height: 297mm; /* A4 Height */
    padding: 25mm; /* Official margins */
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    position: relative; 
    box-sizing: border-box;
    font-family: 'Times New Roman', Times, serif; /* Official serif font */
    color: #000;
    overflow: hidden;
  }

  /* The Image Watermark - Now in Color */
  .official-watermark {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 0;
  }
  .official-watermark img {
    width: 65%;
    opacity: 0.12; /* Adjusted for color visibility */
  }
  
  /* Letterhead */
  .official-letterhead { display: flex; align-items: center; justify-content: center; gap: 20px; text-align: center; padding-bottom: 15px; border-bottom: 3px solid #065f46; margin-bottom: 40px; position: relative; z-index: 1; }
  .official-letterhead img { width: 90px; height: auto; }
  .official-letterhead .inst-name { font-size: 26px; font-weight: bold; color: #065f46; letter-spacing: 1px; font-family: 'Poppins', sans-serif; }
  .official-letterhead .inst-motto { font-size: 14px; color: #6b7280; font-style: italic; margin-top: 4px; }
  
  /* Body Content */
  .official-title { text-align: center; font-size: 20px; font-weight: bold; text-decoration: underline; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; position: relative; z-index: 1; }
  .official-body { line-height: 2; position: relative; z-index: 1; font-size: 16px; text-align: justify; }
  .official-body p { margin-bottom: 20px; }
  
  /* Signatures */
  .official-signatures { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; margin-top: 80px; position: relative; z-index: 1; }
  .official-sig-line { border-bottom: 1px solid #000; height: 30px; margin-bottom: 8px; }
  .official-sig-role { font-size: 14px; font-weight: bold; text-transform: uppercase; text-align: center; }

  /* --- Custom Modals --- */
  .fpu-modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.6); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.2s ease-out; }
  .fpu-modal { background: #fff; border-radius: 12px; width: 90%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); overflow: hidden; animation: slideUp 0.3s ease-out; }
  .fpu-modal-header { padding: 16px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
  .fpu-modal-header h3 { margin: 0; font-size: 1.1rem; color: #0f172a; }
  .fpu-modal-body { padding: 20px; color: #334155; font-size: 14px; }
  .fpu-modal-footer { padding: 16px 20px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 8px; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* --- Print Styles (Crucial Fixes) --- */
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    body * { visibility: hidden; }
    
    .doc-preview-outer { padding: 0; background: none; overflow: visible; }
    
    /* Target the paper to print exactly as it looks */
    .official-doc, .official-doc * { visibility: visible; }
    .official-doc { 
      position: absolute; 
      left: 0; 
      top: 0; 
      width: 210mm; 
      min-height: 297mm; 
      box-shadow: none; 
      border: none;
      margin: 0;
      padding: 25mm;
      /* Force browser to print background images and colors */
      -webkit-print-color-adjust: exact !important; 
      print-color-adjust: exact !important; 
    }
    
    /* Hide UI elements */
    .page-head, .doc-detail, .doc-preview-toolbar, .fpu-modal-backdrop { display: none !important; }
  }
</style>
