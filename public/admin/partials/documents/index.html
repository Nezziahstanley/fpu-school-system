<!-- ============================================================
     Admin → Documents
     ------------------------------------------------------------
     Status tabs + type filter + search.
     Cards show request title, type, student, status.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Documents</h2>
    <p class="muted small">Issue transcripts, certificates, ID letters, and attestations</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadDocumentsTable()">
      Refresh
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('document-new')">
      + New Request
    </button>
  </div>
</section>

<!-- Status tabs -->
<div class="staff-role-tabs" id="doc-status-tabs">
  <button class="staff-role-tab active" data-status="">
    All <span class="tab-count" id="doc-count-all">—</span>
  </button>
  <button class="staff-role-tab" data-status="pending">
    Pending <span class="tab-count" id="doc-count-pending">—</span>
  </button>
  <button class="staff-role-tab" data-status="approved">
    Approved <span class="tab-count" id="doc-count-approved">—</span>
  </button>
  <button class="staff-role-tab" data-status="issued">
    Issued <span class="tab-count" id="doc-count-issued">—</span>
  </button>
  <button class="staff-role-tab" data-status="rejected">
    Rejected <span class="tab-count" id="doc-count-rejected">—</span>
  </button>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Type</label>
    <select class="form-select" id="doc-filter-type"
            onchange="FPU_ADMIN.loadDocumentsTable()">
      <option value="">All types</option>
      <option value="transcript">Transcript</option>
      <option value="certificate">Certificate</option>
      <option value="attestation">Attestation Letter</option>
      <option value="id-letter">ID Letter</option>
      <option value="other">Other</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 260px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="doc-search"
           placeholder="Student name, matric, or document title…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadDocumentsTable()" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total</div>
    <div class="value" id="doc-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Pending</div>
    <div class="value" id="doc-stat-pending">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Issued</div>
    <div class="value" id="doc-stat-issued">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">This Month</div>
    <div class="value" id="doc-stat-month">—</div>
  </div>
</div>

<!-- Documents list -->
<div id="doc-list" class="doc-list">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading documents…
  </div>
</div>

<style>
  .doc-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .doc-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .doc-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
    border-radius: 14px 0 0 14px;
  }
  .doc-card.pending::before  { background: #f59e0b; }
  .doc-card.approved::before { background: #3b82f6; }
  .doc-card.issued::before   { background: #10b981; }
  .doc-card.rejected::before { background: #dc2626; }
  .doc-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.25);
  }
  .dc-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .dc-type {
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 6px;
    background: #ecfdf5;
    color: #065f46;
  }
  .dc-status {
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .dc-status.pending  { background: #fef3c7; color: #92400e; }
  .dc-status.approved { background: #dbeafe; color: #1e40af; }
  .dc-status.issued   { background: #dcfce7; color: #15803d; }
  .dc-status.rejected { background: #fee2e2; color: #991b1b; }

  .doc-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }
  .dc-student {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: #f8fafc;
    border-radius: 8px;
  }
  .dc-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #065f46, #f59e0b);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
  }
  .dc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .dc-student-info { flex: 1; min-width: 0; }
  .dc-student-info strong {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    color: #0f172a;
    line-height: 1.3;
  }
  .dc-student-info span {
    font-size: 11.5px;
    color: #6b7280;
  }
  .dc-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 11.5px;
    color: #94a3b8;
    font-weight: 600;
  }
  .dc-footer .arrow { color: #f59e0b; font-family: 'Poppins', sans-serif; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadDocumentsTable()
</script>
