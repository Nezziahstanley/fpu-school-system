<!-- Admin → Exams → Form -->
<section class="page-head">
  <div>
    <h2 id="exf-title">New Exam Schedule</h2>
    <p class="muted small" id="exf-subtitle">Add an exam to the timetable</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" id="exf-back">← Back</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Exam Details</h3></div>
  <div class="panel-body">
    <form id="exam-form" data-skip-generic="1">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Session <span class="req">*</span></label>
          <select class="form-select" name="sessionId" id="exf-session" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Semester <span class="req">*</span></label>
          <select class="form-select" name="semester" id="exf-semester" required>
            <option value="first">First Semester</option>
            <option value="second">Second Semester</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">School <span class="req">*</span></label>
          <select class="form-select" id="exf-school" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Department <span class="req">*</span></label>
          <select class="form-select" id="exf-dept" required></select>
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label class="form-label">Course <span class="req">*</span></label>
          <select class="form-select" name="courseId" id="exf-course" required></select>
        </div>

        <div class="form-group">
          <label class="form-label">Exam Date <span class="req">*</span></label>
          <input class="form-control" type="date" name="examDate" id="exf-date" required />
        </div>
        <div class="form-group">
          <label class="form-label">Start Time <span class="req">*</span></label>
          <input class="form-control" type="time" name="startTime" id="exf-start" required />
        </div>
        <div class="form-group">
          <label class="form-label">End Time <span class="req">*</span></label>
          <input class="form-control" type="time" name="endTime" id="exf-end" required />
        </div>

        <!-- NEW: Venue and Invigilators Dropdowns -->
        <div class="form-group">
          <label class="form-label">Venue <span class="req">*</span></label>
          <select class="form-select" name="venue" id="exf-venue" required>
            <option value="">Select Venue...</option>
            <option value="COMP HALL 1">COMP HALL 1</option>
            <option value="COMP HALL 2">COMP HALL 2</option>
            <option value="MAIN AUDITORIUM">MAIN AUDITORIUM</option>
            <option value="LAB A">LAB A</option>
            <option value="LAB B">LAB B</option>
            <option value="TBA">To Be Announced</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Invigilators <span class="req">*</span></label>
          <select class="form-select" name="invigilators" id="exf-inv" required>
            <option value="">Select Invigilator...</option>
            <option value="Dr. Ubi, S. I.">Dr. Ubi, S. I.</option>
            <option value="Ojo, E. A.">Ojo, E. A.</option>
            <option value="Martin Arikpo">Martin Arikpo</option>
            <option value="Patrick Ebri">Patrick Ebri</option>
            <option value="TBA">To Be Announced</option>
          </select>
        </div>
      </div>

      <div id="exf-validation"></div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="exf-submit">Create Exam</button>
        <button type="button" class="btn btn-ghost" id="exf-cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="exf-delete" style="margin-left:auto;display:none;">Delete Exam</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);
    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const prefillDept = params.get('departmentId');
    const isEdit = !!id;

    if (isEdit) {
      $('exf-title').textContent = 'Edit Exam Schedule';
      $('exf-submit').textContent = 'Save Changes';
      $('exf-delete').style.display = 'inline-flex';
    }

    // 1. Load Sessions, Schools
    async function loadDropdowns() {
      try {
        const [sessRes, schoolRes, deptRes, courseRes] = await Promise.all([
          A.adminFetch('/api/admin/sessions'), A.adminFetch('/api/admin/schools'),
          A.adminFetch('/api/admin/departments'), A.adminFetch('/api/admin/courses?limit=5000')
        ]);
        const sessions = (await sessRes.json()).data || [];
        const schools = (await schoolRes.json()).data || [];
        const depts = (await deptRes.json()).data || [];
        const courses = (await courseRes.json()).data || [];

        $('exf-session').innerHTML = '<option value="">Select...</option>' + sessions.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
        $('exf-school').innerHTML = '<option value="">Select...</option>' + schools.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

        // 2. Handle cascading Dropdowns
        $('exf-school').onchange = () => {
          const sid = Number($('exf-school').value);
          const filteredDepts = depts.filter(d => Number(d.schoolId) === sid);
          $('exf-dept').innerHTML = '<option value="">Select...</option>' + filteredDepts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
          $('exf-course').innerHTML = '<option value="">Select Department first...</option>';
        };

        $('exf-dept').onchange = () => {
          const did = Number($('exf-dept').value);
          const filteredCourses = courses.filter(c => Number(c.departmentId) === did);
          $('exf-course').innerHTML = '<option value="">Select Course...</option>' + filteredCourses.map(c => `<option value="${c.id}">${c.code} - ${c.title}</option>`).join('');
        };

        // 3. Pre-fill if editing or coming from TBA
        if (isEdit) {
          const res = await A.adminFetch(`/api/admin/exams/${id}`);
          const json = await res.json();
          if (json.success) {
            const ex = json.data;
            $('exf-session').value = ex.sessionId;
            $('exf-semester').value = ex.semester;
            $('exf-date').value = ex.examDate;
            $('exf-start').value = ex.startTime;
            $('exf-end').value = ex.endTime;
            $('exf-venue').value = ex.venue || '';
            $('exf-inv').value = ex.invigilators || '';
            
            // Find and set School -> Dept -> Course
            const course = courses.find(c => c.id === ex.courseId);
            if (course) {
              const dept = depts.find(d => d.id === course.departmentId);
              if (dept) {
                $('exf-school').value = dept.schoolId;
                $('exf-school').dispatchEvent(new Event('change'));
                setTimeout(() => {
                  $('exf-dept').value = dept.id;
                  $('exf-dept').dispatchEvent(new Event('change'));
                  setTimeout(() => { $('exf-course').value = ex.courseId; }, 100);
                }, 100);
              }
            }
          }
        } else if (prefillDept) {
          const dept = depts.find(d => d.id === Number(prefillDept));
          if (dept) {
            $('exf-school').value = dept.schoolId;
            $('exf-school').dispatchEvent(new Event('change'));
            setTimeout(() => {
              $('exf-dept').value = dept.id;
              $('exf-dept').dispatchEvent(new Event('change'));
            }, 100);
          }
        }
      } catch (err) { console.error(err); }
    }

    // 4. Handle Form Submit
    $('exam-form').onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        sessionId: Number($('exf-session').value),
        semester: $('exf-semester').value,
        courseId: Number($('exf-course').value),
        examDate: $('exf-date').value,
        startTime: $('exf-start').value,
        endTime: $('exf-end').value,
        venue: $('exf-venue').value,
        invigilators: $('exf-inv').value,
      };

      const btn = $('exf-submit');
      btn.disabled = true; btn.textContent = 'Saving...';

      try {
        const url = isEdit ? `/api/admin/exams/${id}` : '/api/admin/exams';
        const method = isEdit ? 'PUT' : 'POST';
        const res = await A.adminFetch(url, { method, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error('Failed to save exam');
        A.showToast('✅ Exam saved successfully.', 'success');
        history.back(); // Go back
      } catch (err) {
        A.showToast('❌ ' + err.message, 'error');
        btn.disabled = false; btn.textContent = 'Save Changes';
      }
    };

    // 5. Handle Cancel / Back / Delete
    $('exf-cancel').onclick = () => history.back();
    $('exf-back').onclick = () => history.back();
    $('exf-delete').onclick = async () => {
      if (!confirm('Delete this exam?')) return;
      try {
        await A.adminFetch(`/api/admin/exams/${id}`, { method: 'DELETE' });
        A.showToast('🗑️ Exam deleted.', 'success');
        history.back();
      } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
    };

    loadDropdowns();
  })();
</script>
