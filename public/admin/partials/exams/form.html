<!-- ============================================================
     Admin → Exams → Form (Create / Edit)
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="exf-title">New Exam Schedule</h2>
    <p class="muted small" id="exf-subtitle">Add an exam to the timetable</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" id="exf-back" onclick="FPU_ADMIN.goBack('exams')">← Back</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Exam Details</h3></div>
  <div class="panel-body">
    <form id="exam-form" data-skip-generic="1">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Session <span class="req">*</span></label>
          <select class="form-select" name="sessionId" id="exf-session"
                  data-lookup="sessions" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Semester <span class="req">*</span></label>
          <select class="form-select" name="semester" id="exf-semester" required>
            <option value="first">First Semester</option>
            <option value="second">Second Semester</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">School</label>
          <select class="form-select" id="exf-school"
                  data-lookup="schools" data-placeholder="Select school…"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Department</label>
          <select class="form-select" id="exf-dept"
                  data-lookup="departments"
                  data-depends-on="exf-school"
                  data-param="schoolId"
                  data-placeholder="Select school first…">
            <option value="">Select school first…</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Course <span class="req">*</span></label>
          <select class="form-select" name="courseId" id="exf-course"
                  data-lookup="courses"
                  data-depends-on="exf-dept"
                  data-param="departmentId"
                  data-placeholder="Select department first…"
                  required>
            <option value="">Select department first…</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Exam Date <span class="req">*</span></label>
          <input class="form-control" type="date" name="examDate" id="exf-date" required />
        </div>
        <div class="form-group">
          <label class="form-label">Start Time <span class="req">*</span></label>
          <input class="form-control" type="time" name="startTime" id="exf-start" required />
        </div>
        <div class="form-group">
          <label class="form-label">End Time <span class="req">*</span></label>
          <input class="form-control" type="time" name="endTime" id="exf-end" required />
        </div>

        <div class="form-group">
          <label class="form-label">Venue</label>
          <input class="form-control" name="venue" id="exf-venue"
                 placeholder="e.g. COMP HALL 1" />
        </div>
        <div class="form-group" style="grid-column:span 2;">
          <label class="form-label">Invigilators</label>
          <input class="form-control" name="invigilators" id="exf-inv"
                 placeholder="e.g. Dr. Ubi, S. I.; Ojo, E. A." />
          <div class="form-help">Comma or semicolon separated</div>
        </div>
      </div>

      <div id="exf-validation"></div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="exf-submit">Create Exam</button>
        <button type="button" class="btn btn-ghost" id="exf-cancel" onclick="FPU_ADMIN.goBack('exams')">Cancel</button>
        <button type="button" class="btn btn-danger" id="exf-delete"
                style="margin-left:auto;display:none;">Delete Exam</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const prefillDept = params.get('departmentId');
    const prefillSession = params.get('sessionId');
    const prefillSemester = params.get('semester');
    const prefillDate = params.get('date');
    const prefillPeriodStart = params.get('startTime');
    const prefillPeriodEnd = params.get('endTime');
    const isEdit = !!id;

    if (isEdit) {
      $('exf-title').textContent = 'Edit Exam Schedule';
      $('exf-subtitle').textContent = 'Update this exam';
      $('exf-submit').textContent = 'Save Changes';
      $('exf-delete').style.display = 'inline-flex';
    }

    function goBack() {
      const sessId = $('exf-session').value || prefillSession;
      const sem = $('exf-semester').value || prefillSemester || 'first';
      const schoolId = $('exf-school').value;
      A.FPU_ADMIN_SPA.navigateToWithQuery('exam-sheet', {
        schoolId: schoolId || '',
        sessionId: sessId || '',
        semester: sem,
        name: params.get('name') || 'School',
      });
    }
    $('exf-back').addEventListener('click', goBack);
    $('exf-cancel').addEventListener('click', goBack);

    async function loadExisting() {
      if (!isEdit) return;
      try {
        const res = await A.adminFetch(`/api/admin/exams/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const ex = json.data;

        $('exf-semester').value = ex.semester || 'first';
        $('exf-date').value = ex.examDate ? String(ex.examDate).slice(0, 10) : '';
        $('exf-start').value = ex.startTime || '';
        $('exf-end').value = ex.endTime || '';
        $('exf-venue').value = ex.venue || '';
        $('exf-inv').value = ex.invigilators || '';

        setTimeout(() => {
          if ($('exf-session') && ex.sessionId) $('exf-session').value = String(ex.sessionId);
        }, 400);

        if (ex.courseId) {
          try {
            const cRes = await A.adminFetch(`/api/admin/courses/${ex.courseId}`);
            const cJson = await cRes.json();
            if (cJson.success && cJson.data?.departmentId) {
              setTimeout(() => {
                $('exf-dept').value = String(cJson.data.departmentId);
                $('exf-dept').dispatchEvent(new Event('change'));
              }, 700);
              setTimeout(() => {
                if ($('exf-course')) $('exf-course').value = String(ex.courseId);
              }, 1100);
            }
          } catch { /* silent */ }
        }
      } catch (err) {
        A.showToast('❌ ' + err.message, 'error');
      }
    }

    function applyPrefill() {
      if (isEdit) return;
      if (prefillSemester) $('exf-semester').value = prefillSemester;
      if (prefillDate) $('exf-date').value = prefillDate;
      if (prefillPeriodStart) $('exf-start').value = prefillPeriodStart;
      if (prefillPeriodEnd) $('exf-end').value = prefillPeriodEnd;

      setTimeout(() => {
        if (prefillSession && $('exf-session')) $('exf-session').value = String(prefillSession);
      }, 300);

      setTimeout(() => {
        if (prefillDept && $('exf-dept')) {
          $('exf-dept').value = String(prefillDept);
          $('exf-dept').dispatchEvent(new Event('change'));
        }
      }, 600);
    }

    $('exam-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const valEl = $('exf-validation');
      valEl.innerHTML = '';

      const payload = {
        sessionId: Number($('exf-session').value),
        semester: $('exf-semester').value,
        courseId: Number($('exf-course').value),
        examDate: $('exf-date').value,
        startTime: $('exf-start').value,
        endTime: $('exf-end').value,
        venue: String($('exf-venue').value || '').trim() || null,
        invigilators: String($('exf-inv').value || '').trim() || null,
      };

      if (!payload.sessionId) { valEl.innerHTML = '<div class="alert alert-error">⚠️ Session is required.</div>'; return; }
      if (!payload.courseId) { valEl.innerHTML = '<div class="alert alert-error">⚠️ Course is required.</div>'; return; }
      if (!payload.examDate) { valEl.innerHTML = '<div class="alert alert-error">⚠️ Exam date is required.</div>'; return; }
      if (!payload.startTime || !payload.endTime) { valEl.innerHTML = '<div class="alert alert-error">⚠️ Start and end times are required.</div>'; return; }

      const btn = $('exf-submit');
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = isEdit ? 'Saving…' : 'Creating…';

      try {
        const url = isEdit ? `/api/admin/exams/${id}` : '/api/admin/exams';
        const method = isEdit ? 'PUT' : 'POST';
        const res = await A.adminFetch(url, { method, body: JSON.stringify(payload) });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        A.showToast(isEdit ? '✅ Exam updated.' : '✅ Exam created.');
        goBack();
      } catch (err) {
        valEl.innerHTML = `<div class="alert alert-error">❌ ${A.escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    });

    $('exf-delete').addEventListener('click', async () => {
      if (!isEdit) return;
      if (!confirm('Delete this exam schedule?')) return;
      try {
        const res = await A.adminFetch(`/api/admin/exams/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        A.showToast('🗑️ Exam deleted.');
        goBack();
      } catch (err) {
        A.showToast('❌ ' + err.message, 'error');
      }
    });

    loadExisting();
    applyPrefill();
  })();
</script>
