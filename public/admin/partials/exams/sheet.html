<!-- ============================================================
     Admin → Exams → Faculty Exam Sheet (A3 Landscape)
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2 id="exsheet-title">Exam Timetable</h2>
    <p class="muted small" id="exsheet-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#exams'">
      ← All Schools
    </button>
    <button class="btn btn-outline btn-sm" id="exsheet-export">
      Export CSV
    </button>
    <button class="btn btn-primary btn-sm" id="exsheet-print">
      🖨 Print A3
    </button>
    <button class="btn btn-accent btn-sm" id="exsheet-add">
      + Add Exam
    </button>
  </div>
</section>

<!-- Main Container -->
<div id="exsheet-root" style="overflow-x: auto; padding-bottom: 40px; background: #525659; padding: 20px;">
  <div style="text-align:center;padding:40px;color:#e2e8f0;"><span class="spinner"></span> Loading exam schedule…</div>
</div>

<style>
  /* ============================================================
     A3 LANDSCAPE SHEET SETUP
     ============================================================ */
  .ex-sheet {
    width: 420mm; /* A3 Landscape Width */
    min-height: 297mm;
    margin: 0 auto;
    padding: 12mm;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-family: 'Times New Roman', Times, serif;
    color: #000;
    position: relative;
    z-index: 1;
  }

  /* Faint Watermark Logo */
  .ex-sheet::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 250mm;
    height: 250mm;
    background-image: url('/images/logo.png');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.04; /* Faint background logo */
    z-index: -1;
    pointer-events: none;
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .ex-head {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    margin-bottom: 20px;
    border-bottom: 2px solid #000;
    padding-bottom: 10px;
  }
  .ex-logo {
    width: 85px;
    height: 85px;
    object-fit: contain;
  }
  .ex-head-text {
    text-align: left;
  }
  .ex-head-text .institution {
    font-size: 18pt;
    font-weight: 700;
    color: #1a5e20;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .ex-head-text .faculty {
    font-size: 13pt;
    font-weight: 700;
    color: #1a5e20;
    text-transform: uppercase;
    margin-top: 2px;
  }
  .ex-head-text .title-line {
    font-size: 12pt;
    font-weight: 700;
    color: #000;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* ============================================================
     TABLE STYLING
     ============================================================ */
  .ex-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10pt;
    line-height: 1.25;
  }
  
  .ex-table th, .ex-table td {
    border: 1px solid #000;
    padding: 6px 8px;
    vertical-align: middle;
  }
  
  .ex-table th {
    font-weight: 700;
    text-align: center;
    background: #f8fafc;
    text-transform: uppercase;
    font-size: 10.5pt;
  }

  /* Column Widths */
  .col-days { width: 6%; text-align: center; font-weight: 700; text-transform: uppercase; }
  .col-date { width: 12%; text-align: center; font-weight: 700; }
  .col-code { width: 10%; text-align: center; font-weight: 700; text-transform: uppercase; }
  .col-cu { width: 4%; text-align: center; font-weight: 700; }
  .col-title { width: 28%; text-align: left; }
  .col-time { width: 12%; text-align: center; }
  .col-lecturer { width: 18%; text-align: center; font-size: 9pt; }
  .col-venue { width: 10%; text-align: center; font-weight: 700; }

  /* Footer Signatures */
  .ex-footer {
    margin-top: 30px;
    font-size: 12pt;
    font-weight: 700;
    line-height: 1.5;
  }

  /* ============================================================
     PRINT SETTINGS
     ============================================================ */
  @media print {
    .no-print, .sidebar, .topbar, .toast-wrap { display: none !important; }
    .main { margin: 0 !important; padding: 0 !important; }
    body { background: #fff !important; }

    /* Force A3 Landscape */
    @page { size: A3 landscape; margin: 0; }

    .ex-sheet {
      box-shadow: none;
      margin: 0;
      width: 100%;
      height: 100%;
      padding: 10mm;
    }
    #exsheet-root {
      background: #fff !important;
      padding: 0 !important;
      overflow: visible !important;
    }
  }
</style>

<script>
  // Initialize the page when loaded
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadExamSheet) {
    setTimeout(window.FPU_ADMIN.loadExamSheet, 100);
  }
</script>
