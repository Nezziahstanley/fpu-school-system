<!-- ============================================================
     Admin → Exams → Faculty Exam Sheet (A3 Landscape)
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2 id="exsheet-title">Exam Timetable</h2>
    <p class="muted small" id="exsheet-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#exams'">
      ← All Schools
    </button>
    <button class="btn btn-outline btn-sm" id="exsheet-export">
      Export CSV
    </button>
    <button class="btn btn-primary btn-sm" id="exsheet-print">
      🖨 Print A3
    </button>
    <button class="btn btn-accent btn-sm" id="exsheet-add">
      + Add Exam
    </button>
    <button class="btn btn-secondary btn-sm" id="exsheet-edit" style="display:none;">
      ✏️ Edit Selected
    </button>
  </div>
</section>

<!-- Main Container -->
<div id="exsheet-root" style="overflow-x: auto; padding-bottom: 40px; background: #525659; padding: 20px; min-height: 100vh;">
  <div style="text-align:center;padding:40px;color:#e2e8f0;">
    <span class="spinner"></span> Loading exam schedule…
  </div>
</div>

<!-- CRITICAL FIX: All CSS is now inline in the HTML so it cannot be blocked -->
<style>
  .ex-sheet {
    background: #fff;
    padding: 30px;
    font-family: 'Times New Roman', Times, serif;
    color: #000;
    max-width: 1200px;
    margin: 0 auto;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }
  
  .dept-exam-section {
    margin-bottom: 50px;
    page-break-after: always;
  }
  .dept-exam-section:last-child { page-break-after: auto; }

  .dept-header { text-align: center; margin-bottom: 20px; }
  .dept-header .institution { font-size: 16px; font-weight: bold; }
  .dept-header .faculty { font-size: 14px; font-weight: bold; text-transform: uppercase; }
  .dept-header .department { font-size: 16px; font-weight: bold; text-transform: uppercase; margin: 4px 0; }
  .dept-header .title-line { font-size: 12px; font-weight: bold; }

  .ex-table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .ex-table th, .ex-table td { border: 1px solid #000; padding: 4px 6px; text-align: left; vertical-align: top; }
  .ex-table th { text-align: center; text-transform: uppercase; }
  .ex-table .col-date { text-align: center; vertical-align: middle; }
  .ex-table .col-venue { text-align: center; }

  .dept-footer { display: flex; justify-content: space-between; margin-top: 30px; padding: 0 20px; }
  .dept-footer .sig-text { font-size: 12px; font-family: 'Brush Script MT', cursive; }
  .dept-footer .sig-role { font-size: 12px; font-weight: bold; }

  @media print {
    @page { size: landscape; margin: 10mm; }
    body * { visibility: hidden; }
    .ex-sheet, .ex-sheet * { visibility: visible; }
    .ex-sheet { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none; padding: 0; }
    .ex-table th, .ex-table td { border: 1px solid #000 !important; }
    .dept-exam-section { page-break-after: always; }
  }
</style>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadExamSheet) {
    setTimeout(window.FPU_ADMIN.loadExamSheet, 100);
  }
</script>
