<!-- ============================================================
     Admin → Exams → Faculty Exam Sheet (A3 Landscape)
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2 id="exsheet-title">Exam Timetable</h2>
    <p class="muted small" id="exsheet-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#exams'">
      ← All Schools
    </button>
    <button class="btn btn-outline btn-sm" id="exsheet-draft-toggle">
      Mark FINAL
    </button>
    <button class="btn btn-outline btn-sm" id="exsheet-export">
      Export CSV
    </button>
    <button class="btn btn-primary btn-sm" id="exsheet-print">
      🖨 Print A3
    </button>
    <button class="btn btn-accent btn-sm" id="exsheet-add">
      + Add Exam
    </button>
  </div>
</section>

<!-- Main Container -->
<div id="exsheet-root" style="overflow-x: auto; padding-bottom: 40px;">
  <div style="text-align:center;padding:40px;color:#94a3b8;"><span class="spinner"></span> Loading exam schedule…</div>
</div>

<style>
  /* A3 Landscape Sheet */
  .ex-sheet {
    width: 420mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 10mm;
    background: #fff;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', Arial, sans-serif;
    color: #000;
  }

  /* Header */
  .ex-head {
    text-align: center;
    margin-bottom: 8mm;
  }
  .ex-head-text .institution {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 16pt;
    font-weight: 800;
    text-transform: uppercase;
  }
  .ex-head-text .faculty {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 14pt;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 2mm;
  }
  .ex-head-text .title-line {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 12pt;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 4mm;
  }
  .ex-head-text .level-line {
    font-size: 11pt;
    font-weight: 600;
    margin-top: 2mm;
  }

  /* Table */
  .ex-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 9pt;
    line-height: 1.3;
  }
  .ex-table th {
    border: 2px solid #000;
    background: #f8fafc;
    padding: 4mm 2mm;
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 9.5pt;
    font-weight: 800;
    text-align: center;
    text-transform: uppercase;
  }
  .ex-table td {
    border: 1px solid #000;
    padding: 2mm;
    vertical-align: top;
  }

  /* Column Widths */
  .ex-table .col-days { width: 20mm; text-align: center; font-weight: 700; font-size: 10pt; }
  .ex-table .col-date { width: 30mm; text-align: center; font-weight: 600; font-size: 9pt; }
  .ex-table .col-period { width: 33%; }

  /* Cell Content */
  .ex-cell-block {
    margin-bottom: 2mm;
    padding-bottom: 1.5mm;
    border-bottom: 1px dashed #cbd5e1;
  }
  .ex-cell-block:last-child {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
  }
  .ex-cell-course {
    font-weight: 800;
    font-size: 9.5pt;
  }
  .ex-cell-title {
    font-size: 8.5pt;
    font-weight: 500;
    color: #333;
  }
  .ex-cell-venue {
    font-size: 8.5pt;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 1mm;
  }
  .ex-cell-inv {
    font-size: 8pt;
    font-style: italic;
    color: #555;
    margin-top: 0.5mm;
  }
  .ex-cell-empty {
    background: #fafafa;
  }

  /* Print Settings */
  @media print {
    .no-print, .sidebar, .topbar, .toast-wrap { display: none !important; }
    .main { margin: 0 !important; padding: 0 !important; }
    body { background: #fff !important; }

    /* Force A3 Landscape */
    @page { size: A3 landscape; margin: 0; }

    .ex-sheet {
      box-shadow: none;
      margin: 0;
      width: 100%;
      height: 100%;
      page-break-after: always;
    }
    #exsheet-root {
      overflow: visible !important;
    }
  }
</style>

<script>
  // Initialize the page when loaded
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadExamSheet) {
    setTimeout(window.FPU_ADMIN.loadExamSheet, 100);
  }
</script>
