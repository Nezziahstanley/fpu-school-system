<!-- ============================================================
     Admin → Exams → Faculty Exam Sheet (A3 Landscape)
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2 id="exsheet-title">Exam Timetable</h2>
    <p class="muted small" id="exsheet-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#exams'">
      ← All Schools
    </button>
    <button class="btn btn-outline btn-sm" id="exsheet-draft-toggle">
      Mark FINAL
    </button>
    <button class="btn btn-outline btn-sm" id="exsheet-export">
      Export CSV
    </button>
    <button class="btn btn-primary btn-sm" id="exsheet-print">
      🖨 Print A3
    </button>
    <button class="btn btn-accent btn-sm" id="exsheet-add">
      + Add Exam
    </button>
  </div>
</section>

<!-- Main Container -->
<div id="exsheet-root" style="overflow-x: auto; padding-bottom: 40px; background: #525659; padding: 20px;">
  <div style="text-align:center;padding:40px;color:#e2e8f0;"><span class="spinner"></span> Loading exam schedule…</div>
</div>

<style>
  /* A3 Landscape Sheet */
  .ex-sheet {
    width: 420mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 10mm;
    background: #fff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-family: Arial, sans-serif;
    color: #000;
  }

  /* Header */
  .ex-head {
    text-align: center;
    margin-bottom: 5mm;
  }
  .ex-head-text .institution {
    font-size: 14pt;
    font-weight: 700;
    text-transform: uppercase;
  }
  .ex-head-text .title-line {
    font-size: 14pt;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 2mm;
  }

  /* Table */
  .ex-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 8.5pt;
    line-height: 1.2;
  }
  
  /* Header styling from screenshot */
  .ex-table th {
    border: 1px solid #555;
    background: #d9d9d9; /* Gray header */
    padding: 2mm 1mm;
    font-weight: 700;
    text-align: left;
    vertical-align: middle;
    font-size: 8pt;
  }
  
  .ex-table td {
    border: 1px solid #555;
    padding: 1.5mm;
    vertical-align: top;
  }

  /* Column Widths */
  .ex-table .col-day { width: 8mm; text-align: center; font-weight: 700; vertical-align: middle; }
  .ex-table .col-date { width: 45mm; font-weight: 700; text-align: left; vertical-align: middle; }
  .ex-table .col-time { width: 8mm; font-weight: 700; text-align: center; vertical-align: middle; }
  .ex-table .col-courses { width: auto; }

  /* Course List inside cells */
  .course-list {
    display: flex;
    flex-direction: column;
    gap: 1.5mm;
  }
  .course-item {
    display: flex;
    gap: 4mm;
    align-items: baseline;
  }
  .course-code {
    font-weight: 700;
    width: 25mm; /* Align titles nicely */
    flex-shrink: 0;
  }
  .course-title {
    font-weight: 400;
  }

  /* Print Settings */
  @media print {
    .no-print, .sidebar, .topbar, .toast-wrap { display: none !important; }
    .main { margin: 0 !important; padding: 0 !important; }
    body { background: #fff !important; }

    /* Force A3 Landscape */
    @page { size: A3 landscape; margin: 0; }

    .ex-sheet {
      box-shadow: none;
      margin: 0;
      width: 100%;
      height: 100%;
      padding: 5mm;
    }
    #exsheet-root {
      background: #fff !important;
      padding: 0 !important;
      overflow: visible !important;
    }
  }
</style>

<script>
  // Initialize the page when loaded
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadExamSheet) {
    setTimeout(window.FPU_ADMIN.loadExamSheet, 100);
  }
</script>
