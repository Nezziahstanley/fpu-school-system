<!-- ============================================================
     Admin → Fees → By Department
     ------------------------------------------------------------
     Every fee structure for one department in the selected
     session. Cards per programme × level.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="fd-title">Department Fees</h2>
    <p class="muted small" id="fd-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('fees')">← All Departments</button>
    <button class="btn btn-primary btn-sm" id="fd-new">
      + New Fee Structure
    </button>
  </div>
</section>

<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Structures</div>
    <div class="value" id="fd-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Lowest Total</div>
    <div class="value" id="fd-stat-min">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Highest Total</div>
    <div class="value" id="fd-stat-max">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Average</div>
    <div class="value" id="fd-stat-avg">—</div>
  </div>
</div>

<div class="filters">
  <div class="form-group">
    <label class="form-label">Level</label>
    <select class="form-select" id="fd-filter-level" onchange="FPU_ADMIN.loadDepartmentFees()">
      <option value="">All</option>
      <option>ND</option>
      <option>HND</option>
      <option>CERT</option>
    </select>
  </div>
</div>

<div id="fd-grid" class="fees-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading fee structures…
  </div>
</div>

<style>
  .fees-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .fee-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .fee-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #065f46, #f59e0b);
  }
  .fee-card.inactive::before {
    background: linear-gradient(90deg, #cbd5e1, #e2e8f0);
  }
  .fee-card.inactive { opacity: 0.7; }
  .fee-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .fc-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .fc-code {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .fc-level {
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .fc-level.nd  { background: #dbeafe; color: #1e40af; }
  .fc-level.hnd { background: #fef3c7; color: #92400e; }
  .fc-level.cert{ background: #dcfce7; color: #15803d; }
  .fee-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.3;
  }
  .fc-total {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .fc-total .num {
    font-family: 'Poppins', sans-serif;
    font-size: 1.9rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .fc-total .label { font-size: 12px; color: #6b7280; font-weight: 600; }
  .fc-breakdown {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    font-size: 11px;
    color: #475569;
    padding-top: 10px;
    border-top: 1px dashed #e5e7eb;
  }
  .fc-breakdown .item {
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }
  .fc-breakdown .k { color: #94a3b8; }
  .fc-breakdown .v { font-weight: 600; color: #0f172a; }
  .fc-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }
  .fc-footer .arrow { color: #f59e0b; font-family: 'Poppins', sans-serif; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadDepartmentFees()
</script>
