<!-- ============================================================
     Admin → Fees → Fee Levels
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Fee Structures</h2>
    <p class="muted small">Tuition fees for Federal Polytechnic Ugep by level</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadFeeLevels()">Refresh</button>
    <button class="btn btn-primary btn-sm" onclick="FPU_ADMIN.openAddFeeModal()">+ Add Fee Level</button>
  </div>
</section>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Fee Levels</div>
    <div class="value" id="fee-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Lowest</div>
    <div class="value" id="fee-stat-lowest">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Highest</div>
    <div class="value" id="fee-stat-highest">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Average</div>
    <div class="value" id="fee-stat-average">—</div>
  </div>
</div>

<!-- Grid -->
<div id="fee-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:20px;">
  <div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;">
    <span class="spinner"></span> Loading fees from database…
  </div>
</div>

<style>
  /* Card Styles */
  .fee-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    cursor: default;
  }
  .fee-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #065f46, #10b981);
  }
  .fee-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .fee-level-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 800;
    padding: 6px 14px;
    border-radius: 6px;
    letter-spacing: 1px;
    align-self: flex-start;
  }
  .fee-amount-value {
    font-family: 'Poppins', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    color: #0f172a;
    margin-top: 8px;
  }
  .fee-amount-label {
    font-size: 11px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
  }
  .fee-actions {
    display: flex;
    gap: 8px;
    padding-top: 12px;
    margin-top: auto;
    border-top: 1px solid #f1f5f9;
  }
  .fee-actions .btn { flex: 1; justify-content: center; }

  /* ==========================================
     FORCE MODAL TO CENTER ON SCREEN
     ========================================== */
  .fpu-modal-backdrop {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background: rgba(15, 23, 42, 0.65) !important;
    backdrop-filter: blur(2px);
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    z-index: 99999 !important;
    padding: 20px;
  }

  .fpu-modal {
    background: #fff !important;
    border-radius: 14px !important;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35) !important;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    width: 100%;
    max-width: 480px;
  }

  .fpu-modal-header {
    padding: 16px 24px !important;
    border-bottom: 1px solid #e2e8f0 !important;
    background: #f8fafc !important;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .fpu-modal-header h3 {
    margin: 0;
    font-size: 1.1rem;
    color: #0f172a;
    font-weight: 700;
  }

  .fpu-modal-body {
    padding: 20px 24px !important;
    overflow-y: auto !important;
    flex: 1;
  }

  .fpu-modal-footer {
    padding: 14px 24px !important;
    border-top: 1px solid #e2e8f0 !important;
    background: #f8fafc !important;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    flex-shrink: 0;
  }
</style>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadFeeLevels) {
    setTimeout(window.FPU_ADMIN.loadFeeLevels, 100);
  }
</script>
