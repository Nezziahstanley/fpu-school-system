<!-- ============================================================
     Admin → HODs
     ------------------------------------------------------------
     Board view: one card per department showing its HOD.
     HODs without a department appear in a "Needs Assignment" panel.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Heads of Department</h2>
    <p class="muted small">One HOD per department · {count} assigned, {unassigned} unassigned</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadHodBoard()">
      Refresh
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateToWithQuery('staff-form', { role: 'hod' })">
      + New HOD
    </button>
  </div>
</section>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total HODs</div>
    <div class="value" id="hod-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Assigned</div>
    <div class="value" id="hod-stat-assigned">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Unassigned</div>
    <div class="value" id="hod-stat-unassigned">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Departments</div>
    <div class="value" id="hod-stat-depts">—</div>
  </div>
</div>

<!-- Needs assignment panel -->
<div class="panel" id="hod-unassigned-panel" style="display:none; border-left:4px solid #f59e0b;">
  <div class="panel-head">
    <h3>⚠️ HODs Without a Department</h3>
    <span class="small muted">Assign them to a department to activate</span>
  </div>
  <div class="panel-body" id="hod-unassigned-body"></div>
</div>

<!-- Department cards -->
<div id="hod-dept-grid" class="hod-dept-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading HODs…
  </div>
</div>

<style>
  .hod-dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
    margin-top: 20px;
  }
  .hod-dept-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .hod-dept-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #8b5cf6, #a78bfa);
  }
  .hod-dept-card.vacant::before {
    background: linear-gradient(90deg, #f59e0b, #fbbf24);
  }
  .hod-dept-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
  }

  .hdc-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .hdc-code {
    background: #ede9fe;
    color: #6d28d9;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .hdc-school {
    background: linear-gradient(135deg,#065f46,#047857);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .hod-dept-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }

  .hdc-hod {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 10px;
  }
  .hdc-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 15px;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
  }
  .hdc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .hdc-avatar.vacant {
    background: #fef3c7;
    color: #b45309;
  }
  .hdc-hod-info { flex: 1; min-width: 0; }
  .hdc-hod-name {
    font-family: 'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hdc-hod-email {
    font-size: 12px;
    color: #6b7280;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hdc-hod.vacant .hdc-hod-name { color: #b45309; }

  .hdc-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
  }
  .hdc-actions .btn { flex: 1; justify-content: center; padding: 6px 10px; font-size: 11.5px; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadHodBoard()
</script>
