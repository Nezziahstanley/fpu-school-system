<!-- ============================================================
     Admin → Lecturers
     ------------------------------------------------------------
     Grid of lecturer cards with workload indicators:
       • courses taught this session
       • total credit units
       • department
     Filter by department + search + workload status.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Lecturers</h2>
    <p class="muted small">Teaching staff with course workload</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadLecturerGrid()">
      Refresh
    </button>
    <button class="btn btn-outline btn-sm" id="lec-view-workloads">
      📊 Workload Summary
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateToWithQuery('staff-form', { role: 'lecturer' })">
      + New Lecturer
    </button>
  </div>
</section>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Department</label>
    <select class="form-select" id="lec-filter-dept"
            data-lookup="departments" data-placeholder="All departments"
            onchange="FPU_ADMIN.loadLecturerGrid()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">Workload</label>
    <select class="form-select" id="lec-filter-workload"
            onchange="FPU_ADMIN.loadLecturerGrid()">
      <option value="">All</option>
      <option value="loaded">Has courses</option>
      <option value="unloaded">No courses</option>
      <option value="overloaded">Overloaded (≥ 12 units)</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 240px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="lec-search"
           placeholder="Name, email, or staff number…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadLecturerGrid()" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total Lecturers</div>
    <div class="value" id="lec-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">With Courses</div>
    <div class="value" id="lec-stat-loaded">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">No Courses</div>
    <div class="value" id="lec-stat-unloaded">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Avg Load</div>
    <div class="value" id="lec-stat-avg">—</div>
  </div>
</div>

<!-- Lecturer grid -->
<div id="lec-grid" class="lec-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading lecturers…
  </div>
</div>

<style>
  .lec-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }

  .lec-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    cursor: pointer;
  }
  .lec-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
  }
  .lec-card.heavy::before  { background: #dc2626; }
  .lec-card.loaded::before { background: #10b981; }
  .lec-card.light::before  { background: #f59e0b; }
  .lec-card.none::before   { background: #cbd5e1; }

  .lec-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.25);
  }

  .lc-head {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .lc-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #065f46, #f59e0b);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
  }
  .lc-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .lc-info { flex: 1; min-width: 0; }
  .lc-name {
    font-family: 'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lc-email {
    font-size: 12px;
    color: #6b7280;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lc-dept {
    font-size: 11.5px;
    color: #065f46;
    background: #ecfdf5;
    padding: 2px 8px;
    border-radius: 5px;
    display: inline-block;
    margin-top: 4px;
    font-weight: 600;
  }

  .lc-workload {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px dashed #e5e7eb;
  }
  .lc-workload-stat {
    background: #f8fafc;
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .lc-workload-stat .num {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .lc-workload-stat.heavy .num  { color: #b91c1c; }
  .lc-workload-stat.none .num   { color: #94a3b8; }
  .lc-workload-stat .label {
    display: block;
    font-size: 10px;
    color: #6b7280;
    font-weight: 700;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .lc-empty {
    background: #fef3c7;
    color: #b45309;
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 6px;
    text-align: center;
  }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadLecturerGrid()
</script>
