<!-- ============================================================
     Admin → Lecturers → List
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Lecturers</h2>
    <p class="muted small">Teaching staff with course workload</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadLecturerGrid()">Refresh</button>
    <button class="btn btn-primary btn-sm" onclick="window.location.hash='#staff-form?role=lecturer'">+ New Lecturer</button>
  </div>
</section>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Department</label>
    <select class="form-select" id="lec-filter-dept" onchange="FPU_ADMIN.loadLecturerGrid()">
      <option value="">All departments</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Workload</label>
    <select class="form-select" id="lec-filter-workload" onchange="FPU_ADMIN.loadLecturerGrid()">
      <option value="">All</option>
      <option value="loaded">Has courses</option>
      <option value="unloaded">No courses</option>
      <option value="overloaded">Overloaded (≥ 12 units)</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 240px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="lec-search" placeholder="Name, email, or staff number…" onkeyup="FPU_ADMIN.loadLecturerGrid()" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total Lecturers</div>
    <div class="value" id="lec-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">With Courses</div>
    <div class="value" id="lec-stat-loaded">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">No Courses</div>
    <div class="value" id="lec-stat-unloaded">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Avg Load</div>
    <div class="value" id="lec-stat-avg">—</div>
  </div>
</div>

<!-- Grid -->
<div id="lec-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:20px;">
  <div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8;"><span class="spinner"></span> Loading lecturers…</div>
</div>

<style>
  .lec-card {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 3px rgba(15,23,42,0.05);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    position: relative;
    border: 1px solid #e2e8f0;
  }
  .lec-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
  }
  /* Workload border colors */
  .lec-card.normal { border-left: 5px solid #10b981; }    /* Green */
  .lec-card.heavy  { border-left: 5px solid #f59e0b; }    /* Orange */
  .lec-card.overloaded { border-left: 5px solid #dc2626; } /* Red */
  .lec-card.none   { border-left: 5px solid #94a3b8; }    /* Gray */

  .lec-head { display: flex; align-items: center; gap: 12px; }
  .lec-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg,#065f46,#f59e0b);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 800;
    flex-shrink: 0;
  }
  .lec-info { flex: 1; min-width: 0; }
  .lec-name { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; color: #0f172a; }
  .lec-email { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .lec-dept { display: inline-block; background: #ecfdf5; color: #065f46; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  
  .lec-workload {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    padding: 10px; background: #f8fafc; border-radius: 8px;
  }
  .lec-workload-stat { text-align: center; }
  .lec-workload-stat .num { display: block; font-family: 'Poppins', sans-serif; font-size: 1.2rem; font-weight: 800; color: #065f46; line-height: 1.1; }
  .lec-workload-stat .label { display: block; font-size: 9px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 2px; letter-spacing: 0.3px; }
  .lec-workload-stat.heavy .num { color: #dc2626; }
  .lec-workload-stat.none .num { color: #94a3b8; }
  
  /* Action buttons */
  .lec-actions {
    display: flex; gap: 6px; padding-top: 8px;
    border-top: 1px solid #f1f5f9;
  }
  .lec-actions .btn {
    flex: 1; justify-content: center; padding: 6px 10px; font-size: 11.5px;
  }
  .lec-action-icon {
    padding: 6px 8px; font-size: 14px; line-height: 1;
  }

  /* ==========================================
     MODAL STYLES
     ========================================== */
  .fpu-modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center;
    z-index: 99999; padding: 20px;
  }
  .fpu-modal {
    background: #fff; border-radius: 14px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
    max-height: 85vh; display: flex; flex-direction: column;
    overflow: hidden; width: 100%; max-width: 640px;
  }
  .fpu-modal-header {
    padding: 16px 24px; border-bottom: 1px solid #e2e8f0;
    background: #f8fafc; display: flex; justify-content: space-between;
    align-items: center; flex-shrink: 0;
  }
  .fpu-modal-header h3 { margin: 0; font-size: 1.1rem; color: #0f172a; font-weight: 700; }
  .fpu-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }
  .fpu-modal-footer {
    padding: 14px 24px; border-top: 1px solid #e2e8f0;
    background: #f8fafc; display: flex; gap: 8px;
    justify-content: flex-end; flex-shrink: 0;
  }
</style>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadLecturerGrid) {
    setTimeout(window.FPU_ADMIN.loadLecturerGrid, 100);
  }
</script>
