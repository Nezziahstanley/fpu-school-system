<!-- ============================================================
     Admin → Library → Book Detail
     ------------------------------------------------------------
     Full book metadata + current borrowers + borrow history.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Book Detail</h2>
    <p class="muted small" id="bd-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('library')">← Back</button>
    <button class="btn btn-outline btn-sm" id="bd-issue">Issue This Book</button>
    <button class="btn btn-primary btn-sm" id="bd-edit">Edit Book</button>
    <button class="btn btn-danger btn-sm" id="bd-delete">Delete</button>
  </div>
</section>

<div class="grid grid-2" style="gap:20px; align-items:flex-start;">
  <div>
    <div class="panel">
      <div class="panel-body">
        <div id="bd-header">
          <div class="loading"><span class="spinner"></span> Loading…</div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Metadata</h3></div>
      <div class="panel-body" id="bd-metadata">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>

  <div>
    <div class="panel">
      <div class="panel-head">
        <h3>Currently Borrowed</h3>
        <span class="small muted" id="bd-borrowed-count">—</span>
      </div>
      <div class="panel-body flush" id="bd-active-borrows">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Recent Borrow History</h3></div>
      <div class="panel-body flush" id="bd-history">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>
</div>

<style>
  .book-header-card {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .book-header-icon {
    width: 90px;
    height: 120px;
    background: linear-gradient(135deg, #065f46, #10b981);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(15,23,42,0.15);
  }
  .book-header-info { flex: 1; min-width: 0; }
  .book-header-info h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.3rem;
    color: #0f172a;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .book-header-info .author {
    font-size: 14px;
    color: #475569;
    margin-bottom: 12px;
  }
  .book-header-info .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .bd-stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid #f1f5f9;
  }
  .bd-stat {
    background: #f8fafc;
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }
  .bd-stat .num {
    font-family: 'Poppins', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .bd-stat.loan .num  { color: #f59e0b; }
  .bd-stat.avail .num { color: #10b981; }
  .bd-stat .label {
    font-size: 10px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 3px;
  }

  .borrow-row {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
  }
  .borrow-row:last-child { border-bottom: none; }
  .borrow-row.overdue { background: #fef2f2; }
  .borrow-row.overdue::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: #dc2626;
  }
  .borrow-row { position: relative; }
  .borrow-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #065f46, #f59e0b);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
  }
  .borrow-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .borrow-info { flex: 1; min-width: 0; }
  .borrow-info strong {
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    color: #0f172a;
    display: block;
    line-height: 1.3;
  }
  .borrow-info span {
    font-size: 11.5px;
    color: #6b7280;
  }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadBookDetail()
</script>
