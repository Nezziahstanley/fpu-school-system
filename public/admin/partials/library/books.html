<!-- ============================================================
     Admin → Library → Books
     ------------------------------------------------------------
     Category tabs + availability filter + search.
     Card grid with cover colour, stock status, quick actions.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Library Books</h2>
    <p class="muted small">Catalogue and stock overview</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadBooksGrid()">
      Refresh
    </button>
    <button class="btn btn-outline btn-sm" id="books-sweep-overdue">
      ⏰ Sweep Overdue
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('book-form')">
      + Add Book
    </button>
  </div>
</section>

<!-- Category tabs -->
<div class="staff-role-tabs" id="books-category-tabs">
  <button class="staff-role-tab active" data-category="">
    All <span class="tab-count" id="books-count-all">—</span>
  </button>
  <button class="staff-role-tab" data-category="Computer Science">
    Computer Science
  </button>
  <button class="staff-role-tab" data-category="Engineering">
    Engineering
  </button>
  <button class="staff-role-tab" data-category="Mathematics">
    Mathematics
  </button>
  <button class="staff-role-tab" data-category="Business">
    Business
  </button>
  <button class="staff-role-tab" data-category="General">
    General
  </button>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group" style="flex:2 1 300px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="books-search"
           placeholder="Title, author, or ISBN…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadBooksGrid()" />
  </div>
  <div class="form-group">
    <label class="form-label">Availability</label>
    <select class="form-select" id="books-avail"
            onchange="FPU_ADMIN.loadBooksGrid()">
      <option value="">All books</option>
      <option value="available">Available only</option>
      <option value="low">Low stock (≤ 2)</option>
      <option value="out">Out of stock</option>
    </select>
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total Titles</div>
    <div class="value" id="books-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Total Copies</div>
    <div class="value" id="books-stat-copies">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">On Loan</div>
    <div class="value" id="books-stat-onloan">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Available</div>
    <div class="value" id="books-stat-avail">—</div>
  </div>
</div>

<!-- Books grid -->
<div id="books-grid" class="books-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading books…
  </div>
</div>

<style>
  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .book-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    cursor: pointer;
  }
  .book-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.25);
  }
  .book-spine {
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 6px;
  }
  .book-spine.cat-0 { background: #3b82f6; }
  .book-spine.cat-1 { background: #10b981; }
  .book-spine.cat-2 { background: #f59e0b; }
  .book-spine.cat-3 { background: #8b5cf6; }
  .book-spine.cat-4 { background: #ec4899; }
  .book-spine.cat-5 { background: #14b8a6; }

  .book-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
    padding-left: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 2.7em;
  }
  .book-author {
    font-size: 13px;
    color: #6b7280;
    margin: 0;
    padding-left: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .book-meta {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding-left: 8px;
  }
  .book-chip {
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #f1f5f9;
    color: #475569;
  }
  .book-chip.category { background: #ecfdf5; color: #065f46; }
  .book-chip.shelf    { background: #dbeafe; color: #1e40af; }

  .book-stock {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 10px 12px;
    background: #f8fafc;
    border-radius: 8px;
    margin-top: auto;
  }
  .book-stock .num {
    font-family: 'Poppins', sans-serif;
    font-size: 1.4rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .book-stock .num.warning  { color: #b45309; }
  .book-stock .num.critical { color: #b91c1c; }
  .book-stock .label {
    font-size: 11.5px;
    color: #6b7280;
    font-weight: 600;
  }
  .book-stock-badge {
    margin-left: auto;
    font-family: 'Poppins', sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .book-stock-badge.available { background: #dcfce7; color: #15803d; }
  .book-stock-badge.low       { background: #fef3c7; color: #92400e; }
  .book-stock-badge.out       { background: #fee2e2; color: #991b1b; }

  .book-actions {
    display: flex;
    gap: 6px;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
  }
  .book-actions .btn { flex: 1; justify-content: center; padding: 6px 10px; font-size: 11.5px; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadBooksGrid()
</script>
