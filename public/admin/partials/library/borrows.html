<!-- ============================================================
     Admin → Library → Borrows
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Borrow Records</h2>
    <p class="muted small">Issue, return, and track borrowed books</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadBorrowsTable()">
      Refresh
    </button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.runLibrarySweep()">
      🧹 Sweep Overdue
    </button>
    <button class="btn btn-primary btn-sm" onclick="FPU_ADMIN_SPA.navigateToWithQuery('borrow-issue', {})">
      + Issue Book
    </button>
  </div>
</section>

<!-- Filter Tabs -->
<div class="filters" style="margin-bottom: 20px;">
  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
    <button class="btn btn-sm btn-primary" onclick="document.getElementById('bor-status').value=''; FPU_ADMIN.loadBorrowsTable();">All</button>
    <button class="btn btn-sm btn-outline" onclick="document.getElementById('bor-status').value='borrowed'; FPU_ADMIN.loadBorrowsTable();">Active</button>
    <button class="btn btn-sm btn-outline" onclick="document.getElementById('bor-status').value='overdue'; FPU_ADMIN.loadBorrowsTable();">Overdue</button>
    <button class="btn btn-sm btn-outline" onclick="document.getElementById('bor-status').value='returned'; FPU_ADMIN.loadBorrowsTable();">Returned</button>
    <button class="btn btn-sm btn-outline" onclick="document.getElementById('bor-status').value='lost'; FPU_ADMIN.loadBorrowsTable();">Lost</button>
  </div>
</div>

<!-- Search -->
<div class="panel" style="margin-bottom: 20px;">
  <div class="panel-body">
    <div class="filters" style="display: flex; gap: 16px;">
      <div class="form-group" style="flex: 2;">
        <label class="form-label">Search</label>
        <input class="form-control" id="bor-search" placeholder="Student name, matric, or book title…" onkeydown="if(event.key==='Enter') FPU_ADMIN.loadBorrowsTable()" />
      </div>
      <div class="form-group" style="flex: 1;">
        <label class="form-label">Due within</label>
        <select class="form-select">
          <option>Any time</option>
          <option>Today</option>
          <option>This Week</option>
          <option>This Month</option>
        </select>
      </div>
      <!-- Hidden input used by the buttons above -->
      <input type="hidden" id="bor-status" value="" />
    </div>
  </div>
</div>

<!-- Stats Bar (UPDATED IDs to match JS) -->
<div class="stats-inline" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px;">
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #3b82f6;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Total</div>
    <div id="bor-stat-total" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #10b981;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Active</div>
    <div id="bor-stat-active" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #ef4444;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Overdue</div>
    <div id="bor-stat-overdue" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
  <div style="background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; border-left: 4px solid #8b5cf6;">
    <div style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">Returned</div>
    <div id="bor-stat-returned" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-top: 4px;">—</div>
  </div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-head">
    <h3>Borrows</h3>
    <span class="small muted" id="bor-count">—</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th>Book</th>
            <th>Borrower</th>
            <th>Borrowed</th>
            <th>Due</th>
            <th>Status</th>
            <th>Days</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bor-tbody">
          <tr><td colspan="7" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
