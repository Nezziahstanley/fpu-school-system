<!-- ============================================================
     Admin → Library → Borrows
     ------------------------------------------------------------
     Status tabs + issue/return workflow + overdue highlighting.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Borrow Records</h2>
    <p class="muted small">Issue, return, and track borrowed books</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadBorrowsTable()">
      Refresh
    </button>
    <button class="btn btn-outline btn-sm" id="borrows-sweep">
      ⏰ Sweep Overdue
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('borrow-issue')">
      + Issue Book
    </button>
  </div>
</section>

<!-- Status tabs -->
<div class="staff-role-tabs" id="borrows-status-tabs">
  <button class="staff-role-tab active" data-status="">
    All <span class="tab-count" id="bor-count-all">—</span>
  </button>
  <button class="staff-role-tab" data-status="borrowed">
    Borrowed <span class="tab-count" id="bor-count-borrowed">—</span>
  </button>
  <button class="staff-role-tab" data-status="overdue">
    Overdue <span class="tab-count" id="bor-count-overdue">—</span>
  </button>
  <button class="staff-role-tab" data-status="returned">
    Returned <span class="tab-count" id="bor-count-returned">—</span>
  </button>
  <button class="staff-role-tab" data-status="lost">
    Lost <span class="tab-count" id="bor-count-lost">—</span>
  </button>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group" style="flex:2 1 260px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="bor-search"
           placeholder="Student name, matric, or book title…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadBorrowsTable()" />
  </div>
  <div class="form-group">
    <label class="form-label">Due within</label>
    <select class="form-select" id="bor-due-filter"
            onchange="FPU_ADMIN.loadBorrowsTable()">
      <option value="">Any time</option>
      <option value="3">Next 3 days</option>
      <option value="7">Next 7 days</option>
      <option value="14">Next 14 days</option>
    </select>
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total</div>
    <div class="value" id="bor-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Active</div>
    <div class="value" id="bor-stat-active">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Overdue</div>
    <div class="value" id="bor-stat-overdue">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Returned</div>
    <div class="value" id="bor-stat-returned">—</div>
  </div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-head">
    <h3>Borrows</h3>
    <span class="small muted" id="bor-count">Loading…</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th>Book</th>
            <th>Borrower</th>
            <th style="width:110px;">Borrowed</th>
            <th style="width:110px;">Due</th>
            <th style="width:110px;">Status</th>
            <th style="width:120px;">Days</th>
            <th style="width:180px;">Actions</th>
          </tr>
        </thead>
        <tbody id="bor-tbody">
          <tr><td colspan="7" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .borrow-row-overdue {
    background: #fef2f2 !important;
  }
  .borrow-row-overdue td:first-child {
    border-left: 3px solid #dc2626;
  }
  .days-badge {
    display: inline-block;
    font-family: 'Poppins', sans-serif;
    font-size: 11.5px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .days-badge.ok      { background: #ecfdf5; color: #065f46; }
  .days-badge.warning { background: #fef3c7; color: #92400e; }
  .days-badge.danger  { background: #fee2e2; color: #991b1b; }
  .days-badge.done    { background: #f1f5f9; color: #64748b; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadBorrowsTable()
</script>
