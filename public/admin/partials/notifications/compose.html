<!-- ============================================================
     Admin → Notifications → Compose
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Send Notification</h2>
    <p class="muted small">Send a message to a group, department, or specific user</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#notifications'">← Back</button>
  </div>
</section>

<div class="panel" style="max-width:800px; margin:0 auto;">
  <div class="panel-head"><h3>Compose Message</h3></div>
  <div class="panel-body">
    <form id="notif-form" data-skip-generic="1">
      
      <!-- ================= STEP 1: AUDIENCE ================= -->
      <div class="form-grid" style="margin-bottom:16px;">
        <div class="form-group">
          <label class="form-label">1. Who are you sending to? <span class="req">*</span></label>
          <select class="form-select" id="nc-role" onchange="updateDepartments()">
            <option value="everyone">🌍 Everyone (All Users)</option>
            <option value="student">🎓 Students</option>
            <option value="lecturer">👨‍🏫 Lecturers</option>
            <option value="hod">🏛️ HODs</option>
            <option value="staff">👔 Staff (Non-Academic)</option>
          </select>
        </div>

        <!-- ================= STEP 2: DEPARTMENT ================= -->
        <div class="form-group" id="nc-dept-wrapper">
          <label class="form-label">2. Filter by Department</label>
          <select class="form-select" id="nc-dept" onchange="updateRecipients()">
            <option value="all">All Departments</option>
            <!-- Populated by JS -->
          </select>
        </div>
      </div>

      <!-- ================= STEP 3: RECIPIENTS ================= -->
      <div class="form-group" id="nc-recipient-wrapper">
        <label class="form-label">3. Select Recipient(s) <span class="req">*</span></label>
          <div style="font-size:12px; color:#64748b; margin-bottom:8px;">
            Hold <kbd style="background:#f1f5f9; border:1px solid #cbd5e1; border-radius:4px; padding:1px 4px; font-size:11px;">Ctrl</kbd> (or <kbd>Cmd</kbd> on Mac) to select multiple.
          </div>
          <select class="form-select" id="nc-recipients" multiple size="8" style="height:auto; padding:10px;">
            <!-- Populated by JS -->
          </select>
      </div>

      <!-- ================= MESSAGE DETAILS ================= -->
      <hr style="margin:24px 0; border:none; border-top:1px solid #e2e8f0;">
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Notification Type</label>
          <select class="form-select" id="nc-type">
            <option value="info">ℹ️ Info</option>
            <option value="warning">⚠️ Warning</option>
            <option value="success">✅ Success</option>
            <option value="fee">💰 Fee / Payment</option>
            <option value="complaint">📩 Complaint</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Link (optional)</label>
          <input class="form-control" id="nc-link" placeholder="/admin/app.html#payments" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Title <span class="req">*</span></label>
        <input class="form-control" id="nc-title" required placeholder="e.g. Urgent: Resumption Date Announced" />
      </div>

      <div class="form-group">
        <label class="form-label">Message Body</label>
        <textarea class="form-control" id="nc-body" rows="5" placeholder="Type the full message here..."></textarea>
      </div>

      <div id="nc-validation"></div>

      <div class="form-actions" style="margin-top:20px;">
        <button type="submit" class="btn btn-primary" id="nc-submit">Send Notification</button>
        <button type="button" class="btn btn-outline" onclick="window.location.hash='#notifications'">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    // 1. Data Cache
    let ALL_USERS = [];
    let ALL_DEPTS = [];

    // 2. Load Data from API
    try {
      const [stuRes, staffRes, adminRes, deptRes] = await Promise.all([
        A.adminFetch('/api/admin/students?limit=5000').catch(() => null),
        A.adminFetch('/api/admin/staff?limit=2000').catch(() => null),
        A.adminFetch('/api/admin/users?limit=2000').catch(() => null),
        A.adminFetch('/api/admin/departments').catch(() => null),
      ]);

      if (stuRes && stuRes.ok) ALL_USERS = ALL_USERS.concat((await stuRes.json()).data || []);
      if (staffRes && staffRes.ok) ALL_USERS = ALL_USERS.concat((await staffRes.json()).data || []);
      if (adminRes && adminRes.ok) ALL_USERS = ALL_USERS.concat((await adminRes.json()).data || []);
      if (deptRes && deptRes.ok) ALL_DEPTS = (await deptRes.json()).data || [];

      // Remove duplicates
      ALL_USERS = Array.from(new Map(ALL_USERS.map(u => [u.id, u])).values());

    } catch (err) {
      console.warn("Data load error:", err);
    }

    // 3. Update Departments Dropdown based on Role
    window.updateDepartments = function () {
      const role = $('nc-role').value;
      
      // If "Everyone" is selected, hide the department filter (makes no sense for everyone)
      if (role === 'everyone') {
        $('nc-dept-wrapper').style.display = 'none';
        $('nc-recipient-wrapper').style.display = 'none';
        return;
      } else {
        $('nc-dept-wrapper').style.display = 'block';
        $('nc-recipient-wrapper').style.display = 'block';
      }

      // Find which departments have users with this role
      const relevantDepts = ALL_DEPTS.filter(d => {
        return ALL_USERS.some(u => 
          Number(u.departmentId) === Number(d.id) && 
          checkRoleMatch(u.role, role)
        );
      });

      $('nc-dept').innerHTML = '<option value="all">All Departments</option>' + 
        relevantDepts.map(d => `<option value="${d.id}">${A.escapeHtml(d.name || d.code)}</option>`).join('');

      // After updating departments, refresh the recipients list
      updateRecipients();
    };

    // Helper to match roles correctly (HOD vs Lecturer vs Staff)
    function checkRoleMatch(userRole, targetRole) {
      const uRole = String(userRole || '').toLowerCase();
      if (targetRole === 'student') return uRole === 'student';
      if (targetRole === 'lecturer') return uRole === 'lecturer';
      if (targetRole === 'hod') return uRole === 'hod';
      if (targetRole === 'staff') return !['student', 'lecturer', 'hod'].includes(uRole); // Staff = bursar, admin, registrar, etc.
      return false;
    }

    // 4. Update Recipients Dropdown based on Role + Department
    window.updateRecipients = function () {
      const role = $('nc-role').value;
      const deptId = $('nc-dept').value;

      // Filter users by role
      let filtered = ALL_USERS.filter(u => checkRoleMatch(u.role, role));

      // Filter by department if not 'all'
      if (deptId !== 'all') {
        filtered = filtered.filter(u => Number(u.departmentId) === Number(deptId));
      }

      // Build the UI
      const select = $('nc-recipients');
      
      if (filtered.length === 0) {
        select.innerHTML = '<option value="">No users found for this criteria</option>';
        return;
      }

      // If specific department is selected, just list them nicely
      // If "All Departments", group them by department using <optgroup>
      if (deptId === 'all') {
        const byDept = new Map();
        filtered.forEach(u => {
          const dName = (ALL_DEPTS.find(d => Number(d.id) === Number(u.departmentId)) || {}).name || 'No Department';
          if (!byDept.has(dName)) byDept.set(dName, []);
          byDept.get(dName).push(u);
        });

        let html = '';
        byDept.forEach((users, dName) => {
          html += `<optgroup label="🏢 ${A.escapeHtml(dName)} (${users.length})">`;
          users.forEach(u => {
            const name = `${u.firstName || u.first_name || ''} ${u.lastName || u.last_name || ''}`.trim();
            html += `<option value="${u.id}">${A.escapeHtml(name)} — ${A.escapeHtml(u.email || '')}</option>`;
          });
          html += `</optgroup>`;
        });
        select.innerHTML = html;
      } else {
        select.innerHTML = filtered.map(u => {
          const name = `${u.firstName || u.first_name || ''} ${u.lastName || u.last_name || ''}`.trim();
          return `<option value="${u.id}">${A.escapeHtml(name)} — ${A.escapeHtml(u.email || '')}</option>`;
        }).join('');
      }
    };

    // Initialize
    updateDepartments();

    // 5. Submit Form
    $('notif-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const valEl = $('nc-validation');
      valEl.innerHTML = '';

      const role = $('nc-role').value;
      const title = $('nc-title').value.trim();
      const body = $('nc-body').value.trim();
      const type = $('nc-type').value;
      const link = $('nc-link').value.trim() || null;

      if (!title) { valEl.innerHTML = '<div class="alert alert-danger" style="margin-bottom:15px;">⚠️ Title is required.</div>'; return; }

      // Determine User IDs
      let userIds = [];

      if (role === 'everyone') {
        userIds = ALL_USERS.map(u => u.id);
      } else {
        // Get selected options from the multi-select
        const selected = Array.from($('nc-recipients').selectedOptions).map(o => Number(o.value)).filter(Boolean);
        if (selected.length === 0) {
          valEl.innerHTML = '<div class="alert alert-danger" style="margin-bottom:15px;">⚠️ Please select at least one recipient from the list.</div>';
          return;
        }
        userIds = selected;
      }

      if (userIds.length === 0) {
        valEl.innerHTML = '<div class="alert alert-warning" style="margin-bottom:15px;">⚠️ No users matched your criteria.</div>';
        return;
      }

      const btn = $('nc-submit');
      btn.disabled = true;
      btn.textContent = `Sending to ${userIds.length} user(s)…`;

      try {
        // Send notifications in parallel
        const promises = userIds.map(uid => 
          A.adminFetch('/api/admin/notifications', {
            method: 'POST',
            body: JSON.stringify({ userId: uid, title, body, type, link }),
          })
        );

        await Promise.all(promises);

        A.showToast(`✅ Notification sent to ${userIds.length} user(s).`, 'success');
        window.location.hash = '#notifications';
      } catch (err) {
        valEl.innerHTML = `<div class="alert alert-danger" style="margin-bottom:15px;">❌ ${A.escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = 'Send Notification';
      }
    });
  })();
</script>
