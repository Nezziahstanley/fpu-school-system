<!-- ============================================================
     Admin → Notifications → Compose
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Send Notification</h2>
    <p class="muted small">Send a message to a group, department, or specific user</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#notifications'">← Back</button>
  </div>
</section>

<div class="panel" style="max-width:800px; margin:0 auto;">
  <div class="panel-head"><h3>Compose Message</h3></div>
  <div class="panel-body">
    <form id="notif-form" data-skip-generic="1">
      
      <!-- 1. Audience Selection -->
      <div class="form-grid" style="margin-bottom:16px;">
        <div class="form-group">
          <label class="form-label">1. Who are you sending to?</label>
          <select class="form-select" id="nc-role" onchange="updateDepartments()">
            <option value="everyone">🌍 Everyone (All Users)</option>
            <option value="student">🎓 Students</option>
            <option value="lecturer">👨‍🏫 Lecturers</option>
            <option value="hod">🏛️ HODs</option>
            <option value="staff">👔 Staff (Non-Academic)</option>
          </select>
        </div>

        <!-- 2. Department Filter -->
        <div class="form-group" id="nc-dept-wrapper">
          <label class="form-label">2. Filter by Department</label>
          <select class="form-select" id="nc-dept" onchange="updateRecipients()">
            <option value="all">All Departments</option>
          </select>
        </div>
      </div>

      <!-- 3. Recipient Picker (The New Design) -->
      <div class="form-group" id="nc-recipient-wrapper">
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:8px;">
          <label class="form-label" style="margin:0;">3. Select Recipient(s) <span class="req">*</span></label>
          <div>
            <button type="button" class="btn btn-sm btn-ghost" onclick="selectAllRecipients()">Select All</button>
            <button type="button" class="btn btn-sm btn-ghost" onclick="clearAllRecipients()">Clear</button>
          </div>
        </div>
        
        <div id="nc-recipient-list" class="recipient-scroll-box">
          <!-- JS injects checkboxes here -->
        </div>
      </div>

      <!-- Message Content -->
      <hr style="margin:24px 0; border:none; border-top:1px solid #e2e8f0;">
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Notification Type</label>
          <select class="form-select" id="nc-type">
            <option value="info">ℹ️ Info</option>
            <option value="warning">⚠️ Warning</option>
            <option value="success">✅ Success</option>
            <option value="fee">💰 Fee / Payment</option>
            <option value="complaint">📩 Complaint</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Link (optional)</label>
          <input class="form-control" id="nc-link" placeholder="/admin/app.html#payments" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Title <span class="req">*</span></label>
        <input class="form-control" id="nc-title" required placeholder="e.g. Urgent: Resumption Date Announced" />
      </div>

      <div class="form-group">
        <label class="form-label">Message Body</label>
        <textarea class="form-control" id="nc-body" rows="5" placeholder="Type the full message here..."></textarea>
      </div>

      <div id="nc-validation"></div>

      <div class="form-actions" style="margin-top:20px;">
        <button type="submit" class="btn btn-primary" id="nc-submit">Send Notification</button>
        <button type="button" class="btn btn-outline" onclick="window.location.hash='#notifications'">Cancel</button>
      </div>
    </form>
  </div>
</div>

<style>
  /* Custom recipient picker design */
  .recipient-scroll-box {
    max-height: 320px;
    overflow-y: auto;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 8px;
  }

  .recipient-group-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: #e2e8f0;
    color: #1e293b;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-radius: 6px;
    margin-top: 8px;
    margin-bottom: 4px;
    position: sticky;
    top: -8px;
    z-index: 1;
  }
  .recipient-group-header:first-child { margin-top: 0; }

  .recipient-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .recipient-item:hover {
    background: #f0fdf4;
    border-color: #bbf7d0;
  }
  .recipient-item.selected {
    background: #ecfdf5;
    border-color: #10b981;
  }
  
  .recipient-item input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #065f46;
    cursor: pointer;
    flex-shrink: 0;
  }

  .recipient-info { flex: 1; min-width: 0; }
  .recipient-name {
    font-size: 14px;
    font-weight: 600;
    color: #0f172a;
    line-height: 1.3;
  }
  .recipient-meta {
    font-size: 12px;
    color: #64748b;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .recipient-badge {
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .badge-student { background: #dbeafe; color: #1e40af; }
  .badge-lecturer { background: #f3e8ff; color: #6b21a8; }
  .badge-hod { background: #ffedd5; color: #9a3412; }
  .badge-staff { background: #f1f5f9; color: #475569; }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    let ALL_USERS = [];
    let ALL_DEPTS = [];

    // 1. Load data
    try {
      const [stuRes, staffRes, adminRes, deptRes] = await Promise.all([
        A.adminFetch('/api/admin/students?limit=5000').catch(() => null),
        A.adminFetch('/api/admin/staff?limit=2000').catch(() => null),
        A.adminFetch('/api/admin/users?limit=2000').catch(() => null),
        A.adminFetch('/api/admin/departments').catch(() => null),
      ]);

      if (stuRes && stuRes.ok) ALL_USERS = ALL_USERS.concat((await stuRes.json()).data || []);
      if (staffRes && staffRes.ok) ALL_USERS = ALL_USERS.concat((await staffRes.json()).data || []);
      if (adminRes && adminRes.ok) ALL_USERS = ALL_USERS.concat((await adminRes.json()).data || []);
      if (deptRes && deptRes.ok) ALL_DEPTS = (await deptRes.json()).data || [];

      ALL_USERS = Array.from(new Map(ALL_USERS.map(u => [u.id, u])).values());

    } catch (err) {
      console.warn("Data load error:", err);
    }

    // Helper: Role matcher
    function checkRoleMatch(userRole, targetRole) {
      const uRole = String(userRole || '').toLowerCase();
      if (targetRole === 'student') return uRole === 'student';
      if (targetRole === 'lecturer') return uRole === 'lecturer';
      if (targetRole === 'hod') return uRole === 'hod';
      if (targetRole === 'staff') return !['student', 'lecturer', 'hod'].includes(uRole);
      return false;
    }

    function roleBadgeClass(role) {
      const r = String(role).toLowerCase();
      if (r === 'student') return 'badge-student';
      if (r === 'lecturer') return 'badge-lecturer';
      if (r === 'hod') return 'badge-hod';
      return 'badge-staff';
    }

    // 2. Update Departments
    window.updateDepartments = function () {
      const role = $('nc-role').value;
      
      if (role === 'everyone') {
        $('nc-dept-wrapper').style.display = 'none';
        $('nc-recipient-wrapper').style.display = 'none';
        return;
      } else {
        $('nc-dept-wrapper').style.display = 'block';
        $('nc-recipient-wrapper').style.display = 'block';
      }

      const relevantDepts = ALL_DEPTS.filter(d => {
        return ALL_USERS.some(u => Number(u.departmentId) === Number(d.id) && checkRoleMatch(u.role, role));
      });

      $('nc-dept').innerHTML = '<option value="all">All Departments</option>' + 
        relevantDepts.map(d => `<option value="${d.id}">${A.escapeHtml(d.name || d.code)}</option>`).join('');

      updateRecipients();
    };

    // 3. Update Recipients (New Checkbox List)
    window.updateRecipients = function () {
      const role = $('nc-role').value;
      const deptId = $('nc-dept').value;

      let filtered = ALL_USERS.filter(u => checkRoleMatch(u.role, role));
      if (deptId !== 'all') filtered = filtered.filter(u => Number(u.departmentId) === Number(deptId));

      const container = $('nc-recipient-list');

      if (filtered.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8;">No users found for this criteria.</div>';
        return;
      }

      // Group by department if 'All Departments' is selected
      if (deptId === 'all') {
        const byDept = new Map();
        filtered.forEach(u => {
          const dName = (ALL_DEPTS.find(d => Number(d.id) === Number(u.departmentId)) || {}).name || 'No Department';
          if (!byDept.has(dName)) byDept.set(dName, []);
          byDept.get(dName).push(u);
        });

        let html = '';
        byDept.forEach((users, dName) => {
          html += `<div class="recipient-group-header">
            <span>🏢 ${A.escapeHtml(dName)}</span>
            <span>${users.length} member${users.length > 1 ? 's' : ''}</span>
          </div>`;
          
          html += users.map(u => renderUserItem(u)).join('');
        });
        container.innerHTML = html;
      } else {
        container.innerHTML = filtered.map(u => renderUserItem(u)).join('');
      }
    };

    function renderUserItem(u) {
      const name = `${u.firstName || u.first_name || ''} ${u.lastName || u.last_name || ''}`.trim() || 'Unknown';
      const email = u.email || '';
      const role = String(u.role || '').toLowerCase();
      
      return `
        <label class="recipient-item" onclick="this.classList.toggle('selected')">
          <input type="checkbox" value="${u.id}" onchange="this.parentElement.classList.toggle('selected', this.checked)">
          <div class="recipient-info">
            <div class="recipient-name">${A.escapeHtml(name)}</div>
            <div class="recipient-meta">${A.escapeHtml(email)}</div>
          </div>
          <span class="recipient-badge ${roleBadgeClass(role)}">${A.escapeHtml(role)}</span>
        </label>
      `;
    }

    // 4. Helper Buttons
    window.selectAllRecipients = function () {
      document.querySelectorAll('#nc-recipient-list input[type="checkbox"]').forEach(cb => {
        cb.checked = true;
        cb.parentElement.classList.add('selected');
      });
    };
    window.clearAllRecipients = function () {
      document.querySelectorAll('#nc-recipient-list input[type="checkbox"]').forEach(cb => {
        cb.checked = false;
        cb.parentElement.classList.remove('selected');
      });
    };

    // Initialize
    updateDepartments();

    // 5. Submit
    $('notif-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const valEl = $('nc-validation');
      valEl.innerHTML = '';

      const role = $('nc-role').value;
      const title = $('nc-title').value.trim();
      const body = $('nc-body').value.trim();
      const type = $('nc-type').value;
      const link = $('nc-link').value.trim() || null;

      if (!title) { valEl.innerHTML = '<div class="alert alert-danger" style="margin-bottom:15px;">⚠️ Title is required.</div>'; return; }

      let userIds = [];

      if (role === 'everyone') {
        userIds = ALL_USERS.map(u => u.id);
      } else {
        // Read selected checkboxes from our beautiful list
        const selected = Array.from(document.querySelectorAll('#nc-recipient-list input[type="checkbox"]:checked'))
          .map(cb => Number(cb.value));
        
        if (selected.length === 0) {
          valEl.innerHTML = '<div class="alert alert-danger" style="margin-bottom:15px;">⚠️ Please select at least one recipient from the list.</div>';
          return;
        }
        userIds = selected;
      }

      if (userIds.length === 0) {
        valEl.innerHTML = '<div class="alert alert-warning" style="margin-bottom:15px;">⚠️ No users matched.</div>';
        return;
      }

      const btn = $('nc-submit');
      btn.disabled = true;
      btn.textContent = `Sending to ${userIds.length} user(s)…`;

      try {
        const promises = userIds.map(uid => 
          A.adminFetch('/api/admin/notifications', {
            method: 'POST',
            body: JSON.stringify({ userId: uid, title, body, type, link }),
          })
        );

        await Promise.all(promises);

        A.showToast(`✅ Notification sent to ${userIds.length} user(s).`, 'success');
        window.location.hash = '#notifications';
      } catch (err) {
        valEl.innerHTML = `<div class="alert alert-danger" style="margin-bottom:15px;">❌ ${A.escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = 'Send Notification';
      }
    });
  })();
</script>
