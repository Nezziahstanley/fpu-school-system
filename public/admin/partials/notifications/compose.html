<!-- ============================================================
     Admin → Notifications → Compose
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Send Notification</h2>
    <p class="muted small">Send a notification or message to a user</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#notifications'">← Back</button>
  </div>
</section>

<div class="panel" style="max-width:700px; margin:0 auto;">
  <div class="panel-head"><h3>Compose</h3></div>
  <div class="panel-body">
    <form id="notif-form" data-skip-generic="1">
      <div class="form-group">
        <label class="form-label">Recipient <span class="req">*</span></label>
        <select class="form-select" id="nc-recipient" required>
          <option value="">Loading users…</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label">Type</label>
        <select class="form-select" id="nc-type">
          <option value="info">Info</option>
          <option value="warning">Warning</option>
          <option value="success">Success</option>
          <option value="complaint">Complaint</option>
          <option value="fee">Fee</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Title <span class="req">*</span></label>
        <input class="form-control" id="nc-title" required placeholder="e.g. Your fee payment was received" />
      </div>

      <div class="form-group">
        <label class="form-label">Message Body</label>
        <textarea class="form-control" id="nc-body" rows="5" placeholder="Type the full message here..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Link (optional)</label>
        <input class="form-control" id="nc-link" placeholder="e.g. /admin/app.html#payments" />
      </div>

      <div id="nc-validation"></div>

      <div class="form-actions" style="margin-top:20px;">
        <button type="submit" class="btn btn-primary">Send Notification</button>
        <button type="button" class="btn btn-outline" onclick="window.location.hash='#notifications'">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);
    
    // Load users into the dropdown
    try {
      const res = await A.adminFetch('/api/admin/user-list?limit=2000');
      const json = await res.json();
      const users = json.data || json || [];
      $('nc-recipient').innerHTML = '<option value="">— Choose a recipient —</option>' +
        users.map(u => `<option value="${u.id}">${A.escapeHtml(u.firstName || u.first_name)} ${A.escapeHtml(u.lastName || u.last_name)} (${A.escapeHtml(u.email || '')})</option>`).join('');
    } catch (err) {
      $('nc-recipient').innerHTML = '<option value="">Error loading users</option>';
    }

    // Submit form
    $('notif-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const valEl = $('nc-validation');
      valEl.innerHTML = '';

      const userId = Number($('nc-recipient').value);
      const title = $('nc-title').value.trim();
      const body = $('nc-body').value.trim();
      const type = $('nc-type').value;
      const link = $('nc-link').value.trim() || null;

      if (!userId) { valEl.innerHTML = '<div class="alert alert-danger" style="margin-bottom:15px;">⚠️ Please select a recipient.</div>'; return; }
      if (!title) { valEl.innerHTML = '<div class="alert alert-danger" style="margin-bottom:15px;">⚠️ Title is required.</div>'; return; }

      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        await A.adminFetch('/api/admin/notifications', {
          method: 'POST',
          body: JSON.stringify({ userId, title, body, type, link }),
        });
        A.showToast('✅ Notification sent.', 'success');
        window.location.hash = '#notifications';
      } catch (err) {
        valEl.innerHTML = `<div class="alert alert-danger" style="margin-bottom:15px;">❌ ${A.escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = 'Send Notification';
      }
    });
  })();
</script>
