<!-- ============================================================
     Admin → Notifications → Detail
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Notification</h2>
    <p class="muted small" id="nd-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#notifications'">← Back</button>
    <button class="btn btn-outline btn-sm" id="nd-mark-read">Mark Read</button>
    <button class="btn btn-ghost btn-sm" style="color:#dc2626;" id="nd-delete">Delete</button>
  </div>
</section>

<div id="nd-root">
  <div class="loading" style="padding:40px;text-align:center;"><span class="spinner"></span> Loading…</div>
</div>

<style>
  .notif-detail { max-width: 680px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 32px; box-shadow: 0 4px 20px rgba(15,23,42,0.06); border-top: 5px solid #065f46; }
  .notif-detail h1 { font-family: 'Poppins', sans-serif; font-size: 1.4rem; color: #0f172a; margin: 16px 0 8px; line-height: 1.35; }
  .notif-detail-meta { display: flex; gap: 14px; font-size: 12px; color: #6b7280; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e5e7eb; }
  .notif-detail-body { font-size: 15px; line-height: 1.8; color: #1f2937; white-space: pre-wrap; }
  .notif-detail-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 24px; padding: 10px 16px; background: #ecfdf5; border-radius: 8px; color: #065f46; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 13px; text-decoration: none; }
  .notif-detail-link:hover { background: #d1fae5; }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const root = document.getElementById('nd-root');

    if (!id) {
      root.innerHTML = '<div class="alert alert-warning" style="margin:20px;">No notification selected.</div>';
      return;
    }

    async function load() {
      root.innerHTML = '<div class="loading" style="padding:40px;text-align:center;"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await A.adminFetch('/api/admin/notifications');
        const json = await res.json();
        const list = json.data || json || [];
        const n = list.find((x) => Number(x.id) === Number(id));
        
        if (!n) throw new Error('Notification not found');

        const type = String(n.type || n.category || 'info').toLowerCase();
        const title = n.title || n.subject || 'No Title';
        const body = n.message || n.body || n.description || 'No content.';
        const createdAt = n.createdAt || n.created_at || Date.now();
        const isRead = n.isRead === true || n.is_read === true || n.status === 'read';
        
        let icon = 'ℹ️';
        if (type.includes('warn')) icon = '⚠️';
        if (type.includes('success')) icon = '✅';
        if (type.includes('complaint')) icon = '📩';
        if (type.includes('fee')) icon = '💰';

        document.getElementById('nd-subtitle').textContent = `${type.toUpperCase()} · ${A.timeAgo(createdAt)}`;

        root.innerHTML = `
          <div class="notif-detail">
            <div style="font-size:3rem;line-height:1;">${icon}</div>
            <h1>${A.escapeHtml(title)}</h1>
            <div class="notif-detail-meta">
              <span>📅 ${A.fmtDateTime(createdAt)}</span>
              <span>🏷️ ${A.escapeHtml(type)}</span>
              ${isRead ? '<span>✅ Read</span>' : '<span style="color:#b45309;font-weight:700;">● Unread</span>'}
            </div>
            <div class="notif-detail-body">${A.escapeHtml(body)}</div>
            ${n.link ? `<a class="notif-detail-link" href="${A.escapeHtml(n.link)}">Open linked page →</a>` : ''}
          </div>
        `;

        // Mark read automatically
        if (!isRead) {
          A.adminFetch(`/api/admin/notifications/${id}/read`, { method: 'POST' }).catch(() => {});
        }

        document.getElementById('nd-mark-read').onclick = async () => {
          try {
            await A.adminFetch(`/api/admin/notifications/${id}/read`, { method: 'POST' });
            A.showToast('✅ Marked read.', 'success');
            load();
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };

        document.getElementById('nd-delete').onclick = async () => {
          if (!(await window.fpuConfirm('Delete this notification?', { title: 'Delete Notification', type: 'danger', okText: 'Delete Notification' }))) return;
          try {
            await A.adminFetch(`/api/admin/notifications/${id}`, { method: 'DELETE' });
            A.showToast('🗑️ Deleted.', 'success');
            window.location.hash = '#notifications';
          } catch (err) { A.showToast('❌ ' + err.message, 'error'); }
        };
      } catch (err) {
        root.innerHTML = `<div class="alert alert-danger" style="margin:20px;">${A.escapeHtml(err.message)}</div>`;
      }
    }

    load();
  })();
</script>
