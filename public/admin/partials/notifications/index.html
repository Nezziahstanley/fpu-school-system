<!-- ============================================================
     Admin → Notifications
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Notifications</h2>
    <p class="muted small">System notifications and messages</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadNotifications()">Refresh</button>
    <button class="btn btn-outline btn-sm" id="nt-mark-all-read">✓ Mark all read</button>
    <button class="btn btn-primary btn-sm" onclick="FPU_ADMIN.openComposeNotificationModal()">+ Compose</button>
  </div>
</section>

<div class="filters" style="display:flex; gap:12px; margin-bottom:16px;">
  <select class="form-select" id="nt-filter-type" onchange="FPU_ADMIN.loadNotifications()" style="max-width:200px;">
    <option value="">All types</option>
    <option value="info">Info</option>
    <option value="warning">Warning</option>
    <option value="success">Success</option>
    <option value="complaint">Complaint</option>
    <option value="fee">Fee</option>
  </select>
  <select class="form-select" id="nt-filter-read" onchange="FPU_ADMIN.loadNotifications()" style="max-width:200px;">
    <option value="">All statuses</option>
    <option value="unread">Unread only</option>
    <option value="read">Read only</option>
  </select>
  <input type="text" class="form-control" id="nt-search" placeholder="Search title or body..." onkeyup="FPU_ADMIN.loadNotifications()" style="flex:1;">
</div>

<div class="stats-inline">
  <div class="stat-inline"><div class="label">Total</div><div class="value" id="nt-stat-total">—</div></div>
  <div class="stat-inline stat-inline-accent"><div class="label">Unread</div><div class="value" id="nt-stat-unread">—</div></div>
  <div class="stat-inline stat-inline-primary"><div class="label">This Week</div><div class="value" id="nt-stat-week">—</div></div>
  <div class="stat-inline stat-inline-success"><div class="label">High Priority</div><div class="value" id="nt-stat-high">—</div></div>
</div>

<div id="nt-list" class="nt-list">
  <div style="text-align:center; padding:40px; color:#94a3b8;"><span class="spinner"></span> Loading…</div>
</div>

<style>
  .nt-list { display: flex; flex-direction: column; gap: 10px; }
  .nt-item { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: box-shadow 0.2s; }
  .nt-item:hover { box-shadow: 0 4px 12px rgba(15,23,42,0.08); border-color: #cbd5e1; }
  .nt-item.unread { background: #f0fdf4; border-left: 4px solid #10b981; }
  .nt-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .nt-icon.info { background: #dbeafe; color: #1e40af; }
  .nt-icon.warning { background: #fef3c7; color: #92400e; }
  .nt-icon.success { background: #dcfce7; color: #15803d; }
  .nt-icon.complaint { background: #fee2e2; color: #991b1b; }
  .nt-icon.fee { background: #f3e8ff; color: #6b21a8; }
  .nt-body { flex: 1; min-width: 0; }
  .nt-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .nt-text { font-size: 13px; color: #64748b; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nt-meta { display: flex; gap: 10px; align-items: center; margin-top: 8px; font-size: 11.5px; color: #94a3b8; }
  .unread-pill { background: #dcfce7; color: #15803d; font-family: 'Poppins', sans-serif; font-size: 9.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; }
  .nt-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .nt-actions .btn { padding: 5px 10px; font-size: 11.5px; }
</style>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadNotifications) {
    setTimeout(window.FPU_ADMIN.loadNotifications, 100);
  }
</script>
