<!-- ============================================================
     Admin → Payments → By Department (Drill-down)
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="pd-title">Department Payments</h2>
    <p class="muted small" id="pd-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#payments'">← All Departments</button>
    <button class="btn btn-outline btn-sm" id="pd-export">⬇ Export CSV</button>
    <button class="btn btn-primary btn-sm" onclick="window.location.hash='#payment-form'">+ Record Payment</button>
  </div>
</section>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Students</div>
    <div class="value" id="pd-stat-students">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Fully Paid</div>
    <div class="value" id="pd-stat-fully">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Partial</div>
    <div class="value" id="pd-stat-partial">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Collected</div>
    <div class="value" id="pd-stat-collected">—</div>
  </div>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Payment Status</label>
    <select class="form-select" id="pd-filter-status" onchange="FPU_ADMIN.loadDepartmentPayments()">
      <option value="">All Students</option>
      <option value="paid">Fully Paid</option>
      <option value="partial">Partially Paid</option>
      <option value="pending">Pending / Not Paid</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="pd-search" placeholder="Name or matric…" onkeyup="FPU_ADMIN.loadDepartmentPayments()" />
  </div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-head">
    <h3>Students</h3>
    <span class="small muted" id="pd-count">Loading…</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th>Matric</th>
            <th>Student</th>
            <th style="width:80px;">Level</th>
            <th style="width:120px;text-align:right;">Total Due</th>
            <th style="width:120px;text-align:right;">Total Paid</th>
            <th style="width:120px;text-align:right;">Balance</th>
            <th style="width:110px;">Status</th>
            <th style="width:140px;text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="pd-tbody">
          <tr><td colspan="8" class="empty" style="text-align:center;padding:20px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  /* Status Badges */
  .badge { padding: 4px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; }
  .badge-paid    { background: #d1fae5; color: #065f46; }
  .badge-partial { background: #fef3c7; color: #92400e; }
  .badge-pending { background: #fee2e2; color: #991b1b; }

  /* ==========================================
     FORCE MODAL TO CENTER ON SCREEN
     ========================================== */
  .fpu-modal-backdrop {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    background: rgba(15, 23, 42, 0.65) !important;
    backdrop-filter: blur(2px);
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    z-index: 99999 !important;
    padding: 20px;
  }

  .fpu-modal {
    background: #fff !important;
    border-radius: 14px !important;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35) !important;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    width: 100%;
    max-width: 900px;
  }

  .fpu-modal-header {
    padding: 16px 24px !important;
    border-bottom: 1px solid #e2e8f0 !important;
    background: #f8fafc !important;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .fpu-modal-header h3 {
    margin: 0;
    font-size: 1.1rem;
    color: #0f172a;
    font-weight: 700;
  }

  .fpu-modal-body {
    padding: 20px 24px !important;
    overflow-y: auto !important;
    flex: 1;
  }

  .fpu-modal-footer {
    padding: 14px 24px !important;
    border-top: 1px solid #e2e8f0 !important;
    background: #f8fafc !important;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    flex-shrink: 0;
  }
</style>

<script>
  // Auto-load on page render
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadDepartmentPayments) {
    setTimeout(window.FPU_ADMIN.loadDepartmentPayments, 100);
  }
</script>
