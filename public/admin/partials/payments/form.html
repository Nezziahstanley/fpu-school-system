<!-- Admin → Payments → Form -->
<section class="page-head">
  <div><h2>New Payment Record</h2><p class="muted small">For offline / bank deposit entries</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('payments')">← Back</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Payment Details</h3></div>
  <div class="panel-body">
    <form id="payment-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Student <span class="req">*</span></label>
          <select class="form-select" name="studentId" data-lookup="students" required></select>
        </div>
        <div class="form-group"><label class="form-label">Session <span class="req">*</span></label>
          <select class="form-select" name="sessionId" data-lookup="sessions" required></select>
        </div>
        <div class="form-group"><label class="form-label">Fee Structure (optional)</label>
          <select class="form-select" name="feeStructureId" data-lookup="fee-structures">
            <option value="">—</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Amount <span class="req">*</span></label>
          <input class="form-control" type="number" step="0.01" name="amount" required />
        </div>
        <div class="form-group"><label class="form-label">Reference <span class="req">*</span></label>
          <input class="form-control" name="reference" required />
        </div>
        <div class="form-group"><label class="form-label">Bank Name</label><input class="form-control" name="bankName" /></div>
        <div class="form-group"><label class="form-label">Depositor Name</label><input class="form-control" name="depositorName" /></div>
        <div class="form-group"><label class="form-label">Deposit Date</label><input class="form-control" type="date" name="depositDate" /></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Payment</button>
        <button type="button" class="btn btn-ghost" onclick="FPU_ADMIN_SPA.navigateTo('payments')">Cancel</button>
      </div>
    </form>
  </div>
</div>
