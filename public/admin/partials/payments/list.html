<!-- ============================================================
     Admin → Payments → Department Overview
     ------------------------------------------------------------
     Per department:
       • # students who made payments
       • Total verified amount
       • Pending amount
       • Payment rate (verified vs total students in dept)
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2>Payments</h2>
    <p class="muted small">
      Payments grouped by department — click to see who has paid
    </p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadPaymentDepartments()">
      Refresh
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('payment-form')">
      + Record Payment
    </button>
  </div>
</section>

<!-- Stats -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta">
      <span class="label">Total Verified</span>
      <span class="value" id="pm-stat-verified">—</span>
    </div>
    <div class="ic">💰</div>
  </div>
  <div class="stat accent">
    <div class="meta">
      <span class="label">Pending Amount</span>
      <span class="value" id="pm-stat-pending-amt">—</span>
    </div>
    <div class="ic">⏳</div>
  </div>
  <div class="stat blue">
    <div class="meta">
      <span class="label">Pending Count</span>
      <span class="value" id="pm-stat-pending-count">—</span>
    </div>
    <div class="ic">📋</div>
  </div>
  <div class="stat purple">
    <div class="meta">
      <span class="label">Total Records</span>
      <span class="value" id="pm-stat-total">—</span>
    </div>
    <div class="ic">📊</div>
  </div>
</div>

<!-- Session picker -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="pm-session"
            data-lookup="sessions" data-placeholder="Current session"
            onchange="FPU_ADMIN.loadPaymentDepartments()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">School</label>
    <select class="form-select" id="pm-school"
            data-lookup="schools" data-placeholder="All schools"
            onchange="FPU_ADMIN.loadPaymentDepartments()"></select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="pm-search"
           placeholder="Department code or name…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadPaymentDepartments()" />
  </div>
</div>

<!-- Department grid -->
<div id="pm-dept-grid" class="pm-dept-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading departments…
  </div>
</div>

<style>
  .pm-dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .pm-dept-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .pm-dept-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #065f46, #10b981);
  }
  .pm-dept-card.has-pending::before {
    background: linear-gradient(90deg, #f59e0b, #fbbf24);
  }
  .pm-dept-card.empty::before {
    background: linear-gradient(90deg, #cbd5e1, #e2e8f0);
  }
  .pm-dept-card.empty { opacity: 0.65; cursor: default; }
  .pm-dept-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .pmd-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .pmd-code {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .pmd-school {
    background: linear-gradient(135deg,#065f46,#047857);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .pm-dept-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }
  .pmd-amounts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .pmd-amount {
    background: #f8fafc;
    border-radius: 8px;
    padding: 10px 8px;
    text-align: center;
  }
  .pmd-amount.verified {
    background: #ecfdf5;
  }
  .pmd-amount.pending {
    background: #fef3c7;
  }
  .pmd-amount .num {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1.1;
    word-break: break-all;
  }
  .pmd-amount.pending .num { color: #92400e; }
  .pmd-amount .label {
    display: block;
    font-size: 9px;
    color: #6b7280;
    font-weight: 700;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .pmd-split {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    font-size: 11px;
    text-align: center;
  }
  .pmd-split .item {
    background: #f8fafc;
    border-radius: 6px;
    padding: 6px 4px;
  }
  .pmd-split .item .n {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    color: #065f46;
    font-size: 0.95rem;
  }
  .pmd-split .item .l {
    display: block;
    font-size: 9px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }
  .pmd-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }
  .pmd-footer .arrow { color: #f59e0b; font-family: 'Poppins', sans-serif; }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadPaymentDepartments()
</script>
