<!-- ============================================================
     Admin → Registrations → By Course
     ------------------------------------------------------------
     Pick a course, see every student registered for it in the
     current filter (session + semester). Great for printing
     class rosters or approving a whole course at once.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Registrations by Course</h2>
    <p class="muted small">Who is registered for a given course</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('registrations')">
      ← By Student
    </button>
    <button class="btn btn-accent btn-sm" id="reg-course-bulk-approve">
      Approve All Pending
    </button>
  </div>
</section>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="reg-course-session"
            data-lookup="sessions" data-placeholder="Current session"
            onchange="FPU_ADMIN.loadCourseRegistrations()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">Semester</label>
    <select class="form-select" id="reg-course-semester"
            onchange="FPU_ADMIN.loadCourseRegistrations()">
      <option value="">All</option>
      <option value="first">First</option>
      <option value="second">Second</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Department</label>
    <select class="form-select" id="reg-course-dept"
            data-lookup="departments" data-placeholder="All departments"
            onchange="FPU_ADMIN.loadCourseRegistrations()"></select>
  </div>
  <div class="form-group" style="flex:2 1 260px;">
    <label class="form-label">Course</label>
    <select class="form-select" id="reg-course-course"
            data-lookup="courses"
            data-depends-on="reg-course-dept"
            data-param="departmentId"
            data-placeholder="All courses">
      <option value="">All courses</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Status</label>
    <select class="form-select" id="reg-course-status"
            onchange="FPU_ADMIN.loadCourseRegistrations()">
      <option value="">All statuses</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Course(s)</div>
    <div class="value" id="reg-crs-stat-courses">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Registrations</div>
    <div class="value" id="reg-crs-stat-rows">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Pending</div>
    <div class="value" id="reg-crs-stat-pending">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Approved</div>
    <div class="value" id="reg-crs-stat-approved">—</div>
  </div>
</div>

<!-- Roster table (grouped by course if "All") -->
<div id="reg-course-root">
  <div class="loading"><span class="spinner"></span> Loading roster…</div>
</div>

<style>
  .roster-course {
    margin-bottom: 20px;
    border: 1px solid var(--fpu-border);
    border-radius: 10px;
    overflow: hidden;
  }
  .roster-course-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    background: #f8fafc;
    border-bottom: 1px solid var(--fpu-border);
    gap: 12px;
    flex-wrap: wrap;
  }
  .roster-course-head .code {
    font-family: 'Courier New', monospace;
    font-weight: 700;
    color: #065f46;
    font-size: 13.5px;
    background: #ecfdf5;
    padding: 3px 10px;
    border-radius: 6px;
    margin-right: 8px;
  }
  .roster-course-head .title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    color: #0f172a;
    font-size: 14px;
  }
  .roster-course-head .meta {
    font-size: 12px;
    color: #6b7280;
  }
  .roster-course-head .meta strong {
    color: #f59e0b;
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
  }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadCourseRegistrations()
</script>
