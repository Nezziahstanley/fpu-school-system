<!-- ============================================================
     Admin → Schools → Overview
     ------------------------------------------------------------
     School cards showing:
       • departments count
       • programmes count
       • courses count + total credit units
       • students count
     Clicking a card opens the school's detail view with
     departments, programmes, and a full course breakdown.
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Schools</h2>
    <p class="muted small">Six schools of Federal Polytechnic Ugep</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadSchoolCards()">
      Refresh
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('school-form')">
      + New School
    </button>
  </div>
</section>

<!-- Overall stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total Schools</div>
    <div class="value" id="sch-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Departments</div>
    <div class="value" id="sch-stat-departments">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Programmes</div>
    <div class="value" id="sch-stat-programmes">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Students</div>
    <div class="value" id="sch-stat-students">—</div>
  </div>
</div>

<!-- School cards grid -->
<div id="school-card-grid" class="school-card-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading schools…
  </div>
</div>

<style>
  .school-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
    margin-top: 20px;
  }

  .school-card {
    background: #ffffff;
    border: 1px solid var(--fpu-border);
    border-radius: 16px;
    padding: 22px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    position: relative;
    overflow: hidden;
  }

  .school-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, #065f46 0%, #10b981 50%, #f59e0b 100%);
  }

  .school-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 32px rgba(15, 23, 42, 0.12);
    border-color: rgba(6, 95, 70, 0.3);
  }

  .school-card.empty {
    opacity: 0.7;
    cursor: default;
  }
  .school-card.empty:hover {
    transform: none;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    border-color: var(--fpu-border);
  }

  .sch-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .sch-code {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, #065f46, #047857);
    color: #ffffff;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 5px 12px;
    border-radius: 8px;
    text-transform: uppercase;
  }

  .sch-code::before {
    content: "🏛️";
    font-size: 12px;
    letter-spacing: 0;
  }

  .school-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.15rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }

  .sch-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .sch-stat {
    background: #f8fafc;
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sch-stat .num {
    font-family: 'Poppins', sans-serif;
    font-size: 1.35rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }

  .sch-stat.purple .num { color: #8b5cf6; }
  .sch-stat.blue .num   { color: #3b82f6; }
  .sch-stat.gold .num   { color: #f59e0b; }

  .sch-stat .label {
    font-size: 10.5px;
    color: #6b7280;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sch-depts {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-top: 4px;
  }

  .sch-dept-chip {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.4px;
  }

  .sch-dept-chip.more {
    background: #f1f5f9;
    color: #64748b;
  }

  .sch-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }

  .sch-footer .arrow {
    color: #f59e0b;
    font-family: 'Poppins', sans-serif;
  }
</style>

<script>
  // No inline loader — SPA init calls FPU_ADMIN.loadSchoolCards()
</script>
