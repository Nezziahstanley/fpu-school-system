<!-- Admin → Security -->
<section class="page-head">
  <div><h2>Security Events</h2><p class="muted small">Failed logins, blocked attempts, and forced logouts</p></div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadSecurity()">Refresh</button>
    <button class="btn btn-danger btn-sm" onclick="FPU_ADMIN.adminFetch('/api/admin/security/purge',{method:'POST'}).then(()=>FPU_ADMIN.toast('Expired sessions purged.','success')).catch(e=>FPU_ADMIN.toast(e.message,'error'))">Purge expired</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Recent Events</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Event</th><th>Severity</th><th>User</th><th>IP</th><th>Time</th></tr></thead>
        <tbody id="security-tbody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
