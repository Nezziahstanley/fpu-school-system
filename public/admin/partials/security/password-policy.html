<!-- ============================================================
     Admin → Security → Password Policy
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Password Policy</h2>
    <p class="muted small">Complexity, rotation, and lockout rules</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadPasswordPolicy()">
      Reset
    </button>
    <button class="btn btn-primary btn-sm" id="pp-save">
      💾 Save Policy
    </button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Complexity Requirements</h3></div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Minimum Length</label>
        <input class="form-control" type="number" id="pp-min-length" min="4" max="32" value="8" />
        <div class="form-help">Recommended: 8 or higher</div>
      </div>
      <div class="form-group">
        <label class="form-label">Require Uppercase Letter</label>
        <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
          <input type="checkbox" id="pp-require-uppercase" checked />
          <span>At least one A–Z</span>
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Require Number</label>
        <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
          <input type="checkbox" id="pp-require-number" checked />
          <span>At least one 0–9</span>
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Require Symbol</label>
        <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
          <input type="checkbox" id="pp-require-symbol" />
          <span>At least one symbol (!@#$…)</span>
        </label>
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Rotation &amp; Expiry</h3></div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Password Expiry (days)</label>
        <input class="form-control" type="number" id="pp-expiry" min="0" max="365" value="90" />
        <div class="form-help">0 = never expires (not recommended)</div>
      </div>
      <div class="form-group">
        <label class="form-label">Prevent Reuse of Last N Passwords</label>
        <input class="form-control" type="number" id="pp-prevent-reuse" min="0" max="20" value="3" />
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Lockout Rules</h3></div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Max Login Attempts</label>
        <input class="form-control" type="number" id="pp-max-attempts" min="3" max="20" value="5" />
        <div class="form-help">Account locked after this many failed attempts</div>
      </div>
      <div class="form-group">
        <label class="form-label">Lockout Duration (minutes)</label>
        <input class="form-control" type="number" id="pp-lockout-minutes" min="5" max="1440" value="15" />
      </div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Session Policy</h3></div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Idle Timeout (minutes)</label>
        <input class="form-control" type="number" id="pp-idle-timeout" min="5" max="480" value="60" />
      </div>
      <div class="form-group">
        <label class="form-label">Allow Multiple Concurrent Sessions</label>
        <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
          <input type="checkbox" id="pp-allow-concurrent" checked />
          <span>Allow same user on multiple devices</span>
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Max Concurrent Sessions</label>
        <input class="form-control" type="number" id="pp-max-concurrent" min="1" max="10" value="3" />
      </div>
    </div>
  </div>
</div>

<div id="pp-validation"></div>

<script>
  // SPA init calls FPU_ADMIN.loadPasswordPolicy()
</script>
