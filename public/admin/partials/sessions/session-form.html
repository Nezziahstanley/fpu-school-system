<!-- Admin → Academics → Session Form (Create / Edit) -->
<section class="page-head">
  <div>
    <h2 id="session-form-title">New Academic Session</h2>
    <p class="muted small" id="session-form-subtitle">e.g. 2026/2027</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('sessions')">← Back</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Session Details</h3></div>
  <div class="panel-body">
    <form id="session-form" data-skip-generic="1">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Session Name <span class="req">*</span></label>
          <input class="form-control" name="name" id="session-name"
                 placeholder="2026/2027" required
                 pattern="\d{4}/\d{4}"
                 title="Format: YYYY/YYYY"
                 autocomplete="off" />
          <div class="form-help">Format: <code>YYYY/YYYY</code> — e.g. 2026/2027</div>
        </div>
        <div class="form-group">
          <label class="form-label">Start Date <span class="req">*</span></label>
          <input class="form-control" type="date" name="startDate" id="session-start" required />
        </div>
        <div class="form-group">
          <label class="form-label">End Date <span class="req">*</span></label>
          <input class="form-control" type="date" name="endDate" id="session-end" required />
        </div>
        <div class="form-group" style="display:flex;align-items:flex-end;">
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;cursor:pointer;">
            <input type="checkbox" name="isCurrent" id="session-current" />
            <span>Set as current session</span>
          </label>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="session-submit">Create Session</button>
        <button type="button" class="btn btn-ghost" id="session-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Edit-mode info panel (shown only when editing) -->
<div class="panel" id="session-edit-info" style="display:none; margin-top: 16px;">
  <div class="panel-head"><h3>Session Info</h3></div>
  <div class="panel-body">
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
      <div>
        <div class="small muted" style="text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:4px;">Enrolled Students</div>
        <div style="font-family:'Poppins',sans-serif;font-size:1.5rem;font-weight:800;color:#065f46;" id="session-student-count">—</div>
      </div>
      <div>
        <div class="small muted" style="text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:4px;">Status</div>
        <div id="session-status-badge">—</div>
      </div>
      <div>
        <div class="small muted" style="text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:4px;">Created</div>
        <div style="font-size:13px;color:#0f172a;font-weight:600;" id="session-created-at">—</div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    'use strict';

    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    // ============================================================
    // CRITICAL FIX: Wait for the SPA router to update the hash
    // The router sets window.location.hash AFTER the partial
    // loads, so we need to poll for it briefly.
    // ============================================================
    function waitForHashId(callback, attemptsLeft) {
      attemptsLeft = attemptsLeft === undefined ? 20 : attemptsLeft;

      const hash = window.location.hash.replace(/^#/, '');
      const qIdx = hash.indexOf('?');
      const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
      const id = params.get('id');

      if (id || attemptsLeft <= 0) {
        callback(id || null);
        return;
      }
      setTimeout(() => waitForHashId(callback, attemptsLeft - 1), 50);
    }

    // ============================================================
    // Styled confirm helper
    // ============================================================
    async function styledConfirm(message, options) {
      if (typeof window.fpuConfirm === 'function') {
        return await window.fpuConfirm(message, options || {});
      }
      return window.__fpuNativeConfirm ? window.__fpuNativeConfirm(message) : confirm(message);
    }

    // ============================================================
    // Track dirty state
    // ============================================================
    let isDirty = false;

    function markDirty() { isDirty = true; }

    // ============================================================
    // Init with the resolved ID
    // ============================================================
    waitForHashId(async function (id) {
      const isEdit = !!id;

      if (isEdit) {
        $('session-form-title').textContent = 'Edit Academic Session';
        $('session-form-subtitle').textContent = 'Update this session\'s details';
        $('session-submit').textContent = 'Update Session';
        $('session-edit-info').style.display = 'block';
      } else {
        // Set sensible defaults for new session
        const now = new Date();
        const currentYear = now.getFullYear();
        const nextYear = currentYear + 1;
        // e.g. 2027/2028
        $('session-name').value = `${currentYear}/${nextYear}`;
        // Default start: October 1 of current year
        // Default end: July 31 of next year
        const startDate = new Date(currentYear, 9, 1);
        const endDate = new Date(nextYear, 6, 31);
        $('session-start').value = startDate.toISOString().slice(0, 10);
        $('session-end').value = endDate.toISOString().slice(0, 10);
      }

      // ============================================================
      // Load existing data if editing
      // ============================================================
      async function load() {
        if (!isEdit) return;
        try {
          const res = await A.adminFetch(`/api/admin/sessions/${id}`);
          const json = await res.json();
          if (!json.success) throw new Error(json.error);
          const s = json.data;

          $('session-name').value = s.name || '';
          $('session-start').value = s.startDate ? String(s.startDate).slice(0, 10) : '';
          $('session-end').value = s.endDate ? String(s.endDate).slice(0, 10) : '';
          $('session-current').checked = !!s.isCurrent;

          // Update edit info panel
          $('session-created-at').textContent = s.createdAt ? A.fmtDate(s.createdAt) : '—';
          $('session-status-badge').innerHTML = s.isCurrent
            ? '<span class="badge badge-success">Current Session</span>'
            : '<span class="badge badge-muted">Past Session</span>';

          // Try to load student count for this session
          try {
            const stuRes = await A.adminFetch(`/api/admin/students?sessionId=${id}&limit=5000`);
            const stuJson = await stuRes.json();
            const count = (stuJson.data || []).length;
            $('session-student-count').textContent = count;
          } catch (e) {
            $('session-student-count').textContent = '—';
          }
        } catch (err) {
          A.showToast('❌ ' + err.message, 'error');
        }
      }

      // ============================================================
      // Wire dirty tracking
      // ============================================================
      $('session-form').addEventListener('input', markDirty);
      $('session-form').addEventListener('change', markDirty);

      // ============================================================
      // Cancel with unsaved-changes warning
      // ============================================================
      $('session-cancel').onclick = async () => {
        if (isDirty) {
          const ok = await styledConfirm(
            'You have unsaved changes. Discard them and go back?',
            {
              title: 'Discard Changes?',
              type: 'warning',
              okText: 'Discard & Go Back',
              cancelText: 'Keep Editing',
            }
          );
          if (!ok) return;
        }
        A.FPU_ADMIN_SPA.navigateTo('sessions');
      };

      // ============================================================
      // Date validation: end must be after start
      // ============================================================
      $('session-start').addEventListener('change', () => {
        const start = $('session-start').value;
        const end = $('session-end').value;
        if (start && end && new Date(start) >= new Date(end)) {
          $('session-end').setCustomValidity('End date must be after start date');
        } else {
          $('session-end').setCustomValidity('');
        }
      });

      $('session-end').addEventListener('change', () => {
        const start = $('session-start').value;
        const end = $('session-end').value;
        if (start && end && new Date(start) >= new Date(end)) {
          $('session-end').setCustomValidity('End date must be after start date');
        } else {
          $('session-end').setCustomValidity('');
        }
      });

      // ============================================================
      // Submit
      // ============================================================
      $('session-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Validate
        const name = $('session-name').value.trim();
        if (!/^\d{4}\/\d{4}$/.test(name)) {
          A.showToast('⚠️ Session name must be YYYY/YYYY (e.g. 2026/2027).', 'warning');
          $('session-name').focus();
          return;
        }

        const startDate = $('session-start').value;
        const endDate = $('session-end').value;

        if (!startDate || !endDate) {
          A.showToast('⚠️ Both start and end dates are required.', 'warning');
          return;
        }

        if (new Date(startDate) >= new Date(endDate)) {
          A.showToast('⚠️ End date must be after start date.', 'warning');
          $('session-end').focus();
          return;
        }

        const isCurrent = $('session-current').checked;

        // Extra confirmation when setting as current
        if (isCurrent) {
          const ok = await styledConfirm(
            `Set "${name}" as the current academic session?\n\nThe previously current session will become past.`,
            {
              title: 'Set Current Session?',
              type: 'warning',
              okText: 'Yes, Set Current',
            }
          );
          if (!ok) return;
        }

        const payload = { name, startDate, endDate, isCurrent };

        const btn = $('session-submit');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = isEdit ? 'Updating…' : 'Creating…';

        try {
          const url = isEdit ? `/api/admin/sessions/${id}` : '/api/admin/sessions';
          const method = isEdit ? 'PUT' : 'POST';

          const res = await A.adminFetch(url, {
            method,
            body: JSON.stringify(payload),
          });
          const json = await res.json();
          if (!json.success) throw new Error(json.error);

          A.showToast(isEdit ? '✅ Session updated.' : '✅ Session created.', 'success');
          isDirty = false;
          A.FPU_ADMIN_SPA.navigateTo('sessions');
        } catch (err) {
          A.showToast('❌ ' + err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = original;
        }
      });

      load();
    });
  })();
</script>
