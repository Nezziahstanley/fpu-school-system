<form class="settings-form" data-settings-section="academic" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Current Session &amp; Semester</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Current Session <span class="req">*</span></label>
          <input class="form-control" name="current_session" placeholder="2025/2026" />
          <div class="form-help">Must match an existing academic session name.</div>
        </div>
        <div class="form-group">
          <label class="form-label">Current Semester <span class="req">*</span></label>
          <select class="form-select" name="current_semester">
            <option value="first">First Semester</option>
            <option value="second">Second Semester</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Course &amp; Unit Rules</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Max Units per Semester</label>
          <input class="form-control" type="number" name="max_units" min="6" max="40" value="24" />
        </div>
        <div class="form-group">
          <label class="form-label">Min Units per Semester</label>
          <input class="form-control" type="number" name="min_units" min="1" max="20" value="12" />
        </div>
        <div class="form-group">
          <label class="form-label">Pass Mark</label>
          <input class="form-control" type="number" name="pass_mark" min="0" max="100" value="40" />
          <div class="form-help">Below this mark = F grade</div>
        </div>
        <div class="form-group">
          <label class="form-label">Min Graduation CGPA</label>
          <input class="form-control" type="number" step="0.01" name="min_graduation_cgpa" min="0" max="4" value="2.00" />
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Result Workflow</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="require_hod_verification" checked />
            <span>Require HOD verification before admin approval</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="auto_publish_results" />
            <span>Auto-publish results after approval</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-academic"></span>
    <button type="submit" class="btn btn-primary">💾 Save Academic Settings</button>
  </div>
</form>
