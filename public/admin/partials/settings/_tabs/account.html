<div class="panel">
  <div class="panel-head"><h3>Profile Photo</h3></div>
  <div class="panel-body">
    <div class="photo-uploader">
      <div class="preview" id="acc-photo-preview" style="width:96px;height:96px;border-radius:50%;background:#065f46;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;overflow:hidden;">A</div>
      <input type="file" id="acc-photo-file" accept="image/*" style="display:none;" />
      <button class="btn btn-primary" id="acc-photo-pick">Choose Photo</button>
      <p class="hint small muted">JPG or PNG · max 5 MB</p>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Change Password</h3></div>
  <div class="panel-body">
    <form id="acc-pwd-form">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input class="form-control" type="password" name="currentPassword" required />
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-control" type="password" name="newPassword" required />
          <div class="form-help">Minimum 6 characters.</div>
        </div>
      </div>
      <div id="acc-pwd-validation"></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Password</button>
      </div>
    </form>
  </div>
</div>
