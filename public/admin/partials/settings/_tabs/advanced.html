<!-- ============================================================
     Admin → Settings → Advanced
     ============================================================ -->
<div class="alert alert-warning" style="margin-bottom: 24px; display: flex; gap: 12px; align-items: flex-start; background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; padding: 16px; border-radius: 8px;">
  <div style="font-size: 1.2rem;">⚠️</div>
  <div>
    <strong style="display: block; margin-bottom: 4px;">Advanced: Raw Settings Table</strong>
    <span style="font-size: 13px;">Edit values only if you know exactly what you are doing. Incorrect values can break the application.</span>
  </div>
</div>

<div class="panel">
  <div class="panel-head" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
    <h3 style="margin: 0;">All Settings</h3>
    <div style="display: flex; gap: 8px;">
      <input class="form-control" id="adv-search" placeholder="Search by key or category..." style="width: 250px;" onkeydown="if(event.key==='Enter')FPU_ADMIN.loadAdvancedSettings()" />
      <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadAdvancedSettings()">Search</button>
    </div>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th style="width: 25%;">Key</th>
            <th style="width: 15%;">Category</th>
            <th>Value</th>
            <th style="width: 15%;">Last Updated</th>
            <th style="width: 80px; text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="adv-tbody">
          <tr><td colspan="5" class="empty" style="text-align: center; padding: 40px; color: #64748b;">Loading settings...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
