<!-- Settings tab: Advanced (raw key/value) -->
<div class="info-banner" style="max-width:none;">
  <strong>⚠️ Advanced:</strong> Raw settings table. Use this only if you know what you're doing.
  Wrong values can break the app.
</div>

<div class="panel">
  <div class="panel-head">
    <h3>All Settings</h3>
    <div class="tools">
      <input class="form-control form-control-sm" id="adv-search" placeholder="Search key…" style="max-width:200px;"
             onkeydown="if(event.key==='Enter')FPU_ADMIN.loadAdvancedSettings()" />
      <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadAdvancedSettings()">Search</button>
    </div>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th style="width:280px;">Key</th>
            <th style="width:140px;">Category</th>
            <th>Value</th>
            <th style="width:100px;">Actions</th>
          </tr>
        </thead>
        <tbody id="adv-tbody">
          <tr><td colspan="4" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
