<form class="settings-form" data-settings-section="attendance" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Attendance Rules</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Minimum Attendance % for Exam</label>
          <input class="form-control" type="number" name="attendance_min_percent" value="75" min="0" max="100" />
          <div class="form-help">NBTE requirement: 75%</div>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="attendance_count_late_present" checked />
            <span>Count late as present</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="attendance_count_excused_present" checked />
            <span>Count excused as present</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Late Marking</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Grace Period (minutes)</label>
          <input class="form-control" type="number" name="attendance_grace_minutes" value="10" min="0" max="60" />
        </div>
        <div class="form-group">
          <label class="form-label">Auto-Mark Absent After (min)</label>
          <input class="form-control" type="number" name="attendance_absent_after" value="30" min="0" max="120" />
        </div>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-attendance"></span>
    <button type="submit" class="btn btn-primary">💾 Save Attendance Settings</button>
  </div>
</form>
