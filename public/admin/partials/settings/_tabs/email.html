<form class="settings-form" data-settings-section="email" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Master Switch</h3></div>
    <div class="panel-body">
      <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
        <input type="checkbox" name="email_enabled" />
        <span>Enable outgoing emails</span>
      </label>
      <div class="form-help">When disabled, all email sending is silently skipped.</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>SMTP Server</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">SMTP Host</label>
          <input class="form-control" name="smtp_host" placeholder="smtp.gmail.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Port</label>
          <input class="form-control" type="number" name="smtp_port" value="587" />
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" name="smtp_user" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position:relative;">
            <input class="form-control" type="password" name="smtp_pass" id="smtp-pass" />
            <button type="button" class="btn btn-ghost btn-sm" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);"
                    onclick="document.getElementById('smtp-pass').type = document.getElementById('smtp-pass').type === 'password' ? 'text' : 'password'">
              👁
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">From Address</label>
          <input class="form-control" name="email_from" placeholder="FPU <no-reply@fedpolyugep.edu.ng>" />
        </div>
        <div class="form-group">
          <label class="form-label">Use TLS/SSL</label>
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="smtp_secure" />
            <span>Enable (usually port 465)</span>
          </label>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline btn-sm" id="smtp-test-btn">
          📧 Send Test Email
        </button>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-email"></span>
    <button type="submit" class="btn btn-primary">💾 Save Email Settings</button>
  </div>
</form>
