<form class="settings-form" data-settings-section="features" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Feature Toggles</h3></div>
    <div class="panel-body">
      <div class="features-grid">
        <label class="feature-toggle">
          <input type="checkbox" name="feature_library" checked />
          <div class="ft-icon">📚</div>
          <div class="ft-body">
            <div class="ft-title">Library Module</div>
            <div class="ft-desc">Books, borrows, fines, reservations</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_hostel" />
          <div class="ft-icon">🏠</div>
          <div class="ft-body">
            <div class="ft-title">Hostel Management</div>
            <div class="ft-desc">Room allocation, occupancy, payments</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_transcript" checked />
          <div class="ft-icon">📜</div>
          <div class="ft-body">
            <div class="ft-title">Transcript Generation</div>
            <div class="ft-desc">Public transcript requests</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_sms" />
          <div class="ft-icon">💬</div>
          <div class="ft-body">
            <div class="ft-title">SMS Notifications</div>
            <div class="ft-desc">Send SMS via provider</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_2fa" checked />
          <div class="ft-icon">🔐</div>
          <div class="ft-body">
            <div class="ft-title">Two-Factor Auth</div>
            <div class="ft-desc">Allow 2FA for any user</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_elections" />
          <div class="ft-icon">🗳️</div>
          <div class="ft-body">
            <div class="ft-title">Student Elections</div>
            <div class="ft-desc">Online voting for SUG</div>
          </div>
        </label>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-features"></span>
    <button type="submit" class="btn btn-primary">💾 Save Feature Flags</button>
  </div>
</form>

<style>
  .features-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
  }
  .feature-toggle {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 16px;
    background: #f8fafc;
    border: 1px solid var(--fpu-border);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .feature-toggle:hover { background: #ecfdf5; border-color: rgba(6,95,70,0.2); }
  .feature-toggle input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: #065f46;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .ft-icon { font-size: 1.4rem; flex-shrink: 0; }
  .ft-body { flex: 1; min-width: 0; }
  .ft-title {
    font-family: 'Poppins', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 2px;
  }
  .ft-desc {
    font-size: 12px;
    color: #6b7280;
    line-height: 1.5;
  }
</style>
