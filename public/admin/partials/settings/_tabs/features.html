<form class="settings-form" data-settings-section="features" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Feature Toggles</h3></div>
    <div class="panel-body">
      <div class="features-grid">
        <label class="feature-toggle">
          <input type="checkbox" name="feature_library" checked />
          <div class="ft-icon">📚</div>
          <div class="ft-body">
            <div class="ft-title">Library Module</div>
            <div class="ft-desc">Books, borrows, fines, reservations</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_transcript" checked />
          <div class="ft-icon">📜</div>
          <div class="ft-body">
            <div class="ft-title">Transcript Generation</div>
            <div class="ft-desc">Public transcript requests</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_sms" />
          <div class="ft-icon">💬</div>
          <div class="ft-body">
            <div class="ft-title">SMS Notifications</div>
            <div class="ft-desc">Send SMS via provider</div>
          </div>
        </label>
        <label class="feature-toggle">
          <input type="checkbox" name="feature_2fa" checked />
          <div class="ft-icon">🔐</div>
          <div class="ft-body">
            <div class="ft-title">Two-Factor Auth</div>
            <div class="ft-desc">Allow 2FA for any user</div>
          </div>
        </label>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-features"></span>
    <button type="submit" class="btn btn-primary">💾 Save Feature Flags</button>
  </div>
</form>
