<!-- ============================================================
     Admin → Settings → Finance
     ============================================================ -->
<div class="panel">
  <div class="panel-head" style="display: flex; justify-content: space-between; align-items: center;">
    <h3>Bank Accounts</h3>
    <button class="btn btn-sm btn-outline" onclick="FPU_ADMIN.addBankAccount()">+ Add Account</button>
  </div>
  <div class="panel-body">
    <div id="bank-accounts-list" class="bank-accounts-list">
      <p class="muted"><span class="spinner"></span> Loading bank accounts…</p>
    </div>
  </div>
</div>

<div class="panel" style="margin-top: 20px;">
  <div class="panel-head">
    <h3>Payment Rules</h3>
  </div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Payment Reference Prefix</label>
        <input class="form-control" name="payment_ref_prefix" value="FPU" />
      </div>
      <div class="form-group">
        <label class="form-label">Late Payment Fee (%)</label>
        <input class="form-control" type="number" name="late_fee_percent" value="5" />
      </div>
      <div class="form-group">
        <label class="form-label">Auto-Verify Below (₦)</label>
        <input class="form-control" type="number" name="auto_verify_amount" value="0" />
        <div class="small muted" style="margin-top: 4px;">0 = always require manual verification</div>
      </div>
      <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-top: 24px;">
        <input type="checkbox" id="allow_installments" name="allow_installments" checked />
        <label for="allow_installments" class="form-label" style="margin: 0;">Allow installment payments</label>
      </div>
    </div>
  </div>
</div>

<div style="margin-top: 24px; text-align: right;">
  <button class="btn btn-primary" onclick="FPU_ADMIN.saveSettingsSection(this.closest('.tab-content'))">
    💾 Save Finance Settings
  </button>
</div>
