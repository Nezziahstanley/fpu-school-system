<form class="settings-form" data-settings-section="institution" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Institution Logo</h3></div>
    <div class="panel-body">
      <div class="admin-avatar-uploader" id="institution-logo-uploader" style="cursor:pointer;">
        <input type="file" id="institution-logo-file" accept="image/*" style="display:none" />
        <div class="avatar-preview" id="institution-logo-preview" style="border-radius:14px; background:#065f46; color:#fff; font-size:32px;">🏛️</div>
        <p class="upload-hint"><strong>Click to upload logo</strong><br/>PNG or JPG · Max 2 MB</p>
      </div>
      <div class="form-group" style="margin-top:16px;">
        <label class="form-label">Or paste a logo URL</label>
        <input class="form-control" name="institution_logo_url" placeholder="/images/logo.png" />
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Identity</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group" style="grid-column:span 2;">
          <label class="form-label">Institution Name <span class="req">*</span></label>
          <input class="form-control" name="institution_name" required placeholder="Federal Polytechnic Ugep" />
        </div>
        <div class="form-group">
          <label class="form-label">Short Name</label>
          <input class="form-control" name="institution_short" maxlength="10" placeholder="FPU" />
        </div>
        <div class="form-group">
          <label class="form-label">Motto</label>
          <input class="form-control" name="institution_motto" placeholder="Citadel of Technical Excellence" />
        </div>
        <div class="form-group">
          <label class="form-label">State</label>
          <input class="form-control" name="institution_state" placeholder="Cross River State" />
        </div>
        <div class="form-group">
          <label class="form-label">Country</label>
          <input class="form-control" name="institution_country" placeholder="Nigeria" />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <textarea class="form-control" name="institution_address" rows="2" placeholder="Full postal address"></textarea>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Contact</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Primary Phone</label>
          <input class="form-control" name="institution_phone" placeholder="+234…" />
        </div>
        <div class="form-group">
          <label class="form-label">Support Email</label>
          <input class="form-control" type="email" name="institution_email" placeholder="contact@fedpolyugep.edu.ng" />
        </div>
        <div class="form-group">
          <label class="form-label">Website</label>
          <input class="form-control" name="institution_website" placeholder="https://fedpolyugep.edu.ng" />
        </div>
        <div class="form-group">
          <label class="form-label">Matric Prefix</label>
          <input class="form-control" name="matric_prefix" maxlength="6" placeholder="FPU" />
          <div class="form-help">e.g. <code>FPU/SST/CST/ND/26/001</code></div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Branding</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Favicon URL</label>
          <input class="form-control" name="institution_favicon_url" placeholder="/images/favicon.ico" />
        </div>
        <div class="form-group">
          <label class="form-label">Primary Colour</label>
          <input class="form-control" type="color" name="institution_primary_color" value="#065f46" />
        </div>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-institution"></span>
    <button type="submit" class="btn btn-primary">💾 Save Institution Settings</button>
  </div>
</form>
