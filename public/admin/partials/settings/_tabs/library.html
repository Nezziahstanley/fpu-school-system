<form class="settings-form" data-settings-section="library" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Borrowing Rules</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Default Loan Duration (days)</label>
          <input class="form-control" type="number" name="library_loan_days" value="14" min="1" max="90" />
        </div>
        <div class="form-group">
          <label class="form-label">Max Books Per User</label>
          <input class="form-control" type="number" name="library_max_books_per_user" value="3" min="1" max="20" />
        </div>
        <div class="form-group">
          <label class="form-label">Max Renewals Per Book</label>
          <input class="form-control" type="number" name="library_max_renewals" value="1" min="0" max="5" />
        </div>
        <div class="form-group">
          <label class="form-label">Renewal Duration (days)</label>
          <input class="form-control" type="number" name="library_renewal_days" value="7" min="1" max="30" />
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Fines</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Fine Per Day Overdue (₦)</label>
          <input class="form-control" type="number" name="library_fine_per_day" value="50" min="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Max Fine Per Book (₦)</label>
          <input class="form-control" type="number" name="library_max_fine" value="2000" min="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Lost Book Fine (₦)</label>
          <input class="form-control" type="number" name="library_lost_fine" value="5000" min="0" />
        </div>
        <div class="form-group">
          <label class="form-label">Damaged Book Fine (₦)</label>
          <input class="form-control" type="number" name="library_damaged_fine" value="2500" min="0" />
        </div>
      </div>
      <div class="form-actions" style="margin-top:16px;">
        <button type="button" class="btn btn-outline btn-sm" id="library-sweep-btn">⏰ Run Overdue Sweep Now</button>
      </div>
      <div id="library-sweep-result" style="margin-top:12px;"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Reservations</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="library_enable_reservations" checked />
            <span>Enable reservations</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label">Reservation Hold (days)</label>
          <input class="form-control" type="number" name="library_reservation_hold_days" value="3" min="1" max="14" />
        </div>
        <div class="form-group">
          <label class="form-label">Max Active Reservations</label>
          <input class="form-control" type="number" name="library_max_reservations" value="2" min="1" max="10" />
        </div>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-library"></span>
    <button type="submit" class="btn btn-primary">💾 Save Library Settings</button>
  </div>
</form>
