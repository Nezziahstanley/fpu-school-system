<form class="settings-form" data-settings-section="localisation" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Time Zone &amp; Date</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Time Zone</label>
          <select class="form-select" name="timezone">
            <option value="Africa/Lagos" selected>Africa/Lagos (WAT — UTC+1)</option>
            <option value="Africa/Accra">Africa/Accra (GMT — UTC+0)</option>
            <option value="UTC">UTC</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Date Format</label>
          <select class="form-select" name="date_format">
            <option value="DD/MM/YYYY" selected>DD/MM/YYYY</option>
            <option value="MM/DD/YYYY">MM/DD/YYYY</option>
            <option value="YYYY-MM-DD">YYYY-MM-DD</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Language</label>
          <select class="form-select" name="language">
            <option value="en" selected>English</option>
            <option value="fr">Français</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-localisation"></span>
    <button type="submit" class="btn btn-primary">💾 Save Localisation</button>
  </div>
</form>
