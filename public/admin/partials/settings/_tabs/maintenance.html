<form class="settings-form" data-settings-section="maintenance" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel" style="border-left:4px solid #f59e0b;">
    <div class="panel-head"><h3>⚠️ Maintenance Mode</h3></div>
    <div class="panel-body">
      <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
        <input type="checkbox" name="maintenance_mode" />
        <span>Put the system into maintenance mode</span>
      </label>
      <div class="form-help" style="margin-bottom:14px;">Non-admin users see a maintenance page. Admins retain full access.</div>

      <div class="form-group">
        <label class="form-label">Maintenance Message</label>
        <textarea class="form-control" name="maintenance_message" rows="3">The system is under scheduled maintenance. Please try again later.</textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Estimated Return</label>
        <input class="form-control" type="datetime-local" name="maintenance_until" />
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-maintenance"></span>
    <button type="submit" class="btn btn-primary">💾 Save Maintenance Settings</button>
  </div>
</form>
