<form class="settings-form" data-settings-section="registrations" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Registration Window</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Registration Opens</label>
          <input class="form-control" type="datetime-local" name="registration_opens_at" />
        </div>
        <div class="form-group">
          <label class="form-label">Registration Closes</label>
          <input class="form-control" type="datetime-local" name="registration_closes_at" />
        </div>
        <div class="form-group">
          <label class="form-label">Late Registration Closes</label>
          <input class="form-control" type="datetime-local" name="registration_late_closes_at" />
        </div>
        <div class="form-group">
          <label class="form-label">Late Registration Fee (₦)</label>
          <input class="form-control" type="number" name="registration_late_fee" value="0" min="0" />
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Registration Rules</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Require Fee Payment Before Registration</label>
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="registration_require_payment" checked />
            <span>Students must pay first</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label">Require Clearance Before Registration</label>
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="registration_require_clearance" />
            <span>Must have an approved clearance</span>
          </label>
        </div>
        <div class="form-group">
          <label class="form-label">Auto-Approve Registrations</label>
          <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
            <input type="checkbox" name="registration_auto_approve" />
            <span>Skip HOD approval</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-registrations"></span>
    <button type="submit" class="btn btn-primary">💾 Save Registration Settings</button>
  </div>
</form>
