<form class="settings-form" data-settings-section="sms" onsubmit="event.preventDefault(); FPU_ADMIN.saveSettingsSection(this)">
  <div class="panel">
    <div class="panel-head"><h3>Master Switch</h3></div>
    <div class="panel-body">
      <label class="form-label" style="display:flex;align-items:center;gap:.5rem;font-weight:400;">
        <input type="checkbox" name="sms_enabled" />
        <span>Enable outgoing SMS</span>
      </label>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>Provider</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">SMS Provider</label>
          <select class="form-select" name="sms_provider">
            <option value="termii" selected>Termii (Nigeria)</option>
            <option value="twilio">Twilio</option>
            <option value="africastalking">Africa's Talking</option>
            <option value="bulksmsnigeria">BulkSMS Nigeria</option>
            <option value="custom">Custom HTTP API</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Sender ID</label>
          <input class="form-control" name="sms_sender_id" value="FPU" maxlength="11" />
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h3>API Credentials</h3></div>
    <div class="panel-body">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">API Key</label>
          <input class="form-control" type="password" name="sms_api_key" />
        </div>
        <div class="form-group">
          <label class="form-label">API Secret</label>
          <input class="form-control" type="password" name="sms_api_secret" />
        </div>
      </div>
      <div class="form-actions" style="margin-top:16px;">
        <button type="button" class="btn btn-outline btn-sm" id="sms-test-btn">📱 Send Test SMS</button>
      </div>
      <div id="sms-test-result" style="margin-top:12px;"></div>
    </div>
  </div>

  <div class="settings-save-bar">
    <span class="small muted" id="save-status-sms"></span>
    <button type="submit" class="btn btn-primary">💾 Save SMS Settings</button>
  </div>
</form>
