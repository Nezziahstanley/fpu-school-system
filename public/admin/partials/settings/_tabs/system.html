<div class="panel" style="border-left:4px solid #065f46;">
  <div class="panel-head"><h3>📦 Current System</h3></div>
  <div class="panel-body">
    <div class="grid grid-2" style="gap:16px;">
      <div class="field-row"><div class="k">App Name</div><div class="v"><strong id="sys-name">—</strong></div></div>
      <div class="field-row"><div class="k">Version</div><div class="v"><code id="sys-version">—</code></div></div>
      <div class="field-row"><div class="k">Node.js</div><div class="v" id="sys-node">—</div></div>
      <div class="field-row"><div class="k">Environment</div><div class="v"><span class="badge badge-success" id="sys-env">—</span></div></div>
    </div>
  </div>
</div>

<div class="panel" style="border-left:4px solid #3b82f6;">
  <div class="panel-head"><h3>🚀 Deploy New Version</h3></div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Target Branch</label>
        <select class="form-select" id="deploy-branch">
          <option value="main">main (production)</option>
          <option value="develop">develop (staging)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Deployment Notes</label>
        <input class="form-control" id="deploy-notes" placeholder="Optional description" />
      </div>
    </div>
    <div class="form-actions" style="margin-top:16px;">
      <button class="btn btn-primary" id="deploy-now-btn">🚀 Deploy Now</button>
      <button class="btn btn-outline" id="deploy-check-btn">🔍 Check GitHub Status</button>
    </div>
    <div id="deploy-status" style="margin-top:16px;"></div>

    <h4 style="margin:24px 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:#6b7280;">Recent Deployments</h4>
    <table class="table-admin">
      <thead><tr><th>Commit</th><th>Branch</th><th>Status</th><th>When</th></tr></thead>
      <tbody id="deploy-history-tbody"><tr><td colspan="4" class="empty">Loading deployment history…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="panel" style="border-left:4px solid #f59e0b;">
  <div class="panel-head"><h3>💾 Backup</h3></div>
  <div class="panel-body">
    <div class="form-actions" style="margin-bottom:14px;">
      <button class="btn btn-primary" id="sys-backup-now">💾 Trigger Backup Now</button>
      <button class="btn btn-outline" id="sys-backup-refresh">Refresh History</button>
    </div>
    <div id="sys-backup-status"></div>
    <table class="table-admin" style="margin-top:12px;">
      <thead><tr><th>Kind</th><th>Status</th><th>Size</th><th>Started</th><th>Completed</th></tr></thead>
      <tbody id="sys-backup-tbody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="panel" style="border-left:4px solid #dc2626;">
  <div class="panel-head"><h3>⚠️ Maintenance</h3></div>
  <div class="panel-body">
    <div class="form-actions">
      <button class="btn btn-primary" id="sys-run-migrations">🔄 Run Migrations</button>
      <button class="btn btn-outline" id="sys-health-check">🩺 Health Check</button>
    </div>
    <div id="sys-upgrade-status" style="margin-top:12px;"></div>
  </div>
</div>
