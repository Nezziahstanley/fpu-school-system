<!-- ============================================================
     Admin → Staff → Form
     ============================================================ -->
<section class="page-head">
  <div>
    <h2 id="sf-title">New Staff</h2>
    <p class="muted small" id="sf-subtitle">Create a lecturer, HOD, or principal account</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#staff'">← Back</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Staff Details</h3></div>
  <div class="panel-body">
    <form id="staff-form" data-skip-generic="1">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">First Name <span class="req">*</span></label><input class="form-control" name="firstName" id="sf-first" required /></div>
        <div class="form-group"><label class="form-label">Last Name <span class="req">*</span></label><input class="form-control" name="lastName" id="sf-last" required /></div>
        <div class="form-group"><label class="form-label">Middle Name</label><input class="form-control" name="middleName" id="sf-middle" /></div>
        <div class="form-group"><label class="form-label">Email <span class="req">*</span></label><input class="form-control" type="email" name="email" id="sf-email" required /></div>
        <div class="form-group"><label class="form-label">Phone</label><input class="form-control" name="phone" id="sf-phone" /></div>
        <div class="form-group">
          <label class="form-label">Gender</label>
          <select class="form-select" name="gender" id="sf-gender">
            <option value="">—</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Role <span class="req">*</span></label>
          <select class="form-select" name="role" id="sf-role" required>
            <option value="lecturer">Lecturer</option>
            <option value="hod">Head of Department</option>
            <option value="bursar">Bursar</option>
            <option value="registrar">Registrar</option>
            <option value="rector">Rector</option>
            <option value="librarian">Librarian</option>
            <option value="exam_officer">Exam Officer</option>
            <option value="academic_officer">Academic Officer</option>
            <option value="admission_officer">Admission Officer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">School</label>
          <select class="form-select" id="sf-school" data-lookup="schools" data-placeholder="Select school…"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Department</label>
          <select class="form-select" name="departmentId" id="sf-dept" data-lookup="departments" data-depends-on="sf-school" data-param="schoolId">
            <option value="">Select school first…</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label">Rank</label><input class="form-control" name="rank" id="sf-rank" placeholder="e.g. Lecturer I" /></div>
        <div class="form-group"><label class="form-label">Specialization</label><input class="form-control" name="specialization" id="sf-spec" /></div>
        <div class="form-group"><label class="form-label">Qualification</label><input class="form-control" name="qualification" id="sf-qual" /></div>
        <div class="form-group"><label class="form-label">Employment Date</label><input class="form-control" type="date" name="employmentDate" id="sf-emp-date" /></div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" name="password" id="sf-pwd" placeholder="Default: principal1234" />
          <div class="form-help" id="sf-pwd-help">Leave blank to use the default.</div>
        </div>
      </div>

      <div id="sf-validation"></div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="sf-submit">Create Staff</button>
        <button type="button" class="btn btn-ghost" onclick="window.location.hash='#staff'">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');
    const prefillRole = params.get('role');
    const isEdit = !!id;

    if (isEdit) {
      $('sf-title').textContent = 'Edit Staff';
      $('sf-subtitle').textContent = 'Update this staff member';
      $('sf-submit').textContent = 'Save Changes';
      $('sf-pwd-help').textContent = 'Leave blank to keep the current password.';
    }
    if (prefillRole) $('sf-role').value = prefillRole;

    async function loadExisting() {
      if (!isEdit) return;
      try {
        const res = await A.adminFetch(`/api/admin/staff/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const u = json.data;

        $('sf-first').value = u.firstName || '';
        $('sf-last').value = u.lastName || '';
        $('sf-middle').value = u.middleName || '';
        $('sf-email').value = u.email || '';
        $('sf-phone').value = u.phone || '';
        $('sf-gender').value = u.gender || '';
        $('sf-role').value = u.role || 'lecturer';

        const sp = u.staffProfile || {};
        $('sf-rank').value = sp.rank || '';
        $('sf-spec').value = sp.specialization || '';
        $('sf-qual').value = sp.qualification || '';
        $('sf-emp-date').value = sp.employmentDate ? String(sp.employmentDate).slice(0, 10) : '';

        setTimeout(() => {
          if (u.department?.schoolId && $('sf-school')) {
            $('sf-school').value = String(u.department.schoolId);
            $('sf-school').dispatchEvent(new Event('change'));
          }
        }, 300);
        setTimeout(() => {
          if (u.departmentId && $('sf-dept')) $('sf-dept').value = String(u.departmentId);
        }, 700);
      } catch (err) {
        A.showToast('❌ ' + err.message, 'error');
      }
    }

    $('staff-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const valEl = $('sf-validation');
      valEl.innerHTML = '';

      const payload = {
        firstName: $('sf-first').value.trim(),
        lastName: $('sf-last').value.trim(),
        middleName: $('sf-middle').value.trim() || null,
        email: $('sf-email').value.trim().toLowerCase(),
        phone: $('sf-phone').value.trim() || null,
        gender: $('sf-gender').value || null,
        role: $('sf-role').value,
        departmentId: $('sf-dept').value ? Number($('sf-dept').value) : null,
        rank: $('sf-rank').value.trim() || null,
        specialization: $('sf-spec').value.trim() || null,
        qualification: $('sf-qual').value.trim() || null,
        employmentDate: $('sf-emp-date').value || null,
      };
      const pwd = $('sf-pwd').value.trim();
      if (pwd) payload.password = pwd;

      if (!payload.firstName || !payload.lastName || !payload.email) {
        valEl.innerHTML = '<div style="color:#dc2626;">⚠️ First name, last name, and email are required.</div>';
        return;
      }

      const btn = $('sf-submit');
      btn.disabled = true;
      btn.textContent = isEdit ? 'Saving…' : 'Creating…';

      try {
        const res = await A.adminFetch(isEdit ? `/api/admin/staff/${id}` : '/api/admin/staff', {
          method: isEdit ? 'PUT' : 'POST',
          body: JSON.stringify(payload),
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.error);

        A.showToast(isEdit ? '✅ Staff updated.' : '✅ Staff created.', 'success');
        window.location.hash = json.data?.id ? `#staff-profile?id=${json.data.id}` : '#staff';
      } catch (err) {
        valEl.innerHTML = `<div style="color:#dc2626;">❌ ${A.escapeHtml(err.message)}</div>`;
        btn.disabled = false;
        btn.textContent = isEdit ? 'Save Changes' : 'Create Staff';
      }
    });

    loadExisting();
  })();
</script>
