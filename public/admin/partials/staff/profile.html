<!-- ============================================================
     Admin → Staff → Profile
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2>Staff Profile</h2>
    <p class="muted small" id="sp-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#staff'">← Back</button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.editStaffFromProfile()">✏️ Edit Staff</button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.resetStaffPassword()">🔑 Reset Password</button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.toggleStaffActive()">Toggle Active</button>
    <button class="btn btn-ghost btn-sm" style="color:#dc2626;" onclick="FPU_ADMIN.deleteStaff()">Delete</button>
  </div>
</section>

<div class="grid grid-2" style="gap:20px; align-items:flex-start;">
  <!-- Left -->
  <div>
    <div class="panel">
      <div class="panel-body">
        <div class="sp-identity">
          <div class="sp-avatar" id="sp-avatar">—</div>
          <div class="sp-identity-info">
            <div class="sp-name" id="sp-name">—</div>
            <div class="sp-email" id="sp-email">—</div>
            <div class="sp-badges" id="sp-badges">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Contact &amp; Bio</h3></div>
      <div class="panel-body" id="sp-contact">
        <div class="loading" style="padding:20px;text-align:center;"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Employment</h3></div>
      <div class="panel-body" id="sp-employment">
        <div class="loading" style="padding:20px;text-align:center;"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>

  <!-- Right -->
  <div>
    <div class="panel">
      <div class="panel-head">
        <h3>Courses Taught</h3>
        <span class="small muted" id="sp-courses-count">—</span>
      </div>
      <div class="panel-body flush" id="sp-courses">
        <div class="loading" style="padding:20px;text-align:center;"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Recent Activity</h3></div>
      <div class="panel-body" id="sp-activity">
        <div class="loading" style="padding:20px;text-align:center;"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>
</div>

<style>
  .sp-identity { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .sp-avatar {
    width: 100px; height: 100px; border-radius: 50%;
    background: linear-gradient(135deg, #065f46, #f59e0b); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'Poppins', sans-serif; font-size: 2.2rem; font-weight: 800;
    flex-shrink: 0; overflow: hidden; border: 4px solid #fff;
    box-shadow: 0 8px 20px rgba(15,23,42,0.12);
  }
  .sp-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .sp-identity-info { flex: 1; min-width: 0; }
  .sp-name { font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 700; color: #0f172a; }
  .sp-email { font-size: 13.5px; color: #6b7280; margin-top: 4px; }
  .sp-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  
  .field-row {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px dashed #e5e7eb; font-size: 13.5px; gap: 12px;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .k { color: #6b7280; flex-shrink: 0; }
  .field-row .v { color: #0f172a; font-weight: 500; text-align: right; word-break: break-word; }

  .sp-course-row {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid #f1f5f9;
  }
  .sp-course-row:last-child { border-bottom: none; }
  .sp-course-row .code {
    font-family: 'Courier New', monospace; font-weight: 700;
    color: #065f46; background: #ecfdf5; padding: 3px 10px;
    border-radius: 6px; font-size: 12.5px;
  }
  .sp-course-row .title { flex: 1; font-size: 13.5px; color: #0f172a; }
  .sp-course-row .units { font-family: 'Poppins', sans-serif; font-weight: 800; color: #f59e0b; min-width: 40px; text-align: right; }
</style>

<!-- Custom Reset Password Modal -->
<div id="reset-password-modal" class="fpu-modal-overlay" style="display: none;">
  <div class="fpu-modal">
    <div class="fpu-modal-header">
      <h3>Reset Password</h3>
      <button class="fpu-modal-close" onclick="FPU_ADMIN.closeResetModal()">&times;</button>
    </div>
    <div class="fpu-modal-body">
      <p class="muted small" style="margin-bottom: 15px;">Enter a new password for this staff member. If left blank, the default password <strong>principal1234</strong> will be used.</p>
      
      <div class="form-group">
        <label class="form-label">New Password</label>
        <div style="position: relative;">
          <input type="password" id="reset-pwd-input" class="form-control" placeholder="Enter new password..." style="padding-right: 40px;">
          <button type="button" onclick="FPU_ADMIN.togglePasswordVisibility('reset-pwd-input')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px;">👁️</button>
        </div>
      </div>
      
      <div id="reset-pwd-error" class="text-danger small" style="display: none; margin-top: 5px;"></div>
    </div>
    <div class="fpu-modal-footer">
      <button class="btn btn-outline" onclick="FPU_ADMIN.closeResetModal()">Cancel</button>
      <button class="btn btn-primary" id="reset-pwd-submit" onclick="FPU_ADMIN.submitResetPassword()">Reset Password</button>
    </div>
  </div>
</div>

<style>
  /* Modal Styles */
  .fpu-modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; opacity: 0; transition: opacity 0.2s ease;
  }
  .fpu-modal-overlay.show { opacity: 1; }
  
  .fpu-modal {
    background: #fff; border-radius: 12px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15); transform: translateY(20px);
    transition: transform 0.2s ease; display: flex; flex-direction: column;
  }
  .fpu-modal-overlay.show .fpu-modal { transform: translateY(0); }

  .fpu-modal-header {
    padding: 18px 24px; border-bottom: 1px solid #e2e8f0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .fpu-modal-header h3 { margin: 0; font-family: 'Poppins', sans-serif; font-size: 1.1rem; color: #0f172a; }
  
  .fpu-modal-close {
    background: none; border: none; font-size: 24px; color: #94a3b8;
    cursor: pointer; line-height: 1; padding: 0;
  }
  .fpu-modal-close:hover { color: #0f172a; }

  .fpu-modal-body { padding: 24px; }
  
  .fpu-modal-footer {
    padding: 16px 24px; border-top: 1px solid #e2e8f0;
    display: flex; justify-content: flex-end; gap: 10px;
    background: #f8fafc; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;
  }
</style>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadStaffProfile) {
    setTimeout(window.FPU_ADMIN.loadStaffProfile, 100);
  }
</script>
