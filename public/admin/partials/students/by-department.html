<!-- Admin → Students → By Department -->
<section class="page-head">
  <div>
    <h2 id="dept-page-title">Department Students</h2>
    <p class="muted small" id="dept-page-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('students')">← All Departments</button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.exportDeptStudentsByQuery()">
      ⬇️ Export CSV
    </button>
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.bulkImportStudents()">
      📤 Bulk Import
    </button>
    <button class="btn btn-primary btn-sm" onclick="FPU_ADMIN_SPA.navigateToWithQuery('student-form', { departmentId: FPU_ADMIN.getCurrentDeptId() })">
      + Add Student
    </button>
  </div>
</section>

<!-- Department stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Total</div>
    <div class="value" id="dept-stat-total">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Active</div>
    <div class="value" id="dept-stat-active">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">ND</div>
    <div class="value" id="dept-stat-nd">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">HND</div>
    <div class="value" id="dept-stat-hnd">—</div>
  </div>
</div>

<!-- Filters -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Level</label>
    <select class="form-select" id="dept-filter-level" onchange="FPU_ADMIN.loadDepartmentStudents()">
      <option value="">All levels</option>
      <option>ND</option>
      <option>HND</option>
      <option>CERT</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Programme</label>
    <select class="form-select" id="dept-filter-programme"
            data-lookup="programmes" data-param="departmentId"
            data-placeholder="All programmes"
            onchange="FPU_ADMIN.loadDepartmentStudents()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">Status</label>
    <select class="form-select" id="dept-filter-status" onchange="FPU_ADMIN.loadDepartmentStudents()">
      <option value="">All</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 220px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="dept-filter-search"
           placeholder="Matric, name, or email…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadDepartmentStudents()" />
  </div>
</div>

<!-- Bulk actions -->
<div class="bulk-bar">
  <div>
    <label style="display:flex;align-items:center;gap:.5rem;font-size:13px;">
      <input type="checkbox" id="dept-select-all" />
      <span class="muted">Select all on this page</span>
    </label>
  </div>
  <div class="bulk-actions">
    <button class="btn btn-sm btn-primary" onclick="FPU_ADMIN.bulkStudentAction('activate')">Activate</button>
    <button class="btn btn-sm btn-ghost" onclick="FPU_ADMIN.bulkStudentAction('deactivate')">Deactivate</button>
    <button class="btn btn-sm btn-outline" onclick="FPU_ADMIN.bulkStudentAction('reset-password')">Reset Password</button>
    <button class="btn btn-sm btn-danger" onclick="FPU_ADMIN.bulkStudentAction('delete')">Delete Selected</button>
  </div>
</div>

<!-- Table -->
<div class="panel">
  <div class="panel-head">
    <h3 id="dept-table-title">Students</h3>
    <span class="small muted">Click a row to view the student's profile</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead>
          <tr>
            <th style="width:32px;"></th>
            <th>Matric</th>
            <th>Name</th>
            <th>Level</th>
            <th>Programme</th>
            <th>Phone</th>
            <th>Status</th>
            <th style="width:280px;">Actions</th>
          </tr>
        </thead>
        <tbody id="dept-students-tbody">
          <tr><td colspan="8" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  /* Student avatar in the name cell */
  .stu-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(135deg,#065f46,#f59e0b);
    color: #fff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .stu-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .stu-name-cell {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Row action buttons - compact */
  .stu-actions {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
    justify-content: flex-end;
  }
  .stu-actions .btn {
    padding: 5px 10px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
</style>

<script>
(function() {
  'use strict';

  // ============================================================
  // Enhance row rendering with avatars and action buttons.
  // Runs after FPU_ADMIN.loadDepartmentStudents() finishes,
  // so it upgrades the rendered rows in-place.
  // ============================================================

  function getDeptIdFromHash() {
    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    return params.get('departmentId') || '';
  }

  // Expose for the "+ Add Student" and "Bulk Import" buttons
  window.FPU_ADMIN_getCurrentDeptId = getDeptIdFromHash;

  // Enhance each row: add avatar to name cell, add action buttons
  function enhanceRows() {
    const tbody = document.getElementById('dept-students-tbody');
    if (!tbody) return;

    const rows = tbody.querySelectorAll('tr[data-id]');
    if (!rows.length) return;

    rows.forEach((tr) => {
      // Already enhanced?
      if (tr.dataset.enhanced === '1') return;
      tr.dataset.enhanced = '1';

      const id = tr.dataset.id;

      // 1. Name cell — add avatar
      const nameCell = tr.children[2];
      if (nameCell && !nameCell.querySelector('.stu-avatar')) {
        const existingImg = nameCell.querySelector('img');
        const nameText = (nameCell.textContent || '').trim();
        const initials = nameText.split(' ')
          .filter(Boolean)
          .slice(0, 2)
          .map((w) => w[0].toUpperCase())
          .join('') || 'S';

        const avatar = document.createElement('div');
        avatar.className = 'stu-avatar';
        if (existingImg && existingImg.src) {
          avatar.innerHTML = '<img src="' + existingImg.src + '" alt="" />';
        } else {
          avatar.textContent = initials;
        }

        const wrap = document.createElement('div');
        wrap.className = 'stu-name-cell';
        wrap.appendChild(avatar);

        const nameSpan = document.createElement('span');
        nameSpan.textContent = nameText;
        wrap.appendChild(nameSpan);

        nameCell.innerHTML = '';
        nameCell.appendChild(wrap);
      }

      // 2. Actions cell — add view / edit / reset buttons
      const actionsCell = tr.children[7]; // last cell
      if (actionsCell && !actionsCell.querySelector('.stu-actions')) {
        actionsCell.innerHTML = `
          <div class="stu-actions">
            <button class="btn btn-outline" onclick="event.stopPropagation(); FPU_ADMIN_SPA.navigateToWithQuery('student-profile', { id: ${id} })">👁 View</button>
            <button class="btn btn-outline" onclick="event.stopPropagation(); FPU_ADMIN_SPA.navigateToWithQuery('student-form', { id: ${id} })">✏️ Edit</button>
            <button class="btn btn-ghost" style="color:#dc2626;" onclick="event.stopPropagation(); FPU_ADMIN.resetStudentPassword(${id})">🔑 Reset</button>
          </div>
        `;
      }
    });
  }

  // Watch the tbody for changes (new rows after filter / reload)
  function startObserver() {
    const tbody = document.getElementById('dept-students-tbody');
    if (!tbody || tbody.__enhancer) return;
    tbody.__enhancer = true;

    // Run immediately on existing rows
    enhanceRows();

    // Then watch for new rows
    const observer = new MutationObserver(() => enhanceRows());
    observer.observe(tbody, { childList: true, subtree: true });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startObserver);
  } else {
    startObserver();
  }

  // Re-run on SPA navigation
  window.addEventListener('hashchange', () => setTimeout(startObserver, 200));
})();
</script>
