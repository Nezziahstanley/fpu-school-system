<!-- Admin → Students → Profile -->
<section class="page-head">
  <div>
    <h2>Student Profile</h2>
    <p class="muted small" id="stu-profile-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('students')">← Back</button>
    <button class="btn btn-outline btn-sm" id="stu-print-btn">Print</button>
  </div>
</section>

<div class="grid grid-2" style="gap:20px; align-items:flex-start;">
  <!-- Left: photo + quick info -->
  <div>
    <div class="panel">
      <div class="panel-head"><h3>Photo</h3></div>
      <div class="panel-body" style="text-align:center;">
        <div id="stu-photo-wrap" style="
          width:180px;height:180px;margin:0 auto 14px;
          border-radius:50%;overflow:hidden;
          background:linear-gradient(135deg,#065f46,#f59e0b);
          color:#fff;display:flex;align-items:center;justify-content:center;
          font-family:'Poppins',sans-serif;font-size:3rem;font-weight:700;
          box-shadow:0 8px 24px rgba(15,23,42,0.15);
        ">—</div>
        <div id="stu-status-pill">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Quick Info</h3></div>
      <div class="panel-body" id="stu-quick">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>

  <!-- Right: bio, academic, fees -->
  <div>
    <div class="panel">
      <div class="panel-head"><h3>Bio-Data</h3></div>
      <div class="panel-body" id="stu-bio">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Academic Record</h3></div>
      <div class="panel-body" id="stu-academic">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Fee Status</h3></div>
      <div class="panel-body" id="stu-fees">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Actions -->
<div class="panel">
  <div class="panel-head"><h3>Actions</h3></div>
  <div class="panel-body">
    <div class="row-actions">
      <button class="btn btn-outline btn-sm" id="stu-toggle-active">Toggle Active</button>
      <button class="btn btn-outline btn-sm" id="stu-reset-pwd">Reset Password</button>
      <button class="btn btn-outline btn-sm" id="stu-goto-transcript">View Transcript</button>
      <button class="btn btn-danger btn-sm" id="stu-delete">Delete Student</button>
    </div>
  </div>
</div>

<style>
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed #e5e7eb;
    font-size: 13.5px;
    gap: 12px;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .k { color: #6b7280; flex-shrink: 0; }
  .field-row .v { color: #0f172a; font-weight: 500; text-align: right; word-break: break-word; }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');

    if (!id) {
      $('stu-bio').innerHTML = '<p class="muted">No student ID provided.</p>';
      return;
    }

    // ============================================================
    // Styled helpers — fall back to native if modal system absent
    // ============================================================
    async function styledConfirm(message, options) {
      if (typeof window.fpuConfirm === 'function') {
        return await window.fpuConfirm(message, options || {});
      }
      return window.__fpuNativeConfirm ? window.__fpuNativeConfirm(message) : false;
    }
    async function styledPrompt(message, defaultValue, options) {
      if (typeof window.fpuPrompt === 'function') {
        return await window.fpuPrompt(message, '', (options && options.title) || 'Input Required', defaultValue || '', { placeholder: (options && options.placeholder) || 'Type here...', okText: (options && options.okText) || 'Submit', inputType: 'password' });
      }
      return null;
    }

    // ============================================================
    // Field row template
    // ============================================================
    function fieldRow(label, value) {
      return `<div class="field-row">
        <span class="k">${A.escapeHtml(label)}</span>
        <span class="v">${A.escapeHtml(value || '—')}</span>
      </div>`;
    }

    // ============================================================
    // Pick a field from flat OR nested path
    // ============================================================
    function pick(obj, flatKey, nestedObj, nestedKey) {
      if (obj[flatKey]) return obj[flatKey];
      if (nestedObj && obj[nestedObj] && obj[nestedObj][nestedKey || 'name']) {
        return obj[nestedObj][nestedKey || 'name'];
      }
      return '';
    }

    // ============================================================
    // Resolve missing relations by fetching lookups
    // ============================================================
    async function resolveRelations(u) {
      const tasks = [];

      if (!u.programmeName && u.programmeId) {
        tasks.push(
          A.adminFetch('/api/admin/programmes').then(r => r.json()).then(j => {
            const found = (j.data || []).find(p => Number(p.id) === Number(u.programmeId));
            if (found) u.programmeName = found.name;
          }).catch(() => {})
        );
      }
      if (!u.departmentName && u.departmentId) {
        tasks.push(
          A.adminFetch('/api/admin/departments').then(r => r.json()).then(j => {
            const found = (j.data || []).find(d => Number(d.id) === Number(u.departmentId));
            if (found) u.departmentName = found.name;
          }).catch(() => {})
        );
      }
      if (!u.schoolName && u.schoolId) {
        tasks.push(
          A.adminFetch('/api/admin/schools').then(r => r.json()).then(j => {
            const found = (j.data || []).find(s => Number(s.id) === Number(u.schoolId));
            if (found) u.schoolName = found.name;
          }).catch(() => {})
        );
      }
      if (!u.sessionName && u.currentSessionId) {
        tasks.push(
          A.adminFetch('/api/admin/sessions').then(r => r.json()).then(j => {
            const found = (j.data || []).find(s => Number(s.id) === Number(u.currentSessionId));
            if (found) u.sessionName = found.name;
          }).catch(() => {})
        );
      }

      await Promise.all(tasks);
    }

    // ============================================================
    // Main loader
    // ============================================================
    async function load() {
      try {
        const res = await A.adminFetch(`/api/admin/students/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const u = json.data;

        await resolveRelations(u);

        // Subtitle
        $('stu-profile-subtitle').textContent = `${u.matricNumber || 'No matric'} · ${u.email || ''}`;

        // Photo
        const wrap = $('stu-photo-wrap');
        if (u.photoUrl) {
          wrap.innerHTML = `<img src="${A.escapeHtml(u.photoUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;" />`;
        } else {
          const initials = ((u.firstName || ' ')[0] + (u.lastName || ' ')[0]).toUpperCase().trim() || 'S';
          wrap.textContent = initials;
        }

        // Status pill
        $('stu-status-pill').innerHTML = u.isActive !== false ? A.badge('active') : A.badge('inactive');

        // Quick Info
        $('stu-quick').innerHTML = [
          fieldRow('Matric No', u.matricNumber),
          fieldRow('Level', u.level),
          fieldRow('Session', pick(u, 'sessionName', 'currentSession', 'name')),
          fieldRow('Programme', pick(u, 'programmeName', 'programme', 'name')),
        ].join('');

        // Bio
        $('stu-bio').innerHTML = [
          fieldRow('First Name', u.firstName),
          fieldRow('Middle Name', u.middleName),
          fieldRow('Last Name', u.lastName),
          fieldRow('Email', u.email),
          fieldRow('Phone', u.phone),
          fieldRow('Gender', u.gender),
          fieldRow('Date of Birth', u.dateOfBirth ? A.fmtDate(u.dateOfBirth) : ''),
          fieldRow('State of Origin', u.stateOfOrigin),
          fieldRow('Nationality', u.nationality || u.country),
          fieldRow('Address', u.address),
        ].join('');

        // Academic
        $('stu-academic').innerHTML = [
          fieldRow('Department', pick(u, 'departmentName', 'department', 'name')),
          fieldRow('Programme', pick(u, 'programmeName', 'programme', 'name')),
          fieldRow('School', pick(u, 'schoolName', 'school', 'name')),
          fieldRow('Level', u.level),
          fieldRow('Enrolled', A.fmtDate(u.createdAt)),
        ].join('');

        // ============================================================
        // Fees (async)
        // ============================================================
        A.adminFetch(`/api/admin/payments?studentId=${id}&limit=500`).then(async (r) => {
          const j = await r.json();
          const payments = j.data || [];
          const verified = payments.filter(p => (p.payment || p).status === 'verified');
          const totalVerified = verified.reduce((s, p) => s + Number((p.payment || p).amount || 0), 0);
          const lastPayment = verified.length
            ? verified.map(p => (p.payment || p).createdAt).sort().slice(-1)[0]
            : null;

          const fullName = `${u.firstName || ''} ${u.lastName || ''}`.trim() || 'Student';

          $('stu-fees').innerHTML = [
            fieldRow('Verified Payments', verified.length),
            fieldRow('Total Verified', A.money(totalVerified)),
            fieldRow('Last Payment', lastPayment ? A.fmtDate(lastPayment) : '—'),
          ].join('') + `<div style="margin-top:12px;">
            <button type="button" class="btn btn-sm btn-outline" id="stu-view-payments-btn">
              View all payments →
            </button>
          </div>`;

          // Wire up the button to open the beautiful payment history modal
          const viewPaymentsBtn = document.getElementById('stu-view-payments-btn');
          if (viewPaymentsBtn) {
            viewPaymentsBtn.onclick = () => {
              if (typeof A.openPaymentHistory === 'function') {
                A.openPaymentHistory(id, fullName);
              } else if (typeof window.openPaymentHistory === 'function') {
                window.openPaymentHistory(id, fullName);
              } else {
                A.showToast('Payment history modal not loaded.', 'error');
              }
            };
          }

        }).catch(() => {
          $('stu-fees').innerHTML = '<p class="muted">Could not load fees.</p>';
        });

        // ============================================================
        // ACTIONS
        // ============================================================

        // --- Toggle Active ---
        $('stu-toggle-active').onclick = async () => {
          const active = u.isActive !== false;
          const ok = await styledConfirm(
            `${active ? 'Deactivate' : 'Activate'} ${u.firstName} ${u.lastName}?\n\nThey will ${active ? 'lose' : 'regain'} access to the student portal.`,
            {
              title: active ? 'Deactivate Student?' : 'Activate Student?',
              type: active ? 'warning' : 'success',
              okText: active ? 'Deactivate' : 'Activate',
            }
          );
          if (!ok) return;
          try {
            await A.adminFetch(`/api/admin/students/${id}/toggle-active`, { method: 'POST' });
            A.showToast(`✅ Student ${active ? 'deactivated' : 'activated'}.`, 'success');
            load();
          } catch (e) {
            A.showToast('❌ ' + e.message, 'error');
          }
        };

        // --- Reset Password (STYLED PROMPT) ---
        $('stu-reset-pwd').onclick = async () => {
          const pwd = await styledPrompt(
            `Enter a new password for ${u.firstName} ${u.lastName}. They will need this to log in.`,
            'student1234',
            {
              title: 'Reset Student Password',
              okText: 'Reset Password',
              placeholder: 'Enter new password (min 6 chars)',
            }
          );

          if (pwd === null) return;
          if (!pwd.trim()) {
            A.showToast('Password cannot be empty.', 'warning');
            return;
          }
          if (pwd.trim().length < 6) {
            A.showToast('Password must be at least 6 characters.', 'warning');
            return;
          }

          // Second confirmation
          const confirmed = await styledConfirm(
            `Reset ${u.firstName}'s password to a new value?\n\nThey will need to use the new password to log in.`,
            {
              title: 'Confirm Password Reset?',
              type: 'warning',
              okText: 'Yes, Reset Password',
            }
          );
          if (!confirmed) return;

          try {
            await A.adminFetch(`/api/admin/students/${id}/reset-password`, {
              method: 'POST',
              body: JSON.stringify({ password: pwd.trim() }),
            });
            A.showToast('✅ Password reset successfully.', 'success');
          } catch (e) {
            A.showToast('❌ ' + e.message, 'error');
          }
        };

        // --- View Transcript ---
        $('stu-goto-transcript').onclick = () => {
          A.showToast('Opening transcript…', 'info');
          // Call the beautiful modal transcript function directly
          if (typeof A.openTranscriptModal === 'function') {
            A.openTranscriptModal(id);
          } else if (typeof window.openTranscriptModal === 'function') {
            window.openTranscriptModal(id);
          } else {
            // Fallback if the function isn't exported to the window scope
            window.location.hash = `#transcript-by-student?studentId=${id}`;
          }
        };

        // --- Delete Student ---
        $('stu-delete').onclick = async () => {
          const ok = await styledConfirm(
            `Delete ${u.firstName} ${u.lastName} permanently?\n\nThis will remove ALL their records — results, payments, registrations, and cannot be undone.`,
            {
              title: 'Delete Student?',
              type: 'danger',
              okText: 'Delete Permanently',
            }
          );
          if (!ok) return;
          try {
            await A.adminFetch(`/api/admin/students/${id}`, { method: 'DELETE' });
            A.showToast('✅ Student deleted.', 'success');
            A.FPU_ADMIN_SPA.navigateTo('students');
          } catch (e) {
            A.showToast('❌ ' + e.message, 'error');
          }
        };

        // --- Print ---
        $('stu-print-btn').onclick = () => window.print();

      } catch (err) {
        $('stu-bio').innerHTML = `<div class="alert alert-danger">${A.escapeHtml(err.message)}</div>`;
      }
    }

    load();
  })();
</script>
