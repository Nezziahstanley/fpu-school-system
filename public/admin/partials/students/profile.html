<!-- Admin → Students → Profile -->
<section class="page-head">
  <div>
    <h2>Student Profile</h2>
    <p class="muted small" id="stu-profile-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('students')">← Back</button>
    <button class="btn btn-outline btn-sm" id="stu-print-btn">Print</button>
  </div>
</section>

<div class="grid grid-2" style="gap:20px; align-items:flex-start;">
  <!-- Left: photo + quick info -->
  <div>
    <div class="panel">
      <div class="panel-head"><h3>Photo</h3></div>
      <div class="panel-body" style="text-align:center;">
        <div id="stu-photo-wrap" style="
          width:180px;height:180px;margin:0 auto 14px;
          border-radius:50%;overflow:hidden;
          background:linear-gradient(135deg,#065f46,#f59e0b);
          color:#fff;display:flex;align-items:center;justify-content:center;
          font-family:'Poppins',sans-serif;font-size:3rem;font-weight:700;
          box-shadow:0 8px 24px rgba(15,23,42,0.15);
        ">—</div>
        <div id="stu-status-pill">—</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Quick Info</h3></div>
      <div class="panel-body" id="stu-quick">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>

  <!-- Right: bio, academic, fees -->
  <div>
    <div class="panel">
      <div class="panel-head"><h3>Bio-Data</h3></div>
      <div class="panel-body" id="stu-bio">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Academic Record</h3></div>
      <div class="panel-body" id="stu-academic">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Fee Status</h3></div>
      <div class="panel-body" id="stu-fees">
        <div class="loading"><span class="spinner"></span> Loading…</div>
      </div>
    </div>
  </div>
</div>

<!-- Actions -->
<div class="panel">
  <div class="panel-head"><h3>Actions</h3></div>
  <div class="panel-body">
    <div class="row-actions">
      <button class="btn btn-outline btn-sm" id="stu-toggle-active">Toggle Active</button>
      <button class="btn btn-outline btn-sm" id="stu-reset-pwd">Reset Password</button>
      <button class="btn btn-outline btn-sm" id="stu-goto-transcript">View Transcript</button>
      <button class="btn btn-danger btn-sm" id="stu-delete">Delete Student</button>
    </div>
  </div>
</div>

<style>
  .field-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed #e5e7eb;
    font-size: 13.5px;
    gap: 12px;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row .k { color: #6b7280; flex-shrink: 0; }
  .field-row .v { color: #0f172a; font-weight: 500; text-align: right; word-break: break-word; }
</style>

<script>
  (async function () {
    const A = window.FPU_ADMIN;
    const $ = (id) => document.getElementById(id);

    const hash = window.location.hash.replace(/^#/, '');
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx >= 0 ? hash.slice(qIdx + 1) : '');
    const id = params.get('id');

    if (!id) {
      $('stu-bio').innerHTML = '<p class="muted">No student ID provided.</p>';
      return;
    }

    function fieldRow(label, value) {
      return `<div class="field-row"><span class="k">${A.escapeHtml(label)}</span><span class="v">${A.escapeHtml(value || '—')}</span></div>`;
    }

    async function load() {
      try {
        const res = await A.adminFetch(`/api/admin/students/${id}`);
        const json = await res.json();
        if (!json.success) throw new Error(json.error);
        const u = json.data;

        $('stu-profile-subtitle').textContent = `${u.matricNumber || 'No matric'} · ${u.email}`;

        // Photo
        const wrap = $('stu-photo-wrap');
        if (u.photoUrl) {
          wrap.innerHTML = `<img src="${A.escapeHtml(u.photoUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;" />`;
        } else {
          const initials = ((u.firstName || ' ')[0] + (u.lastName || ' ')[0]).toUpperCase().trim() || 'S';
          wrap.textContent = initials;
        }

        // Status pill
        $('stu-status-pill').innerHTML = u.isActive !== false ? A.badge('active') : A.badge('inactive');

        // Quick info
        $('stu-quick').innerHTML = [
          fieldRow('Matric No', u.matricNumber),
          fieldRow('Level', u.level),
          fieldRow('Session', u.currentSession?.name),
          fieldRow('Programme', u.programme?.name),
        ].join('');

        // Bio
        $('stu-bio').innerHTML = [
          fieldRow('First Name', u.firstName),
          fieldRow('Middle Name', u.middleName),
          fieldRow('Last Name', u.lastName),
          fieldRow('Email', u.email),
          fieldRow('Phone', u.phone),
          fieldRow('Gender', u.gender),
          fieldRow('Date of Birth', u.dateOfBirth ? A.fmtDate(u.dateOfBirth) : ''),
          fieldRow('State of Origin', u.stateOfOrigin),
          fieldRow('Nationality', u.nationality),
          fieldRow('Address', u.address),
        ].join('');

        // Academic
        $('stu-academic').innerHTML = [
          fieldRow('Department', u.department?.name),
          fieldRow('Programme', u.programme?.name),
          fieldRow('School', u.school?.name),
          fieldRow('Level', u.level),
          fieldRow('Enrolled', A.fmtDate(u.createdAt)),
        ].join('');

        // Fees (quick summary — fetch in background)
        A.adminFetch(`/api/admin/payments?studentId=${id}&limit=1`).then(async (r) => {
          const j = await r.json();
          const payments = j.data || [];
          const totalVerified = payments
            .filter((p) => (p.payment || p).status === 'verified')
            .reduce((s, p) => s + Number((p.payment || p).amount || 0), 0);
          $('stu-fees').innerHTML = [
            fieldRow('Total Verified', A.money(totalVerified)),
            fieldRow('Last Payment', payments[0] ? A.fmtDate((payments[0].payment || payments[0]).createdAt) : '—'),
          ].join('') + `<div style="margin-top:12px;">
            <a class="btn btn-sm btn-outline" href="#payments">View all payments →</a>
          </div>`;
        }).catch(() => {
          $('stu-fees').innerHTML = '<p class="muted">Could not load fees.</p>';
        });

        // Buttons
        $('stu-toggle-active').onclick = async () => {
          try {
            await A.adminFetch(`/api/admin/students/${id}/toggle-active`, { method: 'POST' });
            A.showToast('Status updated.');
            load();
          } catch (e) { A.showToast('❌ ' + e.message, 'error'); }
        };

        $('stu-reset-pwd').onclick = async () => {
          const pwd = prompt('New password (default: student1234):', 'student1234');
          if (pwd === null) return;
          try {
            await A.adminFetch(`/api/admin/students/${id}/reset-password`, {
              method: 'POST',
              body: JSON.stringify({ password: pwd }),
            });
            A.showToast('Password reset.');
          } catch (e) { A.showToast('❌ ' + e.message, 'error'); }
        };

        $('stu-goto-transcript').onclick = () => {
          A.showToast('Opening transcript…', 'info');
          window.open(`/#transcript?studentId=${id}`, '_self');
        };

        $('stu-delete').onclick = async () => {
          if (!confirm(`Delete ${u.firstName} ${u.lastName} permanently? This cannot be undone.`)) return;
          try {
            await A.adminFetch(`/api/admin/students/${id}`, { method: 'DELETE' });
            A.showToast('Student deleted.');
            A.FPU_ADMIN_SPA.navigateTo('students');
          } catch (e) { A.showToast('❌ ' + e.message, 'error'); }
        };

        $('stu-print-btn').onclick = () => window.print();
      } catch (err) {
        $('stu-bio').innerHTML = `<div class="alert alert-danger">${A.escapeHtml(err.message)}</div>`;
      }
    }

    load();
  })();
</script>
