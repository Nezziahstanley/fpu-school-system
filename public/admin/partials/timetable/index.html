<!-- ============================================================
     Admin / HOD → Timetable → Index
     ------------------------------------------------------------
     Pick a session + semester, then see every department as a
     card. Click a card → the A4 timetable sheet for that
     department + semester.
     Also: "Print all" opens a stacked list of every department's
     sheet (one per page).
     ============================================================ -->
<section class="page-head">
  <div>
    <h2>Timetable</h2>
    <p class="muted small">
      Populate and view the weekly lecture schedule for every department
    </p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadTimetableIndex()">
      Refresh
    </button>
    <button class="btn btn-outline btn-sm" id="tt-print-all">
      🖨 Print All
    </button>
    <button class="btn btn-primary btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('timetable-form')">
      + New Slot
    </button>
  </div>
</section>

<!-- Session + semester picker -->
<div class="filters">
  <div class="form-group">
    <label class="form-label">Session</label>
    <select class="form-select" id="tt-session"
            data-lookup="sessions" data-placeholder="Current session"
            onchange="FPU_ADMIN.loadTimetableIndex()"></select>
  </div>
  <div class="form-group">
    <label class="form-label">Semester</label>
    <select class="form-select" id="tt-semester"
            onchange="FPU_ADMIN.loadTimetableIndex()">
      <option value="first">First Semester</option>
      <option value="second">Second Semester</option>
    </select>
  </div>
  <div class="form-group" style="flex:2 1 240px;">
    <label class="form-label">Search</label>
    <input class="form-control" id="tt-search"
           placeholder="Department code or name…"
           onkeydown="if(event.key==='Enter')FPU_ADMIN.loadTimetableIndex()" />
  </div>
</div>

<!-- Stats -->
<div class="stats-inline">
  <div class="stat-inline">
    <div class="label">Departments</div>
    <div class="value" id="tt-stat-depts">—</div>
  </div>
  <div class="stat-inline stat-inline-primary">
    <div class="label">Slots This Semester</div>
    <div class="value" id="tt-stat-slots">—</div>
  </div>
  <div class="stat-inline stat-inline-accent">
    <div class="label">Scheduled Departments</div>
    <div class="value" id="tt-stat-scheduled">—</div>
  </div>
  <div class="stat-inline stat-inline-success">
    <div class="label">Conflicts</div>
    <div class="value" id="tt-stat-conflicts">—</div>
  </div>
</div>

<!-- Department grid -->
<div id="tt-dept-grid" class="tt-dept-grid">
  <div class="loading" style="grid-column:1/-1;">
    <span class="spinner"></span> Loading departments…
  </div>
</div>

<style>
  .tt-dept-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-top: 20px;
  }
  .tt-dept-card {
    background: #fff;
    border: 1px solid var(--fpu-border);
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    position: relative;
    overflow: hidden;
  }
  .tt-dept-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #065f46, #f59e0b);
  }
  .tt-dept-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(15,23,42,0.10);
    border-color: rgba(6,95,70,0.3);
  }
  .tt-dept-card.empty {
    opacity: 0.65;
  }
  .tt-dept-card.empty::before {
    background: linear-gradient(90deg, #cbd5e1, #e2e8f0);
  }
  .ttd-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .ttd-code {
    background: #ecfdf5;
    color: #065f46;
    font-family: 'Poppins', sans-serif;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 6px;
  }
  .ttd-school {
    background: linear-gradient(135deg,#065f46,#047857);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .tt-dept-card h3 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    color: #0f172a;
    margin: 0;
    line-height: 1.35;
  }
  .ttd-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .ttd-stat {
    background: #f8fafc;
    border-radius: 8px;
    padding: 8px 6px;
    text-align: center;
  }
  .ttd-stat .num {
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 1.15rem;
    font-weight: 800;
    color: #065f46;
    line-height: 1;
  }
  .ttd-stat .label {
    display: block;
    font-size: 9.5px;
    color: #6b7280;
    font-weight: 700;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .ttd-conflict-warn {
    background: #fef3c7;
    color: #92400e;
    font-size: 11.5px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 6px;
    text-align: center;
  }
  .ttd-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px solid #f1f5f9;
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }
  .ttd-footer .arrow {
    color: #f59e0b;
    font-family: 'Poppins', sans-serif;
  }
</style>

<script>
  // SPA init calls FPU_ADMIN.loadTimetableIndex()
</script>
