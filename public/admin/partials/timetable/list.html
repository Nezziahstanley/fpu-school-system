<!-- Admin → Timetable -->
<section class="page-head">
  <div><h2>Timetable</h2><p class="muted small">Weekly lecture schedule</p></div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadTimetable()">Refresh</button>
    <button class="btn btn-primary btn-sm" onclick="FPU_ADMIN_SPA.navigateTo('timetable-form')">+ New Slot</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Slots</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Course</th><th>Day</th><th>Time</th><th>Venue</th><th>Lecturer</th></tr></thead>
        <tbody id="timetable-tbody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
