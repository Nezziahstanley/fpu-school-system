<!-- ============================================================
     Admin / HOD → Timetable → A4 Sheet
     ------------------------------------------------------------
     Classic NBTE polytechnic lecture timetable:
       DAYS | CODE | CU | COURSE TITLE | TIME | LECTURER | VENUE
     Days merged vertically. Designed to print on A4 portrait.
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2 id="tsheet-title">Department Timetable</h2>
    <p class="muted small" id="tsheet-subtitle">Loading…</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm"
            onclick="FPU_ADMIN_SPA.navigateTo('timetable')">
      ← All Departments
    </button>
    <button class="btn btn-outline btn-sm" id="tsheet-switch-sem">
      Switch Semester
    </button>
    <button class="btn btn-outline btn-sm" id="tsheet-export">
      Export CSV
    </button>
    <button class="btn btn-primary btn-sm" id="tsheet-print">
      🖨 Print A4
    </button>
    <button class="btn btn-accent btn-sm" id="tsheet-add">
      + Add Slot
    </button>
  </div>
</section>

<div id="tsheet-root">
  <div class="loading"><span class="spinner"></span> Loading timetable…</div>
</div>

<!-- ============================================================
     A4 SHEET STYLES
     ============================================================ -->
<style>
  .tt-sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 24px;
    padding: 12mm;
    background: #fff;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.12);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', Arial, sans-serif;
    color: #000;
  }

  /* ---------- Header block ---------- */
  .tt-head {
    display: flex;
    align-items: center;
    gap: 6mm;
    margin-bottom: 6mm;
    padding-bottom: 4mm;
    border-bottom: 2px solid #000;
  }
  .tt-head-logo {
    width: 22mm;
    height: 22mm;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tt-head-logo img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .tt-head-text {
    flex: 1;
    text-align: center;
  }
  .tt-head-text .institution {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 13pt;
    font-weight: 700;
    color: #065f46;
    letter-spacing: 0.3px;
    line-height: 1.15;
  }
  .tt-head-text .school {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 11pt;
    font-weight: 700;
    color: #065f46;
    letter-spacing: 0.3px;
    line-height: 1.2;
    margin-top: 1mm;
  }
  .tt-head-text .dept {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 11pt;
    font-weight: 700;
    color: #065f46;
    letter-spacing: 0.3px;
    line-height: 1.2;
    margin-top: 1mm;
  }
  .tt-head-text .session-line {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 10pt;
    font-weight: 700;
    color: #000;
    letter-spacing: 0.5px;
    margin-top: 2.5mm;
    text-transform: uppercase;
  }

  /* ---------- Main table ---------- */
  .tt-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 8.5pt;
    line-height: 1.25;
    flex: 1;
  }
  .tt-table th {
    background: #fff;
    border: 1px solid #000;
    padding: 2mm 1.5mm;
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 8pt;
    font-weight: 700;
    color: #7a1f1f;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    vertical-align: middle;
  }
  .tt-table td {
    border: 1px solid #000;
    padding: 1.5mm 1.5mm;
    vertical-align: middle;
    font-size: 8.5pt;
    color: #000;
  }
  .tt-table .col-days    { width: 12mm; text-align: center; font-family: 'Poppins', Arial, sans-serif; font-size: 8.5pt; font-weight: 700; background: #f7f7f7; }
  .tt-table .col-code    { width: 15mm; text-align: center; font-family: 'Poppins', Arial, sans-serif; font-weight: 600; }
  .tt-table .col-cu      { width: 8mm;  text-align: center; font-weight: 600; }
  .tt-table .col-title   { text-align: left; }
  .tt-table .col-time    { width: 26mm; text-align: center; white-space: nowrap; }
  .tt-table .col-lecturer{ width: 42mm; text-align: left; font-size: 8pt; }
  .tt-table .col-venue   { width: 26mm; text-align: left; font-size: 8pt; }

  .tt-table tr.day-row td { background: #fafafa; }
  .tt-table td.day-cell {
    font-family: 'Poppins', Arial, sans-serif;
    font-size: 9pt;
    font-weight: 700;
    text-align: center;
    vertical-align: middle;
    background: #f7f7f7;
    letter-spacing: 0.5px;
  }

  /* ---------- Footer ---------- */
  .tt-signature {
    margin-top: auto;
    padding-top: 8mm;
    display: flex;
    justify-content: flex-start;
  }
  .tt-signature-block {
    font-size: 9pt;
    line-height: 1.5;
  }
  .tt-signature-block .name {
    font-family: 'Poppins', Arial, sans-serif;
    font-style: italic;
    font-weight: 600;
    color: #000;
    text-decoration: underline;
  }
  .tt-signature-block .role {
    font-family: 'Poppins', Arial, sans-serif;
    font-weight: 700;
    color: #065f46;
    font-size: 9pt;
  }

  /* ---------- Empty state ---------- */
  .tt-empty {
    padding: 30mm 10mm;
    text-align: center;
    color: #64748b;
    font-size: 11pt;
  }

  /* ---------- Print ---------- */
  @media print {
    .no-print, .sidebar, .topbar, .toast-wrap { display: none !important; }
    .main { margin: 0 !important; padding: 0 !important; }
    body { background: #fff !important; }

    @page { size: A4 portrait; margin: 0; }

    .tt-sheet {
      box-shadow: none;
      margin: 0;
      page-break-after: always;
    }
    .tt-sheet:last-child { page-break-after: auto; }
  }
</style>

<script>

</script>
