<!-- ============================================================
     Admin → Transcript → Student Transcript
     ============================================================ -->
<section class="page-head no-print">
  <div>
    <h2 id="tx-title">Student Transcript</h2>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.location.hash='#transcript'">
      ← New Lookup
    </button>
    <button class="btn btn-primary btn-sm" id="tx-print">🖨️ Print</button>
  </div>
</section>

<!-- Transcript Root Container -->
<div id="tx-root">
  <div class="loading" style="padding:60px;text-align:center;">
    <span class="spinner"></span> Loading transcript…
  </div>
</div>

<style>
  /* Screen view */
  .tx-document {
    background: #fff; border-radius: 12px; border: 1px solid #e2e8f0;
    padding: 32px; max-width: 900px; margin: 0 auto 40px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04); position: relative; overflow: hidden;
  }
  .tx-letterhead {
    display: flex; align-items: center; gap: 20px; padding-bottom: 20px;
    margin-bottom: 24px; border-bottom: 3px double #065f46;
  }
  .tx-letterhead-logo { width: 80px; height: 80px; flex-shrink: 0; object-fit: contain; }
  .tx-letterhead-text { flex: 1; text-align: center; }
  .tx-letterhead-text .institution {
    font-family: 'Poppins', sans-serif; font-size: 22px; font-weight: 900;
    color: #065f46; text-transform: uppercase; letter-spacing: 1px; margin: 0; line-height: 1.2;
  }
  .tx-letterhead-text .doc-type {
    font-size: 13px; font-weight: 700; color: #0f172a; text-transform: uppercase;
    letter-spacing: 2px; margin-top: 4px;
  }
  .tx-header {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 24px;
    padding-bottom: 24px; border-bottom: 1px solid #e2e8f0; margin-bottom: 24px;
  }
  .tx-student-info h2 { font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 800; color: #0f172a; margin: 0 0 4px; }
  .tx-student-info .meta { font-size: 12.5px; color: #6b7280; line-height: 1.7; }
  .tx-cgpa-block { text-align: right; flex-shrink: 0; }
  .tx-cgpa-block .label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; color: #6b7280; }
  .tx-cgpa-block .value { font-family: 'Poppins', sans-serif; font-size: 2.6rem; font-weight: 800; color: #065f46; line-height: 1; margin: 2px 0; }
  .tx-semester { margin-bottom: 20px; page-break-inside: avoid; }
  .tx-semester-head {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 14px;
    background: #065f46; color: #fff; border-radius: 6px 6px 0 0; font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 700;
  }
  .tx-table { width: 100%; border-collapse: collapse; border: 1px solid #e2e8f0; border-top: none; }
  .tx-table th, .tx-table td { padding: 8px 12px; text-align: left; font-size: 12px; border-bottom: 1px solid #f1f5f9; }
  .tx-table th { background: #f8fafc; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; font-size: 10px; color: #6b7280; }
  .tx-table td.num { text-align: right; font-family: 'Courier New', monospace; font-weight: 700; }
  .tx-table td.center { text-align: center; }
  .tx-grade { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 22px; padding: 0 6px; border-radius: 4px; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 11px; }
  .tx-grade.A, .tx-grade.B { background: #dcfce7; color: #15803d; }
  .tx-grade.C { background: #dbeafe; color: #1e40af; }
  .tx-grade.D { background: #fef3c7; color: #92400e; }
  .tx-grade.E { background: #fee2e2; color: #991b1b; }
  .tx-grade.F { background: #fca5a5; color: #7f1d1d; }

  @media print {
    .no-print, .sidebar, .topbar, .page-head { display: none !important; }
    body { background: #fff; margin: 0; padding: 0; }
    .tx-document { box-shadow: none; border: none; padding: 0; margin: 0; max-width: 100%; }
    .tx-semester-head { background: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadTranscriptView) {
    setTimeout(window.FPU_ADMIN.loadTranscriptView, 100);
  }
</script>
