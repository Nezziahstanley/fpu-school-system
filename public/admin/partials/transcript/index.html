<!-- Admin → Transcript Lookup -->
<section class="page-head">
  <div>
    <h2>Transcript Lookup</h2>
    <p class="muted small">Search by matric number, name, or email — then open the full transcript</p>
  </div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" id="transcript-refresh">Refresh</button>
  </div>
</section>

<!-- Search Bar -->
<div class="panel" style="margin-bottom: 20px;">
  <div class="panel-body">
    <div style="display: flex; gap: 10px;">
      <input class="form-control" id="transcript-search-input" placeholder="Search by matric, name, or email..." style="flex: 1;" />
      <button class="btn btn-primary" id="transcript-search-btn">Search</button>
    </div>
    <p class="muted small" style="margin-top: 10px; margin-bottom: 0;">Leave blank to show the most recent 50 students.</p>
  </div>
</div>

<!-- Results Panel -->
<div class="panel">
  <div class="panel-head">
    <h3>Students</h3>
    <span class="small muted" id="transcript-count">Loading…</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin" id="transcript-table">
        <thead>
          <tr>
            <th>MATRIC</th>
            <th>NAME</th>
            <th>LEVEL</th>
            <th>PROGRAMME</th>
            <th>STATUS</th>
            <th style="width: 140px;">ACTIONS</th>
          </tr>
        </thead>
        <tbody id="transcript-tbody">
          <tr><td colspan="6" class="empty" style="text-align:center; padding: 40px; color: #64748b;">Loading students…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // Initialize on load
  if (window.FPU_ADMIN && window.FPU_ADMIN.loadTranscriptLookup) {
    setTimeout(window.FPU_ADMIN.loadTranscriptLookup, 100);
  }
</script>
