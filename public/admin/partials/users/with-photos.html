<!-- Admin → Users → With Photos -->
<section class="page-head">
  <div><h2>Users With Photos</h2><p class="muted small">Visual directory of account holders</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="FPU_ADMIN.loadUsersWithPhotos()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
    <h3>Directory</h3>
    <span class="muted small" id="photos-count">Loading users…</span>
  </div>
  <div class="panel-body">
    <div class="filters" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px;">
      <div class="form-group"><label class="form-label" for="photos-rank-filter">Staff rank</label><select class="form-select" id="photos-rank-filter"><option value="">All ranks</option></select></div>
      <div class="form-group"><label class="form-label" for="photos-department-filter">Department</label><select class="form-select" id="photos-department-filter"><option value="">All departments</option></select></div>
      <div class="form-group"><label class="form-label" for="photos-role-filter">User type / role</label><select class="form-select" id="photos-role-filter"><option value="">All user types</option></select></div>
      <div class="form-group"><label class="form-label" for="photos-search">Search users</label><input class="form-control" id="photos-search" placeholder="Name, email or matric number…" /></div>
    </div>
    <div class="grid grid-4" id="photos-grid">
      <div class="loading"><span class="spinner"></span> Loading…</div>
    </div>
  </div>
</div>
