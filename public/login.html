<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Federal Polytechnic Ugep</title>
  <link rel="icon" href="/images/logo.png" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #065f46;
      overflow: hidden;
      position: relative;
      padding: 1rem;
    }

    /* Background video */
    .bg-video {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .bg-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
      filter: blur(1px) saturate(0.8);
    }
    .bg-video::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(6,95,70,0.75), rgba(5,150,105,0.65));
    }

    /* Login card */
    .login-card {
      position: relative;
      z-index: 2;
      background: #fff;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 60px rgba(0,0,0,.35);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-card.shake {
      animation: shake 0.5s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .logo-wrap {
      text-align: center;
      margin-bottom: 1rem;
      animation: fadeUp 0.6s ease 0.1s both;
    }
    .logo-wrap img { width: 70px; height: 70px; object-fit: contain; }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #065f46;
      margin-bottom: .35rem;
      animation: fadeUp 0.6s ease 0.2s both;
    }
    .subtitle {
      text-align: center;
      font-size: .85rem;
      color: #64748b;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s ease 0.25s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-group {
      margin-bottom: 1rem;
      animation: fadeUp 0.6s ease both;
    }
    .form-group:nth-of-type(1) { animation-delay: .3s; }
    .form-group:nth-of-type(2) { animation-delay: .35s; }

    label {
      display: block;
      font-size: .75rem;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: .35rem;
    }

    .input-wrap {
      position: relative;
    }
    input {
      width: 100%;
      padding: .65rem .85rem;
      font-size: .9rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      transition: all .15s;
      font-family: inherit;
    }
    input:focus {
      outline: none;
      border-color: #059669;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(5,150,105,.15);
    }
    input.invalid {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .toggle-password {
      position: absolute;
      right: .75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #64748b;
      padding: .25rem;
      transition: color .15s;
      line-height: 1;
    }
    .toggle-password:hover { color: #065f46; }

    .caps-warning {
      display: none;
      font-size: .72rem;
      color: #d97706;
      margin-top: .3rem;
      font-weight: 600;
    }
    .caps-warning.show { display: block; }

    .error-msg {
      display: none;
      font-size: .78rem;
      color: #dc2626;
      margin-top: .35rem;
      font-weight: 600;
    }
    .error-msg.show { display: block; }

    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.6s ease 0.4s both;
    }
    .forgot-row a {
      font-size: .78rem;
      color: #065f46;
      text-decoration: none;
      font-weight: 600;
    }
    .forgot-row a:hover { text-decoration: underline; }

    .sign-in-btn {
      width: 100%;
      padding: .8rem;
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: #f59e0b;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all .2s;
      animation: fadeUp 0.6s ease 0.45s both;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .sign-in-btn:hover:not(:disabled) {
      background: #d97706;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(245,158,11,.4);
    }
    .sign-in-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .sign-in-btn.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-links {
      text-align: center;
      margin-top: 1.25rem;
      font-size: .82rem;
      color: #64748b;
      animation: fadeUp 0.6s ease 0.5s both;
    }
    .footer-links a {
      color: #065f46;
      font-weight: 700;
      text-decoration: none;
    }
    .footer-links a:hover { text-decoration: underline; }

    .divider {
      margin: .85rem 0;
      display: flex;
      justify-content: center;
      gap: .4rem;
      font-size: .78rem;
      color: #94a3b8;
      animation: fadeUp 0.6s ease 0.55s both;
    }
    .divider span { color: #cbd5e1; }

    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem; }
      h1 { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

  <!-- Background video (reliable Google sample) -->
  <div class="bg-video">
    <video autoplay muted loop playsinline poster="/images/logo.png">
      <source src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Login card -->
  <div class="login-card" id="loginCard">
    <div class="logo-wrap">
      <img src="/images/logo.png" alt="FPU Logo" onerror="this.style.display='none'" />
    </div>

    <h1>Portal Login</h1>
    <p class="subtitle">Federal Polytechnic Ugep</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@fedpolyugep.edu.ng" autocomplete="username" required />
        </div>
        <div class="error-msg" id="email-error">Please enter a valid email address.</div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" title="Show password">👁</button>
        </div>
        <div class="error-msg" id="password-error">Password is required.</div>
        <div class="caps-warning" id="capsWarning">⚠ Caps Lock is ON</div>
      </div>

      <div class="forgot-row">
        <a href="/forgot-password.html">Forgot password?</a>
      </div>

      <button type="submit" class="sign-in-btn" id="signInBtn">
        <span class="spinner"></span>
        <span>Sign In</span>
      </button>

      <div class="divider">
        Works for: <strong>Student</strong> <span>·</span> <strong>Staff</strong> <span>·</span> <strong>Admin</strong>
      </div>

      <div class="footer-links">
        New applicant? <a href="/register.html">Apply here</a>
        <br/>
        <a href="/index.html" style="font-size:.78rem;color:#94a3b8;font-weight:500;">← Back to homepage</a>
      </div>
    </form>
  </div>

  <script>
  (function () {
    'use strict';

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const signInBtn = document.getElementById('signInBtn');
    const loginCard = document.getElementById('loginCard');
    const emailError = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');
    const capsWarning = document.getElementById('capsWarning');

    // ===== Show / hide password =====
    toggleBtn.addEventListener('click', function () {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleBtn.textContent = '🙈';
        toggleBtn.setAttribute('aria-label', 'Hide password');
        toggleBtn.setAttribute('title', 'Hide password');
      } else {
        passwordInput.type = 'password';
        toggleBtn.textContent = '👁';
        toggleBtn.setAttribute('aria-label', 'Show password');
        toggleBtn.setAttribute('title', 'Show password');
      }
      passwordInput.focus();
    });

    // ===== Caps Lock detection =====
    passwordInput.addEventListener('keyup', function (e) {
      const isCaps = e.getModifierState && e.getModifierState('CapsLock');
      capsWarning.classList.toggle('show', isCaps);
    });

    // ===== Email validation =====
    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    emailInput.addEventListener('input', function () {
      emailInput.classList.remove('invalid');
      emailError.classList.remove('show');
    });

    passwordInput.addEventListener('input', function () {
      passwordInput.classList.remove('invalid');
      passwordError.classList.remove('show');
    });

    // ===== Submit =====
    form.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      let valid = true;

      if (!isValidEmail(email)) {
        emailInput.classList.add('invalid');
        emailError.classList.add('show');
        valid = false;
      }

      if (!password) {
        passwordInput.classList.add('invalid');
        passwordError.classList.add('show');
        valid = false;
      }

      if (!valid) {
        loginCard.classList.add('shake');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      // Loading state
      signInBtn.disabled = true;
      signInBtn.classList.add('loading');
      signInBtn.querySelector('span:last-child').textContent = 'Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
          credentials: 'include'
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'Invalid email or password.');
        }

        if (data.token) {
          localStorage.setItem('fpu_token', data.token);
        }
        if (data.user) {
          localStorage.setItem('fpu_user', JSON.stringify(data.user));
        }

        const role = (data.user?.role || '').toLowerCase();
        if (role === 'student') {
          window.location.href = '/portal/app.html#student-dashboard';
        } else if (role === 'lecturer') {
          window.location.href = '/portal/app.html#lecturer-dashboard';
        } else if (role === 'hod') {
          window.location.href = '/portal/app.html#hod-dashboard';
        } else if (role === 'admin') {
          window.location.href = '/portal/admin/index.html';
        } else {
          window.location.href = '/portal/app.html';
        }

      } catch (err) {
        loginCard.classList.add('shake');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        alert(err.message || 'Login failed. Please check your details.');
        signInBtn.disabled = false;
        signInBtn.classList.remove('loading');
        signInBtn.querySelector('span:last-child').textContent = 'Sign In';
      }
    });
  })();
  </script>
</body>
</html>
