<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Federal Polytechnic Ugep</title>
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .login-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      position: relative;
      overflow: hidden;
      background: #065f46;
    }

    /* Background video — YouTube iframe covering viewport */
    .bg-video {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #065f46;
    }
    .bg-video iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      border: 0;
      pointer-events: none;
      opacity: 0.45;
    }
    .bg-video::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(6,95,70,0.75), rgba(5,150,105,0.65));
      pointer-events: none;
    }

    /* Login card */
    .login-card-public {
      position: relative;
      z-index: 2;
      background: #fff;
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      border-top: 6px solid var(--fpu-accent, #f59e0b);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-card-public.shake {
      animation: shake 0.5s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }

    @media (max-width: 480px) {
      .login-card-public { padding: 32px 22px; }
    }

    .login-card-public h1 {
      font-family: Poppins, sans-serif;
      font-size: 1.5rem;
      color: var(--fpu-primary, #065f46);
      text-align: center;
      margin: 0 0 6px;
      animation: fadeUp 0.6s ease 0.15s both;
    }
    .login-card-public .sub {
      text-align: center;
      color: var(--fpu-muted, #64748b);
      font-size: 14px;
      margin: 0 0 26px;
      animation: fadeUp 0.6s ease 0.2s both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      display: block;
      height: 60px;
      margin: 0 auto 16px;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    /* Password field wrapper */
    .password-wrap {
      position: relative;
    }
    .password-wrap input {
      padding-right: 44px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #64748b;
      padding: 6px;
      line-height: 1;
      border-radius: 4px;
      transition: color .15s, background .15s;
    }
    .toggle-password:hover {
      color: var(--fpu-primary, #065f46);
      background: #f1f5f9;
    }

    .caps-warning {
      display: none;
      font-size: 12px;
      color: #d97706;
      margin-top: 6px;
      font-weight: 600;
    }
    .caps-warning.show { display: block; }

    .error-msg {
      display: none;
      font-size: 12.5px;
      color: #dc2626;
      margin-top: 5px;
      font-weight: 600;
    }
    .error-msg.show { display: block; }

    .form-group:nth-of-type(1) { animation: fadeUp 0.6s ease 0.25s both; }
    .form-group:nth-of-type(2) { animation: fadeUp 0.6s ease 0.3s both; }

    .role-hint {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      font-size: 12.5px;
      color: var(--fpu-muted, #64748b);
      animation: fadeUp 0.6s ease 0.45s both;
    }
    .role-hint strong { color: var(--fpu-primary, #065f46); }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
      visibility: hidden;
    }
    #loginBtn.loading .spinner { visibility: visible; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-page-wrap">

    <!-- Background video (YouTube) -->
    <div class="bg-video">
      <iframe
        src="https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=1&mute=1&loop=1&playlist=ScMzIvxBSi4&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0"
        title="Background video"
        allow="autoplay; encrypted-media"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>

    <div class="login-card-public" id="loginCard">
      <img src="/images/logo.png" alt="FPU" class="login-logo" onerror="this.style.display='none'" />
      <h1>Portal Login</h1>
      <p class="sub">Federal Polytechnic Ugep</p>

      <div id="form-alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" required placeholder="you@example.com" autocomplete="username" autofocus />
          <div class="error-msg" id="email-error">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" name="password" id="password-field" required placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" title="Show password">👁</button>
          </div>
          <div class="error-msg" id="password-error">Password is required.</div>
          <div class="caps-warning" id="capsWarning">⚠ Caps Lock is ON</div>
        </div>

        <div style="text-align:right;margin-bottom:16px;">
          <a href="/forgot-password.html" style="font-size:13px;color:var(--fpu-primary,#065f46);font-weight:600;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-accent btn-lg" style="width:100%;" id="loginBtn">
          <span class="spinner"></span><span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="role-hint" style="margin-top:20px;">
        <span>Works for: <strong>Student</strong></span>
        <span>· <strong>Staff</strong></span>
        <span>· <strong>Admin</strong></span>
      </div>

      <p style="text-align:center;font-size:13.5px;color:var(--fpu-muted,#64748b);margin:22px 0 0;">
        New applicant? <a href="/apply.html" style="color:var(--fpu-primary,#065f46);font-weight:700;">Apply here</a>
      </p>
      <p style="text-align:center;font-size:13px;color:var(--fpu-muted,#64748b);margin:6px 0 0;">
        <a href="/" style="color:var(--fpu-muted,#64748b);">← Back to homepage</a>
      </p>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    const loginCard   = document.getElementById('loginCard');
    const passwordField = document.getElementById('password-field');
    const toggleBtn   = document.getElementById('togglePassword');
    const capsWarning = document.getElementById('capsWarning');
    const emailError  = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');

    // ===== Show / hide password =====
    toggleBtn.addEventListener('click', function () {
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleBtn.textContent = '🙈';
        toggleBtn.setAttribute('aria-label', 'Hide password');
        toggleBtn.setAttribute('title', 'Hide password');
      } else {
        passwordField.type = 'password';
        toggleBtn.textContent = '👁';
        toggleBtn.setAttribute('aria-label', 'Show password');
        toggleBtn.setAttribute('title', 'Show password');
      }
      passwordField.focus();
    });

    // ===== Caps Lock detection =====
    passwordField.addEventListener('keyup', function (e) {
      const isCaps = e.getModifierState && e.getModifierState('CapsLock');
      capsWarning.classList.toggle('show', isCaps);
    });

    // ===== Clear errors on input =====
    document.querySelector('input[name="email"]').addEventListener('input', function () {
      this.classList.remove('invalid');
      emailError.classList.remove('show');
    });
    passwordField.addEventListener('input', function () {
      this.classList.remove('invalid');
      passwordError.classList.remove('show');
    });

    // ===== Login =====
    window.handleLogin = async function (event) {
      event.preventDefault();
      const form = event.target;
      const alertBox = document.getElementById('form-alert');
      const btn = document.getElementById('loginBtn');
      const btnText = btn.querySelector('.btn-text');

      const email = form.email.value.trim();
      const password = form.password.value;

      // Validate
      let valid = true;
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRe.test(email)) {
        form.email.classList.add('invalid');
        emailError.classList.add('show');
        valid = false;
      }
      if (!password) {
        form.password.classList.add('invalid');
        passwordError.classList.add('show');
        valid = false;
      }
      if (!valid) {
        loginCard.classList.add('shake');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.classList.add('loading');
      btnText.textContent = 'Signing in…';
      alertBox.className = '';
      alertBox.textContent = '';

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const json = await res.json();

        if (!json.success) {
          alertBox.className = 'alert alert-error';
          alertBox.textContent = '❌ ' + (json.error || json.message || 'Invalid credentials.');
          loginCard.classList.add('shake');
          setTimeout(() => loginCard.classList.remove('shake'), 500);
          return;
        }

        // Save session tokens
        const token = json.token;
        const user = json.user;
        localStorage.setItem('portal_token', token);
        localStorage.setItem('portal_user', JSON.stringify(user));
        localStorage.setItem('fpu_admin_token', token);
        localStorage.setItem('fpu_admin_user', JSON.stringify(user));

        const role = String(user?.role || '').toLowerCase();

        const ROLE_ROUTES = {
          student:           '/portal/app.html',
          applicant:         '/apply-status.html',
          lecturer:          '/portal/app.html',
          hod:               '/portal/app.html',
          bursar:            '/portal/app.html',
          rector:            '/portal/app.html',
          registrar:         '/portal/app.html',
          librarian:         '/portal/app.html',
          exam_officer:      '/portal/app.html',
          academic_officer:  '/portal/app.html',
          admission_officer: '/portal/app.html',
          admin:             '/portal/app.html',
          superadmin:        '/portal/app.html',
        };

        const destination = ROLE_ROUTES[role] || '/portal/app.html';

        const WELCOME = {
          student:           '✅ Welcome back! Taking you to your student dashboard…',
          applicant:         '✅ Taking you to your application status…',
          lecturer:          '✅ Welcome! Taking you to your lecturer dashboard…',
          hod:               '✅ Welcome! Taking you to your HOD dashboard…',
          bursar:            '✅ Welcome! Taking you to your bursar dashboard…',
          rector:            '✅ Welcome! Taking you to your dashboard…',
          registrar:         '✅ Welcome! Taking you to your registrar dashboard…',
          librarian:         '✅ Welcome! Taking you to your librarian dashboard…',
          exam_officer:      '✅ Welcome! Taking you to your exam officer dashboard…',
          academic_officer:  '✅ Welcome! Taking you to your academic officer dashboard…',
          admission_officer: '✅ Welcome! Taking you to your admission officer dashboard…',
          admin:             '✅ Welcome! Taking you to your admin dashboard…',
          superadmin:        '✅ Welcome! Taking you to your dashboard…',
        };

        const message = WELCOME[role] || '✅ Login successful. Redirecting…';

        alertBox.className = 'alert alert-success';
        alertBox.textContent = message;

        setTimeout(() => {
          window.location.href = destination;
        }, 700);

      } catch (err) {
        console.error('[login] error:', err);
        alertBox.className = 'alert alert-error';
        alertBox.textContent = '❌ Connection error. Please try again.';
        loginCard.classList.add('shake');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btnText.textContent = 'Sign In';
      }
    };
  })();
  </script>
</body>
</html>
