<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Federal Polytechnic Ugep</title>
  <link rel="icon" href="/images/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    .login-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0f766e, #065f46, #064e3b);
      background-size: 400% 400%;
      animation: bgShift 18s ease infinite;
    }
    @keyframes bgShift {
      0%,100% { background-position: 0% 50%; }
      50%     { background-position: 100% 50%; }
    }

    /* Background video — YouTube iframe */
    .bg-video {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .bg-video iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.78vh;
      border: 0;
      pointer-events: none;
    }
    /* Light overlay so video shows through but text stays readable */
    .bg-video::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(6,95,70,0.55), rgba(5,150,105,0.45));
      pointer-events: none;
    }

    /* Floating particles */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    .particles span {
      position: absolute;
      display: block;
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(110vh) scale(0.4); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ===== CARD ===== */
    .login-card-public {
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      border-top: 6px solid #f59e0b;
      animation: cardSlideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes cardSlideUp {
      from { opacity: 0; transform: translateY(60px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-card-public.shake {
      animation: shake 0.5s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }

    @media (max-width: 480px) {
      .login-card-public { padding: 32px 22px; }
    }

    .login-logo {
      display: block;
      height: 66px;
      margin: 0 auto 12px;
      animation: logoPop 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
    }
    @keyframes logoPop {
      0%   { opacity: 0; transform: scale(0.4) rotate(-15deg); }
      60%  { transform: scale(1.1) rotate(5deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    .login-card-public h1 {
      font-family: Poppins, sans-serif;
      font-size: 1.5rem;
      color: #065f46;
      text-align: center;
      margin: 0 0 6px;
      animation: fadeSlide 0.7s ease 0.3s both;
    }
    .login-card-public .sub {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin: 0 0 6px;
      animation: fadeSlide 0.7s ease 0.4s both;
    }
    /* ===== WRITEUP / TAGLINE ===== */
    .tagline {
      text-align: center;
      font-size: 12.5px;
      color: #94a3b8;
      font-style: italic;
      margin: 0 0 26px;
      padding: 0 20px;
      animation: fadeSlide 0.7s ease 0.5s both;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Staggered fields */
    .form-group {
      animation: fadeSlide 0.6s ease both;
    }
    .form-group:nth-of-type(1) { animation-delay: 0.55s; }
    .form-group:nth-of-type(2) { animation-delay: 0.65s; }

    /* Inputs */
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      font-size: 14.5px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      transition: all 0.2s;
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      border-color: #059669;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(5,150,105,0.18);
    }
    .form-group input.invalid {
      border-color: #dc2626;
      background: #fef2f2;
    }

    /* Password toggle */
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 44px; }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #64748b;
      padding: 6px;
      border-radius: 4px;
      transition: all 0.15s;
    }
    .toggle-password:hover {
      color: #065f46;
      background: #f1f5f9;
    }

    /* Error / Caps */
    .error-msg, .caps-warning {
      display: none;
      font-size: 12.5px;
      margin-top: 5px;
      font-weight: 600;
    }
    .error-msg { color: #dc2626; }
    .caps-warning { color: #d97706; }
    .error-msg.show, .caps-warning.show { display: block; }

    /* Sign In button — animated gradient */
    #loginBtn {
      position: relative;
      width: 100%;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #f59e0b, #d97706, #f59e0b);
      background-size: 200% 100%;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.25s;
      animation: fadeSlide 0.6s ease 0.75s both, gradientShift 3s ease infinite;
    }
    #loginBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(245,158,11,0.5);
    }
    #loginBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
      visibility: hidden;
    }
    #loginBtn.loading .spinner { visibility: visible; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .role-hint {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      font-size: 12.5px;
      color: #64748b;
      animation: fadeSlide 0.6s ease 0.85s both;
    }
    .role-hint strong { color: #065f46; }

    .footer-links {
      text-align: center;
      animation: fadeSlide 0.6s ease 0.95s both;
    }
    .footer-links p {
      font-size: 13.5px;
      color: #64748b;
      margin: 22px 0 0;
    }
    .footer-links a {
      color: #065f46;
      font-weight: 700;
      text-decoration: none;
    }
    .footer-links a:hover { text-decoration: underline; }

    .divider-line {
      height: 1px;
      background: #e2e8f0;
      margin: 20px 0 12px;
      animation: fadeSlide 0.6s ease 0.9s both;
    }
  </style>
</head>
<body>

  <div class="login-page-wrap">

    <!-- Background video (YouTube) -->
    <div class="bg-video">
      <iframe
        src="https://www.youtube.com/embed/ScMzIvxBSi4?autoplay=1&mute=1&loop=1&playlist=ScMzIvxBSi4&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0"
        title="Background video"
        allow="autoplay; encrypted-media"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>

    <!-- Floating particles -->
    <div class="particles" id="particles"></div>

    <!-- Login Card -->
    <div class="login-card-public" id="loginCard">
      <img src="/images/logo.png" alt="FPU" class="login-logo" onerror="this.style.display='none'" />
      <h1>Portal Login</h1>
      <p class="sub">Federal Polytechnic Ugep</p>
      <p class="tagline">Knowledge · Integrity · Service — Welcome back to your academic home.</p>

      <div id="form-alert"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" required placeholder="you@example.com" autocomplete="username" autofocus />
          <div class="error-msg" id="email-error">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" name="password" id="password-field" required placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" title="Show password">👁</button>
          </div>
          <div class="error-msg" id="password-error">Password is required.</div>
          <div class="caps-warning" id="capsWarning">⚠ Caps Lock is ON</div>
        </div>

        <div style="text-align:right;margin-bottom:16px;animation:fadeSlide 0.6s ease 0.7s both;">
          <a href="/forgot-password.html" style="font-size:13px;color:#065f46;font-weight:600;">Forgot password?</a>
        </div>

        <button type="submit" id="loginBtn">
          <span class="spinner"></span><span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="divider-line"></div>

      <div class="role-hint">
        <span>Works for: <strong>Student</strong></span>
        <span>· <strong>Staff</strong></span>
        <span>· <strong>Admin</strong></span>
      </div>

      <div class="footer-links">
        <p>New applicant? <a href="/apply.html">Apply here</a></p>
        <p style="margin-top:6px;"><a href="/" style="color:#94a3b8;font-weight:500;">← Back to homepage</a></p>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    // ===== Floating particles =====
    const particlesBox = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const s = document.createElement('span');
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (8 + Math.random() * 12) + 's';
      s.style.animationDelay = (Math.random() * 15) + 's';
      s.style.width = s.style.height = (3 + Math.random() * 5) + 'px';
      s.style.opacity = 0.3 + Math.random() * 0.5;
      particlesBox.appendChild(s);
    }

    const loginCard   = document.getElementById('loginCard');
    const passwordField = document.getElementById('password-field');
    const toggleBtn   = document.getElementById('togglePassword');
    const capsWarning = document.getElementById('capsWarning');
    const emailError  = document.getElementById('email-error');
    const passwordError = document.getElementById('password-error');

    // ===== Password toggle =====
    toggleBtn.addEventListener('click', function () {
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleBtn.textContent = '🙈';
        toggleBtn.setAttribute('title', 'Hide password');
      } else {
        passwordField.type = 'password';
        toggleBtn.textContent = '👁';
        toggleBtn.setAttribute('title', 'Show password');
      }
      passwordField.focus();
    });

    // ===== Caps Lock =====
    passwordField.addEventListener('keyup', function (e) {
      const isCaps = e.getModifierState && e.getModifierState('CapsLock');
      capsWarning.classList.toggle('show', isCaps);
    });

    // ===== Clear errors =====
    document.querySelector('input[name="email"]').addEventListener('input', function () {
      this.classList.remove('invalid');
      emailError.classList.remove('show');
    });
    passwordField.addEventListener('input', function () {
      this.classList.remove('invalid');
      passwordError.classList.remove('show');
    });

    // ===== Login =====
    window.handleLogin = async function (event) {
      event.preventDefault();
      const form = event.target;
      const alertBox = document.getElementById('form-alert');
      const btn = document.getElementById('loginBtn');
      const btnText = btn.querySelector('.btn-text');

      const email = form.email.value.trim();
      const password = form.password.value;

      // Validate
      let valid = true;
      const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRe.test(email)) {
        form.email.classList.add('invalid');
        emailError.classList.add('show');
        valid = false;
      }
      if (!password) {
        form.password.classList.add('invalid');
        passwordError.classList.add('show');
        valid = false;
      }
      if (!valid) {
        loginCard.classList.add('shake');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
        return;
      }

      // Loading state
      btn.disabled = true;
      btn.classList.add('loading');
      btnText.textContent = 'Signing in…';
      alertBox.className = '';
      alertBox.textContent = '';

      try {
        const res = await fetch('/api/admin/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const json = await res.json();

        if (!json.success) {
          alertBox.className = 'alert alert-error';
          alertBox.textContent = '❌ ' + (json.error || json.message || 'Invalid credentials.');
          loginCard.classList.add('shake');
          setTimeout(() => loginCard.classList.remove('shake'), 500);
          return;
        }

        // Save session tokens
        const token = json.token;
        const user = json.user;
        localStorage.setItem('portal_token', token);
        localStorage.setItem('portal_user', JSON.stringify(user));
        localStorage.setItem('fpu_admin_token', token);
        localStorage.setItem('fpu_admin_user', JSON.stringify(user));

        const role = String(user?.role || '').toLowerCase();

        const ROLE_ROUTES = {
          student:           '/portal/app.html',
          applicant:         '/apply-status.html',
          lecturer:          '/portal/app.html',
          hod:               '/portal/app.html',
          bursar:            '/portal/app.html',
          rector:            '/portal/app.html',
          registrar:         '/portal/app.html',
          librarian:         '/portal/app.html',
          exam_officer:      '/portal/app.html',
          academic_officer:  '/portal/app.html',
          admission_officer: '/portal/app.html',
          admin:             '/portal/app.html',
          superadmin:        '/portal/app.html',
        };

        const destination = ROLE_ROUTES[role] || '/portal/app.html';
        const message = `✅ Welcome! Taking you to your ${role || 'portal'} dashboard…`;

        alertBox.className = 'alert alert-success';
        alertBox.textContent = message;

        setTimeout(() => {
          window.location.href = destination;
        }, 800);

      } catch (err) {
        console.error('[login] error:', err);
        alertBox.className = 'alert alert-error';
        alertBox.textContent = '❌ Connection error. Please try again.';
        loginCard.classList.add('shake');
        setTimeout(() => loginCard.classList.remove('shake'), 500);
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
        btnText.textContent = 'Sign In';
      }
    };
  })();
  </script>
</body>
</html>
