<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal — Federal Polytechnic Ugep</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="stylesheet" href="/css/portal.css" />
</head>
<body class="portal-app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/images/logo.png" alt="FPU" />
      <span>FPU Portal</span>
    </div>
    <nav id="sidebar-nav">
      <div class="loading" style="color:#a7f3d0;padding:1rem;"><span class="spinner"></span> Loading…</div>
    </nav>
    <div class="sidebar-footer">
      <span>&copy; <span id="sb-year"></span> FPU</span>
      <span style="font-size:.68rem;">v1.0</span>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 id="topbar-title">Dashboard</h1>
        <div class="subtitle" id="page-subtitle"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" title="Notifications" onclick="FPU_SPA.navigatePortal('portal-notifications')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      </button>
      <button class="icon-btn" title="Messages" onclick="FPU_SPA.navigatePortal('portal-messages')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </button>
      <div class="user-chip" onclick="FPU_SPA.navigatePortal('portal-profile')">
        <div class="avatar" id="topbar-avatar">U</div>
        <div>
          <div class="name" id="topbar-name">User</div>
          <div class="role" id="topbar-role">student</div>
        </div>
      </div>
      <button class="icon-btn" title="Sign out" id="topbar-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <div id="page-view">
      <div class="loading"><span class="spinner"></span> Loading portal…</div>
    </div>
  </main>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="/js/portal-core.js"></script>
  <script src="/js/portal-photo-helper.js"></script>
  <script src="/js/portal-spa.js"></script>
  <script>
    document.getElementById('sb-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
