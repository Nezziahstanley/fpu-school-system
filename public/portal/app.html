<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal — Federal Polytechnic Ugep</title>
  <link rel="icon" href="/images/logo.png" />
  <link rel="stylesheet" href="/css/portal.css" />
<style id="notif-css">
  .notif-wrap { position: relative; }
  .notif-badge {
    position: absolute; top: 2px; right: 2px;
    min-width: 16px; height: 16px;
    background: #dc2626; color: #fff;
    border-radius: 99px; font-size: 10px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px; line-height: 1;
    box-shadow: 0 0 0 2px #fff;
  }
  .notif-badge[hidden] { display: none !important; }
  .notif-panel {
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 360px; max-width: calc(100vw - 20px);
    background: #fff; border-radius: 12px;
    box-shadow: 0 12px 40px rgba(15,23,42,.18), 0 0 0 1px rgba(15,23,42,.06);
    z-index: 5000; overflow: hidden;
  }
  .notif-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: .75rem 1rem;
    border-bottom: 1px solid #f1f5f9;
    font-weight: 700; font-size: .85rem; color: #0f172a;
  }
  .notif-mark-all {
    background: none; border: none; cursor: pointer;
    color: #065f46; font-size: .75rem; font-weight: 600;
    padding: 0;
  }
  .notif-mark-all:hover { text-decoration: underline; }
  .notif-list { max-height: 380px; overflow-y: auto; }
  .notif-item {
    display: block; width: 100%; text-align: left;
    padding: .75rem 1rem;
    border: none; background: transparent;
    border-bottom: 1px solid #f8fafc;
    cursor: pointer;
    transition: background .12s;
  }
  .notif-item:hover { background: #f8fafc; }
  .notif-item.unread { background: #f0fdf4; }
  .notif-item.unread:hover { background: #dcfce7; }
  .notif-item-top {
    display: flex; justify-content: space-between; gap: .5rem;
    align-items: baseline;
  }
  .notif-item-title {
    font-weight: 700; color: #0f172a; font-size: .82rem;
    display: flex; align-items: center; gap: .35rem;
  }
  .notif-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; flex-shrink: 0; }
  .notif-item-time { font-size: .68rem; color: #94a3b8; white-space: nowrap; }
  .notif-item-body {
    color: #475569; font-size: .75rem; margin-top: .2rem;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .notif-empty { padding: 2rem 1rem; text-align: center; color: #94a3b8; font-size: .82rem; }
  .notif-loading { padding: 1.5rem; text-align: center; color: #94a3b8; font-size: .82rem; }
  .notif-foot {
    padding: .6rem 1rem;
    border-top: 1px solid #f1f5f9;
    text-align: center;
  }
  .notif-view-all {
    background: none; border: none; cursor: pointer;
    color: #065f46; font-size: .78rem; font-weight: 700;
    padding: 0;
  }
  .notif-view-all:hover { text-decoration: underline; }
  @media (max-width: 640px) {
    .notif-panel { width: calc(100vw - 20px); right: -8px; }
  }
</style>
</head>
<body class="portal-app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/images/logo.png" alt="FPU" />
      <span>FPU Portal</span>
    </div>
    <nav id="sidebar-nav">
      <div class="loading" style="color:#a7f3d0;padding:1rem;"><span class="spinner"></span> Loading…</div>
    </nav>
    <div class="sidebar-footer">
      <span>&copy; <span id="sb-year"></span> FPU</span>
      <span style="font-size:.68rem;">v1.0</span>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div>
        <h1 id="topbar-title">Dashboard</h1>
        <div class="subtitle" id="page-subtitle"></div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" title="Notifications" onclick="FPU_SPA.navigatePortal('portal-notifications')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      </button>
      <button class="icon-btn" title="Messages" onclick="FPU_SPA.navigatePortal('portal-messages')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      </button>
      <div class="user-chip-wrap" id="topbar-user-wrap">
        <button class="user-chip" id="topbar-user-chip" type="button" aria-haspopup="menu" aria-expanded="false">
          <div class="avatar" id="topbar-avatar">U</div>
          <div>
            <div class="name" id="topbar-name">User</div>
            <div class="role" id="topbar-role">student</div>
          </div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M6 9l6 6 6-6"/></svg>
        </button>

        <div class="user-menu" id="topbar-user-menu" role="menu" hidden>
          <div class="user-menu-header">
            <div class="avatar" id="user-menu-avatar">U</div>
            <div>
              <div class="name" id="user-menu-name">User</div>
              <div class="email" id="user-menu-email">user@example.com</div>
            </div>
          </div>
          <div class="user-menu-divider" role="separator"></div>
          <button class="user-menu-item" role="menuitem" data-menu="profile">👤 My Profile</button>
          <button class="user-menu-item" role="menuitem" data-menu="photo">📷 My Photo</button>
          <button class="user-menu-item" role="menuitem" data-menu="password">🔒 Change Password</button>
          <button class="user-menu-item" role="menuitem" data-menu="notifications">🔔 Notifications</button>
          <div class="user-menu-divider" role="separator"></div>
          <button class="user-menu-item user-menu-danger" role="menuitem" data-menu="logout">🚪 Sign Out</button>
        </div>
      </div>
      <button class="icon-btn" title="Sign out" id="topbar-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main" id="main">
    <div id="page-view">
      <div class="loading"><span class="spinner"></span> Loading portal…</div>
    </div>
  </main>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="/js/portal-core.js"></script>
  <script src="/js/portal-photo-helper.js"></script>
  <script src="/js/portal-spa.js"></script>
  <script>
    document.getElementById('sb-year').textContent = new Date().getFullYear();
  </script>
<!-- PORTAL MOBILE FALLBACK START -->
<style id="portal-mobile-fallback">
@media (max-width: 980px) {
  html, body.portal-app { overflow-x: hidden !important; width: 100% !important; max-width: 100% !important; }

  body.portal-app #sidebar {
    position: fixed !important; top:0 !important; bottom:0 !important; left:0 !important;
    width: 280px !important; max-width: 84vw !important;
    transform: translateX(-105%) !important;
    visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
    transition: transform .25s ease-out !important;
    z-index: 1100 !important; overflow-y: auto !important;
  }
  body.portal-app.sidebar-open #sidebar,
  body.portal-app #sidebar.open {
    transform: translateX(0) !important;
    visibility: visible !important; opacity: 1 !important; pointer-events: auto !important;
  }
  body.portal-app.sidebar-open::after {
    content:'' !important; position:fixed !important; inset:0 !important;
    background: rgba(15,23,42,.5) !important; z-index: 1090 !important;
  }

  body.portal-app .layout,
  body.portal-app .app-layout,
  body.portal-app .app-shell,
  body.portal-app .portal-layout,
  body.portal-app .portal-shell,
  body.portal-app > * {
    display: block !important;
    grid-template-columns: 1fr !important;
    flex-direction: column !important;
    width: 100% !important;
    max-width: 100% !important;
  }

  main.main {
    width: 100% !important; max-width: 100% !important;
    margin: 0 !important;
    padding-left: .75rem !important; padding-right: .75rem !important;
    box-sizing: border-box !important;
  }
  main.main > *, main.main > * > * {
    width: 100% !important; max-width: 100% !important;
    margin-left: 0 !important; margin-right: 0 !important;
    box-sizing: border-box !important;
  }

  .topbar, .portal-topbar, .app-topbar, header.topbar {
    width: 100% !important; max-width: 100% !important;
    left: 0 !important; right: 0 !important;
    padding-left: .75rem !important; padding-right: .75rem !important;
    box-sizing: border-box !important;
  }

  .panel, .card, .tile, .greeting, .filters, .filter-bar {
    width: 100% !important; max-width: 100% !important; box-sizing: border-box !important;
  }

  .greeting { flex-direction: column !important; align-items: flex-start !important; gap: .75rem !important; }
  .greeting .meta { text-align: left !important; width: 100% !important; padding-top: .75rem !important; border-top: 1px solid rgba(255,255,255,.18) !important; }

  .tile-grid, .stat-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: .6rem !important;
  }

  .grid, .row, .cols, .chart-grid, [class*="grid-"], [class*="cols-"] {
    display: block !important; grid-template-columns: 1fr !important; gap: .75rem !important;
  }

  .table-wrap { overflow-x: auto !important; -webkit-overflow-scrolling: touch !important; }

  main.main [style*="max-width"] { max-width: 100% !important; }
}
@media (max-width: 640px) {
  body.portal-app #sidebar { width: 260px !important; max-width: 86vw !important; }
  .tile-grid, .stat-grid { grid-template-columns: 1fr !important; }
  main.main { padding-left: .5rem !important; padding-right: .5rem !important; }
}
@media (max-width: 400px) {
  body.portal-app #sidebar { width: 240px !important; max-width: 90vw !important; }
}
</style>
<script>
/* Portal mobile — sidebar toggle fallback */
(function () {
  function bind() {
    var toggle = document.getElementById('sidebar-toggle');
    var sb = document.getElementById('sidebar');
    if (!toggle || !sb) return;
    if (toggle.dataset.bound === '1') return;
    toggle.dataset.bound = '1';
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      var open = document.body.classList.toggle('sidebar-open');
      sb.classList.toggle('open', open);
    });
    document.addEventListener('click', function (e) {
      if (!document.body.classList.contains('sidebar-open')) return;
      if (sb.contains(e.target) || toggle.contains(e.target)) return;
      document.body.classList.remove('sidebar-open');
      sb.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) {
        document.body.classList.remove('sidebar-open');
        sb.classList.remove('open');
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>
<!-- PORTAL MOBILE FALLBACK END -->
<!-- PORTAL SIDEBAR TOGGLE FIX START -->
<script>
(function () {
  'use strict';
  function openSidebar() {
    document.body.classList.add('sidebar-open');
    var sb = document.getElementById('sidebar');
    if (sb) sb.classList.add('open');
  }
  function closeSidebar() {
    document.body.classList.remove('sidebar-open');
    var sb = document.getElementById('sidebar');
    if (sb) sb.classList.remove('open');
  }
  function toggleSidebar() {
    if (document.body.classList.contains('sidebar-open')) closeSidebar();
    else openSidebar();
  }
  function bind() {
    var toggle =
      document.getElementById('sidebar-toggle') ||
      document.querySelector('.topbar .toggle') ||
      document.querySelector('button[aria-label*="sidebar" i]') ||
      document.querySelector('button[aria-label*="menu" i]');
    var sb = document.getElementById('sidebar');
    if (!toggle || !sb) { console.warn('[sidebar] elements missing'); return; }
    if (toggle.dataset.sbBound === '1') return;
    toggle.dataset.sbBound = '1';
    toggle.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      toggleSidebar();
    });
    document.addEventListener('click', function (e) {
      if (!document.body.classList.contains('sidebar-open')) return;
      if (sb.contains(e.target) || toggle.contains(e.target)) return;
      closeSidebar();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeSidebar();
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
})();
</script>
<!-- PORTAL SIDEBAR TOGGLE FIX END -->

<script id="notif-bell-js">
(function () {
  'use strict';
  var core = window.FPU_PORTAL || {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s); };
  var timeAgo = function (d) { return core.timeAgo ? core.timeAgo(d) : ''; };

  var POLL_MS = 30000;
  var panel, bell, badge, list;
  var timer = null;
  var bound = false;

  function renderList(rows) {
    if (!rows.length) {
      list.innerHTML = '<div class="notif-empty">You\'re all caught up.</div>';
      return;
    }
    list.innerHTML = rows.slice(0, 10).map(function (n) {
      var unread = n.isRead === false || n.isRead === undefined;
      return '<button type="button" class="notif-item ' + (unread ? 'unread' : '') + '" data-id="' + esc(n.id) + '" data-link="' + esc(n.link || '') + '">'
        + '<div class="notif-item-top">'
        +   '<span class="notif-item-title">' + (unread ? '<span class="notif-dot"></span>' : '') + esc(n.title || 'Notification') + '</span>'
        +   '<span class="notif-item-time">' + esc(timeAgo(n.createdAt) || '') + '</span>'
        + '</div>'
        + (n.body ? '<div class="notif-item-body">' + esc(n.body) + '</div>' : '')
        + '</button>';
    }).join('');
    list.querySelectorAll('.notif-item').forEach(function (el) {
      el.addEventListener('click', function () { openItem(el); });
    });
  }

  async function openItem(el) {
    var id = el.dataset.id;
    var link = el.dataset.link || '';
    try { await core.portalFetch('/api/portal/notifications/' + id + '/read', { method: 'POST' }); }
    catch (e) { /* silent */ }
    closePanel();
    refresh();
    if (link) {
      var hash = link.split('#').pop();
      if (window.FPU_SPA && window.FPU_SPA.navigatePortal && hash && /^[a-z-]+$/.test(hash)) {
        window.FPU_SPA.navigatePortal(hash);
        return;
      }
      window.location.href = link;
    } else if (window.FPU_SPA && window.FPU_SPA.navigatePortal) {
      window.FPU_SPA.navigatePortal('portal-notifications');
    }
  }

  async function refresh() {
    try {
      var res = await core.portalFetch('/api/portal/notifications?limit=10');
      var rows = (res && res.data) || [];
      var unread = (res && res.unread) || 0;
      if (badge) {
        if (unread > 0) { badge.hidden = false; badge.textContent = unread > 99 ? '99+' : String(unread); }
        else { badge.hidden = true; }
      }
      if (list) renderList(rows);
    } catch (err) { /* silent */ }
  }

  function openPanel() {
    if (!panel) return;
    panel.hidden = false;
    if (bell) bell.setAttribute('aria-expanded', 'true');
    refresh();
  }
  function closePanel() {
    if (!panel) return;
    panel.hidden = true;
    if (bell) bell.setAttribute('aria-expanded', 'false');
  }

  async function markAllRead() {
    try {
      await core.portalFetch('/api/portal/notifications/read-all', { method: 'POST' });
      if (core.showToast) core.showToast('All marked as read.', 'success');
      refresh();
    } catch (err) { if (core.showToast) core.showToast(err.message, 'error'); }
  }

  function goToNotifications() {
    closePanel();
    if (window.FPU_SPA && window.FPU_SPA.navigatePortal) {
      window.FPU_SPA.navigatePortal('portal-notifications');
    } else {
      window.location.hash = 'portal-notifications';
    }
  }

  function bind() {
    if (bound) return;
    panel = $('notif-panel');
    bell = $('notif-bell');
    badge = $('notif-badge');
    list = $('notif-list');
    if (!panel || !bell || !list) return false;
    bound = true;

    bell.addEventListener('click', function (e) {
      e.stopPropagation();
      if (panel.hidden) openPanel(); else closePanel();
    });
    var markAll = $('notif-mark-all');
    if (markAll) markAll.addEventListener('click', function (e) { e.stopPropagation(); markAllRead(); });
    var viewAll = $('notif-view-all');
    if (viewAll) viewAll.addEventListener('click', function (e) { e.stopPropagation(); goToNotifications(); });

    document.addEventListener('click', function (e) {
      if (!panel || panel.hidden) return;
      if (panel.contains(e.target) || bell.contains(e.target)) return;
      closePanel();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel && !panel.hidden) closePanel();
    });

    refresh();
    if (timer) clearInterval(timer);
    timer = setInterval(refresh, POLL_MS);
    window.addEventListener('hashchange', refresh);
    return true;
  }

  // Retry loop: keep trying every 100ms until the bell exists
  function init() {
    if (bind()) return;
    var attempts = 0;
    var retry = setInterval(function () {
      attempts++;
      if (bind() || attempts > 50) clearInterval(retry);
    }, 100);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
