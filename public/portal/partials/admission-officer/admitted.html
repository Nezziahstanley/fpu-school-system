<!-- Portal → Admission Officer → Admitted -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Admitted Applicants</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Approved and registered applicants</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="ado-export" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#fff;color:#065f46;border:1px solid #bbf7d0;
        border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;
      ">📥 Export CSV</button>
      <button id="ado-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;
        border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div style="
    background:#fff;border:1px solid #e5e7eb;border-radius:12px;
    padding:1rem;margin-bottom:1rem;
    display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.6rem;align-items:end;
  ">
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">Search</label>
      <input type="search" id="ado-search" placeholder="Name, email, or application number…"
             style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" />
    </div>
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">Status</label>
      <select id="ado-filter-status" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;">
        <option value="">All</option>
        <option value="approved">Approved</option>
        <option value="registered">Registered</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">Level</label>
      <select id="ado-filter-level" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;">
        <option value="">All</option>
        <option value="ND">ND</option>
        <option value="HND">HND</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">Department</label>
      <select id="ado-filter-dept" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;">
        <option value="">All</option>
      </select>
    </div>
    <button id="ado-clear-filters" style="
      padding:.55rem .85rem;font-size:.8rem;font-weight:600;
      background:#f1f5f9;color:#475569;border:none;border-radius:8px;
      cursor:pointer;align-self:end;
    ">Clear</button>
  </div>

  <!-- BULK ACTIONS BAR -->
  <div id="ado-bulk-bar" style="
    display:none;
    background:linear-gradient(135deg,#065f46,#047857);
    color:#fff;
    padding:.75rem 1rem;margin-bottom:1rem;
    border-radius:10px;
    align-items:center;justify-content:space-between;gap:.75rem;
    box-shadow:0 4px 12px rgba(6,95,70,.20);
  ">
    <div style="font-size:.82rem;font-weight:700;">
      <span id="ado-bulk-count">0</span> selected
    </div>
    <div style="display:flex;gap:.5rem;">
      <button id="ado-bulk-register" style="
        padding:.45rem .85rem;font-size:.78rem;font-weight:700;
        background:#fff;color:#065f46;border:none;border-radius:6px;cursor:pointer;
      ">📝 Register Selected</button>
      <button id="ado-bulk-clear" style="
        padding:.45rem .85rem;font-size:.78rem;font-weight:700;
        background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;cursor:pointer;
      ">✕ Clear</button>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Showing <span id="ado-shown">0</span> of <span id="ado-total">0</span> applicants
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;width:36px;">
              <input type="checkbox" id="ado-select-all" style="cursor:pointer;" />
            </th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Applicant</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">App No.</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Programme</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Actions</th>
          </tr>
        </thead>
        <tbody id="ado-tbody">
          <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:adoSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- MODAL — inline display toggled by JS -->
<div id="ado-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 id="ado-modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Details</h3>
      <button id="ado-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;padding:0;width:32px;height:32px;border-radius:8px;">✕</button>
    </div>
    <div id="ado-modal-body" style="padding:1.25rem;"></div>
  </div>
</div>

<style>
  @keyframes adoSpin { to { transform: rotate(360deg); } }
  #ado-tbody tr { transition: background .1s; }
  #ado-tbody tr:hover { background: #f8fafc; }
  .ado-status-badge {
    display:inline-flex;align-items:center;gap:.3rem;
    padding:3px 9px;border-radius:99px;
    font-size:.65rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  }
  .ado-avatar {
    width:34px;height:34px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:.75rem;flex-shrink:0;
  }
  .ado-btn-sm {
    padding:.35rem .65rem;font-size:.72rem;font-weight:700;
    border-radius:6px;border:none;cursor:pointer;font-family:inherit;
    transition:all .15s;
  }
  #ado-modal-close:hover { background: #f1f5f9; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const timeAgo = (d) => core.timeAgo ? core.timeAgo(d) : '';
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  const STATUS_META = {
    approved:   { label: 'Approved',   bg: '#d1fae5', fg: '#065f46', dot: '#10b981' },
    registered: { label: 'Registered', bg: '#e0e7ff', fg: '#3730a3', dot: '#6366f1' },
    rejected:   { label: 'Rejected',   bg: '#fee2e2', fg: '#991b1b', dot: '#ef4444' },
    pending:    { label: 'Pending',    bg: '#fef3c7', fg: '#92400e', dot: '#f59e0b' },
  };
  const statusMeta = (s) => STATUS_META[s] || STATUS_META.pending;

  let ALL = [];
  let FILTERED = [];

  // ============================================================
  // MODAL CONTROLS — toggling inline display:none directly
  // ============================================================
  function openModal() {
    const m = $('ado-modal');
    if (!m) return;
    m.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    const m = $('ado-modal');
    if (!m) return;
    m.style.display = 'none';
    document.body.style.overflow = '';
    const body = $('ado-modal-body');
    if (body) body.innerHTML = '';
  }

  // ============================================================
  // LOAD
  // ============================================================
  async function load() {
    const tbody = $('ado-tbody');
    tbody.innerHTML = `
      <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
        <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:adoSpin .8s linear infinite;"></div>
        <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
      </td></tr>`;

    try {
      const res = await core.portalFetch('/api/admission-officer/admitted');
      ALL = Array.isArray(res.data) ? res.data : [];

      const depts = new Map();
      ALL.forEach(a => {
        if (a.departmentId && a.departmentName) depts.set(a.departmentId, a.departmentName);
      });
      const sortedDepts = [...depts.entries()].sort((a, b) => a[1].localeCompare(b[1]));
      const sel = $('ado-filter-dept');
      if (sel) {
        const current = sel.value;
        sel.innerHTML = '<option value="">All</option>' +
          sortedDepts.map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join('');
        if (current) sel.value = current;
      }

      applyFilters();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  // ============================================================
  // FILTER + RENDER
  // ============================================================
  function applyFilters() {
    const q = ($('ado-search')?.value || '').trim().toLowerCase();
    const status = $('ado-filter-status')?.value || '';
    const level = $('ado-filter-level')?.value || '';
    const dept = $('ado-filter-dept')?.value || '';

    FILTERED = ALL.filter(a => {
      if (status && a.status !== status) return false;
      if (level && a.level !== level) return false;
      if (dept && String(a.departmentId) !== dept) return false;
      if (q) {
        const hay = `${a.firstName || ''} ${a.lastName || ''} ${a.email || ''} ${a.applicationNumber || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(FILTERED);
    updateCounts();
  }

  function updateCounts() {
    $('ado-shown').textContent = FILTERED.length;
    $('ado-total').textContent = ALL.length;

    const selected = document.querySelectorAll('#ado-tbody .ado-row-check:checked').length;
    $('ado-bulk-count').textContent = selected;
    $('ado-bulk-bar').style.display = selected > 0 ? 'flex' : 'none';
  }

  function renderTable(rows) {
    const tbody = $('ado-tbody');
    if (!rows.length) {
      tbody.innerHTML = `
        <tr><td colspan="7" style="padding:3rem 1rem;text-align:center;">
          <div style="font-size:2.5rem;margin-bottom:.6rem;opacity:.6;">📭</div>
          <div style="font-weight:700;color:#0f172a;font-size:.9rem;">No matching applicants</div>
          <div style="font-size:.78rem;color:#94a3b8;margin-top:.25rem;">Try adjusting your filters.</div>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(a => {
      const meta = statusMeta(a.status);
      const initials = ((a.firstName || '?')[0] + (a.lastName || '?')[0]).toUpperCase();
      const fullName = `${a.firstName || ''} ${a.lastName || ''}`.trim();

      let actions = '';
      if (a.status === 'approved') {
        actions = `<button class="ado-btn-sm" data-action="register" data-id="${a.id}" style="background:#065f46;color:#fff;">📝 Register</button>`;
      } else if (a.status === 'registered') {
        actions = `<button class="ado-btn-sm" data-action="letter" data-id="${a.id}" style="background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;">✉️ Letter</button>`;
      }
      actions += `<button class="ado-btn-sm" data-action="view" data-id="${a.id}" style="background:#f1f5f9;color:#475569;margin-left:.35rem;">👁 View</button>`;

      return `
        <tr data-id="${a.id}">
          <td style="padding:.65rem .75rem;">
            <input type="checkbox" class="ado-row-check" data-id="${a.id}" style="cursor:pointer;" />
          </td>
          <td style="padding:.65rem .75rem;">
            <div style="display:flex;align-items:center;gap:.6rem;">
              <div class="ado-avatar" style="background:linear-gradient(135deg,#065f46,#047857);">${initials}</div>
              <div style="min-width:0;">
                <div style="font-weight:700;color:#0f172a;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;">${esc(fullName)}</div>
                <div style="font-size:.72rem;color:#94a3b8;">${esc(a.email)}</div>
              </div>
            </div>
          </td>
          <td style="padding:.65rem .75rem;">
            <code style="font-size:.75rem;color:#475569;">${esc(a.applicationNumber || '—')}</code>
          </td>
          <td style="padding:.65rem .75rem;">
            <div style="font-size:.8rem;color:#0f172a;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">${esc(a.programmeName || '—')}</div>
            <div style="font-size:.7rem;color:#94a3b8;">${esc(a.departmentName || '')}</div>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">${esc(a.level || '—')}</span>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span class="ado-status-badge" style="background:${meta.bg};color:${meta.fg};">
              <span style="width:5px;height:5px;border-radius:50%;background:${meta.dot};"></span>
              ${meta.label}
            </span>
          </td>
          <td style="padding:.65rem .75rem;text-align:right;">
            ${actions}
          </td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('.ado-row-check').forEach(cb => {
      cb.addEventListener('change', updateCounts);
    });

    tbody.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => handleAction(btn.dataset.action, btn.dataset.id));
    });
  }

  // ============================================================
  // ACTION HANDLERS
  // ============================================================
  function handleAction(action, id) {
    const app = ALL.find(a => String(a.id) === String(id));
    if (!app) return;

    if (action === 'register')      openRegisterModal(app);
    else if (action === 'letter')   window.location.hash = `#admission-officer-letters?applicant=${id}`;
    else if (action === 'view')     openDetailModal(app);
  }

  // ============================================================
  // REGISTER MODAL
  // ============================================================
  function openRegisterModal(app) {
    const initials = ((app.firstName || '?')[0] + (app.lastName || '?')[0]).toUpperCase();
    const fullName = `${app.firstName || ''} ${app.lastName || ''}`.trim();

    $('ado-modal-title').textContent = 'Register Applicant';
    $('ado-modal-body').innerHTML = `
      <div style="display:flex;align-items:center;gap:.75rem;padding:1rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;margin-bottom:1.25rem;">
        <div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#065f46,#047857);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem;flex-shrink:0;">${initials}</div>
        <div style="min-width:0;">
          <div style="font-weight:800;color:#0f172a;font-size:.95rem;">${esc(fullName)}</div>
          <div style="font-size:.75rem;color:#64748b;margin-top:.15rem;">${esc(app.email)} · ${esc(app.applicationNumber)}</div>
        </div>
      </div>

      <div style="margin-bottom:1rem;padding:.75rem .9rem;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;font-size:.8rem;color:#1e40af;">
        <strong>ℹ️ About to register this applicant</strong>
        <div style="margin-top:.35rem;color:#1e3a8a;">A student account will be created, a matric number will be assigned, and the applicant will receive their admission letter.</div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem;">
        <div style="padding:.7rem .85rem;background:#f8fafc;border-radius:8px;">
          <div style="font-size:.65rem;font-weight:800;color:#64748b;letter-spacing:.06em;text-transform:uppercase;">Programme</div>
          <div style="font-weight:700;color:#0f172a;font-size:.85rem;margin-top:.2rem;">${esc(app.programmeName || '—')}</div>
        </div>
        <div style="padding:.7rem .85rem;background:#f8fafc;border-radius:8px;">
          <div style="font-size:.65rem;font-weight:800;color:#64748b;letter-spacing:.06em;text-transform:uppercase;">Department</div>
          <div style="font-weight:700;color:#0f172a;font-size:.85rem;margin-top:.2rem;">${esc(app.departmentName || '—')}</div>
        </div>
        <div style="padding:.7rem .85rem;background:#f8fafc;border-radius:8px;">
          <div style="font-size:.65rem;font-weight:800;color:#64748b;letter-spacing:.06em;text-transform:uppercase;">Level</div>
          <div style="font-weight:700;color:#0f172a;font-size:.85rem;margin-top:.2rem;">${esc(app.level || '—')}</div>
        </div>
        <div style="padding:.7rem .85rem;background:#f8fafc;border-radius:8px;">
          <div style="font-size:.65rem;font-weight:800;color:#64748b;letter-spacing:.06em;text-transform:uppercase;">JAMB Score</div>
          <div style="font-weight:700;color:#0f172a;font-size:.85rem;margin-top:.2rem;">${esc(app.jambScore || '—')}</div>
        </div>
      </div>

      <div style="background:#fef9c3;border:1px solid #fde68a;border-radius:8px;padding:.75rem .9rem;margin-bottom:1.25rem;font-size:.78rem;color:#78350f;">
        <strong>⚠️ Default password:</strong> The student will be created with password <code style="background:#fff;padding:2px 6px;border-radius:4px;font-weight:700;">student1234</code> and <em>must change it</em> on first login.
      </div>

      <div style="display:flex;gap:.5rem;justify-content:flex-end;">
        <button id="ado-modal-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="ado-modal-confirm" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;">✓ Confirm Registration</button>
      </div>
    `;

    openModal();

    $('ado-modal-cancel').addEventListener('click', closeModal);
    $('ado-modal-confirm').addEventListener('click', async () => {
      const btn = $('ado-modal-confirm');
      btn.disabled = true;
      btn.innerHTML = '⏳ Registering…';

      try {
        const res = await core.portalFetch(`/api/admission-officer/applications/${app.id}/register`, { method: 'POST' });
        const matric = res.data?.matricNumber || '';
        core.showToast && core.showToast(`Registered! Matric: ${matric}`, 'success');
        closeModal();
        load();
      } catch (err) {
        core.showToast && core.showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = '✓ Confirm Registration';
      }
    });
  }

  // ============================================================
  // DETAIL MODAL
  // ============================================================
  function openDetailModal(app) {
    const meta = statusMeta(app.status);
    const initials = ((app.firstName || '?')[0] + (app.lastName || '?')[0]).toUpperCase();
    const fullName = [app.firstName, app.middleName, app.lastName].filter(Boolean).join(' ').trim();

    const row = (label, value) => `
      <div style="display:flex;justify-content:space-between;padding:.55rem 0;border-bottom:1px solid #f1f5f9;">
        <span style="font-size:.75rem;color:#64748b;font-weight:600;">${label}</span>
        <span style="font-size:.82rem;color:#0f172a;font-weight:700;text-align:right;max-width:60%;">${esc(value || '—')}</span>
      </div>`;

    $('ado-modal-title').textContent = 'Applicant Details';
    $('ado-modal-body').innerHTML = `
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem;">
        <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#065f46,#047857);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;flex-shrink:0;">${initials}</div>
        <div style="min-width:0;flex:1;">
          <div style="font-weight:800;color:#0f172a;font-size:1.05rem;">${esc(fullName)}</div>
          <div style="font-size:.78rem;color:#64748b;margin-top:.2rem;">${esc(app.email)}</div>
          <div style="margin-top:.4rem;">
            <span class="ado-status-badge" style="background:${meta.bg};color:${meta.fg};">
              <span style="width:5px;height:5px;border-radius:50%;background:${meta.dot};"></span>
              ${meta.label}
            </span>
          </div>
        </div>
      </div>

      <div style="margin-bottom:1rem;">
        <div style="font-size:.68rem;font-weight:800;color:#065f46;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem;">Application</div>
        ${row('Application No.', app.applicationNumber)}
        ${row('Type', app.type)}
        ${row('Level', app.level)}
        ${row('JAMB Reg. No.', app.jambRegNo)}
        ${row('JAMB Score', app.jambScore)}
        ${row('Submitted', fmtDate(app.createdAt))}
      </div>

      <div style="margin-bottom:1rem;">
        <div style="font-size:.68rem;font-weight:800;color:#065f46;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem;">Academic</div>
        ${row('Programme', app.programmeName)}
        ${row('Department', app.departmentName)}
        ${row('School', app.schoolName)}
      </div>

      <div style="margin-bottom:1rem;">
        <div style="font-size:.68rem;font-weight:800;color:#065f46;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem;">Personal</div>
        ${row('Phone', app.phone)}
        ${row('Gender', app.gender)}
        ${row('Date of Birth', fmtDate(app.dateOfBirth))}
        ${row('State of Origin', app.stateOfOrigin)}
        ${row('LGA', app.lga)}
      </div>

      ${app.matricNumber ? `
        <div style="margin-top:1rem;padding:.85rem 1rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;">
          <div style="font-size:.68rem;font-weight:800;color:#065f46;letter-spacing:.08em;text-transform:uppercase;">Matric Number</div>
          <div style="font-family:ui-monospace,monospace;font-size:.95rem;font-weight:800;color:#065f46;margin-top:.3rem;">${esc(app.matricNumber)}</div>
        </div>` : ''}

      ${app.rejectionReason ? `
        <div style="margin-top:1rem;padding:.85rem 1rem;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;">
          <div style="font-size:.68rem;font-weight:800;color:#991b1b;letter-spacing:.08em;text-transform:uppercase;">Rejection Reason</div>
          <div style="font-size:.82rem;color:#7f1d1d;margin-top:.3rem;">${esc(app.rejectionReason)}</div>
        </div>` : ''}

      <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.25rem;">
        <button id="ado-modal-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Close</button>
      </div>
    `;

    openModal();
    $('ado-modal-cancel').addEventListener('click', closeModal);
  }

  // ============================================================
  // BULK ACTIONS
  // ============================================================
  $('ado-select-all')?.addEventListener('change', (e) => {
    document.querySelectorAll('#ado-tbody .ado-row-check').forEach(cb => {
      cb.checked = e.target.checked;
    });
    updateCounts();
  });

  $('ado-bulk-clear')?.addEventListener('click', () => {
    document.querySelectorAll('#ado-tbody .ado-row-check').forEach(cb => cb.checked = false);
    if ($('ado-select-all')) $('ado-select-all').checked = false;
    updateCounts();
  });

  $('ado-bulk-register')?.addEventListener('click', async () => {
    const ids = [...document.querySelectorAll('#ado-tbody .ado-row-check:checked')]
      .map(cb => Number(cb.dataset.id));

    if (!ids.length) return;
    if (!confirm(`Register ${ids.length} selected applicant${ids.length === 1 ? '' : 's'}?`)) return;

    let ok = 0, fail = 0;
    for (const id of ids) {
      try {
        await core.portalFetch(`/api/admission-officer/applications/${id}/register`, { method: 'POST' });
        ok++;
      } catch { fail++; }
    }

    core.showToast && core.showToast(`Registered ${ok}${fail ? ` · ${fail} failed` : ''}`, fail ? 'warning' : 'success');
    document.querySelectorAll('#ado-tbody .ado-row-check').forEach(cb => cb.checked = false);
    if ($('ado-select-all')) $('ado-select-all').checked = false;
    load();
  });

  // ============================================================
  // CSV EXPORT
  // ============================================================
  $('ado-export')?.addEventListener('click', () => {
    if (!FILTERED.length) {
      core.showToast && core.showToast('No rows to export.', 'warning');
      return;
    }

    const headers = ['Application No','First Name','Last Name','Email','Phone','Programme','Department','Level','Status','Matric','Applied Date'];
    const rows = FILTERED.map(a => [
      a.applicationNumber || '', a.firstName || '', a.lastName || '',
      a.email || '', a.phone || '', a.programmeName || '',
      a.departmentName || '', a.level || '', a.status || '',
      a.matricNumber || '', fmtDate(a.createdAt),
    ]);

    const csv = [headers, ...rows]
      .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      .join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `admitted-applicants-${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);

    core.showToast && core.showToast(`Exported ${FILTERED.length} rows.`, 'success');
  });

  // ============================================================
  // WIRING
  // ============================================================
  let searchTimer;
  $('ado-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });
  $('ado-filter-status')?.addEventListener('change', applyFilters);
  $('ado-filter-level')?.addEventListener('change', applyFilters);
  $('ado-filter-dept')?.addEventListener('change', applyFilters);

  $('ado-clear-filters')?.addEventListener('click', () => {
    $('ado-search').value = '';
    $('ado-filter-status').value = '';
    $('ado-filter-level').value = '';
    $('ado-filter-dept').value = '';
    applyFilters();
  });

  $('ado-refresh')?.addEventListener('click', load);
  $('ado-modal-close')?.addEventListener('click', closeModal);

  // Backdrop click + Escape
  $('ado-modal')?.addEventListener('click', (e) => {
    if (e.target.id === 'ado-modal') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // Kick off
  load();
})();
</script>
