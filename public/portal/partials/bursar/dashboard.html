<!-- Portal → Bursar → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="bur-dash-avatar">B</div>
    <div>
      <h1>Welcome, <span id="bur-dash-name">Bursar</span></h1>
      <div class="sub">Finance & Bursary</div>
    </div>
  </div>
  <div class="meta">
    <strong>Finance</strong>
    <span>Department</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile"><div class="tile-label">Today's Payments</div><div class="tile-value" id="bur-t-today">—</div></div>
  <div class="tile tile-blue"><div class="tile-label">Pending Verifications</div><div class="tile-value" id="bur-t-pending">—</div></div>
  <div class="tile tile-accent"><div class="tile-label">Total Collected (₦)</div><div class="tile-value" id="bur-t-total">—</div></div>
  <div class="tile tile-purple"><div class="tile-label">Clearances Awaiting</div><div class="tile-value" id="bur-t-clear">—</div></div>
</div>

<div class="quick-actions">
  <a class="btn btn-primary btn-sm" href="#bursar-payments">💰 Payments</a>
  <a class="btn btn-outline btn-sm" href="#bursar-fees">📋 Fees</a>
  <a class="btn btn-outline btn-sm" href="#bursar-clearances">✅ Clearances</a>
  <a class="btn btn-outline btn-sm" href="#bursar-reports">📊 Reports</a>
</div>

<div class="panel">
  <div class="panel-head"><h3>Recent Payments</h3></div>
  <div class="panel-body">
    <div id="bur-recent-list" class="muted small">Loading…</div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Payment Stats</h3></div>
  <div class="panel-body">
    <div id="bur-stats-block" class="muted small">Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    const user = core.getPortalUser() || {};
    try {
      document.getElementById('bur-dash-name').textContent = user.firstName || 'Bursar';
      if (photo) photo.renderMyAvatar(document.getElementById('bur-dash-avatar'), user);

      // Payment stats
      try {
        const s = await core.portalFetch('/api/payments/stats');
        const d = s.data || s || {};
        document.getElementById('bur-t-today').textContent  = d.today ?? 0;
        document.getElementById('bur-t-pending').textContent = d.pending ?? 0;
        document.getElementById('bur-t-total').textContent   = (d.totalAmount || 0).toLocaleString();
        document.getElementById('bur-stats-block').innerHTML = `
          <div class="fees-breakdown">
            <div class="fees-row"><span>Verified today</span><strong>${d.todayVerified || 0}</strong></div>
            <div class="fees-row"><span>Pending verification</span><strong>${d.pending || 0}</strong></div>
            <div class="fees-row"><span>Rejected</span><strong>${d.rejected || 0}</strong></div>
            <div class="fees-row"><span>Total collected</span><strong>₦${(d.totalAmount||0).toLocaleString()}</strong></div>
          </div>`;
      } catch {
        document.getElementById('bur-stats-block').innerHTML = '<em>Stats unavailable.</em>';
      }

      // Clearances waiting
      try {
        const c = await core.portalFetch('/api/clearances/stats');
        const d = c.data || c || {};
        document.getElementById('bur-t-clear').textContent = d.pending ?? 0;
      } catch { document.getElementById('bur-t-clear').textContent = '—'; }

      // Recent payments
      try {
        const p = await core.portalFetch('/api/payments?limit=5');
        const list = p.data || p || [];
        document.getElementById('bur-recent-list').innerHTML = list.length
          ? list.slice(0,5).map(x =>
              `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
                 <strong>${x.studentName || 'Student'}</strong> — ₦${(x.amount||0).toLocaleString()}
                 <span class="muted small">· ${x.status || ''} · ${x.reference || ''}</span>
               </div>`).join('')
          : '<em>No recent payments.</em>';
      } catch {
        document.getElementById('bur-recent-list').innerHTML = '<em>Could not load payments.</em>';
      }
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  })();
</script>
