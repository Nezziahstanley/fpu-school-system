<section class="bur-doc-page">
 <header class="bur-doc-head"><div><h2>Document Requests</h2><p>Review student requests for transcripts, letters and other official documents.</p></div><button id="bur-doc-refresh" type="button">↻ Refresh</button></header>
 <div class="bur-doc-filters"><input id="bur-doc-search" type="search" placeholder="Search student, matric number or document…" aria-label="Search document requests"><select id="bur-doc-status" aria-label="Filter by status"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="issued">Issued</option><option value="rejected">Rejected</option></select><span id="bur-doc-count">Loading…</span></div>
 <div class="bur-doc-table-wrap"><table><thead><tr><th>Student</th><th>Document</th><th>Requested</th><th>Status</th><th>Action</th></tr></thead><tbody id="bur-doc-body"><tr><td colspan="5">Loading document requests…</td></tr></tbody></table></div>
 <div class="bur-doc-modal" id="bur-doc-modal" hidden><div class="bur-doc-dialog" role="dialog" aria-modal="true" aria-labelledby="bur-doc-modal-title"><button class="bur-doc-x" id="bur-doc-close" type="button" aria-label="Close">×</button><h3 id="bur-doc-modal-title">Review request</h3><div id="bur-doc-detail"></div><label for="bur-doc-file">Issued file URL (optional)</label><input id="bur-doc-file" type="url" placeholder="https://…"><label for="bur-doc-remarks">Remarks (required when rejecting)</label><textarea id="bur-doc-remarks" rows="3" placeholder="Add a note for the student…"></textarea><div class="bur-doc-actions"><button id="bur-doc-approve" type="button">Approve</button><button id="bur-doc-issue" type="button">Mark as Issued</button><button id="bur-doc-reject" type="button">Reject</button></div></div></div>
</section>
<style>
.bur-doc-page{color:#0f172a}.bur-doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.bur-doc-head h2{margin:0;font-size:1.35rem}.bur-doc-head p{margin:.35rem 0;color:#64748b;font-size:.85rem}.bur-doc-head>button,.bur-doc-actions button{border:0;border-radius:8px;padding:.65rem .9rem;background:#065f46;color:white;font-weight:700;cursor:pointer}.bur-doc-filters{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}.bur-doc-filters input{flex:1;min-width:220px}.bur-doc-filters input,.bur-doc-filters select,.bur-doc-dialog input,.bur-doc-dialog textarea{padding:.7rem .8rem;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#0f172a}.bur-doc-filters span{font-size:.78rem;color:#64748b}.bur-doc-table-wrap{overflow:auto;border:1px solid #e2e8f0;border-radius:12px;background:#fff}.bur-doc-table-wrap table{width:100%;min-width:680px;border-collapse:collapse;font-size:.82rem}.bur-doc-table-wrap th,.bur-doc-table-wrap td{padding:.8rem .9rem;text-align:left;border-bottom:1px solid #f1f5f9}.bur-doc-table-wrap th{background:#f8fafc;color:#475569;font-size:.68rem;text-transform:uppercase}.bur-doc-status{display:inline-block;padding:.25rem .55rem;border-radius:99px;background:#f1f5f9;color:#475569;font-size:.68rem;font-weight:800;text-transform:uppercase}.bur-doc-status.pending{background:#fef3c7;color:#92400e}.bur-doc-status.approved{background:#dbeafe;color:#1d4ed8}.bur-doc-status.issued{background:#d1fae5;color:#065f46}.bur-doc-status.rejected{background:#fee2e2;color:#991b1b}.bur-doc-review{border:0;border-radius:7px;padding:.48rem .7rem;background:#ecfdf5;color:#065f46;font-weight:700;cursor:pointer}.bur-doc-modal[hidden]{display:none}.bur-doc-modal{position:fixed;inset:0;z-index:10000;background:#0f172a99;display:grid;place-items:center;padding:1rem}.bur-doc-dialog{position:relative;background:#fff;border-radius:15px;padding:1.3rem;width:min(100%,520px);max-height:90vh;overflow:auto;box-shadow:0 24px 70px #0003}.bur-doc-dialog h3{margin:0 2rem 1rem 0}.bur-doc-dialog label{display:block;margin:.85rem 0 .35rem;font-size:.78rem;font-weight:700;color:#475569}.bur-doc-dialog input,.bur-doc-dialog textarea{width:100%;box-sizing:border-box}.bur-doc-x{position:absolute;right:1rem;top:.7rem;border:0;background:none;font-size:1.6rem;cursor:pointer;color:#64748b}.bur-doc-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.bur-doc-actions #bur-doc-reject{background:#b91c1c}.bur-doc-actions #bur-doc-issue{background:#1d4ed8}.bur-doc-actions button:disabled{opacity:.55;cursor:wait}@media(max-width:560px){.bur-doc-filters{align-items:stretch;flex-direction:column}.bur-doc-filters input,.bur-doc-filters select{width:100%;box-sizing:border-box}}
</style>
<script>
(function(){'use strict';const core=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>core.escapeHtml?core.escapeHtml(v):String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));let rows=[],selected=null;
function getDoc(r){return r.document||r}function getUser(r){return r.user||{}}
function statusChip(s){const v=String(s||'pending').toLowerCase();return '<span class="bur-doc-status '+esc(v)+'">'+esc(v)+'</span>'}
function render(){const q=$('bur-doc-search').value.trim().toLowerCase(),status=$('bur-doc-status').value;const list=rows.filter(r=>{const d=getDoc(r),u=getUser(r),name=[u.firstName,u.lastName,u.matricNumber,d.title,d.type].join(' ').toLowerCase();return(!q||name.includes(q))&&(!status||String(d.status).toLowerCase()===status)});$('bur-doc-count').textContent=list.length+' of '+rows.length+' requests';$('bur-doc-body').innerHTML=list.length?list.map(r=>{const d=getDoc(r),u=getUser(r),name=[u.firstName,u.lastName].filter(Boolean).join(' ')||u.matricNumber||'Student';return '<tr><td><strong>'+esc(name)+'</strong><div style="font-size:.72rem;color:#64748b">'+esc(u.matricNumber||u.email||'')+'</div></td><td>'+esc(d.title||d.type||'Document request')+'</td><td>'+esc(d.requestedAt?new Date(d.requestedAt).toLocaleDateString():'—')+'</td><td>'+statusChip(d.status)+'</td><td><button class="bur-doc-review" type="button" data-id="'+Number(d.id)+'">Review</button></td></tr>'}).join(''):'<tr><td colspan="5" style="text-align:center;padding:1.5rem;color:#64748b">No matching document requests.</td></tr>';$('bur-doc-body').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>open(Number(b.dataset.id))))}
function open(id){selected=rows.find(r=>Number(getDoc(r).id)===id);if(!selected)return;const d=getDoc(selected),u=getUser(selected);$('bur-doc-detail').innerHTML='<p><strong>Student:</strong> '+esc([u.firstName,u.lastName].filter(Boolean).join(' ')||'Student')+'</p><p><strong>Matric number:</strong> '+esc(u.matricNumber||'—')+'</p><p><strong>Request:</strong> '+esc(d.title||d.type||'Document')+'</p><p><strong>Status:</strong> '+statusChip(d.status)+'</p><p><strong>Details:</strong> '+esc(d.description||d.remarks||'No additional details supplied.')+'</p>';const st=String(d.status||'pending').toLowerCase();$('bur-doc-approve').hidden=st!=='pending';$('bur-doc-issue').hidden=st!=='approved';$('bur-doc-reject').hidden=['issued','rejected'].includes(st);$('bur-doc-file').value=d.fileUrl||'';$('bur-doc-remarks').value='';$('bur-doc-modal').hidden=false}
function close(){ $('bur-doc-modal').hidden=true;selected=null}
async function act(action){if(!selected)return;const d=getDoc(selected),id=Number(d.id),btn=action==='approve'?'bur-doc-approve':action==='issue'?'bur-doc-issue':'bur-doc-reject';const control=$(btn);if(action==='reject'&&!$('bur-doc-remarks').value.trim()){core.showToast&&core.showToast('Please provide a reason for rejection.','error');$('bur-doc-remarks').focus();return}control.disabled=true;try{const body=action==='issue'?{fileUrl:$('bur-doc-file').value.trim()}:action==='reject'?{remarks:$('bur-doc-remarks').value.trim()}:{};await core.portalFetch('/api/bursar/documents/'+id+'/'+action,{method:'POST',body});core.showToast&&core.showToast(action==='issue'?'Document marked as issued.':action==='approve'?'Document approved.':'Document request rejected.','success');close();await load()}catch(e){core.showToast&&core.showToast(e.message||'Unable to update request.','error')}finally{control.disabled=false}}
async function load(){ $('bur-doc-body').innerHTML='<tr><td colspan="5">Loading document requests…</td></tr>';try{const r=await core.portalFetch('/api/bursar/documents');rows=Array.isArray(r.data)?r.data:[];render()}catch(e){$('bur-doc-body').innerHTML='<tr><td colspan="5">Unable to load requests: '+esc(e.message)+'</td></tr>';core.showToast&&core.showToast('Could not load document requests','error')}}
$('bur-doc-refresh').addEventListener('click',load);$('bur-doc-search').addEventListener('input',render);$('bur-doc-status').addEventListener('change',render);$('bur-doc-close').addEventListener('click',close);$('bur-doc-modal').addEventListener('click',e=>{if(e.target.id==='bur-doc-modal')close()});$('bur-doc-approve').addEventListener('click',()=>act('approve'));$('bur-doc-issue').addEventListener('click',()=>act('issue'));$('bur-doc-reject').addEventListener('click',()=>act('reject'));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('bur-doc-modal').hidden)close()});load()})();
</script>
