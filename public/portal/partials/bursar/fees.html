<!-- Portal → Bursar → Fees -->
<section class="page-head">
  <div><h2>Fee Structures</h2><p class="muted small">Tuition and other fees</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="window.__burFeesLoad()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>All Fee Structures</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Programme</th><th>Level</th><th>Session</th><th>Tuition</th><th>Total</th></tr></thead>
        <tbody id="bur-fees-tbody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__burFeesLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('bur-fees-tbody');
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/bursar/fees');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((f) => `
        <tr>
          <td>Programme ${f.programmeId}</td>
          <td>${core.escapeHtml(f.level)}</td>
          <td>Session ${f.sessionId}</td>
          <td class="num">${core.formatMoney(f.tuition)}</td>
          <td class="num"><strong>${core.formatMoney(f.total)}</strong></td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="empty">No fee structures.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="5" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };
  window.__burFeesLoad();
</script>
