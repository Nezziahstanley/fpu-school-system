<!-- Portal → Bursar → Reports -->
<section class="page-head">
  <div><h2>Reports</h2><p class="muted small">Payment analytics</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="window.__burRepLoad()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Payments by Status</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Status</th><th>Count</th><th>Total</th></tr></thead>
        <tbody id="bur-rep-tbody"><tr><td colspan="3" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__burRepLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('bur-rep-tbody');
    tbody.innerHTML = '<tr><td colspan="3" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/bursar/reports');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td>${core.escapeHtml(r.status)}</td>
          <td class="num">${r.count}</td>
          <td class="num">${core.formatMoney(r.total)}</td>
        </tr>
      `).join('') : '<tr><td colspan="3" class="empty">No data.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="3" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };
  window.__burRepLoad();
</script>
