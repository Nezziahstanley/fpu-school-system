<section class="bur-transcript-page">
 <header class="bur-transcript-head"><div><h2>Transcript Register</h2><p>Search student records and open a printable transcript containing published results.</p></div><button id="bur-transcript-refresh" type="button">↻ Refresh</button></header>
 <div class="bur-transcript-tools"><input id="bur-transcript-search" type="search" placeholder="Search student name or matric number" aria-label="Search students"><span id="bur-transcript-count">Loading…</span></div>
 <div class="bur-transcript-table-wrap"><table><thead><tr><th>Student</th><th>Matric Number</th><th>Department</th><th>Programme</th><th>Level</th><th>Action</th></tr></thead><tbody id="bur-transcript-body"><tr><td colspan="6">Loading student records…</td></tr></tbody></table></div>
 <p class="bur-transcript-note">This is a preview/printing tool. It does not certify or issue an official transcript.</p>
</section>
<style>.bur-transcript-page{color:#0f172a}.bur-transcript-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.bur-transcript-head h2{margin:0;font-size:1.35rem}.bur-transcript-head p{margin:.35rem 0;color:#64748b;font-size:.85rem}.bur-transcript-head button,.bur-transcript-open{background:#065f46;color:#fff;border:0;border-radius:8px;padding:.62rem .9rem;font-weight:700;cursor:pointer}.bur-transcript-tools{display:flex;justify-content:space-between;gap:.8rem;align-items:center;margin-bottom:.8rem}.bur-transcript-tools input{width:min(100%,420px);padding:.72rem .85rem;border:1px solid #cbd5e1;border-radius:9px}.bur-transcript-tools span,.bur-transcript-note{font-size:.78rem;color:#64748b}.bur-transcript-table-wrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.bur-transcript-table-wrap table{width:100%;min-width:760px;border-collapse:collapse;font-size:.82rem}.bur-transcript-table-wrap th,.bur-transcript-table-wrap td{padding:.8rem .9rem;text-align:left;border-bottom:1px solid #f1f5f9}.bur-transcript-table-wrap th{background:#f8fafc;color:#475569;font-size:.68rem;text-transform:uppercase}.bur-transcript-note{margin-top:.8rem}@media(max-width:600px){.bur-transcript-tools{align-items:stretch;flex-direction:column}}</style>
<script>
(function(){'use strict';const core=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>core.escapeHtml?core.escapeHtml(v):String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));let rows=[];function render(){const q=$('bur-transcript-search').value.trim().toLowerCase();const a=rows.filter(s=>[s.firstName,s.lastName,s.matricNumber,s.departmentName,s.programmeName].join(' ').toLowerCase().includes(q));$('bur-transcript-count').textContent=a.length+' of '+rows.length+' students';$('bur-transcript-body').innerHTML=a.length?a.map(s=>'<tr><td><strong>'+esc([s.firstName,s.lastName].filter(Boolean).join(' ')||'Student')+'</strong></td><td>'+esc(s.matricNumber||'—')+'</td><td>'+esc(s.departmentName||'—')+'</td><td>'+esc(s.programmeName||'—')+'</td><td>'+esc(s.level||'—')+'</td><td><button class="bur-transcript-open" type="button" data-id="'+Number(s.id)+'">Open Transcript</button></td></tr>').join(''):'<tr><td colspan="6">No matching students found.</td></tr>';$('bur-transcript-body').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{const id=Number(b.dataset.id);if(Number.isInteger(id)&&id>0)window.open('/portal/partials/registrar/document-template.html?studentId='+encodeURIComponent(id),'_blank','noopener')}))}
async function load(){$('bur-transcript-body').innerHTML='<tr><td colspan="6">Loading student records…</td></tr>';try{const r=await core.portalFetch('/api/bursar/transcripts');rows=Array.isArray(r.data)?r.data:[];render()}catch(e){$('bur-transcript-body').innerHTML='<tr><td colspan="6">Unable to load students: '+esc(e.message)+'</td></tr>';core.showToast&&core.showToast('Could not load student register','error')}}
$('bur-transcript-refresh').addEventListener('click',load);$('bur-transcript-search').addEventListener('input',render);load()})();
</script>
