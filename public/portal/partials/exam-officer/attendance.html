<!-- Portal → Exam Officer → Exam Attendance -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Exam Attendance</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Pick a department → course → exam, then mark attendance</p>
    </div>
    <button id="eo-att-refresh" style="
      padding:.55rem .9rem;font-size:.82rem;font-weight:700;
      background:#fff;color:#9a3412;border:1px solid #fed7aa;
      border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;
    ">↻ Refresh</button>
  </div>

  <!-- CASCADING FILTERS -->
  <div style="
    background:#fff;border:1px solid #e5e7eb;border-radius:12px;
    padding:1rem;margin-bottom:1rem;
    display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:.6rem;align-items:end;
  ">
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">1. Department</label>
      <select id="eo-att-dept" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;">
        <option value="">— Select —</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">2. Course</label>
      <select id="eo-att-course" disabled style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;opacity:.6;">
        <option value="">Select department first</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">3. Exam Schedule</label>
      <select id="eo-att-schedule" disabled style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;opacity:.6;">
        <option value="">Select course first</option>
      </select>
    </div>
    <button id="eo-att-load" disabled style="
      padding:.55rem 1rem;font-size:.82rem;font-weight:700;
      background:#c2410c;color:#fff;border:none;border-radius:8px;cursor:pointer;opacity:.5;
    ">Load</button>
  </div>

  <!-- CONTEXT CARD -->
  <div id="eo-att-context" style="display:none;margin-bottom:1rem;"></div>

  <!-- SUMMARY BAR -->
  <div id="eo-att-summary" style="display:none;margin-bottom:1rem;"></div>

  <!-- BULK BAR -->
  <div id="eo-att-bulk" style="
    display:none;
    background:linear-gradient(135deg,#c2410c,#ea580c);
    color:#fff;padding:.7rem 1rem;margin-bottom:1rem;
    border-radius:10px;
    align-items:center;justify-content:space-between;gap:.75rem;
    box-shadow:0 4px 12px rgba(194,65,12,.20);
  ">
    <div style="font-size:.82rem;font-weight:700;">
      <span id="eo-att-count">0</span> changed
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="eo-att-mark-all-present" style="
        padding:.45rem .85rem;font-size:.78rem;font-weight:700;
        background:#fff;color:#065f46;border:none;border-radius:6px;cursor:pointer;
      ">✓ Mark all Present</button>
      <button id="eo-att-mark-all-absent" style="
        padding:.45rem .85rem;font-size:.78rem;font-weight:700;
        background:#fee2e2;color:#991b1b;border:none;border-radius:6px;cursor:pointer;
      ">✕ Mark all Absent</button>
      <button id="eo-att-save" style="
        padding:.45rem .85rem;font-size:.78rem;font-weight:700;
        background:#fbbf24;color:#78350f;border:none;border-radius:6px;cursor:pointer;
      ">💾 Save Changes</button>
    </div>
  </div>

  <!-- FILTER ROW -->
  <div id="eo-att-filter-row" style="display:none;margin-bottom:.75rem;gap:.5rem;align-items:center;">
    <label style="font-size:.75rem;color:#64748b;font-weight:600;">Show:</label>
    <select id="eo-att-filter" style="padding:.4rem .7rem;font-size:.78rem;border:1px solid #d1d5db;border-radius:6px;background:#fff;">
      <option value="all">All students</option>
      <option value="unmarked">Unmarked only</option>
      <option value="present">Present only</option>
      <option value="absent">Absent only</option>
      <option value="late">Late only</option>
      <option value="excused">Excused only</option>
    </select>
    <input type="search" id="eo-att-search" placeholder="Search by name or matric…"
           style="flex:1;max-width:280px;padding:.4rem .7rem;font-size:.78rem;border:1px solid #d1d5db;border-radius:6px;" />
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;width:44px;">#</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;width:340px;">Status</th>
          </tr>
        </thead>
        <tbody id="eo-att-tbody">
          <tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">
            Pick a department, course, and exam to begin.
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<style>
  .eo-att-row:hover { background: #f8fafc; }
  .eo-status-group {
    display: inline-flex;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }
  .eo-status-btn {
    padding: .35rem .65rem;
    font-size: .72rem;
    font-weight: 700;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    border-right: 1px solid #e5e7eb;
    transition: all .12s;
    color: #64748b;
  }
  .eo-status-btn:last-child { border-right: none; }
  .eo-status-btn:hover { background: #f1f5f9; }
  .eo-status-btn.active[data-status="present"] { background: #10b981; color: #fff; }
  .eo-status-btn.active[data-status="absent"]  { background: #ef4444; color: #fff; }
  .eo-status-btn.active[data-status="late"]    { background: #f59e0b; color: #fff; }
  .eo-status-btn.active[data-status="excused"] { background: #6366f1; color: #fff; }

  @keyframes eoSpin { to { transform: rotate(360deg); } }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  // State
  let DEPARTMENTS = [];
  let COURSES_BY_DEPT = {};
  let ALL_SCHEDULES = [];
  let ALL_COURSES = [];
  let CURRENT_SCHEDULE = null;
  let CURRENT_COURSE = null;
  let ROWS = [];

  // ============================================================
  // BOOT
  // ============================================================
  async function boot() {
    try {
      const [lookupRes, schedRes] = await Promise.all([
        core.portalFetch('/api/exam-officer/lookups'),
        core.portalFetch('/api/exam-officer/schedules'),
      ]);

      DEPARTMENTS = Array.isArray(lookupRes.departments) ? lookupRes.departments : [];
      ALL_COURSES = Array.isArray(lookupRes.courses) ? lookupRes.courses : [];
      ALL_SCHEDULES = Array.isArray(schedRes.data) ? schedRes.data : [];

      COURSES_BY_DEPT = {};
      ALL_COURSES.forEach((c) => {
        const deptId = c.departmentId;
        if (!deptId) return;
        if (!COURSES_BY_DEPT[deptId]) COURSES_BY_DEPT[deptId] = [];
        COURSES_BY_DEPT[deptId].push(c);
      });

      populateDepartments();
    } catch (err) {
      core.showToast && core.showToast('Failed to load: ' + err.message, 'error');
      console.error('[exam-attendance] boot failed:', err);
    }
  }

  // ============================================================
  // DEPARTMENT DROPDOWN
  // ============================================================
  function populateDepartments() {
    const sel = $('eo-att-dept');
    if (!DEPARTMENTS.length) {
      sel.innerHTML = '<option value="">No departments found</option>';
      return;
    }

    const sorted = [...DEPARTMENTS].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    sel.innerHTML = '<option value="">— Select department —</option>' +
      sorted.map((d) => `<option value="${d.id}">${esc(d.code || '')} · ${esc(d.name || '')}</option>`).join('');
  }

  // ============================================================
  // COURSE DROPDOWN
  // ============================================================
  function populateCourses(deptId) {
    const sel = $('eo-att-course');
    $('eo-att-schedule').disabled = true;
    $('eo-att-schedule').style.opacity = '.6';
    $('eo-att-schedule').innerHTML = '<option value="">Select course first</option>';
    $('eo-att-load').disabled = true;
    $('eo-att-load').style.opacity = '.5';

    if (!deptId) {
      sel.disabled = true;
      sel.style.opacity = '.6';
      sel.innerHTML = '<option value="">Select department first</option>';
      return;
    }

    const courses = COURSES_BY_DEPT[deptId] || [];
    if (!courses.length) {
      sel.disabled = true;
      sel.style.opacity = '.6';
      sel.innerHTML = '<option value="">No courses in this department</option>';
      return;
    }

    const courseIdsWithExams = new Set(ALL_SCHEDULES.map((s) => (s.exam || s).courseId));

    const sorted = [...courses].sort((a, b) => (a.code || '').localeCompare(b.code || ''));
    sel.disabled = false;
    sel.style.opacity = '1';
    sel.innerHTML = '<option value="">— Select course —</option>' +
      sorted.map((c) => {
        const hasExam = courseIdsWithExams.has(c.id);
        const label = `${c.code || '?'} · ${c.title || ''}${hasExam ? '' : ' (no exam scheduled)'}`;
        return `<option value="${c.id}">${esc(label)}</option>`;
      }).join('');
  }

  // ============================================================
  // SCHEDULE DROPDOWN
  // ============================================================
  function populateSchedules(courseId) {
    const sel = $('eo-att-schedule');
    $('eo-att-load').disabled = true;
    $('eo-att-load').style.opacity = '.5';

    if (!courseId) {
      sel.disabled = true;
      sel.style.opacity = '.6';
      sel.innerHTML = '<option value="">Select course first</option>';
      return;
    }

    const schedules = ALL_SCHEDULES.filter((s) => Number((s.exam || s).courseId) === Number(courseId));
    if (!schedules.length) {
      sel.disabled = true;
      sel.style.opacity = '.6';
      sel.innerHTML = '<option value="">No exams scheduled for this course</option>';
      return;
    }

    sel.disabled = false;
    sel.style.opacity = '1';
    sel.innerHTML = '<option value="">— Select exam —</option>' +
      schedules.map((s) => {
        const e = s.exam || s;
        const date = e.examDate ? new Date(e.examDate).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';
        const time = e.startTime || '';
        const venue = e.venue ? ` · ${e.venue}` : '';
        const label = `${date} · ${time}${venue}`;
        return `<option value="${e.id}">${esc(label)}</option>`;
      }).join('');
  }

  // ============================================================
  // LOAD ATTENDANCE
  // ============================================================
  async function loadAttendance() {
    const scheduleId = $('eo-att-schedule').value;
    if (!scheduleId) return;

    const schedule = ALL_SCHEDULES.find((s) => String((s.exam || s).id) === String(scheduleId));
    CURRENT_SCHEDULE = schedule;
    CURRENT_COURSE = schedule ? (ALL_COURSES.find((c) => c.id === (schedule.exam || schedule).courseId) || null) : null;

    renderContext();
    $('eo-att-filter-row').style.display = 'flex';

    const tbody = $('eo-att-tbody');
    tbody.innerHTML = `
      <tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">
        <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#c2410c;border-radius:50%;animation:eoSpin .8s linear infinite;"></div>
        <div style="margin-top:.65rem;">Loading…</div>
      </td></tr>`;

    try {
      const [attRes, regsRes] = await Promise.all([
        core.portalFetch(`/api/exam-officer/attendance?examScheduleId=${scheduleId}`),
        core.portalFetch(`/api/exam-officer/registrations?courseId=${(schedule.exam || schedule).courseId}&status=approved&limit=500`).catch(() => ({ data: [] })),
      ]);

      const attendanceRecords = Array.isArray(attRes.data) ? attRes.data : [];
      const registrations = Array.isArray(regsRes.data) ? regsRes.data : [];

      const attMap = new Map();
      attendanceRecords.forEach((r) => {
        const sid = Number((r.student || {}).id);
        if (sid) attMap.set(sid, r.record || null);
      });

      const studentSource = registrations.length
        ? registrations.map((reg) => ({
            student: reg.student || {},
            registration: reg.registration || reg,
          }))
        : attendanceRecords.map((r) => ({
            student: r.student || {},
            registration: null,
          }));

      const seen = new Set();
      ROWS = [];
      for (const s of studentSource) {
        const sid = Number((s.student || {}).id);
        if (!sid || seen.has(sid)) continue;
        seen.add(sid);
        const existing = attMap.get(sid);
        ROWS.push({
          student: s.student,
          registration: s.registration,
          status: existing ? existing.status : 'unmarked',
          originalStatus: existing ? existing.status : 'unmarked',
          changed: false,
        });
      }

      attendanceRecords.forEach((r) => {
        const sid = Number((r.student || {}).id);
        if (sid && !seen.has(sid)) {
          seen.add(sid);
          ROWS.push({
            student: r.student,
            registration: null,
            status: (r.record || {}).status || 'unmarked',
            originalStatus: (r.record || {}).status || 'unmarked',
            changed: false,
          });
        }
      });

      ROWS.sort((a, b) => {
        const an = `${a.student.lastName || ''} ${a.student.firstName || ''}`.toLowerCase();
        const bn = `${b.student.lastName || ''} ${b.student.firstName || ''}`.toLowerCase();
        return an.localeCompare(bn);
      });

      renderSummaryFromRows();
      renderRows();
      $('eo-att-filter').value = 'all';
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  // ============================================================
  // CONTEXT CARD
  // ============================================================
  function renderContext() {
    const el = $('eo-att-context');
    if (!CURRENT_SCHEDULE || !CURRENT_COURSE) {
      el.style.display = 'none';
      return;
    }

    const e = CURRENT_SCHEDULE.exam || CURRENT_SCHEDULE;
    const deptId = CURRENT_COURSE.departmentId;
    const dept = DEPARTMENTS.find((d) => d.id === deptId);

    const date = e.examDate ? new Date(e.examDate).toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }) : '—';

    el.style.display = 'block';
    el.innerHTML = `
      <div style="
        background:linear-gradient(135deg,#fff7ed,#ffedd5);
        border:1px solid #fed7aa;
        border-radius:12px;
        padding:1rem 1.25rem;
        display:flex;gap:1rem;align-items:center;flex-wrap:wrap;
      ">
        <div style="
          width:52px;height:52px;border-radius:12px;
          background:linear-gradient(135deg,#c2410c,#ea580c);
          color:#fff;display:flex;align-items:center;justify-content:center;
          font-size:1.4rem;flex-shrink:0;
        ">📝</div>
        <div style="flex:1;min-width:220px;">
          <div style="font-size:.68rem;font-weight:800;color:#9a3412;letter-spacing:.08em;text-transform:uppercase;">
            ${esc(dept?.name || 'Department')} · ${esc(dept?.code || '')}
          </div>
          <div style="font-size:1.05rem;font-weight:800;color:#0f172a;margin-top:.2rem;">
            ${esc(CURRENT_COURSE.code || '')} · ${esc(CURRENT_COURSE.title || '')}
          </div>
          <div style="font-size:.78rem;color:#78350f;margin-top:.25rem;">
            📅 ${esc(date)} · ⏰ ${esc(e.startTime || '—')}–${esc(e.endTime || '—')} · 📍 ${esc(e.venue || 'TBA')}
          </div>
        </div>
        <div style="
          padding:.5rem 1rem;background:#fff;border-radius:10px;
          text-align:center;box-shadow:0 2px 6px rgba(194,65,12,.10);
          flex-shrink:0;
        ">
          <div style="font-size:1.3rem;font-weight:800;color:#c2410c;line-height:1;" id="eo-ctx-total">${ROWS.length}</div>
          <div style="font-size:.6rem;font-weight:800;color:#9a3412;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Registered</div>
        </div>
      </div>`;
  }

  // ============================================================
  // SUMMARY
  // ============================================================
  function renderSummaryFromRows() {
    const el = $('eo-att-summary');
    const counts = { present: 0, absent: 0, late: 0, excused: 0, unmarked: 0 };
    ROWS.forEach((r) => {
      const s = r.status || 'unmarked';
      if (counts[s] !== undefined) counts[s]++;
    });

    el.style.display = 'grid';
    el.style.gridTemplateColumns = 'repeat(5,1fr)';
    el.style.gap = '.6rem';

    const tiles = [
      { label: 'Present',  value: counts.present,  bg: '#d1fae5', fg: '#065f46', icon: '✅' },
      { label: 'Absent',   value: counts.absent,   bg: '#fee2e2', fg: '#991b1b', icon: '❌' },
      { label: 'Late',     value: counts.late,     bg: '#fef3c7', fg: '#92400e', icon: '⏰' },
      { label: 'Excused',  value: counts.excused,  bg: '#e0e7ff', fg: '#3730a3', icon: '🛡️' },
      { label: 'Unmarked', value: counts.unmarked, bg: '#f1f5f9', fg: '#475569', icon: '⚪' },
    ];

    el.innerHTML = tiles.map(t => `
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.75rem .9rem;display:flex;align-items:center;gap:.6rem;">
        <div style="width:36px;height:36px;border-radius:9px;background:${t.bg};color:${t.fg};display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;">${t.icon}</div>
        <div>
          <div style="font-size:1.2rem;font-weight:800;color:#0f172a;line-height:1;">${t.value}</div>
          <div style="font-size:.6rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.15rem;">${t.label}</div>
        </div>
      </div>`).join('');
  }

  // ============================================================
  // RENDER ROWS
  // ============================================================
  function renderRows() {
    const tbody = $('eo-att-tbody');
    const filter = $('eo-att-filter').value;
    const q = ($('eo-att-search')?.value || '').trim().toLowerCase();

    let rows = ROWS;
    if (filter !== 'all') rows = rows.filter((r) => r.status === filter);
    if (q) {
      rows = rows.filter((r) => {
        const name = `${r.student.firstName || ''} ${r.student.lastName || ''}`.toLowerCase();
        const matric = String(r.student.matricNumber || '').toLowerCase();
        return name.includes(q) || matric.includes(q);
      });
    }

    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="padding:3rem 1rem;text-align:center;color:#94a3b8;font-size:.82rem;">
        ${ROWS.length ? 'No students match this filter.' : 'No students registered for this course.'}
      </td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((r, idx) => {
      const s = r.student || {};
      const initials = ((s.firstName || '?')[0] + (s.lastName || '?')[0]).toUpperCase();
      const fullName = `${s.firstName || ''} ${s.lastName || ''}`.trim() || '—';

      return `
        <tr class="eo-att-row" data-student-id="${s.id}">
          <td style="padding:.65rem .75rem;color:#94a3b8;font-size:.75rem;">${idx + 1}</td>
          <td style="padding:.65rem .75rem;">
            <div style="display:flex;align-items:center;gap:.6rem;">
              <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#c2410c,#ea580c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem;flex-shrink:0;">${initials}</div>
              <div style="font-weight:700;color:#0f172a;font-size:.85rem;">${esc(fullName)}</div>
            </div>
          </td>
          <td style="padding:.65rem .75rem;">
            <code style="font-size:.75rem;color:#64748b;">${esc(s.matricNumber || '—')}</code>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <div class="eo-status-group">
              <button class="eo-status-btn ${r.status === 'present' ? 'active' : ''}" data-status="present" data-id="${s.id}">Present</button>
              <button class="eo-status-btn ${r.status === 'absent' ? 'active' : ''}" data-status="absent" data-id="${s.id}">Absent</button>
              <button class="eo-status-btn ${r.status === 'late' ? 'active' : ''}" data-status="late" data-id="${s.id}">Late</button>
              <button class="eo-status-btn ${r.status === 'excused' ? 'active' : ''}" data-status="excused" data-id="${s.id}">Excused</button>
            </div>
          </td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('.eo-status-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        setStatus(Number(btn.dataset.id), btn.dataset.status);
      });
    });

    updateBulkBar();
  }

  function setStatus(studentId, newStatus) {
    const row = ROWS.find((r) => Number(r.student?.id) === studentId);
    if (!row) return;
    row.status = newStatus;
    row.changed = row.status !== row.originalStatus;

    document.querySelectorAll(`.eo-status-btn[data-id="${studentId}"]`).forEach((b) => {
      b.classList.toggle('active', b.dataset.status === newStatus);
    });

    renderSummaryFromRows();
    updateBulkBar();
  }

  function updateBulkBar() {
    const changed = ROWS.filter((r) => r.changed).length;
    $('eo-att-count').textContent = changed;
    $('eo-att-bulk').style.display = changed > 0 ? 'flex' : 'none';
  }

  // ============================================================
  // BULK ACTIONS
  // ============================================================
  $('eo-att-mark-all-present')?.addEventListener('click', () => {
    ROWS.forEach((r) => {
      if (r.status === 'unmarked') {
        r.status = 'present';
        r.changed = r.status !== r.originalStatus;
      }
    });
    renderSummaryFromRows();
    renderRows();
  });

  $('eo-att-mark-all-absent')?.addEventListener('click', () => {
    ROWS.forEach((r) => {
      if (r.status === 'unmarked') {
        r.status = 'absent';
        r.changed = r.status !== r.originalStatus;
      }
    });
    renderSummaryFromRows();
    renderRows();
  });

  $('eo-att-save')?.addEventListener('click', async () => {
    if (!CURRENT_SCHEDULE) return;
    const scheduleId = (CURRENT_SCHEDULE.exam || CURRENT_SCHEDULE).id;

    const records = ROWS
      .filter((r) => r.changed && r.student?.id && r.status !== 'unmarked')
      .map((r) => ({
        studentId: r.student.id,
        status: r.status,
        remarks: null,
      }));

    if (!records.length) {
      core.showToast && core.showToast('Nothing to save.', 'info');
      return;
    }

    const btn = $('eo-att-save');
    btn.disabled = true;
    btn.textContent = '⏳ Saving…';

    try {
      const res = await core.portalFetch('/api/exam-officer/attendance/bulk', {
        method: 'POST',
        body: { examScheduleId: Number(scheduleId), records },
      });
      core.showToast && core.showToast(`Saved ${res.saved || records.length} record(s).`, 'success');

      ROWS.forEach((r) => { r.originalStatus = r.status; r.changed = false; });
      updateBulkBar();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Save Changes';
    }
  });

  // ============================================================
  // WIRING
  // ============================================================
  $('eo-att-dept')?.addEventListener('change', () => {
    populateCourses($('eo-att-dept').value);
    $('eo-att-context').style.display = 'none';
    $('eo-att-summary').style.display = 'none';
    $('eo-att-filter-row').style.display = 'none';
    $('eo-att-tbody').innerHTML = '<tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">Pick a course to continue.</td></tr>';
  });

  $('eo-att-course')?.addEventListener('change', () => {
    populateSchedules($('eo-att-course').value);
  });

  $('eo-att-schedule')?.addEventListener('change', () => {
    const hasValue = !!$('eo-att-schedule').value;
    $('eo-att-load').disabled = !hasValue;
    $('eo-att-load').style.opacity = hasValue ? '1' : '.5';
  });

  $('eo-att-load')?.addEventListener('click', loadAttendance);
  $('eo-att-filter')?.addEventListener('change', renderRows);
  $('eo-att-search')?.addEventListener('input', renderRows);

  $('eo-att-refresh')?.addEventListener('click', () => {
    $('eo-att-dept').value = '';
    populateCourses('');
    $('eo-att-context').style.display = 'none';
    $('eo-att-summary').style.display = 'none';
    $('eo-att-filter-row').style.display = 'none';
    $('eo-att-tbody').innerHTML = '<tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">Pick a department to begin.</td></tr>';
    boot();
  });

  boot();
})();
</script>
