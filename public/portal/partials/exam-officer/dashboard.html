<!-- Portal → Exam Officer → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="exo-dash-avatar">E</div>
    <div>
      <h1>Welcome, <span id="exo-dash-name">Exam Officer</span></h1>
      <div class="sub">Examinations & Records</div>
    </div>
  </div>
  <div class="meta">
    <strong>Exams</strong>
    <span>Office</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile"><div class="tile-label">Scheduled Exams</div><div class="tile-value" id="exo-t-exams">—</div></div>
  <div class="tile tile-blue"><div class="tile-label">Eligible Students</div><div class="tile-value" id="exo-t-elig">—</div></div>
  <div class="tile tile-accent"><div class="tile-label">Attendance Sheets</div><div class="tile-value" id="exo-t-att">—</div></div>
  <div class="tile tile-purple"><div class="tile-label">Pending Approvals</div><div class="tile-value" id="exo-t-pending">—</div></div>
</div>

<div class="quick-actions">
  <a class="btn btn-primary btn-sm" href="#exam-officer-attendance">✅ Attendance</a>
  <a class="btn btn-outline btn-sm" href="#exam-officer-eligibility">🎓 Eligibility</a>
</div>

<div class="panel">
  <div class="panel-head"><h3>Upcoming Exams</h3></div>
  <div class="panel-body">
    <div id="exo-upcoming-list" class="muted small">Loading…</div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Results Awaiting Admin Approval</h3></div>
  <div class="panel-body">
    <div id="exo-pending-results" class="muted small">Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    const user = core.getPortalUser() || {};
    try {
      document.getElementById('exo-dash-name').textContent = user.firstName || 'Exam Officer';
      if (photo) photo.renderMyAvatar(document.getElementById('exo-dash-avatar'), user);

      // Exams
      try {
        const e = await core.portalFetch('/api/exams');
        const list = e.data || e || [];
        document.getElementById('exo-t-exams').textContent = list.length;

        const upcoming = list
          .filter(x => x.scheduledAt && new Date(x.scheduledAt) >= new Date())
          .slice(0, 5);

        document.getElementById('exo-upcoming-list').innerHTML = upcoming.length
          ? upcoming.map(x =>
              `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
                 <strong>${x.courseCode || ''}</strong> — ${x.courseTitle || ''}
                 <span class="muted small">· ${new Date(x.scheduledAt).toLocaleString()}</span>
               </div>`).join('')
          : '<em>No upcoming exams scheduled.</em>';
      } catch {
        document.getElementById('exo-upcoming-list').innerHTML = '<em>Could not load exams.</em>';
      }

      // Pending admin results
      try {
        const p = await core.portalFetch('/api/results/pending-admin');
        const list = p.data || p || [];
        document.getElementById('exo-t-pending').textContent = list.length;
        document.getElementById('exo-pending-results').innerHTML = list.length
          ? list.slice(0,5).map(x =>
              `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
                 <strong>${x.courseCode || ''}</strong> — ${x.courseTitle || ''}
                 <span class="muted small">· ${x.lecturerName || ''}</span>
               </div>`).join('')
          : '<em>Nothing pending. 🎉</em>';
      } catch {
        document.getElementById('exo-pending-results').innerHTML = '<em>Could not load pending results.</em>';
      }

      // Attendance + eligibility placeholders (stats endpoints don't exist yet)
      document.getElementById('exo-t-att').textContent = '—';
      document.getElementById('exo-t-elig').textContent = '—';
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  })();
</script>
