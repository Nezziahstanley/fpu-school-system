<!-- Portal → Exam Officer → Publish Results -->
<div style="padding:0;">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Publish Results</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Results verified by HODs awaiting final publication</p>
    </div>
    <div style="display:flex;gap:.5rem;">
      <button id="btn-publish-all" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;display:none;">📤 Publish ALL Pending Results</button>
      <button id="btn-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
    </div>
  </div>

  <!-- Department Cards Grid -->
  <div id="dept-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:1rem;margin-bottom:2rem;">
    <div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">
      <div class="spinner"></div> Loading departments…
    </div>
  </div>

  <!-- Recently Published History -->
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.75rem;">
    <div>
      <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#0f172a;">Recently Published Results</h3>
      <p style="margin:.2rem 0 0;font-size:.8rem;color:#64748b;">A log of results you have published</p>
    </div>
    <span class="badge" id="history-count" style="background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:2rem;text-align:center;color:#94a3b8;font-size:.82rem;" id="history-loading">Loading history…</div>
    <div style="overflow-x:auto;" id="history-content" hidden>
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Published</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
          </tr>
        </thead>
        <tbody id="history-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: Department Results -->
<div id="dept-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <div>
        <h3 id="modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Department Results</h3>
        <p id="modal-sub" style="margin:.2rem 0 0;font-size:.75rem;color:#64748b;"></p>
      </div>
      <button id="modal-close" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;flex:1;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <label style="display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;cursor:pointer;">
          <input type="checkbox" id="modal-select-all" style="width:16px;height:16px;" /> Select All for this Department
        </label>
        <button id="modal-publish-btn" style="padding:.5rem 1rem;font-size:.8rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;opacity:0.5;" disabled>Publish Selected (0)</button>
      </div>

      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;width:40px;"></th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
          </tr>
        </thead>
        <tbody id="modal-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dept-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem;
    cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: space-between;
  }
  .dept-card:hover { border-color: #065f46; box-shadow: 0 4px 12px rgba(6, 95, 70, 0.1); transform: translateY(-2px); }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_PENDING = [];
  let CURRENT_DEPT_RESULTS = [];

  // -------- Load Pending by Department --------
  async function loadPending() {
    const grid = $('dept-grid');
    grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;"><div class="spinner"></div> Loading departments…</div>';

    try {
      const res = await core.portalFetch('/api/exam-officer/pending-publication');
      ALL_PENDING = res.data || [];

      if (!ALL_PENDING.length) {
        grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">No results waiting to be published. 🎉</div>';
        $('btn-publish-all').style.display = 'none';
        return;
      }

      $('btn-publish-all').style.display = 'inline-block';

      // Group by Department
      const grouped = {};
      ALL_PENDING.forEach(r => {
        const dept = r.departmentName || 'Unassigned Department';
        if (!grouped[dept]) grouped[dept] = [];
        grouped[dept].push(r);
      });

      // Render Cards
      let html = '';
      Object.keys(grouped).sort().forEach(dept => {
        const count = grouped[dept].length;
        html += `
          <div class="dept-card" data-dept="${esc(dept)}">
            <div>
              <div style="font-weight:800;color:#0f172a;font-size:.95rem;margin-bottom:.2rem;">🏢 ${esc(dept)}</div>
              <div style="font-size:.75rem;color:#64748b;">Results awaiting publication</div>
            </div>
            <div style="background:#fef3c7;color:#92400e;padding:.35rem .75rem;border-radius:99px;font-weight:800;font-size:.85rem;">
              ${count}
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;

      // Bind Click to Open Modal
      grid.querySelectorAll('.dept-card').forEach(card => {
        card.addEventListener('click', () => {
          const dept = card.dataset.dept;
          openModal(dept, grouped[dept]);
        });
      });

    } catch (err) {
      grid.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;grid-column:1/-1;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  // -------- Open Department Modal --------
  function openModal(deptName, results) {
    CURRENT_DEPT_RESULTS = results;
    $('dept-modal').style.display = 'flex';
    $('modal-title').textContent = `🏢 ${deptName}`;
    $('modal-sub').textContent = `${results.length} result(s) awaiting publication`;
    
    $('modal-select-all').checked = false;
    $('modal-publish-btn').disabled = true;
    $('modal-publish-btn').style.opacity = '0.5';
    $('modal-publish-btn').textContent = 'Publish Selected (0)';

    $('modal-tbody').innerHTML = results.map(r => `
      <tr style="border-bottom:1px solid #f1f5f9;">
        <td style="padding:.65rem .75rem;text-align:center;">
          <input type="checkbox" class="modal-check" value="${r.id}" style="width:16px;height:16px;" />
        </td>
        <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
        <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
        <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
        <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
        <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
      </tr>
    `).join('');

    $('modal-tbody').querySelectorAll('.modal-check').forEach(cb => {
      cb.addEventListener('change', updateModalPublishBtn);
    });
  }

  function closeModal() {
    $('dept-modal').style.display = 'none';
    CURRENT_DEPT_RESULTS = [];
  }

  function updateModalPublishBtn() {
    const count = document.querySelectorAll('.modal-check:checked').length;
    const btn = $('modal-publish-btn');
    btn.textContent = count > 0 ? `Publish Selected (${count})` : 'Publish Selected (0)';
    btn.disabled = count === 0;
    btn.style.opacity = count === 0 ? '0.5' : '1';
  }

  // -------- Publish Actions --------
  async function publishResults(ids) {
    if (!ids.length) return;
    if (!confirm(`Publish ${ids.length} results to students?`)) return;

    try {
      await core.portalFetch('/api/exam-officer/publish', {
        method: 'POST',
        body: { resultIds: ids }
      });
      core.showToast && core.showToast('Results published successfully!', 'success');
      closeModal();
      loadPending();
      loadHistory();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  }

  // -------- Load Published History --------
  async function loadHistory() {
    const loadingEl = $('history-loading');
    const contentEl = $('history-content');
    const tbody = $('history-tbody');

    loadingEl.style.display = 'block';
    contentEl.hidden = true;

    try {
      const res = await core.portalFetch('/api/exam-officer/published-results');
      const rows = res.data || [];

      $('history-count').textContent = rows.length;
      loadingEl.style.display = 'none';

      if (!rows.length) {
        loadingEl.style.display = 'block';
        loadingEl.innerHTML = 'No results have been published yet.';
        return;
      }

      contentEl.hidden = false;
      tbody.innerHTML = rows.map(r => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;color:#64748b;font-size:.75rem;">${r.publishedAt ? new Date(r.publishedAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—'}</td>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
          <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
        </tr>
      `).join('');

    } catch (err) {
      loadingEl.style.display = 'block';
      loadingEl.innerHTML = `⚠️ ${esc(err.message)}`;
    }
  }

  // -------- Wiring --------
  $('btn-publish-all')?.addEventListener('click', () => {
    const allIds = ALL_PENDING.map(r => r.id);
    publishResults(allIds);
  });

  $('modal-close')?.addEventListener('click', closeModal);
  $('modal-select-all')?.addEventListener('change', (e) => {
    const checked = e.target.checked;
    document.querySelectorAll('.modal-check').forEach(cb => { cb.checked = checked; });
    updateModalPublishBtn();
  });
  $('modal-publish-btn')?.addEventListener('click', () => {
    const selected = Array.from(document.querySelectorAll('.modal-check:checked')).map(cb => Number(cb.value));
    publishResults(selected);
  });
  $('btn-refresh')?.addEventListener('click', () => {
    loadPending();
    loadHistory();
  });

  loadPending();
  loadHistory();
})();
</script>
