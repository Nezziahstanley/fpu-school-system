<!-- Portal → Exam Officer → Publish Results -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Publish Results</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Results verified by HODs awaiting final publication</p>
    </div>
    <button id="btn-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- PENDING RESULTS SECTION -->
  <div style="margin-bottom:2rem;">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.75rem;">
      <div>
        <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#0f172a;">⏳ Pending Publication</h3>
        <p style="margin:.2rem 0 0;font-size:.8rem;color:#64748b;">Click a department to review and publish</p>
      </div>
      <button id="btn-publish-all" style="padding:.5rem 1rem;font-size:.8rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;display:none;">📤 Publish All</button>
    </div>

    <div id="pending-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:.85rem;">
      <div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">
        <div class="spinner"></div>
        <div style="margin-top:.65rem;">Loading departments…</div>
      </div>
    </div>
  </div>

  <!-- PUBLISHED RESULTS SECTION -->
  <div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.75rem;">
      <div>
        <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#0f172a;">✅ Recently Published</h3>
        <p style="margin:.2rem 0 0;font-size:.8rem;color:#64748b;">Click a department to view the published results</p>
      </div>
      <span class="badge" id="published-total" style="background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>

    <div id="published-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:.85rem;">
      <div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">Loading…</div>
    </div>
  </div>
</div>

<!-- MODAL: Department Results (for both Pending and Published) -->
<div id="dept-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <div>
        <h3 id="modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Department Results</h3>
        <p id="modal-sub" style="margin:.2rem 0 0;font-size:.75rem;color:#64748b;"></p>
      </div>
      <button id="modal-close" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;flex:1;overflow-y:auto;" id="modal-body">
      <!-- Content injected based on mode -->
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dept-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: .85rem 1rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    cursor: pointer;
    transition: all .15s;
  }
  .dept-card:hover {
    border-color: #065f46;
    box-shadow: 0 4px 12px rgba(6, 95, 70, 0.1);
    transform: translateY(-1px);
  }
  .dept-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: .8rem; flex-shrink: 0;
  }
  .dept-info { flex: 1; min-width: 0; }
  .dept-name { font-weight: 800; color: #0f172a; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dept-count { font-size: .7rem; color: #64748b; margin-top: .15rem; }
  .dept-arrow { color: #94a3b8; font-size: 1rem; flex-shrink: 0; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_PENDING = [];
  let ALL_PUBLISHED = [];
  let MODE = 'pending'; // 'pending' or 'published'

  function getDeptColor(name) {
    const colors = ['#065f46', '#dc2626', '#7c3aed', '#ea580c', '#0891b2', '#0284c7', '#ca8a04', '#9333ea', '#db2777', '#059669'];
    let hash = 0;
    const str = String(name || '');
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  function getDeptInitials(name) {
    const words = String(name || 'D').split(' ');
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return String(name || 'D').substring(0, 2).toUpperCase();
  }

  function renderDeptCards(gridEl, grouped, mode) {
    const depts = Object.keys(grouped).sort();
    if (!depts.length) {
      gridEl.innerHTML = `<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">No results to show.</div>`;
      return;
    }

    let html = '';
    depts.forEach(dept => {
      const results = grouped[dept];
      const color = getDeptColor(dept);
      const initials = getDeptInitials(dept);

      html += `
        <div class="dept-card" data-dept="${esc(dept)}" data-mode="${mode}">
          <div class="dept-icon" style="background:${color};">${initials}</div>
          <div class="dept-info">
            <div class="dept-name">${esc(dept)}</div>
            <div class="dept-count">${results.length} result${results.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="dept-arrow">›</div>
        </div>
      `;
    });
    gridEl.innerHTML = html;

    gridEl.querySelectorAll('.dept-card').forEach(card => {
      card.addEventListener('click', () => {
        const dept = card.dataset.dept;
        const mode = card.dataset.mode;
        openModal(dept, grouped[dept], mode);
      });
    });
  }

  async function loadPending() {
    const grid = $('pending-grid');
    grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;"><div class="spinner"></div><div style="margin-top:.65rem;">Loading pending…</div></div>';
    
    try {
      const res = await core.portalFetch('/api/exam-officer/pending-publication');
      ALL_PENDING = res.data || [];

      if (!ALL_PENDING.length) {
        grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">No results waiting to be published. 🎉</div>';
        $('btn-publish-all').style.display = 'none';
        return;
      }

      $('btn-publish-all').style.display = 'inline-block';

      const grouped = {};
      ALL_PENDING.forEach(r => {
        const dept = r.departmentName || 'Unassigned Department';
        if (!grouped[dept]) grouped[dept] = [];
        grouped[dept].push(r);
      });

      renderDeptCards(grid, grouped, 'pending');
    } catch (err) {
      grid.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;grid-column:1/-1;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  async function loadPublished() {
    const grid = $('published-grid');
    grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;"><div class="spinner"></div><div style="margin-top:.65rem;">Loading published…</div></div>';
    
    try {
      const res = await core.portalFetch('/api/exam-officer/published-results');
      ALL_PUBLISHED = res.data || [];

      $('published-total').textContent = ALL_PUBLISHED.length;

      if (!ALL_PUBLISHED.length) {
        grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">No results have been published yet.</div>';
        return;
      }

      // Use the grouped data from backend if available, or group locally
      const grouped = res.grouped || ALL_PUBLISHED.reduce((acc, r) => {
        const dept = r.departmentName || 'Unassigned Department';
        if (!acc[dept]) acc[dept] = [];
        acc[dept].push(r);
        return acc;
      }, {});

      renderDeptCards(grid, grouped, 'published');
    } catch (err) {
      grid.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;grid-column:1/-1;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  function openModal(deptName, results, mode) {
    MODE = mode;
    $('dept-modal').style.display = 'flex';
    $('modal-title').textContent = deptName;
    $('modal-sub').textContent = `${results.length} result(s)`;
    
    const body = $('modal-body');

    if (mode === 'pending') {
      body.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <label style="display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;cursor:pointer;">
            <input type="checkbox" id="modal-select-all" style="width:16px;height:16px;" /> Select All
          </label>
          <button id="modal-publish-btn" style="padding:.5rem 1rem;font-size:.8rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;opacity:0.5;" disabled>Publish Selected (0)</button>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;width:40px;"></th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr style="border-bottom:1px solid #f1f5f9;">
                <td style="padding:.65rem .75rem;text-align:center;">
                  <input type="checkbox" class="modal-check" value="${r.id}" style="width:16px;height:16px;" />
                </td>
                <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
                <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
                <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      body.querySelectorAll('.modal-check').forEach(cb => cb.addEventListener('change', updateModalPublishBtn));
      body.querySelector('#modal-select-all')?.addEventListener('change', (e) => {
        const checked = e.target.checked;
        body.querySelectorAll('.modal-check').forEach(cb => { cb.checked = checked; });
        updateModalPublishBtn();
      });
      body.querySelector('#modal-publish-btn')?.addEventListener('click', () => {
        const selected = Array.from(body.querySelectorAll('.modal-check:checked')).map(cb => Number(cb.value));
        publishResults(selected);
      });
    } else {
      // Published mode
      body.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Published</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr style="border-bottom:1px solid #f1f5f9;">
                <td style="padding:.65rem .75rem;color:#64748b;font-size:.75rem;">${r.publishedAt ? new Date(r.publishedAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—'}</td>
                <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
                <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
                <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }
  }

  function closeModal() {
    $('dept-modal').style.display = 'none';
  }

  function updateModalPublishBtn() {
    const count = document.querySelectorAll('.modal-check:checked').length;
    const btn = $('modal-publish-btn');
    if (!btn) return;
    btn.textContent = count > 0 ? `Publish Selected (${count})` : 'Publish Selected (0)';
    btn.disabled = count === 0;
    btn.style.opacity = count === 0 ? '0.5' : '1';
  }

  async function publishResults(ids) {
    if (!ids.length) return;
    if (!confirm(`Publish ${ids.length} results to students?`)) return;

    try {
      await core.portalFetch('/api/exam-officer/publish', {
        method: 'POST',
        body: { resultIds: ids }
      });
      core.showToast && core.showToast('Results published successfully!', 'success');
      closeModal();
      loadPending();
      loadPublished();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  }

  $('btn-publish-all')?.addEventListener('click', () => {
    const allIds = ALL_PENDING.map(r => r.id);
    publishResults(allIds);
  });

  $('modal-close')?.addEventListener('click', closeModal);
  $('dept-modal')?.addEventListener('click', (e) => { if (e.target.id === 'dept-modal') closeModal(); });
  $('btn-refresh')?.addEventListener('click', () => {
    loadPending();
    loadPublished();
  });

  loadPending();
  loadPublished();
})();
</script>
