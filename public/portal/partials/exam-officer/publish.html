<!-- Portal → Exam Officer → Publish Results -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Publish Results</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Results verified by HODs awaiting final publication</p>
    </div>
    <button id="pub-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- PENDING RESULTS SECTION -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:2rem;">
    <div style="padding:3rem;text-align:center;color:#94a3b8;" id="pub-loading">
      <div class="spinner"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading results…</div>
    </div>
    
    <div id="pub-content" style="display:none;">
      <div style="padding:1rem;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
        <label style="display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;cursor:pointer;">
          <input type="checkbox" id="pub-select-all" style="width:16px;height:16px;" /> Select All Results
        </label>
        <button id="pub-publish" style="padding:.5rem 1rem;font-size:.8rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;opacity:0.5;" disabled>Publish Selected (0)</button>
      </div>

      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;width:40px;"></th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Department</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            </tr>
          </thead>
          <tbody id="pub-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- PUBLISHED HISTORY SECTION -->
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.75rem;">
    <div>
      <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#0f172a;">Recently Published Results</h3>
      <p style="margin:.2rem 0 0;font-size:.8rem;color:#64748b;">A log of results you have published</p>
    </div>
    <span class="badge" id="history-count" style="background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:2rem;text-align:center;color:#94a3b8;font-size:.82rem;" id="history-loading">
      Loading history…
    </div>
    <div style="overflow-x:auto;" id="history-content" hidden>
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Published</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
          </tr>
        </thead>
        <tbody id="history-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid #e2e8f0;
    border-top-color: #065f46;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #pub-tbody tr:hover, #history-tbody tr:hover { background: #f8fafc; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  function safeClass(name) {
    return String(name || 'unknown').replace(/[^a-zA-Z0-9]/g, '-');
  }

  // -------- Pending Load --------
  async function loadPending() {
    const loadingEl = $('pub-loading');
    const contentEl = $('pub-content');
    
    loadingEl.style.display = 'block';
    loadingEl.innerHTML = '<div class="spinner"></div><div style="margin-top:.65rem;font-size:.82rem;">Loading results…</div>';
    contentEl.style.display = 'none';

    try {
      const res = await core.portalFetch('/api/exam-officer/pending-publication');
      const rows = res.data || [];

      if (!rows.length) {
        loadingEl.innerHTML = '<div style="font-size:.85rem;">No results waiting to be published. 🎉</div>';
        return;
      }

      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';

      const grouped = {};
      rows.forEach(r => {
        const dept = r.departmentName || 'Unassigned Department';
        const prog = r.programmeName || 'Unassigned Programme';
        if (!grouped[dept]) grouped[dept] = {};
        if (!grouped[dept][prog]) grouped[dept][prog] = [];
        grouped[dept][prog].push(r);
      });

      let html = '';
      Object.keys(grouped).sort().forEach(dept => {
        const deptProgs = grouped[dept];
        const deptTotal = Object.values(deptProgs).reduce((sum, arr) => sum + arr.length, 0);
        const safeDept = safeClass(dept);

        html += `
          <tr>
            <td colspan="7" style="padding:.6rem .75rem;background:#e2e8f0;font-weight:800;font-size:.75rem;color:#0f172a;text-transform:uppercase;letter-spacing:.05em;">
              <label style="display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;margin:0;">
                <input type="checkbox" class="dept-check-all" data-dept="${esc(dept)}" style="width:16px;height:16px;" />
                🏢 ${esc(dept)} (${deptTotal} total)
              </label>
            </td>
          </tr>`;

        Object.keys(deptProgs).sort().forEach(prog => {
          const progResults = deptProgs[prog];
          const safeProg = safeClass(prog);

          html += `
            <tr>
              <td colspan="7" style="padding:.4rem .75rem;background:#f1f5f9;font-weight:700;font-size:.72rem;color:#475569;">
                <label style="display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;margin:0;">
                  <input type="checkbox" class="prog-check-all" data-dept="${esc(dept)}" data-prog="${esc(prog)}" style="width:14px;height:14px;" />
                  📚 ${esc(prog)} (${progResults.length} results)
                </label>
              </td>
            </tr>`;

          progResults.forEach(r => {
            html += `
              <tr style="border-bottom:1px solid #f1f5f9;">
                <td style="padding:.65rem .75rem;text-align:center;">
                  <input type="checkbox" class="pub-check dept-${safeDept} prog-${safeProg}" value="${r.id}" data-dept="${esc(dept)}" data-prog="${esc(prog)}" style="width:16px;height:16px;" />
                </td>
                <td style="padding:.65rem .75rem;color:#475569;">${esc(r.departmentName || '—')}</td>
                <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
                <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
                <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
              </tr>`;
          });
        });
      });

      $('pub-tbody').innerHTML = html;

      $('pub-tbody').querySelectorAll('.pub-check').forEach(cb => cb.addEventListener('change', updatePublishBtn));
      
      $('pub-tbody').querySelectorAll('.dept-check-all').forEach(deptCb => {
        deptCb.addEventListener('change', (e) => {
          const dept = e.target.dataset.dept;
          const checked = e.target.checked;
          $('pub-tbody').querySelectorAll(`.pub-check[data-dept="${dept}"]`).forEach(cb => cb.checked = checked);
          $('pub-tbody').querySelectorAll(`.prog-check-all[data-dept="${dept}"]`).forEach(pcb => pcb.checked = checked);
          updatePublishBtn();
        });
      });

      $('pub-tbody').querySelectorAll('.prog-check-all').forEach(progCb => {
        progCb.addEventListener('change', (e) => {
          const dept = e.target.dataset.dept;
          const prog = e.target.dataset.prog;
          const checked = e.target.checked;
          $('pub-tbody').querySelectorAll(`.pub-check[data-dept="${dept}"][data-prog="${prog}"]`).forEach(cb => cb.checked = checked);
          updatePublishBtn();
        });
      });

      updatePublishBtn();

    } catch (err) {
      console.error('[exam-officer/publish] Error:', err);
      loadingEl.innerHTML = `<div style="color:#991b1b;font-size:.85rem;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  function updatePublishBtn() {
    try {
      const count = document.querySelectorAll('.pub-check:checked').length;
      const btn = $('pub-publish');
      btn.textContent = count > 0 ? `Publish Selected (${count})` : 'Publish Selected (0)';
      btn.disabled = count === 0;
      btn.style.opacity = count === 0 ? '0.5' : '1';
    } catch (e) { /* ignore */ }
  }

  async function publishSelected() {
    try {
      const selected = Array.from(document.querySelectorAll('.pub-check:checked')).map(cb => Number(cb.value));
      if (!selected.length) return;
      if (!confirm(`Publish ${selected.length} results to students?`)) return;

      const btn = $('pub-publish');
      btn.disabled = true;
      btn.textContent = 'Publishing…';

      await core.portalFetch('/api/exam-officer/publish', {
        method: 'POST',
        body: { resultIds: selected }
      });
      core.showToast && core.showToast('Results published successfully!', 'success');
      
      // Reload BOTH sections
      loadPending();
      loadHistory();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
      if ($('pub-publish')) $('pub-publish').disabled = false;
    }
  }

  // -------- Published History --------
  async function loadHistory() {
    const loadingEl = $('history-loading');
    const contentEl = $('history-content');
    const tbody = $('history-tbody');

    loadingEl.style.display = 'block';
    contentEl.hidden = true;

    try {
      // Assuming you have (or will create) an endpoint that returns recent published results
      const res = await core.portalFetch('/api/exam-officer/published-results');
      const rows = res.data || [];

      $('history-count').textContent = rows.length;
      loadingEl.style.display = 'none';

      if (!rows.length) {
        loadingEl.style.display = 'block';
        loadingEl.innerHTML = 'No results have been published yet.';
        return;
      }

      contentEl.hidden = false;

      tbody.innerHTML = rows.map(r => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;color:#64748b;font-size:.75rem;">${r.publishedAt ? new Date(r.publishedAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—'}</td>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
          <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span class="chip" style="background:#d1fae5;color:#065f46;font-size:.7rem;padding:2px 6px;border-radius:4px;font-weight:700;">Published</span>
          </td>
        </tr>
      `).join('');

    } catch (err) {
      console.error('[exam-officer/history] Error:', err);
      loadingEl.style.display = 'block';
      loadingEl.innerHTML = `⚠️ ${esc(err.message)}`;
    }
  }

  // -------- Wiring --------
  $('pub-select-all')?.addEventListener('change', (e) => {
    try {
      const checked = e.target.checked;
      document.querySelectorAll('.pub-check').forEach(cb => cb.checked = checked);
      document.querySelectorAll('.dept-check-all').forEach(dcb => dcb.checked = checked);
      document.querySelectorAll('.prog-check-all').forEach(pcb => pcb.checked = checked);
      updatePublishBtn();
    } catch (err) { /* ignore */ }
  });

  $('pub-refresh')?.addEventListener('click', () => {
    loadPending();
    loadHistory();
  });
  $('pub-publish')?.addEventListener('click', publishSelected);

  // Load both sections on page load
  loadPending();
  loadHistory();
})();
</script>
