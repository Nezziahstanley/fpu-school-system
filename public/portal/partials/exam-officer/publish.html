<!-- Portal → Exam Officer → Publish Results -->
<div style="padding:0;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Publish Results</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Results verified by HODs awaiting final publication</p>
    </div>
    <button id="pub-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:3rem;text-align:center;color:#94a3b8;" id="pub-loading">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading results…</div>
    </div>
    
    <div id="pub-content" style="display:none;">
      <div style="padding:1rem;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
        <label style="display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;cursor:pointer;">
          <input type="checkbox" id="pub-select-all" style="width:16px;height:16px;" /> Select All Results
        </label>
        <button id="pub-publish" style="padding:.5rem 1rem;font-size:.8rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;opacity:0.5;" disabled>Publish Selected (0)</button>
      </div>

      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;width:40px;"></th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Department</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            </tr>
          </thead>
          <tbody id="pub-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  #pub-tbody tr:hover { background: #f8fafc; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  async function load() {
    $('pub-loading').style.display = 'block';
    $('pub-content').style.display = 'none';

    try {
      const res = await core.portalFetch('/api/exam-officer/pending-publication');
      const rows = res.data || [];

      if (!rows.length) {
        $('pub-loading').innerHTML = 'No results waiting to be published. 🎉';
        return;
      }

      $('pub-loading').style.display = 'none';
      $('pub-content').style.display = 'block';

      // Group by Department for visual separation
      let currentDept = '';
      let html = '';

      rows.forEach(r => {
        if (r.departmentName !== currentDept) {
          currentDept = r.departmentName;
          html += `
            <tr>
              <td colspan="7" style="padding:.5rem .75rem;background:#f1f5f9;font-weight:800;font-size:.72rem;color:#475569;text-transform:uppercase;letter-spacing:.05em;">
                ${esc(currentDept)}
              </td>
            </tr>`;
        }

        html += `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;text-align:center;"><input type="checkbox" class="pub-check" value="${r.id}" style="width:16px;height:16px;" /></td>
            <td style="padding:.65rem .75rem;color:#475569;">${esc(r.departmentName)}</td>
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
            <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
            <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
          </tr>`;
      });

      $('pub-tbody').innerHTML = html;

      $('pub-tbody').querySelectorAll('.pub-check').forEach(cb => {
        cb.addEventListener('change', updatePublishBtn);
      });

      updatePublishBtn();

    } catch (err) {
      $('pub-loading').innerHTML = `⚠️ ${esc(err.message)}`;
    }
  }

  function updatePublishBtn() {
    const count = document.querySelectorAll('.pub-check:checked').length;
    const btn = $('pub-publish');
    btn.textContent = count > 0 ? `Publish Selected (${count})` : 'Publish Selected (0)';
    btn.disabled = count === 0;
    btn.style.opacity = count === 0 ? '0.5' : '1';
  }

  async function publishSelected() {
    const selected = Array.from(document.querySelectorAll('.pub-check:checked')).map(cb => Number(cb.value));
    if (!selected.length) return;
    if (!confirm(`Publish ${selected.length} results to students?`)) return;

    const btn = $('pub-publish');
    btn.disabled = true;
    btn.textContent = 'Publishing…';

    try {
      await core.portalFetch('/api/exam-officer/publish', {
        method: 'POST',
        body: { resultIds: selected }
      });
      core.showToast && core.showToast('Results published successfully!', 'success');
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
      btn.disabled = false;
    }
  }

  $('pub-select-all')?.addEventListener('change', (e) => {
    const checked = e.target.checked;
    document.querySelectorAll('.pub-check').forEach(cb => { cb.checked = checked; });
    updatePublishBtn();
  });

  $('pub-refresh')?.addEventListener('click', load);
  $('pub-publish')?.addEventListener('click', publishSelected);

  load();
})();
</script>
