<!-- Portal → Exam Officer → Publish Results -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Publish Results</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Results verified by HODs awaiting final publication</p>
    </div>
    <button id="btn-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- PENDING RESULTS SECTION -->
  <div style="margin-bottom:2rem;">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.75rem;">
      <div>
        <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#0f172a;">⏳ Pending Publication</h3>
        <p style="margin:.2rem 0 0;font-size:.8rem;color:#64748b;">Click a department to review and publish</p>
      </div>
      <button id="btn-publish-all" style="padding:.5rem 1rem;font-size:.8rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;display:none;">📤 Publish All</button>
    </div>

    <div id="pending-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:.85rem;">
      <div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">
        <div class="spinner"></div>
        <div style="margin-top:.65rem;">Loading departments…</div>
      </div>
    </div>
  </div>

  <!-- PUBLISHED RESULTS SECTION -->
  <div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:.75rem;">
      <div>
        <h3 style="margin:0;font-size:1.05rem;font-weight:800;color:#0f172a;">✅ Recently Published</h3>
        <p style="margin:.2rem 0 0;font-size:.8rem;color:#64748b;">Click a department to view the published results</p>
      </div>
      <span class="badge" id="published-total" style="background:#e2e8f0;color:#475569;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>

    <div id="published-grid" style="display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:.85rem;">
      <div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">Loading…</div>
    </div>
  </div>
</div>

<!-- MODAL: Department Results (for both Pending and Published) -->
<div id="dept-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <div>
        <h3 id="modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Department Results</h3>
        <p id="modal-sub" style="margin:.2rem 0 0;font-size:.75rem;color:#64748b;"></p>
      </div>
      <button id="modal-close" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;flex:1;overflow-y:auto;" id="modal-body">
      <!-- Content injected based on mode -->
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dept-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: .85rem 1rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    cursor: pointer;
    transition: all .15s;
  }
  .dept-card:hover {
    border-color: #065f46;
    box-shadow: 0 4px 12px rgba(6, 95, 70, 0.1);
    transform: translateY(-1px);
  }
  .dept-icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: .8rem; flex-shrink: 0;
  }
  .dept-info { flex: 1; min-width: 0; }
  .dept-name { font-weight: 800; color: #0f172a; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dept-count { font-size: .7rem; color: #64748b; margin-top: .15rem; }
  .dept-arrow { color: #94a3b8; font-size: 1rem; flex-shrink: 0; }
  .eo-published-result-row:hover{background:#ecfdf5!important}
  .eo-result-actions{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
  .eo-result-actions button{padding:.65rem .9rem;border:0;border-radius:8px;background:#065f46;color:#fff;font-weight:800;cursor:pointer}
  .eo-result-actions button:first-child{background:#e2e8f0;color:#334155}
  .eo-result-sheet{position:relative;isolation:isolate;overflow:hidden;background:#fff;border:1px solid #dbe3ec;border-radius:14px;padding:1.5rem;max-width:820px;margin:auto;box-shadow:0 8px 28px rgba(15,23,42,.08)}
  .eo-result-watermark{position:absolute;inset:15% 20%;background:url('/images/logo.png') center/contain no-repeat;opacity:.055;z-index:-1;pointer-events:none}
  .eo-result-brand{display:flex;align-items:center;justify-content:center;gap:1rem;text-align:center;border-bottom:3px solid #065f46;padding-bottom:1rem}
  .eo-result-brand img{width:76px;height:76px;object-fit:contain}.eo-result-brand h2{font-size:1.1rem;margin:0 0 .35rem;color:#064e3b}.eo-result-brand p{font-size:.65rem;letter-spacing:.12em;margin:.2rem;color:#64748b}.eo-result-brand strong{font-size:.72rem;color:#065f46}
  .eo-result-status{text-align:center;margin:1.2rem 0 .4rem;font-size:.7rem;font-weight:900;letter-spacing:.16em;color:#047857}
  .eo-result-sheet>h3{text-align:center;font-size:1rem;margin:.3rem 0 1rem}
  .eo-result-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e2e8f0}
  .eo-result-grid>div{padding:.8rem;border:1px solid #e2e8f0;min-height:66px}.eo-result-grid .wide{grid-column:1/-1}
  .eo-result-grid small{display:block;font-size:.62rem;color:#64748b;text-transform:uppercase;font-weight:800;letter-spacing:.05em;margin-bottom:.35rem}
  .eo-result-grid strong{font-size:.84rem;color:#0f172a}.eo-result-score,.eo-result-grade{color:#065f46!important;font-size:1.05rem!important}
  .eo-result-footnote{font-size:.7rem;color:#64748b;line-height:1.6;margin-top:1.2rem;border-top:1px solid #e2e8f0;padding-top:.8rem}
  .eo-result-signline{display:flex;justify-content:space-between;gap:1rem;margin-top:2.5rem;font-size:.7rem;color:#334155}
  .eo-result-signline span{border-top:1px solid #64748b;padding-top:.4rem;min-width:160px}
  @media(max-width:600px){.eo-result-grid{grid-template-columns:1fr}.eo-result-grid .wide{grid-column:auto}.eo-result-sheet{padding:.8rem}.eo-result-brand img{width:54px;height:54px}}
  @media print{.eo-result-actions{display:none!important}.eo-result-sheet{box-shadow:none;border:0}}
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_PENDING = [];
  let ALL_PUBLISHED = [];
  let MODE = 'pending';
  let PUBLISHING = false; // 'pending' or 'published'

  function getDeptColor(name) {
    const colors = ['#065f46', '#dc2626', '#7c3aed', '#ea580c', '#0891b2', '#0284c7', '#ca8a04', '#9333ea', '#db2777', '#059669'];
    let hash = 0;
    const str = String(name || '');
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
  }

  function getDeptInitials(name) {
    const words = String(name || 'D').split(' ');
    if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
    return String(name || 'D').substring(0, 2).toUpperCase();
  }

  function renderDeptCards(gridEl, grouped, mode) {
    const depts = Object.keys(grouped).sort();
    if (!depts.length) {
      gridEl.innerHTML = `<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">No results to show.</div>`;
      return;
    }

    let html = '';
    depts.forEach(dept => {
      const results = grouped[dept];
      const color = getDeptColor(dept);
      const initials = getDeptInitials(dept);

      html += `
        <div class="dept-card" data-dept="${esc(dept)}" data-mode="${mode}">
          <div class="dept-icon" style="background:${color};">${initials}</div>
          <div class="dept-info">
            <div class="dept-name">${esc(dept)}</div>
            <div class="dept-count">${results.length} result${results.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="dept-arrow">›</div>
        </div>
      `;
    });
    gridEl.innerHTML = html;

    gridEl.querySelectorAll('.dept-card').forEach(card => {
      card.addEventListener('click', () => {
        const dept = card.dataset.dept;
        const mode = card.dataset.mode;
        openModal(dept, grouped[dept], mode);
      });
    });
  }

  async function loadPending() {
    const grid = $('pending-grid');
    grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;"><div class="spinner"></div><div style="margin-top:.65rem;">Loading pending…</div></div>';
    
    try {
      const res = await core.portalFetch('/api/exam-officer/pending-publication');
      ALL_PENDING = res.data || [];

      if (!ALL_PENDING.length) {
        grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">No results waiting to be published. 🎉</div>';
        $('btn-publish-all').style.display = 'none';
        return;
      }

      $('btn-publish-all').style.display = 'inline-block';

      const grouped = {};
      ALL_PENDING.forEach(r => {
        const dept = r.departmentName || 'Unassigned Department';
        if (!grouped[dept]) grouped[dept] = [];
        grouped[dept].push(r);
      });

      renderDeptCards(grid, grouped, 'pending');
    } catch (err) {
      grid.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;grid-column:1/-1;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  async function loadPublished() {
    const grid = $('published-grid');
    grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;"><div class="spinner"></div><div style="margin-top:.65rem;">Loading published…</div></div>';
    
    try {
      const res = await core.portalFetch('/api/exam-officer/published-results');
      ALL_PUBLISHED = res.data || [];

      $('published-total').textContent = ALL_PUBLISHED.length;

      if (!ALL_PUBLISHED.length) {
        grid.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;grid-column:1/-1;">No results have been published yet.</div>';
        return;
      }

      // Use the grouped data from backend if available, or group locally
      const grouped = res.grouped || ALL_PUBLISHED.reduce((acc, r) => {
        const dept = r.departmentName || 'Unassigned Department';
        if (!acc[dept]) acc[dept] = [];
        acc[dept].push(r);
        return acc;
      }, {});

      renderDeptCards(grid, grouped, 'published');
    } catch (err) {
      grid.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;grid-column:1/-1;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  function openModal(deptName, results, mode) {
    MODE = mode;
    $('dept-modal').style.display = 'flex';
    $('modal-title').textContent = deptName;
    $('modal-sub').textContent = `${results.length} result(s)`;
    
    const body = $('modal-body');

    if (mode === 'pending') {
      body.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <label style="display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;cursor:pointer;">
            <input type="checkbox" id="modal-select-all" style="width:16px;height:16px;" /> Select All
          </label>
          <button id="modal-publish-btn" style="padding:.5rem 1rem;font-size:.8rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;opacity:0.5;" disabled>Publish Selected (0)</button>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;width:40px;"></th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr style="border-bottom:1px solid #f1f5f9;">
                <td style="padding:.65rem .75rem;text-align:center;">
                  <input type="checkbox" class="modal-check" value="${r.id}" style="width:16px;height:16px;" />
                </td>
                <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
                <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
                <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      body.querySelectorAll('.modal-check').forEach(cb => cb.addEventListener('change', updateModalPublishBtn));
      body.querySelector('#modal-select-all')?.addEventListener('change', (e) => {
        const checked = e.target.checked;
        body.querySelectorAll('.modal-check').forEach(cb => { cb.checked = checked; });
        updateModalPublishBtn();
      });
      body.querySelector('#modal-publish-btn')?.addEventListener('click', () => {
        const selected = Array.from(body.querySelectorAll('.modal-check:checked')).map(cb => Number(cb.value));
        publishResults(selected);
      });
    } else {
      // Published mode
      body.innerHTML = `
        <div class="eo-result-actions"><span style="font-size:.78rem;color:#64748b;align-self:center;">Select a row to inspect its official result sheet.</span><button type="button" id="eo-print-department-results">🖨 Print Department Results</button></div>
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Published</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr class="eo-published-result-row" data-result-id="${r.id}" title="Click to view full result details" style="border-bottom:1px solid #f1f5f9;cursor:pointer;">
                <td style="padding:.65rem .75rem;color:#64748b;font-size:.75rem;">${(r.publishedAt || r.createdAt) ? new Date(r.publishedAt || r.createdAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : 'Date unavailable'}</td>
                <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentName)}</td>
                <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(r.matricNumber)}</code></td>
                <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
      body.querySelector('#eo-print-department-results')?.addEventListener('click', () => printDepartmentResults(results, deptName));
      body.querySelectorAll('.eo-published-result-row').forEach(row => {
        row.addEventListener('click', () => {
          const result = results.find(item => String(item.id) === String(row.dataset.resultId));
          if (result) showPublishedResult(result);
        });
      });
    }
  }

  function printDepartmentResults(results, departmentName) {
    const win = window.open('', '_blank', 'width=1100,height=900');
    if (!win) { core.showToast && core.showToast('Allow pop-ups to print department results.', 'warning'); return; }
    const rows = results.map((r, i) => '<tr><td>'+(i+1)+'</td><td>'+esc(r.studentName || '—')+'</td><td>'+esc(r.matricNumber || '—')+'</td><td>'+esc((r.courseCode || '')+' '+(r.courseTitle || ''))+'</td><td>'+esc(r.score == null ? '—' : r.score)+'</td><td>'+esc(r.grade || '—')+'</td><td>'+esc((r.publishedAt || r.createdAt) ? new Date(r.publishedAt || r.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : 'Date unavailable')+'</td></tr>').join('');
    win.document.write('<!doctype html><html><head><title>Published Results</title><style>@page{size:A4 landscape;margin:14mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#172033;position:relative}body:before{content:"";position:fixed;inset:12% 30%;background:url("/images/logo.png") center/contain no-repeat;opacity:.055;z-index:-1}.brand{display:flex;align-items:center;justify-content:center;gap:16px;text-align:center;border-bottom:3px solid #065f46;padding-bottom:12px;margin-bottom:18px}.brand img{width:68px;height:68px;object-fit:contain}.brand h1{font-size:18px;margin:0 0 4px}.brand p{font-size:10px;margin:3px}.meta{text-align:center;margin:12px 0 18px;font-weight:bold;color:#065f46}table{width:100%;border-collapse:collapse;font-size:10px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}th{background:#ecfdf5;text-transform:uppercase;font-size:9px}.foot{margin-top:20px;font-size:10px;color:#64748b;border-top:1px solid #cbd5e1;padding-top:10px}</style></head><body><header class="brand"><img src="/images/logo.png" alt="School logo"><div><h1>FEDERAL POLYTECHNIC UGEP</h1><p>EXAMINATIONS OFFICE</p><p><b>PUBLISHED DEPARTMENT RESULTS</b></p></div></header><div class="meta">'+esc(departmentName)+' · '+results.length+' published result(s)</div><table><thead><tr><th>S/N</th><th>Student</th><th>Matric Number</th><th>Course</th><th>Score</th><th>Grade</th><th>Published</th></tr></thead><tbody>'+rows+'</tbody></table><p class="foot">Official academic record generated by the Federal Polytechnic Ugep Examinations Office.</p><script>window.onload=function(){window.print()}<\\/script></body></html>');
    win.document.close();
  }

  function showPublishedResult(r) {
    const published = (r.publishedAt || r.createdAt) ? new Date(r.publishedAt || r.createdAt).toLocaleDateString('en-GB', {day:'2-digit',month:'long',year:'numeric'}) : '—';
    const score = Number(r.score || 0);
    const body = $('modal-body');
    $('modal-title').textContent = 'Published Result';
    $('modal-sub').textContent = (r.studentName || 'Student') + ' · ' + (r.matricNumber || 'No matric number');
    body.innerHTML = `
      <div class="eo-result-detail">
        <div class="eo-result-actions"><button type="button" id="eo-result-back">← Back to results</button><button type="button" id="eo-result-print">🖨 Print Official Result</button></div>
        <article class="eo-result-sheet">
          <div class="eo-result-watermark"></div>
          <header class="eo-result-brand">
            <img src="/images/logo.png" alt="Federal Polytechnic Ugep logo">
            <div><h2>FEDERAL POLYTECHNIC UGEP</h2><p>OFFICE OF THE EXAMINATIONS OFFICER</p><strong>OFFICIAL RESULT RECORD</strong></div>
          </header>
          <div class="eo-result-status">PUBLISHED RESULT</div>
          <h3>STUDENT ACADEMIC RESULT</h3>
          <div class="eo-result-grid">
            <div><small>Student Name</small><strong>${esc(r.studentName || '—')}</strong></div>
            <div><small>Matriculation Number</small><strong>${esc(r.matricNumber || '—')}</strong></div>
            <div><small>Department</small><strong>${esc(r.departmentName || '—')}</strong></div>
            <div><small>Programme</small><strong>${esc(r.programmeName || '—')}</strong></div>
            <div><small>Academic Level</small><strong>${esc(r.level || '—')}</strong></div>
            <div><small>Academic Session</small><strong>${esc(r.sessionName || '—')}</strong></div>
            <div><small>Semester</small><strong>${esc(r.semester || '—')}</strong></div>
            <div><small>Course Code</small><strong>${esc(r.courseCode || '—')}</strong></div>
            <div class="wide"><small>Course Title</small><strong>${esc(r.courseTitle || '—')}</strong></div>
            <div><small>Credit Units</small><strong>${esc(r.courseUnit == null ? '—' : r.courseUnit)}</strong></div>
            <div><small>Score</small><strong class="eo-result-score">${esc(score.toFixed(2))} / 100</strong></div>
            <div><small>Grade</small><strong class="eo-result-grade">${esc(r.grade || '—')}</strong></div>
            <div><small>Grade Points</small><strong>${esc(r.points == null ? '—' : r.points)}</strong></div>
            <div><small>Date Published</small><strong>${esc(published)}</strong></div>
          </div>
          <p class="eo-result-footnote">This record reflects the result published in the institution's academic system. Any correction must follow the approved result-amendment procedure.</p>
          <div class="eo-result-signline"><span>Examinations Office</span><span>Official digital record</span></div>
        </article>
      </div>`;
    $('eo-result-back').addEventListener('click', () => openModal(r.departmentName || 'Unassigned Department', ALL_PUBLISHED.filter(x => (x.departmentName || 'Unassigned Department') === (r.departmentName || 'Unassigned Department')), 'published'));
    $('eo-result-print').addEventListener('click', () => printPublishedResult(r));
  }

  function printPublishedResult(r) {
    const win = window.open('', '_blank', 'width=900,height=1100');
    if (!win) { core.showToast && core.showToast('Allow pop-ups to print the result.', 'warning'); return; }
    const escPrint = value => esc(value == null ? '—' : value);
    const fields = [
      ['Student Name',r.studentName],['Matriculation Number',r.matricNumber],['Department',r.departmentName],
      ['Programme',r.programmeName],['Level',r.level],['Academic Session',r.sessionName],['Semester',r.semester],
      ['Course Code',r.courseCode],['Course Title',r.courseTitle],['Credit Units',r.courseUnit],
      ['Score',Number(r.score || 0).toFixed(2) + ' / 100'],['Grade',r.grade],['Grade Points',r.points],
      ['Date Published',(r.publishedAt || r.createdAt) ? new Date(r.publishedAt || r.createdAt).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'}) : '—']
    ];
    win.document.write('<!doctype html><html><head><title>Official Student Result</title><style>@page{size:A4;margin:16mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#172033;position:relative}body:before{content:"";position:fixed;inset:18% 20%;background:url("/images/logo.png") center/contain no-repeat;opacity:.07;z-index:-1}.brand{display:flex;align-items:center;justify-content:center;gap:18px;text-align:center;border-bottom:3px solid #065f46;padding-bottom:14px}.brand img{width:78px;height:78px;object-fit:contain}.brand h1{font-size:19px;margin:0 0 5px}.brand p{font-size:10px;letter-spacing:1px;margin:3px}.status{text-align:center;margin:20px auto 12px;color:#065f46;font-weight:bold;letter-spacing:2px}h2{text-align:center;font-size:17px;margin:8px 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d5dce5}.item{padding:12px;border:1px solid #e2e8f0;min-height:62px}.item small{display:block;color:#64748b;font-size:9px;text-transform:uppercase;margin-bottom:6px}.item strong{font-size:13px}.wide{grid-column:1/-1}.foot{font-size:10px;line-height:1.6;color:#64748b;margin-top:25px;border-top:1px solid #cbd5e1;padding-top:12px}.sign{display:flex;justify-content:space-between;margin-top:55px;font-size:11px}.sign span{border-top:1px solid #334155;padding-top:7px;min-width:180px}@media print{button{display:none}}</style></head><body><header class="brand"><img src="/images/logo.png" alt="School logo"><div><h1>FEDERAL POLYTECHNIC UGEP</h1><p>OFFICE OF THE EXAMINATIONS OFFICER</p><p><b>OFFICIAL RESULT RECORD</b></p></div></header><div class="status">PUBLISHED RESULT</div><h2>STUDENT ACADEMIC RESULT</h2><div class="grid">'+fields.map((field,index)=>'<div class="item '+(index===8?'wide':'')+'"><small>'+escPrint(field[0])+'</small><strong>'+escPrint(field[1])+'</strong></div>').join('')+'</div><p class="foot">This record reflects the result published in the institution academic system. Any correction must follow the approved result-amendment procedure.</p><div class="sign"><span>Examinations Office</span><span>Official digital record</span></div><script>window.onload=function(){window.print()}<\/script></body></html>');
    win.document.close();
  }

  function closeModal() {
    $('dept-modal').style.display = 'none';
  }

  function updateModalPublishBtn() {
    const count = document.querySelectorAll('.modal-check:checked').length;
    const btn = $('modal-publish-btn');
    if (!btn) return;
    btn.textContent = count > 0 ? `Publish Selected (${count})` : 'Publish Selected (0)';
    btn.disabled = count === 0;
    btn.style.opacity = count === 0 ? '0.5' : '1';
  }

  async function publishResults(ids) {
    if (!ids.length || PUBLISHING) return;
    if (!confirm(`Publish ${ids.length} results to students?`)) return;

    PUBLISHING = true;
    const allButton = $('btn-publish-all');
    const modalButton = $('modal-publish-btn');
    if (allButton) { allButton.disabled = true; allButton.textContent = 'Publishing…'; }
    if (modalButton) { modalButton.disabled = true; modalButton.textContent = 'Publishing…'; }

    try {
      const response = await core.portalFetch('/api/exam-officer/publish', {
        method: 'POST',
        body: { resultIds: ids }
      });
      const publishedCount = Number(response.publishedCount);
      if (!Number.isFinite(publishedCount) || publishedCount !== ids.length) {
        throw new Error('The server did not confirm that every selected result was published. The lists will be refreshed.');
      }
      core.showToast && core.showToast(`Published ${publishedCount} result(s) successfully.`, 'success');
      closeModal();
      await Promise.all([loadPending(), loadPublished()]);
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
      // A stale selection may have partially changed on the server; always
      // refresh both lists so the screen reflects the authoritative state.
      await Promise.all([loadPending(), loadPublished()]);
    } finally {
      PUBLISHING = false;
      if (allButton) { allButton.disabled = false; allButton.textContent = '📤 Publish All'; }
    }
  }

  $('btn-publish-all')?.addEventListener('click', () => {
    const allIds = ALL_PENDING.map(r => r.id);
    publishResults(allIds);
  });

  $('modal-close')?.addEventListener('click', closeModal);
  $('dept-modal')?.addEventListener('click', (e) => { if (e.target.id === 'dept-modal') closeModal(); });
  $('btn-refresh')?.addEventListener('click', () => {
    loadPending();
    loadPublished();
  });

  loadPending();
  loadPublished();
})();
</script>
