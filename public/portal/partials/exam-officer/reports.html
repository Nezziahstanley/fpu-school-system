<section class="eo-page">
<header class="eo-head"><div><h2>Examination Reports</h2><p>Schedule coverage and attendance summary across examination sessions.</p></div><div><button id="eo-report-refresh" type="button">↻ Refresh</button><button id="eo-report-print" type="button">Print</button></div></header>
<div class="eo-kpis"><article><small>Total Schedules</small><strong id="eo-r-total">—</strong></article><article><small>Covered Schedules</small><strong id="eo-r-covered">—</strong></article><article><small>Present</small><strong id="eo-r-present">—</strong></article><article><small>Absent</small><strong id="eo-r-absent">—</strong></article></div>
<div class="eo-report-grid"><section><h3>Attendance Breakdown</h3><div id="eo-r-attendance">Loading…</div></section><section><h3>Schedule Coverage</h3><div id="eo-r-coverage">Loading…</div></section></div><p class="eo-note">Report values are supplied by the Examination Office reporting service.</p>
</section>
<style>
.eo-page{color:#0f172a}.eo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.eo-head h2{font-size:1.35rem;margin:0}.eo-head p,.eo-note{font-size:.82rem;color:#64748b;margin:.35rem 0}.eo-head button{border:0;border-radius:8px;padding:.65rem .9rem;background:#065f46;color:white;font-weight:750;cursor:pointer;margin-left:.35rem}.eo-head button+button{background:#334155}.eo-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;margin-bottom:1rem}.eo-kpis article,.eo-report-grid section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1rem}.eo-kpis small{font-size:.68rem;color:#64748b;font-weight:750;text-transform:uppercase}.eo-kpis strong{display:block;font-size:1.7rem;margin-top:.4rem}.eo-report-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.eo-report-grid h3{font-size:.95rem;margin:0 0 .8rem}.eo-report-row{display:flex;justify-content:space-between;padding:.65rem .7rem;border-radius:8px;background:#f8fafc;margin:.45rem 0;font-size:.82rem}.eo-note{margin-top:.8rem}@media(max-width:700px){.eo-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.eo-report-grid{grid-template-columns:1fr}}@media print{.eo-head button{display:none}}
</style>
<script>
(function(){'use strict';const core=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>core.escapeHtml?core.escapeHtml(v):String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");function pairs(v){if(Array.isArray(v))return v.map(x=>[x.status||'Other',Number(x.c||x.count||0)]);return Object.entries(v||{}).map(([k,n])=>[k,Number(n||0)])}function lines(id,data){const a=pairs(data);$(id).innerHTML=a.length?a.map(([k,n])=>'<div class="eo-report-row"><span>'+esc(k.replaceAll('_',' '))+'</span><strong>'+n.toLocaleString()+'</strong></div>').join(''):'<div class="eo-report-row">No data recorded</div>'}async function load(){['eo-r-total','eo-r-covered','eo-r-present','eo-r-absent'].forEach(id=>$(id).textContent='…');try{const r=await core.portalFetch('/api/exam-officer/reports');const d=r.data||{};const schedules=Array.isArray(d.schedules)?d.schedules:[];const totals=pairs(d.attendanceTotals);const get=k=>Number((totals.find(x=>String(x[0]).toLowerCase()===k)||[])[1]||0);$('eo-r-total').textContent=schedules.length.toLocaleString();$('eo-r-covered').textContent=Number(d.coveredSchedules||0).toLocaleString();$('eo-r-present').textContent=get('present').toLocaleString();$('eo-r-absent').textContent=get('absent').toLocaleString();lines('eo-r-attendance',d.attendanceTotals);const covered=Number(d.coveredSchedules||0);const pct=schedules.length?Math.round(covered/schedules.length*100):0;$('eo-r-coverage').innerHTML='<div class="eo-report-row"><span>Schedules with attendance</span><strong>'+covered+'</strong></div><div class="eo-report-row"><span>Schedules without attendance</span><strong>'+Math.max(0,schedules.length-covered)+'</strong></div><div class="eo-report-row"><span>Coverage rate</span><strong>'+pct+'%</strong></div>'}catch(e){$('eo-r-attendance').textContent='Could not load report: '+e.message;$('eo-r-coverage').textContent='Please refresh or contact the administrator.';core.showToast&&core.showToast('Unable to load examination report','error')}}$('eo-report-refresh').addEventListener('click',load);$('eo-report-print').addEventListener('click',()=>window.print());load()})();
</script>
