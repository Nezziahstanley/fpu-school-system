<section class="eo-page">
<header class="eo-head"><div><h2>Examination Schedules</h2><p>View examination dates, course details, venues and time allocations.</p></div><button id="eo-schedule-refresh" type="button">↻ Refresh</button></header>
<div class="eo-toolbar"><input id="eo-schedule-search" type="search" placeholder="Search course, code, venue or semester…" aria-label="Search schedules"><select id="eo-schedule-session" aria-label="Filter by session"><option value="">All sessions</option></select></div>
<div class="eo-table-wrap"><table><thead><tr><th>Date</th><th>Course</th><th>Session / Semester</th><th>Time</th><th>Venue</th><th>Level</th></tr></thead><tbody id="eo-schedule-rows"><tr><td colspan="6">Loading schedules…</td></tr></tbody></table></div><p class="eo-note" id="eo-schedule-count"></p>
</section>
<style>
.eo-page{color:#0f172a}.eo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.eo-head h2{font-size:1.35rem;margin:0}.eo-head p,.eo-note{font-size:.82rem;color:#64748b;margin:.35rem 0}.eo-head button{border:0;border-radius:8px;padding:.65rem .9rem;background:#065f46;color:white;font-weight:750;cursor:pointer}.eo-toolbar{display:flex;gap:.65rem;flex-wrap:wrap;margin-bottom:.8rem}.eo-toolbar input,.eo-toolbar select{min-width:190px;flex:1;padding:.7rem .8rem;border:1px solid #cbd5e1;border-radius:9px;background:white;color:#0f172a}.eo-table-wrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.eo-page table{border-collapse:collapse;width:100%;min-width:760px;font-size:.82rem}.eo-page th,.eo-page td{padding:.75rem .8rem;text-align:left;border-bottom:1px solid #f1f5f9}.eo-page th{background:#f8fafc;color:#64748b;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}.eo-page tbody tr:hover{background:#f8fafc}.eo-note{margin-top:.7rem}@media print{.eo-head button,.eo-toolbar{display:none}}
</style>
<script>
(function(){'use strict';const core=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>core.escapeHtml?core.escapeHtml(v):String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");let all=[];const date=v=>v?new Date(v).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';function render(){const q=$('eo-schedule-search').value.trim().toLowerCase(),session=$('eo-schedule-session').value;const rows=all.filter(x=>{const text=[x.courseCode,x.courseTitle,x.venue,x.semester,x.sessionName,x.academicSession?.name,x.level].join(' ').toLowerCase();return(!q||text.includes(q))&&(!session||String(x.sessionId||x.academicSessionId||'')===session)});$('eo-schedule-rows').innerHTML=rows.length?rows.map(x=>'<tr><td>'+date(x.examDate)+'</td><td><strong>'+esc(x.courseCode||'—')+'</strong><br>'+esc(x.courseTitle||'')+'</td><td>'+esc(x.sessionName||x.academicSession?.name||x.semester||'—')+'</td><td>'+esc(x.startTime||'—')+' – '+esc(x.endTime||'—')+'</td><td>'+esc(x.venue||'—')+'</td><td>'+esc(x.level||'—')+'</td></tr>').join(''):'<tr><td colspan="6" style="text-align:center;color:#64748b;padding:2rem">No matching schedules found.</td></tr>';$('eo-schedule-count').textContent=rows.length+' of '+all.length+' schedules';}async function load(){ $('eo-schedule-rows').innerHTML='<tr><td colspan="6">Loading schedules…</td></tr>';try{const r=await core.portalFetch('/api/exam-officer/schedules');all=Array.isArray(r.data)?r.data:[];const opts=new Map();all.forEach(x=>{const id=x.sessionId||x.academicSessionId,name=x.sessionName||x.academicSession?.name;if(id&&name)opts.set(String(id),name)});$('eo-schedule-session').innerHTML='<option value="">All sessions</option>'+[...opts].map(([id,name])=>'<option value="'+esc(id)+'">'+esc(name)+'</option>').join('');render()}catch(e){$('eo-schedule-rows').innerHTML='<tr><td colspan="6" style="color:#b91c1c">Could not load schedules: '+esc(e.message)+'</td></tr>';core.showToast&&core.showToast('Unable to load examination schedules','error')}}$('eo-schedule-search').addEventListener('input',render);$('eo-schedule-session').addEventListener('change',render);$('eo-schedule-refresh').addEventListener('click',load);load()})();
</script>
