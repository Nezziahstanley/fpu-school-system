<section class="eo-page eo-schedule-page">
<header class="eo-head"><div><span class="eo-eyebrow">EXAMINATIONS OFFICE</span><h2>Examination Schedules</h2><p>Approved examination timetable grouped by department, with course, venue, invigilation and session details.</p></div><button id="eo-schedule-refresh" type="button">↻ Refresh</button></header>
<div class="eo-schedule-kpis"><article><small>All schedules</small><strong id="eo-s-kpi-total">—</strong></article><article><small>Approved</small><strong id="eo-s-kpi-approved">—</strong></article><article><small>Upcoming</small><strong id="eo-s-kpi-upcoming">—</strong></article><article><small>Departments</small><strong id="eo-s-kpi-depts">—</strong></article></div>
<div class="eo-toolbar"><input id="eo-schedule-search" type="search" placeholder="Search course, code, department, venue, invigilator…" aria-label="Search schedules"><select id="eo-schedule-session" aria-label="Filter by session"><option value="">All sessions</option></select><select id="eo-schedule-dept" aria-label="Filter by department"><option value="">All departments</option></select><select id="eo-schedule-status" aria-label="Filter by approval status"><option value="">All statuses</option><option value="approved">Approved</option><option value="draft">Draft</option><option value="pending">Pending</option><option value="rejected">Rejected</option></select><select id="eo-schedule-semester" aria-label="Filter by semester"><option value="">All semesters</option><option value="first">First semester</option><option value="second">Second semester</option></select></div>
<div id="eo-schedule-groups"><div class="eo-empty">Loading examination schedules…</div></div><p class="eo-note" id="eo-schedule-count"></p>
</section>
<style>
.eo-schedule-page{color:#0f172a}.eo-eyebrow{font-size:.66rem;font-weight:850;letter-spacing:.13em;color:#047857}.eo-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.eo-head h2{font-size:1.45rem;margin:.2rem 0}.eo-head p,.eo-note{font-size:.84rem;color:#64748b;margin:.35rem 0}.eo-head button{border:0;border-radius:9px;padding:.7rem 1rem;background:#065f46;color:white;font-weight:800;cursor:pointer}.eo-toolbar{display:grid;grid-template-columns:2fr repeat(4,minmax(140px,1fr));gap:.6rem;margin-bottom:1rem}.eo-toolbar input,.eo-toolbar select{min-width:0;width:100%;box-sizing:border-box;padding:.72rem .8rem;border:1px solid #cbd5e1;border-radius:10px;background:white;color:#0f172a}.eo-schedule-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}.eo-schedule-kpis article{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:1rem;box-shadow:0 2px 8px rgba(15,23,42,.03)}.eo-schedule-kpis small{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#64748b}.eo-schedule-kpis strong{display:block;font-size:1.65rem;margin-top:.35rem;color:#0f172a}.eo-dept-group{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:1rem;overflow:hidden}.eo-dept-title{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.9rem 1rem;background:linear-gradient(90deg,#ecfdf5,#f8fafc);border-bottom:1px solid #e2e8f0}.eo-dept-title strong{font-size:.95rem}.eo-dept-title span{font-size:.72rem;color:#64748b}.eo-schedule-table-wrap{overflow:auto}.eo-schedule-table{border-collapse:collapse;width:100%;min-width:1080px;font-size:.8rem}.eo-schedule-table th,.eo-schedule-table td{padding:.75rem .8rem;text-align:left;border-bottom:1px solid #f1f5f9;vertical-align:top}.eo-schedule-table th{background:#f8fafc;color:#64748b;font-size:.65rem;text-transform:uppercase;letter-spacing:.06em}.eo-schedule-table tbody tr:hover{background:#f8fafc}.eo-status{display:inline-flex;padding:.25rem .55rem;border-radius:99px;font-size:.67rem;font-weight:850;text-transform:capitalize}.eo-status.approved{background:#dcfce7;color:#166534}.eo-status.draft,.eo-status.pending{background:#fef3c7;color:#92400e}.eo-status.rejected{background:#fee2e2;color:#991b1b}.eo-empty{padding:2rem;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;text-align:center;color:#64748b}.eo-note{margin-top:.8rem}@media(max-width:950px){.eo-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.eo-toolbar input{grid-column:1/-1}}@media(max-width:620px){.eo-schedule-kpis{grid-template-columns:repeat(2,1fr)}.eo-toolbar{grid-template-columns:1fr}.eo-toolbar input{grid-column:auto}}@media print{.eo-head button,.eo-toolbar{display:none!important}.eo-dept-group{break-inside:avoid}}
</style>
<script>
(function(){'use strict';const core=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>core.escapeHtml?core.escapeHtml(v):String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");let all=[],departments=[],sessions=[];const norm=v=>String(v||'').toLowerCase();function getParts(row){const exam=row.exam||row,course=row.course||{},department=departments.find(d=>Number(d.id)===Number(course.departmentId))||{};return{exam,course,department}}function render(){const q=norm($('eo-schedule-search').value.trim()),session=$('eo-schedule-session').value,dept=$('eo-schedule-dept').value,status=$('eo-schedule-status').value,semester=$('eo-schedule-semester').value;const rows=all.filter(row=>{const x=getParts(row),e=x.exam,c=x.course,d=x.department,sessionName=(sessions.find(z=>Number(z.id)===Number(e.sessionId))||{}).name||'';const hay=[c.code,c.title,c.level,c.semesterName,d.name,d.code,e.venue,e.invigilators,e.semester,sessionName].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!session||String(e.sessionId)===session)&&(!dept||String(c.departmentId)===dept)&&(!status||norm(e.status)===status)&&(!semester||norm(e.semester)===semester)});const groups={};rows.forEach(row=>{const d=getParts(row).department.name||'Unassigned Department';if(!groups[d])groups[d]=[];groups[d].push(row)});const names=Object.keys(groups).sort();$('eo-schedule-groups').innerHTML=names.length?names.map(name=>{const body=groups[name].map(row=>{const x=getParts(row),e=x.exam,c=x.course,sessionName=(sessions.find(z=>Number(z.id)===Number(e.sessionId))||{}).name||'—',state=norm(e.status)||'draft',date=e.examDate?new Date(e.examDate+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}):'—';return'<tr><td><strong>'+esc(date)+'</strong></td><td><strong>'+esc(c.code||'—')+'</strong><br>'+esc(c.title||'')+'</td><td>'+esc(sessionName)+'<br><small>'+esc(e.semester||'—')+' semester</small></td><td>'+esc(e.startTime||'—')+' – '+esc(e.endTime||'—')+'</td><td>'+esc(e.venue||'Venue not assigned')+'</td><td>'+esc(c.level||'—')+' / '+esc(c.unit==null?'—':c.unit)+' units</td><td>'+esc(e.invigilators||'Not assigned')+'</td><td><span class="eo-status '+esc(state)+'">'+esc(state)+'</span></td></tr>'}).join('');return'<section class="eo-dept-group"><div class="eo-dept-title"><strong>'+esc(name)+'</strong><span>'+groups[name].length+' scheduled examination(s)</span></div><div class="eo-schedule-table-wrap"><table class="eo-schedule-table"><thead><tr><th>Date</th><th>Course</th><th>Session / Semester</th><th>Time</th><th>Venue</th><th>Level / Units</th><th>Invigilators</th><th>Status</th></tr></thead><tbody>'+body+'</tbody></table></div></section>'}).join(''):'<div class="eo-empty">No examination schedules match the selected filters.</div>';$('eo-schedule-count').textContent='Showing '+rows.length+' of '+all.length+' schedules';$('eo-s-kpi-total').textContent=all.length;$('eo-s-kpi-approved').textContent=all.filter(x=>norm((x.exam||x).status)==='approved').length;$('eo-s-kpi-upcoming').textContent=all.filter(x=>{const e=x.exam||x;return e.examDate&&new Date(e.examDate+'T23:59:59')>=new Date()}).length;$('eo-s-kpi-depts').textContent=new Set(all.map(x=>(x.course||{}).departmentId).filter(Boolean)).size}async function load(){const button=$('eo-schedule-refresh');button.disabled=true;button.textContent='Loading…';$('eo-schedule-groups').innerHTML='<div class="eo-empty">Loading examination schedules…</div>';try{const pair=await Promise.all([core.portalFetch('/api/exam-officer/schedules'),core.portalFetch('/api/exam-officer/lookups')]);all=Array.isArray(pair[0].data)?pair[0].data:[];departments=Array.isArray(pair[1].departments)?pair[1].departments:[];sessions=Array.isArray(pair[1].sessions)?pair[1].sessions:[];$('eo-schedule-session').innerHTML='<option value="">All sessions</option>'+sessions.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');$('eo-schedule-dept').innerHTML='<option value="">All departments</option>'+departments.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');render()}catch(e){$('eo-schedule-groups').innerHTML='<div class="eo-empty">Unable to load schedules: '+esc(e.message)+'</div>';core.showToast&&core.showToast('Unable to load examination schedules','error')}finally{button.disabled=false;button.textContent='↻ Refresh'}}['eo-schedule-search','eo-schedule-session','eo-schedule-dept','eo-schedule-status','eo-schedule-semester'].forEach(id=>$(id).addEventListener(id==='eo-schedule-search'?'input':'change',render));$('eo-schedule-refresh').addEventListener('click',load);load()})();
</script>
