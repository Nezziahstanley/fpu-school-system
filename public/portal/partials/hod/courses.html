<style id="hod-unified-design">
#main-view,.hod-page,#main-view *{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
#main-view h1,#main-view h2,#main-view h3,#main-view h4,.hod-page h1,.hod-page h2,.hod-page h3,.hod-page h4{letter-spacing:-.025em;font-weight:750}
#main-view .page-head,#main-view .greeting,.hod-page .page-head,.hod-page .greeting{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.25rem 1.5rem;margin:0 0 1.25rem;border-radius:18px;background:linear-gradient(120deg,#064e3b 0%,#087653 58%,#10a16e 100%);box-shadow:0 12px 28px rgba(6,78,59,.13);color:#fff}
#main-view .page-head h1,#main-view .page-head h2,#main-view .greeting h1,#main-view .greeting h2,.hod-page .page-head h1,.hod-page .page-head h2,.hod-page .greeting h1,.hod-page .greeting h2{color:#fff!important;margin:0;font-size:clamp(1.2rem,2.4vw,1.65rem);line-height:1.2}
#main-view .page-head p,#main-view .greeting .sub,.hod-page .page-head p,.hod-page .greeting .sub{color:#d9f5e8!important;margin:.35rem 0 0}
#main-view .page-head .actions,#main-view .greeting .actions{display:flex;gap:.55rem;flex-wrap:wrap}
#main-view .stat-grid{gap:1rem}
#main-view .stat,#main-view .panel,#main-view .filter-bar{border-radius:14px}
#main-view .panel{overflow:hidden}
#main-view .panel-head{padding:1rem 1.15rem}
#main-view .data-table{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
#main-view .data-table th{font-size:.7rem;letter-spacing:.065em;text-transform:uppercase}
#main-view input,#main-view select,#main-view textarea,#main-view button{font:inherit}
@media(max-width:640px){#main-view .page-head,#main-view .greeting{padding:1.05rem;border-radius:14px}#main-view .page-head .actions{width:100%}}
</style>
﻿<!-- Portal → HOD → Courses -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📚</div>
    <div>
      <h1>Department Courses</h1>
      <div class="sub" id="crs-dept-sub">Manage courses and lecturer allocations in your department</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="crs-search" placeholder="Search code or title…" />
  <select id="crs-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <select id="crs-semester"><option value="">All Semesters</option><option value="first">First</option><option value="second">Second</option></select>
  <select id="crs-allocation"><option value="">All Allocation Statuses</option><option value="assigned">Assigned</option><option value="unassigned">Unassigned</option><option value="flagged">Flagged</option></select>
  <button class="btn btn-outline btn-sm" id="crs-refresh">↻ Refresh</button>
  <button class="btn btn-primary btn-sm" id="crs-export" type="button">↓ Export CSV</button>
</div>

<!-- Stats -->
<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Courses</span><span class="value" id="crs-total">—</span></div><div class="ic">📚</div></div>
  <div class="stat green"><div class="meta"><span class="label">Assigned</span><span class="value" id="crs-assigned">—</span></div><div class="ic">✓</div></div>
  <div class="stat red"><div class="meta"><span class="label">Unassigned</span><span class="value" id="crs-unassigned">—</span></div><div class="ic">!</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Flagged</span><span class="value" id="crs-flagged">—</span></div><div class="ic">⚑</div></div>
</div>
<div id="crs-result-count" style="margin:-.35rem 0 1rem;color:#64748b;font-size:.78rem;font-weight:700" aria-live="polite">Showing all courses</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Courses</h3>
    <span class="badge" id="crs-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Level</th>
            <th>Units</th>
            <th>Semester</th>
            <th>Lecturer</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="crs-tbody">
          <tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal: Assign Lecturer -->
<div id="assign-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Assign Lecturer</h3>
      <button id="assign-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <input type="hidden" id="assign-course-id" />
      <div style="margin-bottom:1rem;font-weight:700;color:#0f172a;font-size:.9rem;" id="assign-course-name"></div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Select Lecturer</label>
        <select id="assign-lecturer" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Select Lecturer…</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Semester</label>
        <select id="assign-semester" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="first">First Semester</option>
          <option value="second">Second Semester</option>
        </select>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="assign-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="assign-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Assign Course</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_COURSES = [];
  let FILTERED = [];

  function render() {
    $('crs-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('crs-tbody').innerHTML = '<tr><td colspan="7" class="empty">No courses match your filters.</td></tr>';
      return;
    }

    $('crs-tbody').innerHTML = FILTERED.map(c => {
      const code = c.code || c.courseCode || '—';
      const title = c.title || c.courseTitle || '—';
      const level = c.level || '—';
      const unit = c.unit || 0;
      const semester = c.semesterName || '—';
      const lecturer = c.lecturerName || 'unassigned';
      const isUnassigned = lecturer === 'unassigned';

      let lecturerCell = '';
      if (isUnassigned) {
        lecturerCell = `<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#fef3c7;color:#92400e;border-radius:5px;">unassigned</span>`;
      } else if (c.status === 'flagged') {
        lecturerCell = `<div><strong style="color:#991b1b;">${esc(lecturer)}</strong> <span style="display:inline-block;margin-left:.3rem;padding:2px 6px;font-size:.6rem;font-weight:800;background:#fee2e2;color:#991b1b;border-radius:4px;">FLAGGED</span></div>`;
      } else {
        lecturerCell = `<div><strong style="color:#065f46;">${esc(lecturer)}</strong> <span style="display:inline-block;margin-left:.3rem;padding:2px 6px;font-size:.6rem;font-weight:800;background:#d1fae5;color:#065f46;border-radius:4px;">ASSIGNED</span></div>`;
      }

      return `
        <tr>
          <td><strong>${esc(code)}</strong></td>
          <td>${esc(title)}</td>
          <td style="text-align:center;"><span class="chip chip-${String(level).toLowerCase()}">${esc(level)}</span></td>
          <td style="text-align:center;">${unit}</td>
          <td style="text-align:center;">${esc(semester)}</td>
          <td>${lecturerCell}</td>
          <td>
            <button class="btn btn-primary btn-sm btn-assign" 
              data-id="${c.id}" 
              data-code="${esc(code)}" 
              data-title="${esc(title)}" 
              data-lecturer-id="${c.lecturerId || ''}"
              style="background:#065f46;color:#fff;border:none;border-radius:6px;padding:.35rem .7rem;font-size:.72rem;font-weight:700;cursor:pointer;">
              ${c.lecturerId ? 'Reassign' : 'Assign'}
            </button>
          </td>
        </tr>`;
    }).join('');

    $('crs-tbody').querySelectorAll('.btn-assign').forEach(btn => {
      btn.addEventListener('click', () => openAssignModal(
        btn.dataset.id, 
        btn.dataset.code, 
        btn.dataset.title, 
        btn.dataset.lecturerId
      ));
    });
  }

  function applyFilter() {
    const q = ($('crs-search').value || '').trim().toLowerCase();
    const lvl = $('crs-level').value;
    const sem = $('crs-semester').value;
    const allocation = $('crs-allocation').value;

    FILTERED = ALL_COURSES.filter(c => {
      const code = c.code || c.courseCode || '';
      const title = c.title || c.courseTitle || '';
      const level = c.level || '';
      const semester = c.semesterName || '';
      
      const hay = `${code} ${title} ${c.lecturerName || ''} ${c.flagReason || ''} ${c.status || ''}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && level.toUpperCase() !== lvl) return false;
      if (sem && semester.toLowerCase() !== sem) return false;
      if (allocation === 'assigned' && (!c.lecturerId || c.status === 'flagged')) return false;
      if (allocation === 'unassigned' && c.lecturerId) return false;
      if (allocation === 'flagged' && c.status !== 'flagged') return false;
      return true;
    });
    render();
    $('crs-result-count').textContent = 'Showing ' + FILTERED.length + ' of ' + ALL_COURSES.length + ' course allocation rows';
  }

  function updateStats() {
    const byCourse = new Map();
    ALL_COURSES.forEach(row => {
      const key=String(row.id);
      const state=!row.lecturerId?'unassigned':row.status==='flagged'?'flagged':'assigned';
      const old=byCourse.get(key);
      if (!old || (old==='unassigned' && state!=='unassigned') || (old==='assigned' && state==='flagged')) byCourse.set(key,state);
    });
    $('crs-total').textContent=byCourse.size;
    $('crs-assigned').textContent=[...byCourse.values()].filter(x=>x==='assigned').length;
    $('crs-unassigned').textContent=[...byCourse.values()].filter(x=>x==='unassigned').length;
    $('crs-flagged').textContent=[...byCourse.values()].filter(x=>x==='flagged').length;
  }

  function exportCsv() {
    if (!FILTERED.length) { core.showToast && core.showToast('No courses match the current filters.','warning'); return; }
    const columns=['Course Code','Course Title','Level','Units','Semester','Lecturer','Allocation Status','Flag Reason'];
    const cell=value=>{let v=String(value==null?'':value);if(/^\s*[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
    const rows=[columns,...FILTERED.map(row=>[row.code||row.courseCode,row.title||row.courseTitle,row.level,row.unit,row.semesterName,row.lecturerName||'Unassigned',row.status||'Unassigned',row.flagReason])];
    const csv='\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='hod-department-courses.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }

  async function load() {
    $('crs-tbody').innerHTML = '<tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/hod/courses-with-allocations');
      ALL_COURSES = Array.isArray(res.data) ? res.data : [];
      updateStats();
      applyFilter();
      try { const dash=await core.portalFetch('/api/hod/dashboard'); if(dash?.data?.departmentName) $('crs-dept-sub').textContent='Courses and lecturer allocations for '+dash.data.departmentName; } catch (_) {}
    } catch (err) {
      $('crs-tbody').innerHTML = `<tr><td colspan="7" class="empty">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  async function openAssignModal(courseId, code, title, currentLecturerId) {
    $('assign-modal').style.display = 'flex';
    $('assign-course-id').value = courseId;
    $('assign-course-name').textContent = code + ' — ' + title;
    $('assign-lecturer').innerHTML = '<option value="">Loading…</option>';

    try {
      const res = await core.portalFetch('/api/hod/lecturers');
      const lecturers = res.data || [];

      if (!lecturers.length) {
        $('assign-lecturer').innerHTML = '<option value="">No lecturers in department</option>';
        return;
      }

      $('assign-lecturer').innerHTML = '<option value="">Select Lecturer…</option>' + 
        lecturers.map(l => `<option value="${l.id}" ${String(l.id) === String(currentLecturerId) ? 'selected' : ''}>${esc(l.firstName)} ${esc(l.lastName)}</option>`).join('');
    } catch (err) {
      $('assign-lecturer').innerHTML = '<option value="">Error loading lecturers</option>';
    }
  }

  function closeAssignModal() {
    $('assign-modal').style.display = 'none';
  }

  async function saveAssignment() {
    const courseId = $('assign-course-id').value;
    const lecturerId = $('assign-lecturer').value;
    const semester = $('assign-semester').value;

    if (!lecturerId) return core.showToast && core.showToast('Please select a lecturer.', 'warning');

    const btn = $('assign-save');
    btn.disabled = true;
    btn.textContent = 'Assigning…';

    try {
      await core.portalFetch('/api/hod/allocate', {
        method: 'POST',
        body: { courseId: Number(courseId), lecturerId: Number(lecturerId), semester }
      });
      core.showToast && core.showToast('Course assigned successfully!', 'success');
      closeAssignModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Assign Course';
    }
  }

  $('crs-search')?.addEventListener('input', applyFilter);
  $('crs-level')?.addEventListener('change', applyFilter);
  $('crs-semester')?.addEventListener('change', applyFilter);
  $('crs-allocation')?.addEventListener('change', applyFilter);
  $('crs-refresh')?.addEventListener('click', load);
  $('crs-export')?.addEventListener('click', exportCsv);
  $('assign-close')?.addEventListener('click', closeAssignModal);
  $('assign-cancel')?.addEventListener('click', closeAssignModal);
  $('assign-save')?.addEventListener('click', saveAssignment);
  $('assign-modal')?.addEventListener('click', (e) => { if (e.target.id === 'assign-modal') closeAssignModal(); });

  load();
})();
</script>
