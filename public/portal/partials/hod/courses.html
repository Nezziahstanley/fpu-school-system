<!-- Portal → HOD → Courses (with lecturer assignment) -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📚</div>
    <div>
      <h1>Department Courses</h1>
      <div class="sub">Assign lecturers to each course</div>
    </div>
  </div>
</section>

<style>
  .hc-toolbar { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .hc-toolbar input[type="search"] { flex: 1 1 220px; min-width: 180px; padding: .55rem .75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: .88rem; }
  .hc-toolbar select { padding: .55rem .6rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: .88rem; background: #fff; }
  .hc-chip { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .68rem; font-weight: 700; letter-spacing: .04em; }
  .hc-chip.assigned  { background: #d1fae5; color: #065f46; }
  .hc-chip.unassigned{ background: #fef3c7; color: #92400e; }
  .hc-chip.nd        { background: #dbeafe; color: #1e40af; }
  .hc-chip.hnd       { background: #fef3c7; color: #b45309; }
  .hc-empty { padding: 2.5rem 1rem; text-align: center; color: #94a3b8; }

  #hc-modal { position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 9999; display: none; align-items: center; justify-content: center; padding: 1rem; }
  #hc-modal.open { display: flex; }
  #hc-modal > div { background: #fff; border-radius: 14px; max-width: 560px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,.3); }
</style>

<div class="hc-toolbar">
  <input type="search" id="hc-search" placeholder="Search code or title…" />
  <select id="hc-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <select id="hc-status">
    <option value="">All</option>
    <option value="assigned">Assigned</option>
    <option value="unassigned">Unassigned</option>
  </select>
  <button class="btn btn-outline btn-sm" id="hc-refresh">↻ Refresh</button>
</div>

<section class="panel">
  <div class="panel-head">
    <h3 style="margin:0;">Courses</h3>
    <span class="badge" id="hc-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Level</th>
            <th>Units</th>
            <th>Semester</th>
            <th>Lecturer</th>
            <th style="width:180px;">Actions</th>
          </tr>
        </thead>
        <tbody id="hc-tbody">
          <tr><td colspan="7" class="hc-empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Assign modal -->
<div id="hc-modal" role="dialog" aria-modal="true">
  <div>
    <div style="padding:1rem 1.25rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;font-size:1.05rem;" id="hc-modal-title">Assign Lecturer</h3>
      <button type="button" id="hc-modal-close" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;width:30px;height:30px;border-radius:6px;">✕</button>
    </div>
    <div style="padding:1.25rem;">
      <p class="muted small" id="hc-modal-sub" style="margin:0 0 .85rem;"></p>
      <label style="display:block;font-weight:600;font-size:.82rem;color:#334155;margin-bottom:.35rem;">Lecturer *</label>
      <select id="hc-lecturer" style="width:100%;padding:.6rem .75rem;font-size:.88rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;margin-bottom:.85rem;">
        <option value="">— Select —</option>
      </select>
      <label style="display:block;font-weight:600;font-size:.82rem;color:#334155;margin-bottom:.35rem;">Semester *</label>
      <select id="hc-semester" style="width:100%;padding:.6rem .75rem;font-size:.88rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;margin-bottom:1rem;">
        <option value="first">First Semester</option>
        <option value="second">Second Semester</option>
      </select>
      <div style="display:flex;gap:.5rem;justify-content:flex-end;">
        <button type="button" id="hc-modal-cancel" class="btn btn-outline btn-sm">Cancel</button>
        <button type="button" id="hc-modal-save" class="btn btn-primary btn-sm">Assign</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var core = window.FPU_PORTAL || {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s); };

  var ALL = [];
  var LECTURERS = [];
  var CURRENT = null;   // the course being assigned

  function levelChip(l) {
    var v = String(l || '').toUpperCase();
    var cls = v === 'HND' ? 'hnd' : 'nd';
    return '<span class="hc-chip ' + cls + '">' + esc(v || '—') + '</span>';
  }

  function render() {
    var tbody = $('hc-tbody');
    var count = $('hc-count');
    var q = ($('hc-search').value || '').trim().toLowerCase();
    var lvl = $('hc-level').value;
    var st = $('hc-status').value;

    var rows = ALL.filter(function (r) {
      var c = r.course || {};
      var hay = ((c.code || '') + ' ' + (c.title || '')).toLowerCase();
      if (q && hay.indexOf(q) < 0) return false;
      if (lvl && String(c.level || '').toUpperCase() !== lvl) return false;
      if (st === 'assigned' && !(r.lecturer && r.lecturer.id)) return false;
      if (st === 'unassigned' && (r.lecturer && r.lecturer.id)) return false;
      return true;
    });

    count.textContent = rows.length;

    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="hc-empty">No courses match your filters.</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map(function (r) {
      var c = r.course || {};
      var a = r.allocation || {};
      var l = r.lecturer || {};
      var assigned = l && l.id;
      var lecturerCell = assigned
        ? '<strong>' + esc([l.firstName, l.lastName].filter(Boolean).join(' ')) + '</strong>'
          + '<div class="muted small" style="font-size:.72rem;">' + esc(l.email || '') + '</div>'
        : '<span class="hc-chip unassigned">unassigned</span>';

      var actions = assigned
        ? '<button class="btn btn-outline btn-sm" data-act="reassign" data-id="' + esc(c.id) + '" data-alloc="' + esc(a.id) + '">Reassign</button> '
          + '<button class="btn btn-ghost btn-sm" data-act="unassign" data-alloc="' + esc(a.id) + '" style="color:#dc2626;">Unassign</button>'
        : '<button class="btn btn-primary btn-sm" data-act="assign" data-id="' + esc(c.id) + '">Assign</button>';

      return '<tr>'
        + '<td><strong>' + esc(c.code) + '</strong></td>'
        + '<td>' + esc(c.title) + '</td>'
        + '<td>' + levelChip(c.level) + '</td>'
        + '<td>' + (c.unit || 0) + '</td>'
        + '<td>' + esc(a.semester || c.semesterName || '—') + '</td>'
        + '<td>' + lecturerCell + '</td>'
        + '<td>' + actions + '</td>'
        + '</tr>';
    }).join('');

    // Wire actions
    tbody.querySelectorAll('button[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.dataset.act;
        if (act === 'assign' || act === 'reassign') openAssign(b.dataset.id);
        if (act === 'unassign') unassign(b.dataset.alloc);
      });
    });
  }

  async function load() {
    $('hc-tbody').innerHTML = '<tr><td colspan="7" class="hc-empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      var res = await core.portalFetch('/api/hod/courses-with-allocations');
      ALL = (res && res.data) || [];
      render();
    } catch (err) {
      $('hc-tbody').innerHTML = '<tr><td colspan="7" class="hc-empty">' + esc(err.message) + '</td></tr>';
    }
  }

  async function loadLecturers() {
    try {
      var res = await core.portalFetch('/api/hod/lecturers');
      LECTURERS = (res && res.data) || [];
    } catch (e) {
      LECTURERS = [];
    }
  }

  function openAssign(courseId) {
    var course = ALL.find(function (r) { return String((r.course || {}).id) === String(courseId); });
    if (!course) return;
    CURRENT = course;

    $('hc-modal-title').textContent = course.lecturer && course.lecturer.id ? 'Reassign Lecturer' : 'Assign Lecturer';
    var c = course.course || {};
    $('hc-modal-sub').textContent = c.code + ' — ' + c.title + ' (' + (c.unit || 0) + ' units)';

    // Fill lecturer dropdown
    var sel = $('hc-lecturer');
    sel.innerHTML = '<option value="">— Select —</option>'
      + LECTURERS.map(function (l) {
        var n = [l.firstName, l.lastName].filter(Boolean).join(' ');
        return '<option value="' + esc(l.id) + '">' + esc(n || l.email || ('User #' + l.id)) + '</option>';
      }).join('');

    // Preselect if reassigning
    if (course.lecturer && course.lecturer.id) {
      sel.value = String(course.lecturer.id);
    }

    // Preselect semester
    var semester = (course.allocation && course.allocation.semester) || c.semesterName || 'first';
    $('hc-semester').value = String(semester).toLowerCase() === 'second' ? 'second' : 'first';

    $('hc-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    $('hc-modal').classList.remove('open');
    document.body.style.overflow = '';
    CURRENT = null;
  }

  async function saveAssign() {
    if (!CURRENT) return;
    var lecturerId = $('hc-lecturer').value;
    var semester = $('hc-semester').value;
    if (!lecturerId) { core.showToast && core.showToast('Select a lecturer.', 'warning'); return; }

    var courseId = (CURRENT.course || {}).id;
    var btn = $('hc-modal-save');
    btn.disabled = true;
    var prev = btn.textContent;
    btn.textContent = 'Saving…';
    try {
      // If reassigning, remove the old allocation first
      if (CURRENT.allocation && CURRENT.allocation.id) {
        try {
          await core.portalFetch('/api/hod/allocate/' + CURRENT.allocation.id, { method: 'DELETE' });
        } catch (e) { /* ignore */ }
      }
      await core.portalFetch('/api/hod/allocate', {
        method: 'POST',
        body: { courseId: Number(courseId), lecturerId: Number(lecturerId), semester: semester },
      });
      core.showToast && core.showToast('Lecturer assigned.', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  }

  async function unassign(allocId) {
    if (!allocId) return;
    if (!confirm('Remove the lecturer assignment for this course?')) return;
    try {
      await core.portalFetch('/api/hod/allocate/' + allocId, { method: 'DELETE' });
      core.showToast && core.showToast('Assignment removed.', 'warning');
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  }

  // Wire
  $('hc-search').addEventListener('input', render);
  $('hc-level').addEventListener('change', render);
  $('hc-status').addEventListener('change', render);
  $('hc-refresh').addEventListener('click', load);
  $('hc-modal-close').addEventListener('click', closeModal);
  $('hc-modal-cancel').addEventListener('click', closeModal);
  $('hc-modal-save').addEventListener('click', saveAssign);
  $('hc-modal').addEventListener('click', function (e) {
    if (e.target.id === 'hc-modal') closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('hc-modal').classList.contains('open')) closeModal();
  });

  // Boot
  (async function init() {
    await loadLecturers();
    await load();
  })();
})();
</script>
