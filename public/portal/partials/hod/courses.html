<!-- Portal → HOD → Courses -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📚</div>
    <div>
      <h1>Department Courses</h1>
      <div class="sub">Assign lecturers to each course</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="crs-search" placeholder="Search code or title…" />
  <select id="crs-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <select id="crs-semester">
    <option value="">All Semesters</option>
    <option value="first">First</option>
    <option value="second">Second</option>
  </select>
  <button class="btn btn-outline btn-sm" id="crs-refresh">↻ Refresh</button>
</div>

<!-- Stats -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta"><span class="label">Total Courses</span><span class="value" id="crs-total">—</span></div>
    <div class="ic">📚</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Courses</h3>
    <span class="badge" id="crs-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Level</th>
            <th>Units</th>
            <th>Semester</th>
            <th>Lecturer</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="crs-tbody">
          <tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Modal: Assign Lecturer -->
<div id="assign-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Assign Lecturer</h3>
      <button id="assign-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <input type="hidden" id="assign-course-id" />
      <div style="margin-bottom:1rem;font-weight:700;color:#0f172a;font-size:.9rem;" id="assign-course-name"></div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Select Lecturer</label>
        <select id="assign-lecturer" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Select Lecturer…</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Semester</label>
        <select id="assign-semester" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="first">First Semester</option>
          <option value="second">Second Semester</option>
        </select>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="assign-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="assign-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Assign Course</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_COURSES = [];
  let FILTERED = [];

  function render() {
    $('crs-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('crs-tbody').innerHTML = '<tr><td colspan="7" class="empty">No courses match your filters.</td></tr>';
      return;
    }

    $('crs-tbody').innerHTML = FILTERED.map(c => {
      // Ensure we handle both 'code' or 'courseCode'
      const code = c.code || c.courseCode || '—';
      const title = c.title || c.courseTitle || '—';
      const level = c.level || '—';
      const unit = c.unit || 0;
      const semester = c.semesterName || '—';
      const lecturer = c.lecturerName || 'unassigned';
      const isUnassigned = lecturer === 'unassigned';

      return `
        <tr>
          <td><strong>${esc(code)}</strong></td>
          <td>${esc(title)}</td>
          <td style="text-align:center;"><span class="chip chip-${String(level).toLowerCase()}">${esc(level)}</span></td>
          <td style="text-align:center;">${unit}</td>
          <td style="text-align:center;">${esc(semester)}</td>
          <td>
            ${isUnassigned 
              ? `<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#fef3c7;color:#92400e;border-radius:5px;">unassigned</span>`
              : `<strong style="color:#065f46;">${esc(lecturer)}</strong>`
            }
          </td>
          <td>
            <button class="btn btn-primary btn-sm btn-assign" 
              data-id="${c.id}" 
              data-code="${esc(code)}" 
              data-title="${esc(title)}" 
              data-lecturer-id="${c.lecturerId || ''}"
              style="background:#065f46;color:#fff;border:none;border-radius:6px;padding:.35rem .7rem;font-size:.72rem;font-weight:700;cursor:pointer;">
              Assign
            </button>
          </td>
        </tr>`;
    }).join('');

    $('crs-tbody').querySelectorAll('.btn-assign').forEach(btn => {
      btn.addEventListener('click', () => openAssignModal(
        btn.dataset.id, 
        btn.dataset.code, 
        btn.dataset.title, 
        btn.dataset.lecturerId
      ));
    });
  }

  function applyFilter() {
    const q = ($('crs-search').value || '').trim().toLowerCase();
    const lvl = $('crs-level').value;
    const sem = $('crs-semester').value;

    FILTERED = ALL_COURSES.filter(c => {
      const code = c.code || c.courseCode || '';
      const title = c.title || c.courseTitle || '';
      const level = c.level || '';
      const semester = c.semesterName || '';
      
      const hay = `${code} ${title}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && level.toUpperCase() !== lvl) return false;
      if (sem && semester.toLowerCase() !== sem) return false;
      return true;
    });
    render();
  }

  async function load() {
    $('crs-tbody').innerHTML = '<tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/hod/courses-with-allocations');
      ALL_COURSES = res.data || [];
      
      $('crs-total').textContent = ALL_COURSES.length;
      applyFilter();
    } catch (err) {
      $('crs-tbody').innerHTML = `<tr><td colspan="7" class="empty">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  async function openAssignModal(courseId, code, title, currentLecturerId) {
    $('assign-modal').style.display = 'flex';
    $('assign-course-id').value = courseId;
    $('assign-course-name').textContent = code + ' — ' + title;
    $('assign-lecturer').innerHTML = '<option value="">Loading…</option>';

    try {
      const res = await core.portalFetch('/api/hod/lecturers');
      const lecturers = res.data || [];

      if (!lecturers.length) {
        $('assign-lecturer').innerHTML = '<option value="">No lecturers in department</option>';
        return;
      }

      $('assign-lecturer').innerHTML = '<option value="">Select Lecturer…</option>' + 
        lecturers.map(l => `<option value="${l.id}" ${String(l.id) === String(currentLecturerId) ? 'selected' : ''}>${esc(l.firstName)} ${esc(l.lastName)}</option>`).join('');
    } catch (err) {
      $('assign-lecturer').innerHTML = '<option value="">Error loading lecturers</option>';
    }
  }

  function closeAssignModal() {
    $('assign-modal').style.display = 'none';
  }

  async function saveAssignment() {
    const courseId = $('assign-course-id').value;
    const lecturerId = $('assign-lecturer').value;
    const semester = $('assign-semester').value;

    if (!lecturerId) return core.showToast && core.showToast('Please select a lecturer.', 'warning');

    const btn = $('assign-save');
    btn.disabled = true;
    btn.textContent = 'Assigning…';

    try {
      // This route already exists in your routes/portal/hod.js
      await core.portalFetch('/api/hod/allocate', {
        method: 'POST',
        body: { courseId: Number(courseId), lecturerId: Number(lecturerId), semester }
      });
      core.showToast && core.showToast('Course assigned successfully!', 'success');
      closeAssignModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Assign Course';
    }
  }

  $('crs-search')?.addEventListener('input', applyFilter);
  $('crs-level')?.addEventListener('change', applyFilter);
  $('crs-semester')?.addEventListener('change', applyFilter);
  $('crs-refresh')?.addEventListener('click', load);
  $('assign-close')?.addEventListener('click', closeAssignModal);
  $('assign-cancel')?.addEventListener('click', closeAssignModal);
  $('assign-save')?.addEventListener('click', saveAssignment);
  $('assign-modal')?.addEventListener('click', (e) => { if (e.target.id === 'assign-modal') closeAssignModal(); });

  load();
})();
</script>
