<!-- Portal → HOD → Courses -->
<section class="greeting">
  <div class="who">
    <div class="avatar">C</div>
    <div>
      <h1>Department Courses</h1>
      <div class="sub" id="c-dept-sub">All courses in your department</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="c-search" placeholder="Search code, title, or lecturer…" />
  <select id="c-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <select id="c-semester">
    <option value="">All Semesters</option>
    <option>First</option>
    <option>Second</option>
  </select>
  <button class="btn btn-outline btn-sm" id="c-export">Export CSV</button>
</div>

<!-- Stats row -->
<div class="stat-grid" style="grid-template-columns: repeat(4, 1fr);">
  <div class="stat">
    <div class="meta"><span class="label">Total Courses</span><span class="value" id="c-total">—</span></div>
    <div class="ic">📚</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">ND Courses</span><span class="value" id="c-nd">—</span></div>
    <div class="ic">📘</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">HND Courses</span><span class="value" id="c-hnd">—</span></div>
    <div class="ic">📗</div>
  </div>
  <div class="stat purple">
    <div class="meta"><span class="label">Total Units</span><span class="value" id="c-units">—</span></div>
    <div class="ic">🎯</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Courses</h3>
    <span class="badge" id="c-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Code</th>
            <th>Title</th>
            <th>Units</th>
            <th>Level</th>
            <th>Semester</th>
            <th>Lecturer</th>
            <th>Enrolled</th>
          </tr>
        </thead>
        <tbody id="c-tbody">
          <tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const deptId = user.departmentId;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  if (user.departmentName) {
    const el = $('c-dept-sub');
    if (el) el.textContent = `All courses in ${user.departmentName}`;
  }

  // ---------------------------------------------------------
  // Field extractors — matched to YOUR schema
  // ---------------------------------------------------------
  // Schema: { code, title, unit (singular), level ('ND'|'HND'),
  //           semesterName ('First'|'Second'), lecturerName? }
  // ---------------------------------------------------------
  function getUnits(c) {
    return Number(c.unit ?? c.units ?? c.creditUnits ?? 0) || 0;
  }
  function getLevel(c) {
    return String(c.level || '').toUpperCase().trim() || '—';
  }
  function getSemester(c) {
    return c.semesterName || c.semester || '—';
  }
  function getLecturer(c) {
    return c.lecturerName || c.lecturer_name || (c.lecturer && c.lecturer.name) || '—';
  }
  function getEnrolled(c) {
    return c.enrolledCount != null ? c.enrolledCount : (c.enrolled != null ? c.enrolled : '—');
  }

  // ---------------------------------------------------------
  // Render
  // ---------------------------------------------------------
  function render() {
    $('c-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('c-tbody').innerHTML =
        '<tr><td colspan="7" class="empty">No courses match your filters.</td></tr>';
      return;
    }

    $('c-tbody').innerHTML = FILTERED.map((c) => {
      const level = getLevel(c);
      const chipClass = 'chip-' + level.toLowerCase();
      return `
        <tr>
          <td><strong>${esc(c.code || '')}</strong></td>
          <td>${esc(c.title || '')}</td>
          <td>${getUnits(c) || '—'}</td>
          <td><span class="chip ${chipClass}">${esc(level)}</span></td>
          <td>${esc(getSemester(c))}</td>
          <td>${esc(getLecturer(c))}</td>
          <td>${getEnrolled(c)}</td>
        </tr>`;
    }).join('');
  }

  // ---------------------------------------------------------
  // Filters
  // ---------------------------------------------------------
  function applyFilter() {
    const q = ($('c-search').value || '').trim().toLowerCase();
    const lvl = $('c-level').value;
    const sem = $('c-semester').value;

    FILTERED = ALL.filter((c) => {
      const hay = `${c.code || ''} ${c.title || ''} ${getLecturer(c)}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && getLevel(c) !== lvl.toUpperCase()) return false;
      if (sem && String(getSemester(c)).toLowerCase() !== sem.toLowerCase()) return false;
      return true;
    });

    render();
  }

  // ---------------------------------------------------------
  // Stats
  // ---------------------------------------------------------
  function updateStats() {
    const total = ALL.length;
    const nd = ALL.filter((c) => getLevel(c) === 'ND').length;
    const hnd = ALL.filter((c) => getLevel(c) === 'HND').length;
    const units = ALL.reduce((sum, c) => sum + getUnits(c), 0);

    $('c-total').textContent = total;
    $('c-nd').textContent = nd;
    $('c-hnd').textContent = hnd;
    $('c-units').textContent = units;
  }

  // ---------------------------------------------------------
  // Load
  // ---------------------------------------------------------
  async function load() {
    try {
      const res = await core.portalFetch('/api/courses?departmentId=' + deptId);
      const payload = res.data || res || {};
      ALL = Array.isArray(payload)
        ? payload
        : (payload.rows || payload.courses || []);

      console.log('[hod-courses] Loaded', ALL.length, 'courses. Sample:', ALL[0]);

      updateStats();
      applyFilter();
    } catch (err) {
      console.error('[hod-courses]', err);
      $('c-tbody').innerHTML =
        `<tr><td colspan="7" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  // ---------------------------------------------------------
  // Export CSV
  // ---------------------------------------------------------
  function exportCsv() {
    const headers = ['Code', 'Title', 'Units', 'Level', 'Semester', 'Lecturer', 'Enrolled'];
    const rows = FILTERED.map((c) => [
      c.code || '',
      c.title || '',
      getUnits(c),
      getLevel(c),
      getSemester(c),
      getLecturer(c),
      getEnrolled(c) === '—' ? '' : getEnrolled(c),
    ]);

    const csv = [headers, ...rows]
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
      .join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hod-courses-${(user.departmentCode || 'dept')}-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('c-search').addEventListener('input', applyFilter);
  $('c-level').addEventListener('change', applyFilter);
  $('c-semester').addEventListener('change', applyFilter);
  $('c-export').addEventListener('click', exportCsv);

  load();
})();
</script>
