<!-- Portal → HOD → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="hod-dash-avatar">H</div>
    <div>
      <h1>Welcome, <span id="hod-dash-name">HOD</span></h1>
      <div class="sub">Head of Department</div>
    </div>
  </div>
  <div class="meta">
    <strong id="hod-dash-dept">—</strong>
    <span>Department</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile"><div class="tile-label">Department Students</div><div class="tile-value" id="hod-t-students">—</div></div>
  <div class="tile tile-blue"><div class="tile-label">Department Staff</div><div class="tile-value" id="hod-t-staff">—</div></div>
  <div class="tile tile-accent"><div class="tile-label">Pending Results</div><div class="tile-value" id="hod-t-pending">—</div></div>
  <div class="tile tile-purple"><div class="tile-label">Active Courses</div><div class="tile-value" id="hod-t-courses">—</div></div>
</div>

<div class="quick-actions">
  <a class="btn btn-primary btn-sm" href="#hod-pending-results">📋 Review Pending Results</a>
  <a class="btn btn-outline btn-sm" href="#hod-staff">👥 Staff</a>
  <a class="btn btn-outline btn-sm" href="#hod-students">🎓 Students</a>
  <a class="btn btn-outline btn-sm" href="#hod-courses">📚 Courses</a>
</div>

<div class="panel">
  <div class="panel-head"><h3>Results Awaiting HOD Approval</h3></div>
  <div class="panel-body">
    <div id="hod-pending-list" class="muted small">Loading…</div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Department Staff</h3></div>
  <div class="panel-body">
    <div id="hod-staff-list" class="muted small">Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    const user = core.getPortalUser() || {};
    try {
      document.getElementById('hod-dash-name').textContent = user.firstName || 'HOD';
      document.getElementById('hod-dash-dept').textContent = user.departmentName || 'My Department';
      if (photo) photo.renderMyAvatar(document.getElementById('hod-dash-avatar'), user);

      // Pending results for the department (HOD approval stage)
      const r1 = await core.portalFetch('/api/results/pending-hod');
      const pending = r1.data || r1 || [];
      document.getElementById('hod-t-pending').textContent = pending.length;
      document.getElementById('hod-pending-list').innerHTML = pending.length
        ? pending.slice(0,5).map(p =>
            `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
               <strong>${p.courseCode||''}</strong> — ${p.courseTitle||''}
               <span class="muted small">· ${p.lecturerName||''} · ${p.sessionName||''}</span>
             </div>`).join('')
        : '<em>No pending results. 🎉</em>';

      // Department students
      try {
        const s = await core.portalFetch('/api/students?departmentId=' + (user.departmentId || ''));
        const list = s.data || s || [];
        document.getElementById('hod-t-students').textContent = list.length;
      } catch { document.getElementById('hod-t-students').textContent = '—'; }

      // Staff in department
      try {
        const st = await core.portalFetch('/api/staff?departmentId=' + (user.departmentId || ''));
        const list = st.data || st || [];
        document.getElementById('hod-t-staff').textContent = list.length;
        document.getElementById('hod-staff-list').innerHTML = list.length
          ? list.slice(0,8).map(x =>
              `<div style="padding:.4rem 0;">${x.firstName||''} ${x.lastName||''} <span class="muted small">· ${x.role||''}</span></div>`
            ).join('')
          : '<em>No staff records yet.</em>';
      } catch {
        document.getElementById('hod-t-staff').textContent = '—';
        document.getElementById('hod-staff-list').innerHTML = '<em>Could not load staff.</em>';
      }

      // Active courses in department
      try {
        const c = await core.portalFetch('/api/courses?departmentId=' + (user.departmentId || ''));
        const list = c.data || c || [];
        document.getElementById('hod-t-courses').textContent = list.length;
      } catch { document.getElementById('hod-t-courses').textContent = '—'; }
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  })();
</script>
