<!-- Portal → HOD → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="hod-dash-avatar">H</div>
    <div>
      <h1>Welcome, <span id="hod-dash-name">HOD</span></h1>
      <div class="sub" id="hod-dash-dept">—</div>
    </div>
  </div>
  <div class="meta">
    <strong id="hod-dash-session">—</strong>
    <span>Current Session</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/></svg></div>
    <div class="tile-label">Department Courses</div>
    <div class="tile-value" id="hod-dash-courses">—</div>
    <div class="tile-sub">total courses</div>
  </div>
  <div class="tile tile-accent">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="2" width="10" height="4" rx="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/></svg></div>
    <div class="tile-label">Pending Results</div>
    <div class="tile-value" id="hod-dash-pending">—</div>
    <div class="tile-sub">awaiting HOD verification</div>
  </div>
  <div class="tile tile-blue">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 21v-1a6 6 0 0 1 12 0v1"/></svg></div>
    <div class="tile-label">Students</div>
    <div class="tile-value" id="hod-dash-students">—</div>
    <div class="tile-sub">in department</div>
  </div>
  <div class="tile tile-purple">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg></div>
    <div class="tile-label">Staff</div>
    <div class="tile-value" id="hod-dash-staff">—</div>
    <div class="tile-sub">lecturers + self</div>
  </div>
</div>

<div class="quick-actions">
  <a onclick="FPU_SPA.navigatePortal('hod-pending-results')">Verify Results</a>
  <a onclick="FPU_SPA.navigatePortal('hod-courses')">View Courses</a>
  <a onclick="FPU_SPA.navigatePortal('hod-students')">View Students</a>
  <a onclick="FPU_SPA.navigatePortal('hod-staff')">View Staff</a>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    try {
      const res = await core.portalFetch('/api/hod/dashboard');
      const d = res.data || {};
      document.getElementById('hod-dash-name').textContent = core.getPortalUser()?.firstName || 'HOD';
      document.getElementById('hod-dash-dept').textContent = d.department?.name || '—';
      document.getElementById('hod-dash-session').textContent = (core.getPortalUser()?.currentSessionId) ? '—' : '—';

      if (photo) photo.renderMyAvatar(document.getElementById('hod-dash-avatar'), core.getPortalUser());

      document.getElementById('hod-dash-courses').textContent = d.totalCourses ?? 0;
      document.getElementById('hod-dash-pending').textContent = d.pendingResults ?? 0;
      document.getElementById('hod-dash-students').textContent = d.totalStudents ?? 0;
      document.getElementById('hod-dash-staff').textContent = d.totalStaff ?? 0;
    } catch (err) { core.showToast(err.message, 'error'); }
  })();
</script>
