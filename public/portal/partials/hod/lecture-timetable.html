<!-- Portal → HOD → Lecture Timetable -->
<div style="padding:0;">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Lecture Timetable</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Manage your department's weekly lecture schedule</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="tt-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
      <button id="tt-add-slot" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">+ Add Slot</button>
      <button id="tt-submit" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#10b981;color:#fff;border:none;border-radius:8px;cursor:pointer;">📤 Submit for Approval</button>
    </div>
  </div>

  <!-- Filters -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;margin-bottom:1.25rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;">
    <div>
      <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:.35rem;">Session</label>
      <select id="tt-session" style="padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;min-width:180px;">
        <option value="">Loading sessions...</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:.35rem;">Semester</label>
      <select id="tt-semester" style="padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;min-width:160px;">
        <option value="first">First Semester</option>
        <option value="second">Second Semester</option>
      </select>
    </div>
  </div>

  <!-- Stats -->
  <div class="stat-grid" style="margin-bottom:1.25rem;">
    <div class="stat">
      <div class="meta"><span class="label">Total Slots</span><span class="value" id="tt-stat-total">—</span></div>
      <div class="ic">📅</div>
    </div>
    <div class="stat accent">
      <div class="meta"><span class="label">Drafts</span><span class="value" id="tt-stat-draft">—</span></div>
      <div class="ic">📝</div>
    </div>
    <div class="stat blue">
      <div class="meta"><span class="label">Pending Approval</span><span class="value" id="tt-stat-pending">—</span></div>
      <div class="ic">⏳</div>
    </div>
    <div class="stat" style="border-left:4px solid #10b981;">
      <div class="meta"><span class="label">Approved</span><span class="value" id="tt-stat-approved">—</span></div>
      <div class="ic">✅</div>
    </div>
  </div>

  <!-- Table -->
  <section class="panel">
    <div class="panel-head">
      <h3>Your Timetable Slots</h3>
      <span class="badge" id="tt-count">0</span>
    </div>
    <div class="panel-body flush">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Course</th>
              <th>Day</th>
              <th>Time</th>
              <th>Venue</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tt-tbody">
            <tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

</div>

<!-- Modal: Add Slot -->
<div id="add-slot-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Add Timetable Slot</h3>
      <button id="add-slot-close" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>
    <div style="padding:1.25rem;">
      
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Course <span style="color:#dc2626;">*</span></label>
        <select id="slot-course" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Loading courses...</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Day <span style="color:#dc2626;">*</span></label>
        <select id="slot-day" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;">
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
        </select>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Start Time <span style="color:#dc2626;">*</span></label>
          <input type="time" id="slot-start" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" value="08:00" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">End Time <span style="color:#dc2626;">*</span></label>
          <input type="time" id="slot-end" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" value="10:00" />
        </div>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Venue</label>
        <input type="text" id="slot-venue" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" placeholder="e.g. LT1" />
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="add-slot-cancel" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="add-slot-save" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Save Slot</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_COURSES = [];

  async function loadSessions() {
    try {
      const res = await core.portalFetch('/api/hod/sessions');
      const sessions = res.data || [];
      const sel = $('tt-session');
      if (!sel) return;
      const current = sessions.find(s => s.isCurrent);
      sel.innerHTML = sessions.map(s => 
        `<option value="${s.id}" ${s.id === (current?.id) ? 'selected' : ''}>${esc(s.name)}</option>`
      ).join('');
      if (current) sel.value = current.id;
    } catch (err) {
      console.error('Could not load sessions:', err);
    }
  }

  async function loadCourses() {
    try {
      const res = await core.portalFetch('/api/hod/courses');
      ALL_COURSES = res.data || [];
    } catch (err) {
      console.error('Could not load courses:', err);
    }
  }

  async function load() {
    const tbody = $('tt-tbody');
    const sessionId = $('tt-session')?.value;
    const semester = $('tt-semester')?.value || 'first';

    if (!sessionId) return;

    tbody.innerHTML = '<tr><td colspan="6" class="empty"><span class="spinner"></span> Loading slots...</td></tr>';

    try {
      const res = await core.portalFetch(`/api/hod/timetable?sessionId=${sessionId}&semester=${semester}&limit=500`);
      const rows = res.data || [];

      const counts = { total: rows.length, draft: 0, pending: 0, approved: 0 };
      rows.forEach(r => {
        const s = r.slot || r;
        if (s.status === 'draft') counts.draft++;
        else if (s.status === 'pending') counts.pending++;
        else if (s.status === 'approved') counts.approved++;
      });

      $('tt-stat-total').textContent = counts.total;
      $('tt-stat-draft').textContent = counts.draft;
      $('tt-stat-pending').textContent = counts.pending;
      $('tt-stat-approved').textContent = counts.approved;
      $('tt-count').textContent = counts.total;

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty">No slots found for this session/semester. Click "+ Add Slot" to start building your timetable.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(r => {
        const s = r.slot || r;
        const c = r.course || {};
        
        let statusBadge = '<span class="badge badge-warning">Draft</span>';
        if (s.status === 'pending') statusBadge = '<span class="badge badge-info">Pending</span>';
        else if (s.status === 'approved') statusBadge = '<span class="badge badge-success">Approved</span>';

        return `
          <tr>
            <td>
              <div style="font-weight:700;color:#0f172a;">${esc(c.code || '—')}</div>
              <div style="font-size:.72rem;color:#64748b;">${esc(c.title || '')}</div>
            </td>
            <td>${esc(s.dayOfWeek || '—')}</td>
            <td>${esc(s.startTime || '')} - ${esc(s.endTime || '')}</td>
            <td>${esc(s.venue || '—')}</td>
            <td>${statusBadge}</td>
            <td>
              ${s.status === 'draft' ? `<button class="btn-delete" data-id="${s.id}" style="background:#fee2e2;color:#991b1b;border:none;padding:.3rem .6rem;border-radius:4px;cursor:pointer;font-size:.75rem;font-weight:700;">Delete</button>` : ''}
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this draft slot?')) return;
          try {
            await core.portalFetch(`/api/hod/timetable/${btn.dataset.id}`, { method: 'DELETE' });
            core.showToast('Slot deleted.', 'success');
            load();
          } catch (err) { core.showToast(err.message, 'error'); }
        });
      });

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  // Open Add Slot Modal
  $('tt-add-slot')?.addEventListener('click', async () => {
    $('add-slot-modal').style.display = 'flex';
    
    // Populate course dropdown
    if (!ALL_COURSES.length) await loadCourses();
    
    const courseSelect = $('slot-course');
    if (ALL_COURSES.length) {
      courseSelect.innerHTML = '<option value="">Select a course</option>' + 
        ALL_COURSES.map(c => `<option value="${c.id}">${esc(c.code)} — ${esc(c.title)}</option>`).join('');
    } else {
      courseSelect.innerHTML = '<option value="">No courses found in your department.</option>';
    }
  });

  // Close Modal
  $('add-slot-close')?.addEventListener('click', () => $('add-slot-modal').style.display = 'none');
  $('add-slot-cancel')?.addEventListener('click', () => $('add-slot-modal').style.display = 'none');

  // Save Slot
  $('add-slot-save')?.addEventListener('click', async () => {
    const courseId = $('slot-course').value;
    const dayOfWeek = $('slot-day').value;
    const startTime = $('slot-start').value;
    const endTime = $('slot-end').value;
    const venue = $('slot-venue').value.trim();
    const sessionId = $('tt-session').value;
    const semester = $('tt-semester').value;

    if (!courseId || !startTime || !endTime) {
      core.showToast('Please fill in Course, Start Time, and End Time.', 'warning');
      return;
    }

    const btn = $('add-slot-save');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const res = await core.portalFetch('/api/hod/timetable', {
        method: 'POST',
        body: { 
          courseId: Number(courseId), 
          sessionId: Number(sessionId), 
          semester, 
          dayOfWeek, 
          startTime, 
          endTime, 
          venue 
        }
      });
      core.showToast('✅ Slot added successfully.', 'success');
      $('add-slot-modal').style.display = 'none';
      
      // Reset form
      $('slot-course').value = '';
      $('slot-venue').value = '';
      
      load(); // Reload the table
    } catch (err) {
      core.showToast('❌ ' + err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Slot';
    }
  });

  async function submitForApproval() {
    const sessionId = $('tt-session')?.value;
    const semester = $('tt-semester')?.value || 'first';
    if (!sessionId) { core.showToast('Session not loaded.', 'warning'); return; }

    const ok = confirm('Are you sure you want to submit this timetable to the Admin for approval? You will not be able to edit it until it is reviewed.');
    if (!ok) return;

    const btn = $('tt-submit');
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    try {
      const res = await core.portalFetch('/api/hod/timetable/submit-for-approval', {
        method: 'POST',
        body: { sessionId: Number(sessionId), semester }
      });
      core.showToast(res.message || 'Submitted successfully.', 'success');
      load();
    } catch (err) {
      core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '📤 Submit for Approval';
    }
  }

  $('tt-refresh')?.addEventListener('click', load);
  $('tt-submit')?.addEventListener('click', submitForApproval);
  $('tt-session')?.addEventListener('change', load);
  $('tt-semester')?.addEventListener('change', load);

  // Init
  loadSessions().then(load);
})();
</script>
