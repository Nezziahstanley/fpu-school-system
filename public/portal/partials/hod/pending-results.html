<!-- Portal → HOD → Pending Results -->
<section class="greeting">
  <div class="who">
    <div class="avatar">R</div>
    <div>
      <h1>Pending Results</h1>
      <div class="sub">Results submitted by lecturers awaiting your approval</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="pr-search" placeholder="Search course, lecturer, or session…" />
  <select id="pr-session"><option value="">All Sessions</option></select>
  <select id="pr-semester">
    <option value="">All Semesters</option>
    <option value="First">First</option>
    <option value="Second">Second</option>
  </select>
  <select id="pr-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <button class="btn btn-outline btn-sm" id="pr-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="pr-export">Export CSV</button>
</div>

<!-- Stats row -->
<div class="stat-grid">
  <div class="stat red">
    <div class="meta"><span class="label">Awaiting Approval</span><span class="value" id="pr-total">—</span></div>
    <div class="ic">📋</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">ND Results</span><span class="value" id="pr-nd">—</span></div>
    <div class="ic">📘</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">HND Results</span><span class="value" id="pr-hnd">—</span></div>
    <div class="ic">📗</div>
  </div>
  <div class="stat purple">
    <div class="meta"><span class="label">Total Students</span><span class="value" id="pr-students">—</span></div>
    <div class="ic">👥</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Awaiting Your Approval</h3>
    <span class="badge" id="pr-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Course</th>
            <th>Title</th>
            <th>Lecturer</th>
            <th>Session</th>
            <th>Sem</th>
            <th>Level</th>
            <th>Students</th>
            <th>Submitted</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="pr-tbody">
          <tr><td colspan="9" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  // ---------------------------------------------------------
  // Extractors
  // ---------------------------------------------------------
  function getLevel(r) {
    return String(r.level || r.courseLevel || '').toUpperCase().trim() || '—';
  }
  function getCourseCode(r) { return r.courseCode || r.code || '—'; }
  function getCourseTitle(r) { return r.courseTitle || r.title || '—'; }
  function getLecturerName(r) {
    if (r.lecturerName) return r.lecturerName;
    if (r.lecturer) return `${r.lecturer.firstName || ''} ${r.lecturer.lastName || ''}`.trim();
    return '—';
  }
  function getSessionName(r) { return r.sessionName || r.session || '—'; }
  function getSemester(r) { return r.semesterName || r.semester || '—'; }
  function getStudentCount(r) { return r.studentCount ?? r.students ?? r.totalStudents ?? 0; }

  // ---------------------------------------------------------
  // Render
  // ---------------------------------------------------------
  function render() {
    $('pr-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('pr-tbody').innerHTML =
        '<tr><td colspan="9" class="empty">No pending results. 🎉</td></tr>';
      return;
    }

    $('pr-tbody').innerHTML = FILTERED.map((r) => {
      const level = getLevel(r);
      const chipClass = 'chip-' + level.toLowerCase();
      return `
        <tr data-id="${r.id || r.resultId}">
          <td><strong>${esc(getCourseCode(r))}</strong></td>
          <td>${esc(getCourseTitle(r))}</td>
          <td>${esc(getLecturerName(r))}</td>
          <td>${esc(getSessionName(r))}</td>
          <td>${esc(getSemester(r))}</td>
          <td><span class="chip ${chipClass}">${esc(level)}</span></td>
          <td>${getStudentCount(r)}</td>
          <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString() : '—'}</td>
          <td class="row-actions">
            <button class="btn btn-primary btn-xs" data-act="approve">Approve</button>
            <button class="btn btn-outline btn-xs" data-act="reject">Reject</button>
          </td>
        </tr>`;
    }).join('');

    // Row actions
    $('pr-tbody').querySelectorAll('button[data-act]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.closest('tr').dataset.id;
        if (btn.dataset.act === 'approve') approveResult(id);
        if (btn.dataset.act === 'reject') rejectResult(id);
      });
    });
  }

  // ---------------------------------------------------------
  // Filters
  // ---------------------------------------------------------
  function applyFilter() {
    const q = ($('pr-search').value || '').trim().toLowerCase();
    const ses = $('pr-session').value;
    const sem = $('pr-semester').value;
    const lvl = $('pr-level').value;

    FILTERED = ALL.filter((r) => {
      const hay = `${getCourseCode(r)} ${getCourseTitle(r)} ${getLecturerName(r)} ${getSessionName(r)}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (ses && getSessionName(r) !== ses) return false;
      if (sem && getSemester(r) !== sem) return false;
      if (lvl && getLevel(r) !== lvl) return false;
      return true;
    });

    render();
  }

  // ---------------------------------------------------------
  // Stats
  // ---------------------------------------------------------
  function updateStats() {
    const total = ALL.length;
    const nd = ALL.filter((r) => getLevel(r) === 'ND').length;
    const hnd = ALL.filter((r) => getLevel(r) === 'HND').length;
    const students = ALL.reduce((sum, r) => sum + Number(getStudentCount(r) || 0), 0);

    $('pr-total').textContent = total;
    $('pr-nd').textContent = nd;
    $('pr-hnd').textContent = hnd;
    $('pr-students').textContent = students;
  }

  // ---------------------------------------------------------
  // Load
  // ---------------------------------------------------------
  async function load() {
    $('pr-tbody').innerHTML = '<tr><td colspan="9" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/results/pending-hod');
      const payload = res.data || res || {};
      ALL = Array.isArray(payload)
        ? payload
        : (payload.rows || payload.results || []);

      console.log('[hod-pending-results] Loaded', ALL.length, 'pending. Sample:', ALL[0]);

      // Populate session dropdown
      const sessions = [...new Set(ALL.map((r) => getSessionName(r)).filter((s) => s && s !== '—'))];
      const sesSel = $('pr-session');
      const cur = sesSel.value;
      sesSel.innerHTML = '<option value="">All Sessions</option>' +
        sessions.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      sesSel.value = cur;

      updateStats();
      applyFilter();
    } catch (err) {
      console.error('[hod-pending-results]', err);
      $('pr-tbody').innerHTML =
        `<tr><td colspan="9" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  // ---------------------------------------------------------
  // Actions
  // ---------------------------------------------------------
  async function approveResult(id) {
    if (!confirm('Approve this result? It will be sent to the academic office for final approval.')) return;
    try {
      await core.portalFetch(`/api/results/${id}/hod-verify`, { method: 'POST' });
      core.showToast('Result approved', 'success');
      load();
    } catch (err) {
      core.showToast(err.message, 'error');
    }
  }

  async function rejectResult(id) {
    const reason = prompt('Reason for rejection (required):');
    if (!reason || !reason.trim()) return;
    try {
      await core.portalFetch(`/api/results/${id}/hod-reject`, {
        method: 'POST',
        body: { reason: reason.trim() },
      });
      core.showToast('Result rejected', 'success');
      load();
    } catch (err) {
      core.showToast(err.message, 'error');
    }
  }

  // ---------------------------------------------------------
  // Export CSV
  // ---------------------------------------------------------
  function exportCsv() {
    const headers = ['Course', 'Title', 'Lecturer', 'Session', 'Semester', 'Level', 'Students', 'Submitted'];
    const rows = FILTERED.map((r) => [
      getCourseCode(r),
      getCourseTitle(r),
      getLecturerName(r),
      getSessionName(r),
      getSemester(r),
      getLevel(r),
      getStudentCount(r),
      r.submittedAt ? new Date(r.submittedAt).toLocaleDateString() : '',
    ]);

    const csv = [headers, ...rows]
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
      .join('\n');

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hod-pending-results-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('pr-search').addEventListener('input', applyFilter);
  $('pr-session').addEventListener('change', applyFilter);
  $('pr-semester').addEventListener('change', applyFilter);
  $('pr-level').addEventListener('change', applyFilter);
  $('pr-refresh').addEventListener('click', load);
  $('pr-export').addEventListener('click', exportCsv);

  load();
})();
</script>
