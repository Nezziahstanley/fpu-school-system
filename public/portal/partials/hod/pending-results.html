<!-- Portal → HOD → Pending Results -->
<section class="greeting">
  <div class="who">
    <div class="avatar">R</div>
    <div>
      <h1>Pending Results</h1>
      <div class="sub">Results submitted by lecturers awaiting your approval</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="pr-search" placeholder="Search course, lecturer, or session…" />
  <select id="pr-session"><option value="">All Sessions</option></select>
  <select id="pr-semester">
    <option value="">All Semesters</option>
    <option value="first">First</option>
    <option value="second">Second</option>
  </select>
  <select id="pr-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <button class="btn btn-outline btn-sm" id="pr-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="pr-export">Export CSV</button>
</div>

<!-- Stats row -->
<div class="stat-grid">
  <div class="stat red">
    <div class="meta"><span class="label">Awaiting Approval</span><span class="value" id="pr-total">—</span></div>
    <div class="ic">📋</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">ND Results</span><span class="value" id="pr-nd">—</span></div>
    <div class="ic">📘</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">HND Results</span><span class="value" id="pr-hnd">—</span></div>
    <div class="ic">📗</div>
  </div>
  <div class="stat purple">
    <div class="meta"><span class="label">Total Students</span><span class="value" id="pr-students">—</span></div>
    <div class="ic">👥</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Awaiting Your Approval</h3>
    <span class="badge" id="pr-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Course</th>
            <th>Title</th>
            <th>Lecturer</th>
            <th>Session</th>
            <th>Sem</th>
            <th>Level</th>
            <th>Students</th>
            <th>Submitted</th>
            <th style="width: 150px;">Action</th>
          </tr>
        </thead>
        <tbody id="pr-tbody">
          <tr><td colspan="9" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- MODAL: VIEW & BULK APPROVE RESULTS -->
<div id="results-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <div>
        <h3 id="rm-course-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Course Results</h3>
        <p id="rm-course-code" style="margin:.2rem 0 0;font-size:.75rem;color:#64748b;"></p>
      </div>
      <button id="rm-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;flex:1;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <label style="display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.85rem;cursor:pointer;">
          <input type="checkbox" id="rm-select-all" style="width:16px;height:16px;" /> Select All Students
        </label>
        <button id="rm-bulk-approve" class="btn btn-primary btn-sm" style="background:#065f46;color:#fff;border:none;border-radius:6px;padding:.4rem .8rem;font-size:.75rem;font-weight:700;cursor:pointer;">Approve Selected</button>
      </div>

      <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.5rem .75rem;text-align:left;width:40px;"><input type="checkbox" disabled /></th>
              <th style="padding:.5rem .75rem;text-align:left;">Student</th>
              <th style="padding:.5rem .75rem;text-align:left;">Matric No</th>
              <th style="padding:.5rem .75rem;text-align:center;">Score</th>
              <th style="padding:.5rem .75rem;text-align:center;">Grade</th>
            </tr>
          </thead>
          <tbody id="rm-tbody">
            <!-- Injected via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];
  let CURRENT_COURSE = null;

  function getLevel(r) { return String(r.level || r.courseLevel || '').toUpperCase().trim() || '—'; }
  function getCourseCode(r) { return r.courseCode || r.code || '—'; }
  function getCourseTitle(r) { return r.courseTitle || r.title || '—'; }
  function getLecturerName(r) { return r.lecturerName || '—'; }
  function getSessionName(r) { return r.sessionName || r.session || '—'; }
  function getSemester(r) { return r.semesterName || r.semester || '—'; }
  function getStudentCount(r) { return r.studentCount ?? r.students ?? 0; }

  function render() {
    $('pr-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('pr-tbody').innerHTML = '<tr><td colspan="9" class="empty">No pending results. 🎉</td></tr>';
      return;
    }

    $('pr-tbody').innerHTML = FILTERED.map((r) => {
      const level = getLevel(r);
      const chipClass = 'chip-' + level.toLowerCase();
      return `
        <tr data-id="${r.id}">
          <td><strong>${esc(getCourseCode(r))}</strong></td>
          <td>${esc(getCourseTitle(r))}</td>
          <td>${esc(getLecturerName(r))}</td>
          <td>${esc(getSessionName(r))}</td>
          <td>${esc(getSemester(r))}</td>
          <td><span class="chip ${chipClass}">${esc(level)}</span></td>
          <td>${getStudentCount(r)}</td>
          <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString() : '—'}</td>
          <td class="row-actions">
            <button class="btn btn-primary btn-xs" data-act="view">View / Approve</button>
          </td>
        </tr>`;
    }).join('');

    $('pr-tbody').querySelectorAll('button[data-act="view"]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const rowId = btn.closest('tr').dataset.id;
        const item = FILTERED.find(x => String(x.id) === String(rowId));
        if (item) openResultsModal(item);
      });
    });
  }

  function applyFilter() {
    const q = ($('pr-search').value || '').trim().toLowerCase();
    const ses = $('pr-session').value.toLowerCase(); 
    const sem = $('pr-semester').value.toLowerCase(); 
    const lvl = $('pr-level').value.toUpperCase();    

    FILTERED = ALL.filter((r) => {
      const hay = `${getCourseCode(r)} ${getCourseTitle(r)} ${getLecturerName(r)} ${getSessionName(r)}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      
      if (ses && getSessionName(r).toLowerCase() !== ses) return false;
      if (sem && getSemester(r).toLowerCase() !== sem) return false;
      if (lvl && getLevel(r).toUpperCase() !== lvl) return false;
      
      return true;
    });

    render();
  }

  function updateStats() {
    const total = ALL.length;
    const nd = ALL.filter((r) => getLevel(r) === 'ND').length;
    const hnd = ALL.filter((r) => getLevel(r) === 'HND').length;
    const students = ALL.reduce((sum, r) => sum + Number(getStudentCount(r) || 0), 0);

    $('pr-total').textContent = total;
    $('pr-nd').textContent = nd;
    $('pr-hnd').textContent = hnd;
    $('pr-students').textContent = students;
  }

  async function load() {
    $('pr-tbody').innerHTML = '<tr><td colspan="9" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const sem = $('pr-semester').value;
      const lvl = $('pr-level').value;
      
      let url = '/api/hod/pending-results';
      const params = new URLSearchParams();
      if (sem) params.append('semester', sem);
      if (lvl) params.append('level', lvl);
      if (params.toString()) url += '?' + params.toString();

      const res = await core.portalFetch(url);
      const payload = res.data || res || {};
      ALL = Array.isArray(payload) ? payload : [];

      const sessions = [...new Set(ALL.map((r) => getSessionName(r)).filter((s) => s && s !== '—'))];
      const sesSel = $('pr-session');
      sesSel.innerHTML = '<option value="">All Sessions</option>' +
        sessions.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

      updateStats();
      applyFilter();
    } catch (err) {
      $('pr-tbody').innerHTML = `<tr><td colspan="9" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  // ---------------------------------------------------------
  // MODAL LOGIC
  // ---------------------------------------------------------
  async function openResultsModal(courseRow) {
    CURRENT_COURSE = courseRow;
    $('results-modal').style.display = 'flex';
    $('rm-course-title').textContent = courseRow.courseTitle;
    $('rm-course-code').textContent = `${courseRow.courseCode} — ${courseRow.level} — ${courseRow.sessionName}`;
    
    $('rm-select-all').checked = false;
    $('rm-tbody').innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">Loading students…</td></tr>';

    try {
      const res = await core.portalFetch(`/api/hod/results/course/${courseRow.courseId}`);
      const students = res.data || [];

      if (!students.length) {
        $('rm-tbody').innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">No submitted results found.</td></tr>';
        return;
      }

      $('rm-tbody').innerHTML = students.map(s => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;text-align:center;">
            <input type="checkbox" class="rm-checkbox" value="${s.id}" style="width:16px;height:16px;" />
          </td>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(s.studentName)}</td>
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(s.matricNumber)}</code></td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(s.score)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(s.grade)}</td>
        </tr>
      `).join('');

    } catch (err) {
      $('rm-tbody').innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function closeResultsModal() {
    $('results-modal').style.display = 'none';
    CURRENT_COURSE = null;
  }

  $('rm-select-all')?.addEventListener('change', (e) => {
    const checked = e.target.checked;
    document.querySelectorAll('.rm-checkbox').forEach(cb => { cb.checked = checked; });
  });

  $('rm-bulk-approve')?.addEventListener('click', async () => {
    const selected = Array.from(document.querySelectorAll('.rm-checkbox:checked')).map(cb => Number(cb.value));
    if (!selected.length) return core.showToast && core.showToast('Please select at least one student.', 'warning');

    if (!confirm(`Approve ${selected.length} results?`)) return;

    const btn = $('rm-bulk-approve');
    btn.disabled = true;
    btn.textContent = 'Approving…';

    try {
      await core.portalFetch('/api/hod/results/bulk-approve', {
        method: 'POST',
        body: { resultIds: selected }
      });
      core.showToast && core.showToast('Results approved successfully!', 'success');
      closeResultsModal();
      load(); 
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Approve Selected';
    }
  });

  $('rm-close')?.addEventListener('click', closeResultsModal);
  $('results-modal')?.addEventListener('click', (e) => { if (e.target.id === 'results-modal') closeResultsModal(); });

  $('pr-search').addEventListener('input', applyFilter);
  $('pr-session').addEventListener('change', applyFilter);
  $('pr-semester').addEventListener('change', load);
  $('pr-level').addEventListener('change', load);
  $('pr-refresh').addEventListener('click', load);
  $('pr-export').addEventListener('click', function() {
    // Simple export logic
    alert('Export functionality not implemented yet.');
  });

  load();
})();
</script>
