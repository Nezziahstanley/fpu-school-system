<!-- Portal → HOD → Pending Results -->
<section class="page-head">
  <div><h2>Pending Results</h2><p class="muted small">Submitted by lecturers, awaiting HOD verification</p></div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.__hodPendLoad()">Refresh</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Submitted Results</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Student</th><th>Course</th><th>Score</th><th>Grade</th><th>Submitted</th><th>Actions</th></tr></thead>
        <tbody id="hod-pend-tbody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__hodPendLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('hod-pend-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/hod/pending-results');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td>${core.escapeHtml((r.student?.firstName || '') + ' ' + (r.student?.lastName || ''))}<br/><span class="small muted">${core.escapeHtml(r.student?.matricNumber || '')}</span></td>
          <td>${core.escapeHtml(r.course?.code || '')} — ${core.escapeHtml(r.course?.title || '')}</td>
          <td class="num">${r.result.score}</td>
          <td><span class="grade ${core.escapeHtml(r.result.grade || '')}">${core.escapeHtml(r.result.grade || '')}</span></td>
          <td>${core.formatDate(r.result.submittedAt)}</td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="window.__hodVerify(${r.result.id})">Verify</button>
            <button class="btn btn-sm btn-ghost" onclick="window.__hodReject(${r.result.id})">Reject</button>
          </td>
        </tr>
      `).join('') : '<tr><td colspan="6" class="empty">No pending results.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="6" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };

  window.__hodVerify = async function (id) {
    const core = window.FPU_PORTAL;
    try {
      await core.portalFetch(`/api/hod/pending-results/${id}/verify`, { method: 'POST' });
      core.showToast('Result verified.', 'success');
      window.__hodPendLoad();
    } catch (err) { core.showToast(err.message, 'error'); }
  };

  window.__hodReject = async function (id) {
    const core = window.FPU_PORTAL;
    const reason = prompt('Reason for rejection:');
    if (reason === null) return;
    try {
      await core.portalFetch(`/api/hod/pending-results/${id}/reject`, { method: 'POST', body: { reason } });
      core.showToast('Result rejected.', 'warning');
      window.__hodPendLoad();
    } catch (err) { core.showToast(err.message, 'error'); }
  };

  window.__hodPendLoad();
</script>
