<!-- Portal → HOD → Results Entry -->
<div style="padding:0;" id="main-view">
  
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Results Entry</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Upload CA and Exam scores for your courses</p>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.25rem;margin-bottom:1.25rem;">
    <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;">Select Course</label>
    <select id="course-select" style="width:100%;max-width:500px;padding:.6rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#f8fafc;">
      <option value="">— Select a course —</option>
    </select>
  </div>

  <div id="table-panel" style="display:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.95rem;color:#0f172a;" id="course-title">Course</div>
      <div style="display:flex;gap:.5rem;">
        <button id="save-results-btn" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #065f46;border-radius:8px;cursor:pointer;">💾 Save Draft</button>
        <button id="approve-results-btn" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">✅ Save & Approve</button>
      </div>
    </div>
    
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.75rem;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.75rem;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Matric No.</th>
            <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;width:100px;">CA (30)</th>
            <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;width:100px;">Exam (70)</th>
            <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;width:80px;">Total</th>
            <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;width:80px;">Grade</th>
          </tr>
        </thead>
        <tbody id="students-tbody">
          <!-- Injected by JS -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let CURRENT_COURSE_ID = null;

  function calcGrade(total) {
    if (total >= 70) return { grade: 'A', color: '#065f46' };
    if (total >= 60) return { grade: 'B', color: '#065f46' };
    if (total >= 50) return { grade: 'C', color: '#065f46' };
    if (total >= 45) return { grade: 'D', color: '#92400e' };
    if (total >= 40) return { grade: 'E', color: '#92400e' };
    return { grade: 'F', color: '#991b1b' };
  }

  async function loadCourses() {
    try {
      const res = await core.portalFetch('/api/hod/courses');
      const courses = res.data || [];
      $('course-select').innerHTML = '<option value="">— Select a course —</option>' + 
        courses.map(c => `<option value="${c.id}">${esc(c.code)} — ${esc(c.title)}</option>`).join('');
    } catch (err) {
      core.showToast(err.message, 'error');
    }
  }

  $('course-select')?.addEventListener('change', async (e) => {
    const courseId = e.target.value;
    if (!courseId) { $('table-panel').style.display = 'none'; return; }

    CURRENT_COURSE_ID = courseId;
    $('table-panel').style.display = 'block';
    $('students-tbody').innerHTML = '<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">Loading students…</td></tr>';

    const selectedText = e.target.options[e.target.selectedIndex].text;
    $('course-title').textContent = selectedText;

    try {
      const res = await core.portalFetch(`/api/hod/results/${courseId}`);
      const students = res.data || [];
      
      if (!students.length) {
        $('students-tbody').innerHTML = '<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">No students registered for this course.</td></tr>';
        return;
      }

      $('students-tbody').innerHTML = students.map(s => {
        const totalScore = s.score != null ? Number(s.score) : null;
        let ca = '', exam = '';
        
        // Simple heuristic to split total into CA and Exam if we have an existing score
        if (totalScore !== null) {
          ca = Math.round((totalScore / 100) * 30); 
          exam = totalScore - ca;
        }

        const total = (Number(ca)||0) + (Number(exam)||0);
        const { grade, color } = calcGrade(total);

        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.85rem .75rem;font-weight:700;color:#0f172a;">${esc(s.lastName)}, ${esc(s.firstName)}</td>
            <td style="padding:.85rem .75rem;"><code>${esc(s.matricNumber || '—')}</code></td>
            <td style="padding:.85rem .75rem;text-align:center;"><input type="number" class="score-input" data-student="${s.studentId}" data-field="ca" value="${ca}" min="0" max="30" style="width:60px;padding:.3rem;text-align:center;border:1px solid #cbd5e1;border-radius:4px;" /></td>
            <td style="padding:.85rem .75rem;text-align:center;"><input type="number" class="score-input" data-student="${s.studentId}" data-field="exam" value="${exam}" min="0" max="70" style="width:60px;padding:.3rem;text-align:center;border:1px solid #cbd5e1;border-radius:4px;" /></td>
            <td style="padding:.85rem .75rem;text-align:center;font-weight:800;" class="total-cell">${totalScore !== null ? total : '—'}</td>
            <td style="padding:.85rem .75rem;text-align:center;font-weight:900;color:${color};" class="grade-cell">${totalScore !== null ? grade : '—'}</td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.score-input').forEach(input => {
        input.addEventListener('input', (e) => {
          const row = e.target.closest('tr');
          const inputs = row.querySelectorAll('.score-input');
          const ca = Number(inputs[0].value) || 0;
          const exam = Number(inputs[1].value) || 0;
          const total = ca + exam;
          const { grade, color } = calcGrade(total);

          row.querySelector('.total-cell').textContent = total;
          row.querySelector('.grade-cell').textContent = grade;
          row.querySelector('.grade-cell').style.color = color;
        });
      });

    } catch (err) {
      $('students-tbody').innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">${esc(err.message)}</td></tr>`;
    }
  });

  function gatherPayload() {
    const payload = [];
    const studentMap = {};
    document.querySelectorAll('.score-input').forEach(input => {
      const studentId = Number(input.dataset.student);
      if (!studentMap[studentId]) studentMap[studentId] = { studentId, ca: 0, exam: 0 };
      const val = Number(input.value) || 0;
      if (input.dataset.field === 'ca') studentMap[studentId].ca = val;
      if (input.dataset.field === 'exam') studentMap[studentId].exam = val;
    });
    Object.values(studentMap).forEach(s => {
      payload.push({ studentId: s.studentId, caScore: s.ca, examScore: s.exam });
    });
    return payload;
  }

  // Save Draft Button
  $('save-results-btn')?.addEventListener('click', async () => {
    if (!CURRENT_COURSE_ID) return;
    const btn = $('save-results-btn');
    btn.disabled = true; btn.textContent = 'Saving...';

    try {
      await core.portalFetch(`/api/hod/results/${CURRENT_COURSE_ID}`, {
        method: 'POST',
        body: { results: gatherPayload() }
      });
      core.showToast('Results saved as Draft.', 'success');
    } catch (err) {
      core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '💾 Save Draft';
    }
  });

  // Save & Approve Button
  $('approve-results-btn')?.addEventListener('click', async () => {
    if (!CURRENT_COURSE_ID) return;
    if (!confirm('Are you sure? This will save the scores and mark them as verified. The lecturer will no longer be able to edit them.')) return;
    
    const btn = $('approve-results-btn');
    btn.disabled = true; btn.textContent = 'Saving...';

    try {
      await core.portalFetch(`/api/hod/results/${CURRENT_COURSE_ID}/approve`, {
        method: 'POST',
        body: { results: gatherPayload() }
      });
      core.showToast('Results saved and approved successfully.', 'success');
    } catch (err) {
      core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = '✅ Save & Approve';
    }
  });

  // Init
  loadCourses();
})();
</script>
