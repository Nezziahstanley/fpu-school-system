<!-- Portal → HOD → Staff -->
<section class="page-head">
  <div><h2>Department Staff</h2><p class="muted small">Lecturers and staff in my department</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="window.__hodStaffLoad()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Staff</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Status</th></tr></thead>
        <tbody id="hod-staff-tbody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__hodStaffLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('hod-staff-tbody');
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/hod/staff');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((s) => `
        <tr>
          <td>${core.escapeHtml(s.firstName)} ${core.escapeHtml(s.lastName)}</td>
          <td>${core.escapeHtml(s.email)}</td>
          <td>${core.escapeHtml(s.role)}</td>
          <td>${core.escapeHtml(s.phone || '')}</td>
          <td>${s.isActive ? '<span class="badge badge-success">Active</span>' : '<span class="badge badge-muted">Inactive</span>'}</td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="empty">No staff.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="5" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };
  window.__hodStaffLoad();
</script>
