<style id="hod-unified-design">#main-view,.hod-page,#main-view *{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}#main-view h1,#main-view h2,#main-view h3,#main-view h4{letter-spacing:-.025em;font-weight:750}#main-view .page-head,#main-view .greeting{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.25rem 1.5rem;margin:0 0 1.25rem;border-radius:18px;background:linear-gradient(120deg,#064e3b 0%,#087653 58%,#10a16e 100%);box-shadow:0 12px 28px rgba(6,78,59,.13);color:#fff}#main-view .page-head h1,#main-view .page-head h2,#main-view .greeting h1,#main-view .greeting h2{color:#fff!important;margin:0;font-size:clamp(1.2rem,2.4vw,1.65rem);line-height:1.2}#main-view .page-head p,#main-view .greeting .sub{color:#d9f5e8!important;margin:.35rem 0 0}#main-view .page-head .actions{display:flex;gap:.55rem;flex-wrap:wrap}#main-view .stat-grid{gap:1rem}#main-view .stat,#main-view .panel,#main-view .filter-bar{border-radius:14px}#main-view .panel{overflow:hidden}#main-view .panel-head{padding:1rem 1.15rem}#main-view .data-table th{font-size:.7rem;letter-spacing:.065em;text-transform:uppercase}#main-view input,#main-view select,#main-view textarea,#main-view button{font:inherit}@media(max-width:640px){#main-view .page-head,#main-view .greeting{padding:1.05rem;border-radius:14px}#main-view .page-head .actions{width:100%}}</style>
﻿<!-- Portal → HOD → Staff -->
<section class="greeting">
  <div class="who">
    <div class="avatar">W</div>
    <div>
      <h1>Department Staff</h1>
      <div class="sub" id="stf-dept-sub">Lecturers and staff in your department</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="stf-search" placeholder="Search name, email, or phone…" />
  <select id="stf-role">
    <option value="">All Roles</option>
    <option value="lecturer">Lecturer</option>
    <option value="hod">HOD</option>
  </select>
  <select id="stf-status">
    <option value="">All Status</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
  <button class="btn btn-outline btn-sm" id="stf-refresh">↻ Refresh</button>
  <button class="btn btn-outline btn-sm" id="stf-export">Export CSV</button>
</div>

<!-- Stat tiles -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta"><span class="label">Total Staff</span><span class="value" id="stf-total">—</span></div>
    <div class="ic">👥</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">Lecturers</span><span class="value" id="stf-lecturers">—</span></div>
    <div class="ic">👨‍🏫</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">HODs</span><span class="value" id="stf-hods">—</span></div>
    <div class="ic">🎓</div>
  </div>
  <div class="stat purple">
    <div class="meta"><span class="label">Active</span><span class="value" id="stf-active">—</span></div>
    <div class="ic">✅</div>
  </div>
  <div class="stat red"><div class="meta"><span class="label">Inactive</span><span class="value" id="stf-inactive">—</span></div><div class="ic">!</div></div>
</div>
<div id="stf-result-count" style="margin:-.35rem 0 1rem;color:#64748b;font-size:.78rem;font-weight:700" aria-live="polite">Showing all staff</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Staff</h3>
    <span class="badge" id="stf-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Courses</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="stf-tbody">
          <tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  function render() {
    $('stf-count').textContent = FILTERED.length;
    const tbody = $('stf-tbody');

    if (!FILTERED.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No staff found.</td></tr>';
      return;
    }

    tbody.innerHTML = FILTERED.map(s => {
      const statusBadge = s.isActive 
        ? '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#d1fae5;color:#065f46;border-radius:5px;">Active</span>'
        : '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#fee2e2;color:#991b1b;border-radius:5px;">Inactive</span>';
      
      const roleChip = s.role === 'hod'
        ? '<span class="chip" style="background:#e0e7ff;color:#3730a3;">HOD</span>'
        : '<span class="chip" style="background:#dbeafe;color:#1e40af;">Lecturer</span>';

      return `
        <tr>
          <td><strong>${esc(s.lastName)}</strong>, ${esc(s.firstName)}</td>
          <td>${roleChip}</td>
          <td>${esc(s.email || '—')}</td>
          <td>${esc(s.phone || '—')}</td>
          <td><strong style="color:#065f46;">${s.courseCount || 0}</strong></td>
          <td>${statusBadge}</td>
        </tr>
      `;
    }).join('');
  }

  function updateStats() {
    $('stf-total').textContent = ALL.length;
    $('stf-lecturers').textContent = ALL.filter(s => s.role === 'lecturer').length;
    $('stf-hods').textContent = ALL.filter(s => s.role === 'hod').length;
    $('stf-active').textContent = ALL.filter(s => Boolean(s.isActive)).length;
    $('stf-inactive').textContent = ALL.filter(s => !s.isActive).length;
  }

  function applyFilter() {
    const q = ($('stf-search').value || '').trim().toLowerCase();
    const role = $('stf-role').value;
    const status = $('stf-status').value;

    FILTERED = ALL.filter(s => {
      const hay = `${s.firstName} ${s.lastName} ${s.email} ${s.phone || ''} ${s.role} ${s.courseCount || 0}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (role && s.role !== role) return false;
      if (status === 'active' && !s.isActive) return false;
      if (status === 'inactive' && s.isActive) return false;
      return true;
    });
    render();
    $('stf-result-count').textContent = 'Showing ' + FILTERED.length + ' of ' + ALL.length + ' staff members';
  }

  function exportCsv() {
    if (!FILTERED.length) { core.showToast && core.showToast('No staff members match the current filters.','warning'); return; }
    const columns = ['Full Name','Role','Email','Phone','Department Course Count','Status'];
    const cell = value => { let v=String(value==null?'':value); if (/^\s*[=+@-]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; };
    const rows = [columns,...FILTERED.map(s=>[[s.firstName,s.lastName].filter(Boolean).join(' '),s.role,s.email,s.phone,s.courseCount,s.isActive?'Active':'Inactive'])];
    const csv='\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='hod-department-staff.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }

  async function load() {
    const tbody = $('stf-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    
    try {
      const res = await core.portalFetch('/api/hod/staff');
      ALL = Array.isArray(res.data) ? res.data : [];
      updateStats();
      applyFilter();
      try { const dash=await core.portalFetch('/api/hod/dashboard'); if(dash?.data?.departmentName) $('stf-dept-sub').textContent='Staff in '+dash.data.departmentName; } catch (_) {}
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  $('stf-search')?.addEventListener('input', applyFilter);
  $('stf-role')?.addEventListener('change', applyFilter);
  $('stf-status')?.addEventListener('change', applyFilter);
  $('stf-refresh')?.addEventListener('click', load);
  $('stf-export')?.addEventListener('click', exportCsv);

  load();
})();
</script>
