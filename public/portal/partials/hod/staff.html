<!-- Portal → HOD → Staff -->
<section class="greeting">
  <div class="who">
    <div class="avatar">W</div>
    <div>
      <h1>Department Staff</h1>
      <div class="sub">Lecturers and staff in Computer Science</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="stf-search" placeholder="Search name, email, or phone…" />
  <select id="stf-role">
    <option value="">All Roles</option>
    <option value="lecturer">Lecturer</option>
    <option value="hod">HOD</option>
  </select>
  <select id="stf-status">
    <option value="">All Status</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
  <button class="btn btn-outline btn-sm" id="stf-refresh">↻ Refresh</button>
  <button class="btn btn-outline btn-sm" id="stf-export">Export CSV</button>
</div>

<!-- Stat tiles -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta"><span class="label">Total Staff</span><span class="value" id="stf-total">—</span></div>
    <div class="ic">👥</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">Lecturers</span><span class="value" id="stf-lecturers">—</span></div>
    <div class="ic">👨‍🏫</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">HODs</span><span class="value" id="stf-hods">—</span></div>
    <div class="ic">🎓</div>
  </div>
  <div class="stat purple">
    <div class="meta"><span class="label">Active</span><span class="value" id="stf-active">—</span></div>
    <div class="ic">✅</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Staff</h3>
    <span class="badge" id="stf-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Role</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Courses</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="stf-tbody">
          <tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  function render() {
    $('stf-count').textContent = FILTERED.length;
    const tbody = $('stf-tbody');

    if (!FILTERED.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No staff found.</td></tr>';
      return;
    }

    tbody.innerHTML = FILTERED.map(s => {
      const statusBadge = s.isActive 
        ? '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#d1fae5;color:#065f46;border-radius:5px;">Active</span>'
        : '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#fee2e2;color:#991b1b;border-radius:5px;">Inactive</span>';
      
      const roleChip = s.role === 'hod'
        ? '<span class="chip" style="background:#e0e7ff;color:#3730a3;">HOD</span>'
        : '<span class="chip" style="background:#dbeafe;color:#1e40af;">Lecturer</span>';

      return `
        <tr>
          <td><strong>${esc(s.lastName)}</strong>, ${esc(s.firstName)}</td>
          <td>${roleChip}</td>
          <td>${esc(s.email || '—')}</td>
          <td>${esc(s.phone || '—')}</td>
          <td><strong style="color:#065f46;">${s.courseCount || 0}</strong></td>
          <td>${statusBadge}</td>
        </tr>
      `;
    }).join('');
  }

  function updateStats() {
    $('stf-total').textContent = ALL.length;
    $('stf-lecturers').textContent = ALL.filter(s => s.role === 'lecturer').length;
    $('stf-hods').textContent = ALL.filter(s => s.role === 'hod').length;
    $('stf-active').textContent = ALL.filter(s => s.isActive).length;
  }

  function applyFilter() {
    const q = ($('stf-search').value || '').trim().toLowerCase();
    const role = $('stf-role').value;
    const status = $('stf-status').value;

    FILTERED = ALL.filter(s => {
      const hay = `${s.firstName} ${s.lastName} ${s.email} ${s.phone || ''}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (role && s.role !== role) return false;
      if (status === 'active' && !s.isActive) return false;
      if (status === 'inactive' && s.isActive) return false;
      return true;
    });
    render();
  }

  async function load() {
    const tbody = $('stf-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    
    try {
      const res = await core.portalFetch('/api/hod/staff');
      ALL = res.data || [];
      
      updateStats();
      applyFilter();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  $('stf-search')?.addEventListener('input', applyFilter);
  $('stf-role')?.addEventListener('change', applyFilter);
  $('stf-status')?.addEventListener('change', applyFilter);
  $('stf-refresh')?.addEventListener('click', load);

  load();
})();
</script>
