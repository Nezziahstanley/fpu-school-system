<!-- Portal → HOD → Students -->
<section class="greeting">
  <div class="who">
    <div class="avatar">S</div>
    <div>
      <h1>Department Students</h1>
      <div class="sub">All students in Computer Science</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="stu-search" placeholder="Search matric no. or name…" />
  <select id="stu-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <select id="stu-status">
    <option value="">All Status</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
  <button class="btn btn-outline btn-sm" id="stu-refresh">↻ Refresh</button>
  <button class="btn btn-outline btn-sm" id="stu-export">Export CSV</button>
</div>

<!-- Stat tiles -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta"><span class="label">Total Students</span><span class="value" id="stu-total">—</span></div>
    <div class="ic">🎓</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">ND Students</span><span class="value" id="stu-nd">—</span></div>
    <div class="ic">📘</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">HND Students</span><span class="value" id="stu-hnd">—</span></div>
    <div class="ic">📗</div>
  </div>
  <div class="stat purple">
    <div class="meta"><span class="label">Active</span><span class="value" id="stu-active">—</span></div>
    <div class="ic">✅</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Students</h3>
    <span class="badge" id="stu-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Matric No.</th>
            <th>Full Name</th>
            <th>Level</th>
            <th>Programme</th>
            <th>CGPA</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="stu-tbody">
          <tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  function render() {
    $('stu-count').textContent = FILTERED.length;
    const tbody = $('stu-tbody');

    if (!FILTERED.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No students found.</td></tr>';
      return;
    }

    tbody.innerHTML = FILTERED.map(s => {
      const statusBadge = s.isActive 
        ? '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#d1fae5;color:#065f46;border-radius:5px;">Active</span>'
        : '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#fee2e2;color:#991b1b;border-radius:5px;">Inactive</span>';
      
      return `
        <tr>
          <td><code style="font-size:.75rem;">${esc(s.matricNumber || '—')}</code></td>
          <td><strong>${esc(s.lastName)}</strong>, ${esc(s.firstName)}</td>
          <td><span class="chip chip-${(s.level || '').toLowerCase()}">${esc(s.level || '—')}</span></td>
          <td>${esc(s.programmeName || '—')}</td>
          <td>—</td>
          <td>${statusBadge}</td>
        </tr>
      `;
    }).join('');
  }

  function updateStats() {
    $('stu-total').textContent = ALL.length;
    $('stu-nd').textContent = ALL.filter(s => s.level === 'ND').length;
    $('stu-hnd').textContent = ALL.filter(s => s.level === 'HND').length;
    $('stu-active').textContent = ALL.filter(s => s.isActive).length;
  }

  function applyFilter() {
    const q = ($('stu-search').value || '').trim().toLowerCase();
    const lvl = $('stu-level').value;
    const st = $('stu-status').value;

    FILTERED = ALL.filter(s => {
      const hay = `${s.firstName} ${s.lastName} ${s.matricNumber}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && s.level !== lvl) return false;
      if (st === 'active' && !s.isActive) return false;
      if (st === 'inactive' && s.isActive) return false;
      return true;
    });
    render();
  }

  async function load() {
    const tbody = $('stu-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    
    try {
      const res = await core.portalFetch('/api/hod/students');
      ALL = res.data || [];
      
      updateStats();
      applyFilter();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" class="empty">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  $('stu-search')?.addEventListener('input', applyFilter);
  $('stu-level')?.addEventListener('change', applyFilter);
  $('stu-status')?.addEventListener('change', applyFilter);
  $('stu-refresh')?.addEventListener('click', load);

  load();
})();
</script>
