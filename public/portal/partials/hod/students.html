<style id="hod-unified-design">
#main-view,.hod-page,#main-view *{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
#main-view h1,#main-view h2,#main-view h3,#main-view h4,.hod-page h1,.hod-page h2,.hod-page h3,.hod-page h4{letter-spacing:-.025em;font-weight:750}
#main-view .page-head,#main-view .greeting,.hod-page .page-head,.hod-page .greeting{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.25rem 1.5rem;margin:0 0 1.25rem;border-radius:18px;background:linear-gradient(120deg,#064e3b 0%,#087653 58%,#10a16e 100%);box-shadow:0 12px 28px rgba(6,78,59,.13);color:#fff}
#main-view .page-head h1,#main-view .page-head h2,#main-view .greeting h1,#main-view .greeting h2,.hod-page .page-head h1,.hod-page .page-head h2,.hod-page .greeting h1,.hod-page .greeting h2{color:#fff!important;margin:0;font-size:clamp(1.2rem,2.4vw,1.65rem);line-height:1.2}
#main-view .page-head p,#main-view .greeting .sub,.hod-page .page-head p,.hod-page .greeting .sub{color:#d9f5e8!important;margin:.35rem 0 0}
#main-view .page-head .actions,#main-view .greeting .actions{display:flex;gap:.55rem;flex-wrap:wrap}
#main-view .stat-grid{gap:1rem}
#main-view .stat,#main-view .panel,#main-view .filter-bar{border-radius:14px}
#main-view .panel{overflow:hidden}
#main-view .panel-head{padding:1rem 1.15rem}
#main-view .data-table{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}
#main-view .data-table th{font-size:.7rem;letter-spacing:.065em;text-transform:uppercase}
#main-view input,#main-view select,#main-view textarea,#main-view button{font:inherit}
@media(max-width:640px){#main-view .page-head,#main-view .greeting{padding:1.05rem;border-radius:14px}#main-view .page-head .actions{width:100%}}
</style>
﻿<!-- Portal → HOD → Students -->
<section class="greeting">
  <div class="who">
    <div class="avatar">S</div>
    <div>
      <h1>Department Students</h1>
      <div class="sub">All students in Computer Science</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="stu-search" placeholder="Search matric no. or name…" />
  <select id="stu-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <button class="btn btn-outline btn-sm" id="stu-refresh">↻ Refresh</button>
</div>

<!-- Stat tiles -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta"><span class="label">Total Students</span><span class="value" id="stu-total">—</span></div>
    <div class="ic">🎓</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">ND Students</span><span class="value" id="stu-nd">—</span></div>
    <div class="ic">📘</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">HND Students</span><span class="value" id="stu-hnd">—</span></div>
    <div class="ic">📗</div>
  </div>
</div>

<!-- ND Section -->
<section class="panel" style="margin-bottom: 20px;">
  <div class="panel-head">
    <h3>ND Students</h3>
    <span class="badge" id="stu-nd-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Matric No.</th>
            <th>Full Name</th>
            <th>Level</th>
            <th>Programme</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="stu-nd-tbody">
          <tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- HND Section -->
<section class="panel">
  <div class="panel-head">
    <h3>HND Students</h3>
    <span class="badge" id="stu-hnd-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Matric No.</th>
            <th>Full Name</th>
            <th>Level</th>
            <th>Programme</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="stu-hnd-tbody">
          <tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  function cleanMatric(matric) {
    if (!matric) return '—';
    return matric.replace(/SMT/gi, '').replace(/^\s+|\s+$/g, '');
  }

  function render() {
    // Sort numeric for ND
    const ndStudents = FILTERED
      .filter(s => s.level === 'ND')
      .sort((a, b) => cleanMatric(a.matricNumber).localeCompare(cleanMatric(b.matricNumber), undefined, { numeric: true }));

    // Sort numeric for HND
    const hndStudents = FILTERED
      .filter(s => s.level === 'HND')
      .sort((a, b) => cleanMatric(a.matricNumber).localeCompare(cleanMatric(b.matricNumber), undefined, { numeric: true }));

    $('stu-nd-count').textContent = ndStudents.length;
    $('stu-hnd-count').textContent = hndStudents.length;

    const buildRows = (students) => {
      if (!students.length) {
        return '<tr><td colspan="5" class="empty">No students found.</td></tr>';
      }
      return students.map(s => {
        const statusBadge = s.isActive 
          ? '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#d1fae5;color:#065f46;border-radius:5px;">Active</span>'
          : '<span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#fee2e2;color:#991b1b;border-radius:5px;">Inactive</span>';
        
        return `
          <tr>
            <td><code style="font-size:.75rem;">${esc(cleanMatric(s.matricNumber))}</code></td>
            <td><strong>${esc(s.lastName)}</strong>, ${esc(s.firstName)}</td>
            <td><span class="chip chip-${(s.level || '').toLowerCase()}">${esc(s.level || '—')}</span></td>
            <td>${esc(s.programmeName || '—')}</td>
            <td>${statusBadge}</td>
          </tr>
        `;
      }).join('');
    };

    $('stu-nd-tbody').innerHTML = buildRows(ndStudents);
    $('stu-hnd-tbody').innerHTML = buildRows(hndStudents);
  }

  function updateStats() {
    $('stu-total').textContent = ALL.length;
    $('stu-nd').textContent = ALL.filter(s => s.level === 'ND').length;
    $('stu-hnd').textContent = ALL.filter(s => s.level === 'HND').length;
  }

  function applyFilter() {
    const q = ($('stu-search').value || '').trim().toLowerCase();
    const lvl = $('stu-level').value;

    FILTERED = ALL.filter(s => {
      const hay = `${s.firstName} ${s.lastName} ${cleanMatric(s.matricNumber)}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && s.level !== lvl) return false;
      return true;
    });
    render();
  }

  async function load() {
    $('stu-nd-tbody').innerHTML = '<tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    $('stu-hnd-tbody').innerHTML = '<tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    
    try {
      const res = await core.portalFetch('/api/hod/students');
      ALL = res.data || [];
      
      updateStats();
      applyFilter();
    } catch (err) {
      const errRow = `<tr><td colspan="5" class="empty">⚠️ ${esc(err.message)}</td></tr>`;
      $('stu-nd-tbody').innerHTML = errRow;
      $('stu-hnd-tbody').innerHTML = errRow;
    }
  }

  $('stu-search')?.addEventListener('input', applyFilter);
  $('stu-level')?.addEventListener('change', applyFilter);
  $('stu-refresh')?.addEventListener('click', load);

  load();
})();
</script>
