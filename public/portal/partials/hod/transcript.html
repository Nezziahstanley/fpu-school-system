<!-- Portal → HOD → Transcript -->
<div style="padding:0;" id="main-view">

  <div class="no-print" style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Broad Sheet</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Generate the official Result Sheet for a class</p>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="no-print" style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;margin-bottom:1.25rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;">
    <div>
      <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:.35rem;">Level</label>
      <select id="bs-level" style="padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;min-width:120px;">
        <option value="ND 1">ND 1</option>
        <option value="ND 2">ND 2</option>
        <option value="HND 1">HND 1</option>
        <option value="HND 2">HND 2</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:.35rem;">Semester</label>
      <select id="bs-semester" style="padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;min-width:120px;">
        <option value="first">First</option>
        <option value="second">Second</option>
      </select>
    </div>
    <button id="bs-generate" style="padding:.55rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Generate Broad Sheet</button>
    <button id="bs-print" style="padding:.55rem 1.25rem;font-size:.85rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #065f46;border-radius:8px;cursor:pointer;margin-left:auto;">🖨 Print</button>
  </div>

  <!-- Broad Sheet Container -->
  <div id="bs-container" style="background:#fff;padding:2rem;border-radius:12px;border:1px solid #e5e7eb;overflow-x:auto;">
    <div style="text-align:center;padding:3rem;color:#94a3b8;">Select a Level and Semester, then click "Generate Broad Sheet".</div>
  </div>
</div>

<style>
  /* === The Broad Sheet Print Style === */
  #bs-container {
    font-family: 'Times New Roman', Times, serif;
    color: #000;
  }

  .bs-logo {
    width: 70px;
    height: 70px;
    object-fit: contain;
    margin: 0 auto .5rem;
    display: block;
  }

  .bs-header {
    text-align: center;
    border-bottom: 3px solid #000;
    padding-bottom: 1rem;
    margin-bottom: 1rem;
  }

  .bs-header h1 {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: .05em;
    text-transform: uppercase;
  }

  .bs-header h2 {
    margin: .25rem 0 0;
    font-size: 1.1rem;
    font-weight: 800;
    text-transform: uppercase;
    font-style: italic;
  }

  .bs-meta {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    font-size: .78rem;
    margin-bottom: 1rem;
    border-bottom: 2px solid #000;
    padding-bottom: .5rem;
  }

  .bs-meta div strong { font-weight: 800; text-transform: uppercase; }

  .bs-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
    font-family: 'Times New Roman', Times, serif;
  }

  .bs-table th, .bs-table td {
    border: 1px solid #000;
    padding: 3px 4px;
    text-align: center;
    vertical-align: middle;
  }

  .bs-table th {
    background: #f0f0f0;
    font-weight: 800;
    text-transform: uppercase;
    font-size: 8px;
    line-height: 1.1;
  }

  .bs-table td.left {
    text-align: left;
    padding-left: 6px;
  }

  .bs-table td.name {
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
  }

  .bs-table .f {
    background: #fee2e2;
    color: #991b1b;
    font-weight: 800;
  }

  .bs-table .remark {
    font-weight: 800;
    text-transform: uppercase;
    font-size: 8px;
  }

  .bs-sig {
    display: flex;
    justify-content: space-between;
    margin-top: 2rem;
    font-size: 11px;
  }

  .bs-sig div {
    text-align: center;
    width: 30%;
    border-top: 1px solid #000;
    padding-top: .25rem;
    font-weight: 600;
  }

  @media print {
    @page {
      size: A3 landscape;
      margin: 10mm;
    }
    body * { visibility: hidden; }
    #bs-container, #bs-container * { visibility: visible; }
    #bs-container {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      padding: 0;
      border: none;
      box-shadow: none;
    }
    .no-print { display: none !important; }
    .bs-table { font-size: 8px; }
    .bs-table th { font-size: 6px; }
    .bs-table td { padding: 2px 3px; }
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  async function generateSheet() {
    const level = $('bs-level').value;
    const semester = $('bs-semester').value;
    const container = $('bs-container');

    container.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">Generating broad sheet…</div>';

    try {
      const res = await core.portalFetch(`/api/hod/broad-sheet?level=${encodeURIComponent(level)}&semester=${encodeURIComponent(semester)}`);
      const d = res.data || [];
      const courses = res.courses || [];
      const department = res.department || 'Department';

      if (!d.length) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">No students found for this level.</div>';
        return;
      }

      if (!courses.length) {
        container.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">No courses found for this level and semester.</div>';
        return;
      }

      // Build the course header row
      const courseHeaders = courses.map(c => 
        `<th style="min-width:28px;">${esc(c.code)}</th>`
      ).join('');

      // Build the student rows
      const rows = d.map((s, i) => {
        const courseCells = courses.map(c => {
          const grade = s.courseGrades[c.code]?.grade || '-';
          const cls = grade === 'F' ? 'f' : '';
          return `<td class="${cls}">${esc(grade)}</td>`;
        }).join('');

        return `
          <tr>
            <td>${i + 1}</td>
            <td class="left name">${esc(s.matricNumber)}</td>
            <td class="left name">${esc(s.name)}</td>
            ${courseCells}
            <td><strong>${s.tci}</strong></td>
            <td><strong>${s.tgp}</strong></td>
            <td><strong>${s.gpa}</strong></td>
            <td class="remark">${esc(s.remark)}</td>
          </tr>
        `;
      }).join('');

      const semLabel = semester === 'first' ? 'FIRST' : 'SECOND';

      container.innerHTML = `
        <div class="bs-header">
          <img src="/assets/fpu-logo.png" alt="FPU Logo" class="bs-logo" onerror="this.style.display='none'"/>
          <h1>Federal Polytechnic Ugep</h1>
          <h2>Result Sheet (Stream B)</h2>
        </div>

        <div class="bs-meta">
          <div><strong>Department:</strong> ${esc(department)}</div>
          <div><strong>Level:</strong> ${esc(level)}</div>
          <div><strong>Semester:</strong> ${semLabel}</div>
        </div>

        <table class="bs-table">
          <thead>
            <tr>
              <th rowspan="2">S/N</th>
              <th rowspan="2" style="min-width:110px;">Matric No.</th>
              <th rowspan="2" style="min-width:150px;">Student Name</th>
              <th colspan="${courses.length}" style="background:#e0e7ff;">Course Grades</th>
              <th rowspan="2" style="min-width:30px;">TCI</th>
              <th rowspan="2" style="min-width:30px;">TGP</th>
              <th rowspan="2" style="min-width:35px;">GPA</th>
              <th rowspan="2" style="min-width:70px;">Remark</th>
            </tr>
            <tr>
              ${courseHeaders}
            </tr>
          </thead>
          <tbody>
            ${rows}
          </tbody>
        </table>

        <div class="bs-sig">
          <div>HOD, ${esc(department)}</div>
          <div>Dean of School</div>
          <div>Exams Officer</div>
        </div>
      `;

    } catch (err) {
      container.innerHTML = `<div style="text-align:center;padding:3rem;color:#991b1b;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  $('bs-generate')?.addEventListener('click', generateSheet);
  $('bs-print')?.addEventListener('click', () => window.print());
})();
</script>
