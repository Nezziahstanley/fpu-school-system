<!-- Portal → HOD → Transcript -->
<div style="padding:0;">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Department Transcript</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">View student transcripts for your department</p>
    </div>
    <div style="display:flex;gap:.5rem;">
      <button id="tr-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric No.</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Full Name</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Programme</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="tr-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">Loading students…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: View Transcript -->
<div id="tr-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <div>
        <h3 id="tr-modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Student Transcript</h3>
        <p id="tr-modal-sub" style="margin:.2rem 0 0;font-size:.75rem;color:#64748b;"></p>
      </div>
      <button id="tr-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;" id="tr-modal-body">
      <div style="padding:2rem;text-align:center;color:#94a3b8;">Loading results…</div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  async function load() {
    const tbody = $('tr-tbody');
    try {
      const res = await core.portalFetch('/api/hod/transcript');
      const students = res.data || [];

      if (!students.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">No students found in your department.</td></tr>`;
        return;
      }

      tbody.innerHTML = students.map(s => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;">${esc(s.matricNumber || '—')}</code></td>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(s.lastName)}, ${esc(s.firstName)}</td>
          <td style="padding:.65rem .75rem;text-align:center;"><span class="chip chip-${(s.level || '').toLowerCase()}">${esc(s.level || '—')}</span></td>
          <td style="padding:.65rem .75rem;color:#475569;">${esc(s.programmeName || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:right;">
            <button class="btn-view" data-id="${s.id}" data-name="${esc(s.firstName)} ${esc(s.lastName)}" data-matric="${esc(s.matricNumber)}" style="background:#eff6ff;color:#1e40af;padding:.35rem .7rem;border-radius:6px;border:none;cursor:pointer;font-size:.72rem;font-weight:700;">View Transcript</button>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('.btn-view').forEach(btn => {
        btn.addEventListener('click', () => openTranscriptModal(btn.dataset.id, btn.dataset.name, btn.dataset.matric));
      });

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  async function openTranscriptModal(studentId, name, matric) {
    $('tr-modal').style.display = 'flex';
    $('tr-modal-title').textContent = name;
    $('tr-modal-sub').textContent = matric;
    
    const body = $('tr-modal-body');
    body.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">Loading results…</div>';

    try {
      const res = await core.portalFetch(`/api/hod/student-results/${studentId}`);
      const results = res.data || [];

      if (!results.length) {
        body.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">No results found for this student.</div>';
        return;
      }

      body.innerHTML = `
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.5rem .75rem;text-align:left;">Course</th>
              <th style="padding:.5rem .75rem;text-align:center;">Score</th>
              <th style="padding:.5rem .75rem;text-align:center;">Grade</th>
              <th style="padding:.5rem .75rem;text-align:center;">Status</th>
            </tr>
          </thead>
          <tbody>
            ${results.map(r => `
              <tr style="border-bottom:1px solid #f1f5f9;">
                <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong> - ${esc(r.courseTitle)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
                <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
                <td style="padding:.65rem .75rem;text-align:center;">
                  <span class="chip" style="background:#d1fae5;color:#065f46;text-transform:capitalize;">${esc(r.status)}</span>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    } catch (err) {
      body.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  function closeModal() {
    $('tr-modal').style.display = 'none';
  }

  $('tr-refresh')?.addEventListener('click', load);
  $('tr-modal-close')?.addEventListener('click', closeModal);
  $('tr-modal')?.addEventListener('click', (e) => { if (e.target.id === 'tr-modal') closeModal(); });

  load();
})();
</script>
