<style id="hod-unified-design">#main-view,.hod-page,#main-view *{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif}#main-view h1,#main-view h2,#main-view h3,#main-view h4{letter-spacing:-.025em;font-weight:750}#main-view .page-head,#main-view .greeting{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.25rem 1.5rem;margin:0 0 1.25rem;border-radius:18px;background:linear-gradient(120deg,#064e3b 0%,#087653 58%,#10a16e 100%);box-shadow:0 12px 28px rgba(6,78,59,.13);color:#fff}#main-view .page-head h1,#main-view .page-head h2,#main-view .greeting h1,#main-view .greeting h2{color:#fff!important;margin:0;font-size:clamp(1.2rem,2.4vw,1.65rem);line-height:1.2}#main-view .page-head p,#main-view .greeting .sub{color:#d9f5e8!important;margin:.35rem 0 0}#main-view .page-head .actions{display:flex;gap:.55rem;flex-wrap:wrap}#main-view .stat-grid{gap:1rem}#main-view .stat,#main-view .panel,#main-view .filter-bar{border-radius:14px}#main-view .panel{overflow:hidden}#main-view .panel-head{padding:1rem 1.15rem}#main-view .data-table th{font-size:.7rem;letter-spacing:.065em;text-transform:uppercase}#main-view input,#main-view select,#main-view textarea,#main-view button{font:inherit}@media(max-width:640px){#main-view .page-head,#main-view .greeting{padding:1.05rem;border-radius:14px}#main-view .page-head .actions{width:100%}}</style>

<style id="hod-section-hero-style">.hod-section-hero{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:1.25rem 1.5rem;margin:0 0 1.25rem;border-radius:18px;background:linear-gradient(120deg,#064e3b 0%,#087653 58%,#10a16e 100%);box-shadow:0 12px 28px rgba(6,78,59,.13);color:#fff}.hod-section-hero h2{margin:0!important;color:#fff!important;font-size:clamp(1.2rem,2.4vw,1.65rem);font-weight:800;line-height:1.2}.hod-section-hero p{margin:.35rem 0 0!important;color:#d9f5e8!important}@media(max-width:640px){.hod-section-hero{padding:1.05rem;border-radius:14px}}</style>
<div style="padding:0;" id="main-view">

  <div class="no-print hod-section-hero">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Broad Sheet & Transcripts</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Generate official result sheets and view individual transcripts</p>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="no-print" style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;margin-bottom:1.25rem;display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end;">
    <div>
      <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:.35rem;">Level</label>
      <select id="bs-level" style="padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;min-width:120px;">
        <option value="ND 1">ND 1</option>
        <option value="ND 2">ND 2</option>
        <option value="HND 1">HND 1</option>
        <option value="HND 2">HND 2</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:.35rem;">Semester</label>
      <select id="bs-semester" style="padding:.55rem .75rem;border:1px solid #cbd5e1;border-radius:8px;font-size:.85rem;min-width:160px;">
        <option value="first">First Semester</option>
        <option value="second">Second Semester</option>
        <option value="both" selected>Both Semesters (Full Session)</option>
      </select>
    </div>
    <button id="bs-generate" type="button" style="padding:.55rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Generate Broad Sheet</button>
    <button id="bs-export" type="button" style="padding:.55rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:1px solid #065f46;border-radius:8px;cursor:pointer;margin-left:auto;">↓ Export CSV</button><button id="bs-print" type="button" style="padding:.55rem 1.25rem;font-size:.85rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #065f46;border-radius:8px;cursor:pointer;">🖨 Print</button>
  </div>

  <div id="bs-container" style="background:#fff;padding:2rem;border-radius:12px;border:1px solid #e5e7eb;overflow-x:auto;">
    <div style="text-align:center;padding:3rem;color:#94a3b8;">Select a Level and Semester, then click "Generate Broad Sheet".</div>
  </div>
</div>

<!-- ═══════ INDIVIDUAL STUDENT DRAWER ═══════ -->
<div id="student-drawer" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;justify-content:flex-end;">
  <div style="background:#fff;width:100%;max-width:650px;height:100vh;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.3);">
    <div class="no-print" style="padding:1rem 1.25rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <div>
        <h3 style="margin:0;font-size:1rem;font-weight:800;color:#0f172a;" id="drawer-title">Student Transcript</h3>
        <div style="font-size:.75rem;color:#64748b;" id="drawer-sub"></div>
      </div>
      <div style="display:flex;gap:.5rem;">
        <button type="button" id="drawer-print" style="background:#065f46;color:#fff;border:none;padding:.4rem .8rem;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer;">🖨 Print</button>
        <button type="button" id="drawer-close" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
      </div>
    </div>
    <div style="padding:1.25rem;" id="drawer-body">
      <div style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</div>
    </div>
  </div>
</div>

<style>

    font-family: 'Times New Roman', Times, serif;
    color: #000;
  }

    position: relative;
    background: #fff;

    display: block;
  }

  }

  /* FPU GREEN HEADER */

</style>

<script>
console.log('[Broad Sheet] Script loaded.');

(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const esc = value => {
    const text = String(value == null ? '' : value);
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };
  let LAST_BS = null;

  function whenReady(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
    else fn();
  }

  whenReady(function () {
    const levelSel  = document.getElementById('bs-level');
    const semSel    = document.getElementById('bs-semester');
    const genBtn    = document.getElementById('bs-generate');
    const printBtn  = document.getElementById('bs-print');
    const container = document.getElementById('bs-container');

    if (!genBtn || !container) return;

    genBtn.addEventListener('click', async function (e) {
      e.preventDefault();
      
      const fullLevel = levelSel.value;
      const semester = semSel.value;
      const parts = String(fullLevel).split(' ');
      const baseLevel = parts[0] || 'ND';
      const yearNum = parts[1] || '1';

      LAST_BS = null;
      container.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">Generating broad sheet…</div>';

      try {
        const res = await core.portalFetch(
          `/api/hod/broad-sheet?level=${encodeURIComponent(baseLevel)}&year=${encodeURIComponent(yearNum)}&semester=${encodeURIComponent(semester)}`
        );

        const d = res.data || [];
        const coursesFirst = res.coursesFirst || [];
        const coursesSecond = res.coursesSecond || [];
        const department = res.department || 'Department';
        const levelLabel = res.levelLabel || fullLevel;

        if (!d.length) {
          LAST_BS = null;
          container.innerHTML = '<div style="text-align:center;padding:3rem;color:#94a3b8;">No students found.</div>';
          return;
        }
        LAST_BS = { data:d, coursesFirst, coursesSecond, department, levelLabel, semester };

        let bodyHtml = '';
        let titleLine = '';

        if (semester === 'both') {
          titleLine = 'FULL SESSION (FIRST + SECOND SEMESTER) RESULT SHEET';
          bodyHtml = renderBothSemesters(d, coursesFirst, coursesSecond, department);
        } else {
          const courses = semester === 'first' ? coursesFirst : coursesSecond;
          titleLine = (semester === 'first' ? 'FIRST' : 'SECOND') + ' SEMESTER RESULT SHEET';
          bodyHtml = renderSingleSemester(d, courses, semester);
        }

        container.innerHTML = `
          <div class="bs-paper">
            <div class="bs-watermark">
              <img src="/images/logo.png" alt="" onerror="this.style.display='none'"/>
            </div>
            <div class="bs-content">
              <div class="bs-header">
                <img src="/images/logo.png" alt="FPU Logo" class="bs-logo" onerror="this.style.display='none'"/>
                <div class="bs-title">
                  <h1>Federal Polytechnic Ugep</h1>
                  <h2>${titleLine}</h2>
                </div>
              </div>

              <div class="bs-meta">
                <div><strong>Department:</strong> ${esc(department)}</div>
                <div><strong>Level:</strong> ${esc(levelLabel)}</div>
                <div><strong>Semester:</strong> ${semester === 'both' ? 'FIRST + SECOND' : (semester === 'first' ? 'FIRST' : 'SECOND')}</div>
              </div>

              ${bodyHtml}

              <div class="bs-sig">
                <div>HOD, ${department}</div>
                <div>Dean of School</div>
                <div>Exams Officer</div>
              </div>
            </div>
          </div>
        `;
        container.querySelectorAll('.bs-row-hover').forEach(row => {
          row.addEventListener('click', () => window.__bsViewStudent(Number(row.dataset.studentId), row.dataset.studentName || '', row.dataset.studentMatric || ''));
        });

      } catch (err) {
        LAST_BS = null;
        console.error('[Broad Sheet] Error:', err);
        container.innerHTML = `<div style="text-align:center;padding:3rem;color:#991b1b;">⚠️ ${esc(err.message)}</div>`;
      }
    });

    // --- Single semester renderer ---
    function renderSingleSemester(data, courses, semester) {
      const courseHeaders = courses.map(c => `<th style="min-width:28px;">${esc(c.code)}</th>`).join('');

      const rows = data.map((s, i) => {
        const semData = semester === 'first' ? s.first : s.second;
        const courseCells = courses.map(c => {
          const grade = semData.grades[c.code]?.grade || '-';
          const cls = grade === 'F' ? 'f' : '';
          return `<td class="${cls}">${esc(grade)}</td>`;
        }).join('');
        return `
          <tr class="bs-row-hover" data-student-id="${esc(s.id)}" data-student-name="${esc(s.name)}" data-student-matric="${esc(s.matricNumber)}">
            <td>${i + 1}</td>
            <td class="left name">${esc(s.matricNumber)}</td>
            <td class="left name">${esc(s.name)}</td>
            ${courseCells}
            <td><strong>${esc(semData.tci)}</strong></td>
            <td><strong>${esc(semData.tgp)}</strong></td>
            <td><strong>${esc(semData.gpa)}</strong></td>
            <td class="remark">${esc(s.remark)}</td>
          </tr>
        `;
      }).join('');

      return `
        <table class="bs-table">
          <thead>
            <tr>
              <th rowspan="2">S/N</th>
              <th rowspan="2" style="min-width:110px;">Matric No.</th>
              <th rowspan="2" style="min-width:150px;">Student Name</th>
              <th colspan="${courses.length}" style="background:#e0e7ff;">Course Grades</th>
              <th rowspan="2" style="min-width:30px;">TCI</th>
              <th rowspan="2" style="min-width:30px;">TGP</th>
              <th rowspan="2" style="min-width:35px;">GPA</th>
              <th rowspan="2" style="min-width:70px;">Remark</th>
            </tr>
            <tr>${courseHeaders}</tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    // --- Both semesters renderer (side-by-side) ---
    function renderBothSemesters(data, coursesFirst, coursesSecond, department) {
      return `
        <div class="bs-two-col">
          <div class="bs-sem-block">
            <h3>First Semester</h3>
            ${renderMiniTable(data, coursesFirst, 'first')}
          </div>
          <div class="bs-sem-block">
            <h3>Second Semester</h3>
            ${renderMiniTable(data, coursesSecond, 'second')}
          </div>
        </div>

        <!-- Combined summary -->
        <div style="margin-top:1rem;border:1px solid #000;padding:.5rem;">
          <h3 style="margin:0 0 .5rem;font-size:11px;font-weight:800;text-transform:uppercase;text-align:center;background:#ecfdf5;color:#065f46;padding:4px;border:1px solid #065f46;">Combined Session Summary</h3>
          <table class="bs-table" style="width:100%;">
            <thead>
              <tr>
                <th rowspan="2">S/N</th>
                <th rowspan="2" style="min-width:110px;">Matric No.</th>
                <th rowspan="2" style="min-width:150px;">Student Name</th>
                <th colspan="3">First Sem</th>
                <th colspan="3">Second Sem</th>
                <th colspan="3">Overall</th>
                <th rowspan="2">Remark</th>
              </tr>
              <tr>
                <th>TCI</th><th>TGP</th><th>GPA</th>
                <th>TCI</th><th>TGP</th><th>GPA</th>
                <th>TCI</th><th>TGP</th><th>CGPA</th>
              </tr>
            </thead>
            <tbody>
              ${data.map((s, i) => `
                <tr class="bs-row-hover" data-student-id="${esc(s.id)}" data-student-name="${esc(s.name)}" data-student-matric="${esc(s.matricNumber)}">
                  <td>${i + 1}</td>
                  <td class="left name">${esc(s.matricNumber)}</td>
                  <td class="left name">${esc(s.name)}</td>
                  <td>${esc(s.first.tci)}</td>
                  <td>${esc(s.first.tgp)}</td>
                  <td><strong>${esc(s.first.gpa)}</strong></td>
                  <td>${esc(s.second.tci)}</td>
                  <td>${esc(s.second.tgp)}</td>
                  <td><strong>${esc(s.second.gpa)}</strong></td>
                  <td>${esc(s.tciTotal)}</td>
                  <td>${esc(s.tgpTotal)}</td>
                  <td><strong>${esc(s.cgpa)}</strong></td>
                  <td class="remark">${esc(s.remark)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // --- Per-semester mini table (used inside side-by-side view) ---
    function renderMiniTable(data, courses, semester) {
      if (!courses.length) return '<div style="padding:1rem;text-align:center;color:#94a3b8;">No courses.</div>';

      const headers = courses.map(c => `<th style="min-width:24px;">${esc(c.code)}</th>`).join('');

      const rows = data.map((s, i) => {
        const sem = semester === 'first' ? s.first : s.second;
        const cells = courses.map(c => {
          const grade = sem.grades[c.code]?.grade || '-';
          const cls = grade === 'F' ? 'f' : '';
          return `<td class="${cls}">${esc(grade)}</td>`;
        }).join('');
        return `
          <tr class="bs-row-hover" data-student-id="${esc(s.id)}" data-student-name="${esc(s.name)}" data-student-matric="${esc(s.matricNumber)}">
            <td>${i + 1}</td>
            <td class="left name" style="font-size:8px;">${esc(s.matricNumber)}</td>
            <td class="left name" style="font-size:8px;">${esc(s.name)}</td>
            ${cells}
            <td><strong>${esc(sem.tci)}</strong></td>
            <td><strong>${esc(sem.tgp)}</strong></td>
            <td><strong>${esc(sem.gpa)}</strong></td>
          </tr>
        `;
      }).join('');

      return `
        <table class="bs-table">
          <thead>
            <tr>
              <th rowspan="2">S/N</th>
              <th rowspan="2" style="min-width:90px;">Matric</th>
              <th rowspan="2" style="min-width:120px;">Name</th>
              <th colspan="${courses.length}" style="background:#e0e7ff;">Grades</th>
              <th rowspan="2" style="min-width:22px;">TCI</th>
              <th rowspan="2" style="min-width:22px;">TGP</th>
              <th rowspan="2" style="min-width:28px;">GPA</th>
            </tr>
            <tr>${headers}</tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }


    function csvCell(value) {
      let text = String(value == null ? '' : value);
      if (/^\s*[=+@-]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    }

    function exportBroadSheet() {
      if (!LAST_BS || !LAST_BS.data.length) {
        core.showToast && core.showToast('Generate a broad sheet before exporting.', 'warning');
        return;
      }
      const data = LAST_BS.data;
      const coursesFirst = LAST_BS.coursesFirst;
      const coursesSecond = LAST_BS.coursesSecond;
      const semester = LAST_BS.semester;
      let rows;
      let filename;

      if (semester === 'both') {
        const headers = ['S/N','Matric Number','Student Name']
          .concat(coursesFirst.map(course => 'First ' + course.code))
          .concat(['First TCI','First TGP','First GPA'])
          .concat(coursesSecond.map(course => 'Second ' + course.code))
          .concat(['Second TCI','Second TGP','Second GPA','Overall TCI','Overall TGP','CGPA','Remark']);
        rows = [headers].concat(data.map((student,index) => [
          index + 1, student.matricNumber, student.name,
          ...coursesFirst.map(course => student.first.grades[course.code]?.grade || '-'),
          student.first.tci, student.first.tgp, student.first.gpa,
          ...coursesSecond.map(course => student.second.grades[course.code]?.grade || '-'),
          student.second.tci, student.second.tgp, student.second.gpa,
          student.tciTotal, student.tgpTotal, student.cgpa, student.remark
        ]));
        filename = 'hod-full-session-broad-sheet.csv';
      } else {
        const courses = semester === 'first' ? coursesFirst : coursesSecond;
        const key = semester === 'first' ? 'first' : 'second';
        const headers = ['S/N','Matric Number','Student Name']
          .concat(courses.map(course => course.code))
          .concat(['TCI','TGP','GPA','Remark']);
        rows = [headers].concat(data.map((student,index) => {
          const sem = student[key];
          return [index + 1, student.matricNumber, student.name]
            .concat(courses.map(course => sem.grades[course.code]?.grade || '-'))
            .concat([sem.tci,sem.tgp,sem.gpa,student.remark]);
        }));
        filename = 'hod-' + semester + '-semester-broad-sheet.csv';
      }

      const csv = '\uFEFF' + rows.map(row => row.map(csvCell).join(',')).join('\r\n');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    document.getElementById('bs-export')?.addEventListener('click', exportBroadSheet);

    printBtn.addEventListener('click', () => window.print());

    window.__bsViewStudent = async function (studentId, name, matric) {
      const drawer = document.getElementById('student-drawer');
      const title  = document.getElementById('drawer-title');
      const sub    = document.getElementById('drawer-sub');
      const body   = document.getElementById('drawer-body');
      if (!drawer) return;
      drawer.style.display = 'flex';
      title.textContent = name;
      sub.textContent = matric;
      body.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</div>';

      try {
        const res = await core.portalFetch(`/api/hod/student-results/${studentId}`);
        const results = res.data || [];
        const student = res.student || {};
        if (!results.length) {
          body.innerHTML = '<div style="padding:2rem;text-align:center;color:#94a3b8;">No results yet.</div>';
          return;
        }

        const grouped = {};
        results.forEach(r => {
          const key = `${r.sessionName || 'Session'} — ${r.semester || 'Semester'}`;
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(r);
        });

        let totalAllUnits = 0, totalAllPoints = 0;
        let html = `
          <div style="text-align:center;margin-bottom:1.5rem;">
            <h2 style="margin:0;font-size:1.15rem;font-weight:800;color:#065f46;">Federal Polytechnic Ugep</h2>
            <p style="margin:.15rem 0 0;color:#64748b;font-size:.78rem;">Official Academic Transcript</p>
            <div style="margin-top:.75rem;padding:.75rem;background:#f8fafc;border-radius:8px;display:inline-block;text-align:left;">
              <div style="font-size:.82rem;"><strong>Name:</strong> ${esc(student.firstName || '')} ${esc(student.lastName || '')}</div>
              <div style="font-size:.82rem;"><strong>Matric:</strong> ${esc(student.matricNumber || '')}</div>
              <div style="font-size:.82rem;"><strong>Level:</strong> ${esc(student.level || '')}</div>
            </div>
          </div>
        `;

        for (const [title, rows] of Object.entries(grouped)) {
          let totalUnits = 0, totalPoints = 0;
          const rowsHtml = rows.map(r => {
            const unit = Number(r.unit) || 0;
            const points = Number(r.points) || 0;
            totalUnits += unit;
            totalPoints += (unit * points);
            return `
              <tr>
                <td style="padding:.5rem .75rem;border-bottom:1px solid #e5e7eb;">${esc(r.courseCode)}</td>
                <td style="padding:.5rem .75rem;border-bottom:1px solid #e5e7eb;">${esc(r.courseTitle)}</td>
                <td style="padding:.5rem .75rem;border-bottom:1px solid #e5e7eb;text-align:center;">${unit}</td>
                <td style="padding:.5rem .75rem;border-bottom:1px solid #e5e7eb;text-align:center;">${r.score != null ? Number(r.score).toFixed(1) : '—'}</td>
                <td style="padding:.5rem .75rem;border-bottom:1px solid #e5e7eb;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade || '—')}</td>
                <td style="padding:.5rem .75rem;border-bottom:1px solid #e5e7eb;text-align:center;">${points}</td>
              </tr>
            `;
          }).join('');
          const gpa = totalUnits > 0 ? (totalPoints / totalUnits).toFixed(2) : '0.00';
          totalAllUnits += totalUnits;
          totalAllPoints += totalPoints;
          html += `
            <div style="margin-bottom:1.5rem;">
              <h3 style="margin:0 0 .5rem;font-size:.95rem;font-weight:800;color:#065f46;border-bottom:2px solid #065f46;padding-bottom:.35rem;">${esc(title)}</h3>
              <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
                <thead>
                  <tr style="background:#f8fafc;">
                    <th style="padding:.5rem .75rem;text-align:left;font-size:.65rem;">Code</th>
                    <th style="padding:.5rem .75rem;text-align:left;font-size:.65rem;">Title</th>
                    <th style="padding:.5rem .75rem;text-align:center;font-size:.65rem;">Units</th>
                    <th style="padding:.5rem .75rem;text-align:center;font-size:.65rem;">Score</th>
                    <th style="padding:.5rem .75rem;text-align:center;font-size:.65rem;">Grade</th>
                    <th style="padding:.5rem .75rem;text-align:center;font-size:.65rem;">Points</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
                <tfoot>
                  <tr style="background:#f8fafc;">
                    <td colspan="2" style="padding:.5rem .75rem;font-weight:800;text-align:right;">Total</td>
                    <td style="padding:.5rem .75rem;font-weight:800;text-align:center;">${totalUnits}</td>
                    <td colspan="2" style="padding:.5rem .75rem;font-weight:800;text-align:right;">GPA:</td>
                    <td style="padding:.5rem .75rem;font-weight:800;text-align:center;color:#065f46;">${gpa}</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          `;
        }

        const cgpa = totalAllUnits > 0 ? (totalAllPoints / totalAllUnits).toFixed(2) : '0.00';
        html += `
          <div style="margin-top:1.5rem;padding:1rem;background:#d1fae5;border-radius:8px;text-align:center;">
            <div style="font-size:.75rem;font-weight:800;color:#065f46;text-transform:uppercase;">Cumulative GPA (CGPA)</div>
            <div style="font-size:2rem;font-weight:900;color:#065f46;">${cgpa}</div>
          </div>
        `;
        body.innerHTML = html;
      } catch (err) {
        body.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</div>`;
      }
    };

    const drawerClose = document.getElementById('drawer-close');
    const drawerPrint = document.getElementById('drawer-print');
    const drawerElem  = document.getElementById('student-drawer');
    if (drawerClose) drawerClose.addEventListener('click', () => drawerElem.style.display = 'none');
    if (drawerPrint) drawerPrint.addEventListener('click', () => window.print());
    if (drawerElem) {
      drawerElem.addEventListener('click', (e) => {
        if (e.target.id === 'student-drawer') drawerElem.style.display = 'none';
      });
    }
  });
})();
</script>
