<!-- Portal → Lecturer → Assessments -->
<section class="page-head">
  <div><h2>Assessments</h2><p class="muted small">Draft results awaiting submission</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="window.__lecAssessLoad()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Assessment Rows</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Student</th><th>Course</th><th>Score</th><th>Status</th></tr></thead>
        <tbody id="lec-assess-tbody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__lecAssessLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('lec-assess-tbody');
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/lecturer/assessments');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td>Student ${r.studentId}</td>
          <td>Course ${r.courseId}</td>
          <td class="num">${r.score}</td>
          <td><span class="badge badge-${r.status === 'draft' ? 'muted' : r.status === 'hod_rejected' ? 'danger' : 'info'}">${core.escapeHtml(r.status)}</span></td>
        </tr>
      `).join('') : '<tr><td colspan="4" class="empty">No assessments in progress.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="4" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };
  window.__lecAssessLoad();
</script>
