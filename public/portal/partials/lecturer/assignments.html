<!-- Portal → Lecturer → Assignments -->
<div style="padding:0;" id="main-view">
  
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Assignments</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Post and manage assignments for your courses</p>
    </div>
    <div style="display:flex;gap:.5rem;">
      <button id="new-assignment-btn" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">➕ New Assignment</button>
      <button id="refresh-btn" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;">
      <div style="font-size:1.5rem;font-weight:800;color:#0f172a;" id="stat-total">0</div>
      <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.25rem;">Total</div>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Due Date</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="assignments-tbody">
          <tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══════ GRADE SUBMISSIONS MODAL ═══════ -->
<div id="grade-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;" id="modal-assignment-title">Grade Submissions</h3>
        <div style="font-size:.75rem;color:#64748b;margin-top:.2rem;" id="modal-course-name"></div>
      </div>
      <button id="modal-close" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>
    
    <div style="flex:1;overflow-y:auto;padding:1rem;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Submission</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;width:100px;">Score</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="modal-tbody">
          <tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">Loading submissions…</td></tr>
        </tbody>
      </table>
    </div>
    
    <div style="padding:1rem 1.4rem;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;background:#f8fafc;border-radius:0 0 16px 16px;">
      <button id="modal-close-btn" style="padding:.55rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Close</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_ASSIGNMENTS = [];
  let CURRENT_ASSIGNMENT = null;

  async function loadAssignments() {
    const tbody = $('assignments-tbody');
    tbody.innerHTML = '<tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;">Loading assignments…</td></tr>';

    try {
      const res = await core.portalFetch('/api/lecturer/assignments');
      ALL_ASSIGNMENTS = res.data || [];
      $('stat-total').textContent = ALL_ASSIGNMENTS.length;

      if (!ALL_ASSIGNMENTS.length) {
        tbody.innerHTML = '<tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;">No assignments found.</td></tr>';
        return;
      }

      tbody.innerHTML = ALL_ASSIGNMENTS.map(a => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(a.title)}</td>
          <td style="padding:.65rem .75rem;"><strong>${esc(a.courseCode)}</strong></td>
          <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${a.dueDate ? new Date(a.dueDate).toLocaleDateString() : '—'}</td>
          <td style="padding:.65rem .75rem;text-align:right;">
            <button onclick="window.__openGradeModal(${a.id}, '${esc(a.title)}')" style="padding:.35rem .75rem;font-size:.72rem;font-weight:700;background:#e0e7ff;color:#3730a3;border:none;border-radius:6px;cursor:pointer;">Grade</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  window.__openGradeModal = async function(assignmentId, title) {
    CURRENT_ASSIGNMENT = assignmentId;
    $('modal-assignment-title').textContent = `Grade: ${title}`;
    $('grade-modal').style.display = 'flex';
    
    const tbody = $('modal-tbody');
    tbody.innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">Loading submissions…</td></tr>';

    try {
      const res = await core.portalFetch(`/api/lecturer/assignments/${assignmentId}/submissions`);
      const submissions = res.data || [];

      if (!submissions.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">No submissions yet.</td></tr>';
        return;
      }

      tbody.innerHTML = submissions.map(s => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(s.studentName)}</td>
          <td style="padding:.65rem .75rem;"><code>${esc(s.matricNumber)}</code></td>
          <td style="padding:.65rem .75rem;color:#475569;font-size:.75rem;">
            ${s.submissionUrl ? `<a href="${esc(s.submissionUrl)}" target="_blank" style="color:#1e40af;text-decoration:underline;">View File</a>` : 'Text Only'}
          </td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <input type="number" id="score-${s.id}" value="${s.score || ''}" placeholder="Score" style="width:70px;padding:.3rem;text-align:center;border:1px solid #cbd5e1;border-radius:4px;" />
          </td>
          <td style="padding:.65rem .75rem;text-align:right;">
            <button onclick="window.__saveGrade(${s.id})" style="padding:.35rem .75rem;font-size:.72rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;">Save</button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  };

  window.__saveGrade = async function(submissionId) {
    const scoreInput = $(`score-${submissionId}`);
    const score = Number(scoreInput.value);

    if (isNaN(score) || score < 0) {
      core.showToast('Please enter a valid score.', 'error');
      return;
    }

    try {
      await core.portalFetch(`/api/lecturer/submissions/${submissionId}/grade`, {
        method: 'POST',
        body: { score }
      });
      core.showToast('Grade saved successfully.', 'success');
    } catch (err) {
      core.showToast(err.message, 'error');
    }
  };

  $('modal-close')?.addEventListener('click', () => $('grade-modal').style.display = 'none');
  $('modal-close-btn')?.addEventListener('click', () => $('grade-modal').style.display = 'none');
  $('refresh-btn')?.addEventListener('click', loadAssignments);
  $('new-assignment-btn')?.addEventListener('click', () => core.showToast('New assignment modal coming soon.', 'info'));

  // Init
  loadAssignments();
})();
</script>
