<!-- Portal → Lecturer → Attendance -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Attendance</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">View and manage attendance records</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap; align-items:center;">
      <input type="text" id="att-search" placeholder="Search name, matric, course..." style="padding:.55rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;width:240px;" />
      <button id="att-take" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
        display:inline-flex;align-items:center;gap:.35rem;
      ">✅ Take Attendance</button>
      <button id="att-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📋</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="att-total">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Total Records</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">✅</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="att-present">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Present</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;color:#991b1b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">❌</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="att-absent">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Absent</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">⏰</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="att-late">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Late</div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Attendance Records <span id="att-count" style="display:inline-block;background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.65rem;margin-left:.35rem;">0</span>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Date</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
          </tr>
        </thead>
        <tbody id="att-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:attSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading attendance…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: TAKE ATTENDANCE ═══════ -->
<div id="att-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Take Attendance</h3>
      <button id="att-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <!-- Form -->
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:.75rem;margin-bottom:1rem;">
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Course</label>
          <select id="att-course" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
            <option value="">Select Course</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Date</label>
          <input type="date" id="att-date" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Semester</label>
          <select id="att-semester" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
            <option value="first">First</option>
            <option value="second">Second</option>
          </select>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-start;margin-bottom:1rem;">
        <button id="att-load-students" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Load Students</button>
      </div>

      <!-- Student List Header -->
      <div id="att-header" style="display:none;background:#f8fafc;border:1px solid #e5e7eb;border-bottom:none;border-radius:8px 8px 0 0;padding:.65rem 1rem;font-size:.75rem;font-weight:800;color:#64748b;text-transform:uppercase;align-items:center;justify-content:space-between;">
        <div>Student</div>
        <div style="display:flex;gap:1rem;align-items:center;">
          <span>Mark All:</span>
          <label style="display:inline-flex;align-items:center;gap:.3rem;cursor:pointer;font-weight:600;text-transform:none;color:#065f46;">
            <input type="checkbox" id="att-bulk-present" /> Present
          </label>
          <label style="display:inline-flex;align-items:center;gap:.3rem;cursor:pointer;font-weight:600;text-transform:none;color:#991b1b;">
            <input type="checkbox" id="att-bulk-absent" /> Absent
          </label>
          <label style="display:inline-flex;align-items:center;gap:.3rem;cursor:pointer;font-weight:600;text-transform:none;color:#92400e;">
            <input type="checkbox" id="att-bulk-late" /> Late
          </label>
        </div>
      </div>

      <!-- Student List -->
      <div id="att-student-list" style="border:1px solid #e5e7eb;border-radius:8px;max-height:400px;overflow-y:auto;">
        <div style="padding:3rem;text-align:center;color:#94a3b8;font-size:.85rem;">Select a course to load students.</div>
      </div>

      <!-- Action Buttons -->
      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="att-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="att-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;" disabled>Save Attendance</button>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes attSpin { to { transform: rotate(360deg); } }
  #att-tbody tr { transition: background .1s; }
  #att-tbody tr:hover { background: #f8fafc; }
  .att-student-row { display:flex; align-items:center; justify-content:space-between; padding:.65rem 1rem; border-bottom:1px solid #f1f5f9; }
  .att-student-row:last-child { border-bottom:none; }
  .att-radio-group { display:flex; gap:.5rem; }
  .att-radio-group label { display:inline-flex; align-items:center; gap:.3rem; font-size:.78rem; font-weight:600; cursor:pointer; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_COURSES = [];
  let CURRENT_STUDENTS = [];
  let ALL_RECORDS = []; // Global cache for the search bar

  // --- Load Attendance Records ---
  async function loadRecords() {
    const tbody = $('att-tbody');
    tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:attSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading attendance…</div>
    </td></tr>`;

    try {
      const res = await core.portalFetch('/api/lecturer/attendance');
      ALL_RECORDS = res.data || [];

      let present = 0, absent = 0, late = 0;
      ALL_RECORDS.forEach(r => {
        if (r.status === 'present') present++;
        else if (r.status === 'absent') absent++;
        else if (r.status === 'late') late++;
      });

      $('att-total').textContent = ALL_RECORDS.length;
      $('att-present').textContent = present;
      $('att-absent').textContent = absent;
      $('att-late').textContent = late;
      $('att-count').textContent = ALL_RECORDS.length;

      renderTable(ALL_RECORDS);

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${err.message}</td></tr>`;
    }
  }

  // --- Render Table (Filtered or Full) ---
  function renderTable(rows) {
    const tbody = $('att-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">No attendance records found matching your search.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(r => {
      const fullName = `${r.studentFirstName || ''} ${r.studentLastName || ''}`.trim();
      let badgeColor = '#f1f5f9'; let badgeFg = '#334155';
      if (r.status === 'present') { badgeColor = '#d1fae5'; badgeFg = '#065f46'; }
      if (r.status === 'absent') { badgeColor = '#fee2e2'; badgeFg = '#991b1b'; }
      if (r.status === 'late') { badgeColor = '#fef3c7'; badgeFg = '#92400e'; }

      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-size:.78rem;color:#475569;">${esc(r.date)}</td>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(fullName)}</td>
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(r.matricNumber || '—')}</code></td>
          <td style="padding:.65rem .75rem;">
            <div style="font-weight:700;color:#0f172a;font-size:.8rem;">${esc(r.courseCode)}</div>
            <div style="font-size:.7rem;color:#64748b;">${esc(r.courseTitle)}</div>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:${badgeColor};color:${badgeFg};border-radius:5px;text-transform:capitalize;">${esc(r.status)}</span>
          </td>
        </tr>`;
    }).join('');
  }

  // --- Search Filter ---
  function filterRecords() {
    const q = ($('att-search').value || '').toLowerCase();
    if (!q) {
      renderTable(ALL_RECORDS);
      return;
    }

    const filtered = ALL_RECORDS.filter(r => {
      const fullName = `${r.studentFirstName || ''} ${r.studentLastName || ''}`.toLowerCase();
      const matric = (r.matricNumber || '').toLowerCase();
      const course = (r.courseCode || '').toLowerCase();
      const status = (r.status || '').toLowerCase();
      const date = (r.date || '').toLowerCase();

      return fullName.includes(q) || matric.includes(q) || course.includes(q) || status.includes(q) || date.includes(q);
    });

    renderTable(filtered);
  }

  // --- Open Modal ---
  async function openModal() {
    $('att-modal').style.display = 'flex';
    $('att-date').value = new Date().toISOString().split('T')[0];
    $('att-student-list').innerHTML = `<div style="padding:3rem;text-align:center;color:#94a3b8;font-size:.85rem;">Select a course to load students.</div>`;
    $('att-save').disabled = true;
    $('att-header').style.display = 'none';

    const sel = $('att-course');
    sel.innerHTML = '<option value="">Loading courses…</option>';

    try {
      const res = await core.portalFetch('/api/lecturer/courses');
      const rows = Array.isArray(res) ? res : (res.data || []);
      
      ALL_COURSES = rows;

      if (!ALL_COURSES.length) {
        sel.innerHTML = '<option value="">No courses assigned</option>';
        return;
      }

      sel.innerHTML = '<option value="">Select Course</option>' + 
        ALL_COURSES.map(c => `<option value="${c.id}">${c.code} - ${c.title}</option>`).join('');
        
    } catch (err) {
      sel.innerHTML = '<option value="">Error loading courses</option>';
      core.showToast && core.showToast('Failed to load courses: ' + err.message, 'error');
    }
  }

  function closeModal() {
    $('att-modal').style.display = 'none';
  }

  // --- Load Students ---
  async function loadStudents() {
    const courseId = $('att-course').value;
    if (!courseId) return core.showToast && core.showToast('Please select a course.', 'warning');

    const list = $('att-student-list');
    list.innerHTML = `<div style="padding:3rem;text-align:center;color:#94a3b8;font-size:.85rem;">Loading students…</div>`;
    $('att-header').style.display = 'none';

    try {
      const res = await core.portalFetch(`/api/lecturer/students?courseId=${courseId}`);
      const rows = res.data || [];
      CURRENT_STUDENTS = rows.map(r => r.student).filter(Boolean);

      if (!CURRENT_STUDENTS.length) {
        list.innerHTML = `<div style="padding:3rem;text-align:center;color:#94a3b8;font-size:.85rem;">No approved students found for this course.</div>`;
        $('att-save').disabled = true;
        return;
      }

      list.innerHTML = CURRENT_STUDENTS.map(s => `
        <div class="att-student-row">
          <div>
            <div style="font-weight:700;color:#0f172a;font-size:.85rem;">${esc(s.firstName)} ${esc(s.lastName)}</div>
            <div style="font-size:.72rem;color:#64748b;">${esc(s.matricNumber || '—')}</div>
          </div>
          <div class="att-radio-group" data-id="${s.id}">
            <label><input type="radio" name="status_${s.id}" value="present" checked /> Present</label>
            <label><input type="radio" name="status_${s.id}" value="absent" /> Absent</label>
            <label><input type="radio" name="status_${s.id}" value="late" /> Late</label>
          </div>
        </div>
      `).join('');

      $('att-save').disabled = false;
      $('att-header').style.display = 'flex';

    } catch (err) {
      list.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;font-size:.85rem;">⚠️ ${err.message}</div>`;
      $('att-save').disabled = true;
    }
  }

  // --- Bulk Select ---
  function setAllStatus(status) {
    CURRENT_STUDENTS.forEach(s => {
      const radio = document.querySelector(`input[name="status_${s.id}"][value="${status}"]`);
      if (radio) radio.checked = true;
    });
    
    ['present', 'absent', 'late'].forEach(v => {
      if (v !== status) {
        const cb = $(`att-bulk-${v}`);
        if (cb) cb.checked = false;
      }
    });

    core.showToast && core.showToast(`All students marked ${status}.`, 'success');
  }

  // --- Save Attendance ---
  async function saveAttendance() {
    const courseId = $('att-course').value;
    const date = $('att-date').value;
    const semester = $('att-semester').value;

    if (!courseId || !date) return core.showToast && core.showToast('Course and date are required.', 'warning');
    if (!CURRENT_STUDENTS.length) return core.showToast && core.showToast('No students to save.', 'warning');

    const rows = CURRENT_STUDENTS.map(s => {
      const checked = document.querySelector(`input[name="status_${s.id}"]:checked`);
      return {
        courseId: Number(courseId),
        studentId: s.id,
        date: date,
        semester: semester,
        status: checked ? checked.value : 'present',
      };
    });

    const btn = $('att-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      await core.portalFetch('/api/lecturer/attendance/bulk', {
        method: 'POST',
        body: { rows },
      });
      core.showToast && core.showToast('Attendance saved successfully!', 'success');
      closeModal();
      loadRecords();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Attendance';
    }
  }

  // --- Wiring ---
  $('att-take')?.addEventListener('click', openModal);
  $('att-refresh')?.addEventListener('click', loadRecords);
  $('att-modal-close')?.addEventListener('click', closeModal);
  $('att-cancel')?.addEventListener('click', closeModal);
  $('att-load-students')?.addEventListener('click', loadStudents);
  $('att-save')?.addEventListener('click', saveAttendance);
  $('att-modal')?.addEventListener('click', (e) => { if (e.target.id === 'att-modal') closeModal(); });

  // Search wiring
  $('att-search')?.addEventListener('input', filterRecords);

  // Bulk actions wiring
  $('att-bulk-present')?.addEventListener('change', (e) => { if (e.target.checked) setAllStatus('present'); });
  $('att-bulk-absent')?.addEventListener('change', (e) => { if (e.target.checked) setAllStatus('absent'); });
  $('att-bulk-late')?.addEventListener('change', (e) => { if (e.target.checked) setAllStatus('late'); });

  loadRecords();
})();
</script>
