<!-- Portal → Lecturer → Courses -->
<section class="page-head">
  <div><h2>My Courses</h2><p class="muted small">All courses allocated to me</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="window.__lecCoursesLoad()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Allocated Courses</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Code</th><th>Title</th><th>Unit</th><th>Semester</th><th>Session ID</th><th></th></tr></thead>
        <tbody id="lec-courses-tbody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__lecCoursesLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('lec-courses-tbody');
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/lecturer/courses');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td>${core.escapeHtml(r.course?.code || '')}</td>
          <td>${core.escapeHtml(r.course?.title || '')}</td>
          <td class="num">${r.course?.unit || 0}</td>
          <td>${core.escapeHtml(r.allocation.semester)}</td>
          <td>${r.allocation.sessionId}</td>
          <td>
            <button class="btn btn-sm btn-outline" onclick="FPU_SPA.navigatePortal('lecturer-students')">Students</button>
            <button class="btn btn-sm btn-primary" onclick="FPU_SPA.navigatePortal('lecturer-results')">Results</button>
          </td>
        </tr>
      `).join('') : '<tr><td colspan="6" class="empty">No courses allocated yet.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="6" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };
  window.__lecCoursesLoad();
</script>
