<!-- Portal → Lecturer → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="lec-dash-avatar">L</div>
    <div>
      <h1>Welcome, <span id="lec-dash-name">Lecturer</span></h1>
      <div class="sub">My Teaching Dashboard</div>
    </div>
  </div>
  <div class="meta">
    <strong id="lec-dash-dept">—</strong>
    <span>Department</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile"><div class="tile-label">My Courses</div><div class="tile-value" id="lec-t-courses">—</div></div>
  <div class="tile tile-blue"><div class="tile-label">My Students</div><div class="tile-value" id="lec-t-students">—</div></div>
  <div class="tile tile-accent"><div class="tile-label">Pending Results</div><div class="tile-value" id="lec-t-pending">—</div></div>
  <div class="tile tile-purple"><div class="tile-label">Today's Classes</div><div class="tile-value" id="lec-t-today">—</div></div>
</div>

<div class="quick-actions">
  <a class="btn btn-primary btn-sm" href="#lecturer-courses">📚 My Courses</a>
  <a class="btn btn-outline btn-sm" href="#lecturer-attendance">✅ Take Attendance</a>
  <a class="btn btn-outline btn-sm" href="#lecturer-results">📊 Enter Results</a>
  <a class="btn btn-outline btn-sm" href="#lecturer-materials">📁 Upload Materials</a>
</div>

<div class="panel">
  <div class="panel-head"><h3>My Courses This Semester</h3></div>
  <div class="panel-body">
    <div id="lec-courses-list" class="muted small">Loading…</div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Pending Result Submissions</h3></div>
  <div class="panel-body">
    <div id="lec-pending-list" class="muted small">Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    const user = core.getPortalUser() || {};
    try {
      document.getElementById('lec-dash-name').textContent = user.firstName || 'Lecturer';
      if (photo) photo.renderMyAvatar(document.getElementById('lec-dash-avatar'), user);

      // Courses assigned to this lecturer
      const coursesRes = await core.portalFetch('/api/lecturers/' + user.id + '/courses');
      const courses = coursesRes.data || coursesRes || [];
      document.getElementById('lec-t-courses').textContent = courses.length;
      const coursesList = document.getElementById('lec-courses-list');
      if (!courses.length) {
        coursesList.innerHTML = '<em>No courses assigned yet.</em>';
      } else {
        coursesList.innerHTML = courses.map(c =>
          `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
             <strong>${c.code || ''}</strong> — ${c.title || 'Untitled'} 
             <span class="muted small">(${c.units || 0} units, ${c.level || ''})</span>
           </div>`).join('');
      }

      // Pending results authored by this lecturer
      const resultsRes = await core.portalFetch('/api/results?lecturerId=' + user.id + '&status=draft');
      const results = resultsRes.data || resultsRes || [];
      document.getElementById('lec-t-pending').textContent = results.length;
      document.getElementById('lec-pending-list').innerHTML = results.length
        ? results.slice(0,5).map(r =>
            `<div style="padding:.4rem 0;"><strong>${r.courseCode||''}</strong> — ${r.sessionName||''} (${r.status||'draft'})</div>`
          ).join('')
        : '<em>Nothing pending. 🎉</em>';

      // Student count (approx — from reports endpoint filtered)
      try {
        const statsRes = await core.portalFetch('/api/reports/overview');
        const s = statsRes.data || {};
        document.getElementById('lec-t-students').textContent = s.students ?? '—';
      } catch { document.getElementById('lec-t-students').textContent = '—'; }

      document.getElementById('lec-t-today').textContent = '—';
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  })();
</script>
