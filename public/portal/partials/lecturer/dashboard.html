<!-- Portal → Lecturer → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="lec-dash-avatar">L</div>
    <div>
      <h1>Welcome, <span id="lec-dash-name">Lecturer</span></h1>
      <div class="sub" id="lec-dash-dept">—</div>
    </div>
  </div>
  <div class="meta">
    <strong id="lec-dash-session">—</strong>
    <span>Current Session</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/></svg></div>
    <div class="tile-label">My Courses</div>
    <div class="tile-value" id="lec-dash-courses">—</div>
    <div class="tile-sub">courses allocated</div>
  </div>
  <div class="tile tile-blue">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 21v-1a6 6 0 0 1 12 0v1"/></svg></div>
    <div class="tile-label">My Students</div>
    <div class="tile-value" id="lec-dash-students">—</div>
    <div class="tile-sub">unique students</div>
  </div>
  <div class="tile tile-accent">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div>
    <div class="tile-label">Pending Results</div>
    <div class="tile-value" id="lec-dash-pending">—</div>
    <div class="tile-sub">drafts awaiting submission</div>
  </div>
  <div class="tile tile-purple">
    <div class="tile-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/></svg></div>
    <div class="tile-label">Notifications</div>
    <div class="tile-value" id="lec-dash-notif">—</div>
    <div class="tile-sub">unread</div>
  </div>
</div>

<div class="quick-actions">
  <a onclick="FPU_SPA.navigatePortal('lecturer-courses')">My Courses</a>
  <a onclick="FPU_SPA.navigatePortal('lecturer-attendance')">Take Attendance</a>
  <a onclick="FPU_SPA.navigatePortal('lecturer-results')">Submit Results</a>
  <a onclick="FPU_SPA.navigatePortal('lecturer-assignments')">Assignments</a>
  <a onclick="FPU_SPA.navigatePortal('lecturer-materials')">Materials</a>
</div>

<div class="panel">
  <div class="panel-head"><h3>My Allocated Courses</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Code</th><th>Title</th><th>Unit</th><th>Semester</th></tr></thead>
        <tbody id="lec-dash-course-tbody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    try {
      const res = await core.portalFetch('/api/lecturer/dashboard');
      const d = res.data || {};
      const lec = d.lecturer || {};

      document.getElementById('lec-dash-name').textContent = `${lec.firstName || ''} ${lec.lastName || ''}`.trim() || 'Lecturer';
      document.getElementById('lec-dash-dept').textContent = lec.department?.name || '—';
      document.getElementById('lec-dash-session').textContent = lec.currentSession?.name || '—';

      if (photo) photo.renderMyAvatar(document.getElementById('lec-dash-avatar'), lec);

      document.getElementById('lec-dash-courses').textContent = d.totalCourses ?? 0;
      document.getElementById('lec-dash-students').textContent = d.totalStudents ?? 0;
      document.getElementById('lec-dash-pending').textContent = d.pendingResults ?? 0;
      document.getElementById('lec-dash-notif').textContent = d.unreadNotifications ?? 0;

      const courses = d.courses || [];
      document.getElementById('lec-dash-course-tbody').innerHTML = courses.length ? courses.map((r) => `
        <tr>
          <td>${core.escapeHtml(r.course?.code || '')}</td>
          <td>${core.escapeHtml(r.course?.title || '')}</td>
          <td class="num">${r.course?.unit || 0}</td>
          <td>${core.escapeHtml(r.allocation?.semester || '')}</td>
        </tr>
      `).join('') : '<tr><td colspan="4" class="empty">No courses allocated yet.</td></tr>';
    } catch (err) { core.showToast(err.message, 'error'); }
  })();
</script>
