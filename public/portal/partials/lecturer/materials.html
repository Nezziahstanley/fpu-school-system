<!-- Portal → Lecturer → Materials -->
<div style="padding:0;">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Course Materials</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Upload and manage learning materials for your courses</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="mat-upload" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
        display:inline-flex;align-items:center;gap:.35rem;
      ">📤 Upload Material</button>
      <button id="mat-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef9c3;color:#854d0e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📂</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="mat-total">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Total Materials</div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Type</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Uploaded</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="mat-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">Loading materials…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: UPLOAD MATERIAL ═══════ -->
<div id="mat-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Upload Material</h3>
      <button id="mat-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Course</label>
        <select id="mat-course" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Select Course</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Title</label>
        <input type="text" id="mat-title" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" placeholder="e.g., Week 1 - Course Introduction" />
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Type</label>
        <select id="mat-type" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="note">Note</option>
          <option value="pdf">PDF Document</option>
          <option value="video">Video</option>
          <option value="link">Web Link</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">File URL / Link</label>
        <input type="text" id="mat-url" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" placeholder="https://..." />
        <div style="font-size:.72rem;color:#94a3b8;margin-top:.3rem;">Paste a link to a file (Google Drive, Dropbox, YouTube, etc).</div>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Description (Optional)</label>
        <textarea id="mat-desc" rows="3" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;resize:vertical;"></textarea>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="mat-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="mat-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Save Material</button>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes matSpin { to { transform: rotate(360deg); } }
  #mat-tbody tr { transition: background .1s; }
  #mat-tbody tr:hover { background: #f8fafc; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  let ALL_COURSES = [];

  async function load() {
    const tbody = $('mat-tbody');
    try {
      const res = await core.portalFetch('/api/lecturer/materials');
      const rows = res.data || [];
      
      $('mat-total').textContent = rows.length;

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">No materials uploaded yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(r => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.title)}</td>
          <td style="padding:.65rem .75rem;"><span style="font-size:.75rem;font-weight:700;color:#065f46;">${esc(r.courseCode || '—')}</span></td>
          <td style="padding:.65rem .75rem;text-align:center;"><span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;text-transform:uppercase;">${esc(r.materialType || 'note')}</span></td>
          <td style="padding:.65rem .75rem;text-align:center;color:#64748b;font-size:.75rem;">${fmtDate(r.createdAt)}</td>
          <td style="padding:.65rem .75rem;text-align:right;">
            ${r.fileUrl ? `<a href="${esc(r.fileUrl)}" target="_blank" style="font-size:.75rem;color:#1e40af;text-decoration:none;font-weight:700;">View</a>` : '—'}
          </td>
        </tr>
      `).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  async function openModal() {
    $('mat-modal').style.display = 'flex';
    $('mat-title').value = '';
    $('mat-url').value = '';
    $('mat-desc').value = '';
    $('mat-course').innerHTML = '<option value="">Loading…</option>';

    try {
      const res = await core.portalFetch('/api/lecturer/courses');
      const rows = Array.isArray(res) ? res : (res.data || []);
      ALL_COURSES = rows;
      
      $('mat-course').innerHTML = '<option value="">Select Course</option>' + 
        ALL_COURSES.map(c => `<option value="${c.id}">${c.code} - ${c.title}</option>`).join('');
    } catch (err) {
      $('mat-course').innerHTML = '<option value="">Error loading courses</option>';
    }
  }

  function closeModal() {
    $('mat-modal').style.display = 'none';
  }

  async function saveMaterial() {
    const courseId = $('mat-course').value;
    const title = $('mat-title').value.trim();
    const type = $('mat-type').value;
    const url = $('mat-url').value.trim();
    const desc = $('mat-desc').value.trim();

    if (!courseId || !title) {
      return core.showToast && core.showToast('Course and Title are required.', 'warning');
    }

    const btn = $('mat-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      await core.portalFetch('/api/lecturer/materials', {
        method: 'POST',
        body: {
          courseId: Number(courseId),
          title,
          materialType: type,
          fileUrl: url || null,
          description: desc || null,
        },
      });
      core.showToast && core.showToast('Material uploaded successfully!', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Material';
    }
  }

  $('mat-upload')?.addEventListener('click', openModal);
  $('mat-refresh')?.addEventListener('click', load);
  $('mat-modal-close')?.addEventListener('click', closeModal);
  $('mat-cancel')?.addEventListener('click', closeModal);
  $('mat-save')?.addEventListener('click', saveMaterial);
  $('mat-modal')?.addEventListener('click', (e) => { if (e.target.id === 'mat-modal') closeModal(); });

  load();
})();
</script>
