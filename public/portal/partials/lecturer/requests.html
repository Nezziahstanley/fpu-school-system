<!-- Portal → Lecturer → Requests -->
<section class="page-head">
  <div><h2>Requests</h2><p class="muted small">Submit a request or complaint</p></div>
  <div class="actions"><button class="btn btn-primary btn-sm" id="lec-req-new">+ New Request</button></div>
</section>

<div class="panel" id="lec-req-panel" style="display:none;">
  <div class="panel-head"><h3>New Request</h3></div>
  <div class="panel-body">
    <form id="lec-req-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Subject</label><input class="form-control" name="subject" required /></div>
        <div class="form-group"><label class="form-label">Category</label>
          <select class="form-select" name="category">
            <option value="">—</option>
            <option>academic</option><option>facility</option><option>finance</option><option>welfare</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label class="form-label">Details</label><textarea class="form-control" name="body" rows="4" required></textarea></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="button" class="btn btn-ghost" id="lec-req-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="lec-req-list" class="grid" style="gap:.5rem;">
  <div class="loading"><span class="spinner"></span> Loading…</div>
</div>

<script>
  (function () {
    const core = window.FPU_PORTAL;

    async function load() {
      const box = document.getElementById('lec-req-list');
      box.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await core.portalFetch('/api/lecturer/requests');
        const rows = res.data || [];
        box.innerHTML = rows.length ? rows.map((c) => `
          <div class="session-item">
            <div class="meta"><strong>${core.escapeHtml(c.subject)}</strong>${core.escapeHtml((c.body || '').slice(0, 140))}</div>
            <div class="small muted"><span class="badge badge-${c.status === 'resolved' ? 'success' : 'warning'}">${core.escapeHtml(c.status)}</span> · ${core.timeAgo(c.createdAt)}</div>
          </div>
        `).join('') : '<p class="muted">No requests filed.</p>';
      } catch (err) { box.innerHTML = `<div class="alert alert-danger">${core.escapeHtml(err.message)}</div>`; }
    }

    document.getElementById('lec-req-new').addEventListener('click', () => {
      const p = document.getElementById('lec-req-panel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('lec-req-cancel').addEventListener('click', () => {
      document.getElementById('lec-req-panel').style.display = 'none';
    });
    document.getElementById('lec-req-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await core.portalFetch('/api/lecturer/requests', { method: 'POST', body: Object.fromEntries(fd) });
        core.showToast('Submitted.', 'success');
        e.target.reset();
        document.getElementById('lec-req-panel').style.display = 'none';
        load();
      } catch (err) { core.showToast(err.message, 'error'); }
    });

    load();
  })();
</script>
