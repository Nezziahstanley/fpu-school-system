<!-- Portal → Lecturer → Requests -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📨</div>
    <div>
      <h1>My Requests</h1>
      <div class="sub">Submit and track requests to administration</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <input type="search" id="lq-search" placeholder="Search requests…" />
  <select id="lq-type">
    <option value="">All Types</option>
    <option value="leave">Leave of Absence</option>
    <option value="resource">Resource Request</option>
    <option value="training">Training / Workshop</option>
    <option value="schedule">Schedule Change</option>
    <option value="other">Other</option>
  </select>
  <select id="lq-status">
    <option value="">All Status</option>
    <option value="pending">Pending</option>
    <option value="approved">Approved</option>
    <option value="rejected">Rejected</option>
  </select>
  <button class="btn btn-primary btn-sm" id="lq-new-btn">➕ New Request</button>
  <button class="btn btn-outline btn-sm" id="lq-refresh">Refresh</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Requests</span><span class="value" id="lq-total">—</span></div><div class="ic">📨</div></div>
  <div class="stat red"><div class="meta"><span class="label">Pending</span><span class="value" id="lq-pending">—</span></div><div class="ic">⏳</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Approved</span><span class="value" id="lq-approved">—</span></div><div class="ic">✅</div></div>
  <div class="stat blue"><div class="meta"><span class="label">Rejected</span><span class="value" id="lq-rejected">—</span></div><div class="ic">❌</div></div>
</div>

<section class="panel">
  <div class="panel-head">
    <h3>Requests</h3>
    <span class="badge" id="lq-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Type</th>
            <th>Subject</th>
            <th>Submitted</th>
            <th>Status</th>
            <th>Response</th>
          </tr>
        </thead>
        <tbody id="lq-tbody">
          <tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- New Request Modal -->
<div id="lq-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;max-width:560px;width:90%;max-height:90vh;overflow:auto;">
    <div style="padding:1rem 1.25rem;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;">
      <strong>New Request</strong>
      <button class="btn btn-outline btn-xs" id="lq-modal-close">✕</button>
    </div>
    <div style="padding:1.25rem;">
      <div class="form-group">
        <label>Request Type *</label>
        <select id="lq-modal-type">
          <option value="leave">Leave of Absence</option>
          <option value="resource">Resource Request</option>
          <option value="training">Training / Workshop</option>
          <option value="schedule">Schedule Change</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Subject *</label>
        <input type="text" id="lq-modal-subject" placeholder="Short summary of your request" />
      </div>
      <div class="form-group">
        <label>Details *</label>
        <textarea id="lq-modal-body" rows="5" placeholder="Explain your request in detail…"></textarea>
      </div>
      <div class="quick-actions" style="margin-top:1rem;">
        <button class="btn btn-primary btn-sm" id="lq-submit">📨 Submit Request</button>
        <button class="btn btn-outline btn-sm" id="lq-cancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  let ALL = [], FILTERED = [];

  function unwrap(r) {
    const req = r.request || r;
    return {
      id: req.id,
      type: (req.type || 'other').toLowerCase(),
      subject: req.subject || req.title || '—',
      body: req.body || req.message || '',
      status: (req.status || 'pending').toLowerCase(),
      response: req.response || req.adminComment || '',
      submittedAt: req.createdAt || req.submittedAt,
    };
  }

  function render() {
    const countEl = $('lq-count'); const tbody = $('lq-tbody');
    if (countEl) countEl.textContent = FILTERED.length;
    if (!tbody) return;

    if (!FILTERED.length) {
      tbody.innerHTML = `
        <tr><td colspan="5" class="empty" style="padding:2.5rem 1rem;text-align:center;">
          <div style="font-size:2.5rem;margin-bottom:.5rem;">📨</div>
          <div style="font-weight:600;color:#475569;">No requests yet</div>
          <div style="font-size:12.5px;color:#94a3b8;margin-top:.25rem;">
            Click <strong>New Request</strong> to submit your first request.
          </div>
        </td></tr>`;
      return;
    }

    tbody.innerHTML = FILTERED.map((r) => {
      const badgeClass = r.status === 'approved' ? 'badge-active'
                       : r.status === 'rejected' ? 'badge-inactive'
                       : 'badge-warning';
      return `
        <tr>
          <td><span class="chip chip-${r.type}">${esc(r.type)}</span></td>
          <td><strong>${esc(r.subject)}</strong></td>
          <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleDateString() : '—'}</td>
          <td><span class="badge-status ${badgeClass}">${esc(r.status)}</span></td>
          <td>${r.response ? esc(r.response.slice(0, 80)) + (r.response.length > 80 ? '…' : '') : '—'}</td>
        </tr>`;
    }).join('');
  }

  function applyFilter() {
    const q = ($('lq-search')?.value || '').trim().toLowerCase();
    const type = $('lq-type')?.value || '';
    const status = $('lq-status')?.value || '';

    FILTERED = ALL.filter((r) => {
      const hay = `${r.subject} ${r.body}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (type && r.type !== type) return false;
      if (status && r.status !== status) return false;
      return true;
    });
    render();
  }

  function updateStats() {
    setText('lq-total', ALL.length);
    setText('lq-pending', ALL.filter((r) => r.status === 'pending').length);
    setText('lq-approved', ALL.filter((r) => r.status === 'approved').length);
    setText('lq-rejected', ALL.filter((r) => r.status === 'rejected').length);
  }

  async function load() {
    const tbody = $('lq-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/requests');
      const payload = res.data || res || {};
      const raw = Array.isArray(payload) ? payload : (payload.rows || payload.requests || []);
      ALL = raw.map(unwrap);
      console.log('[lecturer-requests] Loaded', ALL.length);
      updateStats();
      applyFilter();
    } catch (err) {
      console.warn('[lecturer-requests]', err.message);
      ALL = [];
      updateStats();
      applyFilter();
    }
  }

  // Modal
  function openModal() { const m = $('lq-modal'); if (m) m.style.display = 'flex'; }
  function closeModal() { const m = $('lq-modal'); if (m) m.style.display = 'none'; }

  $('lq-new-btn')?.addEventListener('click', openModal);
  $('lq-modal-close')?.addEventListener('click', closeModal);
  $('lq-cancel')?.addEventListener('click', closeModal);

  $('lq-submit')?.addEventListener('click', async () => {
    const type = $('lq-modal-type')?.value || '';
    const subject = ($('lq-modal-subject')?.value || '').trim();
    const body = ($('lq-modal-body')?.value || '').trim();

    if (!subject) return core.showToast && core.showToast('Subject is required', 'error');
    if (!body) return core.showToast && core.showToast('Details are required', 'error');

    try {
      await core.portalFetch('/api/requests', {
        method: 'POST',
        body: { type, subject, body },
      });
      core.showToast && core.showToast('Request submitted', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  });

  $('lq-search')?.addEventListener('input', applyFilter);
  $('lq-type')?.addEventListener('change', applyFilter);
  $('lq-status')?.addEventListener('change', applyFilter);
  $('lq-refresh')?.addEventListener('click', load);

  load();
})();
</script>
