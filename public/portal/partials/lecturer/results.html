<!-- Portal → Lecturer → Results -->
<section class="page-head">
  <div><h2>Results</h2><p class="muted small">Enter scores and submit to HOD</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="window.__lecResLoad()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Add / Update Score</h3></div>
  <div class="panel-body">
    <form id="lec-res-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Student ID</label><input class="form-control" name="studentId" type="number" required /></div>
        <div class="form-group"><label class="form-label">Course ID</label><input class="form-control" name="courseId" type="number" required /></div>
        <div class="form-group"><label class="form-label">Session ID</label><input class="form-control" name="sessionId" type="number" /></div>
        <div class="form-group"><label class="form-label">Semester</label>
          <select class="form-select" name="semester"><option value="first">First</option><option value="second">Second</option></select>
        </div>
        <div class="form-group"><label class="form-label">Score</label><input class="form-control" name="score" type="number" step="0.01" min="0" max="100" required /></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Score</button>
      </div>
    </form>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <h3>My Results</h3>
    <div class="tools"><button class="btn btn-accent btn-sm" id="lec-res-submit">Submit All Drafts</button></div>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>ID</th><th>Student</th><th>Course</th><th>Score</th><th>Grade</th><th>Status</th><th></th></tr></thead>
        <tbody id="lec-res-tbody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  (function () {
    const core = window.FPU_PORTAL;

    async function load() {
      const tbody = document.getElementById('lec-res-tbody');
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Loading…</td></tr>';
      try {
        const res = await core.portalFetch('/api/lecturer/results');
        const rows = res.data || [];
        tbody.innerHTML = rows.length ? rows.map((r) => `
          <tr>
            <td>${r.id}</td>
            <td>Student ${r.studentId}</td>
            <td>Course ${r.courseId}</td>
            <td class="num">${r.score}</td>
            <td>${core.escapeHtml(r.grade || '')}</td>
            <td><span class="badge badge-${r.status === 'draft' ? 'muted' : r.status === 'hod_rejected' ? 'danger' : r.status === 'published' ? 'success' : 'info'}">${core.escapeHtml(r.status)}</span></td>
            <td>${r.status === 'draft' ? `<button class="btn btn-sm btn-outline" data-id="${r.id}">Submit</button>` : ''}</td>
          </tr>
        `).join('') : '<tr><td colspan="7" class="empty">No results yet.</td></tr>';

        tbody.querySelectorAll('button[data-id]').forEach((b) => {
          b.addEventListener('click', () => submitOne(b.dataset.id));
        });
      } catch (err) { tbody.innerHTML = `<tr><td colspan="7" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
    }

    async function submitOne(id) {
      try {
        await core.portalFetch('/api/lecturer/results/submit', { method: 'POST', body: { ids: [Number(id)] } });
        core.showToast('Submitted.', 'success');
        load();
      } catch (err) { core.showToast(err.message, 'error'); }
    }

    document.getElementById('lec-res-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await core.portalFetch('/api/lecturer/results', { method: 'POST', body: Object.fromEntries(fd) });
        core.showToast('Saved.', 'success');
        e.target.reset();
        load();
      } catch (err) { core.showToast(err.message, 'error'); }
    });

    document.getElementById('lec-res-submit').addEventListener('click', async () => {
      if (!confirm('Submit all draft results to your HOD?')) return;
      try {
        const res = await core.portalFetch('/api/lecturer/results');
        const ids = (res.data || []).filter((r) => r.status === 'draft').map((r) => r.id);
        if (!ids.length) return core.showToast('No drafts to submit.', 'info');
        await core.portalFetch('/api/lecturer/results/submit', { method: 'POST', body: { ids } });
        core.showToast(`Submitted ${ids.length} results.`, 'success');
        load();
      } catch (err) { core.showToast(err.message, 'error'); }
    });

    load();
  })();
</script>
