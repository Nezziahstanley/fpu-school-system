<!-- Portal → Lecturer → Results Entry -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📊</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">Results Entry</div>
        <div style="font-size:.82rem;color:#d1fae5;">Enter CA and Exam scores for your students</div>
      </div>
    </div>
  </div>

  <!-- SELECT COURSE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.25rem;margin-bottom:1.25rem;">
    <label style="display:block;font-size:.7rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.5rem;">Select Course</label>
    <select id="course-select" style="width:100%;max-width:500px;padding:.6rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#f8fafc;">
      <option value="">— Select a course to begin —</option>
    </select>
  </div>

  <!-- RESULTS PANEL -->
  <div id="results-panel" style="display:none;">
    
    <!-- Course Stats -->
    <div id="course-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;"></div>

    <!-- Table Panel -->
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
      <div style="padding:1rem 1.25rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
        <div style="font-weight:800;font-size:.95rem;color:#0f172a;">Student Scores</div>
        <button id="save-btn" style="padding:.5rem 1.25rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:all .2s;">💾 Save All Draft</button>
      </div>
      
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
              <th style="padding:.75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric No.</th>
              <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;width:100px;">CA (30)</th>
              <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;width:100px;">Exam (70)</th>
              <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;width:80px;">Total</th>
              <th style="padding:.75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;width:80px;">Grade</th>
            </tr>
          </thead>
          <tbody id="results-tbody">
            <!-- Rows injected here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let STUDENTS = [];
  let CURRENT_COURSE_ID = null;

  // Grade logic
  function calcGrade(total) {
    if (total >= 70) return { grade: 'A', color: '#065f46' };
    if (total >= 60) return { grade: 'B', color: '#065f46' };
    if (total >= 50) return { grade: 'C', color: '#065f46' };
    if (total >= 45) return { grade: 'D', color: '#92400e' };
    if (total >= 40) return { grade: 'E', color: '#92400e' };
    return { grade: 'F', color: '#991b1b' };
  }

  // Load courses
  async function loadCourses() {
    try {
      const res = await core.portalFetch('/api/lecturer/courses'); 
      const list = res.data || [];
      
      if (!list.length) {
        $('course-select').innerHTML = '<option value="">No courses allocated</option>';
        return;
      }

      $('course-select').innerHTML = '<option value="">— Select a course to begin —</option>' + 
        list.map(c => `<option value="${c.id}">${esc(c.code)} — ${esc(c.title)}</option>`).join('');
    } catch (err) {
      core.showToast(err.message, 'error');
    }
  }

  // Load students on course change
  $('course-select').addEventListener('change', async (e) => {
    const courseId = e.target.value;
    if (!courseId) {
      $('results-panel').style.display = 'none';
      return;
    }

    CURRENT_COURSE_ID = courseId;
    $('results-panel').style.display = 'block';
    $('results-tbody').innerHTML = '<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading students…</td></tr>';

    try {
      const res = await core.portalFetch(`/api/lecturer/results/${courseId}`);
      STUDENTS = res.data || [];
      
      const selectedOption = e.target.options[e.target.selectedIndex].text;
      const [code, title] = selectedOption.split(' — ');
      
      renderCourseStats(code, title);
      renderTable();
    } catch (err) {
      $('results-tbody').innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">${esc(err.message)}</td></tr>`;
    }
  });

  function renderCourseStats(code, title) {
    $('course-stats').innerHTML = `
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;">
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;">Course Code</div>
        <div style="font-size:1.25rem;font-weight:800;color:#0f172a;margin-top:.25rem;">${esc(code)}</div>
      </div>
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;grid-column:span 2;">
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;">Course Title</div>
        <div style="font-size:1.1rem;font-weight:800;color:#0f172a;margin-top:.25rem;">${esc(title)}</div>
      </div>
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;">
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;">Students</div>
        <div style="font-size:1.5rem;font-weight:800;color:#1e40af;margin-top:.15rem;">${STUDENTS.length}</div>
      </div>
    `;
  }

  function renderTable() {
    if (!STUDENTS.length) {
      $('results-tbody').innerHTML = `
        <tr>
          <td colspan="6" style="padding:4rem 2rem;text-align:center;">
            <div style="font-size:2.5rem;margin-bottom:1rem;">📭</div>
            <div style="font-weight:700;color:#0f172a;font-size:1rem;">No Students Registered</div>
            <div style="color:#64748b;font-size:.85rem;margin-top:.25rem;">There are no registrations for this course yet.</div>
          </td>
        </tr>
      `;
      return;
    }

    $('results-tbody').innerHTML = STUDENTS.map(s => {
      const totalScore = s.score != null ? Number(s.score) : null;
      let ca = '';
      let exam = '';
      
      // Split total score into CA (30%) and Exam (70%)
      if (totalScore !== null) {
        ca = Math.round(totalScore * 0.3); 
        exam = totalScore - ca;
      }

      const total = (Number(ca) || 0) + (Number(exam) || 0);
      const { grade, color } = calcGrade(total);

      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.85rem .75rem;font-weight:700;color:#0f172a;">${esc(s.lastName)}, ${esc(s.firstName)}</td>
          <td style="padding:.85rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(s.matricNumber || '—')}</code></td>
          <td style="padding:.85rem .75rem;text-align:center;">
            <input type="number" class="score-input ca-input" data-id="${s.studentId}" min="0" max="30" value="${ca}" style="width:70px;padding:.4rem;text-align:center;border:1px solid #cbd5e1;border-radius:6px;font-size:.9rem;font-weight:700;" />
          </td>
          <td style="padding:.85rem .75rem;text-align:center;">
            <input type="number" class="score-input exam-input" data-id="${s.studentId}" min="0" max="70" value="${exam}" style="width:70px;padding:.4rem;text-align:center;border:1px solid #cbd5e1;border-radius:6px;font-size:.9rem;font-weight:700;" />
          </td>
          <td style="padding:.85rem .75rem;text-align:center;font-weight:800;font-size:.95rem;" class="total-cell">${totalScore !== null ? total : '—'}</td>
          <td style="padding:.85rem .75rem;text-align:center;font-weight:900;font-size:.95rem;color:${totalScore !== null ? color : '#94a3b8'};" class="grade-cell">${totalScore !== null ? grade : '—'}</td>
        </tr>
      `;
    }).join('');

    // Live calculation
    document.querySelectorAll('.score-input').forEach(input => {
      input.addEventListener('input', (e) => {
        const row = e.target.closest('tr');
        const ca = Number(row.querySelector('.ca-input').value) || 0;
        const exam = Number(row.querySelector('.exam-input').value) || 0;
        const total = ca + exam;
        const { grade, color } = calcGrade(total);

        row.querySelector('.total-cell').textContent = (ca || exam) ? total : '—';
        const gradeCell = row.querySelector('.grade-cell');
        gradeCell.textContent = (ca || exam) ? grade : '—';
        gradeCell.style.color = (ca || exam) ? color : '#94a3b8';
      });
    });
  }

  // Save All
  $('save-btn').addEventListener('click', async () => {
    if (!CURRENT_COURSE_ID || !STUDENTS.length) return;
    
    const btn = $('save-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const payload = [];
    document.querySelectorAll('.ca-input').forEach(caInput => {
      const studentId = caInput.dataset.id;
      const row = caInput.closest('tr');
      const examInput = row.querySelector('.exam-input');
      
      payload.push({
        studentId: Number(studentId),
        caScore: Number(caInput.value) || 0,
        examScore: Number(examInput.value) || 0,
      });
    });

    try {
      await core.portalFetch(`/api/lecturer/results/${CURRENT_COURSE_ID}`, {
        method: 'POST',
        body: { results: payload }
      });
      core.showToast('Results saved as draft successfully.', 'success');
    } catch (err) {
      core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Save All Draft';
    }
  });

  // Init
  loadCourses();
})();
</script>
