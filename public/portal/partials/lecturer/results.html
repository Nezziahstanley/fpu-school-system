<!-- Portal → Lecturer → Results -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Enter Results</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Enter and submit student results for your courses</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="res-enter" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
        display:inline-flex;align-items:center;gap:.35rem;
      ">➕ Enter Result</button>
      <button id="res-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📋</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="res-total">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Total Results</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">✏️</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="res-drafts">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Drafts</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📤</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="res-submitted">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Submitted</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">✅</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="res-published">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Published</div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="res-tbody">
          <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:resSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading results…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: ENTER RESULT ═══════ -->
<div id="res-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Enter Result</h3>
      <button id="res-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Course</label>
        <select id="res-course" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Select Course</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Student</label>
        <select id="res-student" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;" disabled>
          <option value="">Select course first</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Score</label>
        <input type="number" id="res-score" min="0" max="100" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" placeholder="0 - 100" />
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Semester</label>
        <select id="res-semester" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="first">First</option>
          <option value="second">Second</option>
        </select>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="res-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="res-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Save Result</button>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes resSpin { to { transform: rotate(360deg); } }
  #res-tbody tr { transition: background .1s; }
  #res-tbody tr:hover { background: #f8fafc; }
  .res-btn { padding:.35rem .7rem;font-size:.72rem;font-weight:700; border-radius:6px;border:none;cursor:pointer; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_COURSES = [];

  async function load() {
    const tbody = $('res-tbody');
    try {
      const res = await core.portalFetch('/api/lecturer/results');
      const rows = res.data || [];

      let drafts = 0, submitted = 0, published = 0;
      rows.forEach(r => {
        if (r.status === 'draft') drafts++;
        else if (r.status === 'submitted') submitted++;
        else if (r.status === 'published') published++;
      });

      $('res-total').textContent = rows.length;
      $('res-drafts').textContent = drafts;
      $('res-submitted').textContent = submitted;
      $('res-published').textContent = published;

      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">No results found.</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(r => {
        const isDraft = r.status === 'draft';
        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.studentFirstName)} ${esc(r.studentLastName)}</td>
            <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(r.matricNumber)}</code></td>
            <td style="padding:.65rem .75rem;"><span style="font-size:.75rem;font-weight:700;color:#065f46;">${esc(r.courseCode)}</span></td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
            <td style="padding:.65rem .75rem;text-align:center;text-transform:capitalize;">${esc(r.status)}</td>
            <td style="padding:.65rem .75rem;text-align:right;">
              ${isDraft ? `
                <button class="res-btn" data-action="submit" data-id="${r.id}" style="background:#065f46;color:#fff;margin-right:.25rem;">Submit</button>
                <button class="res-btn" data-action="delete" data-id="${r.id}" style="background:#fee2e2;color:#991b1b;">Delete</button>
              ` : '—'}
            </td>
          </tr>
        `;
      }).join('');

      tbody.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this draft result?')) return;
          try {
            await core.portalFetch(`/api/lecturer/results/${btn.dataset.id}`, { method: 'DELETE' });
            core.showToast && core.showToast('Deleted', 'success');
            load();
          } catch (err) { core.showToast && core.showToast(err.message, 'error'); }
        });
      });

      tbody.querySelectorAll('[data-action="submit"]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Submit this result to the HOD for approval? You cannot edit it afterwards.')) return;
          btn.disabled = true;
          btn.textContent = '…';
          try {
            await core.portalFetch(`/api/lecturer/results/${btn.dataset.id}/submit`, { method: 'POST' });
            core.showToast && core.showToast('Result submitted!', 'success');
            load();
          } catch (err) { 
            core.showToast && core.showToast(err.message, 'error'); 
            btn.disabled = false;
            btn.textContent = 'Submit';
          }
        });
      });

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  async function openModal() {
    $('res-modal').style.display = 'flex';
    $('res-score').value = '';
    $('res-student').innerHTML = '<option value="">Select course first</option>';
    $('res-student').disabled = true;
    $('res-course').innerHTML = '<option value="">Loading…</option>';

    try {
      const res = await core.portalFetch('/api/lecturer/courses');
      const rows = Array.isArray(res) ? res : (res.data || []);
      ALL_COURSES = rows;
      
      $('res-course').innerHTML = '<option value="">Select Course</option>' + 
        ALL_COURSES.map(c => `<option value="${c.id}">${c.code} - ${c.title}</option>`).join('');
    } catch (err) {
      $('res-course').innerHTML = '<option value="">Error loading courses</option>';
    }
  }

  function closeModal() {
    $('res-modal').style.display = 'none';
  }

  async function loadStudentsForCourse() {
    const courseId = $('res-course').value;
    const sel = $('res-student');
    if (!courseId) {
      sel.innerHTML = '<option value="">Select course first</option>';
      sel.disabled = true;
      return;
    }

    sel.innerHTML = '<option value="">Loading…</option>';
    sel.disabled = true;

    try {
      const res = await core.portalFetch(`/api/lecturer/students?courseId=${courseId}`);
      const rows = res.data || [];
      const students = rows.map(r => r.student).filter(Boolean);

      if (!students.length) {
        sel.innerHTML = '<option value="">No students registered for this course</option>';
        return;
      }

      sel.innerHTML = '<option value="">Select Student</option>' + 
        students.map(s => `<option value="${s.id}">${s.firstName} ${s.lastName} (${s.matricNumber})</option>`).join('');
      sel.disabled = false;
    } catch (err) {
      sel.innerHTML = '<option value="">Error loading students</option>';
    }
  }

  async function saveResult() {
    const courseId = $('res-course').value;
    const studentId = $('res-student').value;
    const score = $('res-score').value;
    const semester = $('res-semester').value;

    if (!courseId || !studentId || score === '') {
      return core.showToast && core.showToast('Please fill all fields.', 'warning');
    }

    const btn = $('res-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      await core.portalFetch('/api/lecturer/results', {
        method: 'POST',
        body: { studentId: Number(studentId), courseId: Number(courseId), score: Number(score), semester }
      });

      core.showToast && core.showToast('Result saved as draft!', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Result';
    }
  }

  $('res-enter')?.addEventListener('click', openModal);
  $('res-refresh')?.addEventListener('click', load);
  $('res-modal-close')?.addEventListener('click', closeModal);
  $('res-cancel')?.addEventListener('click', closeModal);
  $('res-course')?.addEventListener('change', loadStudentsForCourse);
  $('res-save')?.addEventListener('click', saveResult);
  $('res-modal')?.addEventListener('click', (e) => { if (e.target.id === 'res-modal') closeModal(); });

  load();
})();
</script>
