<!-- Portal → Lecturer → Students -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🎓</div>
    <div>
      <h1>My Students</h1>
      <div class="sub" id="ls-sub">Students in your department</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <input type="search" id="ls-search" placeholder="Search matric, name, or email…" />
  <select id="ls-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <select id="ls-programme"><option value="">All Programmes</option></select>
  <button class="btn btn-outline btn-sm" id="ls-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="ls-export">Export CSV</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Students</span><span class="value" id="ls-total">—</span></div><div class="ic">🎓</div></div>
  <div class="stat blue"><div class="meta"><span class="label">ND Students</span><span class="value" id="ls-nd">—</span></div><div class="ic">📘</div></div>
  <div class="stat accent"><div class="meta"><span class="label">HND Students</span><span class="value" id="ls-hnd">—</span></div><div class="ic">📗</div></div>
  <div class="stat purple"><div class="meta"><span class="label">Programmes</span><span class="value" id="ls-progs">—</span></div><div class="ic">📖</div></div>
</div>

<section class="panel">
  <div class="panel-head">
    <h3>Students</h3>
    <span class="badge" id="ls-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Matric No.</th>
            <th>Full Name</th>
            <th>Level</th>
            <th>Programme</th>
            <th>CGPA</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ls-tbody">
          <tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  let ALL = [], FILTERED = [];

  // Header subtitle
  if (user.departmentName) {
    const el = $('ls-sub');
    if (el) el.textContent = `Students in ${user.departmentName}`;
  }

  function getLevel(s) { return String(s.level || '').toUpperCase() || '—'; }
  function getProg(s) { return s.programmeName || s.programme?.name || '—'; }
  function getCGPA(s) { return s.cgpa != null ? Number(s.cgpa).toFixed(2) : '—'; }
  function isActive(s) { return s.isActive === true || s.isActive === 'true' || s.isActive === 1; }

  function render() {
    const countEl = $('ls-count'); const tbody = $('ls-tbody');
    if (countEl) countEl.textContent = FILTERED.length;
    if (!tbody) return;

    if (!FILTERED.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">No students match your filters.</td></tr>';
      return;
    }

    tbody.innerHTML = FILTERED.map((s) => {
      const lvl = getLevel(s);
      const chipClass = 'chip-' + lvl.toLowerCase();
      const active = isActive(s);
      return `
        <tr>
          <td><strong>${esc(s.matricNumber || '—')}</strong></td>
          <td>${esc((s.firstName || '') + ' ' + (s.lastName || ''))}</td>
          <td><span class="chip ${chipClass}">${esc(lvl)}</span></td>
          <td>${esc(getProg(s))}</td>
          <td>${getCGPA(s)}</td>
          <td><span class="badge-status ${active ? 'badge-active' : 'badge-inactive'}">${active ? 'Active' : 'Inactive'}</span></td>
        </tr>`;
    }).join('');
  }

  function applyFilter() {
    const q = ($('ls-search')?.value || '').trim().toLowerCase();
    const lvl = $('ls-level')?.value || '';
    const prog = $('ls-programme')?.value || '';

    FILTERED = ALL.filter((s) => {
      const hay = `${s.matricNumber || ''} ${s.firstName || ''} ${s.lastName || ''} ${s.email || ''}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && getLevel(s) !== lvl) return false;
      if (prog && getProg(s) !== prog) return false;
      return true;
    });
    render();
  }

  function updateStats() {
    setText('ls-total', ALL.length);
    setText('ls-nd', ALL.filter((s) => getLevel(s) === 'ND').length);
    setText('ls-hnd', ALL.filter((s) => getLevel(s) === 'HND').length);
    setText('ls-progs', new Set(ALL.map(getProg).filter((p) => p && p !== '—')).size);
  }

  function populateProgrammes() {
    const sel = $('ls-programme');
    if (!sel) return;
    const progs = [...new Set(ALL.map(getProg).filter((p) => p && p !== '—'))].sort();
    const cur = sel.value;
    sel.innerHTML = '<option value="">All Programmes</option>' +
      progs.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    sel.value = cur;
  }

  async function load() {
    const tbody = $('ls-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>';

    try {
      // Pass departmentId explicitly — the middleware should also do this,
      // but we force it here as a safety net
      const deptId = user.departmentId;
      const url = deptId ? `/api/students?departmentId=${deptId}` : '/api/students';
      const res = await core.portalFetch(url);
      const payload = res.data || res || {};
      let list = Array.isArray(payload) ? payload : (payload.rows || payload.students || []);

      // CLIENT-SIDE SAFETY: filter to own department
      if (deptId) {
        list = list.filter((s) => {
          const sDept = s.departmentId ?? s.department_id;
          return !sDept || String(sDept) === String(deptId);
        });
      }

      ALL = list;
      console.log('[lecturer-students] Loaded', ALL.length, 'in dept', deptId);
      populateProgrammes();
      updateStats();
      applyFilter();
    } catch (err) {
      console.error('[lecturer-students]', err);
      if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  function exportCsv() {
    const headers = ['Matric', 'Name', 'Level', 'Programme', 'CGPA', 'Status'];
    const rows = FILTERED.map((s) => [
      s.matricNumber || '',
      `${s.firstName || ''} ${s.lastName || ''}`.trim(),
      getLevel(s), getProg(s), getCGPA(s),
      isActive(s) ? 'Active' : 'Inactive',
    ]);
    const csv = [headers, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `lecturer-students-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('ls-search')?.addEventListener('input', applyFilter);
  $('ls-level')?.addEventListener('change', applyFilter);
  $('ls-programme')?.addEventListener('change', applyFilter);
  $('ls-refresh')?.addEventListener('click', load);
  $('ls-export')?.addEventListener('click', exportCsv);

  load();
})();
</script>
