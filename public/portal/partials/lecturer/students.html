<!-- Portal → Lecturer → Students -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">My Students</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Students enrolled in your courses</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <input type="search" id="lec-stu-search" placeholder="Search matric, name, or email…"
             style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;min-width:260px;" />
      <select id="lec-stu-level" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
        <option value="">All Levels</option>
        <option value="ND">ND</option>
        <option value="HND">HND</option>
      </select>
      <button id="lec-stu-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- STAT TILES -->
  <div id="lec-stu-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;"></div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Showing <span id="lec-stu-shown">0</span> of <span id="lec-stu-total">0</span> students
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric No.</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Programme</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
          </tr>
        </thead>
        <tbody id="lec-stu-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:stuSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading students…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<style>
  @keyframes stuSpin { to { transform: rotate(360deg); } }
  #lec-stu-tbody tr { transition: background .1s; }
  #lec-stu-tbody tr:hover { background: #f8fafc; }
  .stu-badge { display:inline-flex;align-items:center;gap:.3rem; padding:3px 9px;border-radius:99px; font-size:.65rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  async function load() {
    const tbody = $('lec-stu-tbody');
    tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:stuSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading students…</div>
    </td></tr>`;

    try {
      const res = await core.portalFetch('/api/lecturer/students-list');
      ALL = Array.isArray(res.data) ? res.data : [];
      renderStats();
      applyFilters();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function renderStats() {
    const total = ALL.length;
    const nd = ALL.filter(s => s.level === 'ND').length;
    const hnd = ALL.filter(s => s.level === 'HND').length;
    const active = ALL.filter(s => s.isActive).length;

    const tiles = [
      { label: 'Total Students', value: total,  bg: '#e0e7ff', fg: '#3730a3', icon: '🎓' },
      { label: 'ND Students',    value: nd,     bg: '#dbeafe', fg: '#1e40af', icon: '📘' },
      { label: 'HND Students',   value: hnd,    bg: '#fef3c7', fg: '#92400e', icon: '📗' },
      { label: 'Active',         value: active, bg: '#d1fae5', fg: '#065f46', icon: '✅' },
    ];

    $('lec-stu-stats').innerHTML = tiles.map(t => `
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
        <div style="width:40px;height:40px;border-radius:10px;background:${t.bg};color:${t.fg};display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">${t.icon}</div>
        <div style="min-width:0;">
          <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;">${t.value}</div>
          <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">${t.label}</div>
        </div>
      </div>`).join('');
  }

  function applyFilters() {
    const q = ($('lec-stu-search')?.value || '').trim().toLowerCase();
    const level = $('lec-stu-level')?.value || '';

    FILTERED = ALL.filter(s => {
      if (level && s.level !== level) return false;
      if (q) {
        const hay = `${s.firstName || ''} ${s.lastName || ''} ${s.matricNumber || ''} ${s.email || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(FILTERED);
    $('lec-stu-shown').textContent = FILTERED.length;
    $('lec-stu-total').textContent = ALL.length;
  }

  function renderTable(rows) {
    const tbody = $('lec-stu-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">No students found.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(s => {
      const fullName = `${s.firstName || ''} ${s.lastName || ''}`.trim();
      const initials = ((s.firstName || '?')[0] + (s.lastName || '?')[0]).toUpperCase();
      
      const statusHtml = s.isActive 
        ? `<span class="stu-badge" style="background:#d1fae5;color:#065f46;">Active</span>`
        : `<span class="stu-badge" style="background:#fee2e2;color:#991b1b;">Inactive</span>`;

      return `
        <tr>
          <td style="padding:.65rem .75rem;">
            <div style="display:flex;align-items:center;gap:.6rem;">
              <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#065f46,#047857);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.7rem;flex-shrink:0;">${initials}</div>
              <div style="font-weight:700;color:#0f172a;font-size:.85rem;">${esc(fullName)}</div>
            </div>
          </td>
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(s.matricNumber || '—')}</code></td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">${esc(s.level || '—')}</span>
          </td>
          <td style="padding:.65rem .75rem;font-size:.8rem;color:#475569;">${esc(s.programmeName || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${statusHtml}</td>
        </tr>`;
    }).join('');
  }

  // Wiring
  let searchTimer;
  $('lec-stu-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });
  $('lec-stu-level')?.addEventListener('change', applyFilters);
  $('lec-stu-refresh')?.addEventListener('click', load);

  load();
})();
</script>
