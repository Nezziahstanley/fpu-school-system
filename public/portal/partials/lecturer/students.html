<!-- Portal → Lecturer → Students -->
<section class="page-head">
  <div><h2>Course Students</h2><p class="muted small">View students registered for a course</p></div>
</section>

<div class="filters">
  <div class="form-group" style="flex:1 1 220px;">
    <label class="form-label">Course ID</label>
    <input class="form-control" id="lec-stud-course" type="number" placeholder="e.g. 1" />
  </div>
  <div class="form-group" style="flex:1 1 220px;">
    <label class="form-label">Session ID (optional)</label>
    <input class="form-control" id="lec-stud-session" type="number" />
  </div>
  <button class="btn btn-primary" id="lec-stud-load">Load Students</button>
</div>

<div class="panel">
  <div class="panel-head"><h3>Enrolled Students</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Matric No</th><th>Name</th><th>Email</th><th>Level</th><th>Status</th></tr></thead>
        <tbody id="lec-stud-tbody"><tr><td colspan="5" class="empty">Enter a course ID above.</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  document.getElementById('lec-stud-load').addEventListener('click', async () => {
    const core = window.FPU_PORTAL;
    const courseId = document.getElementById('lec-stud-course').value.trim();
    const sessionId = document.getElementById('lec-stud-session').value.trim();
    const tbody = document.getElementById('lec-stud-tbody');
    if (!courseId) { core.showToast('Enter a course ID.', 'warning'); return; }
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Loading…</td></tr>';
    try {
      const qs = new URLSearchParams({ courseId });
      if (sessionId) qs.set('sessionId', sessionId);
      const res = await core.portalFetch(`/api/lecturer/students?${qs}`);
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td>${core.escapeHtml(r.student?.matricNumber || '')}</td>
          <td>${core.escapeHtml((r.student?.firstName || '') + ' ' + (r.student?.lastName || ''))}</td>
          <td>${core.escapeHtml(r.student?.email || '')}</td>
          <td>${core.escapeHtml(r.student?.level || '')}</td>
          <td><span class="badge badge-${r.registration.status === 'approved' ? 'success' : 'warning'}">${core.escapeHtml(r.registration.status)}</span></td>
        </tr>
      `).join('') : '<tr><td colspan="5" class="empty">No students found.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="5" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  });
</script>
