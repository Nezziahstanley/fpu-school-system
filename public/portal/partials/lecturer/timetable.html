<!-- Portal → Lecturer → Timetable -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">My Timetable</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Your weekly teaching schedule</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="lec-tt-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📅</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="tt-total">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Total Slots</div>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;color:#991b1b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📌</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="tt-today">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Today's Classes</div>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📆</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="tt-week">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">This Week</div>
      </div>
    </div>

    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">📚</div>
      <div style="min-width:0;">
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="tt-active">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">Active Courses</div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Weekly Schedule <span id="tt-count" style="display:inline-block;background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.65rem;margin-left:.35rem;">0</span>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Day</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Time</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Venue</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Semester</th>
          </tr>
        </thead>
        <tbody id="tt-tbody">
          <tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:ttSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading timetable…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  @keyframes ttSpin { to { transform: rotate(360deg); } }
  #tt-tbody tr { transition: background .1s; }
  #tt-tbody tr:hover { background: #f8fafc; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  async function load() {
    const tbody = $('tt-tbody');
    tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:ttSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading timetable…</div>
    </td></tr>`;

    try {
      const res = await core.portalFetch('/api/lecturer/timetable');
      const rows = res.data || [];

      // Update stats
      const today = new Date().toLocaleDateString('en-US', { weekday: 'long' });
      let todayCount = 0;
      let uniqueCourses = new Set();

      rows.forEach(s => {
        if (s.dayOfWeek && s.dayOfWeek.toLowerCase() === today.toLowerCase()) todayCount++;
        if (s.courseCode) uniqueCourses.add(s.courseCode);
      });

      $('tt-total').textContent = rows.length;
      $('tt-today').textContent = todayCount;
      $('tt-week').textContent = rows.length;
      $('tt-active').textContent = uniqueCourses.size;
      $('tt-count').textContent = rows.length;

      // Render Table
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">
          <div style="font-size:2.5rem;margin-bottom:.6rem;opacity:.6;">📅</div>
          <div style="font-weight:700;color:#0f172a;font-size:.9rem;">No scheduled classes</div>
          <div style="font-size:.78rem;color:#94a3b8;margin-top:.25rem;">Your timetable will appear once the academic officer assigns slots.</div>
        </td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(s => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(s.dayOfWeek)}</td>
          <td style="padding:.65rem .75rem;font-size:.78rem;color:#475569;">${esc(s.startTime)} - ${esc(s.endTime)}</td>
          <td style="padding:.65rem .75rem;">
            <div style="font-weight:700;color:#0f172a;font-size:.85rem;">${esc(s.courseCode)}</div>
            <div style="font-size:.72rem;color:#64748b;">${esc(s.courseTitle)}</div>
          </td>
          <td style="padding:.65rem .75rem;font-size:.8rem;color:#475569;">${esc(s.venue || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">${esc(s.level)}</span>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;font-size:.78rem;color:#64748b;">${esc(s.semester)}</td>
        </tr>
      `).join('');

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ Error: ${esc(err.message)}</td></tr>`;
      core.showToast && core.showToast('Failed to load timetable: ' + err.message, 'error');
    }
  }

  $('lec-tt-refresh')?.addEventListener('click', load);
  load();
})();
</script>
