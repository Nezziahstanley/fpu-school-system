<!-- Portal → Librarian → Books -->
<div style="padding:0;">

  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Library Books</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Manage books, upload PDFs, and add external sources</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="book-add" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">➕ Add Book</button>
      <button id="book-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
    </div>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Author</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Category</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Copies</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Digital</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="books-tbody">
          <tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="book-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:600px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 id="book-modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Add Book</h3>
      <button id="book-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <input type="hidden" id="book-id" />
      
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;">
        <div style="grid-column:1/-1;">
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Title *</label>
          <input type="text" id="book-title" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Author</label>
          <input type="text" id="book-author" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">ISBN</label>
          <input type="text" id="book-isbn" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Category</label>
          <input type="text" id="book-category" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Publisher</label>
          <input type="text" id="book-publisher" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Year</label>
          <input type="number" id="book-year" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Total Copies</label>
          <input type="number" id="book-copies" value="1" min="1" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Shelf</label>
          <input type="text" id="book-shelf" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
      </div>

      <div style="margin-top:.75rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Description</label>
        <textarea id="book-description" rows="2" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;resize:vertical;"></textarea>
      </div>

      <div style="margin-top:.75rem;padding:.75rem;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;">
        <div style="font-weight:800;color:#065f46;font-size:.78rem;margin-bottom:.5rem;">📖 E-Book (Optional)</div>
        <label style="display:block;font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Upload PDF</label>
        <input type="file" id="book-pdf" accept=".pdf" style="display:block;width:100%;padding:.5rem;border:1px dashed #86efac;border-radius:6px;font-size:.82rem;background:#fff;" />
        <div id="book-pdf-current" style="font-size:.72rem;color:#047857;margin-top:.3rem;"></div>
      </div>

      <div style="margin-top:.75rem;padding:.75rem;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;">
        <div style="font-weight:800;color:#1e40af;font-size:.78rem;margin-bottom:.5rem;">🔗 External Source (Optional)</div>
        <label style="display:block;font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">URL</label>
        <input type="url" id="book-external-url" style="width:100%;padding:.5rem .75rem;font-size:.82rem;border:1px solid #93c5fd;border-radius:6px;background:#fff;" placeholder="https://..." />
        <label style="display:block;font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.5rem;margin-bottom:.3rem;">Source Name</label>
        <input type="text" id="book-external-source" style="width:100%;padding:.5rem .75rem;font-size:.82rem;border:1px solid #93c5fd;border-radius:6px;background:#fff;" placeholder="e.g., Project Gutenberg" />
      </div>

      <div style="margin-top:.75rem;display:flex;gap:1rem;">
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;cursor:pointer;">
          <input type="checkbox" id="book-is-digital" style="width:16px;height:16px;" /> Digital
        </label>
        <label style="display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;cursor:pointer;">
          <input type="checkbox" id="book-is-physical" checked style="width:16px;height:16px;" /> Physical
        </label>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="book-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="book-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Save Book</button>
      </div>
    </div>
  </div>
</div>

<style>
  .act-btn { padding: .35rem .7rem; font-size: .72rem; font-weight: 700; border-radius: 6px; border: none; cursor: pointer; margin-left: .25rem; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_BOOKS = [];

  async function load() {
    try {
      const res = await core.portalFetch('/api/librarian/books');
      ALL_BOOKS = res.data || [];
      render();
    } catch (err) {
      $('books-tbody').innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function render() {
    if (!ALL_BOOKS.length) {
      $('books-tbody').innerHTML = '<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">No books yet. Click "Add Book" to start.</td></tr>';
      return;
    }
    $('books-tbody').innerHTML = ALL_BOOKS.map(b => {
      const digital = b.ebookUrl || b.externalUrl;
      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(b.title)}</td>
          <td style="padding:.65rem .75rem;color:#475569;">${esc(b.author || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;color:#64748b;text-transform:capitalize;">${esc(b.category || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span style="padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;background:${b.copiesAvailable > 0 ? '#d1fae5' : '#fee2e2'};color:${b.copiesAvailable > 0 ? '#065f46' : '#991b1b'};">
              ${b.copiesAvailable} / ${b.copiesTotal}
            </span>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;font-size:1rem;">${b.ebookUrl ? '📖' : ''}${b.externalUrl ? '🔗' : ''}${!digital ? '—' : ''}</td>
          <td style="padding:.65rem .75rem;text-align:right;">
            <button class="act-btn" data-act="edit" data-id="${b.id}" style="background:#f1f5f9;color:#475569;">Edit</button>
            <button class="act-btn" data-act="delete" data-id="${b.id}" style="background:#fee2e2;color:#991b1b;">Delete</button>
          </td>
        </tr>
      `;
    }).join('');

    $('books-tbody').querySelectorAll('.act-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.id);
        const book = ALL_BOOKS.find(b => b.id === id);
        if (btn.dataset.act === 'edit') openModal(book);
        if (btn.dataset.act === 'delete') deleteBook(id, book.title);
      });
    });
  }

  async function deleteBook(id, title) {
    if (!confirm(`Delete "${title}"?`)) return;
    try {
      await core.portalFetch(`/api/librarian/books/${id}`, { method: 'DELETE' });
      core.showToast && core.showToast('Book deleted', 'success');
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  }

  function openModal(book) {
    $('book-modal').style.display = 'flex';
    $('book-modal-title').textContent = book ? 'Edit Book' : 'Add Book';
    $('book-id').value = book ? book.id : '';
    $('book-title').value = book ? book.title : '';
    $('book-author').value = book ? book.author || '' : '';
    $('book-isbn').value = book ? book.isbn || '' : '';
    $('book-category').value = book ? book.category || '' : '';
    $('book-publisher').value = book ? book.publisher || '' : '';
    $('book-year').value = book ? book.year || '' : '';
    $('book-copies').value = book ? book.copiesTotal : 1;
    $('book-shelf').value = book ? book.shelf || '' : '';
    $('book-description').value = book ? book.description || '' : '';
    $('book-external-url').value = book ? book.externalUrl || '' : '';
    $('book-external-source').value = book ? book.externalSource || '' : '';
    $('book-is-digital').checked = book ? !!book.isDigital : false;
    $('book-is-physical').checked = book ? !!book.isPhysical : true;
    $('book-pdf').value = '';

    if (book && book.ebookUrl) {
      $('book-pdf-current').innerHTML = `✅ Current PDF: <a href="${esc(book.ebookUrl)}" target="_blank" style="color:#065f46;font-weight:700;">View</a>`;
    } else {
      $('book-pdf-current').textContent = '';
    }
  }

  function closeModal() {
    $('book-modal').style.display = 'none';
  }

  async function saveBook() {
    const id = $('book-id').value;
    const title = $('book-title').value.trim();
    if (!title) return core.showToast && core.showToast('Title is required.', 'warning');

    const formData = new FormData();
    formData.append('title', title);
    formData.append('author', $('book-author').value.trim());
    formData.append('isbn', $('book-isbn').value.trim());
    formData.append('category', $('book-category').value.trim());
    formData.append('publisher', $('book-publisher').value.trim());
    formData.append('year', $('book-year').value);
    formData.append('copiesTotal', $('book-copies').value);
    formData.append('shelf', $('book-shelf').value.trim());
    formData.append('description', $('book-description').value.trim());
    formData.append('externalUrl', $('book-external-url').value.trim());
    formData.append('externalSource', $('book-external-source').value.trim());
    formData.append('isDigital', $('book-is-digital').checked ? 'true' : 'false');
    formData.append('isPhysical', $('book-is-physical').checked ? 'true' : 'false');

    const pdfFile = $('book-pdf').files[0];
    if (pdfFile) formData.append('pdf', pdfFile);

    const btn = $('book-save');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const token = localStorage.getItem('fpu_portal_token') || localStorage.getItem('portal_token');
      if (!token) throw new Error('Not logged in. Please refresh.');

      const url = id ? `/api/librarian/books/${id}` : '/api/librarian/books';
      const method = id ? 'PUT' : 'POST';

      console.log('[books/save] Sending', method, url, 'PDF:', pdfFile ? pdfFile.name : 'none');

      const res = await fetch(url, {
        method,
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData,
      });

      const text = await res.text();
      console.log('[books/save] Status:', res.status, 'Response:', text);

      let json;
      try { json = JSON.parse(text); } catch { json = { error: text || 'Invalid response' }; }

      if (!res.ok) throw new Error(json.error || `Server ${res.status}`);

      core.showToast && core.showToast('Book saved!', 'success');
      closeModal();
      load();
    } catch (err) {
      console.error('[books/save] Failed:', err);
      core.showToast && core.showToast(err.message || 'Save failed', 'error');
      alert('Save failed: ' + (err.message || 'Unknown error'));
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Book';
    }
  }

  $('book-add')?.addEventListener('click', () => openModal(null));
  $('book-refresh')?.addEventListener('click', load);
  $('book-modal-close')?.addEventListener('click', closeModal);
  $('book-cancel')?.addEventListener('click', closeModal);
  $('book-save')?.addEventListener('click', saveBook);
  $('book-modal')?.addEventListener('click', (e) => { if (e.target.id === 'book-modal') closeModal(); });

  load();
})();
</script>
