<!-- Portal → Librarian → Borrowing Records -->
<section class="lib-borrows" aria-label="Library borrowing records">
  <style>
    .lib-borrows{--g:#087653;--ink:#172b25;--muted:#718078;--line:#e5ece8;color:var(--ink);display:grid;gap:1rem}
    .lib-borrows *{box-sizing:border-box}
    .lib-borrows .lb-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
    .lib-borrows h2{margin:0;font-size:1.45rem;font-weight:850;color:var(--ink)}
    .lib-borrows .lb-sub{margin:.3rem 0 0;font-size:.84rem;color:var(--muted)}
    .lib-borrows .lb-btn{border:0;border-radius:9px;padding:.65rem 1rem;background:var(--g);color:#fff;font-size:.8rem;font-weight:800;cursor:pointer}
    .lib-borrows .lb-btn:disabled{opacity:.55;cursor:wait}
    .lib-borrows .lb-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
    .lib-borrows .lb-stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:.9rem 1rem}
    .lib-borrows .lb-stat span{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .lib-borrows .lb-stat strong{display:block;margin-top:.35rem;font-size:1.45rem;font-weight:900;color:var(--ink)}
    .lib-borrows .lb-stat.overdue strong{color:#b42318}
    .lib-borrows .lb-toolbar{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;padding:.85rem;background:#fff;border:1px solid var(--line);border-radius:12px}
    .lib-borrows .lb-search{flex:1 1 240px;min-width:0;padding:.68rem .8rem;border:1px solid #d8e2dc;border-radius:8px;background:#fff;color:#172b25;font-size:.82rem;outline:none}
    .lib-borrows .lb-search:focus,.lib-borrows .lb-filter:focus{border-color:#4aa783;box-shadow:0 0 0 3px rgba(8,118,83,.1)}
    .lib-borrows .lb-filter{padding:.68rem .8rem;border:1px solid #d8e2dc;border-radius:8px;background:#fff;color:#34483e;font-size:.8rem}
    .lib-borrows .lb-table-card{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff}
    .lib-borrows .lb-table-wrap{overflow-x:auto}
    .lib-borrows table{width:100%;min-width:850px;border-collapse:collapse;font-size:.79rem}
    .lib-borrows th{padding:.75rem .8rem;text-align:left;background:#f5f9f6;color:#718078;font-size:.65rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
    .lib-borrows td{padding:.78rem .8rem;border-top:1px solid #edf2ef;color:#40534a;vertical-align:middle}
    .lib-borrows td:first-child{font-weight:800;color:var(--ink)}
    .lib-borrows .lb-status{display:inline-flex;padding:.27rem .58rem;border-radius:99px;font-size:.68rem;font-weight:850;text-transform:capitalize;white-space:nowrap}
    .lib-borrows .lb-status.borrowed{background:#e9f7ef;color:#087653}.lib-borrows .lb-status.overdue{background:#fff0ef;color:#b42318}.lib-borrows .lb-status.returned{background:#eff3f1;color:#66756e}
    .lib-borrows .lb-return{border:0;border-radius:7px;padding:.42rem .65rem;background:#087653;color:#fff;font-size:.7rem;font-weight:800;cursor:pointer;white-space:nowrap}
    .lib-borrows .lb-return:disabled{opacity:.55;cursor:wait}
    .lib-borrows .lb-empty{padding:2.5rem 1rem;text-align:center;color:#829188}
    .lib-borrows .lb-count{padding:.7rem .9rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
    @media(max-width:640px){.lib-borrows .lb-stats{grid-template-columns:1fr 1fr}.lib-borrows .lb-stat:last-child{grid-column:1/-1}}
  </style>
  <header class="lb-head">
    <div><h2>Borrowing Records</h2><p class="lb-sub">Track issued books, due dates, returns and overdue records.</p></div>
    <button class="lb-btn" type="button" id="brw-refresh">↻ Refresh records</button>
  </header>
  <div class="lb-stats">
    <article class="lb-stat"><span>Total records</span><strong id="brw-total">—</strong></article>
    <article class="lb-stat"><span>Currently borrowed</span><strong id="brw-active">—</strong></article>
    <article class="lb-stat overdue"><span>Overdue records</span><strong id="brw-overdue">—</strong></article>
  </div>
  <div class="lb-toolbar">
    <input class="lb-search" id="brw-search" type="search" placeholder="Search book, student or matric number…" aria-label="Search borrowing records">
    <select class="lb-filter" id="brw-status" aria-label="Filter by status">
      <option value="all">All statuses</option><option value="borrowed">Borrowed</option><option value="overdue">Overdue</option><option value="returned">Returned</option>
    </select>
  </div>
  <div class="lb-table-card">
    <div class="lb-table-wrap"><table>
      <thead><tr><th>Book</th><th>Student</th><th>Matric number</th><th>Borrowed date</th><th>Due date</th><th>Status</th><th>Action</th></tr></thead>
      <tbody id="brw-tbody"><tr><td colspan="7" class="lb-empty">Loading borrowing records…</td></tr></tbody>
    </table></div>
    <div class="lb-count" id="brw-count" aria-live="polite">Loading records…</div>
  </div>
</section>
<script>
(function(){
  'use strict';
  const core=window.FPU_PORTAL||{};
  const $=id=>document.getElementById(id);
  const esc=s=>core.escapeHtml?core.escapeHtml(s):String(s==null?'':s);
  const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
  let ALL=[];
  function normalize(r){
    const b=r.borrow||r.borrowRecord||r;
    const student=r.user||r.student||{};
    const book=r.book||{};
    return {id:b.id,title:book.title||b.bookTitle||'—',student:[student.firstName,student.lastName].filter(Boolean).join(' ')||student.email||'—',matric:student.matricNumber||'—',borrowedAt:b.borrowedAt,dueAt:b.dueAt,status:String(b.status||'borrowed').toLowerCase()};
  }
  function render(){
    const query=($('brw-search').value||'').trim().toLowerCase();
    const status=$('brw-status').value;
    const rows=ALL.filter(r=>(status==='all'||r.status===status)&&[r.title,r.student,r.matric].join(' ').toLowerCase().includes(query));
    $('brw-count').textContent='Showing '+rows.length.toLocaleString()+' of '+ALL.length.toLocaleString()+' borrowing records';
    if(!rows.length){$('brw-tbody').innerHTML='<tr><td colspan="7" class="lb-empty">No borrowing records match your search.</td></tr>';return;}
    $('brw-tbody').innerHTML=rows.map(r=>{
      const label=r.status==='returned'?'Returned':r.status==='overdue'?'Overdue':'Borrowed';
      const action=(r.status==='borrowed'||r.status==='overdue')?'<button type="button" class="lb-return" data-return="'+esc(r.id)+'">Record return</button>':'<span style="color:#94a3b8">—</span>';
      return '<tr><td>'+esc(r.title)+'</td><td>'+esc(r.student)+'</td><td>'+esc(r.matric)+'</td><td>'+fmtDate(r.borrowedAt)+'</td><td>'+fmtDate(r.dueAt)+'</td><td><span class="lb-status '+(r.status==='overdue'?'overdue':r.status==='returned'?'returned':'borrowed')+'">'+label+'</span></td><td>'+action+'</td></tr>';
    }).join('');
    $('brw-tbody').querySelectorAll('[data-return]').forEach(btn=>btn.addEventListener('click',()=>recordReturn(btn.dataset.return,btn)));
  }
  async function recordReturn(id,btn){
    if(!confirm('Confirm that this book has been returned?'))return;
    btn.disabled=true;btn.textContent='Processing…';
    try{
      await core.portalFetch('/api/librarian/borrows/'+encodeURIComponent(id)+'/return',{method:'POST'});
      core.showToast&&core.showToast('Book return recorded successfully.','success');
      await load();
    }catch(err){core.showToast&&core.showToast(err.message||'Unable to record return.','error');btn.disabled=false;btn.textContent='Record return';}
  }
  async function load(){
    $('brw-tbody').innerHTML='<tr><td colspan="7" class="lb-empty">Loading borrowing records…</td></tr>';
    try{
      const res=await core.portalFetch('/api/librarian/borrows');
      ALL=(res.data||[]).map(normalize);
      $('brw-total').textContent=ALL.length.toLocaleString();
      $('brw-active').textContent=ALL.filter(r=>r.status==='borrowed').length.toLocaleString();
      $('brw-overdue').textContent=ALL.filter(r=>r.status==='overdue').length.toLocaleString();
      render();
    }catch(err){
      $('brw-tbody').innerHTML='<tr><td colspan="7" class="lb-empty">⚠ '+esc(err.message||'Unable to load borrowing records.')+'</td></tr>';
      $('brw-count').textContent='Records could not be loaded';
      core.showToast&&core.showToast(err.message||'Unable to load borrowing records.','error');
    }
  }
  $('brw-refresh')?.addEventListener('click',load);
  $('brw-search')?.addEventListener('input',render);
  $('brw-status')?.addEventListener('change',render);
  load();
})();
</script>
