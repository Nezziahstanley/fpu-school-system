<!-- Portal → Librarian → Dashboard -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📚</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">Welcome, <span id="lib-name">Librarian</span></div>
        <div style="font-size:.82rem;color:#d1fae5;">Library Services</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:1.1rem;font-weight:800;">Library</div>
      <div style="font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#a7f3d0;">Unit</div>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;">
      <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;">Total Books</div>
      <div style="font-size:1.5rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-books">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;">
      <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;">Active Borrows</div>
      <div style="font-size:1.5rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-active">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;">
      <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;">Overdue</div>
      <div style="font-size:1.5rem;font-weight:800;color:#991b1b;line-height:1;" id="stat-overdue">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;">
      <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;">Outstanding Fines</div>
      <div style="font-size:1.5rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-fines">₦—</div>
    </div>
  </div>

  <!-- TAB BUTTONS (Navigation) -->
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <a href="#librarian-books" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#ecfdf5;color:#065f46;border:1px solid #bbf7d0;border-radius:99px;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;">📚 Books</a>
    <a href="#librarian-reservations" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#ecfdf5;color:#065f46;border:1px solid #bbf7d0;border-radius:99px;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;">🔖 Reservations</a>
    <a href="#librarian-fines" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#ecfdf5;color:#065f46;border:1px solid #bbf7d0;border-radius:99px;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;">💰 Fines</a>
    <a href="#librarian-borrows" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#ecfdf5;color:#065f46;border:1px solid #bbf7d0;border-radius:99px;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem;">📖 Borrows</a>
  </div>

  <!-- RECENT BORROWS TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:1rem;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">Recent Borrows</div>
      <a href="#librarian-borrows" style="font-size:.75rem;color:#065f46;text-decoration:none;font-weight:700;">View all →</a>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Book</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Due</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
          </tr>
        </thead>
        <tbody id="recent-borrows-tbody">
          <tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- RECENT RESERVATIONS TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">Reservations Awaiting Action</div>
      <a href="#librarian-reservations" style="font-size:.75rem;color:#065f46;text-decoration:none;font-weight:700;">View all →</a>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Book</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Reserved</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
          </tr>
        </thead>
        <tbody id="recent-reservations-tbody">
          <tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';
  const fmtMoney = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');

  async function load() {
    try {
      const user = core.getPortalUser ? core.getPortalUser() : {};
      if ($('lib-name')) $('lib-name').textContent = user.firstName || 'Librarian';

      const res = await core.portalFetch('/api/librarian/dashboard');
      const d = res.data || {};

      $('stat-books').textContent = d.totalBooks ?? 0;
      $('stat-active').textContent = d.activeBorrows ?? 0;
      $('stat-overdue').textContent = d.overdue ?? 0;
      $('stat-fines').textContent = fmtMoney(d.outstandingFines || 0);

      // Recent Borrows
      const borrows = d.recentBorrows || [];
      if (!borrows.length) {
        $('recent-borrows-tbody').innerHTML = '<tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">No recent borrows.</td></tr>';
      } else {
        $('recent-borrows-tbody').innerHTML = borrows.map(b => {
          let badge = '';
          const s = (b.status || '').toLowerCase();
          if (s === 'returned') badge = '<span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">Returned</span>';
          else if (s === 'overdue') badge = '<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">Overdue</span>';
          else badge = '<span style="background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">Borrowed</span>';

          return `
            <tr style="border-bottom:1px solid #f1f5f9;">
              <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(b.bookTitle)}</td>
              <td style="padding:.65rem .75rem;color:#475569;">${esc(b.studentName)}</td>
              <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(b.dueAt)}</td>
              <td style="padding:.65rem .75rem;text-align:center;">${badge}</td>
            </tr>
          `;
        }).join('');
      }

      // Recent Reservations
      const reservations = d.reservations || [];
      if (!reservations.length) {
        $('recent-reservations-tbody').innerHTML = '<tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">No pending reservations.</td></tr>';
      } else {
        $('recent-reservations-tbody').innerHTML = reservations.map(r => `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.bookTitle)}</td>
            <td style="padding:.65rem .75rem;color:#475569;">${esc(r.studentName)}</td>
            <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(r.reservedAt)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;text-transform:capitalize;">${esc(r.status)}</span>
            </td>
          </tr>
        `).join('');
      }

    } catch (err) {
      console.error('[librarian/dashboard] Error:', err);
      core.showToast && core.showToast('Failed to load dashboard: ' + err.message, 'error');
    }
  }

  load();
})();
</script>
