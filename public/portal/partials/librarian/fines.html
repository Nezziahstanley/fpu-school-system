.lib-page-hero.lib-page-hero h2{color:#fff!important}.lib-page-hero.lib-page-hero p{color:#d9f5e8!important}
.lib-page-hero{min-height:126px}

.lib-page-hero:after{content:"";position:absolute;z-index:-1;width:230px;height:230px;border:1px solid rgba(255,255,255,.13);border-radius:50%;right:7%;top:-145px;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}
.lib-page-welcome{display:flex;align-items:center;gap:.9rem;min-width:0;position:relative;z-index:1}.lib-page-avatar{width:54px;height:54px;flex:0 0 54px;border:2px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);font-size:1.05rem;font-weight:850;color:#fff}
.lib-page-eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#c7f5df;margin-bottom:.28rem}.lib-page-hero h2{font-size:clamp(1.2rem,2.5vw,1.65rem)!important;line-height:1.2!important;margin:0!important;color:#fff!important;font-weight:850!important;letter-spacing:-.025em!important}.lib-page-hero p{margin:.35rem 0 0!important;color:#d9f5e8!important;font-size:.84rem!important}
.lib-page-unit{position:relative;z-index:1;text-align:right;padding-left:1rem}.lib-page-unit strong{display:block;font-size:1rem;color:#fff}.lib-page-unit span{display:block;margin-top:.25rem;font-size:.67rem;letter-spacing:.12em;text-transform:uppercase;color:#b8ead2;font-weight:800}
.lib-page-actions{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}.lib-page-actions button{border-radius:8px!important;font-weight:800!important}
@media(max-width:640px){.lib-page-hero{padding:1.1rem!important;align-items:flex-start!important;flex-direction:column!important}.lib-page-unit{padding-left:calc(54px + .9rem);text-align:left}.lib-page-actions{justify-content:flex-start}}
</style>
<style>
.lib-fines{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif!important;letter-spacing:-.01em}.lib-fines .lf-head{align-items:center!important;padding:1.35rem 1.5rem!important;border-radius:18px!important;background:linear-gradient(120deg,#064e3b 0%,#087653 58%,#10a16e 100%)!important;box-shadow:0 12px 28px rgba(6,78,59,.13)!important}.lib-fines .lf-head h2{color:#fff!important;font-size:clamp(1.2rem,2.5vw,1.65rem)!important;line-height:1.2!important;letter-spacing:-.025em!important}.lib-fines .lf-head .lf-sub{color:#d9f5e8!important}.lib-fines .lf-head .lf-btn{background:#fff!important;color:#075b42!important}.lib-fines th,.lib-fines label{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif!important;letter-spacing:.07em}@media(max-width:640px){.lib-fines .lf-head{padding:1.1rem!important}}
</style>
<!-- Portal → Librarian → Fines -->
<section class="lib-fines" aria-label="Library fines">
  <style>
    .lib-fines{--g:#087653;--ink:#172b25;--muted:#718078;--line:#e5ece8;color:var(--ink);display:grid;gap:1rem}
    .lib-fines *{box-sizing:border-box}
    .lib-fines .lf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
    .lib-fines h2{margin:0;font-size:1.45rem;font-weight:850;color:var(--ink)}.lib-fines .lf-sub{margin:.3rem 0 0;font-size:.84rem;color:var(--muted)}
    .lib-fines .lf-btn{border:0;border-radius:9px;padding:.65rem 1rem;background:var(--g);color:#fff;font-size:.8rem;font-weight:800;cursor:pointer}
    .lib-fines .lf-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
    .lib-fines .lf-stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:.9rem 1rem}
    .lib-fines .lf-stat span{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.lib-fines .lf-stat strong{display:block;margin-top:.35rem;font-size:1.4rem;font-weight:900;color:var(--ink);overflow-wrap:anywhere}
    .lib-fines .lf-stat.unpaid strong{color:#b42318}.lib-fines .lf-stat.paid strong{color:#087653}
    .lib-fines .lf-toolbar{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;padding:.85rem;background:#fff;border:1px solid var(--line);border-radius:12px}
    .lib-fines .lf-search{flex:1 1 240px;min-width:0;padding:.68rem .8rem;border:1px solid #d8e2dc;border-radius:8px;background:#fff;color:#172b25;font-size:.82rem;outline:none}
    .lib-fines .lf-filter{padding:.68rem .8rem;border:1px solid #d8e2dc;border-radius:8px;background:#fff;color:#34483e;font-size:.8rem}
    .lib-fines .lf-search:focus,.lib-fines .lf-filter:focus{border-color:#4aa783;box-shadow:0 0 0 3px rgba(8,118,83,.1)}
    .lib-fines .lf-card{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff}.lib-fines .lf-table-wrap{overflow-x:auto}
    .lib-fines table{width:100%;min-width:720px;border-collapse:collapse;font-size:.79rem}
    .lib-fines th{padding:.75rem .8rem;text-align:left;background:#f5f9f6;color:#718078;font-size:.65rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
    .lib-fines td{padding:.78rem .8rem;border-top:1px solid #edf2ef;color:#40534a;vertical-align:middle}.lib-fines td:first-child{font-weight:800;color:var(--ink)}
    .lib-fines .lf-amount{font-weight:850;color:#b42318;white-space:nowrap}.lib-fines .lf-amount.paid{color:#087653}
    .lib-fines .lf-status{display:inline-flex;padding:.27rem .58rem;border-radius:99px;font-size:.68rem;font-weight:850}.lib-fines .lf-status.paid{background:#e9f7ef;color:#087653}.lib-fines .lf-status.unpaid{background:#fff0ef;color:#b42318}
    .lib-fines .lf-pay{border:0;border-radius:7px;padding:.44rem .68rem;background:#087653;color:#fff;font-size:.7rem;font-weight:800;cursor:pointer;white-space:nowrap}.lib-fines .lf-pay:disabled{opacity:.55;cursor:wait}
    .lib-fines .lf-empty{padding:2.5rem 1rem;text-align:center;color:#829188}.lib-fines .lf-count{padding:.7rem .9rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
    @media(max-width:640px){.lib-fines .lf-stats{grid-template-columns:1fr 1fr}.lib-fines .lf-stat:last-child{grid-column:1/-1}}
  </style>
  <header class="lib-page-hero"><div class="lib-page-welcome"><div class="lib-page-avatar" id="lib-page-avatar" aria-hidden="true">LB</div><div><div class="lib-page-eyebrow">Library Services</div><h2>Welcome back, <span id="lib-page-name">Librarian</span></h2><p>Review outstanding charges and record fine payments.</p></div></div><div class="lib-page-unit"><strong>Federal Polytechnic Ugep</strong><span>Library Unit</span></div></header><div class="lib-page-actions"><button class="lf-btn" type="button" id="fns-refresh">↻ Refresh fines</button></div>
  <div class="lf-stats">
    <article class="lf-stat"><span>Total fine records</span><strong id="fns-total">—</strong></article>
    <article class="lf-stat unpaid"><span>Outstanding amount</span><strong id="fns-outstanding">—</strong></article>
    <article class="lf-stat paid"><span>Collected amount</span><strong id="fns-collected">—</strong></article>
  </div>
  <div class="lf-toolbar">
    <input class="lf-search" id="fns-search" type="search" placeholder="Search student, matric number or reason…" aria-label="Search library fines">
    <select class="lf-filter" id="fns-status" aria-label="Filter fines by payment status"><option value="all">All payments</option><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select>
  </div>
  <div class="lf-card"><div class="lf-table-wrap"><table>
    <thead><tr><th>Student</th><th>Matric number</th><th>Reason</th><th>Amount</th><th>Payment status</th><th>Action</th></tr></thead>
    <tbody id="fns-tbody"><tr><td colspan="6" class="lf-empty">Loading fine records…</td></tr></tbody>
  </table></div><div class="lf-count" id="fns-count" aria-live="polite">Loading fine records…</div></div>
</section>
<script>
(function(){
  'use strict';
  const core=window.FPU_PORTAL||{};
  const $=id=>document.getElementById(id);
  const esc=s=>core.escapeHtml?core.escapeHtml(s):String(s==null?'':s);
  const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{maximumFractionDigits:2});
  let ALL=[];
  function normalize(r){
    const f=r.fine||r,student=r.user||r.student||{};
    const paid=f.isPaid===true||f.isPaid==='true';
    return {id:f.id,student:[student.firstName,student.lastName].filter(Boolean).join(' ')||student.email||'—',matric:student.matricNumber||'—',reason:f.reason||'—',amount:Number(f.amount||0),paid};
  }
  function render(){
    const q=($('fns-search').value||'').trim().toLowerCase(),filter=$('fns-status').value;
    const rows=ALL.filter(r=>(filter==='all'||(filter==='paid'?r.paid:!r.paid))&&[r.student,r.matric,r.reason].join(' ').toLowerCase().includes(q));
    $('fns-count').textContent='Showing '+rows.length.toLocaleString()+' of '+ALL.length.toLocaleString()+' fine records';
    if(!rows.length){$('fns-tbody').innerHTML='<tr><td colspan="6" class="lf-empty">No fine records match your search.</td></tr>';return;}
    $('fns-tbody').innerHTML=rows.map(r=>'<tr><td>'+esc(r.student)+'</td><td>'+esc(r.matric)+'</td><td>'+esc(r.reason)+'</td><td><span class="lf-amount '+(r.paid?'paid':'')+'">'+money(r.amount)+'</span></td><td><span class="lf-status '+(r.paid?'paid':'unpaid')+'">'+(r.paid?'Paid':'Unpaid')+'</span></td><td>'+(r.paid?'<span style="color:#94a3b8">Completed</span>':'<button type="button" class="lf-pay" data-id="'+esc(r.id)+'">Mark paid</button>')+'</td></tr>').join('');
    $('fns-tbody').querySelectorAll('[data-id]').forEach(btn=>btn.addEventListener('click',()=>markPaid(btn.dataset.id,btn)));
  }
  async function markPaid(id,btn){
    if(!confirm('Confirm that this fine has been paid?'))return;
    btn.disabled=true;btn.textContent='Updating…';
    try{
      await core.portalFetch('/api/librarian/fines/'+encodeURIComponent(id)+'/pay',{method:'POST'});
      core.showToast&&core.showToast('Fine payment recorded.','success');
      await load();
    }catch(err){core.showToast&&core.showToast(err.message||'Unable to update fine.','error');btn.disabled=false;btn.textContent='Mark paid';}
  }
  async function load(){
    $('fns-tbody').innerHTML='<tr><td colspan="6" class="lf-empty">Loading fine records…</td></tr>';
    try{
      const res=await core.portalFetch('/api/librarian/fines');
      ALL=(res.data||[]).map(normalize);
      const paid=ALL.filter(r=>r.paid),unpaid=ALL.filter(r=>!r.paid);
      $('fns-total').textContent=ALL.length.toLocaleString();
      $('fns-outstanding').textContent=money(unpaid.reduce((n,r)=>n+r.amount,0));
      $('fns-collected').textContent=money(paid.reduce((n,r)=>n+r.amount,0));
      render();
    }catch(err){
      $('fns-tbody').innerHTML='<tr><td colspan="6" class="lf-empty">⚠ '+esc(err.message||'Unable to load fine records.')+'</td></tr>';
      $('fns-count').textContent='Fine records could not be loaded';
      core.showToast&&core.showToast(err.message||'Unable to load fine records.','error');
    }
  }
  $('fns-refresh')?.addEventListener('click',load);
  $('fns-search')?.addEventListener('input',render);
  $('fns-status')?.addEventListener('change',render);
  load();
})();
</script>
<script>(function(){const core=window.FPU_PORTAL||{};const user=core.getPortalUser?core.getPortalUser():{};const initials=[user.firstName,user.lastName].filter(Boolean).map(v=>String(v).trim().charAt(0)).join('').toUpperCase();const a=document.getElementById('lib-page-avatar'),n=document.getElementById('lib-page-name');if(a)a.textContent=initials||'LB';if(n)n.textContent=user.firstName||'Librarian';})();</script>
