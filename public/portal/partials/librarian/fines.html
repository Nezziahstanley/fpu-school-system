<!-- Portal → Librarian → Fines -->
<div style="padding:0;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Fines</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">All library fines</p>
    </div>
    <button id="fns-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Reason</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Amount</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="fns-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtMoney = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');

  async function load() {
    try {
      const res = await core.portalFetch('/api/librarian/fines');
      const rows = res.data || [];

      if (!rows.length) {
        $('fns-tbody').innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">No fines recorded.</td></tr>';
        return;
      }

      $('fns-tbody').innerHTML = rows.map(r => {
        const f = r.fine || r;
        const student = r.user || r.student || {};
        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc((student.firstName || '') + ' ' + (student.lastName || ''))}</td>
            <td style="padding:.65rem .75rem;color:#475569;">${esc(f.reason || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:right;font-weight:700;color:${f.isPaid ? '#065f46' : '#991b1b'};">${fmtMoney(f.amount)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="background:${f.isPaid ? '#d1fae5' : '#fef3c7'};color:${f.isPaid ? '#065f46' : '#92400e'};padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">${f.isPaid ? 'Paid' : 'Unpaid'}</span>
            </td>
            <td style="padding:.65rem .75rem;text-align:right;">
              ${!f.isPaid ? `<button class="fns-btn" data-id="${f.id}" style="background:#065f46;color:#fff;">Mark Paid</button>` : '—'}
            </td>
          </tr>
        `;
      }).join('');

      $('fns-tbody').querySelectorAll('.fns-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Mark this fine as paid?')) return;
          try {
            await core.portalFetch(`/api/librarian/fines/${btn.dataset.id}/pay`, { method: 'POST' });
            core.showToast && core.showToast('Fine marked as paid.', 'success');
            load();
          } catch (err) { core.showToast && core.showToast(err.message, 'error'); }
        });
      });
    } catch (err) {
      $('fns-tbody').innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  $('fns-refresh')?.addEventListener('click', load);
  load();
})();
</script>
