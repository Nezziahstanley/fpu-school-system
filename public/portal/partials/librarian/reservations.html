<!-- Portal → Librarian → Reservations -->
<div style="padding:0;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Reservations</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Pending book reservations</p>
    </div>
    <button id="rvs-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Book</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Reserved</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="rvs-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  async function load() {
    try {
      const res = await core.portalFetch('/api/librarian/reservations?status=pending');
      const rows = res.data || [];

      if (!rows.length) {
        $('rvs-tbody').innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">No pending reservations.</td></tr>';
        return;
      }

      $('rvs-tbody').innerHTML = rows.map(r => {
        const rv = r.reservation || r;
        const student = r.user || r.student || {};
        const book = r.book || {};
        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(book.title || rv.bookTitle || '—')}</td>
            <td style="padding:.65rem .75rem;color:#475569;">${esc((student.firstName || '') + ' ' + (student.lastName || ''))}</td>
            <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(rv.reservedAt)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">Pending</span>
            </td>
            <td style="padding:.65rem .75rem;text-align:right;">
              <button class="rvs-btn" data-id="${rv.id}" data-act="ready" style="background:#1e40af;color:#fff;">Mark Ready</button>
              <button class="rvs-btn" data-id="${rv.id}" data-act="cancel" style="background:#fee2e2;color:#991b1b;">Cancel</button>
            </td>
          </tr>
        `;
      }).join('');

      $('rvs-tbody').querySelectorAll('.rvs-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const act = btn.dataset.act;
          try {
            await core.portalFetch(`/api/librarian/reservations/${id}/${act}`, { method: 'POST' });
            core.showToast && core.showToast('Updated.', 'success');
            load();
          } catch (err) { core.showToast && core.showToast(err.message, 'error'); }
        });
      });
    } catch (err) {
      $('rvs-tbody').innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  $('rvs-refresh')?.addEventListener('click', load);
  load();
})();
</script>
