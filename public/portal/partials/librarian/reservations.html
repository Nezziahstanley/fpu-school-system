<!-- Portal → Librarian → Reservations -->
<section class="lib-reservations" aria-label="Library reservations">
  <style>
    .lib-reservations{--g:#087653;--ink:#172b25;--muted:#718078;--line:#e5ece8;color:var(--ink);display:grid;gap:1rem}
    .lib-reservations *{box-sizing:border-box}
    .lib-reservations .lr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
    .lib-reservations h2{margin:0;font-size:1.45rem;font-weight:850;color:var(--ink)}.lib-reservations .lr-sub{margin:.3rem 0 0;font-size:.84rem;color:var(--muted)}
    .lib-reservations .lr-btn{border:0;border-radius:9px;padding:.65rem 1rem;background:var(--g);color:#fff;font-size:.8rem;font-weight:800;cursor:pointer}.lib-reservations .lr-btn:disabled{opacity:.55;cursor:wait}
    .lib-reservations .lr-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
    .lib-reservations .lr-stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:.9rem 1rem}
    .lib-reservations .lr-stat span{display:block;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.lib-reservations .lr-stat strong{display:block;margin-top:.35rem;font-size:1.45rem;font-weight:900;color:var(--ink)}
    .lib-reservations .lr-toolbar{display:flex;align-items:center;gap:.65rem;flex-wrap:wrap;padding:.85rem;background:#fff;border:1px solid var(--line);border-radius:12px}
    .lib-reservations .lr-search{flex:1 1 240px;min-width:0;padding:.68rem .8rem;border:1px solid #d8e2dc;border-radius:8px;background:#fff;color:#172b25;font-size:.82rem;outline:none}
    .lib-reservations .lr-filter{padding:.68rem .8rem;border:1px solid #d8e2dc;border-radius:8px;background:#fff;color:#34483e;font-size:.8rem}
    .lib-reservations .lr-search:focus,.lib-reservations .lr-filter:focus{border-color:#4aa783;box-shadow:0 0 0 3px rgba(8,118,83,.1)}
    .lib-reservations .lr-card{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#fff}.lib-reservations .lr-table-wrap{overflow-x:auto}
    .lib-reservations table{width:100%;min-width:800px;border-collapse:collapse;font-size:.79rem}
    .lib-reservations th{padding:.75rem .8rem;text-align:left;background:#f5f9f6;color:#718078;font-size:.65rem;font-weight:850;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
    .lib-reservations td{padding:.78rem .8rem;border-top:1px solid #edf2ef;color:#40534a;vertical-align:middle}.lib-reservations td:first-child{font-weight:800;color:var(--ink)}
    .lib-reservations .lr-status{display:inline-flex;padding:.27rem .58rem;border-radius:99px;font-size:.68rem;font-weight:850;text-transform:capitalize;white-space:nowrap}
    .lib-reservations .lr-status.pending{background:#fff7e8;color:#9a6700}.lib-reservations .lr-status.ready{background:#eaf2ff;color:#1d4ed8}.lib-reservations .lr-status.fulfilled{background:#e9f7ef;color:#087653}.lib-reservations .lr-status.cancelled{background:#eff3f1;color:#66756e}
    .lib-reservations .lr-actions{display:flex;gap:.35rem;flex-wrap:wrap}
    .lib-reservations .lr-action{border:0;border-radius:7px;padding:.42rem .62rem;font-size:.69rem;font-weight:800;cursor:pointer;white-space:nowrap}
    .lib-reservations .lr-action.ready{background:#1d4ed8;color:#fff}.lib-reservations .lr-action.fulfill{background:#087653;color:#fff}.lib-reservations .lr-action.cancel{background:#fff0ef;color:#b42318}
    .lib-reservations .lr-action:disabled{opacity:.55;cursor:wait}
    .lib-reservations .lr-empty{padding:2.5rem 1rem;text-align:center;color:#829188}.lib-reservations .lr-count{padding:.7rem .9rem;border-top:1px solid var(--line);font-size:.72rem;color:var(--muted)}
    @media(max-width:640px){.lib-reservations .lr-stats{grid-template-columns:1fr 1fr}.lib-reservations .lr-stat:last-child{grid-column:1/-1}}
  </style>
  <header class="lr-head">
    <div><h2>Book Reservations</h2><p class="lr-sub">Review student requests and manage each reservation through to collection.</p></div>
    <button class="lr-btn" type="button" id="rvs-refresh">↻ Refresh reservations</button>
  </header>
  <div class="lr-stats">
    <article class="lr-stat"><span>Pending requests</span><strong id="rvs-pending">—</strong></article>
    <article class="lr-stat"><span>Ready for collection</span><strong id="rvs-ready">—</strong></article>
    <article class="lr-stat"><span>Fulfilled reservations</span><strong id="rvs-fulfilled">—</strong></article>
  </div>
  <div class="lr-toolbar">
    <input class="lr-search" id="rvs-search" type="search" placeholder="Search book or student…" aria-label="Search reservations">
    <select class="lr-filter" id="rvs-status" aria-label="Filter reservations by status">
      <option value="all">All statuses</option><option value="pending">Pending</option><option value="ready">Ready</option><option value="fulfilled">Fulfilled</option><option value="cancelled">Cancelled</option>
    </select>
  </div>
  <div class="lr-card">
    <div class="lr-table-wrap"><table>
      <thead><tr><th>Book</th><th>Student</th><th>Matric number</th><th>Reserved date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="rvs-tbody"><tr><td colspan="6" class="lr-empty">Loading reservations…</td></tr></tbody>
    </table></div>
    <div class="lr-count" id="rvs-count" aria-live="polite">Loading reservations…</div>
  </div>
</section>
<script>
(function(){
  'use strict';
  const core=window.FPU_PORTAL||{};
  const $=id=>document.getElementById(id);
  const esc=s=>core.escapeHtml?core.escapeHtml(s):String(s==null?'':s);
  const fmtDate=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'—';
  let ALL=[];
  function normalize(r){
    const rv=r.reservation||r;
    const student=r.user||r.student||{};
    const book=r.book||{};
    return {id:rv.id,title:book.title||rv.bookTitle||'—',student:[student.firstName,student.lastName].filter(Boolean).join(' ')||student.email||'—',matric:student.matricNumber||'—',reservedAt:rv.reservedAt,status:String(rv.status||'pending').toLowerCase()};
  }
  function render(){
    const q=($('rvs-search').value||'').trim().toLowerCase(),filter=$('rvs-status').value;
    const rows=ALL.filter(r=>(filter==='all'||r.status===filter)&&[r.title,r.student,r.matric].join(' ').toLowerCase().includes(q));
    $('rvs-count').textContent='Showing '+rows.length.toLocaleString()+' of '+ALL.length.toLocaleString()+' reservations';
    if(!rows.length){$('rvs-tbody').innerHTML='<tr><td colspan="6" class="lr-empty">No reservations match your search.</td></tr>';return;}
    $('rvs-tbody').innerHTML=rows.map(r=>{
      let actions='';
      if(r.status==='pending')actions='<button type="button" class="lr-action ready" data-act="ready" data-id="'+esc(r.id)+'">Mark ready</button><button type="button" class="lr-action cancel" data-act="cancel" data-id="'+esc(r.id)+'">Cancel</button>';
      else if(r.status==='ready')actions='<button type="button" class="lr-action fulfill" data-act="fulfill" data-id="'+esc(r.id)+'">Mark fulfilled</button><button type="button" class="lr-action cancel" data-act="cancel" data-id="'+esc(r.id)+'">Cancel</button>';
      else actions='<span style="color:#94a3b8">No action</span>';
      const status=['pending','ready','fulfilled','cancelled'].includes(r.status)?r.status:'pending';
      return '<tr><td>'+esc(r.title)+'</td><td>'+esc(r.student)+'</td><td>'+esc(r.matric)+'</td><td>'+fmtDate(r.reservedAt)+'</td><td><span class="lr-status '+status+'">'+esc(r.status)+'</span></td><td><div class="lr-actions">'+actions+'</div></td></tr>';
    }).join('');
    $('rvs-tbody').querySelectorAll('[data-act]').forEach(btn=>btn.addEventListener('click',()=>update(btn.dataset.id,btn.dataset.act,btn)));
  }
  async function update(id,action,btn){
    const prompts={ready:'Mark this reservation as ready for collection?',fulfill:'Confirm that this reservation has been fulfilled?',cancel:'Cancel this reservation?'};
    if(!confirm(prompts[action]||'Update this reservation?'))return;
    btn.disabled=true;btn.textContent='Updating…';
    try{
      const endpoint=action==='ready'?'ready':action==='fulfill'?'fulfill':'cancel';
      await core.portalFetch('/api/librarian/reservations/'+encodeURIComponent(id)+'/'+endpoint,{method:'POST'});
      core.showToast&&core.showToast(action==='ready'?'Reservation marked ready.':action==='fulfill'?'Reservation marked fulfilled.':'Reservation cancelled.','success');
      await load();
    }catch(err){core.showToast&&core.showToast(err.message||'Unable to update reservation.','error');btn.disabled=false;}
  }
  async function load(){
    $('rvs-tbody').innerHTML='<tr><td colspan="6" class="lr-empty">Loading reservations…</td></tr>';
    try{
      const res=await core.portalFetch('/api/librarian/reservations');
      ALL=(res.data||[]).map(normalize);
      $('rvs-pending').textContent=ALL.filter(r=>r.status==='pending').length.toLocaleString();
      $('rvs-ready').textContent=ALL.filter(r=>r.status==='ready').length.toLocaleString();
      $('rvs-fulfilled').textContent=ALL.filter(r=>r.status==='fulfilled').length.toLocaleString();
      render();
    }catch(err){
      $('rvs-tbody').innerHTML='<tr><td colspan="6" class="lr-empty">⚠ '+esc(err.message||'Unable to load reservations.')+'</td></tr>';
      $('rvs-count').textContent='Reservation data could not be loaded';
      core.showToast&&core.showToast(err.message||'Unable to load reservations.','error');
    }
  }
  $('rvs-refresh')?.addEventListener('click',load);
  $('rvs-search')?.addEventListener('input',render);
  $('rvs-status')?.addEventListener('change',render);
  load();
})();
</script>
