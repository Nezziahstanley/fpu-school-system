<section class="rector-list-page"><header class="rector-page-head"><div><h2>Admissions Overview by Department</h2><p>Monitor application volumes and status distribution across departments.</p></div><button type="button" id="rector-apps-refresh">↻ Refresh</button></header><div class="rector-toolbar"><span id="rector-apps-count">Loading department summaries…</span></div><div class="rector-table-wrap"><table><thead><tr><th>Department</th><th>Total</th><th>Pending</th><th>Under Review</th><th>Approved</th><th>Registered</th><th>Rejected</th></tr></thead><tbody id="rector-apps-body"><tr><td colspan="7">Loading admissions data…</td></tr></tbody></table></div></section>
<style>.rector-list-page{color:#0f172a}.rector-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.rector-page-head h2{margin:0;font-size:1.35rem}.rector-page-head p{margin:.35rem 0;color:#64748b;font-size:.85rem}.rector-page-head button{background:#065f46;color:#fff;border:0;border-radius:9px;padding:.65rem 1rem;font-weight:700;cursor:pointer}.rector-toolbar{margin-bottom:.8rem;color:#64748b;font-size:.8rem}.rector-table-wrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.rector-table-wrap table{width:100%;border-collapse:collapse;min-width:760px;font-size:.82rem}.rector-table-wrap th,.rector-table-wrap td{padding:.8rem .9rem;text-align:right;border-bottom:1px solid #f1f5f9}.rector-table-wrap th:first-child,.rector-table-wrap td:first-child{text-align:left}.rector-table-wrap th{background:#f8fafc;color:#475569;font-size:.7rem;text-transform:uppercase}.rector-table-wrap td{color:#334155}</style>
<script>(function(){'use strict';const c=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>c.escapeHtml?c.escapeHtml(v):String(v??'');async function load(){$('rector-apps-body').innerHTML='<tr><td colspan="7">Loading admissions data…</td></tr>';try{const r=await c.portalFetch('/api/rector/applications-by-department');const a=Array.isArray(r.data)?r.data:[];$('rector-apps-count').textContent=a.length+' department group(s)';$('rector-apps-body').innerHTML=a.length?a.map(x=>'<tr><td><strong>'+esc(x.departmentCode||'')+'</strong> '+esc(x.departmentName||'Unassigned department')+'</td><td>'+Number(x.total||0)+'</td><td>'+Number(x.pending||0)+'</td><td>'+Number(x.underReview||0)+'</td><td>'+Number(x.approved||0)+'</td><td>'+Number(x.registered||0)+'</td><td>'+Number(x.rejected||0)+'</td></tr>').join(''):'<tr><td colspan="7">No applications have been recorded yet.</td></tr>'}catch(e){$('rector-apps-body').innerHTML='<tr><td colspan="7">Unable to load admissions overview. '+esc(e.message)+'</td></tr>';c.showToast&&c.showToast('Could not load admissions overview','error')}}$('rector-apps-refresh').addEventListener('click',load);load()})();</script>
