<section class="rector-list-page"><header class="rector-page-head"><div><h2>Admissions Overview by Department</h2><p>Select a department to inspect its application pipeline.</p></div><button id="ra-refresh" type="button">↻ Refresh</button></header><div id="ra-cards" class="ra-cards">Loading department summaries…</div><section id="ra-detail" class="ra-detail"><h3>Select a department</h3><p>Choose a department card to see its admission overview.</p></section></section><style>.rector-list-page{color:#0f172a}.rector-page-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}.rector-page-head h2{margin:0}.rector-page-head p{color:#64748b;font-size:.82rem}.rector-page-head button{background:#065f46;color:white;border:0;border-radius:8px;padding:.65rem 1rem}.ra-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}.ra-card{border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:1rem;text-align:left;cursor:pointer}.ra-card.active,.ra-card:hover{border-color:#059669;background:#f0fdf4}.ra-card strong,.ra-card span{display:block}.ra-card span{font-size:.75rem;color:#64748b;margin-top:.25rem}.ra-detail{margin-top:1rem;padding:1rem;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.ra-detail h3{margin:0}.ra-detail p{color:#64748b;font-size:.82rem}.ra-status{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.ra-status article{background:#f8fafc;border-radius:9px;padding:.8rem}.ra-status span{display:block;color:#64748b;font-size:.68rem;text-transform:uppercase;font-weight:800}.ra-status strong{font-size:1.35rem}@media(max-width:650px){.ra-cards{grid-template-columns:repeat(2,1fr)}.ra-status{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.ra-cards{grid-template-columns:1fr}}</style><script>(function(){'use strict';const c=window.FPU_PORTAL||{},$=id=>document.getElementById(id),e=v=>c.escapeHtml?c.escapeHtml(v):String(v??'');let rows=[],sel=0;function detail(){const x=rows[sel];if(!x){$('ra-detail').innerHTML='<h3>No department selected</h3>';return}$('ra-detail').innerHTML='<h3>'+e(x.departmentName||'Unassigned department')+' — Admission Overview</h3><p>'+e(x.departmentCode||'')+' · '+Number(x.total||0)+' total applications</p><div class="ra-status">'+[['Total','total'],['Pending','pending'],['Under review','underReview'],['Approved','approved'],['Registered','registered'],['Rejected','rejected']].map(a=>'<article><span>'+a[0]+'</span><strong>'+Number(x[a[1]]||0)+'</strong></article>').join('')+'</div>'}function render(){$('ra-cards').innerHTML=rows.map((x,i)=>'<button class="ra-card '+(i===sel?'active':'')+'" data-i="'+i+'"><strong>'+e(x.departmentName||'Unassigned department')+'</strong><span>'+Number(x.total||0)+' applications · '+Number(x.pending||0)+' pending · View overview →</span></button>').join('')||'No application records found.';$('ra-cards').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{sel=Number(b.dataset.i);render();detail()});detail()}async function load(){try{const r=await c.portalFetch('/api/rector/applications-by-department');rows=r.data||[];sel=0;render()}catch(x){$('ra-cards').textContent='Unable to load applications: '+x.message}}$('ra-refresh').onclick=load;load()})();</script>
