<section class="rector-list-page ra-page">
<header class="rector-page-head"><div><span class="ra-kicker">ADMISSIONS & ENROLMENT</span><h2>Applications Overview</h2><p>Institution-wide admission pipeline with applicant-level records and department summaries.</p></div><div class="ra-actions"><button id="ra-refresh">↻ Refresh</button><button id="ra-export" class="light">⇩ Export CSV</button><button id="ra-print" class="light">Print</button></div></header>
<div id="ra-stats" class="ra-stats"></div><div id="ra-status-cards" class="ra-status-cards"></div>
<div class="ra-tools"><input id="ra-search" type="search" placeholder="Search applicant, application number, email or matric number"><select id="ra-dept"><option value="">All departments</option></select><select id="ra-type"><option value="">All application types</option><option value="ND">ND</option><option value="HND">HND</option></select><select id="ra-status"><option value="">All statuses</option><option value="pending">Pending</option><option value="under_review">Under review</option><option value="approved">Approved</option><option value="registered">Registered</option><option value="rejected">Rejected</option></select><button id="ra-clear">Clear</button></div>
<div class="ra-section-head"><h3 id="ra-heading">All applications</h3><p id="ra-count">Loading records…</p></div><div class="ra-table"><table><thead><tr><th>Application No.</th><th>Applicant</th><th>Type</th><th>Department</th><th>Programme</th><th>Status</th><th>Date submitted</th><th>Action</th></tr></thead><tbody id="ra-body"><tr><td colspan="8">Loading…</td></tr></tbody></table></div>
<div id="ra-modal" class="ra-modal" role="dialog" aria-modal="true" aria-labelledby="ra-modal-title"><div class="ra-dialog"><header><div><h3 id="ra-modal-title">Application details</h3><p>Applicant record</p></div><button id="ra-close">×</button></header><div id="ra-detail"></div></div></div>
</section>
<style>
.ra-page{background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:1.1rem;color:#0f172a;box-shadow:0 8px 28px #0f172a0a}.ra-kicker{font-size:.65rem;font-weight:900;letter-spacing:.16em;color:#a7f3d0}.ra-page .rector-page-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;background:linear-gradient(120deg,#064e3b,#059669);color:#fff;padding:1.25rem 1.4rem;border-radius:14px}.ra-page .rector-page-head h2{color:#fff;margin:.2rem 0}.ra-page .rector-page-head p{color:#dcfce7;margin:.3rem 0 0}.ra-actions{display:flex;gap:.4rem;flex-wrap:wrap}.ra-actions button,.ra-tools button{border:0;border-radius:9px;padding:.65rem .85rem;background:#065f46;color:#fff;font-weight:800;cursor:pointer}.ra-actions .light{background:#fff;color:#065f46}.ra-stats,.ra-status-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.65rem;margin:1rem 0}.ra-stats article,.ra-status-cards button{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:.85rem;text-align:left}.ra-stats span,.ra-status-cards span{display:block;color:#64748b;font-size:.7rem}.ra-stats strong,.ra-status-cards strong{display:block;font-size:1.45rem;color:#065f46}.ra-status-cards button{cursor:pointer}.ra-status-cards button.active,.ra-status-cards button:hover{border-color:#059669;background:#ecfdf5}.ra-tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.55rem;padding:.8rem;background:#fff;border:1px solid #e2e8f0;border-radius:13px}.ra-tools input,.ra-tools select{min-width:0;padding:.7rem;border:1px solid #cbd5e1;border-radius:9px}.ra-section-head{margin:1rem 0 .55rem}.ra-section-head h3{margin:0}.ra-section-head p{margin:.2rem 0;color:#64748b;font-size:.8rem}.ra-table{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:13px}.ra-table table{width:100%;min-width:1050px;border-collapse:collapse;font-size:.8rem}.ra-table th,.ra-table td{padding:.75rem;text-align:left;border-bottom:1px solid #f1f5f9}.ra-table th{background:#ecfdf5;color:#065f46;font-size:.68rem;text-transform:uppercase}.ra-table tbody tr:hover td{background:#f8fffb}.ra-table button{border:1px solid #a7f3d0;background:#fff;color:#065f46;padding:.4rem .6rem;border-radius:7px;font-weight:800;cursor:pointer}.ra-pill{padding:.25rem .5rem;border-radius:99px;background:#fef3c7;color:#92400e;font-size:.68rem;font-weight:800;text-transform:capitalize}.ra-pill.approved,.ra-pill.registered{background:#dcfce7;color:#166534}.ra-pill.rejected{background:#fee2e2;color:#991b1b}.ra-modal{display:none;position:fixed;inset:0;z-index:10050;background:#0f172acc;padding:1rem;align-items:center;justify-content:center}.ra-dialog{width:min(780px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px}.ra-dialog header{position:sticky;top:0;background:#fff;padding:1rem;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between}.ra-dialog header h3{margin:0}.ra-dialog header p{margin:.2rem 0;color:#64748b;font-size:.78rem}.ra-dialog header button{border:0;background:#f1f5f9;border-radius:9px;width:38px;height:38px;font-size:1.4rem}.ra-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem;padding:1rem}.ra-detail-grid article{border:1px solid #e2e8f0;border-radius:10px;padding:.8rem}.ra-detail-grid small{display:block;color:#64748b;text-transform:uppercase;font-size:.64rem;font-weight:800}.ra-detail-grid b{display:block;margin-top:.2rem;font-size:.84rem;overflow-wrap:anywhere}
@media(max-width:850px){.ra-tools{grid-template-columns:repeat(2,1fr)}.ra-tools input{grid-column:1/-1}.ra-stats,.ra-status-cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:550px){.ra-page{padding:.6rem}.ra-page .rector-page-head{padding:1rem}.ra-actions{width:100%}.ra-actions button{flex:1}.ra-tools{grid-template-columns:1fr}.ra-tools input{grid-column:auto}.ra-stats,.ra-status-cards,.ra-detail-grid{grid-template-columns:repeat(2,1fr)}}
@media print{.ra-actions,.ra-tools,.ra-status-cards,.ra-modal{display:none!important}.ra-page{background:#fff;border:0;padding:0}.ra-page .rector-page-head{background:#fff;padding:0}.ra-page .rector-page-head h2,.ra-page .rector-page-head p{color:#000}.ra-table{overflow:visible}.ra-table table{min-width:0;font-size:9px}.ra-table th,.ra-table td{padding:5px}}
</style>
<script>
(function(){'use strict';const c=window.FPU_PORTAL||{},$=id=>document.getElementById(id),esc=v=>c.escapeHtml?c.escapeHtml(v):String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let rows=[],dept='',type='',status='';const name=x=>[x.firstName,x.middleName,x.lastName].filter(Boolean).join(' ')||'Applicant',label=s=>String(s||'pending').replace(/_/g,' ');function filtered(){const q=$('ra-search').value.trim().toLowerCase();return rows.filter(x=>(!dept||String(x.departmentId)===dept)&&(!type||String(x.type).toUpperCase()===type)&&(!status||x.status===status)&&[name(x),x.applicationNumber,x.email,x.phone,x.matricNumber,x.departmentName,x.programmeName].join(' ').toLowerCase().includes(q))}function render(){const f=filtered(),counts=['pending','under_review','approved','registered','rejected'].map(s=>[s,rows.filter(x=>x.status===s).length]);$('ra-count').textContent=f.length+' of '+rows.length+' applications';$('ra-heading').textContent=status?'Applications · '+label(status):'All applications';$('ra-stats').innerHTML=[['Total applications',rows.length],['ND applications',rows.filter(x=>String(x.type).toUpperCase()==='ND').length],['HND applications',rows.filter(x=>String(x.type).toUpperCase()==='HND').length],['Admitted / approved',rows.filter(x=>['approved','registered'].includes(x.status)).length],['Awaiting action',rows.filter(x=>['pending','under_review'].includes(x.status)).length]].map(x=>'<article><span>'+x[0]+'</span><strong>'+x[1].toLocaleString()+'</strong></article>').join('');$('ra-status-cards').innerHTML=counts.map(x=>'<button type="button" data-status="'+x[0]+'" class="'+(status===x[0]?'active':'')+'"><span>'+label(x[0])+'</span><strong>'+x[1].toLocaleString()+'</strong></button>').join('');$('ra-body').innerHTML=f.length?f.map(x=>'<tr><td><b>'+esc(x.applicationNumber||'—')+'</b></td><td><b>'+esc(name(x))+'</b><br><small>'+esc(x.email||'')+'</small></td><td>'+esc(x.type||'—')+'</td><td>'+esc(x.departmentName||'Unassigned')+'</td><td>'+esc(x.programmeName||'—')+'</td><td><span class="ra-pill '+esc(x.status)+'">'+esc(label(x.status))+'</span></td><td>'+esc(x.createdAt?new Date(x.createdAt).toLocaleDateString():'—')+'</td><td><button data-view="'+Number(x.id)+'">View details</button></td></tr>').join(''):'<tr><td colspan="8" style="text-align:center;padding:2rem;color:#64748b">No applications match the selected filters.</td></tr>';$('ra-status-cards').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{status=status===b.dataset.status?'':b.dataset.status;$('ra-status').value=status;render()});$('ra-body').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view))}function show(id){const x=rows.find(r=>String(r.id)===String(id));if(!x)return;const fields=[['Applicant',name(x)],['Application number',x.applicationNumber],['Application type',x.type],['Email',x.email],['Phone',x.phone],['Gender',x.gender],['Date of birth',x.dateOfBirth],['Department',x.departmentName],['Department code',x.departmentCode],['Programme',x.programmeName],['Level',x.level],['State of origin',x.stateOfOrigin],['LGA',x.lga],['Address',x.address],['Status',label(x.status)],['Submitted',x.createdAt],['Reviewed',x.reviewedAt],['Admitted',x.admittedAt],['Matric number',x.matricNumber],['Rejection reason',x.rejectionReason]];$('ra-detail').innerHTML='<div class="ra-detail-grid">'+fields.map(([k,v])=>'<article><small>'+esc(k)+'</small><b>'+esc(v||'Not recorded')+'</b></article>').join('')+'</div>';$('ra-modal').style.display='flex'}async function load(){const b=$('ra-refresh');b.disabled=true;b.textContent='Loading…';try{const [a,d]=await Promise.all([c.portalFetch('/api/rector/applications?limit=500'),c.portalFetch('/api/rector/enrollment-by-department')]);rows=a.data||[];const depts=d.data||[];$('ra-dept').innerHTML='<option value="">All departments</option>'+depts.map(x=>'<option value="'+esc(x.departmentId)+'">'+esc(x.name)+'</option>').join('');render()}catch(x){$('ra-body').innerHTML='<tr><td colspan="8">Unable to load applications: '+esc(x.message)+'</td></tr>';c.showToast&&c.showToast(x.message,'error')}finally{b.disabled=false;b.textContent='↻ Refresh'}}function csv(){const f=filtered(),v=x=>'"'+String(x??'').replace(/"/g,'""')+'"',lines=[['Application No','Applicant','Type','Email','Phone','Department','Programme','Level','Status','Submitted'].map(v).join(','),...f.map(x=>[x.applicationNumber,name(x),x.type,x.email,x.phone,x.departmentName,x.programmeName,x.level,x.status,x.createdAt].map(v).join(','))],a=document.createElement('a'),url=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv'}));a.href=url;a.download='fpu-rector-applications.csv';a.click();URL.revokeObjectURL(url)}$('ra-refresh').onclick=load;$('ra-search').oninput=render;$('ra-dept').onchange=e=>{dept=e.target.value;render()};$('ra-type').onchange=e=>{type=e.target.value;render()};$('ra-status').onchange=e=>{status=e.target.value;render()};$('ra-clear').onclick=()=>{dept=type=status='';['ra-dept','ra-type','ra-status','ra-search'].forEach(id=>$(id).value='');render()};$('ra-export').onclick=csv;$('ra-print').onclick=()=>window.print();$('ra-close').onclick=()=>$('ra-modal').style.display='none';$('ra-modal').onclick=e=>{if(e.target.id==='ra-modal')$('ra-modal').style.display='none'};load()})();
</script>
