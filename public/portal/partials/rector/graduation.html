<section class="rector-list-page"><header class="rector-page-head"><div><h2>Graduation Pipeline</h2><p>Institution-wide graduation readiness and approval summary.</p></div><button type="button" id="rector-grad-refresh">↻ Refresh</button></header><div id="rector-grad-summary" class="rector-grad-grid"><div>Loading graduation pipeline…</div></div><p class="rector-note">This view is an oversight summary. Student-level graduation decisions remain with the authorised registry workflow.</p></section>
<style>.rector-list-page{color:#0f172a}.rector-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.rector-page-head h2{margin:0;font-size:1.35rem}.rector-page-head p{margin:.35rem 0;color:#64748b;font-size:.85rem}.rector-page-head button{background:#065f46;color:#fff;border:0;border-radius:9px;padding:.65rem 1rem;font-weight:700;cursor:pointer}.rector-grad-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.85rem}.rector-grad-card{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:1.1rem}.rector-grad-card span{font-size:.7rem;color:#64748b;text-transform:uppercase;font-weight:800;letter-spacing:.06em}.rector-grad-card strong{display:block;font-size:1.8rem;margin-top:.45rem;color:#0f172a}.rector-note{color:#64748b;font-size:.8rem;margin-top:1rem}@media(max-width:700px){.rector-grad-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<script>(function(){'use strict';const c=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>c.escapeHtml?c.escapeHtml(v):String(v??'');async function load(){$('rector-grad-summary').innerHTML='<div>Loading graduation pipeline…</div>';try{const r=await c.portalFetch('/api/rector/graduation-pipeline');const d=r.data||{};const items=[['Queued',d.queued,'#92400e'],['Approved',d.approved,'#1d4ed8'],['Graduated',d.graduated,'#047857'],['Rejected',d.rejected,'#b91c1c']];$('rector-grad-summary').innerHTML=items.map(x=>'<article class="rector-grad-card"><span>'+esc(x[0])+'</span><strong style="color:'+x[2]+'">'+Number(x[1]||0).toLocaleString()+'</strong></article>').join('')+'<article class="rector-grad-card"><span>Total Processed / Queued</span><strong>'+Number(d.total||0).toLocaleString()+'</strong></article>'}catch(e){$('rector-grad-summary').textContent='Unable to load graduation pipeline: '+e.message;c.showToast&&c.showToast('Could not load graduation pipeline','error')}}$('rector-grad-refresh').addEventListener('click',load);load()})();</script>
