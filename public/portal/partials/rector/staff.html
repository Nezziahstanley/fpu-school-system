<section class="rector-list-page">
  <header class="rector-page-head"><div><h2>Institutional Staff Directory</h2><p>Executive view of staff across academic and administrative units.</p></div><button type="button" id="rector-staff-refresh">↻ Refresh</button></header>
  <div class="rector-toolbar"><input id="rector-staff-search" type="search" placeholder="Search staff, role, department…" aria-label="Search staff"><span id="rector-staff-count">Loading…</span></div>
  <div class="rector-table-wrap"><table><thead><tr><th>Staff Member</th><th>Role</th><th>Department</th><th>Email</th><th>Phone</th></tr></thead><tbody id="rector-staff-body"><tr><td colspan="5">Loading staff records…</td></tr></tbody></table></div>
</section>
<style>.rector-list-page{color:#0f172a}.rector-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.rector-page-head h2{margin:0;font-size:1.35rem}.rector-page-head p{margin:.35rem 0;color:#64748b;font-size:.85rem}.rector-page-head button{background:#065f46;color:#fff;border:0;border-radius:9px;padding:.65rem 1rem;font-weight:700;cursor:pointer}.rector-toolbar{display:flex;justify-content:space-between;gap:.75rem;align-items:center;margin-bottom:.8rem}.rector-toolbar input{width:min(100%,420px);padding:.7rem .85rem;border:1px solid #cbd5e1;border-radius:9px}.rector-toolbar span{font-size:.8rem;color:#64748b}.rector-table-wrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.rector-table-wrap table{width:100%;border-collapse:collapse;min-width:650px;font-size:.82rem}.rector-table-wrap th,.rector-table-wrap td{padding:.8rem .9rem;text-align:left;border-bottom:1px solid #f1f5f9}.rector-table-wrap th{background:#f8fafc;color:#475569;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}.rector-table-wrap td{color:#334155}@media(max-width:600px){.rector-toolbar{align-items:stretch;flex-direction:column}}</style>
<script>(function(){'use strict';const c=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>c.escapeHtml?c.escapeHtml(v):String(v??'');let rows=[];function render(){const q=($('rector-staff-search').value||'').toLowerCase();const f=rows.filter(r=>[r.firstName,r.lastName,r.name,r.role,r.departmentName,r.email,r.phone].join(' ').toLowerCase().includes(q));$('rector-staff-count').textContent=f.length+' of '+rows.length+' staff';$('rector-staff-body').innerHTML=f.length?f.map(r=>'<tr><td><strong>'+esc([r.firstName,r.lastName].filter(Boolean).join(' ')||r.name||'—')+'</strong></td><td>'+esc(String(r.role||'—').replace(/_/g,' '))+'</td><td>'+esc(r.departmentName||r.department?.name||'—')+'</td><td>'+esc(r.email||'—')+'</td><td>'+esc(r.phone||r.phoneNumber||'—')+'</td></tr>').join(''):'<tr><td colspan="5">No matching staff records.</td></tr>'}async function load(){$('rector-staff-body').innerHTML='<tr><td colspan="5">Loading staff records…</td></tr>';try{const r=await c.portalFetch('/api/rector/staff');rows=Array.isArray(r.data)?r.data:[];render()}catch(e){$('rector-staff-body').innerHTML='<tr><td colspan="5">Unable to load staff. '+esc(e.message)+'</td></tr>';c.showToast&&c.showToast('Could not load staff directory','error')}}$('rector-staff-refresh').addEventListener('click',load);$('rector-staff-search').addEventListener('input',render);load()})();</script>
