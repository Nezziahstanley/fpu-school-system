<section class="rector-list-page rf-page">
<header class="rector-page-head"><div><span class="rf-kicker">WORKFORCE OVERVIEW</span><h2>Institutional Staff Directory</h2><p>Explore Heads of Department and lecturers by department or role.</p></div><div class="rf-actions"><button id="rf-refresh">↻ Refresh</button><button id="rf-export" class="light">⇩ Export CSV</button></div></header>
<div id="rf-stats" class="rf-stats"></div>
<div class="rf-role-cards" id="rf-role-cards"></div><div class="rf-section-head"><h3>Browse by department</h3><p>Select a department card to open its HOD and lecturer lists.</p></div><div class="rf-dept-cards" id="rf-dept-cards"></div>
<div class="rf-tools"><input id="rf-search" type="search" placeholder="Search staff name, email or phone" aria-label="Search staff"><select id="rf-dept" aria-label="Department"><option value="">All departments</option></select><select id="rf-role" aria-label="Role"><option value="">HODs and lecturers</option><option value="hod">Heads of Department</option><option value="lecturer">Lecturers</option></select><select id="rf-status" aria-label="Account status"><option value="">All account statuses</option><option value="active">Active</option><option value="inactive">Inactive</option></select><button id="rf-clear" class="outline">Clear</button></div>
<div class="rf-section-head"><div><h3 id="rf-heading">All HODs and Lecturers</h3><p id="rf-count">Loading staff records…</p></div></div><div id="rf-groups"></div>
<div id="rf-modal" class="rf-modal" role="dialog" aria-modal="true" aria-labelledby="rf-modal-title"><div class="rf-dialog"><header><div><h3 id="rf-modal-title">Staff profile</h3><p>Institutional staff record</p></div><button id="rf-close" aria-label="Close">×</button></header><div id="rf-detail"></div></div></div>
</section>
<style>
.rf-page{color:#0f172a;background:#f8fafc;border:1px solid #e2e8f0;border-radius:18px;padding:1.1rem;box-shadow:0 8px 28px #0f172a0a}.rf-kicker{font-size:.65rem;font-weight:900;letter-spacing:.16em;color:#a7f3d0}.rf-page .rector-page-head{align-items:center;background:linear-gradient(120deg,#064e3b,#059669);color:#fff;padding:1.25rem 1.4rem;border-radius:14px}.rf-page .rector-page-head h2{color:#fff;margin:.2rem 0}.rf-page .rector-page-head p{color:#dcfce7;margin:.35rem 0 0}.rf-actions{display:flex;gap:.45rem}.rf-actions button,.rf-tools button{border:0;border-radius:9px;padding:.65rem .85rem;background:#065f46;color:#fff;font-weight:800;cursor:pointer}.rf-actions .light{background:#fff;color:#065f46}.rf-stats,.rf-role-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin:1rem 0}.rf-stats article,.rf-role-cards button{background:#fff;border:1px solid #e2e8f0;border-radius:13px;padding:1rem;text-align:left}.rf-stats span,.rf-role-cards span{display:block;color:#64748b;font-size:.72rem}.rf-stats strong,.rf-role-cards strong{display:block;font-size:1.55rem;color:#065f46}.rf-role-cards button{cursor:pointer;transition:.15s}.rf-role-cards button.active,.rf-role-cards button:hover{border-color:#059669;background:#ecfdf5;transform:translateY(-1px)}.rf-role-cards button strong{font-size:1rem;color:#0f172a}.rf-role-cards button span{margin-top:.25rem}.rf-dept-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin:.65rem 0 1rem}.rf-dept-cards button{background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:.8rem;text-align:left;cursor:pointer;transition:.15s}.rf-dept-cards button strong{display:block;font-size:.82rem}.rf-dept-cards button span{display:block;color:#64748b;font-size:.7rem;margin-top:.2rem}.rf-dept-cards button.active,.rf-dept-cards button:hover{background:#ecfdf5;border-color:#059669}.rf-tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.55rem;background:#fff;padding:.8rem;border:1px solid #e2e8f0;border-radius:13px}.rf-tools input,.rf-tools select{min-width:0;padding:.7rem;border:1px solid #cbd5e1;border-radius:9px}.rf-tools .outline{background:#fff;color:#065f46;border:1px solid #a7f3d0}.rf-section-head{margin:1.1rem 0 .65rem}.rf-section-head h3{margin:0}.rf-section-head p{margin:.2rem 0 0;color:#64748b;font-size:.8rem}.rf-group{background:#fff;border:1px solid #e2e8f0;border-radius:13px;margin:.7rem 0;overflow:hidden}.rf-group-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.85rem 1rem;background:#ecfdf5;border-bottom:1px solid #d1fae5}.rf-group-head h4{margin:0;color:#065f46}.rf-group-head span{font-size:.72rem;color:#64748b}.rf-cols{display:grid;grid-template-columns:1fr 1fr}.rf-col{padding:.9rem}.rf-col+.rf-col{border-left:1px solid #e2e8f0}.rf-col h5{margin:0 0 .6rem;color:#065f46}.rf-person{display:flex;align-items:center;gap:.65rem;padding:.65rem 0;border-bottom:1px solid #f1f5f9}.rf-avatar{width:38px;height:38px;border-radius:50%;background:#d1fae5;color:#065f46;display:grid;place-items:center;font-weight:900;flex:none}.rf-person-main{min-width:0;flex:1}.rf-person b{font-size:.82rem}.rf-person small{display:block;color:#64748b;font-size:.72rem;overflow-wrap:anywhere}.rf-person button{border:1px solid #a7f3d0;background:#fff;color:#065f46;border-radius:7px;padding:.35rem .5rem;font-weight:800;cursor:pointer}.rf-empty{color:#94a3b8;font-size:.8rem;padding:.8rem}.rf-modal{display:none;position:fixed;inset:0;z-index:10050;background:#0f172acc;padding:1rem;align-items:center;justify-content:center}.rf-dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px}.rf-dialog header{position:sticky;top:0;background:#fff;padding:1rem;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between}.rf-dialog header h3{margin:0}.rf-dialog header p{margin:.2rem 0 0;color:#64748b;font-size:.78rem}.rf-dialog header button{border:0;background:#f1f5f9;border-radius:9px;width:38px;height:38px;font-size:1.4rem}.rf-detail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem;padding:1rem}.rf-detail article{border:1px solid #e2e8f0;border-radius:9px;padding:.8rem}.rf-detail small{display:block;color:#64748b;text-transform:uppercase;font-size:.64rem;font-weight:800}.rf-detail b{display:block;margin-top:.2rem;font-size:.84rem;overflow-wrap:anywhere}
@media(max-width:850px){.rf-tools{grid-template-columns:repeat(2,minmax(0,1fr))}.rf-tools input{grid-column:1/-1}}@media(max-width:850px){.rf-dept-cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.rf-page{padding:.6rem}.rf-page .rector-page-head{padding:1rem}.rf-stats,.rf-role-cards{grid-template-columns:1fr}.rf-cols{grid-template-columns:1fr}.rf-col+.rf-col{border-left:0;border-top:1px solid #e2e8f0}}@media(max-width:450px){.rf-tools{grid-template-columns:1fr}.rf-tools input{grid-column:auto}.rf-detail{grid-template-columns:1fr}.rf-dept-cards{grid-template-columns:1fr}}
</style>
<script>
(function(){'use strict';const c=window.FPU_PORTAL||{},$=id=>document.getElementById(id),esc=v=>c.escapeHtml?c.escapeHtml(v):String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));let rows=[],depts=[],dept='',role='',status='',roleCard='';const name=x=>[x.firstName,x.middleName,x.lastName].filter(Boolean).join(' ')||'Staff',isActive=x=>x.isActive!==false;function base(){return rows.filter(x=>x.role==='hod'||x.role==='lecturer')}function filtered(){const q=$('rf-search').value.trim().toLowerCase();return base().filter(x=>(!dept||String(x.departmentId)===dept)&&(!role||x.role===role)&&(!roleCard||roleCard==='all'||x.role===roleCard)&&(!status||(isActive(x)?'active':'inactive')===status)&&[name(x),x.email,x.phone,x.departmentName,x.role].join(' ').toLowerCase().includes(q))}function render(){const f=filtered(),hod=base().filter(x=>x.role==='hod'),lect=base().filter(x=>x.role==='lecturer');$('rf-count').textContent=f.length+' records · '+f.filter(isActive).length+' active · '+f.filter(x=>!isActive(x)).length+' inactive';$('rf-heading').textContent=roleCard==='hod'?'Heads of Department':roleCard==='lecturer'?'Lecturers':roleCard==='all'?'All HODs and Lecturers':(depts.find(x=>String(x.departmentId)===dept)?.name||'All HODs and Lecturers');$('rf-stats').innerHTML=[['Total HODs',hod.length],['Total lecturers',lect.length],['Total department teams',depts.filter(d=>base().some(x=>String(x.departmentId)===String(d.departmentId))).length]].map(x=>'<article><span>'+x[0]+'</span><strong>'+x[1].toLocaleString()+'</strong></article>').join('');$('rf-role-cards').innerHTML=[['hod','Heads of Department',hod.length,'Open all HOD records'],['lecturer','Lecturers',lect.length,'Open all lecturer records'],['all','All HODs & Lecturers',hod.length+lect.length,'View complete staff list']].map(x=>'<button type="button" data-role-card="'+x[0]+'" class="'+(roleCard===x[0]?'active':'')+'"><strong>'+x[1]+'</strong><span>'+x[2]+' records · '+x[3]+' →</span></button>').join('');$('rf-dept-cards').innerHTML=depts.map(d=>'<button type="button" data-dept-card="'+esc(d.departmentId)+'" class="'+(dept===String(d.departmentId)?'active':'')+'"><strong>'+esc(d.name)+'</strong><span>'+base().filter(x=>String(x.departmentId)===String(d.departmentId)&&x.role==='hod').length+' HOD · '+base().filter(x=>String(x.departmentId)===String(d.departmentId)&&x.role==='lecturer').length+' lecturers · View →</span></button>').join('');$('rf-dept-cards').querySelectorAll('[data-dept-card]').forEach(b=>b.onclick=()=>{dept=dept===b.dataset.deptCard?'':b.dataset.deptCard;roleCard='';role='';$('rf-role').value='';$('rf-dept').value=dept;render()});const groups=(dept?depts.filter(x=>String(x.departmentId)===dept):depts).map(d=>{const group=f.filter(x=>String(x.departmentId)===String(d.departmentId)),h=group.filter(x=>x.role==='hod'),l=group.filter(x=>x.role==='lecturer');const person=x=>'<div class="rf-person"><div class="rf-avatar">'+esc((x.firstName||'S').charAt(0)+(x.lastName||'').charAt(0))+'</div><div class="rf-person-main"><b>'+esc(name(x))+'</b><small>'+esc(x.email||'Email not supplied')+' · '+esc(x.phone||'No phone')+'</small></div><button type="button" data-view="'+Number(x.id)+'">View</button></div>';return '<section class="rf-group"><div class="rf-group-head"><h4>'+esc(d.name)+'</h4><span>'+h.length+' HOD · '+l.length+' lecturers</span></div><div class="rf-cols"><div class="rf-col"><h5>Head of Department ('+h.length+')</h5>'+(h.length?h.map(person).join(''):'<div class="rf-empty">No HOD assigned.</div>')+'</div><div class="rf-col"><h5>Lecturers ('+l.length+')</h5>'+(l.length?l.map(person).join(''):'<div class="rf-empty">No lecturer records.</div>')+'</div></div></section>'}).join('');$('rf-groups').innerHTML=groups||'<div class="rf-group rf-empty">No matching HOD or lecturer records found.</div>';$('rf-role-cards').querySelectorAll('[data-role-card]').forEach(b=>b.onclick=()=>{roleCard=roleCard===b.dataset.roleCard?'':b.dataset.roleCard;role=roleCard==='hod'||roleCard==='lecturer'?roleCard:'';$('rf-role').value=role;render()});$('rf-groups').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view))}function show(id){const x=rows.find(r=>String(r.id)===String(id));if(!x)return;const fields=[['Full name',name(x)],['Role',x.role==='hod'?'Head of Department':'Lecturer'],['Email',x.email],['Phone',x.phone],['Department',x.departmentName],['Department code',x.departmentCode],['Programme',x.programmeName],['Gender',x.gender],['Account status',isActive(x)?'Active':'Inactive'],['Last login',x.lastLoginAt],['Joined',x.createdAt]];$('rf-detail').innerHTML='<div class="rf-detail">'+fields.map(([k,v])=>'<article><small>'+esc(k)+'</small><b>'+esc(v||'Not provided')+'</b></article>').join('')+'</div>';$('rf-modal').style.display='flex'}async function load(){const b=$('rf-refresh');b.disabled=true;b.textContent='Loading…';try{const [s,d]=await Promise.all([c.portalFetch('/api/rector/staff'),c.portalFetch('/api/rector/enrollment-by-department')]);rows=s.data||[];depts=d.data||[];$('rf-dept').innerHTML='<option value="">All departments</option>'+depts.map(x=>'<option value="'+esc(x.departmentId)+'">'+esc(x.name)+'</option>').join('');render()}catch(x){$('rf-groups').textContent='Unable to load staff directory: '+x.message;c.showToast&&c.showToast(x.message,'error')}finally{b.disabled=false;b.textContent='↻ Refresh'}}function csv(){const f=filtered(),val=x=>'"'+String(x??'').replace(/"/g,'""')+'"',lines=[['Name','Role','Department','Email','Phone','Status'].map(val).join(','),...f.map(x=>[name(x),x.role,x.departmentName,x.email,x.phone,isActive(x)?'Active':'Inactive'].map(val).join(','))],a=document.createElement('a'),url=URL.createObjectURL(new Blob([lines.join('\r\n')],{type:'text/csv'}));a.href=url;a.download='fpu-rector-staff.csv';a.click();URL.revokeObjectURL(url)}$('rf-refresh').onclick=load;$('rf-search').oninput=render;$('rf-dept').onchange=e=>{dept=e.target.value;render()};$('rf-role').onchange=e=>{role=e.target.value;roleCard='';render()};$('rf-status').onchange=e=>{status=e.target.value;render()};$('rf-clear').onclick=()=>{dept=role=status=roleCard='';['rf-dept','rf-role','rf-status','rf-search'].forEach(id=>$(id).value='');render()};$('rf-export').onclick=csv;$('rf-close').onclick=()=>$('rf-modal').style.display='none';$('rf-modal').onclick=e=>{if(e.target.id==='rf-modal')$('rf-modal').style.display='none'};load()})();
</script>
