<section class="rector-list-page"><header class="rector-page-head"><div><h2>Institutional Staff Directory</h2><p>Lecturers and Heads of Department grouped under their assigned departments.</p></div><button id="rf-refresh" type="button">↻ Refresh</button></header><div class="rf-tools"><input id="rf-search" type="search" placeholder="Search staff, role or email"><select id="rf-dept"><option value="">All departments</option></select><select id="rf-role"><option value="">HODs and lecturers</option><option value="hod">Heads of Department</option><option value="lecturer">Lecturers</option></select></div><div id="rf-dept-cards" class="rf-cards"></div><h3 id="rf-heading">All departments</h3><p id="rf-count"></p><div id="rf-groups"></div></section><style>.rector-list-page{color:#0f172a}.rector-page-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}.rector-page-head h2{margin:0}.rector-page-head p,#rf-count{color:#64748b;font-size:.82rem}.rector-page-head button{background:#065f46;color:#fff;border:0;border-radius:8px;padding:.65rem 1rem}.rf-tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.6rem;margin:1rem 0}.rf-tools input,.rf-tools select{padding:.7rem;border:1px solid #cbd5e1;border-radius:8px;min-width:0}.rf-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem}.rf-cards button{background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:.8rem;text-align:left;cursor:pointer}.rf-cards button.active,.rf-cards button:hover{border-color:#059669;background:#f0fdf4}.rf-cards strong,.rf-cards span{display:block}.rf-cards span{font-size:.72rem;color:#64748b;margin-top:.2rem}.rf-group{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:.8rem 0;overflow:hidden}.rf-group h4{margin:0;padding:.8rem;background:#f8fafc}.rf-cols{display:grid;grid-template-columns:1fr 1fr}.rf-col{padding:.9rem}.rf-col+.rf-col{border-left:1px solid #e2e8f0}.rf-col h5{margin:0 0 .5rem;color:#065f46}.rf-person{padding:.55rem 0;border-bottom:1px solid #f1f5f9;font-size:.83rem}.rf-person small{display:block;color:#64748b}.rf-empty{color:#94a3b8;font-size:.8rem;padding:.6rem}@media(max-width:700px){.rf-tools{grid-template-columns:1fr}.rf-cards{grid-template-columns:repeat(2,1fr)}.rf-cols{grid-template-columns:1fr}.rf-col+.rf-col{border-left:0;border-top:1px solid #e2e8f0}}@media(max-width:430px){.rf-cards{grid-template-columns:1fr}}</style><script>(function(){'use strict';const c=window.FPU_PORTAL||{},$=id=>document.getElementById(id),e=v=>c.escapeHtml?c.escapeHtml(v):String(v??'');let rows=[],depts=[],dept='',role='';const nm=x=>[x.firstName,x.lastName].filter(Boolean).join(' ')||x.name||'Staff';function render(){const q=$('rf-search').value.toLowerCase().trim(),f=rows.filter(x=>(!dept||String(x.departmentId)===dept)&&(!role||x.role===role)&&[nm(x),x.role,x.email].join(' ').toLowerCase().includes(q));$('rf-count').textContent=f.length+' staff';$('rf-heading').textContent=depts.find(x=>String(x.departmentId)===dept)?.name||'All departments';$('rf-groups').innerHTML=(dept?depts.filter(x=>String(x.departmentId)===dept):depts).map(d=>{const a=f.filter(x=>String(x.departmentId)===String(d.departmentId)),h=a.filter(x=>x.role==='hod'),l=a.filter(x=>x.role==='lecturer'),list=z=>z.length?z.map(x=>'<div class="rf-person"><b>'+e(nm(x))+'</b><small>'+e(x.email||'Email not supplied')+'</small></div>').join(''):'<div class="rf-empty">No records.</div>';return '<section class="rf-group"><h4>'+e(d.name)+'</h4><div class="rf-cols"><div class="rf-col"><h5>Head of Department ('+h.length+')</h5>'+list(h)+'</div><div class="rf-col"><h5>Lecturers ('+l.length+')</h5>'+list(l)+'</div></div></section>'}).join('')||'<p class="rf-empty">No matching department staff.</p>';$('rf-dept-cards').innerHTML=depts.map(d=>'<button type="button" data-id="'+e(d.departmentId)+'" class="'+(dept===String(d.departmentId)?'active':'')+'"><strong>'+e(d.name)+'</strong><span>'+rows.filter(x=>String(x.departmentId)===String(d.departmentId)&&(x.role==='hod'||x.role==='lecturer')).length+' HODs & lecturers · View →</span></button>').join('');$('rf-dept-cards').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{dept=b.dataset.id;$('rf-dept').value=dept;render()})}async function load(){try{const [s,d]=await Promise.all([c.portalFetch('/api/rector/staff'),c.portalFetch('/api/rector/enrollment-by-department')]);rows=(s.data||[]).filter(x=>x.role==='hod'||x.role==='lecturer');depts=d.data||[];$('rf-dept').innerHTML='<option value="">All departments</option>'+depts.map(x=>'<option value="'+e(x.departmentId)+'">'+e(x.name)+'</option>').join('');render()}catch(x){$('rf-groups').textContent='Unable to load staff: '+x.message}}$('rf-refresh').onclick=load;$('rf-search').oninput=render;$('rf-dept').onchange=x=>{dept=x.target.value;render()};$('rf-role').onchange=x=>{role=x.target.value;render()};load()})();</script>
