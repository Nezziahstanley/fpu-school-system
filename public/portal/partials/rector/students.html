<section class="rector-list-page">
  <header class="rector-page-head"><div><h2>Institutional Student Directory</h2><p>Read-only student overview for executive monitoring.</p></div><button type="button" id="rector-students-refresh">↻ Refresh</button></header>
  <div class="rector-toolbar"><input id="rector-students-search" type="search" placeholder="Search name, matric number, department…" aria-label="Search students"><span id="rector-students-count">Loading…</span></div>
  <div class="rector-table-wrap"><table><thead><tr><th>Student</th><th>Matric Number</th><th>Department</th><th>Programme</th><th>Level</th><th>Email</th></tr></thead><tbody id="rector-students-body"><tr><td colspan="6">Loading student records…</td></tr></tbody></table></div>
</section>
<style>.rector-list-page{color:#0f172a}.rector-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.rector-page-head h2{margin:0;font-size:1.35rem}.rector-page-head p{margin:.35rem 0;color:#64748b;font-size:.85rem}.rector-page-head button{background:#065f46;color:#fff;border:0;border-radius:9px;padding:.65rem 1rem;font-weight:700;cursor:pointer}.rector-toolbar{display:flex;justify-content:space-between;gap:.75rem;align-items:center;margin-bottom:.8rem}.rector-toolbar input{width:min(100%,420px);padding:.7rem .85rem;border:1px solid #cbd5e1;border-radius:9px}.rector-toolbar span{font-size:.8rem;color:#64748b}.rector-table-wrap{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.rector-table-wrap table{width:100%;border-collapse:collapse;min-width:720px;font-size:.82rem}.rector-table-wrap th,.rector-table-wrap td{padding:.8rem .9rem;text-align:left;border-bottom:1px solid #f1f5f9}.rector-table-wrap th{background:#f8fafc;color:#475569;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em}.rector-table-wrap td{color:#334155}.rector-table-wrap tbody tr:hover{background:#f8fafc}@media(max-width:600px){.rector-toolbar{align-items:stretch;flex-direction:column}}</style>
<script>(function(){'use strict';const c=window.FPU_PORTAL||{};const $=id=>document.getElementById(id);const esc=v=>c.escapeHtml?c.escapeHtml(v):String(v??'');let rows=[];function render(){const q=($('rector-students-search').value||'').toLowerCase();const filtered=rows.filter(r=>[r.firstName,r.lastName,r.matricNumber,r.departmentName,r.programmeName,r.email].join(' ').toLowerCase().includes(q));$('rector-students-count').textContent=filtered.length+' of '+rows.length+' students';$('rector-students-body').innerHTML=filtered.length?filtered.map(r=>'<tr><td><strong>'+esc([r.firstName,r.lastName].filter(Boolean).join(' ')||r.name||'—')+'</strong></td><td>'+esc(r.matricNumber||'—')+'</td><td>'+esc(r.departmentName||r.department?.name||'—')+'</td><td>'+esc(r.programmeName||r.programme?.name||'—')+'</td><td>'+esc(r.level||'—')+'</td><td>'+esc(r.email||'—')+'</td></tr>').join(''):'<tr><td colspan="6">No matching student records.</td></tr>'}async function load(){ $('rector-students-body').innerHTML='<tr><td colspan="6">Loading student records…</td></tr>';try{const r=await c.portalFetch('/api/rector/students');rows=Array.isArray(r.data)?r.data:[];render()}catch(e){$('rector-students-body').innerHTML='<tr><td colspan="6">Unable to load students. '+esc(e.message)+'</td></tr>';c.showToast&&c.showToast('Could not load student directory','error')}}$('rector-students-refresh').addEventListener('click',load);$('rector-students-search').addEventListener('input',render);load()})();</script>
