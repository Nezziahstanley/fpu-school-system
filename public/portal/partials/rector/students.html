<section class="rector-list-page"><header class="rector-page-head"><div><h2>Institutional Student Directory</h2><p>Browse students by department and level. Select a department card to drill down.</p></div><button id="rs-refresh" type="button">↻ Refresh</button></header><div class="rs-stats" id="rs-stats"></div><div class="rs-tools"><input id="rs-search" type="search" placeholder="Search name, matric number or email"><select id="rs-dept"><option value="">All departments</option></select><select id="rs-level"><option value="">All levels</option><option>ND1</option><option>ND2</option><option>HND1</option><option>HND2</option></select><button id="rs-clear" type="button">Clear</button></div><div id="rs-dept-cards" class="rs-cards"></div><h3 id="rs-heading">All students</h3><p id="rs-count">Loading…</p><div class="rs-table"><table><thead><tr><th>Student</th><th>Matric No.</th><th>Department</th><th>Programme</th><th>Level</th><th>Email</th></tr></thead><tbody id="rs-body"><tr><td colspan="6">Loading…</td></tr></tbody></table></div></section><style>.rector-list-page{color:#0f172a}.rector-page-head{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}.rector-page-head h2{margin:0}.rector-page-head p,#rs-count{color:#64748b;font-size:.82rem}.rector-page-head button,.rs-tools button{background:#065f46;color:white;border:0;border-radius:8px;padding:.65rem 1rem;cursor:pointer}.rs-stats,.rs-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;margin:1rem 0}.rs-stats article,.rs-cards button{border:1px solid #e2e8f0;background:white;border-radius:12px;padding:.9rem;text-align:left}.rs-stats span,.rs-cards span{display:block;color:#64748b;font-size:.72rem}.rs-stats strong{display:block;color:#065f46;font-size:1.5rem}.rs-tools{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.6rem}.rs-tools input,.rs-tools select{min-width:0;padding:.7rem;border:1px solid #cbd5e1;border-radius:8px}.rs-cards{grid-template-columns:repeat(3,minmax(0,1fr))}.rs-cards button{cursor:pointer}.rs-cards button.active,.rs-cards button:hover{border-color:#059669;background:#f0fdf4}.rs-cards strong{display:block}.rs-table{overflow:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px}.rs-table table{width:100%;min-width:700px;border-collapse:collapse;font-size:.82rem}.rs-table th,.rs-table td{text-align:left;padding:.75rem;border-bottom:1px solid #f1f5f9}.rs-table th{background:#f8fafc;font-size:.7rem;text-transform:uppercase;color:#64748b}@media(max-width:700px){.rs-tools{grid-template-columns:1fr}.rs-stats{grid-template-columns:repeat(2,1fr)}.rs-cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.rs-cards{grid-template-columns:1fr}}</style><script>(function(){'use strict';const c=window.FPU_PORTAL||{},$=id=>document.getElementById(id),e=v=>c.escapeHtml?c.escapeHtml(v):String(v??''),levels=['ND1','ND2','HND1','HND2'];let rows=[],depts=[],dept='',level='';const nm=x=>[x.firstName,x.lastName].filter(Boolean).join(' ')||x.name||'—';function render(){const q=$('rs-search').value.toLowerCase().trim(),f=rows.filter(x=>(!dept||String(x.departmentId)===dept)&&(!level||String(x.level||'').toUpperCase()===level)&&[nm(x),x.matricNumber,x.email,x.departmentName,x.programmeName].join(' ').toLowerCase().includes(q));$('rs-count').textContent=f.length+' of '+rows.length+' students';$('rs-heading').textContent=(depts.find(x=>String(x.departmentId)===dept)?.name||'All departments')+(level?' · '+level:'');$('rs-body').innerHTML=f.length?f.map(x=>'<tr><td><b>'+e(nm(x))+'</b></td><td>'+e(x.matricNumber||'—')+'</td><td>'+e(x.departmentName||'Unassigned')+'</td><td>'+e(x.programmeName||'—')+'</td><td>'+e(x.level||'—')+'</td><td>'+e(x.email||'—')+'</td></tr>').join(''):'<tr><td colspan="6">No matching students.</td></tr>';$('rs-stats').innerHTML=[['Total students',rows.length],...levels.map(l=>[l,rows.filter(x=>String(x.level||'').toUpperCase()===l).length])].map(x=>'<article><span>'+x[0]+'</span><strong>'+x[1]+'</strong></article>').join('');$('rs-dept-cards').innerHTML=depts.map(d=>'<button type="button" data-id="'+e(d.departmentId)+'" class="'+(dept===String(d.departmentId)?'active':'')+'"><strong>'+e(d.name)+'</strong><span>'+Number(d.students||0)+' students · View →</span></button>').join('');$('rs-dept-cards').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{dept=b.dataset.id;$('rs-dept').value=dept;render()})}async function load(){try{const [s,d]=await Promise.all([c.portalFetch('/api/rector/students'),c.portalFetch('/api/rector/enrollment-by-department')]);rows=s.data||[];depts=d.data||[];$('rs-dept').innerHTML='<option value="">All departments</option>'+depts.map(d=>'<option value="'+e(d.departmentId)+'">'+e(d.name)+'</option>').join('');render()}catch(x){$('rs-body').innerHTML='<tr><td colspan="6">Unable to load directory: '+e(x.message)+'</td></tr>'}}$('rs-refresh').onclick=load;$('rs-search').oninput=render;$('rs-dept').onchange=x=>{dept=x.target.value;render()};$('rs-level').onchange=x=>{level=x.target.value.toUpperCase();render()};$('rs-clear').onclick=()=>{dept=level='';$('rs-dept').value='';$('rs-level').value='';$('rs-search').value='';render()};load()})();</script>
