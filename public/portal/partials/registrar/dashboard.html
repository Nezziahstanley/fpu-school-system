<!-- Portal → Registrar → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="reg-dash-avatar">R</div>
    <div>
      <h1>Welcome, <span id="reg-dash-name">Registrar</span></h1>
      <div class="sub">Office of the Registrar</div>
    </div>
  </div>
  <div class="meta">
    <strong id="reg-dash-session">—</strong>
    <span>Current Session</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile"><div class="tile-label">Students</div><div class="tile-value" id="reg-t-students">—</div></div>
  <div class="tile tile-accent"><div class="tile-label">Pending Documents</div><div class="tile-value" id="reg-t-docs">—</div></div>
  <div class="tile tile-blue"><div class="tile-label">Queued Graduations</div><div class="tile-value" id="reg-t-grads">—</div></div>
  <div class="tile tile-purple"><div class="tile-label">Total Records</div><div class="tile-value" id="reg-t-total">—</div></div>
</div>

<div class="quick-actions">
  <a onclick="FPU_SPA.navigatePortal('admin-users')">Students</a>
  <a onclick="FPU_SPA.navigatePortal('admin-documents')">Documents</a>
  <a onclick="FPU_SPA.navigatePortal('admin-graduations')">Graduations</a>
  <a onclick="FPU_SPA.navigatePortal('admin-transcript')">Transcripts</a>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    try {
      const res = await core.portalFetch('/api/registrar/dashboard');
      const d = res.data || {};
      document.getElementById('reg-dash-name').textContent = core.getPortalUser()?.firstName || 'Registrar';
      document.getElementById('reg-dash-session').textContent = d.currentSession?.name || '—';
      if (photo) photo.renderMyAvatar(document.getElementById('reg-dash-avatar'), core.getPortalUser());

      document.getElementById('reg-t-students').textContent = d.students ?? 0;
      document.getElementById('reg-t-docs').textContent = d.pendingDocuments ?? 0;
      document.getElementById('reg-t-grads').textContent = d.queuedGraduations ?? 0;
      document.getElementById('reg-t-total').textContent = (d.students ?? 0) + (d.pendingDocuments ?? 0) + (d.queuedGraduations ?? 0);
    } catch (err) { core.showToast(err.message, 'error'); }
  })();
</script>
