<!-- Portal → Registrar → Documents -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Document Requests</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Issue transcripts, letters, and certificates to students</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="reg-doc-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">↻ Refresh</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;margin-bottom:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
    <input type="search" id="doc-search" placeholder="Search student, matric, or type..." style="flex:1;min-width:200px;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
    <select id="doc-filter-status" style="padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
      <option value="">All Status</option>
      <option value="pending">Pending</option>
      <option value="approved">Approved</option>
      <option value="issued">Issued</option>
      <option value="rejected">Rejected</option>
    </select>
  </div>

  <!-- STATS -->
  <div id="reg-doc-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;"></div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Showing <span id="reg-doc-shown">0</span> of <span id="reg-doc-total">0</span> requests
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Student</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Type</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title / Notes</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Requested</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="reg-doc-tbody">
          <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:rdSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL (for manual uploads like Certificates) -->
<div id="reg-doc-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Upload Document</h3>
      <button id="reg-doc-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>
    <div style="padding:1.25rem;">
      <p style="font-size:.85rem;color:#475569;margin-bottom:1rem;">Upload the official PDF document for <strong id="reg-doc-student-name"></strong>.</p>
      
      <input type="file" id="reg-doc-file" accept=".pdf,image/jpeg,image/png" style="display:block;width:100%;padding:.75rem;border:1px dashed #cbd5e1;border-radius:8px;margin-bottom:1rem;font-size:.85rem;" />
      
      <div style="display:flex;gap:.5rem;justify-content:flex-end;">
        <button id="reg-doc-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="reg-doc-upload" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Upload & Issue</button>
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes rdSpin { to { transform: rotate(360deg); } }
  #reg-doc-tbody tr { transition: background .1s; }
  #reg-doc-tbody tr:hover { background: #f8fafc; }
  .rd-badge { display:inline-flex;align-items:center;gap:.3rem; padding:3px 9px;border-radius:99px; font-size:.65rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase; }
  .rd-btn-sm { padding:.35rem .7rem;font-size:.72rem;font-weight:700; border-radius:6px;border:none;cursor:pointer;font-family:inherit; transition:all .15s; text-decoration:none; display:inline-block; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  const STATUS_META = {
    pending:  { label: 'Pending',  bg: '#fef3c7', fg: '#92400e', dot: '#f59e0b' },
    approved: { label: 'Approved', bg: '#dbeafe', fg: '#1e40af', dot: '#3b82f6' },
    issued:   { label: 'Issued',   bg: '#d1fae5', fg: '#065f46', dot: '#10b981' },
    rejected: { label: 'Rejected', bg: '#fee2e2', fg: '#991b1b', dot: '#ef4444' },
  };
  const statusMeta = (s) => STATUS_META[s] || STATUS_META.pending;

  let ALL = [];
  let SELECTED_DOC = null;

  async function load() {
    const tbody = $('reg-doc-tbody');
    tbody.innerHTML = `<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:rdSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
    </td></tr>`;

    try {
      const res = await core.portalFetch('/api/registrar/documents');
      ALL = Array.isArray(res.data) ? res.data : [];
      renderStats();
      applyFilters();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function renderStats() {
    const counts = { total: ALL.length, pending: 0, approved: 0, issued: 0, rejected: 0 };
    ALL.forEach(d => { if (counts[d.status] !== undefined) counts[d.status]++; });

    const tiles = [
      { label: 'Total Requests', value: counts.total,    bg: '#e0e7ff', fg: '#3730a3', icon: '📄' },
      { label: 'Pending',        value: counts.pending,  bg: '#fef3c7', fg: '#92400e', icon: '⏳' },
      { label: 'Approved',       value: counts.approved, bg: '#dbeafe', fg: '#1e40af', icon: '✅' },
      { label: 'Issued',         value: counts.issued,   bg: '#d1fae5', fg: '#065f46', icon: '🎓' },
    ];

    $('reg-doc-stats').innerHTML = tiles.map(t => `
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
        <div style="width:40px;height:40px;border-radius:10px;background:${t.bg};color:${t.fg};display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">${t.icon}</div>
        <div style="min-width:0;">
          <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;">${t.value}</div>
          <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">${t.label}</div>
        </div>
      </div>`).join('');
  }

  function applyFilters() {
    const q = ($('doc-search').value || '').toLowerCase();
    const status = $('doc-filter-status').value;

    const filtered = ALL.filter(d => {
      if (status && d.status !== status) return false;
      if (q) {
        const hay = `${d.studentName} ${d.matricNumber} ${d.type} ${d.title}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(filtered);
    $('reg-doc-shown').textContent = filtered.length;
    $('reg-doc-total').textContent = ALL.length;
  }

  function renderTable(rows) {
    const tbody = $('reg-doc-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">No document requests found.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(d => {
      const meta = statusMeta(d.status);
      
      let actions = '';
      if (d.status === 'pending' || d.status === 'approved') {
        if (d.type === 'Transcript') {
          actions = `
            <button class="rd-btn-sm" data-action="preview-transcript" data-userid="${d.userId}" style="background:#eff6ff;color:#1e40af;margin-right:.35rem;">👁 Preview</button>
            <button class="rd-btn-sm" data-action="generate-transcript" data-id="${d.id}" data-userid="${d.userId}" style="background:#065f46;color:#fff;">📄 Issue</button>
          `;
        } else {
          actions = `<button class="rd-btn-sm" data-action="issue" data-id="${d.id}" style="background:#065f46;color:#fff;">📤 Upload</button>`;
        }
      } else if (d.status === 'issued' && d.fileUrl) {
        actions = `<a class="rd-btn-sm" href="${esc(d.fileUrl)}" target="_blank" style="background:#1e40af;color:#fff;">⬇ Download</a>`;
      } else {
        actions = `<span style="font-size:.72rem;color:#94a3b8;">—</span>`;
      }

      return `
        <tr>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(d.studentName)}</td>
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(d.matricNumber)}</code></td>
          <td style="padding:.65rem .75rem;"><span style="font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;padding:2px 8px;border-radius:5px;text-transform:uppercase;">${esc(d.type)}</span></td>
          <td style="padding:.65rem .75rem;font-size:.78rem;color:#475569;">${esc(d.title || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-size:.75rem;color:#64748b;">${fmtDate(d.requestedAt)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span class="rd-badge" style="background:${meta.bg};color:${meta.fg};">
              <span style="width:5px;height:5px;border-radius:50%;background:${meta.dot};"></span>
              ${meta.label}
            </span>
          </td>
          <td style="padding:.65rem .75rem;text-align:right;">${actions}</td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('[data-action="preview-transcript"]').forEach(btn => {
      btn.addEventListener('click', () => {
        window.open(`/portal/partials/registrar/document-template.html?studentId=${btn.dataset.userid}`, '_blank');
      });
    });

    tbody.querySelectorAll('[data-action="generate-transcript"]').forEach(btn => {
      btn.addEventListener('click', async () => {
        window.open(`/portal/partials/registrar/document-template.html?studentId=${btn.dataset.userid}`, '_blank');
        try {
          await core.portalFetch(`/api/registrar/documents/${btn.dataset.id}/mark-issued`, { method: 'POST' });
          load();
        } catch (err) { console.error(err); }
      });
    });

    tbody.querySelectorAll('[data-action="issue"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.id);
        const doc = ALL.find(d => d.id === id);
        if (doc) openIssueModal(doc);
      });
    });
  }

  function openIssueModal(doc) {
    SELECTED_DOC = doc;
    $('reg-doc-student-name').textContent = doc.studentName;
    $('reg-doc-file').value = '';
    $('reg-doc-modal').style.display = 'flex';
  }

  function closeModal() {
    $('reg-doc-modal').style.display = 'none';
    SELECTED_DOC = null;
  }

  $('reg-doc-upload')?.addEventListener('click', async () => {
    if (!SELECTED_DOC) return;
    const file = $('reg-doc-file').files[0];
    if (!file) return core.showToast && core.showToast('Please select a file to upload.', 'warning');

    const btn = $('reg-doc-upload');
    btn.disabled = true;
    btn.textContent = 'Uploading…';

    const formData = new FormData();
    formData.append('file', file);

    try {
      await core.portalFetch(`/api/registrar/documents/${SELECTED_DOC.id}/issue`, {
        method: 'POST',
        body: formData,
        isFormData: true // Crucial: ensures the token isn't manually set, letting the browser set the boundary
      });

      core.showToast && core.showToast('Document issued successfully!', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload & Issue';
    }
  });

  $('reg-doc-modal-close')?.addEventListener('click', closeModal);
  $('reg-doc-cancel')?.addEventListener('click', closeModal);
  $('reg-doc-refresh')?.addEventListener('click', load);
  $('doc-search').addEventListener('input', applyFilters);
  $('doc-filter-status').addEventListener('change', applyFilters);
  $('reg-doc-modal')?.addEventListener('click', (e) => { if (e.target.id === 'reg-doc-modal') closeModal(); });

  load();
})();
</script>
