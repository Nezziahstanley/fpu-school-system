<!-- Registrar → Documents & Certificates: same request queue and actions as Admin -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📄</div>
    <div>
      <h1>Document Requests</h1>
      <div class="sub">User requests for transcripts, certificates, ID cards, and attestation letters</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="dc-search" placeholder="Search student, matric, or type…" />
  <select id="dc-type">
    <option value="">All Types</option>
    <option value="transcript">Transcript</option>
    <option value="certificate">Certificate</option>
    <option value="id-card">ID Card</option>
    <option value="attestation-letter">Attestation Letter</option>
  </select>
  <select id="dc-status">
    <option value="">All Status</option>
    <option value="pending">Pending</option>
    <option value="approved">Approved</option>
    <option value="issued">Issued</option>
    <option value="rejected">Rejected</option>
  </select>
  <button class="btn btn-outline btn-sm" id="dc-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="dc-export">Export CSV</button>
</div>

<!-- Stats row -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta"><span class="label">Total Requests</span><span class="value" id="dc-total">—</span></div>
    <div class="ic">📄</div>
  </div>
  <div class="stat red">
    <div class="meta"><span class="label">Pending</span><span class="value" id="dc-pending">—</span></div>
    <div class="ic">⏳</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">Approved</span><span class="value" id="dc-approved">—</span></div>
    <div class="ic">✅</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">Issued</span><span class="value" id="dc-issued">—</span></div>
    <div class="ic">📬</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Document Queue</h3>
    <span class="badge" id="dc-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Student</th>
            <th>Matric</th>
            <th>Type</th>
            <th>Title / Notes</th>
            <th>Requested</th>
            <th>Status</th>
            <th style="width:180px;">Action</th>
          </tr>
        </thead>
        <tbody id="dc-tbody">
          <tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- ✅ NEW: Preview Modal -->
<div id="dc-modal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:9999; align-items:center; justify-content:center; padding:1rem;">
  <div style="background:#fff; border-radius:12px; max-width:800px; width:100%; max-height:92vh; display:flex; flex-direction:column; overflow:hidden;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:1rem 1.25rem; border-bottom:1px solid #e5e7eb; background:#f8fafc;">
      <h3 style="margin:0; font-size:1.05rem;">Document Preview</h3>
      <button onclick="document.getElementById('dc-modal').style.display='none'" style="background:none; border:none; font-size:1.5rem; cursor:pointer; line-height:1; color:#64748b;">×</button>
    </div>
    <div id="dc-modal-body" style="flex:1; overflow-y:auto; padding:1.5rem; background:#f8fafc;">
      <div style="text-align:center; padding:3rem; color:#94a3b8;">
        <span class="spinner" style="display:inline-block; margin-right:8px;"></span> Generating preview…
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  // API base — role-aware
  function apiBase() {
    const me = (core.getPortalUser && core.getPortalUser()) || {};
    const role = String(me.role || '').toLowerCase();
    const ADMIN_STAFF = ['admin', 'superadmin', 'registrar', 'rector', 'academic_officer', 'lecturer', 'hod'];
    if (ADMIN_STAFF.includes(role)) return '/api/admin/documents';
    return '/api/bursar/documents';
  }

  const ALLOWED_TYPES = new Set(['transcript', 'certificate', 'id-card', 'attestation-letter']);

  function normalizeType(value) {
    const type = String(value || '').toLowerCase().trim().replace(/[\s_]+/g, '-');
    if (type === 'idcard' || type === 'student-id-card') return 'id-card';
    if (type === 'attestation' || type === 'attestationletter') return 'attestation-letter';
    return type;
  }

  function displayType(type) {
    return ({ transcript: 'Transcript', certificate: 'Certificate', 'id-card': 'ID Card', 'attestation-letter': 'Attestation Letter' })[type] || type;
  }

  function unwrap(r) {
    const doc = r.document || r;
    const stu = r.user || r.student || {};
    return {
      id: doc.id,
      type: normalizeType(doc.type || doc.documentType),
      title: doc.title || doc.subject || '',
      notes: doc.notes || doc.remarks || doc.description || '',
      status: (doc.status || 'pending').toLowerCase(),
      requestedAt: doc.requestedAt || doc.createdAt,
      studentName: `${stu.firstName || ''} ${stu.lastName || ''}`.trim() || '—',
      matric: stu.matricNumber || doc.matricNumber || '—',
    };
  }

  function statusBadge(s) {
    const map = {
      pending: 'badge-warning',
      approved: 'badge-active',
      issued: 'badge-success',
      rejected: 'badge-inactive',
    };
    return `<span class="badge-status ${map[s.status] || 'badge-inactive'}">${esc(s.status)}</span>`;
  }

  function render() {
    $('dc-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('dc-tbody').innerHTML =
        '<tr><td colspan="7" class="empty">No document requests match your filters.</td></tr>';
      return;
    }

    $('dc-tbody').innerHTML = FILTERED.map((d) => {
      let actions = '';
      
      // Every row gets a Preview button
      actions += `<button class="btn btn-outline btn-xs" data-act="preview" data-id="${d.id}" style="margin-right:4px;">👁 Preview</button>`;

      if (d.status === 'pending') {
        actions += `
          <button class="btn btn-primary btn-xs" data-act="approve" data-id="${d.id}" style="margin-right:4px;">Approve</button>
          <button class="btn btn-outline btn-xs" data-act="reject" data-id="${d.id}">Reject</button>`;
      } else if (d.status === 'approved') {
        actions += `<button class="btn btn-primary btn-xs" data-act="issue" data-id="${d.id}">Mark Issued</button>`;
      }

      return `
        <tr>
          <td>${esc(d.studentName)}</td>
          <td><code>${esc(d.matric)}</code></td>
          <td><span class="chip chip-${d.type}">${esc(displayType(d.type))}</span></td>
          <td>${esc(d.title || d.notes || '—')}</td>
          <td>${d.requestedAt ? new Date(d.requestedAt).toLocaleDateString() : '—'}</td>
          <td>${statusBadge(d)}</td>
          <td class="row-actions" style="white-space:nowrap;">${actions}</td>
        </tr>`;
    }).join('');

    $('dc-tbody').querySelectorAll('button[data-act]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const act = btn.dataset.act;
        if (act === 'preview') previewDoc(id);
        if (act === 'approve') approveDoc(id);
        if (act === 'reject')  rejectDoc(id);
        if (act === 'issue')   issueDoc(id);
      });
    });
  }

  function applyFilter() {
    const q = ($('dc-search').value || '').trim().toLowerCase();
    const type = $('dc-type').value;
    const st = $('dc-status').value;

    FILTERED = ALL.filter((d) => {
      const hay = `${d.studentName} ${d.matric} ${d.title} ${d.notes}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (type && d.type !== type) return false;
      if (st && d.status !== st) return false;
      return true;
    });

    render();
  }

  function updateStats() {
    const total = ALL.length;
    const pending = ALL.filter((d) => d.status === 'pending').length;
    const approved = ALL.filter((d) => d.status === 'approved').length;
    const issued = ALL.filter((d) => d.status === 'issued').length;

    $('dc-total').textContent = total;
    $('dc-pending').textContent = pending;
    $('dc-approved').textContent = approved;
    $('dc-issued').textContent = issued;
  }

  async function load() {
    $('dc-tbody').innerHTML = '<tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch(apiBase());
      const payload = res.data || res || {};
      const raw = Array.isArray(payload) ? payload : (payload.rows || payload.documents || []);
      ALL = raw.map(unwrap).filter((d) => ALLOWED_TYPES.has(d.type));
      updateStats();
      applyFilter();
    } catch (err) {
      console.error('[documents]', err);
      $('dc-tbody').innerHTML = `<tr><td colspan="7" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  // ============================================================
  // ✅ PREVIEW — generate and show the document HTML
  // ============================================================
  async function previewDoc(id) {
    const modal = $('dc-modal');
    const body = $('dc-modal-body');
    body.innerHTML = `<div style="text-align:center; padding:3rem; color:#94a3b8;"><span class="spinner" style="display:inline-block; margin-right:8px;"></span> Generating preview…</div>`;
    modal.style.display = 'flex';

    try {
      // Use the correct base (admin or bursar)
      const base = apiBase();
      const res = await core.portalFetch(`${base}/${id}/preview`);
      if (res.success && res.html) {
        body.innerHTML = res.html;
      } else {
        body.innerHTML = `<div style="padding:2rem; text-align:center; color:#94a3b8;">Preview not available for this document type.</div>`;
      }
    } catch (err) {
      body.innerHTML = `<div style="padding:2rem; color:#ef4444;">⚠️ Failed to load preview: ${esc(err.message)}</div>`;
    }
  }

  // ============================================================
  // ACTIONS
  // ============================================================
  async function approveDoc(id) {
    const ok = core.confirm ? await core.confirm('Approve this document request?', 'Approve Document') : confirm('Approve this document request?');
    if (!ok) return;
    try {
      await core.portalFetch(`${apiBase()}/${id}/approve`, { method: 'POST' });
      core.showToast && core.showToast('Approved', 'success');
      load();
    } catch (err) { core.showToast && core.showToast(err.message, 'error'); }
  }

  async function rejectDoc(id) {
    const reason = prompt('Rejection reason (optional):') || '';
    try {
      await core.portalFetch(`${apiBase()}/${id}/reject`, {
        method: 'POST',
        body: { remarks: reason },
      });
      core.showToast && core.showToast('Rejected', 'success');
      load();
    } catch (err) { core.showToast && core.showToast(err.message, 'error'); }
  }

  async function issueDoc(id) {
    const ok = core.confirm ? await core.confirm('Mark this document as issued?', 'Issue Document') : confirm('Mark as issued?');
    if (!ok) return;
    try {
      await core.portalFetch(`${apiBase()}/${id}/issue`, { method: 'POST' });
      core.showToast && core.showToast('Issued! You can now download it.', 'success');
      load();
      // Automatically open the preview so admin can view/download
      setTimeout(() => previewDoc(id), 400);
    } catch (err) { core.showToast && core.showToast(err.message, 'error'); }
  }

  // ============================================================
  // EXPORT CSV
  // ============================================================
  function exportCsv() {
    const headers = ['Student', 'Matric', 'Type', 'Title', 'Requested', 'Status'];
    const rows = FILTERED.map((d) => [
      d.studentName, d.matric, d.type, d.title,
      d.requestedAt ? new Date(d.requestedAt).toLocaleDateString() : '',
      d.status,
    ]);
    const csv = [headers, ...rows]
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
      .join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `document-requests-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('dc-search').addEventListener('input', applyFilter);
  $('dc-type').addEventListener('change', applyFilter);
  $('dc-status').addEventListener('change', applyFilter);
  $('dc-refresh').addEventListener('click', load);
  $('dc-export').addEventListener('click', exportCsv);

  load();
})();
</script>
