<!-- Portal → Registrar → Sessions -->
<style>
  .reg-badge { display:inline-flex; align-items:center; padding:3px 9px; border-radius:99px; font-size:.65rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
  .reg-btn-sm { padding:.35rem .7rem; font-size:.72rem; font-weight:700; border-radius:6px; border:none; cursor:pointer; text-decoration:none; display:inline-block; transition:all .15s; }
</style>

<div style="padding:0;">
  <!-- HEADER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📅</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">Academic Sessions</div>
        <div style="font-size:.82rem;color:#d1fae5;">Manage institutional calendar and active sessions</div>
      </div>
    </div>
    <button id="btn-new-session" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:none;border-radius:8px;cursor:pointer;">+ New Session</button>
  </div>

  <!-- FILTERS -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;margin-bottom:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
    <input type="search" id="rs2-search" placeholder="Search session name or dates..." style="flex:1;min-width:200px;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
    <select id="rs2-status" style="padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
      <option value="">All Sessions</option>
      <option value="current">Current only</option>
      <option value="past">Past only</option>
      <option value="upcoming">Upcoming only</option>
    </select>
    <button id="rs2-refresh" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- STATS -->
  <div id="rs2-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;"></div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;font-weight:800;font-size:.9rem;color:#0f172a;">All Sessions</div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Session Name</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Start Date</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">End Date</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="rs2-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL: New Session -->
<div id="rs2-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:450px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Create Academic Session</h3>
      <button id="rs2-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>
    <div style="padding:1.25rem;">
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.7rem;font-weight:700;color:#64748b;margin-bottom:.3rem;">Session Name</label>
        <input type="text" id="new-session-name" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" placeholder="e.g. 2027/2028" />
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem;">
        <div>
          <label style="display:block;font-size:.7rem;font-weight:700;color:#64748b;margin-bottom:.3rem;">Start Date</label>
          <input type="date" id="new-session-start" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
        <div>
          <label style="display:block;font-size:.7rem;font-weight:700;color:#64748b;margin-bottom:.3rem;">End Date</label>
          <input type="date" id="new-session-end" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:#334155;margin-bottom:1.25rem;cursor:pointer;">
        <input type="checkbox" id="new-session-current" style="width:16px;height:16px;" />
        Set as Current Active Session
      </label>
      <div style="display:flex;justify-content:flex-end;gap:.5rem;">
        <button id="rs2-modal-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="rs2-modal-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Save Session</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  let ALL = [];

  async function load() {
    $('rs2-tbody').innerHTML = '<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/registrar/sessions');
      ALL = res.data || [];
      renderStats();
      renderTable();
    } catch (err) {
      $('rs2-tbody').innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function renderStats() {
    const total = ALL.length;
    const current = ALL.filter(s => s.isCurrent).length;
    const past = ALL.filter(s => !s.isCurrent && new Date(s.endDate) < new Date()).length;
    const upcoming = ALL.filter(s => !s.isCurrent && new Date(s.startDate) > new Date()).length;

    $('rs2-stats').innerHTML = `
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
        <div style="width:40px;height:40px;border-radius:10px;background:#e0e7ff;color:#3730a3;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📅</div>
        <div><div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;">${total}</div><div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total</div></div>
      </div>
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
        <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">⭐</div>
        <div><div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;">${current}</div><div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Current</div></div>
      </div>
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
        <div style="width:40px;height:40px;border-radius:10px;background:#f1f5f9;color:#475569;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">✔️</div>
        <div><div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;">${past}</div><div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Past</div></div>
      </div>
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
        <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">⏩</div>
        <div><div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;">${upcoming}</div><div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Upcoming</div></div>
      </div>
    `;
  }

  function renderTable() {
    if (!ALL.length) {
      $('rs2-tbody').innerHTML = '<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">No sessions found.</td></tr>';
      return;
    }

    $('rs2-tbody').innerHTML = ALL.map(s => {
      const isActive = s.isCurrent;
      const isPast = !isActive && new Date(s.endDate) < new Date();
      const isUpcoming = !isActive && new Date(s.startDate) > new Date();

      let badge = '';
      if (isActive) badge = '<span class="reg-badge" style="background:#d1fae5;color:#065f46;">Current</span>';
      else if (isUpcoming) badge = '<span class="reg-badge" style="background:#fef3c7;color:#92400e;">Upcoming</span>';
      else badge = '<span class="reg-badge" style="background:#f1f5f9;color:#475569;">Past</span>';

      const action = isActive 
        ? '—' 
        : `<button class="btn-activate reg-btn-sm" data-id="${s.id}" style="background:#065f46;color:#fff;">Activate</button>`;

      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:800;color:#0f172a;">${esc(s.name)}</td>
          <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(s.startDate)}</td>
          <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(s.endDate)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${badge}</td>
          <td style="padding:.65rem .75rem;text-align:right;">${action}</td>
        </tr>
      `;
    }).join('');

    document.querySelectorAll('.btn-activate').forEach(btn => {
      btn.addEventListener('click', () => activateSession(btn.dataset.id));
    });
  }

  async function activateSession(id) {
    if (!confirm('Set this as the current active session? This will affect all portal activity.')) return;
    try {
      await core.portalFetch(`/api/registrar/sessions/${id}/activate`, { method: 'POST' });
      core.showToast('Session activated.', 'success');
      load();
    } catch (err) {
      core.showToast(err.message, 'error');
    }
  }

  // Modal logic
  function openModal() {
    $('rs2-modal').style.display = 'flex';
    $('new-session-name').value = '';
    $('new-session-start').value = '';
    $('new-session-end').value = '';
    $('new-session-current').checked = false;
  }
  function closeModal() { $('rs2-modal').style.display = 'none'; }

  $('btn-new-session').addEventListener('click', openModal);
  $('rs2-modal-close').addEventListener('click', closeModal);
  $('rs2-modal-cancel').addEventListener('click', closeModal);

  $('rs2-modal-save').addEventListener('click', async () => {
    const name = $('new-session-name').value.trim();
    const startDate = $('new-session-start').value;
    const endDate = $('new-session-end').value;
    const isCurrent = $('new-session-current').checked;

    if (!name) return core.showToast('Session name is required.', 'warning');

    const btn = $('rs2-modal-save');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      await core.portalFetch('/api/registrar/sessions', {
        method: 'POST',
        body: { name, startDate, endDate, isCurrent }
      });
      core.showToast('Session created successfully.', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save Session';
    }
  });

  // Filters
  $('rs2-search').addEventListener('input', renderTable);
  $('rs2-status').addEventListener('change', renderTable);
  $('rs2-refresh').addEventListener('click', load);

  load();
})();
</script>
