<!-- Portal → Registrar → Student Profile -->
<div id="profile-loading" style="padding: 3rem; text-align: center; color: #94a3b8;">
  <span class="spinner"></span> Loading student profile…
</div>

<div id="profile-error" style="display: none; padding: 2rem; text-align: center; color: #991b1b; background: #fee2e2; border-radius: 12px;"></div>

<div id="profile-content" style="display: none;">
  <!-- HEADER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;">
    <div style="display:flex;align-items:center;gap:1rem;">
      <div id="profile-avatar" style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;overflow:hidden;">
        <!-- Avatar goes here -->
      </div>
      <div>
        <div id="profile-name" style="font-size:1.4rem;font-weight:800;">Student Name</div>
        <div id="profile-matric" style="font-size:.9rem;color:#d1fae5;margin-top:.25rem;">Matric No.</div>
      </div>
    </div>
    <a href="#registrar-students" style="padding:.5rem 1rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border-radius:8px;text-decoration:none;">← Back to Students</a>
  </div>

  <!-- DETAILS GRID -->
  <div style="display:grid;grid-template-columns:1fr 2fr;gap:1rem;margin-bottom:1.25rem;">
    <!-- Personal Info -->
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.25rem;">
      <h3 style="margin:0 0 1rem;font-size:.95rem;color:#0f172a;font-weight:800;">Personal Details</h3>
      <div style="display:flex;flex-direction:column;gap:.75rem;font-size:.85rem;">
        <div><div style="color:#64748b;font-size:.7rem;font-weight:700;text-transform:uppercase;">Level</div><div id="profile-level" style="font-weight:700;color:#0f172a;">—</div></div>
        <div><div style="color:#64748b;font-size:.7rem;font-weight:700;text-transform:uppercase;">Programme</div><div id="profile-programme" style="font-weight:700;color:#0f172a;">—</div></div>
        <div><div style="color:#64748b;font-size:.7rem;font-weight:700;text-transform:uppercase;">Department</div><div id="profile-dept" style="font-weight:700;color:#0f172a;">—</div></div>
        <div><div style="color:#64748b;font-size:.7rem;font-weight:700;text-transform:uppercase;">Email</div><div id="profile-email" style="font-weight:700;color:#0f172a;">—</div></div>
        <div><div style="color:#64748b;font-size:.7rem;font-weight:700;text-transform:uppercase;">Phone</div><div id="profile-phone" style="font-weight:700;color:#0f172a;">—</div></div>
      </div>
    </div>

    <!-- Academic Summary -->
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1.25rem;">
      <h3 style="margin:0 0 1rem;font-size:.95rem;color:#0f172a;font-weight:800;">Academic Summary</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;">
        <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;text-align:center;">
          <div style="font-size:.7rem;color:#64748b;font-weight:700;text-transform:uppercase;">CGPA</div>
          <div id="profile-cgpa" style="font-size:1.8rem;font-weight:800;color:#065f46;">—</div>
        </div>
        <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;text-align:center;">
          <div style="font-size:.7rem;color:#64748b;font-weight:700;text-transform:uppercase;">Courses</div>
          <div id="profile-courses-count" style="font-size:1.8rem;font-weight:800;color:#1e40af;">—</div>
        </div>
        <div style="background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:1rem;text-align:center;">
          <div style="font-size:.7rem;color:#64748b;font-weight:700;text-transform:uppercase;">Status</div>
          <div id="profile-status" style="font-size:1rem;font-weight:800;color:#065f46;margin-top:.5rem;">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RESULTS TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:1rem;border-bottom:1px solid #f1f5f9;font-weight:800;font-size:.95rem;color:#0f172a;">Academic Record</div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Units</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Session</th>
          </tr>
        </thead>
        <tbody id="profile-results-tbody">
          <tr><td colspan="6" style="padding:2rem;text-align:center;color:#94a3b8;">Loading results…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  // 1. Extract the ID from the URL hash (e.g. #registrar-student-profile?id=999)
  function getStudentId() {
    const hash = window.location.hash || '';
    const match = hash.match(/id=(\d+)/);
    return match ? Number(match[1]) : null;
  }

  async function loadProfile() {
    const studentId = getStudentId();
    if (!studentId) {
      $('profile-loading').style.display = 'none';
      $('profile-error').style.display = 'block';
      $('profile-error').textContent = 'No student ID provided in URL.';
      return;
    }

    try {
      // Fetch the transcript data (which includes student details, results, and CGPA summary)
      const res = await core.portalFetch(`/api/registrar/transcript/${studentId}`);
      const data = res;
      
      if (!data.student) throw new Error('Student data not found.');

      const s = data.student;
      const summary = data.summary || {};
      const rows = data.rows || [];

      // 2. Populate Header
      $('profile-name').textContent = `${s.firstName || ''} ${s.lastName || ''}`.trim() || 'Unknown Name';
      $('profile-matric').textContent = s.matricNumber ? s.matricNumber.replace(/SMT/gi, '').trim() : 'No Matric Number';
      
      // Avatar logic
      const avatarEl = $('profile-avatar');
      if (s.photoUrl) {
        avatarEl.innerHTML = `<img src="${esc(s.photoUrl)}" style="width:100%;height:100%;object-fit:cover;" />`;
      } else {
        avatarEl.textContent = (s.firstName || 'U')[0].toUpperCase();
      }

      // 3. Populate Details Grid
      $('profile-level').textContent = s.level || '—';
      $('profile-programme').textContent = s.programme?.name || s.programmeName || '—';
      $('profile-dept').textContent = s.department?.name || s.departmentName || '—';
      $('profile-email').textContent = s.email || '—';
      $('profile-phone').textContent = s.phone || '—';

      // 4. Populate Summary Stats
      $('profile-cgpa').textContent = summary.cgpa ? Number(summary.cgpa).toFixed(2) : '—';
      $('profile-courses-count').textContent = rows.length;
      
      const isActive = s.isActive === true || s.isActive === 'true' || s.isActive === 1;
      $('profile-status').textContent = isActive ? 'Active' : 'Inactive';
      $('profile-status').style.color = isActive ? '#065f46' : '#991b1b';

      // 5. Populate Results Table
      if (!rows.length) {
        $('profile-results-tbody').innerHTML = '<tr><td colspan="6" style="padding:2rem;text-align:center;color:#94a3b8;">No published results found for this student.</td></tr>';
      } else {
        $('profile-results-tbody').innerHTML = rows.map(r => {
          const course = r.course || {};
          const result = r.result || {};
          return `
            <tr style="border-bottom:1px solid #f1f5f9;">
              <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(course.code || '—')}</td>
              <td style="padding:.65rem .75rem;color:#475569;">${esc(course.title || '—')}</td>
              <td style="padding:.65rem .75rem;text-align:center;font-weight:700;color:#0f172a;">${course.unit || '—'}</td>
              <td style="padding:.65rem .75rem;text-align:center;">${result.score || '—'}</td>
              <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:${result.grade === 'F' ? '#991b1b' : '#065f46'};">${esc(result.grade || '—')}</td>
              <td style="padding:.65rem .75rem;text-align:center;font-size:.75rem;color:#64748b;">${esc(result.sessionName || '—')}</td>
            </tr>
          `;
        }).join('');
      }

      // Show Content
      $('profile-loading').style.display = 'none';
      $('profile-content').style.display = 'block';

    } catch (err) {
      console.error('[registrar-student-profile] Error:', err);
      $('profile-loading').style.display = 'none';
      $('profile-error').style.display = 'block';
      $('profile-error').textContent = `Failed to load profile: ${err.message}`;
    }
  }

  loadProfile();
})();
</script>
