<!-- Portal → Shared → Applications list (staff only) -->
<section class="page-head">
  <div><h2>Applications</h2></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>All Applications</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>App No</th><th>Applicant</th><th>Status</th><th>Submitted</th></tr></thead>
        <tbody id="shared-apps-tbody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  (async function loadApplications() {
    const core = window.FPU_PORTAL;
    const tbody = document.querySelector('.data-table tbody') || document.querySelector('table tbody'); 
    // ^ Make sure this matches the actual <tbody> in your HTML

    if (!tbody) return;

    try {
      // 1. Call the correct backend route
      const res = await core.portalFetch('/api/admin/applications?limit=100');
      
      // 2. Handle empty state
      if (!res.success || !res.data || res.data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="empty-cell">No applications found.</td></tr>`;
        return;
      }

      // 3. Render rows
      tbody.innerHTML = res.data.map(app => {
        // Map status colors (optional but looks nice)
        let statusColor = '#f59e0b'; // default amber
        if (app.status === 'approved') statusColor = '#10b981'; // green
        if (app.status === 'rejected') statusColor = '#ef4444'; // red
        if (app.status === 'registered') statusColor = '#3b82f6'; // blue

        const submittedDate = app.createdAt 
          ? new Date(app.createdAt).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) 
          : '—';

        return `
          <tr>
            <td><strong>${app.applicationNumber || '—'}</strong></td>
            <td>${app.firstName} ${app.lastName}</td>
            <td><span class="badge" style="background:${statusColor}; color:white; padding:2px 8px; border-radius:4px; font-size:11px;">${(app.status || 'pending').toUpperCase()}</span></td>
            <td>${submittedDate}</td>
          </tr>
        `;
      }).join('');

    } catch (err) {
      console.error('Applications load error:', err);
      tbody.innerHTML = `<tr><td colspan="4" class="empty-cell" style="color:#ef4444;">Error: ${err.message}</td></tr>`;
    }
  })();
</script>
