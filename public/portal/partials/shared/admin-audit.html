<!-- Portal → Shared → Audit (admins only) -->
<section class="page-head">
  <div><h2>Audit Log</h2></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Recent Activity</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Action</th><th>User</th><th>Entity</th><th>Time</th></tr></thead>
        <tbody id="shared-audit-tbody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const box = document.getElementById('shared-audit-tbody');
    try {
      const res = await core.portalFetch('/api/admin/audit?limit=100');
      box.innerHTML = (res.data || []).map((r) => `
        <tr>
          <td>${core.escapeHtml(r.log.action)}</td>
          <td>${r.user ? core.escapeHtml(r.user.firstName + ' ' + r.user.lastName) : '—'}</td>
          <td>${core.escapeHtml(r.log.entity || '')}</td>
          <td>${core.formatDateTime(r.log.createdAt)}</td>
        </tr>
      `).join('') || '<tr><td colspan="4" class="empty">No audit entries.</td></tr>';
    } catch (err) { box.innerHTML = `<tr><td colspan="4" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  })();
</script>
