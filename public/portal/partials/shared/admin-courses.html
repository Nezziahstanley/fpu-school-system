<!-- Portal → Shared → Courses (department-first) -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Courses</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Browse courses by department</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <input type="search" id="co-search" placeholder="🔍  Search course code or title…"
             style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;min-width:220px;" />
      <button id="co-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- SUMMARY STRIP -->
  <div id="co-summary" style="
    background:#fff;border:1px solid #e5e7eb;border-radius:12px;
    padding:.75rem 1rem;margin-bottom:1rem;
    display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
    font-size:.82rem;color:#475569;
  ">
    <div><strong style="color:#0f172a;" id="co-total-depts">—</strong> departments</div>
    <div><strong style="color:#0f172a;" id="co-total-courses">—</strong> total courses</div>
  </div>

  <!-- BREADCRUMB / BACK BUTTON (hidden until a department is picked) -->
  <div id="co-back-bar" style="display:none;margin-bottom:1rem;">
    <button id="co-back" style="
      display:inline-flex;align-items:center;gap:.4rem;
      padding:.5rem .9rem;font-size:.82rem;font-weight:700;
      background:#fff;color:#065f46;border:1px solid #bbf7d0;
      border-radius:8px;cursor:pointer;
    ">← All Departments</button>
    <span id="co-current-dept" style="
      margin-left:.75rem;font-size:.85rem;font-weight:800;color:#0f172a;
    "></span>
  </div>

  <!-- DEPARTMENT GRID -->
  <div id="co-dept-grid" style="
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:.75rem;
  "></div>

  <!-- COURSES OF PICKED DEPARTMENT -->
  <div id="co-courses-panel" style="display:none;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Code</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Unit</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Semester</th>
            </tr>
          </thead>
          <tbody id="co-courses-tbody">
            <tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<style>
  .co-dept-card {
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:1rem 1.1rem;
    cursor:pointer;
    transition:all .15s;
    display:flex;align-items:center;gap:.85rem;
  }
  .co-dept-card:hover {
    border-color:#065f46;
    box-shadow:0 6px 18px rgba(6,95,70,.10);
    transform:translateY(-2px);
  }
  .co-dept-icon {
    width:46px;height:46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:.72rem;flex-shrink:0;
    letter-spacing:.03em;
  }
  .co-dept-body { min-width:0;flex:1; }
  .co-dept-name {
    font-weight:800;color:#0f172a;font-size:.9rem;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .co-dept-count {
    font-size:.72rem;color:#64748b;margin-top:.25rem;font-weight:600;
  }
  .co-dept-arrow {
    color:#94a3b8;font-size:1.2rem;flex-shrink:0;
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let DEPARTMENTS = [];
  let COURSES = [];
  let SELECTED_DEPT = null;

  // Pastel colors for department icon tiles
  const PALETTE = [
    { bg: '#065f46', }, { bg: '#0891b2', }, { bg: '#7c3aed', }, { bg: '#dc2626', },
    { bg: '#ea580c', }, { bg: '#0d9488', }, { bg: '#db2777', }, { bg: '#4f46e5', },
    { bg: '#059669', }, { bg: '#d97706', }, { bg: '#0369a1', }, { bg: '#9333ea' },
  ];
  function pickColor(i) { return PALETTE[i % PALETTE.length].bg; }
  function initials(name) {
    return String(name || '')
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map((w) => w[0].toUpperCase())
      .join('')
      .slice(0, 3);
  }

  // ============================================================
  // LOAD — fetch departments + courses in parallel
  // ============================================================
  async function load() {
    const grid = $('co-dept-grid');
    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:#94a3b8;font-size:.82rem;">
        <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:coSpin .8s linear infinite;"></div>
        <div style="margin-top:.65rem;">Loading departments…</div>
      </div>`;

    try {
      const schedRes = await core.portalFetch('/api/exam-officer/schedules');
      SCHEDULES = Array.isArray(schedRes.data) ? schedRes.data : [];

      // Count courses per department
      const counts = {};
      COURSES.forEach((c) => {
        const d = c.departmentId;
        if (d) counts[d] = (counts[d] || 0) + 1;
      });

      // Summary
      $('co-total-depts').textContent = DEPARTMENTS.length;
      $('co-total-courses').textContent = COURSES.length;

      renderDepartmentGrid(counts);
    } catch (err) {
      grid.innerHTML = `
        <div style="grid-column:1/-1;padding:1rem;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#991b1b;font-size:.85rem;">
          ⚠️ ${esc(err.message)}
        </div>`;
    }
  }

  // ============================================================
  // RENDER DEPARTMENT GRID
  // ============================================================
  function renderDepartmentGrid(counts) {
    const grid = $('co-dept-grid');
    const query = ($('co-search')?.value || '').trim().toLowerCase();

    const filteredDepts = DEPARTMENTS.filter((d) => {
      if (!query) return true;
      return `${d.code || ''} ${d.name || ''}`.toLowerCase().includes(query);
    }).sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    if (!filteredDepts.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#94a3b8;font-size:.82rem;">No departments match your search.</div>`;
      return;
    }

    grid.innerHTML = filteredDepts.map((d, i) => {
      const count = counts[d.id] || 0;
      return `
        <div class="co-dept-card" data-dept-id="${d.id}">
          <div class="co-dept-icon" style="background:${pickColor(i)};">${esc(initials(d.name || d.code))}</div>
          <div class="co-dept-body">
            <div class="co-dept-name" title="${esc(d.name)}">${esc(d.name || '—')}</div>
            <div class="co-dept-count">${esc(d.code || '')} · ${count} course${count === 1 ? '' : 's'}</div>
          </div>
          <div class="co-dept-arrow">›</div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.co-dept-card').forEach((card) => {
      card.addEventListener('click', () => {
        const deptId = Number(card.dataset.deptId);
        const dept = DEPARTMENTS.find((d) => d.id === deptId);
        if (dept) selectDepartment(dept);
      });
    });
  }

  // ============================================================
  // SELECT DEPARTMENT → show its courses
  // ============================================================
  function selectDepartment(dept) {
    SELECTED_DEPT = dept;

    // Hide grid, show courses panel
    $('co-dept-grid').style.display = 'none';
    $('co-courses-panel').style.display = 'block';
    $('co-back-bar').style.display = 'block';
    $('co-current-dept').textContent = `${dept.code || ''} · ${dept.name || ''}`;

    const tbody = $('co-courses-tbody');
    tbody.innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#94a3b8;font-size:.82rem;">Loading…</td></tr>`;

    const deptCourses = COURSES
      .filter((c) => Number(c.departmentId) === Number(dept.id))
      .sort((a, b) => (a.code || '').localeCompare(b.code || ''));

    if (!deptCourses.length) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">
        No courses in this department yet.
      </td></tr>`;
      return;
    }

    tbody.innerHTML = deptCourses.map((c) => `
      <tr style="border-bottom:1px solid #f1f5f9;">
        <td style="padding:.65rem .75rem;">
          <code style="font-size:.75rem;font-weight:700;color:#065f46;background:#ecfdf5;padding:2px 7px;border-radius:5px;">
            ${esc(c.code || '—')}
          </code>
        </td>
        <td style="padding:.65rem .75rem;color:#0f172a;font-weight:600;">${esc(c.title || '—')}</td>
        <td style="padding:.65rem .75rem;text-align:center;color:#475569;font-weight:700;">${esc(c.unit ?? '—')}</td>
        <td style="padding:.65rem .75rem;text-align:center;">
          <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">
            ${esc(c.level || '—')}
          </span>
        </td>
        <td style="padding:.65rem .75rem;text-align:center;color:#64748b;font-size:.78rem;">
          ${esc(c.semesterName || c.semester || '—')}
        </td>
      </tr>`).join('');
  }

  // ============================================================
  // BACK TO DEPARTMENT GRID
  // ============================================================
  function backToDepartments() {
    SELECTED_DEPT = null;
    $('co-dept-grid').style.display = 'grid';
    $('co-courses-panel').style.display = 'none';
    $('co-back-bar').style.display = 'none';
  }

  // ============================================================
  // SEARCH
  // ============================================================
  let searchTimer;
  $('co-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      // If we're inside a department, filter its courses
      if (SELECTED_DEPT) {
        const q = ($('co-search').value || '').trim().toLowerCase();
        const tbody = $('co-courses-tbody');
        const deptCourses = COURSES
          .filter((c) => Number(c.departmentId) === Number(SELECTED_DEPT.id))
          .filter((c) => !q || `${c.code || ''} ${c.title || ''}`.toLowerCase().includes(q))
          .sort((a, b) => (a.code || '').localeCompare(b.code || ''));
        if (!deptCourses.length) {
          tbody.innerHTML = `<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">No matching courses.</td></tr>`;
          return;
        }
        tbody.innerHTML = deptCourses.map((c) => `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;">
              <code style="font-size:.75rem;font-weight:700;color:#065f46;background:#ecfdf5;padding:2px 7px;border-radius:5px;">
                ${esc(c.code || '—')}
              </code>
            </td>
            <td style="padding:.65rem .75rem;color:#0f172a;font-weight:600;">${esc(c.title || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:center;color:#475569;font-weight:700;">${esc(c.unit ?? '—')}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">
                ${esc(c.level || '—')}
              </span>
            </td>
            <td style="padding:.65rem .75rem;text-align:center;color:#64748b;font-size:.78rem;">
              ${esc(c.semesterName || c.semester || '—')}
            </td>
          </tr>`).join('');
      } else {
        // Filter the department grid
        const counts = {};
        COURSES.forEach((c) => { if (c.departmentId) counts[c.departmentId] = (counts[c.departmentId] || 0) + 1; });
        renderDepartmentGrid(counts);
      }
    }, 200);
  });

  // ============================================================
  // WIRING
  // ============================================================
  $('co-back')?.addEventListener('click', backToDepartments);
  $('co-refresh')?.addEventListener('click', () => {
    backToDepartments();
    load();
  });

  // Spin keyframes
  const st = document.createElement('style');
  st.textContent = '@keyframes coSpin { to { transform: rotate(360deg); } }';
  document.head.appendChild(st);

  load();
})();
</script>
