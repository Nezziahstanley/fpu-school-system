<!-- Portal → Shared → Courses (read-only) -->
<section class="page-head">
  <div><h2>Courses</h2></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Course Catalogue</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Code</th><th>Title</th><th>Unit</th><th>Level</th><th>Semester</th></tr></thead>
        <tbody id="shared-courses-tbody"><tr><td colspan="5" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const box = document.getElementById('shared-courses-tbody');
    try {
      const res = await core.portalFetch('/api/admin/courses?limit=300');
      box.innerHTML = (res.data || []).map((c) => `
        <tr>
          <td>${core.escapeHtml(c.code)}</td>
          <td>${core.escapeHtml(c.title)}</td>
          <td>${c.unit}</td>
          <td>${core.escapeHtml(c.level)}</td>
          <td>${core.escapeHtml(c.semester)}</td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="empty">No courses.</td></tr>';
    } catch (err) { box.innerHTML = `<tr><td colspan="5" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  })();
</script>
