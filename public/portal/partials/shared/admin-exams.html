<!-- Portal → Shared → Exams -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Exams</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Institution-wide exam schedule</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <input type="search" id="ex-search" placeholder="🔍  Search course, venue…"
             style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;min-width:220px;" />
      <select id="ex-semester" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
        <option value="">All Semesters</option>
        <option value="first">First</option>
        <option value="second">Second</option>
      </select>
      <button id="ex-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- STATS -->
  <div id="ex-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-bottom:1rem;"></div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Showing <span id="ex-shown">0</span> of <span id="ex-total">0</span> exams
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Date</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Time</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Venue</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Semester</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
          </tr>
        </thead>
        <tbody id="ex-tbody">
          <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:exSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<style>
  @keyframes exSpin { to { transform: rotate(360deg); } }
  #ex-tbody tr { transition: background .1s; }
  #ex-tbody tr:hover { background: #f8fafc; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }) : '—';

  let ALL = [];
  let FILTERED = [];

  async function load() {
    const tbody = $('ex-tbody');
    tbody.innerHTML = `
      <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">
        <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:exSpin .8s linear infinite;"></div>
        <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
      </td></tr>`;

    try {
      const res = await core.portalFetch('/api/exam-officer/schedules');
      ALL = Array.isArray(res.data) ? res.data : [];
      renderStats();
      applyFilter();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function renderStats() {
    const now = new Date();
    let upcoming = 0, past = 0;
    ALL.forEach((s) => {
      const e = s.exam || s;
      if (!e.examDate) return;
      if (new Date(e.examDate) >= now) upcoming++; else past++;
    });

    const tiles = [
      { label: 'Total Exams', value: ALL.length, bg: '#e0e7ff', fg: '#3730a3', icon: '📋' },
      { label: 'Upcoming',    value: upcoming,   bg: '#d1fae5', fg: '#065f46', icon: '📅' },
      { label: 'Past',        value: past,       bg: '#f1f5f9', fg: '#475569', icon: '✅' },
      { label: 'Venues',      value: new Set(ALL.map((s) => (s.exam || s).venue).filter(Boolean)).size, bg: '#fef3c7', fg: '#92400e', icon: '📍' },
    ];

    $('ex-stats').innerHTML = tiles.map(t => `
      <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:.85rem 1rem;display:flex;align-items:center;gap:.7rem;">
        <div style="width:40px;height:40px;border-radius:10px;background:${t.bg};color:${t.fg};display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;">${t.icon}</div>
        <div>
          <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;">${t.value}</div>
          <div style="font-size:.65rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-top:.2rem;">${t.label}</div>
        </div>
      </div>`).join('');
  }

  function applyFilter() {
    const q = ($('ex-search')?.value || '').trim().toLowerCase();
    const sem = $('ex-semester')?.value || '';

    FILTERED = ALL.filter((s) => {
      const e = s.exam || s;
      const c = s.course || {};
      if (sem && e.semester !== sem) return false;
      if (q) {
        const hay = `${c.code || ''} ${c.title || ''} ${e.venue || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(FILTERED);
    $('ex-shown').textContent = FILTERED.length;
    $('ex-total').textContent = ALL.length;
  }

  function renderTable(rows) {
    const tbody = $('ex-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">No matching exams.</td></tr>`;
      return;
    }

    // Sort by date, most recent first
    const sorted = [...rows].sort((a, b) => {
      const ea = a.exam || a; const eb = b.exam || b;
      return new Date(eb.examDate || 0) - new Date(ea.examDate || 0);
    });

    const now = new Date();
    tbody.innerHTML = sorted.map((s) => {
      const e = s.exam || s;
      const c = s.course || {};
      const isPast = e.examDate && new Date(e.examDate) < now;

      return `
        <tr>
          <td style="padding:.65rem .75rem;">
            <code style="font-size:.75rem;font-weight:700;color:#065f46;background:#ecfdf5;padding:2px 7px;border-radius:5px;">
              ${esc(c.code || '—')}
            </code>
          </td>
          <td style="padding:.65rem .75rem;color:#0f172a;font-weight:600;">${esc(c.title || '—')}</td>
          <td style="padding:.65rem .75rem;color:#334155;font-size:.78rem;font-weight:600;">${esc(fmtDate(e.examDate))}</td>
          <td style="padding:.65rem .75rem;text-align:center;color:#334155;font-family:ui-monospace,monospace;font-size:.75rem;">
            ${esc(e.startTime || '—')}${e.endTime ? ' – ' + esc(e.endTime) : ''}
          </td>
          <td style="padding:.65rem .75rem;color:#64748b;font-size:.78rem;">${esc(e.venue || 'TBA')}</td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;text-transform:capitalize;">
              ${esc(e.semester || '—')}
            </span>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;">
            ${isPast
              ? '<span style="display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px;background:#f1f5f9;color:#475569;">✅ Past</span>'
              : '<span style="display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:800;padding:3px 9px;border-radius:99px;background:#d1fae5;color:#065f46;">📅 Upcoming</span>'}
          </td>
        </tr>`;
    }).join('');
  }

  let searchTimer;
  $('ex-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilter, 200);
  });
  $('ex-semester')?.addEventListener('change', applyFilter);
  $('ex-refresh')?.addEventListener('click', load);

  load();
})();
</script>
