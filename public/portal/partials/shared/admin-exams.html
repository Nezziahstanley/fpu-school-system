<!-- Shared → Exams (read-only for HOD, manage for admin/exam-officer) -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📝</div>
    <div>
      <h1>Exams</h1>
      <div class="sub" id="ex-sub">Exam schedule for your department</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <input type="search" id="ex-search" placeholder="Search course, venue, session…" />
  <select id="ex-session"><option value="">All Sessions</option></select>
  <select id="ex-semester">
    <option value="">All Semesters</option>
    <option value="First">First</option>
    <option value="Second">Second</option>
  </select>
  <button class="btn btn-outline btn-sm" id="ex-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="ex-export">Export CSV</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Exams</span><span class="value" id="ex-total">—</span></div><div class="ic">📝</div></div>
  <div class="stat blue"><div class="meta"><span class="label">Upcoming</span><span class="value" id="ex-upcoming">—</span></div><div class="ic">📅</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Past</span><span class="value" id="ex-past">—</span></div><div class="ic">✅</div></div>
  <div class="stat purple"><div class="meta"><span class="label">ND / HND</span><span class="value" id="ex-split">—</span></div><div class="ic">🎯</div></div>
</div>

<section class="panel">
  <div class="panel-head"><h3>Exam Schedule</h3><span class="badge" id="ex-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Course</th><th>Title</th><th>Date</th><th>Time</th>
            <th>Venue</th><th>Session</th><th>Level</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="ex-tbody">
          <tr><td colspan="8" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [], FILTERED = [];

  if (user.departmentName) {
    const el = $('ex-sub');
    if (el) el.textContent = `Exam schedule for ${user.departmentName}`;
  }

  // Rows come as { exam: {...}, course: {...} }
  function unwrap(r) {
    const e = r.exam || r;
    const c = r.course || {};
    return {
      id: e.id,
      courseCode: e.courseCode || c.code || '—',
      courseTitle: e.courseTitle || c.title || '—',
      examDate: e.examDate || e.date,
      startTime: e.startTime || e.start_time || '',
      endTime: e.endTime || e.end_time || '',
      venue: e.venue || e.location || '—',
      sessionName: e.sessionName || r.session?.name || '—',
      semester: e.semesterName || e.semester || '—',
      level: e.level || c.level || '—',
    };
  }

  function getDate(e) {
    return e.examDate ? new Date(e.examDate).toLocaleDateString() : '—';
  }
  function getTime(e) {
    if (!e.startTime) return '—';
    return e.endTime ? `${e.startTime} - ${e.endTime}` : e.startTime;
  }
  function isUpcoming(e) {
    return e.examDate ? new Date(e.examDate) >= new Date() : false;
  }

  function render() {
    $('ex-count').textContent = FILTERED.length;
    if (!FILTERED.length) {
      $('ex-tbody').innerHTML = '<tr><td colspan="8" class="empty">No exams scheduled for your department.</td></tr>';
      return;
    }
    $('ex-tbody').innerHTML = FILTERED.map((e) => {
      const level = String(e.level || '').toUpperCase();
      const chipClass = 'chip-' + level.toLowerCase();
      const upcoming = isUpcoming(e);
      return `
        <tr>
          <td><strong>${esc(e.courseCode)}</strong></td>
          <td>${esc(e.courseTitle)}</td>
          <td>${esc(getDate(e))}</td>
          <td>${esc(getTime(e))}</td>
          <td>${esc(e.venue)}</td>
          <td>${esc(e.sessionName)}</td>
          <td><span class="chip ${chipClass}">${esc(level || '—')}</span></td>
          <td><span class="badge-status ${upcoming ? 'badge-active' : 'badge-inactive'}">${upcoming ? 'Upcoming' : 'Past'}</span></td>
        </tr>`;
    }).join('');
  }

  function applyFilter() {
    const q = ($('ex-search').value || '').trim().toLowerCase();
    const ses = $('ex-session').value;
    const sem = $('ex-semester').value;
    FILTERED = ALL.filter((e) => {
      const hay = `${e.courseCode} ${e.courseTitle} ${e.venue} ${e.sessionName}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (ses && e.sessionName !== ses) return false;
      if (sem && e.semester !== sem) return false;
      return true;
    });
    render();
  }

  function updateStats() {
    const total = ALL.length;
    const upcoming = ALL.filter(isUpcoming).length;
    const past = total - upcoming;
    const nd = ALL.filter((e) => String(e.level).toUpperCase() === 'ND').length;
    const hnd = ALL.filter((e) => String(e.level).toUpperCase() === 'HND').length;

    $('ex-total').textContent = total;
    $('ex-upcoming').textContent = upcoming;
    $('ex-past').textContent = past;
    $('ex-split').textContent = `${nd} / ${hnd}`;
  }

  async function load() {
    $('ex-tbody').innerHTML = '<tr><td colspan="8" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/exams');
      const payload = res.data || res || {};
      const raw = Array.isArray(payload) ? payload : (payload.rows || payload.exams || []);

      // Filter out broken rows (all nulls) — those come from a broken server query
      const valid = raw.filter((r) => r && (r.exam || r.courseCode));
      ALL = valid.map(unwrap);

      const sessions = [...new Set(ALL.map((e) => e.sessionName).filter((s) => s && s !== '—'))];
      const sel = $('ex-session');
      const cur = sel.value;
      sel.innerHTML = '<option value="">All Sessions</option>' +
        sessions.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
      sel.value = cur;

      updateStats();
      applyFilter();
    } catch (err) {
      console.error('[exams]', err);
      $('ex-tbody').innerHTML = `<tr><td colspan="8" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  function exportCsv() {
    const headers = ['Course', 'Title', 'Date', 'Time', 'Venue', 'Session', 'Semester', 'Level'];
    const rows = FILTERED.map((e) => [e.courseCode, e.courseTitle, getDate(e), getTime(e), e.venue, e.sessionName, e.semester, e.level]);
    const csv = [headers, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `exams-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('ex-search').addEventListener('input', applyFilter);
  $('ex-session').addEventListener('change', applyFilter);
  $('ex-semester').addEventListener('change', applyFilter);
  $('ex-refresh').addEventListener('click', load);
  $('ex-export').addEventListener('click', exportCsv);

  load();
})();
</script>
