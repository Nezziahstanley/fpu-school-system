<!-- Shared → Exams -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📝</div>
    <div>
      <h1>Exams</h1>
      <div class="sub" id="ex-sub">Exam schedule</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <input type="search" id="ex-search" placeholder="Search course, venue, session…" />
  <select id="ex-session"><option value="">All Sessions</option></select>
  <select id="ex-semester">
    <option value="">All Semesters</option>
    <option value="First">First</option>
    <option value="Second">Second</option>
  </select>
  <button class="btn btn-outline btn-sm" id="ex-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="ex-export">Export CSV</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Exams</span><span class="value" id="ex-total">—</span></div><div class="ic">📝</div></div>
  <div class="stat blue"><div class="meta"><span class="label">Upcoming</span><span class="value" id="ex-upcoming">—</span></div><div class="ic">📅</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Past</span><span class="value" id="ex-past">—</span></div><div class="ic">✅</div></div>
  <div class="stat purple"><div class="meta"><span class="label">ND / HND</span><span class="value" id="ex-split">—</span></div><div class="ic">🎯</div></div>
</div>

<section class="panel">
  <div class="panel-head"><h3>Exam Schedule</h3><span class="badge" id="ex-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Course</th><th>Title</th><th>Date</th><th>Time</th>
            <th>Venue</th><th>Session</th><th>Level</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="ex-tbody">
          <tr><td colspan="8" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  let ALL = [], FILTERED = [];
  let MY_COURSE_IDS = new Set();

  // Update subtitle based on role
  (function () {
    const sub = $('ex-sub');
    if (!sub) return;
    const role = String(user.role || '').toLowerCase();
    if (role === 'lecturer') sub.textContent = 'Exams for your courses';
    else if (role === 'hod') sub.textContent = `Exams in ${user.departmentName || 'your department'}`;
    else sub.textContent = 'Institution-wide exam schedule';
  })();

  // ---------------------------------------------------------
  // Extractors — API returns { exam, course, session } or flat
  // ---------------------------------------------------------
  function unwrap(r) {
    const e = r.exam || r;
    const c = r.course || {};
    const s = r.session || {};
    return {
      id: e.id,
      courseId: e.courseId,
      courseCode: c.code || e.courseCode || '—',
      courseTitle: c.title || e.courseTitle || '',
      departmentId: c.departmentId,
      examDate: e.examDate || e.date || null,
      startTime: e.startTime || e.start_time || '',
      endTime: e.endTime || e.end_time || '',
      venue: e.venue || e.location || '—',
      sessionName: e.sessionName || s.name || '—',
      semester: e.semesterName || e.semester || '—',
      level: c.level || e.level || '—',
    };
  }

  function getDate(e) {
    if (!e.examDate) return '—';
    try { return new Date(e.examDate).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); }
    catch { return '—'; }
  }
  function getTime(e) {
    if (!e.startTime) return '—';
    return e.endTime ? `${e.startTime} – ${e.endTime}` : e.startTime;
  }
  function isUpcoming(e) {
    return e.examDate ? new Date(e.examDate) >= new Date() : false;
  }

  function render() {
    const countEl = $('ex-count'); const tbody = $('ex-tbody');
    if (countEl) countEl.textContent = FILTERED.length;
    if (!tbody) return;

    if (!FILTERED.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty">No exams scheduled.</td></tr>';
      return;
    }

    tbody.innerHTML = FILTERED.map((e) => {
      const level = String(e.level || '').toUpperCase();
      const chipClass = 'chip-' + level.toLowerCase();
      const upcoming = isUpcoming(e);
      return `
        <tr>
          <td><strong>${esc(e.courseCode)}</strong></td>
          <td>${esc(e.courseTitle)}</td>
          <td>${esc(getDate(e))}</td>
          <td>${esc(getTime(e))}</td>
          <td>${esc(e.venue)}</td>
          <td>${esc(e.sessionName)}</td>
          <td><span class="chip ${chipClass}">${esc(level || '—')}</span></td>
          <td><span class="badge-status ${upcoming ? 'badge-active' : 'badge-inactive'}">${upcoming ? 'Upcoming' : 'Past'}</span></td>
        </tr>`;
    }).join('');
  }

  function applyFilter() {
    const q = ($('ex-search')?.value || '').trim().toLowerCase();
    const ses = $('ex-session')?.value || '';
    const sem = $('ex-semester')?.value || '';

    FILTERED = ALL.filter((e) => {
      const hay = `${e.courseCode} ${e.courseTitle} ${e.venue} ${e.sessionName}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (ses && e.sessionName !== ses) return false;
      if (sem && String(e.semester).toLowerCase() !== String(sem).toLowerCase()) return false;
      return true;
    });
    render();
  }

  function updateStats() {
    const total = ALL.length;
    const upcoming = ALL.filter(isUpcoming).length;
    const past = total - upcoming;
    const nd = ALL.filter((e) => String(e.level).toUpperCase() === 'ND').length;
    const hnd = ALL.filter((e) => String(e.level).toUpperCase() === 'HND').length;

    setText('ex-total', total);
    setText('ex-upcoming', upcoming);
    setText('ex-past', past);
    setText('ex-split', `${nd} / ${hnd}`);
  }

  function populateSessions() {
    const sel = $('ex-session');
    if (!sel) return;
    const sessions = [...new Set(ALL.map((e) => e.sessionName).filter((s) => s && s !== '—'))].sort();
    const cur = sel.value;
    sel.innerHTML = '<option value="">All Sessions</option>' +
      sessions.map((s) => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
    sel.value = cur;
  }

  async function load() {
    const tbody = $('ex-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="8" class="empty"><span class="spinner"></span> Loading…</td></tr>';

    try {
      const role = String(user.role || '').toLowerCase();

      // For lecturers: fetch their course IDs first
      if (role === 'lecturer') {
        try {
          const allocRes = await core.portalFetch('/api/allocations/my');
          const allocPayload = allocRes.data || allocRes || {};
          const allocRaw = Array.isArray(allocPayload) ? allocPayload : (allocPayload.rows || allocPayload.allocations || []);
          MY_COURSE_IDS = new Set(allocRaw.map((a) => {
            const alloc = a.allocation || a;
            return String(alloc.courseId);
          }));
          console.log('[exams] Lecturer course IDs:', [...MY_COURSE_IDS]);
        } catch (e) { console.warn('[exams] allocations failed:', e.message); }
      }

      // Fetch all exams
      const res = await core.portalFetch('/api/exams');
      const payload = res.data || res || {};
      const raw = Array.isArray(payload) ? payload : (payload.rows || payload.exams || []);

      let list = raw.map(unwrap);

      // CLIENT-SIDE FILTER by role
      if (role === 'lecturer' && MY_COURSE_IDS.size) {
        // Only exams for this lecturer's courses
        list = list.filter((e) => MY_COURSE_IDS.has(String(e.courseId)));
      } else if (role === 'hod' && user.departmentId) {
        // Only exams in this HOD's department
        list = list.filter((e) => !e.departmentId || String(e.departmentId) === String(user.departmentId));
      }
      // admin, registrar, exam_officer see everything

      ALL = list;
      console.log('[exams] Filtered to', ALL.length, 'from', raw.length, 'total (role:', role, ')');
      populateSessions();
      updateStats();
      applyFilter();
    } catch (err) {
      console.error('[exams]', err);
      if (tbody) tbody.innerHTML = `<tr><td colspan="8" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  function exportCsv() {
    const headers = ['Course', 'Title', 'Date', 'Time', 'Venue', 'Session', 'Semester', 'Level'];
    const rows = FILTERED.map((e) => [e.courseCode, e.courseTitle, getDate(e), getTime(e), e.venue, e.sessionName, e.semester, e.level]);
    const csv = [headers, ...rows].map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `exams-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('ex-search')?.addEventListener('input', applyFilter);
  $('ex-session')?.addEventListener('change', applyFilter);
  $('ex-semester')?.addEventListener('change', applyFilter);
  $('ex-refresh')?.addEventListener('click', load);
  $('ex-export')?.addEventListener('click', exportCsv);

  load();
})();
</script>
