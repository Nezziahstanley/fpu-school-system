<!-- Shared → Graduations (staff view) -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🎓</div>
    <div>
      <h1>Graduation Candidates</h1>
      <div class="sub">Students eligible for graduation clearance</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="gr-search" placeholder="Search matric, name, or programme…" />
  <select id="gr-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <select id="gr-programme"><option value="">All Programmes</option></select>
  <select id="gr-status">
    <option value="">All Status</option>
    <option value="eligible">Eligible (CGPA ≥ 2.0)</option>
    <option value="not_eligible">Not Eligible</option>
    <option value="graduated">Graduated</option>
  </select>
  <button class="btn btn-outline btn-sm" id="gr-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="gr-export">Export CSV</button>
</div>

<!-- Stats row -->
<div class="stat-grid">
  <div class="stat">
    <div class="meta"><span class="label">Total Candidates</span><span class="value" id="gr-total">—</span></div>
    <div class="ic">🎓</div>
  </div>
  <div class="stat blue">
    <div class="meta"><span class="label">Eligible (CGPA ≥ 2.0)</span><span class="value" id="gr-eligible">—</span></div>
    <div class="ic">✅</div>
  </div>
  <div class="stat red">
    <div class="meta"><span class="label">Not Eligible</span><span class="value" id="gr-not-eligible">—</span></div>
    <div class="ic">⚠️</div>
  </div>
  <div class="stat accent">
    <div class="meta"><span class="label">Graduated</span><span class="value" id="gr-graduated">—</span></div>
    <div class="ic">🏆</div>
  </div>
</div>

<!-- Table -->
<section class="panel">
  <div class="panel-head">
    <h3>Graduation Queue</h3>
    <span class="badge" id="gr-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Matric No.</th>
            <th>Full Name</th>
            <th>Programme</th>
            <th>Level</th>
            <th>CGPA</th>
            <th>Classification</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="gr-tbody">
          <tr><td colspan="8" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  // ---------------------------------------------------------
  // Extractors
  // ---------------------------------------------------------
  function getLevel(s) { return String(s.level || '').toUpperCase().trim() || '—'; }
  function getProgramme(s) { return s.programmeName || s.programme?.name || '—'; }
  function getCGPA(s) { return s.cgpa != null ? Number(s.cgpa) : null; }
  function getCGPADisplay(s) { const g = getCGPA(s); return g != null ? g.toFixed(2) : '—'; }

  function classify(cgpa) {
    if (cgpa == null) return '—';
    if (cgpa >= 3.50) return 'Distinction';
    if (cgpa >= 3.00) return 'Upper Credit';
    if (cgpa >= 2.50) return 'Lower Credit';
    if (cgpa >= 2.00) return 'Pass';
    return 'Fail';
  }

  function getStatus(s) {
    // If already graduated (has graduatedAt or graduationStatus)
    if (s.graduatedAt || s.graduationStatus === 'graduated') return 'graduated';
    const cgpa = getCGPA(s);
    if (cgpa != null && cgpa >= 2.00) return 'eligible';
    return 'not_eligible';
  }

  function statusBadge(s) {
    const st = getStatus(s);
    if (st === 'graduated')    return '<span class="badge-status badge-active">Graduated</span>';
    if (st === 'eligible')     return '<span class="badge-status badge-success">Eligible</span>';
    return '<span class="badge-status badge-inactive">Not Eligible</span>';
  }

  // ---------------------------------------------------------
  // Render
  // ---------------------------------------------------------
  function render() {
    $('gr-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('gr-tbody').innerHTML =
        '<tr><td colspan="8" class="empty">No graduation candidates match your filters.</td></tr>';
      return;
    }

    $('gr-tbody').innerHTML = FILTERED.map((s) => {
      const level = getLevel(s);
      const chipClass = 'chip-' + level.toLowerCase();
      const st = getStatus(s);
      const actions = st === 'eligible'
        ? `<button class="btn btn-primary btn-xs" data-act="graduate" data-id="${s.id}">Mark Graduated</button>`
        : `<span class="muted small">—</span>`;
      return `
        <tr>
          <td><strong>${esc(s.matricNumber || '—')}</strong></td>
          <td>${esc((s.firstName || '') + ' ' + (s.lastName || ''))}</td>
          <td>${esc(getProgramme(s))}</td>
          <td><span class="chip ${chipClass}">${esc(level)}</span></td>
          <td><strong>${getCGPADisplay(s)}</strong></td>
          <td>${esc(classify(getCGPA(s)))}</td>
          <td>${statusBadge(s)}</td>
          <td class="row-actions">${actions}</td>
        </tr>`;
    }).join('');

    $('gr-tbody').querySelectorAll('button[data-act]').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        if (btn.dataset.act === 'graduate') markGraduated(id);
      });
    });
  }

  // ---------------------------------------------------------
  // Filters
  // ---------------------------------------------------------
  function applyFilter() {
    const q = ($('gr-search').value || '').trim().toLowerCase();
    const lvl = $('gr-level').value;
    const prog = $('gr-programme').value;
    const st = $('gr-status').value;

    FILTERED = ALL.filter((s) => {
      const hay = `${s.matricNumber || ''} ${s.firstName || ''} ${s.lastName || ''} ${getProgramme(s)}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && getLevel(s) !== lvl) return false;
      if (prog && getProgramme(s) !== prog) return false;
      if (st && getStatus(s) !== st) return false;
      return true;
    });

    render();
  }

  // ---------------------------------------------------------
  // Stats
  // ---------------------------------------------------------
  function updateStats() {
    const total = ALL.length;
    const eligible = ALL.filter((s) => getStatus(s) === 'eligible').length;
    const notEligible = ALL.filter((s) => getStatus(s) === 'not_eligible').length;
    const graduated = ALL.filter((s) => getStatus(s) === 'graduated').length;

    $('gr-total').textContent = total;
    $('gr-eligible').textContent = eligible;
    $('gr-not-eligible').textContent = notEligible;
    $('gr-graduated').textContent = graduated;
  }

  // ---------------------------------------------------------
  // Programme dropdown
  // ---------------------------------------------------------
  function populateProgrammes() {
    const progs = [...new Set(ALL.map(getProgramme).filter((p) => p && p !== '—'))].sort();
    const sel = $('gr-programme');
    const cur = sel.value;
    sel.innerHTML = '<option value="">All Programmes</option>' +
      progs.map((p) => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    sel.value = cur;
  }

  // ---------------------------------------------------------
  // Load
  // ---------------------------------------------------------
  async function load() {
    $('gr-tbody').innerHTML = '<tr><td colspan="8" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/graduation');
      const payload = res.data || res || {};
      ALL = Array.isArray(payload) ? payload : (payload.rows || payload.graduations || []);
      console.log('[graduation] Loaded', ALL.length);
      populateProgrammes();
      updateStats();
      applyFilter();
    } catch (err) {
      console.error('[graduation]', err);
      $('gr-tbody').innerHTML = `<tr><td colspan="8" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  // ---------------------------------------------------------
  // Actions
  // ---------------------------------------------------------
  async function markGraduated(id) {
    if (!confirm('Mark this student as graduated? This action is not easily reversible.')) return;
    try {
      await core.portalFetch(`/api/graduation/${id}/graduate`, { method: 'POST' });
      core.showToast && core.showToast('Student marked as graduated', 'success');
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message || 'Action failed', 'error');
    }
  }

  // ---------------------------------------------------------
  // Export CSV
  // ---------------------------------------------------------
  function exportCsv() {
    const headers = ['Matric', 'Full Name', 'Programme', 'Level', 'CGPA', 'Classification', 'Status'];
    const rows = FILTERED.map((s) => [
      s.matricNumber || '',
      `${s.firstName || ''} ${s.lastName || ''}`.trim(),
      getProgramme(s),
      getLevel(s),
      getCGPADisplay(s),
      classify(getCGPA(s)),
      getStatus(s),
    ]);
    const csv = [headers, ...rows]
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(','))
      .join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `graduation-candidates-${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $('gr-search').addEventListener('input', applyFilter);
  $('gr-level').addEventListener('change', applyFilter);
  $('gr-programme').addEventListener('change', applyFilter);
  $('gr-status').addEventListener('change', applyFilter);
  $('gr-refresh').addEventListener('click', load);
  $('gr-export').addEventListener('click', exportCsv);

  load();
})();
</script>
