<!-- Institutional ID Card Directory -->
<section class="greeting"><div class="who"><div class="avatar">🪪</div><div><h1>Institutional ID Cards</h1><div class="sub">Browse and preview student and staff identity cards</div></div></div></section>
<style>
.id-directory{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:1rem;align-items:start}
.id-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.id-tab{border:1px solid #dbe4dc;background:#fff;color:#334155;padding:.55rem .8rem;border-radius:8px;font-weight:700;cursor:pointer}
.id-tab.active{background:#065f46;border-color:#065f46;color:#fff}
.id-list{display:grid;gap:.55rem}
.id-person{display:flex;align-items:center;gap:.75rem;padding:.75rem;border:1px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer;text-align:left;width:100%}
.id-person.active{border-color:#059669;background:#f0fdf4}
.id-avatar{width:42px;height:42px;border-radius:9px;background:#e2e8f0;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#065f46;flex:none}
.id-preview{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:14px;padding:1rem;position:sticky;top:1rem}
.id-card-preview{width:100%;max-width:440px;aspect-ratio:1.58/1;margin:auto;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 15px 35px #0f172a22;border:1px solid #d1d5db;display:flex;flex-direction:column}.id-card-pair{display:grid;gap:12px}.id-card-back{background:#fff;border:3px solid #065f46;border-radius:14px;aspect-ratio:1.58/1;max-width:440px;width:100%;margin:auto;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;text-align:center}.id-photo-placeholder{width:88px;height:108px;object-fit:cover;border:2px solid #065f46;border-radius:6px;background:#f1f5f9;display:grid;place-items:center;color:#065f46;font-weight:900;font-size:22px}
.id-card-top{background:linear-gradient(120deg,#064e3b,#059669);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:10px}
.id-card-top img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.id-card-content{padding:14px;display:flex;gap:12px;flex:1;min-height:0}
.id-card-photo{width:88px;height:108px;object-fit:cover;border:2px solid #065f46;border-radius:6px;background:#f1f5f9;flex:none}
.id-card-info{min-width:0;flex:1}
.id-card-info small{display:block;color:#64748b;font-size:8px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-top:5px}
.id-card-info strong{display:block;color:#0f172a;font-size:11px;overflow-wrap:anywhere}
.id-card-bottom{background:#064e3b;color:#fef3c7;padding:6px 13px;display:flex;justify-content:space-between;font-size:8px;font-weight:800;letter-spacing:.7px}
@media(max-width:900px){.id-directory{grid-template-columns:1fr}.id-preview{position:static}}
</style>
<div class="id-tabs" id="ic-tabs">
  <button class="id-tab active" data-role="all">All Cards</button>
  <button class="id-tab" data-role="student">Students</button>
  <button class="id-tab" data-role="lecturer">Lecturers</button>
  <button class="id-tab" data-role="hod">HODs</button>
  <button class="id-tab" data-role="staff">Other Staff</button>
</div>
<div class="id-directory">
  <section class="panel"><div class="panel-head"><h3>Card Directory</h3><span class="badge" id="ic-count">0</span></div><div class="panel-body">
    <input id="ic-search" type="search" placeholder="Search name, ID, department or email…" style="width:100%;padding:.65rem .75rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:.8rem;" />
    <div class="id-list" id="ic-list"><div class="muted">Loading ID cards…</div></div>
  </div></section>
  <aside class="id-preview"><div style="font-weight:800;color:#0f172a;margin-bottom:.8rem;">Selected ID Card</div><div id="ic-preview"><div style="padding:3rem 1rem;text-align:center;color:#64748b;">Select a person to preview their card.</div></div><div style="display:flex;gap:.5rem;justify-content:center;margin-top:.8rem;"><button class="btn btn-primary btn-sm" id="ic-print" disabled>Print Card</button></div></aside>
</div>
<script>
(function(){
'use strict';
const core=window.FPU_PORTAL||{},$=id=>document.getElementById(id),esc=s=>core.escapeHtml?core.escapeHtml(s):String(s==null?'':s);
let ALL=[],FILTER='all',SELECTED=null;
const roles={student:'Student',lecturer:'Lecturer',hod:'Head of Department',bursar:'Bursar',registrar:'Registrar',rector:'Rector',librarian:'Librarian',exam_officer:'Examination Officer',academic_officer:'Academic Officer',admission_officer:'Admission Officer',admin:'Administrator'};
function category(r){return r==='student'?'student':r==='lecturer'?'lecturer':r==='hod'?'hod':'staff'}
function matches(r){return FILTER==='all'||category(r.role)===FILTER}
function fullName(r){return [r.firstName,r.middleName,r.lastName].filter(Boolean).join(' ')}
function render(){
 const q=$('ic-search').value.trim().toLowerCase();
 const rows=ALL.filter(r=>matches(r)&&[fullName(r),r.matricNumber,r.staffNumber,r.email,r.departmentName,r.schoolName].join(' ').toLowerCase().includes(q));
 $('ic-count').textContent=rows.length;
 $('ic-list').innerHTML=rows.length?rows.map(r=>'<button class="id-person '+(SELECTED&&SELECTED.id===r.id?'active':'')+'" data-id="'+r.id+'"><img class="id-avatar" src="'+esc(r.photoUrl||r.profilePhotoUrl||'')+'" onerror="this.style.display=\'none\'" alt="" /><span style="min-width:0;flex:1"><strong style="display:block;color:#0f172a">'+esc(fullName(r))+'</strong><small style="color:#64748b">'+esc(roles[r.role]||r.role)+' · '+esc(r.matricNumber||r.staffNumber||('FPU/'+String(r.id).padStart(5,'0')) )+'</small></span><span style="color:#64748b">›</span></button>').join(''):'<div class="muted" style="padding:1.5rem;text-align:center">No ID cards found in this category.</div>';
 $('ic-list').querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{SELECTED=ALL.find(x=>String(x.id)===el.dataset.id)||null;render();renderPreview()}));
}
function renderPreview(){
 const r=SELECTED;
 if(!r){$('ic-preview').innerHTML='<div style="padding:3rem 1rem;text-align:center;color:#64748b">Select a person to preview their card.</div>';$('ic-print').disabled=true;return}
 const student=r.role==='student',name=fullName(r),identity=student?(r.matricNumber||'—'):(r.staffNumber||'FPU/'+String(r.role).toUpperCase()+'/'+String(r.id).padStart(5,'0'));
 const photo=r.photoUrl||r.profilePhotoUrl||'',initials=name.split(' ').map(x=>x[0]).filter(Boolean).slice(0,2).join('').toUpperCase();
 const portrait=photo?'<img class="id-card-photo" src="'+esc(photo)+'" alt="Passport photograph" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="id-photo-placeholder" style="display:none">'+esc(initials)+'</div>':'<div class="id-photo-placeholder">'+esc(initials||'?')+'</div>';
 const dept=esc(r.departmentName||'—'),prog=esc(r.programmeName||'—'),level=esc(r.level||'—');
 $('ic-preview').innerHTML='<div class="id-card-pair"><div class="id-card-preview id-card-front"><div class="id-card-top"><img src="/images/logo.png" alt="FPU"><div><div style="font-size:10px;font-weight:900;letter-spacing:.5px">FEDERAL POLYTECHNIC UGEP</div><div style="font-size:8px;color:#fef3c7;font-weight:700">'+(student?'STUDENT':'STAFF')+' IDENTIFICATION CARD</div></div></div><div class="id-card-content">'+portrait+'<div class="id-card-info"><small>Full name</small><strong>'+esc(name)+'</strong><small>'+(student?'Matriculation number':'Staff ID')+'</small><strong>'+esc(identity)+'</strong><small>Department / Unit</small><strong>'+dept+'</strong>'+(student?'<small>Programme · Level</small><strong>'+prog+' · '+level+'</strong>':'<small>Designation</small><strong>'+esc(r.rank||roles[r.role]||r.role)+'</strong>')+'<small>Email</small><strong>'+esc(r.email||'—')+'</strong></div></div><div class="id-card-bottom"><span>OFFICIAL '+(student?'STUDENT':'STAFF')+' ID</span><span>'+esc(identity)+'</span></div></div><div class="id-card-back"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><img src="/images/logo.png" alt="FPU" style="width:48px;height:48px;object-fit:contain"><strong style="color:#065f46;font-size:12px">FEDERAL POLYTECHNIC, UGEP</strong><span style="font-size:10px;color:#64748b">FPU</span></div><div style="font:700 11px Arial;color:#334155;line-height:1.7">The bearer of this card is an officially recorded '+(student?'student':'staff member')+' of Federal Polytechnic Ugep.<br>For verification, contact the Registry.</div><div style="font-size:10px;color:#475569">If found, please return to the Registry, Federal Polytechnic Ugep.</div><div style="border-top:1px solid #0f172a;padding-top:6px;font-size:9px;font-weight:800;color:#065f46">AUTHORISED INSTITUTIONAL IDENTIFICATION</div></div></div><div style="font-size:11px;color:#64748b;text-align:center;margin-top:8px">Status: '+(r.isActive?'Active':'Inactive')+' · '+esc(r.schoolName||'Federal Polytechnic Ugep')+'</div>';
 $('ic-print').disabled=false;
}
$('ic-tabs').querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{FILTER=b.dataset.role;$('ic-tabs').querySelectorAll('.id-tab').forEach(x=>x.classList.toggle('active',x===b));render()}));
$('ic-search').addEventListener('input',render);
$('ic-print').addEventListener('click',()=>{
 if(!SELECTED)return;
 const pair=$('ic-preview').querySelector('.id-card-pair');if(!pair)return;
 const w=window.open('','_blank','width=760,height=900');if(!w)return;
 const html=pair.innerHTML;
 w.document.write('<!doctype html><html><head><title>FPU ID Card - '+esc(fullName(SELECTED))+'</title><style>@page{size:A4;margin:20mm}body{font-family:Arial,sans-serif;margin:0;padding:20mm}.id-card-preview,.id-card-back{width:440px;height:278px;box-sizing:border-box;border:1px solid #ddd;border-radius:15px;overflow:hidden;margin:0 auto 15mm;break-after:page}.id-card-back{border:3px solid #065f46;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:center}.id-card-top{background:linear-gradient(120deg,#064e3b,#059669);color:white;padding:12px 15px;display:flex;align-items:center;gap:10px}.id-card-top img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}.id-card-content{padding:14px;display:flex;gap:12px;height:170px}.id-card-photo,.id-photo-placeholder{width:88px;height:108px;object-fit:cover;border:2px solid #065f46;border-radius:6px;background:#f1f5f9;flex:none}.id-photo-placeholder{display:grid;place-items:center;color:#065f46;font-weight:900}.id-card-info{min-width:0;flex:1}.id-card-info small{display:block;color:#64748b;font-size:8px;text-transform:uppercase;font-weight:800;margin-top:4px}.id-card-info strong{display:block;color:#0f172a;font-size:11px;overflow-wrap:anywhere}.id-card-bottom{background:#064e3b;color:#fef3c7;padding:6px 13px;display:flex;justify-content:space-between;font-size:8px;font-weight:800}.id-card-back:last-child{break-after:auto}</style></head><body>'+html+'<script>window.onload=()=>window.print()<\\/script></body></html>');
 w.document.close();
});
async function load(){try{const r=await core.portalFetch('/api/admin/id-cards');ALL=r.data||[];render();if(ALL.length){SELECTED=ALL[0];render();renderPreview()}}catch(e){$('ic-list').innerHTML='<div style="color:#b91c1c">Could not load ID cards: '+esc(e.message)+'</div>'}}
load();
})();
</script>
