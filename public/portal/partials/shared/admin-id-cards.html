<!-- Institutional ID Card Directory -->
<section class="greeting"><div class="who"><div class="avatar">🪪</div><div><h1>Institutional ID Cards</h1><div class="sub">Browse and preview student and staff identity cards</div></div></div></section>
<style>
.id-directory{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:1rem;align-items:start}
.id-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.id-tab{border:1px solid #dbe4dc;background:#fff;color:#334155;padding:.55rem .8rem;border-radius:8px;font-weight:700;cursor:pointer}
.id-tab.active{background:#065f46;border-color:#065f46;color:#fff}
.id-list{display:grid;gap:.55rem}
.id-person{display:flex;align-items:center;gap:.75rem;padding:.75rem;border:1px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer;text-align:left;width:100%}
.id-person.active{border-color:#059669;background:#f0fdf4}
.id-avatar{width:42px;height:42px;border-radius:9px;background:#e2e8f0;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#065f46;flex:none}
.id-preview{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:14px;padding:1rem;position:sticky;top:1rem}
.id-card-preview{width:100%;max-width:440px;aspect-ratio:1.58/1;margin:auto;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 15px 35px #0f172a22;border:1px solid #d1d5db;display:flex;flex-direction:column}
.id-card-top{background:linear-gradient(120deg,#064e3b,#059669);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:10px}
.id-card-top img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.id-card-content{padding:14px;display:flex;gap:12px;flex:1;min-height:0}
.id-card-photo{width:88px;height:108px;object-fit:cover;border:2px solid #065f46;border-radius:6px;background:#f1f5f9;flex:none}
.id-card-info{min-width:0;flex:1}
.id-card-info small{display:block;color:#64748b;font-size:8px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-top:5px}
.id-card-info strong{display:block;color:#0f172a;font-size:11px;overflow-wrap:anywhere}
.id-card-bottom{background:#064e3b;color:#fef3c7;padding:6px 13px;display:flex;justify-content:space-between;font-size:8px;font-weight:800;letter-spacing:.7px}
@media(max-width:900px){.id-directory{grid-template-columns:1fr}.id-preview{position:static}}
.ic-department-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem}
.ic-dept-card{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.85rem;border:1px solid #e2e8f0;border-radius:12px;background:#fff;cursor:pointer;min-width:0}
.ic-dept-card:hover,.ic-dept-card.active{border-color:#059669;background:#f0fdf4}
.ic-dept-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#dcfce7;color:#065f46;font-weight:900;flex:none}
.ic-dept-card strong{display:block;color:#0f172a;font-size:.8rem}
.ic-dept-card small{display:block;color:#64748b;font-size:.7rem;margin-top:2px}
.id-card-preview.student-card{position:relative}
.id-card-preview.student-card:after{content:"";position:absolute;inset:0;background:url('/images/logo.png') center/55% no-repeat;opacity:.045;pointer-events:none}
.id-card-preview.student-card>*{position:relative;z-index:1}
.id-card-back{width:100%;max-width:440px;aspect-ratio:1.58/1;margin:1rem auto;background:linear-gradient(145deg,#fff,#f0fdf4);border:5px double #065f46;border-radius:15px;box-sizing:border-box;padding:20px;font:12px/1.65 Georgia,serif;color:#334155;position:relative}
.id-card-back:after{content:"";position:absolute;inset:0;background:url('/images/logo.png') center/45% no-repeat;opacity:.035;pointer-events:none}
@media(max-width:600px){.ic-department-grid{grid-template-columns:1fr 1fr}.id-card-info strong{font-size:9px}.id-card-photo{width:70px;height:92px}}

.id-card-preview{max-width:500px;aspect-ratio:1.58/1}
.id-card-top img{width:42px;height:42px;object-fit:contain;background:#fff;border:2px solid #fbbf24;border-radius:50%;padding:3px;flex:none}
.id-gold-stripe{height:3px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24);flex:none}
.id-student-body{padding:10px 14px;display:flex;gap:12px;flex:1;min-height:0;align-items:flex-start}
.id-student-body>.id-card-photo,.id-student-body>.id-photo-placeholder{width:86px;height:108px;flex:none}
.id-photo-placeholder{display:grid;place-items:center;border:2px solid #065f46;border-radius:7px;background:#ecfdf5;color:#065f46;font-size:22px;font-weight:900}
.id-card-info .id-number{color:#065f46;font-family:monospace}
.id-student-pair{display:flex;gap:20px}
.id-qr-column{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;flex:none}
.id-qr-column img{width:58px;height:58px}
.id-qr-column small{font-size:6px;text-align:center;color:#64748b;font-weight:800}
.student-back{font-family:Georgia,serif}
.id-back-top{display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid #bbf7d0;padding-bottom:8px}
.id-back-top>img:first-child{width:45px;height:45px;object-fit:contain}
.id-back-top>img:nth-child(2){width:64px;height:64px;object-fit:contain}
.id-back-top>div{margin-left:auto;text-align:right}
.id-back-top strong{display:block;color:#065f46;font-size:10px}
.id-back-top small{display:block;color:#64748b;font-size:8px}
.id-back-copy{text-align:center;margin:12px 0;font-size:10px;line-height:1.5}
.id-back-copy strong{display:block;color:#065f46;margin-top:4px}
.id-card-back p{font-size:10px;line-height:1.5}
.id-authorised-sign{text-align:center;margin-top:22px;color:#1e3a8a;font-family:cursive;font-size:16px}
.id-authorised-sign div{border-top:1px solid #0f172a;width:115px;margin:4px auto 0;padding-top:3px;color:#475569;font:700 7px Arial}
.staff-card-head{background:linear-gradient(120deg,#065f46,#059669);padding:12px 16px;color:#fff;display:flex;align-items:center;gap:12px}
.staff-card-head>img{width:44px;height:44px;object-fit:contain;background:#fff;border:2px solid #fbbf24;border-radius:50%;padding:3px;flex:none}
.staff-card-head strong{display:block;font-size:12px;letter-spacing:.5px}
.staff-card-head small{display:block;font-size:8px;color:#fef08a;font-weight:800;letter-spacing:1px;margin-top:3px}
.staff-card-body{display:flex;gap:12px;padding:11px 14px;flex:1;min-height:0;align-items:flex-start}
.staff-card-body>.id-card-photo,.staff-card-body>.id-photo-placeholder{width:88px;height:112px;flex:none}
.staff-fields{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;min-width:0;flex:1}
.staff-fields small{display:block;font-size:7px;color:#64748b;font-weight:800;text-transform:uppercase}
.staff-fields strong{display:block;font-size:9px;color:#0f172a;line-height:1.2;overflow-wrap:anywhere}
.staff-qr{width:58px;height:58px;object-fit:contain;align-self:flex-end;flex:none}
.staff-back{font-family:Georgia,serif}
.staff-back .id-back-top{justify-content:space-between}
.staff-back .id-back-top>div{margin:0;text-align:left;align-self:center;flex:1}
.id-registry-sign{margin:26px 0 0 auto;width:145px;text-align:right;border-top:1px solid #0f172a;padding-top:4px;font:800 9px Arial}
.id-card-status{text-align:center;color:#64748b;font-size:11px;margin-top:8px}
@media(max-width:600px){.staff-fields{gap:3px 6px}.staff-fields strong{font-size:7px}.staff-card-body>.id-card-photo,.staff-card-body>.id-photo-placeholder{width:66px;height:88px}.staff-qr{width:44px;height:44px}}

</style>
<div class="id-tabs" id="ic-tabs">
  <button class="id-tab active" data-role="all">All Cards</button>
  <button class="id-tab" data-role="student">Students</button>
  <button class="id-tab" data-role="lecturer">Lecturers</button>
  <button class="id-tab" data-role="hod">HODs</button>
  <button class="id-tab" data-role="staff">Other Staff</button>
</div>
<section class="panel" style="margin-bottom:1rem"><div class="panel-head"><h3>Students by Department</h3><span class="badge" id="ic-dept-count">0 departments</span></div><div class="panel-body"><div id="ic-departments" class="ic-department-grid"><div class="muted">Loading departments…</div></div></div></section>
<div class="id-directory">
  <section class="panel"><div class="panel-head"><h3>Card Directory</h3><span class="badge" id="ic-count">0</span></div><div class="panel-body">
    <input id="ic-search" type="search" placeholder="Search name, ID, department or email…" style="width:100%;padding:.65rem .75rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:.8rem;" />
    <div class="id-list" id="ic-list"><div class="muted">Loading ID cards…</div></div>
  </div></section>
  <aside class="id-preview"><div style="font-weight:800;color:#0f172a;margin-bottom:.8rem;">Selected ID Card</div><div id="ic-preview"><div style="padding:3rem 1rem;text-align:center;color:#64748b;">Select a person to preview their card.</div></div><div style="display:flex;gap:.5rem;justify-content:center;margin-top:.8rem;"><button class="btn btn-primary btn-sm" id="ic-print" disabled>Print Card</button></div></aside>
</div>
<script>
(function(){
'use strict';
const core=window.FPU_PORTAL||{},$=id=>document.getElementById(id),esc=s=>core.escapeHtml?core.escapeHtml(s):String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const portalFetch=core.portalFetch||(async(url,options={})=>{const token=localStorage.getItem('fpu_admin_token')||localStorage.getItem('portal_token');const response=await fetch(url,{...options,headers:{...(options.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}});const payload=await response.json().catch(()=>({message:'Invalid server response'}));if(!response.ok)throw new Error(payload.message||payload.error||('Request failed ('+response.status+')'));return payload;});
let ALL=[],FILTER='all',DEPARTMENT='',SELECTED=null;
const roles={student:'Student',lecturer:'Lecturer',hod:'Head of Department',bursar:'Bursar',registrar:'Registrar',rector:'Rector',librarian:'Librarian',exam_officer:'Examination Officer',academic_officer:'Academic Officer',admission_officer:'Admission Officer',admin:'Administrator'};
const fullName=r=>[r.firstName,r.middleName,r.lastName].filter(Boolean).join(' ');
const category=r=>r==='student'?'student':r==='lecturer'?'lecturer':r==='hod'?'hod':'staff';
function renderDepartments(){
 const students=ALL.filter(r=>r.role==='student'),map=new Map();
 students.forEach(r=>{const id=String(r.departmentId||'unassigned'),name=r.departmentName||'Unassigned department';if(!map.has(id))map.set(id,{id,name,count:0});map.get(id).count++});
 const depts=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
 $('ic-dept-count').textContent=depts.length+' departments';
 $('ic-departments').innerHTML=depts.length?depts.map(d=>'<button type="button" class="ic-dept-card '+(DEPARTMENT===d.id?'active':'')+'" data-dept="'+esc(d.id)+'"><span class="ic-dept-mark">🏛</span><span><strong>'+esc(d.name)+'</strong><small>'+d.count+' student'+(d.count===1?'':'s')+' · View students →</small></span></button>').join(''):'<div class="muted">No student department records found.</div>';
 $('ic-departments').querySelectorAll('[data-dept]').forEach(b=>b.addEventListener('click',()=>{DEPARTMENT=DEPARTMENT===b.dataset.dept?'':b.dataset.dept;FILTER='student';$('ic-tabs').querySelectorAll('.id-tab').forEach(x=>x.classList.toggle('active',x.dataset.role===FILTER));$('ic-search').value='';renderDepartments();render()}));
}
function render(){
 const q=$('ic-search').value.trim().toLowerCase();
 const rows=ALL.filter(r=>(FILTER==='all'||category(r.role)===FILTER)&&(!DEPARTMENT||String(r.departmentId||'unassigned')===DEPARTMENT)&&[fullName(r),r.matricNumber,r.staffNumber,r.email,r.departmentName,r.schoolName,r.programmeName,r.level,r.role].join(' ').toLowerCase().includes(q));
 $('ic-count').textContent=rows.length+' people';
 $('ic-list').innerHTML=rows.length?rows.map(r=>'<button class="id-person '+(SELECTED&&SELECTED.id===r.id?'active':'')+'" data-id="'+r.id+'"><img class="id-avatar" src="'+esc(r.photoUrl||r.profilePhotoUrl||'')+'" onerror="this.style.display=\'none\'" alt="" /><span style="min-width:0;flex:1"><strong style="display:block;color:#0f172a">'+esc(fullName(r))+'</strong><small style="color:#64748b">'+esc(roles[r.role]||r.role)+' · '+esc(r.matricNumber||r.staffNumber||('FPU/'+String(r.id).padStart(5,'0')))+' · '+esc(r.departmentName||'No department')+'</small></span><span style="color:#64748b">›</span></button>').join(''):'<div class="muted" style="padding:1.5rem;text-align:center">No ID cards found. Select another department or category.</div>';
 $('ic-list').querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{SELECTED=ALL.find(x=>String(x.id)===el.dataset.id)||null;render();renderPreview()}));
}
function renderPreview(){
 const r=SELECTED;
 if(!r){$('ic-preview').innerHTML='<div style="padding:3rem 1rem;text-align:center;color:#64748b">Select a person to preview their card.</div>';$('ic-print').disabled=true;return}
 const student=r.role==='student',name=fullName(r)||'—',identity=student?(r.matricNumber||'—'):(r.staffNumber||'FPU/'+String(r.role).toUpperCase()+'/'+String(r.id).padStart(5,'0'));
 const photo=r.photoUrl||r.profilePhotoUrl||'',ownSignature=r.signatureUrl||'',dept=r.departmentName||'Not assigned',registrySignature=r.registrySignatureUrl||'';
 const verifyData=student?(window.location.origin+'/verify.html?id='+encodeURIComponent(r.matricNumber||'')):['FEDERAL POLYTECHNIC UGEP','STAFF ID VERIFICATION','Name: '+name,'Staff Number: '+identity,'Role: '+(r.rank||roles[r.role]||r.role),'Department: '+dept].join(' | ');
 const qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(verifyData)+'&color=065f46&bgcolor=ffffff&margin=1';
 const photoMarkup=photo?'<img class="id-card-photo" src="'+esc(photo)+'" alt="User photograph" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'"><div class="id-photo-placeholder" style="display:none">'+esc(name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())+'</div>':'<div class="id-photo-placeholder">'+esc(name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())+'</div>';
 const logo='<img src="/images/logo.png" alt="FPU logo" onerror="this.style.display=\'none\'">';
 let front='',back='';
 if(student){
   front='<div class="id-card-preview student-card"><div class="id-card-top">'+logo+'<div><div style="font-size:13px;font-weight:900;letter-spacing:.5px">FEDERAL POLYTECHNIC UGEP</div><div style="font-size:8px;color:#fef08a;letter-spacing:1px;font-weight:700">CROSS RIVER STATE</div></div></div><div class="id-gold-stripe"></div><div class="id-student-body">'+photoMarkup+'<div class="id-card-info"><small>Student Name</small><strong>'+esc(name)+'</strong><small>Matric Number</small><strong class="id-number">'+esc(identity)+'</strong><div class="id-student-pair"><div><small>Level</small><strong>'+esc(r.level||'—')+'</strong></div><div><small>Session</small><strong>'+esc(r.sessionName||'—')+'</strong></div></div><small>Programme</small><strong>'+esc(r.programmeName||'—')+'</strong><small>Department</small><strong>'+esc(dept)+'</strong></div><div class="id-qr-column"><img src="'+qr+'" alt="Scan to verify"><small>SCAN TO<br>VERIFY</small></div></div><div class="id-card-bottom"><span>OFFICIAL STUDENT ID</span><span>FEDPOLYUGEB</span></div></div>';
   back='<div class="id-card-back student-back"><div class="id-back-top">'+logo+'<img src="'+qr+'" alt="Student verification QR"><div><strong>FEDERAL POLYTECHNIC, UGEP</strong><small>Cross River State</small></div></div><div class="id-back-copy">The person whose photograph appears overleaf is a Student of the above Mentioned<br><strong>FEDERAL POLYTECHNIC, UGEP</strong></div><p>If found, please return to the nearest police station OR contact the institution.<br>Email: <strong>contact@fedpolyugep.edu.ng</strong></p><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px"><div style="width:45%;text-align:center;border-top:1px solid #0f172a;padding-top:3px;font:700 7px Arial">Student Signature</div><div style="width:50%;text-align:center;font:700 7px Arial">'+(registrySignature?'<img src="'+esc(registrySignature)+'" alt="Registrar signature" style="display:block;max-width:105px;max-height:26px;object-fit:contain;margin:0 auto 2px">':'')+'<div style="border-top:1px solid #0f172a;padding-top:3px">Authorised Registry · Registrar</div></div></div></div>';
 }else{
   const role=(roles[r.role]||r.role||'STAFF').toUpperCase();
   front='<div class="id-card-preview staff-card"><div class="staff-card-head">'+logo+'<div><strong>FEDERAL POLYTECHNIC UGEP</strong><small>'+esc(role)+' IDENTIFICATION CARD</small></div></div><div class="id-gold-stripe"></div><div class="staff-card-body">'+photoMarkup+'<div class="staff-fields"><div><small>Full name</small><strong>'+esc(name)+'</strong></div><div><small>Staff number</small><strong>'+esc(identity)+'</strong></div><div><small>Designation / Rank</small><strong>'+esc(r.rank||roles[r.role]||r.role)+'</strong></div><div><small>Department</small><strong>'+esc(dept)+'</strong></div><div><small>School</small><strong>'+esc(r.schoolName||'—')+'</strong></div><div><small>Qualification</small><strong>'+esc(r.qualification||'—')+'</strong></div><div><small>Specialization</small><strong>'+esc(r.specialization||'—')+'</strong></div><div><small>Email</small><strong>'+esc(r.email||'—')+'</strong></div><div><small>Phone</small><strong>'+esc(r.phone||'—')+'</strong></div></div><img class="staff-qr" src="'+qr+'" alt="Staff verification QR"></div><div class="id-card-bottom"><span>OFFICIAL STAFF IDENTIFICATION</span><span>FEDPOLYUGEB</span></div>'+(r.role==='registrar'&&ownSignature?'<div style="position:absolute;right:12px;bottom:24px;text-align:center;font:700 6px Arial"><img src="'+esc(ownSignature)+'" alt="Registrar signature" style="display:block;max-width:75px;max-height:18px;object-fit:contain;margin:0 auto 1px">Registrar</div>':'')+'</div>';
   back='<div class="id-card-back staff-back"><div class="id-back-top"><div><strong>FEDERAL POLYTECHNIC UGEP · STAFF IDENTIFICATION</strong><small>Cross River State, Nigeria</small></div><img src="'+qr+'" alt="Staff verification QR"></div><p>This card remains the property of Federal Polytechnic Ugep and is issued only to the staff member whose photograph and particulars appear on the front.</p><p>Department: <strong>'+esc(dept)+'</strong><br>Institution: Federal Polytechnic Ugep, Ugep, Cross River State, Nigeria.</p><div class="id-back-copy">If found, kindly return this card to the Registry, Federal Polytechnic Ugep.</div><div class="id-registry-sign">'+(registrySignature?'<img src="'+esc(registrySignature)+'" alt="Registrar signature" style="display:block;max-width:115px;max-height:30px;object-fit:contain;margin:0 0 3px auto">':'')+'<div style="border-top:1px solid #0f172a;padding-top:3px">Authorised Registry · Registrar</div></div></div></div>';
 }
 $('ic-preview').innerHTML=front+back+'<div class="id-card-status">Status: '+(r.isActive?'Active':'Inactive')+' · '+esc(r.schoolName||'Federal Polytechnic Ugep')+'</div>';
 $('ic-print').disabled=false;
}
$('ic-tabs').querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{FILTER=b.dataset.role;DEPARTMENT='';$('ic-tabs').querySelectorAll('.id-tab').forEach(x=>x.classList.toggle('active',x===b));renderDepartments();render()}));
$('ic-search').addEventListener('input',render);
$('ic-print').addEventListener('click',()=>{if(!SELECTED)return;const front=$('ic-preview').querySelector('.id-card-preview'),back=$('ic-preview').querySelector('.id-card-back');if(!front||!back)return;const w=window.open('','_blank','width=900,height=900');if(!w)return;const css=Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');w.document.write('<!doctype html><html><head><title>Federal Polytechnic Ugep ID Card</title><style>'+css+' @page{size:A4 portrait;margin:12mm}body{font-family:Arial,sans-serif;margin:0;color:#0f172a}.print-side{width:500px;height:316px;margin:8mm auto;page-break-after:always;break-after:page;display:flex;align-items:stretch}.print-side:last-child{page-break-after:auto;break-after:auto}.id-card-preview,.id-card-back{width:500px!important;height:316px!important;max-width:none!important;aspect-ratio:auto!important;box-sizing:border-box!important;margin:0!important;box-shadow:none!important}.id-card-preview{display:flex!important;flex-direction:column!important}.id-card-back{display:block!important;overflow:hidden!important}.id-card-status{display:none!important}@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}</style></head><body><div class="print-side">'+front.outerHTML+'</div><div class="print-side">'+back.outerHTML+'</div><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()});
async function load(){try{const s=await portalFetch('/api/admin/id-cards');ALL=s.data||[];renderDepartments();render();if(ALL.length){SELECTED=ALL.find(x=>x.role==='student')||ALL[0];render();renderPreview()}}catch(e){$('ic-list').innerHTML='<div style="color:#b91c1c">Could not load ID cards: '+esc(e.message)+'</div>'}}
load();
})();
</script>
