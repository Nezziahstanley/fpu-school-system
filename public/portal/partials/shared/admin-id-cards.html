<!-- Institutional ID Card Directory -->
<section class="greeting"><div class="who"><div class="avatar">🪪</div><div><h1>Institutional ID Cards</h1><div class="sub">Browse and preview student and staff identity cards</div></div></div></section>
<style>
.id-directory{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,.85fr);gap:1rem;align-items:start}
.id-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.id-tab{border:1px solid #dbe4dc;background:#fff;color:#334155;padding:.55rem .8rem;border-radius:8px;font-weight:700;cursor:pointer}
.id-tab.active{background:#065f46;border-color:#065f46;color:#fff}
.id-list{display:grid;gap:.55rem}
.id-person{display:flex;align-items:center;gap:.75rem;padding:.75rem;border:1px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer;text-align:left;width:100%}
.id-person.active{border-color:#059669;background:#f0fdf4}
.id-avatar{width:42px;height:42px;border-radius:9px;background:#e2e8f0;object-fit:cover;display:grid;place-items:center;font-weight:800;color:#065f46;flex:none}
.id-preview{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:14px;padding:1rem;position:sticky;top:1rem}
.id-card-preview{width:100%;max-width:440px;aspect-ratio:1.58/1;margin:auto;background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 15px 35px #0f172a22;border:1px solid #d1d5db;display:flex;flex-direction:column}
.id-card-top{background:linear-gradient(120deg,#064e3b,#059669);color:#fff;padding:12px 15px;display:flex;align-items:center;gap:10px}
.id-card-top img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.id-card-content{padding:14px;display:flex;gap:12px;flex:1;min-height:0}
.id-card-photo{width:88px;height:108px;object-fit:cover;border:2px solid #065f46;border-radius:6px;background:#f1f5f9;flex:none}
.id-card-info{min-width:0;flex:1}
.id-card-info small{display:block;color:#64748b;font-size:8px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;margin-top:5px}
.id-card-info strong{display:block;color:#0f172a;font-size:11px;overflow-wrap:anywhere}
.id-card-bottom{background:#064e3b;color:#fef3c7;padding:6px 13px;display:flex;justify-content:space-between;font-size:8px;font-weight:800;letter-spacing:.7px}
@media(max-width:900px){.id-directory{grid-template-columns:1fr}.id-preview{position:static}}
.ic-department-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.7rem}
.ic-dept-card{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.85rem;border:1px solid #e2e8f0;border-radius:12px;background:#fff;cursor:pointer;min-width:0}
.ic-dept-card:hover,.ic-dept-card.active{border-color:#059669;background:#f0fdf4}
.ic-dept-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#dcfce7;color:#065f46;font-weight:900;flex:none}
.ic-dept-card strong{display:block;color:#0f172a;font-size:.8rem}
.ic-dept-card small{display:block;color:#64748b;font-size:.7rem;margin-top:2px}
.id-card-preview.student-card{position:relative}
.id-card-preview.student-card:after{content:"";position:absolute;inset:0;background:url('/images/logo.png') center/55% no-repeat;opacity:.045;pointer-events:none}
.id-card-preview.student-card>*{position:relative;z-index:1}
.id-card-back{width:100%;max-width:440px;aspect-ratio:1.58/1;margin:1rem auto;background:linear-gradient(145deg,#fff,#f0fdf4);border:5px double #065f46;border-radius:15px;box-sizing:border-box;padding:20px;font:12px/1.65 Georgia,serif;color:#334155;position:relative}
.id-card-back:after{content:"";position:absolute;inset:0;background:url('/images/logo.png') center/45% no-repeat;opacity:.035;pointer-events:none}
@media(max-width:600px){.ic-department-grid{grid-template-columns:1fr 1fr}.id-card-info strong{font-size:9px}.id-card-photo{width:70px;height:92px}}
</style>
<div class="id-tabs" id="ic-tabs">
  <button class="id-tab active" data-role="all">All Cards</button>
  <button class="id-tab" data-role="student">Students</button>
  <button class="id-tab" data-role="lecturer">Lecturers</button>
  <button class="id-tab" data-role="hod">HODs</button>
  <button class="id-tab" data-role="staff">Other Staff</button>
</div>
<section class="panel" style="margin-bottom:1rem"><div class="panel-head"><h3>Students by Department</h3><span class="badge" id="ic-dept-count">0 departments</span></div><div class="panel-body"><div id="ic-departments" class="ic-department-grid"><div class="muted">Loading departments…</div></div></div></section>
<div class="id-directory">
  <section class="panel"><div class="panel-head"><h3>Card Directory</h3><span class="badge" id="ic-count">0</span></div><div class="panel-body">
    <input id="ic-search" type="search" placeholder="Search name, ID, department or email…" style="width:100%;padding:.65rem .75rem;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:.8rem;" />
    <div class="id-list" id="ic-list"><div class="muted">Loading ID cards…</div></div>
  </div></section>
  <aside class="id-preview"><div style="font-weight:800;color:#0f172a;margin-bottom:.8rem;">Selected ID Card</div><div id="ic-preview"><div style="padding:3rem 1rem;text-align:center;color:#64748b;">Select a person to preview their card.</div></div><div style="display:flex;gap:.5rem;justify-content:center;margin-top:.8rem;"><button class="btn btn-primary btn-sm" id="ic-print" disabled>Print Card</button></div></aside>
</div>
<script>
(function(){
'use strict';
const core=window.FPU_PORTAL||{},$=id=>document.getElementById(id),esc=s=>core.escapeHtml?core.escapeHtml(s):String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ALL=[],FILTER='all',DEPARTMENT='',SELECTED=null;
const roles={student:'Student',lecturer:'Lecturer',hod:'Head of Department',bursar:'Bursar',registrar:'Registrar',rector:'Rector',librarian:'Librarian',exam_officer:'Examination Officer',academic_officer:'Academic Officer',admission_officer:'Admission Officer',admin:'Administrator'};
const fullName=r=>[r.firstName,r.middleName,r.lastName].filter(Boolean).join(' ');
const category=r=>r==='student'?'student':r==='lecturer'?'lecturer':r==='hod'?'hod':'staff';
function renderDepartments(){
 const students=ALL.filter(r=>r.role==='student'),map=new Map();
 students.forEach(r=>{const id=String(r.departmentId||'unassigned'),name=r.departmentName||'Unassigned department';if(!map.has(id))map.set(id,{id,name,count:0});map.get(id).count++});
 const depts=[...map.values()].sort((a,b)=>a.name.localeCompare(b.name));
 $('ic-dept-count').textContent=depts.length+' departments';
 $('ic-departments').innerHTML=depts.length?depts.map(d=>'<button type="button" class="ic-dept-card '+(DEPARTMENT===d.id?'active':'')+'" data-dept="'+esc(d.id)+'"><span class="ic-dept-mark">🏛</span><span><strong>'+esc(d.name)+'</strong><small>'+d.count+' student'+(d.count===1?'':'s')+' · View students →</small></span></button>').join(''):'<div class="muted">No student department records found.</div>';
 $('ic-departments').querySelectorAll('[data-dept]').forEach(b=>b.addEventListener('click',()=>{DEPARTMENT=DEPARTMENT===b.dataset.dept?'':b.dataset.dept;FILTER='student';$('ic-tabs').querySelectorAll('.id-tab').forEach(x=>x.classList.toggle('active',x.dataset.role===FILTER));$('ic-search').value='';renderDepartments();render()}));
}
function render(){
 const q=$('ic-search').value.trim().toLowerCase();
 const rows=ALL.filter(r=>(FILTER==='all'||category(r.role)===FILTER)&&(!DEPARTMENT||String(r.departmentId||'unassigned')===DEPARTMENT)&&[fullName(r),r.matricNumber,r.staffNumber,r.email,r.departmentName,r.schoolName,r.programmeName,r.level,r.role].join(' ').toLowerCase().includes(q));
 $('ic-count').textContent=rows.length+' people';
 $('ic-list').innerHTML=rows.length?rows.map(r=>'<button class="id-person '+(SELECTED&&SELECTED.id===r.id?'active':'')+'" data-id="'+r.id+'"><img class="id-avatar" src="'+esc(r.photoUrl||r.profilePhotoUrl||'')+'" onerror="this.style.display=\'none\'" alt="" /><span style="min-width:0;flex:1"><strong style="display:block;color:#0f172a">'+esc(fullName(r))+'</strong><small style="color:#64748b">'+esc(roles[r.role]||r.role)+' · '+esc(r.matricNumber||r.staffNumber||('FPU/'+String(r.id).padStart(5,'0')))+' · '+esc(r.departmentName||'No department')+'</small></span><span style="color:#64748b">›</span></button>').join(''):'<div class="muted" style="padding:1.5rem;text-align:center">No ID cards found. Select another department or category.</div>';
 $('ic-list').querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>{SELECTED=ALL.find(x=>String(x.id)===el.dataset.id)||null;render();renderPreview()}));
}
function renderPreview(){
 const r=SELECTED;if(!r){$('ic-preview').innerHTML='<div style="padding:3rem 1rem;text-align:center;color:#64748b">Select a person to preview their card.</div>';$('ic-print').disabled=true;return}
 const student=r.role==='student',name=fullName(r),identity=student?(r.matricNumber||'—'):(r.staffNumber||'FPU/'+String(r.role).toUpperCase()+'/'+String(r.id).padStart(5,'0'));
 const photo=r.photoUrl||r.profilePhotoUrl||'',dept=r.departmentName||'Not assigned';
 const qr=student&&r.matricNumber?'https://api.qrserver.com/v1/create-qr-code/?size=120x120&data='+encodeURIComponent(window.location.origin+'/verify.html?id='+r.matricNumber):'';
 const fields=student?'<small>Level</small><strong>'+esc(r.level||'—')+'</strong><small>Programme</small><strong>'+esc(r.programmeName||'—')+'</strong><small>Department</small><strong>'+esc(dept)+'</strong><small>Academic session</small><strong>'+esc(r.sessionName||'Current session')+'</strong>':'<small>Designation</small><strong>'+esc(r.rank||roles[r.role]||r.role)+'</strong><small>Qualification</small><strong>'+esc(r.qualification||'—')+'</strong><small>Specialization</small><strong>'+esc(r.specialization||'—')+'</strong><small>Department</small><strong>'+esc(dept)+'</strong>';
 $('ic-preview').innerHTML='<div class="id-card-preview '+(student?'student-card':'')+'"><div class="id-card-top"><img src="/images/logo.png" alt="FPU"/><div><div style="font-size:10px;font-weight:900;letter-spacing:.5px">FEDERAL POLYTECHNIC UGEP</div><div style="font-size:8px;color:#fef3c7;font-weight:700">'+esc((roles[r.role]||r.role).toUpperCase())+' IDENTIFICATION CARD</div></div></div><div style="height:3px;background:linear-gradient(90deg,#fbbf24,#f59e0b,#fbbf24)"></div><div class="id-card-content"><img class="id-card-photo" src="'+esc(photo)+'" onerror="this.style.display=\'none\'" alt="Portrait"/><div class="id-card-info"><small>Full name</small><strong>'+esc(name)+'</strong><small>'+(student?'Matriculation number':'Staff number')+'</small><strong>'+esc(identity)+'</strong>'+fields+'<small>Email</small><strong>'+esc(r.email||'—')+'</strong><small>Phone</small><strong>'+esc(r.phone||'—')+'</strong></div>'+(qr?'<img src="'+esc(qr)+'" alt="Verification QR" style="width:48px;height:48px;align-self:flex-end">':'')+'</div><div class="id-card-bottom"><span>OFFICIAL '+(student?'STUDENT':'STAFF')+' ID</span><span>'+esc(identity)+'</span></div></div><div class="id-card-back"><div style="font-weight:900;color:#065f46;text-align:center;border-bottom:1px solid #bbf7d0;padding-bottom:8px">FEDERAL POLYTECHNIC UGEP · '+(student?'STUDENT':'STAFF')+' IDENTIFICATION</div><p>This card remains the property of Federal Polytechnic Ugep and is issued only to the person whose photograph and particulars appear on the front.</p><p>Department: <strong>'+esc(dept)+'</strong><br>Institution: Federal Polytechnic Ugep, Ugep, Cross River State, Nigeria.</p><div style="text-align:center;font-size:9px;color:#64748b;margin-top:12px">If found, kindly return to the Registry, Federal Polytechnic Ugep.</div><div style="text-align:right;border-top:1px solid #0f172a;width:150px;margin:22px 0 0 auto;padding-top:4px;font-size:9px;font-weight:800">Authorised Registry</div></div><div style="font-size:11px;color:#64748b;text-align:center;margin-top:8px">Status: '+(r.isActive?'Active':'Inactive')+' · '+esc(r.schoolName||'Federal Polytechnic Ugep')+'</div>';
 $('ic-print').disabled=false;
}
$('ic-tabs').querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{FILTER=b.dataset.role;DEPARTMENT='';$('ic-tabs').querySelectorAll('.id-tab').forEach(x=>x.classList.toggle('active',x===b));renderDepartments();render()}));
$('ic-search').addEventListener('input',render);
$('ic-print').addEventListener('click',()=>{if(!SELECTED)return;const front=$('ic-preview').querySelector('.id-card-preview'),back=$('ic-preview').querySelector('.id-card-back');if(!front||!back)return;const w=window.open('','_blank','width=800,height=900');if(!w)return;w.document.write('<!doctype html><html><head><title>Federal Polytechnic Ugep ID Card</title><style>@page{size:A4;margin:15mm}body{font-family:Arial,sans-serif;margin:0;color:#0f172a}.side{width:440px;height:290px;margin:22px auto;page-break-after:always;break-after:page}.id-card-preview{width:440px;height:290px;box-sizing:border-box;border:1px solid #ddd;border-radius:15px;overflow:hidden;position:relative;display:flex;flex-direction:column}.id-card-preview:after{content:"";position:absolute;inset:0;background:url(/images/logo.png) center/55% no-repeat;opacity:.045;pointer-events:none}.id-card-top{background:linear-gradient(120deg,#064e3b,#059669);color:white;padding:12px 15px;display:flex;gap:10px;align-items:center}.id-card-top img{width:42px;height:42px;object-fit:contain;background:white;border-radius:50%;padding:3px}.id-card-content{padding:10px 14px;display:flex;gap:10px;flex:1;min-height:0}.id-card-photo{width:76px;height:96px;object-fit:cover;border:2px solid #065f46;border-radius:6px}.id-card-info{flex:1;min-width:0}.id-card-info small{display:block;font-size:7px;color:#64748b;font-weight:800;text-transform:uppercase;margin-top:3px}.id-card-info strong{display:block;font-size:9px;line-height:1.15}.id-card-bottom{background:#064e3b;color:#fef3c7;padding:6px 13px;display:flex;justify-content:space-between;font-size:8px;font-weight:800}.id-card-back{box-sizing:border-box;width:440px;height:290px;border:5px double #065f46;border-radius:15px;padding:20px;background:linear-gradient(145deg,#fff,#f0fdf4);font:12px/1.65 Georgia,serif;position:relative}.id-card-back:after{content:"";position:absolute;inset:0;background:url(/images/logo.png) center/45% no-repeat;opacity:.035;pointer-events:none}</style></head><body><div class="side">'+front.outerHTML+'</div><div class="side">'+back.outerHTML+'</div><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()});
async function load(){try{const s=await core.portalFetch('/api/admin/id-cards');ALL=s.data||[];renderDepartments();render();if(ALL.length){SELECTED=ALL.find(x=>x.role==='student')||ALL[0];render();renderPreview()}}catch(e){$('ic-list').innerHTML='<div style="color:#b91c1c">Could not load ID cards: '+esc(e.message)+'</div>'}}
load();
})();
</script>
