<!-- Portal → Shared → Programmes (department-first) -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Programmes</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Browse academic programmes by department</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <input type="search" id="pr-search" placeholder="🔍  Search programme…"
             style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;min-width:200px;" />
      <select id="pr-level" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
        <option value="">All Levels</option>
        <option value="ND">ND</option>
        <option value="HND">HND</option>
        <option value="CERT">Certificate</option>
      </select>
      <button id="pr-refresh" style="
        padding:.55rem .9rem;font-size:.82rem;font-weight:700;
        background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
      ">↻ Refresh</button>
    </div>
  </div>

  <!-- SUMMARY STRIP -->
  <div id="pr-summary" style="
    background:#fff;border:1px solid #e5e7eb;border-radius:12px;
    padding:.75rem 1rem;margin-bottom:1rem;
    display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
    font-size:.82rem;color:#475569;
  ">
    <div><strong style="color:#0f172a;" id="pr-total-depts">—</strong> departments</div>
    <div><strong style="color:#0f172a;" id="pr-total-progs">—</strong> total programmes</div>
    <div><strong style="color:#065f46;" id="pr-total-nd">—</strong> ND</div>
    <div><strong style="color:#1e40af;" id="pr-total-hnd">—</strong> HND</div>
  </div>

  <!-- BACK -->
  <div id="pr-back-bar" style="display:none;margin-bottom:1rem;">
    <button id="pr-back" style="
      display:inline-flex;align-items:center;gap:.4rem;
      padding:.5rem .9rem;font-size:.82rem;font-weight:700;
      background:#fff;color:#065f46;border:1px solid #bbf7d0;
      border-radius:8px;cursor:pointer;
    ">← All Departments</button>
    <span id="pr-current-dept" style="
      margin-left:.75rem;font-size:.85rem;font-weight:800;color:#0f172a;
    "></span>
  </div>

  <!-- DEPARTMENT GRID -->
  <div id="pr-dept-grid" style="
    display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:.75rem;
  "></div>

  <!-- PROGRAMMES OF PICKED DEPARTMENT -->
  <div id="pr-progs-panel" style="display:none;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Code</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Programme</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Duration</th>
            </tr>
          </thead>
          <tbody id="pr-progs-tbody">
            <tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<style>
  @keyframes prSpin { to { transform: rotate(360deg); } }
  .pr-dept-card {
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:1rem 1.1rem;
    cursor:pointer;
    transition:all .15s;
    display:flex;align-items:center;gap:.85rem;
  }
  .pr-dept-card:hover {
    border-color:#065f46;
    box-shadow:0 6px 18px rgba(6,95,70,.10);
    transform:translateY(-2px);
  }
  .pr-dept-icon {
    width:46px;height:46px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:.72rem;flex-shrink:0;
    letter-spacing:.03em;
  }
  .pr-dept-body { min-width:0;flex:1; }
  .pr-dept-name {
    font-weight:800;color:#0f172a;font-size:.9rem;line-height:1.2;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .pr-dept-count {
    font-size:.72rem;color:#64748b;margin-top:.25rem;font-weight:600;
  }
  .pr-dept-arrow { color:#94a3b8;font-size:1.2rem;flex-shrink:0; }

  #pr-progs-tbody tr { transition: background .1s; }
  #pr-progs-tbody tr:hover { background: #f8fafc; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let DEPARTMENTS = [];
  let PROGRAMMES = [];
  let SELECTED_DEPT = null;

  const PALETTE = [
    { bg: '#065f46' }, { bg: '#0891b2' }, { bg: '#7c3aed' }, { bg: '#dc2626' },
    { bg: '#ea580c' }, { bg: '#0d9488' }, { bg: '#db2777' }, { bg: '#4f46e5' },
    { bg: '#059669' }, { bg: '#d97706' }, { bg: '#0369a1' }, { bg: '#9333ea' },
  ];
  function pickColor(i) { return PALETTE[i % PALETTE.length].bg; }
  function initials(name) {
    return String(name || '')
      .split(/\s+/).filter(Boolean).slice(0, 2)
      .map((w) => w[0].toUpperCase())
      .join('').slice(0, 3);
  }

  // ============================================================
  // LOAD — everything from the single lookups endpoint
  // ============================================================
  async function load() {
    const grid = $('pr-dept-grid');
    grid.innerHTML = `
      <div style="grid-column:1/-1;text-align:center;padding:3rem;color:#94a3b8;font-size:.82rem;">
        <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:prSpin .8s linear infinite;"></div>
        <div style="margin-top:.65rem;">Loading programmes…</div>
      </div>`;

    try {
      const res = await core.portalFetch('/api/exam-officer/lookups');

      DEPARTMENTS = Array.isArray(res.departments) ? res.departments : [];
      // Programmes live in `programmes` on the lookups response
      PROGRAMMES = Array.isArray(res.programmes)
        ? res.programmes
        : Array.isArray(res.data) ? res.data : [];

      // Count programmes per department + level totals
      const counts = {};
      let nd = 0, hnd = 0;
      PROGRAMMES.forEach((p) => {
        const d = p.departmentId;
        if (d) counts[d] = (counts[d] || 0) + 1;
        if (p.level === 'ND') nd++;
        else if (p.level === 'HND') hnd++;
      });

      $('pr-total-depts').textContent = DEPARTMENTS.length;
      $('pr-total-progs').textContent = PROGRAMMES.length;
      $('pr-total-nd').textContent = nd;
      $('pr-total-hnd').textContent = hnd;

      renderDepartmentGrid(counts);
    } catch (err) {
      grid.innerHTML = `
        <div style="grid-column:1/-1;padding:1rem;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#991b1b;font-size:.85rem;">
          ⚠️ ${esc(err.message)}
        </div>`;
    }
  }

  // ============================================================
  // DEPARTMENT GRID
  // ============================================================
  function renderDepartmentGrid(counts) {
    const grid = $('pr-dept-grid');
    const query = ($('pr-search')?.value || '').trim().toLowerCase();
    const levelFilter = $('pr-level')?.value || '';

    // Only show departments that have programmes
    const withProgrammes = DEPARTMENTS.filter((d) => (counts[d.id] || 0) > 0);
    let filtered = withProgrammes;

    if (query) {
      const matchedDeptIds = new Set();
      PROGRAMMES.forEach((p) => {
        const hay = `${p.code || ''} ${p.name || ''}`.toLowerCase();
        if (hay.includes(query) && p.departmentId) matchedDeptIds.add(p.departmentId);
      });
      filtered = filtered.filter((d) =>
        `${d.code || ''} ${d.name || ''}`.toLowerCase().includes(query) ||
        matchedDeptIds.has(d.id)
      );
    }

    if (levelFilter) {
      const deptWithLevel = new Set(
        PROGRAMMES.filter((p) => p.level === levelFilter).map((p) => p.departmentId)
      );
      filtered = filtered.filter((d) => deptWithLevel.has(d.id));
    }

    const sorted = [...filtered].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    if (!sorted.length) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:#94a3b8;font-size:.82rem;">No departments match your search.</div>`;
      return;
    }

    grid.innerHTML = sorted.map((d, i) => {
      const count = counts[d.id] || 0;
      return `
        <div class="pr-dept-card" data-dept-id="${d.id}">
          <div class="pr-dept-icon" style="background:${pickColor(i)};">${esc(initials(d.name || d.code))}</div>
          <div class="pr-dept-body">
            <div class="pr-dept-name" title="${esc(d.name)}">${esc(d.name || '—')}</div>
            <div class="pr-dept-count">${esc(d.code || '')} · ${count} programme${count === 1 ? '' : 's'}</div>
          </div>
          <div class="pr-dept-arrow">›</div>
        </div>`;
    }).join('');

    grid.querySelectorAll('.pr-dept-card').forEach((card) => {
      card.addEventListener('click', () => {
        const deptId = Number(card.dataset.deptId);
        const dept = DEPARTMENTS.find((d) => d.id === deptId);
        if (dept) selectDepartment(dept);
      });
    });
  }

  function selectDepartment(dept) {
    SELECTED_DEPT = dept;
    $('pr-dept-grid').style.display = 'none';
    $('pr-progs-panel').style.display = 'block';
    $('pr-back-bar').style.display = 'block';
    $('pr-current-dept').textContent = `${dept.code || ''} · ${dept.name || ''}`;
    renderProgrammes();
  }

  function renderProgrammes() {
    const tbody = $('pr-progs-tbody');
    const query = ($('pr-search')?.value || '').trim().toLowerCase();
    const levelFilter = $('pr-level')?.value || '';

    let rows = PROGRAMMES.filter((p) => Number(p.departmentId) === Number(SELECTED_DEPT.id));
    if (levelFilter) rows = rows.filter((p) => p.level === levelFilter);
    if (query) {
      rows = rows.filter((p) =>
        `${p.code || ''} ${p.name || ''}`.toLowerCase().includes(query)
      );
    }

    rows.sort((a, b) => (a.code || '').localeCompare(b.code || ''));

    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;font-size:.82rem;">No programmes match.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map((p) => `
      <tr style="border-bottom:1px solid #f1f5f9;">
        <td style="padding:.65rem .75rem;">
          <code style="font-size:.75rem;font-weight:700;color:#065f46;background:#ecfdf5;padding:2px 7px;border-radius:5px;">
            ${esc(p.code || '—')}
          </code>
        </td>
        <td style="padding:.65rem .75rem;color:#0f172a;font-weight:600;">${esc(p.name || '—')}</td>
        <td style="padding:.65rem .75rem;text-align:center;">
          <span style="
            display:inline-block;padding:2px 9px;font-size:.68rem;font-weight:800;border-radius:5px;
            ${p.level === 'HND' ? 'background:#dbeafe;color:#1e40af;' : 'background:#d1fae5;color:#065f46;'}
          ">${esc(p.level || '—')}</span>
        </td>
        <td style="padding:.65rem .75rem;text-align:center;color:#475569;font-size:.78rem;">
          ${p.durationYears ? esc(p.durationYears) + ' year' + (p.durationYears > 1 ? 's' : '') : '—'}
        </td>
      </tr>`).join('');
  }

  function backToDepartments() {
    SELECTED_DEPT = null;
    $('pr-dept-grid').style.display = 'grid';
    $('pr-progs-panel').style.display = 'none';
    $('pr-back-bar').style.display = 'none';
  }

  let searchTimer;
  $('pr-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (SELECTED_DEPT) renderProgrammes();
      else {
        const counts = {};
        PROGRAMMES.forEach((p) => { if (p.departmentId) counts[p.departmentId] = (counts[p.departmentId] || 0) + 1; });
        renderDepartmentGrid(counts);
      }
    }, 200);
  });
  $('pr-level')?.addEventListener('change', () => {
    if (SELECTED_DEPT) renderProgrammes();
    else {
      const counts = {};
      PROGRAMMES.forEach((p) => { if (p.departmentId) counts[p.departmentId] = (counts[p.departmentId] || 0) + 1; });
      renderDepartmentGrid(counts);
    }
  });

  $('pr-back')?.addEventListener('click', backToDepartments);
  $('pr-refresh')?.addEventListener('click', () => {
    backToDepartments();
    load();
  });

  const st = document.createElement('style');
  st.textContent = '@keyframes prSpin { to { transform: rotate(360deg); } }';
  document.head.appendChild(st);

  load();
})();
</script>
