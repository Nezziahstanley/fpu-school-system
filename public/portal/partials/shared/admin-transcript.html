<!-- Shared → Transcript -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📄</div>
    <div>
      <h1>Transcript</h1>
      <div class="sub" id="tr-sub">Select a student to view their transcript</div>
    </div>
  </div>
</section>

<!-- Filter bar -->
<div class="filter-bar">
  <input type="search" id="tr-search" placeholder="Search matric no. or student name…" />
  <select id="tr-level">
    <option value="">All Levels</option>
    <option value="ND">ND</option>
    <option value="HND">HND</option>
  </select>
  <button class="btn btn-outline btn-sm" id="tr-print" disabled>🖨 Print</button>
</div>

<!-- Student list -->
<section class="panel">
  <div class="panel-head">
    <h3>Students</h3>
    <span class="badge" id="tr-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Matric No.</th>
            <th>Full Name</th>
            <th>Level</th>
            <th>Programme</th>
            <th>CGPA</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tr-tbody">
          <tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Transcript view -->
<section class="panel" id="tr-result-panel" style="display:none;">
  <div class="panel-head">
    <h3 id="tr-result-title">Transcript</h3>
    <button class="btn btn-outline btn-sm" id="tr-close">Close</button>
  </div>
  <div class="panel-body" id="tr-result-body">
    <div class="loading"><span class="spinner"></span> Loading transcript…</div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const money = (n) => core.formatMoney ? core.formatMoney(n) : String(n == null ? '' : n);

  let ALL = [];
  let FILTERED = [];

  if (user.departmentName) {
    $('tr-sub').textContent = `Select a ${user.departmentName} student to view their transcript`;
  }

  // ---------------------------------------------------------
  // Extractors — defensive against {name} vs {programmeName}
  // ---------------------------------------------------------
  function getLevel(s) {
    return String(s.level || '').toUpperCase().trim() || '—';
  }

  function getProgramme(s) {
    if (!s) return '—';
    // student list returns programme as string, programmeName, or nested
    if (typeof s.programme === 'string') return s.programme;
    if (s.programme && typeof s.programme === 'object') return s.programme.name || s.programme.code || '—';
    return s.programmeName || s.programme_name || '—';
  }

  function getCGPA(s) {
    if (s.cgpa != null) return Number(s.cgpa).toFixed(2);
    if (s.cgpaValue != null) return Number(s.cgpaValue).toFixed(2);
    return '—';
  }

  // ---------------------------------------------------------
  // Render student list
  // ---------------------------------------------------------
  function render() {
    $('tr-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('tr-tbody').innerHTML = '<tr><td colspan="6" class="empty">No students found.</td></tr>';
      return;
    }

    $('tr-tbody').innerHTML = FILTERED.map((s) => {
      const level = getLevel(s);
      const chipClass = 'chip-' + level.toLowerCase();
      return `
        <tr data-id="${s.id}" style="cursor:pointer;">
          <td><strong>${esc(s.matricNumber || '—')}</strong></td>
          <td>${esc((s.firstName || '') + ' ' + (s.lastName || ''))}</td>
          <td><span class="chip ${chipClass}">${esc(level)}</span></td>
          <td>${esc(getProgramme(s))}</td>
          <td>${getCGPA(s)}</td>
          <td><button class="btn btn-outline btn-xs">View →</button></td>
        </tr>`;
    }).join('');

    $('tr-tbody').querySelectorAll('tr[data-id]').forEach((row) => {
      row.addEventListener('click', () => loadTranscript(row.dataset.id));
    });
  }

  // ---------------------------------------------------------
  // Filter
  // ---------------------------------------------------------
  function applyFilter() {
    const q = ($('tr-search').value || '').trim().toLowerCase();
    const lvl = $('tr-level').value;

    FILTERED = ALL.filter((s) => {
      const hay = `${s.matricNumber || ''} ${s.firstName || ''} ${s.lastName || ''}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (lvl && getLevel(s) !== lvl) return false;
      return true;
    });

    render();
  }

  // ---------------------------------------------------------
  // Load student list
  // ---------------------------------------------------------
  async function loadStudents() {
    try {
      const res = await core.portalFetch('/api/students');
      const payload = res.data || res || {};
      ALL = Array.isArray(payload) ? payload : (payload.rows || payload.students || []);
      console.log('[transcript] Loaded', ALL.length, 'students');
      applyFilter();
    } catch (err) {
      console.error('[transcript]', err);
      $('tr-tbody').innerHTML = `<tr><td colspan="6" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  // ---------------------------------------------------------
  // Group flat rows into session blocks
  // Backend returns: rows = [{ course: {...}, result: {...} }]
  // Backend also returns: summary.perSession = [{ sessionId,
  //   semester, totalUnits, totalPoints, gpa }]
  // ---------------------------------------------------------
  function buildSessions(rows, perSession) {
    const map = new Map();
    (rows || []).forEach((r) => {
      const res = r.result || {};
      const crs = r.course || {};
      const key = (res.sessionId || 'x') + '|' + (res.semester || '');

      if (!map.has(key)) {
        // Look up the pre-computed per-session stats
        const stat = (perSession || []).find(
          (p) => p.sessionId === res.sessionId && p.semester === res.semester
        ) || {};
        map.set(key, {
          sessionId: res.sessionId,
          semester: res.semester || '',
          semesterLabel: String(res.semester || '').replace(/^./, (c) => c.toUpperCase()),
          sessionName: 'Session #' + (res.sessionId || '?'),
          gpa: stat.gpa != null ? Number(stat.gpa) : null,
          totalUnits: stat.totalUnits || 0,
          courses: [],
        });
      }

      const block = map.get(key);
      const units = Number(crs.unit) || 0;
      const points = Number(res.points) || 0;
      block.courses.push({
        courseCode: crs.code || '',
        courseTitle: crs.title || '',
        units: units,
        score: res.score != null ? Number(res.score) : null,
        grade: res.grade || '—',
        gradePoint: points,
      });
      // If backend didn't pre-compute perSession, roll up client-side
      if (!block.totalUnits) {
        block.totalUnits += units;
      }
    });

    return Array.from(map.values());
  }

  // ---------------------------------------------------------
  // Load one transcript
  // ---------------------------------------------------------
  async function loadTranscript(studentId) {
    const student = ALL.find((s) => String(s.id) === String(studentId));
    if (!student) {
      console.warn('[transcript] student not found in list:', studentId);
      return;
    }

    console.log('[transcript] Loading transcript for', studentId, student.firstName, student.lastName);

    $('tr-result-panel').style.display = 'block';
    $('tr-result-title').textContent =
      `Transcript — ${student.firstName || ''} ${student.lastName || ''} (${student.matricNumber || ''})`;
    $('tr-result-body').innerHTML =
      '<div class="loading"><span class="spinner"></span> Loading transcript…</div>';
    $('tr-print').disabled = false;
    $('tr-result-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });

    try {
      const res = await core.portalFetch('/api/transcript/' + studentId);
      const payload = res.data || res || {};

      // The transcript endpoint omits programme info; the list row
      // has it, so merge them (studentInfo wins on conflicts).
      const studentInfo = Object.assign({}, student, payload.student || {});
      const rows = payload.rows || [];
      const summary = payload.summary || {};
      const perSession = summary.perSession || [];

      // ---------- Header ----------
      const header = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem;">
          <div>
            <div class="muted small">Name</div>
            <strong>${esc((studentInfo.firstName||'') + ' ' + (studentInfo.lastName||''))}</strong>
          </div>
          <div>
            <div class="muted small">Matric No.</div>
            <strong>${esc(studentInfo.matricNumber || '—')}</strong>
          </div>
          <div>
            <div class="muted small">Level</div>
            <strong>${esc(studentInfo.level || '—')}</strong>
          </div>
          <div>
            <div class="muted small">Programme</div>
            <strong>${esc(getProgramme(studentInfo) || getProgramme(student) || '—')}</strong>
          </div>
        </div>`;

      // ---------- Empty state ----------
      if (!rows.length) {
        $('tr-result-body').innerHTML = header +
          '<p class="muted" style="text-align:center;padding:2rem;">No results recorded for this student yet.</p>';
        return;
      }

      // ---------- Sessions ----------
      const sessions = buildSessions(rows, perSession);

      const sessionBlocks = sessions.map((sess) => {
        const courseRows = sess.courses.map((c) => `
          <tr>
            <td><strong>${esc(c.courseCode)}</strong></td>
            <td>${esc(c.courseTitle)}</td>
            <td>${c.units}</td>
            <td>${c.score != null ? c.score.toFixed(2) : '—'}</td>
            <td><span class="chip">${esc(c.grade)}</span></td>
            <td>${c.gradePoint != null ? c.gradePoint.toFixed(1) : '—'}</td>
          </tr>`).join('');

        return `
          <div style="margin-bottom:1.5rem;">
            <div style="display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:2px solid #e5e7eb;">
              <strong>${esc(sess.sessionName)} · ${esc(sess.semesterLabel)} Semester</strong>
              <span class="muted small">
                GPA: <strong>${sess.gpa != null ? sess.gpa.toFixed(2) : '—'}</strong> ·
                Units: <strong>${sess.totalUnits}</strong>
              </span>
            </div>
            <div class="table-wrap" style="margin-top:.5rem;">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Code</th><th>Title</th><th>Units</th><th>Score</th><th>Grade</th><th>GP</th>
                  </tr>
                </thead>
                <tbody>${courseRows}</tbody>
              </table>
            </div>
          </div>`;
      }).join('');

      // ---------- Summary ----------
      const summaryHtml = `
        <div class="fees-breakdown" style="margin-top:1.5rem;border-top:2px solid #e5e7eb;padding-top:1rem;">
          <div class="fees-row"><span>Total Units Earned</span><strong>${summary.totalUnits || 0}</strong></div>
          <div class="fees-row"><span>Total Grade Points</span><strong>${summary.totalPoints || 0}</strong></div>
          <div class="fees-row"><span>Classification</span><strong>${esc(summary.classification || '—')}</strong></div>
          <div class="fees-row">
            <span><strong>CGPA</strong></span>
            <strong style="color:var(--fpu-primary);font-size:1.1rem;">
              ${summary.cgpa != null ? Number(summary.cgpa).toFixed(2) : '—'}
            </strong>
          </div>
        </div>`;

      $('tr-result-body').innerHTML = header + sessionBlocks + summaryHtml;
    } catch (err) {
      console.error('[transcript]', err);
      $('tr-result-body').innerHTML =
        `<div class="alert alert-error">Could not load transcript: ${esc(err.message)}</div>`;
    }
  }

  // ---------------------------------------------------------
  // Print
  // ---------------------------------------------------------
  $('tr-print').addEventListener('click', () => {
    const panel = $('tr-result-panel');
    const printWindow = window.open('', '', 'width=900,height=700');
    printWindow.document.write(`
      <html><head><title>Transcript</title>
      <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; color: #0f172a; }
        h1 { font-size: 1.2rem; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #e5e7eb; font-size: 12px; }
        th { background: #f3f4f6; font-weight: 600; }
        .muted { color: #64748b; }
        .chip { display: inline-block; padding: .15rem .55rem; border-radius: 999px; background: #e5e7eb; font-size: 11px; }
        .fees-row { display: flex; justify-content: space-between; padding: .35rem 0; }
      </style></head><body>
      <h1>Federal Polytechnic Ugep — Official Transcript</h1>
      ${panel.querySelector('.panel-body').innerHTML}
      <p style="margin-top:2rem;font-size:11px;color:#64748b;">
        Generated on ${new Date().toLocaleString()}
      </p>
      </body></html>`);
    printWindow.document.close();
    setTimeout(() => printWindow.print(), 300);
  });

  $('tr-close').addEventListener('click', () => {
    $('tr-result-panel').style.display = 'none';
    $('tr-print').disabled = true;
  });

  $('tr-search').addEventListener('input', applyFilter);
  $('tr-level').addEventListener('change', applyFilter);

  // ---------------------------------------------------------
  // Init
  // ---------------------------------------------------------
  async function init() {
    await loadStudents();
    const targetId = sessionStorage.getItem('transcript_student_id');
    if (targetId) {
      sessionStorage.removeItem('transcript_student_id');
      setTimeout(() => loadTranscript(targetId), 300);
    }
  }

  init();
})();
</script>
