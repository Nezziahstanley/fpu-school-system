<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  async function load() {
    const tbody = $('tr-tbody');
    tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:trSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading students…</div>
    </td></tr>`;

    try {
      const user = core.getPortalUser ? core.getPortalUser() : {};
      const isRegistrar = user.role === 'registrar';
      
      const endpoint = isRegistrar 
        ? '/api/registrar/transcripts/students' 
        : '/api/admin/students';
        
      const res = await core.portalFetch(endpoint);
      ALL = Array.isArray(res.data) ? res.data : [];
      
      applyFilters();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function applyFilters() {
    const q = ($('tr-search')?.value || '').trim().toLowerCase();
    const level = $('tr-level')?.value || '';

    FILTERED = ALL.filter(s => {
      if (level && s.level !== level) return false;
      if (q) {
        const hay = `${s.firstName || ''} ${s.lastName || ''} ${s.matricNumber || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(FILTERED);
    $('tr-count').textContent = FILTERED.length;
  }

  function renderTable(rows) {
    const tbody = $('tr-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">No students found.</td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(s => {
      const fullName = `${s.firstName || ''} ${s.lastName || ''}`.trim();
      
      // We won't show the CGPA here to keep it fast. The template calculates it.
      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(s.matricNumber || '—')}</code></td>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(fullName)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">${esc(s.level || '—')}</span>
          </td>
          <td style="padding:.65rem .75rem;font-size:.8rem;color:#475569;">${esc(s.programmeName || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#94a3b8;">—</td>
          <td style="padding:.65rem .75rem;text-align:right;">
            <button class="tr-btn tr-view-btn" data-id="${s.id}" style="background:#eff6ff;color:#1e40af;">👁 View</button>
          </td>
        </tr>`;
    }).join('');

    tbody.querySelectorAll('.tr-view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        // Open the transcript template in a new tab
        window.open(`/portal/partials/registrar/document-template.html?studentId=${id}`, '_blank');
      });
    });
  }

  // Wiring
  let searchTimer;
  $('tr-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });
  $('tr-level')?.addEventListener('change', applyFilters);

  load();
})();
</script>
