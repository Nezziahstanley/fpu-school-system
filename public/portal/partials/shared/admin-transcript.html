<!-- Portal → Shared → Transcript Viewer -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Transcript</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Select a student to view their transcript</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <input type="search" id="tr-search" placeholder="Search matric no. or student name…"
             style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;min-width:260px;" />
      <select id="tr-level" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
        <option value="">All Levels</option>
        <option value="ND">ND</option>
        <option value="HND">HND</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Students <span id="tr-count" style="display:inline-block;background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.65rem;margin-left:.35rem;">0</span>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric No.</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Full Name</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Programme</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">CGPA</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="tr-tbody">
          <tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:trSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ═══════ MODAL ═══════ -->
<div id="tr-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <!-- Modal Header -->
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <h3 id="tr-modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Transcript</h3>
      <button id="tr-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <!-- Modal Body -->
    <div id="tr-modal-body" style="padding:1.5rem;">
      <!-- Content injected here -->
    </div>
  </div>
</div>

<style>
  @keyframes trSpin { to { transform: rotate(360deg); } }
  #tr-tbody tr { transition: background .1s; }
  #tr-tbody tr:hover { background: #f8fafc; }
  .tr-btn { padding:.35rem .7rem;font-size:.72rem;font-weight:700; border-radius:6px;border:none;cursor:pointer;font-family:inherit; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];
  let CURRENT_DEPT = 'all';

  async function load() {
    const tbody = $('tr-tbody');
    tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:trSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading students…</div>
    </td></tr>`;

    try {
      const user = core.getPortalUser ? core.getPortalUser() : {};
      const role = user.role;
      
      let endpoint = '/api/admin/students';
      if (role === 'registrar') endpoint = '/api/registrar/transcripts';
      else if (role === 'rector') endpoint = '/api/rector/transcripts';
        
      const res = await core.portalFetch(endpoint);
      ALL = Array.isArray(res.data) ? res.data : [];
      
      buildDeptFilter();
      applyFilters();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function buildDeptFilter() {
    if ($('tr-filter-dept')) return;

    const headerActions = document.querySelector('#tr-search')?.parentElement;
    if (!headerActions) return;

    const deptNames = [...new Set(ALL.map(s => s.departmentName).filter(Boolean))].sort();
    
    const select = document.createElement('select');
    select.id = 'tr-filter-dept';
    select.style = "padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;";
    select.innerHTML = `<option value="all">All Departments</option>` + 
      deptNames.map(d => `<option value="${d}">${d}</option>`).join('');

    select.addEventListener('change', (e) => {
      CURRENT_DEPT = e.target.value;
      applyFilters();
    });

    headerActions.insertBefore(select, headerActions.children[1]);
  }

  function applyFilters() {
    const q = ($('tr-search')?.value || '').trim().toLowerCase();
    const level = $('tr-level')?.value || '';

    FILTERED = ALL.filter(s => {
      if (CURRENT_DEPT !== 'all' && s.departmentName !== CURRENT_DEPT) return false;
      if (level && s.level !== level) return false;
      if (q) {
        const hay = `${s.firstName || ''} ${s.lastName || ''} ${s.matricNumber || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(FILTERED);
    $('tr-count').textContent = FILTERED.length;
  }

  function renderTable(rows) {
    const tbody = $('tr-tbody');
    const thead = document.querySelector('thead');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">No students found.</td></tr>`;
      return;
    }

    thead.innerHTML = `<tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
      <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric No.</th>
      <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Full Name</th>
      <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
      <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Programme</th>
      <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">CGPA</th>
      <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
    </tr>`;

    if (CURRENT_DEPT === 'all') {
      const groups = {};
      rows.forEach(s => {
        const d = s.departmentName || 'Unassigned';
        if (!groups[d]) groups[d] = [];
        groups[d].push(s);
      });

      const sortedDepts = Object.keys(groups).sort();

      let html = '';
      sortedDepts.forEach(dept => {
        const students = groups[dept];
        const avgCgpa = (students.reduce((sum, s) => sum + (Number(s.cgpa) || 0), 0) / students.length).toFixed(2);
        
        html += `
          <tr style="background:#f0fdf4;border-top:2px solid #bbf7d0;">
            <td colspan="6" style="padding:.75rem;font-weight:800;color:#065f46;font-size:.85rem;">
              🏛️ ${esc(dept)} 
              <span style="font-weight:600;color:#059669;font-size:.75rem;margin-left:.5rem;">
                ${students.length} students · Avg CGPA: ${avgCgpa}
              </span>
            </td>
          </tr>
        `;

        students.forEach(s => {
          const fullName = `${s.firstName || ''} ${s.lastName || ''}`.trim();
          const cgpaDisplay = Number(s.cgpa).toFixed(2);
          html += `
            <tr style="border-bottom:1px solid #f1f5f9;">
              <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(s.matricNumber || '—')}</code></td>
              <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(fullName)}</td>
              <td style="padding:.65rem .75rem;text-align:center;">
                <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">${esc(s.level || '—')}</span>
              </td>
              <td style="padding:.65rem .75rem;font-size:.8rem;color:#475569;">${esc(s.programmeName || '—')}</td>
              <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${cgpaDisplay}</td>
              <td style="padding:.65rem .75rem;text-align:right;">
                <button class="tr-btn tr-view-btn" data-id="${s.id}" style="background:#eff6ff;color:#1e40af;">👁 View</button>
              </td>
            </tr>
          `;
        });
      });
      
      tbody.innerHTML = html;
      
    } else {
      tbody.innerHTML = rows.map(s => {
        const fullName = `${s.firstName || ''} ${s.lastName || ''}`.trim();
        const cgpaDisplay = s.cgpa != null ? Number(s.cgpa).toFixed(2) : '—';
        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(s.matricNumber || '—')}</code></td>
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(fullName)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">${esc(s.level || '—')}</span>
            </td>
            <td style="padding:.65rem .75rem;font-size:.8rem;color:#475569;">${esc(s.programmeName || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${cgpaDisplay}</td>
            <td style="padding:.65rem .75rem;text-align:right;">
              <button class="tr-btn tr-view-btn" data-id="${s.id}" style="background:#eff6ff;color:#1e40af;">👁 View</button>
            </td>
          </tr>`;
      }).join('');
    }

    tbody.querySelectorAll('.tr-view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        viewTranscript(btn.dataset.id);
      });
    });
  }

  async function viewTranscript(studentId) {
    const modal = $('tr-modal');
    const title = $('tr-modal-title');
    const body = $('tr-modal-body');

    modal.style.display = 'flex';
    title.textContent = 'Loading Transcript...';
    body.innerHTML = `<div style="text-align:center;padding:3rem;color:#64748b;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:trSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;">Fetching results…</div>
    </div>`;

    try {
      const user = core.getPortalUser ? core.getPortalUser() : {};
      const role = user.role;
      
      let endpoint = `/api/admin/transcript/${studentId}`;
      if (role === 'registrar') {
        endpoint = `/api/registrar/transcript/${studentId}`;
      } else if (role === 'rector') {
        // The Rector needs to fetch the transcript from a route they have access to.
        // We'll use the registrar's data endpoint but hit it through the rector path.
        endpoint = `/api/registrar/transcript/${studentId}`; 
      }

      const res = await core.portalFetch(endpoint);
      const data = res.data || res;
      
      const s = data.student || {};
      const rows = data.rows || [];
      const summary = data.summary || {};

      title.textContent = `Transcript — ${s.firstName} ${s.lastName}`;

      let tableRows = '';
      if (!rows.length) {
        tableRows = '<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">No published results found.</td></tr>';
      } else {
        tableRows = rows.map(r => `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(r.course?.code || '—')}</td>
            <td style="padding:.65rem .75rem;color:#475569;">${esc(r.course?.title || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:center;">${esc(r.course?.unit || '0')}</td>
            <td style="padding:.65rem .75rem;text-align:center;">${esc(r.result?.score || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.result?.grade || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:center;">${esc(r.result?.points || '—')}</td>
          </tr>
        `).join('');
      }

      body.innerHTML = `
        <div style="margin-bottom:1.5rem;display:flex;justify-content:space-between;">
          <div>
            <div style="font-size:.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Matric No.</div>
            <div style="font-weight:800;color:#0f172a;">${esc(s.matricNumber || '—')}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Programme</div>
            <div style="font-weight:800;color:#0f172a;">${esc(s.programmeName || '—')}</div>
          </div>
        </div>
        
        <div style="overflow-x:auto;border:1px solid #e5e7eb;border-radius:8px;">
          <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
            <thead>
              <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
                <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;color:#64748b;text-transform:uppercase;">Code</th>
                <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;color:#64748b;text-transform:uppercase;">Course Title</th>
                <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;color:#64748b;text-transform:uppercase;">Units</th>
                <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;color:#64748b;text-transform:uppercase;">Score</th>
                <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;color:#64748b;text-transform:uppercase;">Grade</th>
                <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;color:#64748b;text-transform:uppercase;">Points</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>
        </div>

        <div style="margin-top:1.5rem;display:flex;justify-content:space-between;padding-top:1rem;border-top:2px solid #065f46;">
          <div>
            <div style="font-size:.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">Total Units</div>
            <div style="font-size:1.1rem;font-weight:800;color:#0f172a;">${esc(summary.totalUnits || '0')}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:.75rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;">CGPA</div>
            <div style="font-size:1.3rem;font-weight:800;color:#065f46;">${esc(summary.cgpa || '0.00')}</div>
            <div style="font-size:.75rem;color:#64748b;margin-top:.2rem;">${esc(summary.classification || '—')}</div>
          </div>
        </div>
        
        <div style="margin-top:1.5rem;text-align:right;">
          <button onclick="window.print()" style="padding:.6rem 1rem;font-size:.85rem;font-weight:700;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">🖨 Print</button>
        </div>
      `;
      
    } catch (err) {
      body.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  // Wiring
  let searchTimer;
  $('tr-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });
  $('tr-level')?.addEventListener('change', applyFilters);
  
  $('tr-modal-close')?.addEventListener('click', () => {
    $('tr-modal').style.display = 'none';
  });
  $('tr-modal')?.addEventListener('click', (e) => {
    if (e.target.id === 'tr-modal') $('tr-modal').style.display = 'none';
  });

  load();
})();
</script>
