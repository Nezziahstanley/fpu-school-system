<!-- Portal → Shared → Transcript Viewer -->
<div style="padding: 1rem 0 0 0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Transcript</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Select a student to view their transcript</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <input type="search" id="tr-search" placeholder="Search matric no. or student name…"
             style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;min-width:260px;" />
      <select id="tr-filter-dept" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
        <option value="">All Departments</option>
      </select>
      <select id="tr-level" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
        <option value="">All Levels</option>
        <option value="ND">ND</option>
        <option value="HND">HND</option>
      </select>
    </div>
  </div>

  <!-- STATS -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #065f46;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">Total Students</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="tr-stat-total">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #10b981;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">With Results</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="tr-stat-with-results">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #f59e0b;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">Avg CGPA</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="tr-stat-avg-cgpa">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #3b82f6;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">Departments</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="tr-stat-depts">—</div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">
        Students <span id="tr-count" style="display:inline-block;background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.65rem;margin-left:.35rem;">0</span>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric No.</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Full Name</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Level</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Programme</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">CGPA</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="tr-tbody">
          <tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:trSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="tr-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:800px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    <div class="tr-modal-header" style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;z-index:10;">
      <h3 id="tr-modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Transcript</h3>
      <button id="tr-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>
    <div id="tr-modal-body" style="padding:1.5rem;"></div>
  </div>
</div>

<style>
  @keyframes trSpin { to { transform: rotate(360deg); } }
  #tr-tbody tr { transition: background .1s; }
  #tr-tbody tr:hover { background: #f8fafc; }
  .tr-btn { padding:.35rem .7rem;font-size:.72rem;font-weight:700; border-radius:6px;border:none;cursor:pointer;font-family:inherit; }

  /* ============================================================
     SCREEN STYLES (default) — the transcript preview on-screen
     ============================================================ */
  .tr-printable {
    position: relative;
    padding: 2rem;
    font-family: 'Inter', system-ui, sans-serif;
    color: #0f172a;
  }
  .tr-printable .tr-watermark {
    display: none; /* Only shown when printing */
  }
  .tr-printable .tr-content {
    position: relative;
    z-index: 1;
  }
  .tr-letterhead {
    text-align: center;
    padding-bottom: 1rem;
    margin-bottom: 1.25rem;
    border-bottom: 2px solid #065f46;
  }
  .tr-letterhead img { height: 60px; margin-bottom: .5rem; }
  .tr-letterhead h1 {
    font-size: 1.2rem;
    margin: 0;
    color: #065f46;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .tr-letterhead p {
    margin: .25rem 0 0;
    font-size: .78rem;
    color: #64748b;
  }
  .tr-title {
    text-align: center;
    font-size: 1rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: underline;
    margin: 1rem 0;
    color: #0f172a;
  }
  .tr-info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .75rem;
    margin-bottom: 1.25rem;
    font-size: .82rem;
  }
  .tr-info-grid > div > span {
    display: block;
    font-weight: 700;
    text-transform: uppercase;
    font-size: .65rem;
    color: #64748b;
    letter-spacing: .05em;
    margin-bottom: .2rem;
  }
  .tr-info-grid > div > strong {
    font-weight: 700;
    font-size: .85rem;
    color: #0f172a;
  }
  .tr-results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .82rem;
    margin-bottom: 1rem;
  }
  .tr-results-table th {
    background: #f0fdf4;
    padding: .55rem .75rem;
    border-bottom: 2px solid #065f46;
    text-align: left;
    text-transform: uppercase;
    font-size: .65rem;
    letter-spacing: .05em;
    color: #065f46;
    font-weight: 800;
  }
  .tr-results-table td {
    padding: .55rem .75rem;
    border-bottom: 1px solid #e5e7eb;
  }
  .tr-results-table td.center { text-align: center; }
  .tr-summary {
    display: flex;
    justify-content: flex-end;
    gap: 2rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 2px solid #065f46;
    font-size: .85rem;
  }
  .tr-summary .tr-cgpa-big {
    font-size: 1.5rem;
    font-weight: 800;
    color: #065f46;
  }
  .tr-footer {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid #e5e7eb;
    font-size: .72rem;
    text-align: center;
    color: #94a3b8;
  }
  .tr-signature {
    margin-top: 2rem;
    display: flex;
    justify-content: space-between;
    font-size: .78rem;
  }
  .tr-signature .tr-sign-block {
    border-top: 1px solid #0f172a;
    padding-top: .35rem;
    min-width: 160px;
    text-align: center;
  }

  /* ============================================================
     PRINT STYLES — only active when printing
     ============================================================ */
  @media print {
    /* Hide everything except the modal */
    body * { visibility: hidden !important; }
    #tr-modal,
    #tr-modal * { visibility: visible !important; }

    /* Reset the modal container for print */
    #tr-modal {
      position: static !important;
      display: block !important;
      background: transparent !important;
      inset: auto !important;
      padding: 0 !important;
      backdrop-filter: none !important;
    }
    #tr-modal > div {
      background: #fff !important;
      box-shadow: none !important;
      max-width: 100% !important;
      width: 100% !important;
      border-radius: 0 !important;
      max-height: none !important;
      overflow: visible !important;
    }
    #tr-modal-body { padding: 0 !important; }
    .tr-modal-header { display: none !important; }
    .tr-print-hide { display: none !important; }

    /* Show watermark only on print */
    .tr-printable { padding: 20mm 15mm; font-family: 'Times New Roman', serif; }
    .tr-printable .tr-watermark {
      display: block;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-20deg);
      width: 380px;
      height: 380px;
      opacity: 0.08;
      z-index: 0;
      pointer-events: none;
    }
    .tr-letterhead { border-bottom: 3px double #065f46; }
    .tr-letterhead h1 { font-size: 22px; }
    .tr-letterhead p { font-size: 12px; }
    .tr-title { font-size: 16px; letter-spacing: 3px; }
    .tr-info-grid { gap: 12px; margin-bottom: 20px; }
    .tr-info-grid > div > span { font-size: 9px; }
    .tr-info-grid > div > strong { font-size: 13px; }
    .tr-results-table { font-size: 11px; }
    .tr-results-table th {
      border: 1px solid #000;
      padding: 8px;
      background: #f0fdf4;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .tr-results-table td { border: 1px solid #333; padding: 6px 8px; }
    .tr-summary { font-size: 12px; }
    .tr-summary .tr-cgpa-big { font-size: 22px; }
    .tr-signature { font-size: 11px; }
    .tr-signature .tr-sign-block { border-top: 1px solid #000; }
    .tr-footer { border-top: 1px solid #999; color: #666; font-size: 10px; }
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];

  function getCgpaClass(cgpa) {
    if (cgpa == null) return { bg: '#f1f5f9', color: '#64748b' };
    if (cgpa >= 3.5) return { bg: '#d1fae5', color: '#065f46' };
    if (cgpa >= 3.0) return { bg: '#dbeafe', color: '#1e40af' };
    if (cgpa >= 2.5) return { bg: '#fef3c7', color: '#92400e' };
    if (cgpa >= 2.0) return { bg: '#fed7aa', color: '#9a3412' };
    return { bg: '#fee2e2', color: '#991b1b' };
  }

  async function load() {
    const tbody = $('tr-tbody');
    tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:trSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading students…</div>
    </td></tr>`;

    try {
      const res = await core.portalFetch('/api/admin/transcript/students');
      ALL = Array.isArray(res.data) ? res.data : [];

      const deptNames = [...new Set(ALL.map(s => s.departmentName).filter(Boolean))].sort();
      const deptSelect = $('tr-filter-dept');
      deptSelect.innerHTML = '<option value="">All Departments</option>' +
        deptNames.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('');

      renderStats();
      applyFilters();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function renderStats() {
    const total = ALL.length;
    const withResults = ALL.filter(s => s.hasResults === true || (s.cgpa != null && Number.isFinite(Number(s.cgpa)))).length;
    const cgpas = ALL.filter(s => s.hasResults === true || (s.cgpa != null && Number.isFinite(Number(s.cgpa)))).map(s => Number(s.cgpa));
    const avg = cgpas.length ? (cgpas.reduce((a, b) => a + b, 0) / cgpas.length) : 0;
    const depts = new Set(ALL.map(s => s.departmentName).filter(Boolean)).size;

    $('tr-stat-total').textContent = total;
    $('tr-stat-with-results').textContent = withResults;
    $('tr-stat-avg-cgpa').textContent = avg > 0 ? avg.toFixed(2) : '—';
    $('tr-stat-depts').textContent = depts;
  }

  function applyFilters() {
    const q = ($('tr-search')?.value || '').trim().toLowerCase();
    const dept = $('tr-filter-dept')?.value || '';
    const level = $('tr-level')?.value || '';

    const FILTERED = ALL.filter(s => {
      if (dept && s.departmentName !== dept) return false;
      if (level && s.level !== level) return false;
      if (q) {
        const hay = `${s.firstName || ''} ${s.lastName || ''} ${s.matricNumber || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(FILTERED);
    $('tr-count').textContent = FILTERED.length;
  }

  function renderTable(rows) {
    const tbody = $('tr-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">No students found.</td></tr>`;
      return;
    }

    const groups = {};
    rows.forEach(s => {
      const d = s.departmentName || 'Unassigned';
      if (!groups[d]) groups[d] = [];
      groups[d].push(s);
    });

    const sortedDepts = Object.keys(groups).sort();
    let html = '';

    sortedDepts.forEach(dept => {
      const students = groups[dept];
      const withResults = students.filter(s => s.hasResults === true || (s.cgpa != null && Number.isFinite(Number(s.cgpa))));
      const avgCgpa = withResults.length
        ? (withResults.reduce((sum, s) => sum + s.cgpa, 0) / withResults.length).toFixed(2)
        : '—';

      html += `
        <tr style="background:#f0fdf4;border-top:2px solid #bbf7d0;">
          <td colspan="6" style="padding:.75rem;font-weight:800;color:#065f46;font-size:.85rem;">
            🏛️ ${esc(dept)}
            <span style="font-weight:600;color:#059669;font-size:.75rem;margin-left:.5rem;">
              ${students.length} student${students.length === 1 ? '' : 's'} · Avg CGPA: ${avgCgpa}
            </span>
          </td>
        </tr>
      `;

      students.forEach(s => {
        const fullName = `${s.firstName || ''} ${s.lastName || ''}`.trim();
        const cgpa = s.cgpa != null && Number.isFinite(Number(s.cgpa)) ? Number(s.cgpa) : null;
        const cgpaColor = getCgpaClass(cgpa);
        const cgpaDisplay = cgpa != null ? cgpa.toFixed(2) : '—';

        html += `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;"><code style="font-size:.75rem;color:#475569;">${esc(s.matricNumber || '—')}</code></td>
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(fullName)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="display:inline-block;padding:2px 8px;font-size:.68rem;font-weight:800;background:#f1f5f9;color:#334155;border-radius:5px;">${esc(s.level || '—')}</span>
            </td>
            <td style="padding:.65rem .75rem;font-size:.8rem;color:#475569;">${esc(s.programmeName || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="display:inline-block;padding:3px 10px;font-size:.72rem;font-weight:800;border-radius:6px;background:${cgpaColor.bg};color:${cgpaColor.color};">${cgpaDisplay}</span>
            </td>
            <td style="padding:.65rem .75rem;text-align:right;">
              <button class="tr-btn tr-view-btn" data-id="${s.id}" style="background:#eff6ff;color:#1e40af;">👁 View</button>
            </td>
          </tr>
        `;
      });
    });

    tbody.innerHTML = html;
    tbody.querySelectorAll('.tr-view-btn').forEach(btn => {
      btn.addEventListener('click', () => viewTranscript(btn.dataset.id));
    });
  }

  async function viewTranscript(studentId) {
    const modal = $('tr-modal');
    const title = $('tr-modal-title');
    const body = $('tr-modal-body');

    modal.style.display = 'flex';
    title.textContent = 'Loading Transcript...';
    body.innerHTML = `<div style="text-align:center;padding:3rem;color:#64748b;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:trSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;">Fetching results…</div>
    </div>`;

    try {
      const [res, signerResponse] = await Promise.all([core.portalFetch(`/api/admin/transcript/${studentId}`), core.portalFetch('/api/portal/signatories/registrar').catch(() => ({ data: {} }))]);
      const registrar = signerResponse.data || {};
      const s = res.student || {};
      const rows = res.rows || [];
      const summary = res.summary || {};

      title.textContent = `Transcript — ${s.firstName} ${s.lastName}`;

      const cgpa = summary.cgpa != null && !isNaN(summary.cgpa) ? Number(summary.cgpa).toFixed(2) : '0.00';

      let resultRows = '';
      if (!rows.length) {
        resultRows = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#991b1b;">No published results found.</td></tr>';
      } else {
        resultRows = rows.map(r => `
          <tr>
            <td style="font-weight:700;">${esc(r.course?.code || '—')}</td>
            <td>${esc(r.course?.title || '—')}</td>
            <td class="center">${esc(r.course?.unit || '0')}</td>
            <td class="center">${esc(r.result?.score || '—')}</td>
            <td class="center" style="font-weight:800;color:#065f46;">${esc(r.result?.grade || '—')}</td>
            <td class="center">${esc(r.result?.points || '—')}</td>
          </tr>
        `).join('');
      }

      const logoUrl = '/images/logo.png';

      body.innerHTML = `
        <div class="tr-printable">
          <!-- Watermark: only shown when printing (via @media print) -->
          <img src="${logoUrl}" class="tr-watermark" alt="" onerror="this.style.display='none'" />

          <div class="tr-content">
            <!-- Letterhead -->
            <div class="tr-letterhead">
              <img src="${logoUrl}" alt="FPU Logo" onerror="this.style.display='none'" />
              <h1>Federal Polytechnic Ugep</h1>
              <p>P.M.B. 1038, Ugep, Cross River State, Nigeria</p>
            </div>

            <div class="tr-title">Official Transcript</div>

            <!-- Student info -->
            <div class="tr-info-grid">
              <div>
                <span>Matric No.</span>
                <strong>${esc(s.matricNumber || '—')}</strong>
              </div>
              <div>
                <span>Student Name</span>
                <strong>${esc(s.firstName || '')} ${esc(s.lastName || '')}</strong>
              </div>
              <div>
                <span>Level</span>
                <strong>${esc(s.level || '—')}</strong>
              </div>
              <div>
                <span>Department</span>
                <strong>${esc(s.departmentName || '—')}</strong>
              </div>
              <div>
                <span>Programme</span>
                <strong>${esc(s.programmeName || '—')}</strong>
              </div>
              <div>
                <span>Date Issued</span>
                <strong>${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</strong>
              </div>
            </div>

            <!-- Results table -->
            <table class="tr-results-table">
              <thead>
                <tr>
                  <th style="width:10%;">Code</th>
                  <th style="width:50%;">Course Title</th>
                  <th style="width:8%; text-align:center;">Units</th>
                  <th style="width:10%; text-align:center;">Score</th>
                  <th style="width:10%; text-align:center;">Grade</th>
                  <th style="width:12%; text-align:center;">Points</th>
                </tr>
              </thead>
              <tbody>${resultRows}</tbody>
            </table>

            <!-- Summary -->
            <div class="tr-summary">
              <div>
                <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:.05em;">Total Units</div>
                <div style="font-size:1.1rem;font-weight:800;">${esc(summary.totalUnits || '0')}</div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;color:#64748b;letter-spacing:.05em;">Cumulative GPA</div>
                <div class="tr-cgpa-big">${cgpa}</div>
                <div style="font-size:.78rem;font-weight:600;">${esc(summary.classification || '—')}</div>
              </div>
            </div>

            <!-- Signature -->
            <div class="tr-signature">
              <div>Date: ${new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
              <div class="tr-sign-block">
                ${registrar.signatureUrl ? '<img src="' + esc(registrar.signatureUrl) + '" alt="Registrar saved electronic signature" style="display:block;max-width:170px;max-height:58px;object-fit:contain;margin:0 auto 5px;" />' : ''}
                <div style="font-weight:800;">${esc(registrar.fullName || 'REGISTRAR')}</div>
                <div style="font-size:.7rem;color:#64748b;">Registrar · Signature / Stamp</div>
              </div>
            </div>

            <div class="tr-footer">
              This is a computer-generated transcript and is valid without a physical signature.
            </div>
          </div>
        </div>

        <!-- On-screen only buttons (hidden when printing) -->
        <div class="tr-print-hide" style="margin-top:1.5rem;display:flex;justify-content:flex-end;gap:.5rem;">
          <button id="tr-print-transcript" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">🖨 Print / Save as PDF</button>
          <button onclick="document.getElementById('tr-modal').style.display='none'" style="padding:.6rem 1rem;font-size:.85rem;font-weight:700;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Close</button>
        </div>
      `;
      $('tr-print-transcript')?.addEventListener('click', printTranscriptOnly);

    } catch (err) {
      body.innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  function printTranscriptOnly() {
    const article = $('tr-modal-body')?.querySelector('.tr-printable');
    if (!article) {
      if (typeof window.showToast === 'function') window.showToast('Transcript content is not ready to print.', 'warning');
      return;
    }

    // Use a clean, standalone print document. The portal's global print rules
    // and SPA layout must not be able to hide or clip the transcript.
    const printWindow = window.open('', '_blank', 'width=1000,height=800');
    if (!printWindow) {
      if (typeof window.showToast === 'function') {
        window.showToast('Your browser blocked the print window. Allow pop-ups for this portal, then try again.', 'warning');
      }
      return;
    }

    const printStyles = `
      @page { size: A4 portrait; margin: 14mm; }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #fff; color: #0f172a; }
      body { font-family: "Times New Roman", serif; font-size: 11pt; }
      .tr-printable { position: relative; padding: 0; color: #0f172a; }
      .tr-printable .tr-content { position: relative; z-index: 1; }
      .tr-watermark { display: block !important; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-20deg); width: 100mm; height: 100mm; opacity: .07; z-index: 0; pointer-events: none; }
      .tr-letterhead { text-align: center; padding-bottom: 10px; margin-bottom: 18px; border-bottom: 3px double #065f46; }
      .tr-letterhead img { height: 60px; margin-bottom: 7px; object-fit: contain; }
      .tr-letterhead h1 { font-size: 22px; margin: 0; color: #065f46; letter-spacing: .5px; text-transform: uppercase; }
      .tr-letterhead p { margin: 4px 0 0; font-size: 12px; color: #475569; }
      .tr-title { text-align: center; font-size: 16px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; text-decoration: underline; margin: 16px 0; color: #0f172a; }
      .tr-info-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-bottom: 20px; font-size: 12px; }
      .tr-info-grid > div > span { display: block; font-weight: 700; text-transform: uppercase; font-size: 9px; color: #64748b; letter-spacing: .05em; margin-bottom: 3px; }
      .tr-info-grid > div > strong { font-weight: 700; font-size: 13px; color: #0f172a; }
      .tr-results-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-bottom: 16px; }
      .tr-results-table th { background: #f0fdf4 !important; padding: 8px; border: 1px solid #000; text-align: left; text-transform: uppercase; font-size: 9px; letter-spacing: .05em; color: #065f46; font-weight: 800; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .tr-results-table td { padding: 6px 8px; border: 1px solid #333; }
      .tr-results-table td.center { text-align: center; }
      .tr-summary { display: flex; justify-content: flex-end; gap: 32px; margin-top: 16px; padding-top: 14px; border-top: 2px solid #065f46; font-size: 12px; }
      .tr-summary .tr-cgpa-big { font-size: 22px; font-weight: 800; color: #065f46; }
      .tr-footer { margin-top: 24px; padding-top: 12px; border-top: 1px solid #999; font-size: 10px; text-align: center; color: #555; }
      .tr-signature { margin-top: 32px; display: flex; justify-content: space-between; gap: 24px; font-size: 11px; }
      .tr-signature .tr-sign-block { border-top: 1px solid #000; padding-top: 5px; min-width: 160px; text-align: center; }
      img { max-width: 100%; }
      @media screen { body { padding: 18px; } .tr-printable { max-width: 900px; margin: 0 auto; } }
      @media print { .tr-print-hide { display: none !important; } thead { display: table-header-group; } tr { break-inside: avoid; } }
    `;

    try {
      const doc = printWindow.document;
      let printStarted = false;
      const startPrint = async () => {
        if (printStarted || printWindow.closed) return;
        // A popup can finish its load before a listener registered after
        // document.close() gets a chance to run. Also guard against printing
        // an empty document, which produces a completely blank print preview.
        if (!doc.body || !doc.body.querySelector('.tr-printable') || !doc.body.innerText.trim()) {
          if (typeof window.showToast === 'function') window.showToast('The transcript did not load into the print page. Please close it and try Print again.', 'error');
          return;
        }
        printStarted = true;
        try {
          if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
          const images = Array.from(doc.images);
          await Promise.all(images.map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise(resolve => {
              img.onload = resolve;
              img.onerror = resolve;
              setTimeout(resolve, 2500);
            });
          }));
          // Allow the browser one paint after the transcript and images settle.
          await new Promise(resolve => setTimeout(resolve, 300));
          if (printWindow.closed) return;
          printWindow.focus();
          printWindow.print();
        } catch (error) {
          printWindow.close();
          if (typeof window.showToast === 'function') window.showToast(error.message || 'Unable to prepare the transcript for printing.', 'error');
        }
      };

      // Register before writing: the load event may fire immediately after
      // document.close(), before a listener added afterward can observe it.
      printWindow.addEventListener('load', () => setTimeout(startPrint, 100), { once: true });
      printWindow.addEventListener('afterprint', () => printWindow.close(), { once: true });
      doc.open();
      doc.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="' + window.location.origin + '/"><title>Student Transcript</title><style>' + printStyles + '</style></head><body>' + article.outerHTML + '</body></html>');
      doc.close();

      // Fallback for browsers that complete document.write without delivering
      // a load event to the newly opened window.
      setTimeout(startPrint, 700);
    } catch (error) {
      printWindow.close();
      if (typeof window.showToast === 'function') {
        window.showToast(error.message || 'Unable to prepare the transcript for printing.', 'error');
      }
    }
  }

  // Wiring
  let searchTimer;
  $('tr-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });
  $('tr-filter-dept')?.addEventListener('change', applyFilters);
  $('tr-level')?.addEventListener('change', applyFilters);
  $('tr-modal-close')?.addEventListener('click', () => {
    $('tr-modal').style.display = 'none';
  });
  $('tr-modal')?.addEventListener('click', (e) => {
    if (e.target.id === 'tr-modal') $('tr-modal').style.display = 'none';
  });

  load();
})();
</script>
