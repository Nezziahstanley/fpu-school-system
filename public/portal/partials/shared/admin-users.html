<!-- Portal → Shared → Users (staff) -->
<div style="padding: 1rem 0 0 0;">

  <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">Users</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Manage all user accounts (students, staff, admins)</p>
    </div>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
      <button id="usr-refresh" class="btn btn-outline btn-sm">↻ Refresh</button>
    </div>
  </div>

  <!-- FILTERS -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;margin-bottom:1rem;display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:.6rem;align-items:end;">
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">Search</label>
      <input type="search" id="usr-search" placeholder="Search name, email, or matric…"
             style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" />
    </div>
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">Role</label>
      <select id="usr-filter-role" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;">
        <option value="">All Roles</option>
        <option value="student">Students</option>
        <option value="lecturer">Lecturers</option>
        <option value="hod">HODs</option>
        <option value="bursar">Bursars</option>
        <option value="registrar">Registrars</option>
        <option value="rector">Rectors</option>
        <option value="librarian">Librarians</option>
        <option value="exam_officer">Exam Officers</option>
        <option value="academic_officer">Academic Officers</option>
        <option value="admission_officer">Admission Officers</option>
        <option value="admin">Admins</option>
        <option value="superadmin">Superadmins</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.3rem;">Status</label>
      <select id="usr-filter-status" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;">
        <option value="">All Status</option>
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
      </select>
    </div>
    <div style="padding-bottom:.55rem;">
      <span class="muted small" id="usr-count" style="font-size:.8rem;color:#64748b;white-space:nowrap;">—</span>
    </div>
  </div>

  <!-- STATS -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #065f46;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">Total Users</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="usr-stat-total">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #3b82f6;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">Students</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="usr-stat-students">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #f59e0b;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">Staff</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="usr-stat-staff">—</div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-left:4px solid #8b5cf6;border-radius:10px;padding:1rem;">
      <div style="font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#64748b;">Inactive</div>
      <div style="font-size:1.6rem;font-weight:800;color:#0f172a;margin-top:.25rem;" id="usr-stat-inactive">—</div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.7rem 1rem;background:#f8fafc;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:.82rem;font-weight:700;color:#334155;">All Users</div>
      <div style="font-size:.78rem;color:#64748b;">
        Showing <span id="usr-shown">0</span> of <span id="usr-total">0</span>
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Name</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Email</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Matric / Staff ID</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Role</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Last Login</th>
          </tr>
        </thead>
        <tbody id="usr-tbody">
          <tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
            <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:usrSpin .8s linear infinite;"></div>
            <div style="margin-top:.65rem;font-size:.82rem;">Loading users…</div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  @keyframes usrSpin { to { transform: rotate(360deg); } }
  #usr-tbody tr { transition: background .1s; }
  #usr-tbody tr:hover { background: #f8fafc; }
  .usr-role-badge {
    display: inline-block; padding: 3px 9px; border-radius: 99px;
    font-size: .65rem; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase;
  }
  .usr-status-badge {
    display: inline-flex; align-items: center; gap: .3rem;
    padding: 3px 9px; border-radius: 99px;
    font-size: .65rem; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase;
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

  let ALL = [];
  let FILTERED = [];

  const ROLE_COLORS = {
    student: { bg: '#dbeafe', color: '#1e40af' },
    lecturer: { bg: '#e0e7ff', color: '#3730a3' },
    hod: { bg: '#fef3c7', color: '#92400e' },
    bursar: { bg: '#d1fae5', color: '#065f46' },
    registrar: { bg: '#fce7f3', color: '#9d174d' },
    rector: { bg: '#fee2e2', color: '#991b1b' },
    librarian: { bg: '#ede9fe', color: '#6d28d9' },
    exam_officer: { bg: '#fef9c3', color: '#854d0e' },
    academic_officer: { bg: '#ccfbf1', color: '#0f766e' },
    admission_officer: { bg: '#fee2e2', color: '#b91c1c' },
    admin: { bg: '#065f46', color: '#ffffff' },
    superadmin: { bg: '#7c2d12', color: '#ffffff' },
  };

  function roleBadge(role) {
    const r = String(role || 'user').toLowerCase();
    const colors = ROLE_COLORS[r] || { bg: '#f1f5f9', color: '#475569' };
    const label = r.replace(/_/g, ' ');
    return `<span class="usr-role-badge" style="background:${colors.bg}; color:${colors.color};">${esc(label)}</span>`;
  }

  function statusBadge(isActive) {
    if (isActive === false) {
      return `<span class="usr-status-badge" style="background:#fee2e2; color:#991b1b;">Inactive</span>`;
    }
    return `<span class="usr-status-badge" style="background:#d1fae5; color:#065f46;">Active</span>`;
  }

  async function load() {
    const tbody = $('usr-tbody');
    tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem;text-align:center;color:#94a3b8;">
      <div style="display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:usrSpin .8s linear infinite;"></div>
      <div style="margin-top:.65rem;font-size:.82rem;">Loading users…</div>
    </td></tr>`;

    try {
      // ✅ FIXED: correct endpoint is /api/admin/users, not /api/admin/user-list
      const res = await core.portalFetch('/api/admin/users?limit=1000');
      // Handle both response shapes: { data: [...] } or { users: [...] }
      ALL = Array.isArray(res.data) ? res.data
          : Array.isArray(res.users) ? res.users
          : [];

      renderStats();
      applyFilters();
    } catch (err) {
      console.error('[users] load error:', err);
      tbody.innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function renderStats() {
    const total = ALL.length;
    const students = ALL.filter(u => u.role === 'student').length;
    const inactive = ALL.filter(u => u.isActive === false).length;
    const staff = total - students;

    $('usr-stat-total').textContent = total;
    $('usr-stat-students').textContent = students;
    $('usr-stat-staff').textContent = staff;
    $('usr-stat-inactive').textContent = inactive;
  }

  function applyFilters() {
    const q = ($('usr-search')?.value || '').trim().toLowerCase();
    const role = $('usr-filter-role')?.value || '';
    const status = $('usr-filter-status')?.value || '';

    FILTERED = ALL.filter(u => {
      if (role && u.role !== role) return false;
      if (status === 'active' && u.isActive === false) return false;
      if (status === 'inactive' && u.isActive !== false) return false;
      if (q) {
        const hay = `${u.firstName || ''} ${u.lastName || ''} ${u.email || ''} ${u.matricNumber || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderTable(FILTERED);
    $('usr-shown').textContent = FILTERED.length;
    $('usr-total').textContent = ALL.length;
    $('usr-count').textContent = `${FILTERED.length} of ${ALL.length}`;
  }

  function renderTable(rows) {
    const tbody = $('usr-tbody');
    if (!rows.length) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:3rem 1rem;text-align:center;color:#94a3b8;">
        <div style="font-size:2.5rem;margin-bottom:.6rem;opacity:.6;">👥</div>
        <div style="font-weight:700;color:#0f172a;font-size:.9rem;">No users found</div>
        <div style="font-size:.78rem;color:#94a3b8;margin-top:.25rem;">Try adjusting your filters.</div>
      </td></tr>`;
      return;
    }

    tbody.innerHTML = rows.map(u => {
      const fullName = `${u.firstName || ''} ${u.lastName || ''}`.trim() || '—';
      const idValue = u.matricNumber || u.staffNumber || '—';

      return `
        <tr>
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(fullName)}</td>
          <td style="padding:.65rem .75rem;font-size:.8rem;color:#475569;">${esc(u.email || '—')}</td>
          <td style="padding:.65rem .75rem;">
            <code style="font-size:.75rem;color:#475569;">${esc(idValue)}</code>
          </td>
          <td style="padding:.65rem .75rem;text-align:center;">${roleBadge(u.role)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${statusBadge(u.isActive)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-size:.78rem;color:#64748b;">${u.lastLogin ? fmtDate(u.lastLogin) : '—'}</td>
        </tr>
      `;
    }).join('');
  }

  // Wiring
  let searchTimer;
  $('usr-search')?.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applyFilters, 200);
  });
  $('usr-filter-role')?.addEventListener('change', applyFilters);
  $('usr-filter-status')?.addEventListener('change', applyFilters);
  $('usr-refresh')?.addEventListener('click', load);

  load();
})();
</script>
