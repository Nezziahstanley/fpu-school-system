<section class="greeting">
  <div class="who">
    <div class="avatar">A</div>
    <div>
      <h1>Announcements</h1>
      <div class="sub">Institution-wide announcements</div>
    </div>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Latest</h3></div>
  <div class="panel-body">
    <div id="an-list" class="muted small">Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    try {
      const r = await core.portalFetch('/api/announcements');
      const list = r.data || r || [];
      document.getElementById('an-list').innerHTML = list.length
        ? list.slice(0, 10).map(a =>
            `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
               <strong>${core.escapeHtml(a.title || 'Announcement')}</strong>
               <div class="muted small">${core.escapeHtml((a.body || '').slice(0, 160))}</div>
             </div>`).join('')
        : '<em>No announcements.</em>';
    } catch {
      document.getElementById('an-list').innerHTML = '<em>Could not load announcements.</em>';
    }
  })();
</script>
