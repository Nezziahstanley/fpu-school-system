<!-- Portal → Shared → Complaints (role-aware: student/lecturer = mine; staff = all + reply) -->
<div style="padding:0;">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
    <div>
      <h2 id="cmp-title" style="margin:0;font-size:1.3rem;font-weight:700;color:#0f172a;">My Complaints</h2>
      <p id="cmp-subtitle" style="margin:.25rem 0 0;font-size:.82rem;color:#64748b;">Report an issue and track its status</p>
    </div>
    <button id="cmp-new" type="button" style="padding:.55rem .9rem;background:#065f46;color:#fff;border:none;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;">+ New Complaint</button>
  </div>

  <div id="cmp-stats" style="display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem;"></div>

  <div id="cmp-tabs" style="display:flex;gap:.25rem;margin-bottom:1rem;padding:.25rem;background:#f1f5f9;border-radius:10px;">
    <button class="cmp-tab" data-filter="all"       style="flex:1;padding:.45rem .5rem;font-size:.78rem;font-weight:600;border:none;background:transparent;border-radius:8px;cursor:pointer;color:#64748b;">All</button>
    <button class="cmp-tab" data-filter="open"      style="flex:1;padding:.45rem .5rem;font-size:.78rem;font-weight:600;border:none;background:transparent;border-radius:8px;cursor:pointer;color:#64748b;">Open</button>
    <button class="cmp-tab" data-filter="in_review" style="flex:1;padding:.45rem .5rem;font-size:.78rem;font-weight:600;border:none;background:transparent;border-radius:8px;cursor:pointer;color:#64748b;">Review</button>
    <button class="cmp-tab" data-filter="resolved"  style="flex:1;padding:.45rem .5rem;font-size:.78rem;font-weight:600;border:none;background:transparent;border-radius:8px;cursor:pointer;color:#64748b;">Resolved</button>
    <button class="cmp-tab" data-filter="closed"    style="flex:1;padding:.45rem .5rem;font-size:.78rem;font-weight:600;border:none;background:transparent;border-radius:8px;cursor:pointer;color:#64748b;">Closed</button>
  </div>

  <div id="cmp-list"></div>
</div>

<!-- NEW COMPLAINT MODAL (only usable by non-staff) -->
<div id="cmp-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:14px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid #e5e7eb;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;">New Complaint</h3>
      <button id="cmp-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;padding:0;width:30px;height:30px;border-radius:6px;">✕</button>
    </div>
    <form id="cmp-form" style="padding:1.25rem;">
      <div style="margin-bottom:.9rem;">
        <label style="display:block;font-weight:600;font-size:.82rem;color:#334155;margin-bottom:.35rem;">Subject *</label>
        <input type="text" name="subject" required maxlength="200" placeholder="Brief title of your issue" style="width:100%;padding:.6rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;box-sizing:border-box;" />
      </div>
      <div style="margin-bottom:.9rem;">
        <label style="display:block;font-weight:600;font-size:.82rem;color:#334155;margin-bottom:.35rem;">Category</label>
        <select name="category" style="width:100%;padding:.6rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;box-sizing:border-box;">
          <option value="">— Select —</option>
          <option value="academic">Academic</option>
          <option value="fees">Fees / Payments</option>
          <option value="library">Library</option>
          <option value="hostel">Hostel</option>
          <option value="ict">ICT / Portal</option>
          <option value="staff">Staff Conduct</option>
          <option value="welfare">Student Welfare</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div style="margin-bottom:1.1rem;">
        <label style="display:block;font-weight:600;font-size:.82rem;color:#334155;margin-bottom:.35rem;">Description *</label>
        <textarea name="body" required rows="5" maxlength="2000" placeholder="Describe your issue in detail…" style="width:100%;padding:.6rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;font-family:inherit;resize:vertical;box-sizing:border-box;"></textarea>
      </div>
      <div style="display:flex;gap:.5rem;justify-content:flex-end;">
        <button type="button" id="cmp-cancel" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button type="submit" id="cmp-submit" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Submit Complaint</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  'use strict';
  var core = window.FPU_PORTAL || {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s); };
  var timeAgo = function (d) { return core.timeAgo ? core.timeAgo(d) : ''; };

  // ----------------------------------------------------------
  // Normalize the { complaint, user } row shape from
  // /api/admin/complaints (listComplaintsWithUser) into a flat
  // object the render code below expects.
  // ----------------------------------------------------------
  function normalize(row) {
    if (!row) return row;
    if (row.complaint) {
      var out = Object.assign({}, row.complaint);
      out.user = row.user || {};
      return out;
    }
    return row;
  }

  function displayName(u) {
    if (!u) return '';
    var fn = u.firstName || '';
    var ln = u.lastName  || '';
    var full = (fn + ' ' + ln).trim();
    return full || u.email || ('User #' + (u.id || ''));
  }

  // ----------------------------------------------------------
  // ROLE DETECTION
  // staff = can see ALL complaints and reply
  // non-staff = sees own complaints, can create new
  // ----------------------------------------------------------
  var me = (core.getPortalUser && core.getPortalUser()) || {};
  var ROLE = String(me.role || '').toLowerCase();
  var IS_STAFF = ['rector', 'admin', 'superadmin', 'registrar', 'hod'].includes(ROLE);

  var LIST_URL    = IS_STAFF ? '/api/admin/complaints'         : '/api/portal/complaints';
  var RESPOND_URL = function (id) { return '/api/admin/complaints/' + id + '/respond'; };

  var ALL = [];
  var FILTER = 'all';

  var META = {
    open:      { label: 'Open',      bg: '#dbeafe', fg: '#1e40af', bar: '#3b82f6', icon: '🔵' },
    in_review: { label: 'In Review', bg: '#fef3c7', fg: '#92400e', bar: '#f59e0b', icon: '🟡' },
    resolved:  { label: 'Resolved',  bg: '#d1fae5', fg: '#065f46', bar: '#10b981', icon: '🟢' },
    closed:    { label: 'Closed',    bg: '#f1f5f9', fg: '#475569', bar: '#94a3b8', icon: '⚫' },
  };
  var CAT = {
    academic: 'Academic', fees: 'Fees / Payments', library: 'Library',
    hostel: 'Hostel', ict: 'ICT / Portal', staff: 'Staff Conduct',
    welfare: 'Student Welfare', other: 'Other',
  };

  // ----------------------------------------------------------
  // Header — swap text based on role
  // ----------------------------------------------------------
  if (IS_STAFF) {
    $('cmp-title').textContent = 'All Complaints';
    $('cmp-subtitle').textContent = 'Review complaints and send replies';
    var newBtn = $('cmp-new');
    if (newBtn) newBtn.style.display = 'none';
  }

  function renderStats() {
    var counts = { open: 0, in_review: 0, resolved: 0, closed: 0 };
    ALL.forEach(function (c) { if (counts[c.status] != null) counts[c.status]++; });

    var html = '';
    ['open', 'in_review', 'resolved', 'closed'].forEach(function (k) {
      var m = META[k];
      html += '<div style="background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:.7rem .85rem;display:flex;align-items:center;gap:.6rem;">'
        + '<div style="width:32px;height:32px;border-radius:8px;background:' + m.bg + ';color:' + m.fg + ';display:flex;align-items:center;justify-content:center;font-size:1rem;">' + m.icon + '</div>'
        + '<div><div style="font-size:1.15rem;font-weight:800;color:#0f172a;line-height:1;">' + counts[k] + '</div>'
        + '<div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-top:.15rem;">' + m.label + '</div></div>'
        + '</div>';
    });
    $('cmp-stats').innerHTML = html;
  }

  function renderCard(c) {
    var m = META[c.status] || META.open;
    var cat = CAT[c.category] || '';

    // For staff, the response block becomes an editable reply box
    var responseBlock = '';
    if (IS_STAFF) {
      responseBlock =
        '<div style="margin-top:.85rem;padding-top:.75rem;border-top:1px dashed #cbd5e1;">'
        +  '<div style="font-size:.68rem;font-weight:800;color:#065f46;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem;">✉️ Reply to complainant</div>'
        +  '<textarea class="cmp-reply-input" rows="3" placeholder="Type your reply…" style="width:100%;padding:.55rem .7rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;font-family:inherit;resize:vertical;box-sizing:border-box;">' + esc(c.response || '') + '</textarea>'
        +  '<div style="display:flex;gap:.5rem;margin-top:.5rem;align-items:center;flex-wrap:wrap;">'
        +    '<select class="cmp-status-select" style="padding:.45rem .6rem;font-size:.78rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">'
        +      ['open','in_review','resolved','closed'].map(function (k) {
                 return '<option value="' + k + '"' + (c.status === k ? ' selected' : '') + '>' + META[k].label + '</option>';
               }).join('')
        +    '</select>'
        +    '<button type="button" class="cmp-send" data-cid="' + esc(c.id) + '" style="padding:.5rem 1rem;font-size:.78rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Send Reply</button>'
        +  '</div>'
        + '</div>';
    } else if (c.response) {
      responseBlock =
        '<div style="margin-top:.75rem;padding:.75rem .9rem;background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #10b981;border-radius:8px;">'
        + '<div style="font-size:.68rem;font-weight:800;color:#065f46;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.35rem;">✉️ Response from administration</div>'
        + '<div style="font-size:.83rem;color:#14532d;line-height:1.55;white-space:pre-wrap;">' + esc(c.response) + '</div>'
        + '</div>';
    }

    // Complainant line (staff only) — the admin list query joins users
    var complainant = '';
    if (IS_STAFF) {
      var u = c.user || {};
      var name = displayName(u);
      var email = u.email ? ' · ' + esc(u.email) : '';
      complainant = '<div style="font-size:.75rem;color:#475569;margin:.25rem 0 .5rem;font-weight:600;">👤 ' + esc(name) + email + '</div>';
    }

    return '<div class="cmp-card" data-cid="' + esc(c.id) + '" style="background:#fff;border:1px solid #e5e7eb;border-left:5px solid ' + m.bar + ';border-radius:12px;margin-bottom:.7rem;padding:1rem 1.1rem;">'
      + '<div style="display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;margin-bottom:.5rem;">'
      +   '<span style="display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:800;letter-spacing:.05em;background:' + m.bg + ';color:' + m.fg + ';padding:3px 10px;border-radius:99px;text-transform:uppercase;">' + m.label + '</span>'
      +   (cat ? '<span style="font-size:.65rem;font-weight:700;background:#f8fafc;color:#475569;border:1px solid #e2e8f0;padding:3px 9px;border-radius:6px;">' + esc(cat) + '</span>' : '')
      + '</div>'
      + complainant
      + '<h3 style="margin:0 0 .35rem;font-size:.95rem;color:#0f172a;font-weight:700;line-height:1.3;">' + esc(c.subject || 'Untitled') + '</h3>'
      + '<p style="margin:0;font-size:.83rem;color:#475569;line-height:1.55;white-space:pre-wrap;">' + esc(c.body || '') + '</p>'
      + responseBlock
      + '<div style="display:flex;gap:.6rem;margin-top:.7rem;padding-top:.6rem;border-top:1px dashed #e5e7eb;font-size:.7rem;color:#94a3b8;">'
      +   '<span>🕐 ' + esc(timeAgo(c.createdAt)) + '</span>'
      +   '<span style="font-family:ui-monospace,monospace;">#' + esc(c.id) + '</span>'
      + '</div>'
      + '</div>';
  }

  function render() {
    document.querySelectorAll('.cmp-tab').forEach(function (b) {
      var on = b.dataset.filter === FILTER;
      b.style.background = on ? '#fff' : 'transparent';
      b.style.color = on ? '#065f46' : '#64748b';
      b.style.fontWeight = on ? '700' : '600';
      b.style.boxShadow = on ? '0 1px 3px rgba(0,0,0,.08)' : 'none';
    });

    var rows = FILTER === 'all' ? ALL : ALL.filter(function (c) { return c.status === FILTER; });
    var list = $('cmp-list');

    if (!rows.length) {
      var isFiltered = FILTER !== 'all';
      var emptyTitle = isFiltered
        ? 'No ' + META[FILTER].label.toLowerCase() + ' complaints'
        : (IS_STAFF ? 'No complaints filed yet' : 'No complaints yet');
      var emptyBody = isFiltered
        ? 'No complaints with this status.'
        : (IS_STAFF ? 'Complaints filed by students and staff will appear here.' : 'Click "New Complaint" above to file one.');

      list.innerHTML = '<div style="text-align:center;padding:3rem 1rem;background:#fff;border:2px dashed #e2e8f0;border-radius:14px;">'
        + '<div style="font-size:2.8rem;margin-bottom:.6rem;opacity:.65;">' + (isFiltered ? '🔍' : '💬') + '</div>'
        + '<h3 style="margin:0 0 .4rem;color:#0f172a;font-size:1rem;font-weight:700;">' + emptyTitle + '</h3>'
        + '<p style="margin:0 auto;max-width:380px;font-size:.83rem;color:#64748b;line-height:1.55;">' + emptyBody + '</p>'
        + '</div>';
      return;
    }

    list.innerHTML = rows.map(renderCard).join('');

    // Staff-only: wire up reply buttons
    if (IS_STAFF) {
      list.querySelectorAll('.cmp-send').forEach(function (btn) {
        btn.addEventListener('click', function () { sendReply(btn.dataset.cid); });
      });
    }
  }

  async function load() {
    $('cmp-list').innerHTML = '<div style="text-align:center;padding:2.5rem;"><div style="display:inline-block;width:30px;height:30px;border:3px solid #e2e8f0;border-top-color:#065f46;border-radius:50%;animation:cmpSpin .8s linear infinite;"></div></div>';

    try {
      var res = await core.portalFetch(LIST_URL);
      var raw = Array.isArray(res.data) ? res.data : [];
      ALL = raw.map(normalize);
      renderStats();
      render();
    } catch (err) {
      $('cmp-list').innerHTML = '<div style="padding:1rem;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#991b1b;font-size:.85rem;">⚠️ ' + esc(err.message) + '</div>';
    }
  }

  // ----------------------------------------------------------
  // STAFF: send reply + change status in one call
  // ----------------------------------------------------------
  async function sendReply(id) {
    var card = document.querySelector('.cmp-card[data-cid="' + id + '"]');
    if (!card) return;
    var ta  = card.querySelector('.cmp-reply-input');
    var sel = card.querySelector('.cmp-status-select');
    var btn = card.querySelector('.cmp-send');
    var text = (ta && ta.value || '').trim();
    var stat = sel ? sel.value : 'resolved';

    if (!text) {
      if (core.showToast) core.showToast('Reply cannot be empty.', 'warning');
      return;
    }

    btn.disabled = true;
    var prev = btn.textContent;
    btn.textContent = 'Sending…';

    try {
      await core.portalFetch(RESPOND_URL(id), {
        method: 'POST',
        body: { response: text, status: stat },
      });
      if (core.showToast) core.showToast('Reply sent.', 'success');
      load(); // refresh list + stats
    } catch (err) {
      if (core.showToast) core.showToast(err.message, 'error');
      btn.disabled = false;
      btn.textContent = prev;
    }
  }

  // ----------------------------------------------------------
  // NON-STAFF: new complaint modal
  // ----------------------------------------------------------
  function openModal() {
    $('cmp-modal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    $('cmp-modal').style.display = 'none';
    document.body.style.overflow = '';
    $('cmp-form').reset();
  }

  async function submit(e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var data = Object.fromEntries(fd);

    if (!data.subject || !data.body) {
      if (core.showToast) core.showToast('Subject and description are required.', 'warning');
      return;
    }

    var btn = $('cmp-submit');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      await core.portalFetch('/api/portal/complaints', {
        method: 'POST',
        body: { subject: data.subject, body: data.body, category: data.category || null },
      });
      if (core.showToast) core.showToast('Complaint submitted.', 'success');
      closeModal();
      load();
    } catch (err) {
      if (core.showToast) core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Complaint';
    }
  }

  // Spin keyframe
  var st = document.createElement('style');
  st.textContent = '@keyframes cmpSpin { to { transform: rotate(360deg); } }';
  document.head.appendChild(st);

  // Wire up — guarded so staff don't crash on missing modal elements
  if ($('cmp-new'))    $('cmp-new').addEventListener('click', openModal);
  if ($('cmp-close'))  $('cmp-close').addEventListener('click', closeModal);
  if ($('cmp-cancel')) $('cmp-cancel').addEventListener('click', closeModal);
  if ($('cmp-form'))   $('cmp-form').addEventListener('submit', submit);
  if ($('cmp-modal'))  $('cmp-modal').addEventListener('click', function (e) {
    if (e.target.id === 'cmp-modal') closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('cmp-modal')) closeModal();
  });
  document.querySelectorAll('.cmp-tab').forEach(function (b) {
    b.addEventListener('click', function () {
      FILTER = b.dataset.filter;
      render();
    });
  });

  load();
})();
</script>
