<!-- Shared → Messages -->
<section class="greeting">
  <div class="who">
    <div class="avatar">💬</div>
    <div>
      <h1>Messages</h1>
      <div class="sub">Your internal messages and conversations</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <input type="search" id="ms-search" placeholder="Search messages…" />
  <select id="ms-status">
    <option value="">All</option>
    <option value="unread">Unread</option>
    <option value="read">Read</option>
  </select>
  <button class="btn btn-outline btn-sm" id="ms-refresh">Refresh</button>
  <button class="btn btn-primary btn-sm" id="ms-compose">✏ Compose</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>Inbox</h3><span class="badge" id="ms-count">0</span></div>
  <div class="panel-body" id="ms-list">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [], FILTERED = [];

  function render() {
    $('ms-count').textContent = FILTERED.length;
    if (!FILTERED.length) {
      $('ms-list').innerHTML = `
        <div style="text-align:center;padding:3rem 1rem;color:#94a3b8;">
          <div style="font-size:3rem;margin-bottom:1rem;">📭</div>
          <p style="font-size:14px;">No messages yet.</p>
          <p style="font-size:12px;margin-top:.5rem;">Messages from staff and students will appear here.</p>
        </div>`;
      return;
    }
    $('ms-list').innerHTML = FILTERED.map((m) => `
      <div style="padding:1rem;border-bottom:1px solid #eee;cursor:pointer;" data-id="${m.id}">
        <div style="display:flex;justify-content:space-between;">
          <strong>${esc(m.senderName || m.from || 'System')}</strong>
          <span class="muted small">${m.createdAt ? new Date(m.createdAt).toLocaleDateString() : ''}</span>
        </div>
        <div style="margin-top:.35rem;color:#374151;">${esc((m.subject || 'No subject').slice(0, 80))}</div>
      </div>`).join('');
  }

  function applyFilter() {
    const q = ($('ms-search').value || '').trim().toLowerCase();
    const st = $('ms-status').value;
    FILTERED = ALL.filter((m) => {
      const hay = `${m.senderName || ''} ${m.subject || ''} ${m.body || ''}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (st === 'unread' && m.isRead) return false;
      if (st === 'read' && !m.isRead) return false;
      return true;
    });
    render();
  }

  async function load() {
    try {
      const res = await core.portalFetch('/api/messages');
      const payload = res.data || res || {};
      ALL = Array.isArray(payload) ? payload : (payload.rows || payload.messages || []);
      applyFilter();
    } catch {
      // Fallback: no messages endpoint yet — show empty state
      ALL = [];
      applyFilter();
    }
  }

  $('ms-search').addEventListener('input', applyFilter);
  $('ms-status').addEventListener('change', applyFilter);
  $('ms-refresh').addEventListener('click', load);
  $('ms-compose').addEventListener('click', () => {
    core.showToast('Compose feature coming soon', 'info');
  });

  load();
})();
</script>
