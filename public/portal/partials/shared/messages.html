<!-- Shared → Messages -->
<section class="greeting">
  <div class="who">
    <div class="avatar">💬</div>
    <div>
      <h1>Messages</h1>
      <div class="sub">Your internal messages and conversations</div>
    </div>
  </div>
</section>

<!-- Filter bar — no Compose button (feature not yet available) -->
<div class="filter-bar">
  <input type="search" id="ms-search" placeholder="Search messages…" />
  <select id="ms-status">
    <option value="">All</option>
    <option value="unread">Unread</option>
    <option value="read">Read</option>
  </select>
  <button class="btn btn-outline btn-sm" id="ms-refresh">Refresh</button>
</div>

<section class="panel">
  <div class="panel-head">
    <h3>Inbox</h3>
    <span class="badge" id="ms-count">0</span>
  </div>
  <div class="panel-body" id="ms-list">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [];
  let FILTERED = [];

  // ----------------------------------------------------------
  // Render
  // ----------------------------------------------------------
  function render() {
    $('ms-count').textContent = FILTERED.length;

    // Empty state
    if (!FILTERED.length) {
      $('ms-list').innerHTML = `
        <div style="text-align:center;padding:3.5rem 1rem;color:#94a3b8;">
          <div style="font-size:3.5rem;margin-bottom:1rem;">📭</div>
          <p style="font-size:14.5px;font-weight:600;color:#475569;margin:0;">No messages yet</p>
          <p style="font-size:12.5px;margin:.5rem 0 0;color:#94a3b8;">
            Messages from staff and students will appear here once the messaging system is enabled.
          </p>
        </div>`;
      return;
    }

    // Message list
    $('ms-list').innerHTML = FILTERED.map((m) => `
      <div style="padding:1rem;border-bottom:1px solid #eee;cursor:pointer;${m.isRead ? '' : 'background:#f0fdf4;'}" data-id="${m.id}">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:1rem;">
          <strong style="color:#0f172a;">${esc(m.senderName || m.from || 'System')}</strong>
          <span class="muted small" style="white-space:nowrap;">
            ${m.createdAt ? new Date(m.createdAt).toLocaleDateString() : ''}
          </span>
        </div>
        <div style="margin-top:.35rem;color:#1f2937;font-weight:500;">${esc(m.subject || 'No subject')}</div>
        <div style="margin-top:.25rem;color:#64748b;font-size:13px;line-height:1.5;">
          ${esc((m.preview || m.body || '').slice(0, 120))}${(m.body || '').length > 120 ? '…' : ''}
        </div>
      </div>`).join('');
  }

  // ----------------------------------------------------------
  // Filter
  // ----------------------------------------------------------
  function applyFilter() {
    const q = ($('ms-search').value || '').trim().toLowerCase();
    const st = $('ms-status').value;

    FILTERED = ALL.filter((m) => {
      const hay = `${m.senderName || ''} ${m.subject || ''} ${m.body || ''}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (st === 'unread' && m.isRead) return false;
      if (st === 'read' && !m.isRead) return false;
      return true;
    });

    render();
  }

  // ----------------------------------------------------------
  // Load messages
  // ----------------------------------------------------------
  // The messaging backend isn't built yet, so we gracefully
  // show the empty state. When `/api/messages` is ready,
  // uncomment the try block below to fetch real data.
  // ----------------------------------------------------------
  async function load() {
    try {
      const res = await core.portalFetch('/api/portal/messages');
      const payload = res.data || res || {};
      const raw = Array.isArray(payload) ? payload : (payload.rows || payload.messages || []);
      ALL = raw.map((m) => {
        const msg = m.message || m;
        const sender = m.sender || {};
        return {
          id: msg.id,
          senderId: msg.senderId,
          senderName: [sender.firstName, sender.lastName].filter(Boolean).join(' ') || sender.email || 'User',
          subject: msg.subject,
          body: msg.body,
          isRead: msg.isRead,
          createdAt: msg.createdAt,
        };
      });
    } catch (err) {
      console.warn('[messages] load failed:', err.message);
      ALL = [];
    }
    applyFilter();
  }

  // ----------------------------------------------------------
  // Wire up
  // ----------------------------------------------------------
  $('ms-search').addEventListener('input', applyFilter);
  $('ms-status').addEventListener('change', applyFilter);
  $('ms-refresh').addEventListener('click', load);

  // Go
  load();
})();
</script>
