<!-- Portal → Shared → Messages -->
<section class="page-head">
  <div><h2>Messages</h2><p class="muted small">Inbox and sent messages</p></div>
  <div class="actions">
    <button class="btn btn-primary btn-sm" id="msg-compose">+ Compose</button>
  </div>
</section>

<div class="panel" id="msg-compose-panel" style="display:none;">
  <div class="panel-head"><h3>New Message</h3></div>
  <div class="panel-body">
    <form id="msg-compose-form">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Recipient User ID <span class="req">*</span></label><input class="form-control" name="recipientId" type="number" required /></div>
        <div class="form-group"><label class="form-label">Subject</label><input class="form-control" name="subject" /></div>
      </div>
      <div class="form-group"><label class="form-label">Message <span class="req">*</span></label><textarea class="form-control" name="body" rows="4" required></textarea></div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Send</button>
        <button type="button" class="btn btn-ghost" id="msg-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-box="inbox">Inbox</button>
  <button class="tab" data-box="sent">Sent</button>
</div>

<div id="msg-list" class="grid" style="gap:.5rem;">
  <div class="loading"><span class="spinner"></span> Loading…</div>
</div>

<script>
  (function () {
    const core = window.FPU_PORTAL;

    async function load(box) {
      const boxEl = document.getElementById('msg-list');
      boxEl.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await core.portalFetch(`/api/portal/messages?box=${box}`);
        const rows = res.data || [];
        boxEl.innerHTML = rows.length ? rows.map((r) => {
          const m = r.message || r;
          const from = r.sender ? `${r.sender.firstName} ${r.sender.lastName}` : `User #${m.senderId}`;
          return `<div class="session-item">
            <div class="meta"><strong>${core.escapeHtml(m.subject || '(no subject)')}</strong>${core.escapeHtml((m.body || '').slice(0, 120))}</div>
            <div class="small muted">${box === 'inbox' ? 'From: ' + core.escapeHtml(from) : 'To: User #' + m.recipientId} · ${core.timeAgo(m.createdAt)}</div>
          </div>`;
        }).join('') : '<p class="muted">No messages.</p>';
      } catch (err) { boxEl.innerHTML = `<div class="alert alert-danger">${core.escapeHtml(err.message)}</div>`; }
    }

    document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
      t.classList.add('active');
      load(t.dataset.box);
    }));

    document.getElementById('msg-compose').addEventListener('click', () => {
      const p = document.getElementById('msg-compose-panel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('msg-cancel').addEventListener('click', () => {
      document.getElementById('msg-compose-panel').style.display = 'none';
    });

    document.getElementById('msg-compose-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await core.portalFetch('/api/portal/messages', { method: 'POST', body: Object.fromEntries(fd) });
        core.showToast('Message sent.', 'success');
        e.target.reset();
        document.getElementById('msg-compose-panel').style.display = 'none';
        load('sent');
      } catch (err) { core.showToast(err.message, 'error'); }
    });

    load('inbox');
  })();
</script>
