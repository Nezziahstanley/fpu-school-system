<section class="greeting">
  <div class="who">
    <div class="avatar">N</div>
    <div>
      <h1>Notifications</h1>
      <div class="sub">Your notifications</div>
    </div>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Recent</h3></div>
  <div class="panel-body">
    <div id="nt-list" class="muted small">Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    try {
      const r = await core.portalFetch('/api/notifications');
      const list = r.data || r || [];
      document.getElementById('nt-list').innerHTML = list.length
        ? list.slice(0, 10).map(n =>
            `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
               <strong>${core.escapeHtml(n.title || 'Notification')}</strong>
               <div class="muted small">${core.escapeHtml(n.body || '')}</div>
             </div>`).join('')
        : '<em>No notifications.</em>';
    } catch {
      document.getElementById('nt-list').innerHTML = '<em>Could not load notifications.</em>';
    }
  })();
</script>
