<!-- Shared → Notifications -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🔔</div>
    <div>
      <h1>Notifications</h1>
      <div class="sub">Recent activity and alerts</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <input type="search" id="nt-search" placeholder="Search notifications…" />
  <select id="nt-status">
    <option value="">All</option>
    <option value="unread">Unread</option>
    <option value="read">Read</option>
  </select>
  <button class="btn btn-outline btn-sm" id="nt-mark-all">Mark All Read</button>
</div>

<section class="panel">
  <div class="panel-head">
    <h3>Recent</h3>
    <span class="badge" id="nt-count">0</span>
  </div>
  <div class="panel-body" id="nt-list">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL = [], FILTERED = [];

  function getTitle(n) { return n.title || 'Notification'; }
  function getBody(n) { return n.body || n.message || ''; }
  function getDate(n) { return n.createdAt || n.date; }
  function isRead(n) { return n.isRead === true || n.readAt != null; }

  function render() {
    $('nt-count').textContent = FILTERED.length;

    if (!FILTERED.length) {
      $('nt-list').innerHTML = `
        <div style="text-align:center;padding:3rem 1rem;color:#94a3b8;">
          <div style="font-size:3rem;margin-bottom:1rem;">🔔</div>
          <p style="font-size:14px;font-weight:500;">No notifications.</p>
          <p style="font-size:12.5px;margin-top:.5rem;">You'll see alerts here when something needs your attention.</p>
        </div>`;
      return;
    }

    $('nt-list').innerHTML = FILTERED.map((n) => `
      <div class="nt-item" data-id="${esc(n.id)}" data-link="${esc(n.link || '')}" style="padding:1rem;border-bottom:1px solid #eee;cursor:pointer;${isRead(n) ? '' : 'background:#f0fdf4;'}">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:1rem;">
          <div style="flex:1;">
            <strong style="display:flex;align-items:center;gap:.35rem;">
              ${isRead(n) ? '' : '<span style="width:6px;height:6px;background:#10b981;border-radius:50%;flex-shrink:0;"></span>'}
              ${esc(getTitle(n))}
            </strong>
            <p style="margin:.25rem 0 0;color:#374151;">${esc(getBody(n))}</p>
          </div>
          <div class="muted small" style="white-space:nowrap;">
            ${getDate(n) ? new Date(getDate(n)).toLocaleDateString() : ''}
          </div>
        </div>
      </div>`).join('');

    // Click-to-read
    $('nt-list').querySelectorAll('.nt-item').forEach(function (el) {
      el.addEventListener('click', async function () {
        const id = el.dataset.id;
        const link = el.dataset.link || '';
        try {
          await core.portalFetch('/api/portal/notifications/' + id + '/read', { method: 'POST' });
        } catch (e) { /* best-effort */ }
        if (link && window.FPU_SPA && window.FPU_SPA.navigatePortal) {
          const hash = link.split('#').pop();
          if (hash && hash.indexOf('portal') === 0 || hash.match(/^[a-z-]+$/)) {
            window.FPU_SPA.navigatePortal(hash);
            return;
          }
        }
        load();
      });
    });
  }

  function applyFilter() {
    const q = ($('nt-search').value || '').trim().toLowerCase();
    const st = $('nt-status').value;
    FILTERED = ALL.filter((n) => {
      const hay = `${getTitle(n)} ${getBody(n)}`.toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (st === 'unread' && isRead(n)) return false;
      if (st === 'read' && !isRead(n)) return false;
      return true;
    });
    render();
  }

  async function load() {
    try {
      const res = await core.portalFetch('/api/portal/notifications');
      const payload = res.data || res || {};
      const raw = Array.isArray(payload) ? payload : (payload.rows || payload.notifications || []);
      // Notifications may be nested as { notification: {...} }
      ALL = raw.map((n) => n.notification || n);
      applyFilter();
    } catch (err) {
      // API may return 404 if not yet built — show empty state
      ALL = [];
      applyFilter();
    }
  }

  $('nt-search').addEventListener('input', applyFilter);
  $('nt-status').addEventListener('change', applyFilter);
  $('nt-mark-all').addEventListener('click', async () => {
    if (!ALL.length) {
      core.showToast && core.showToast('No notifications to mark', 'info');
      return;
    }
    try {
      await core.portalFetch('/api/portal/notifications/read-all', { method: 'POST' });
      core.showToast && core.showToast('All marked as read', 'success');
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message || 'Failed to mark as read', 'error');
    }
  });

  load();
})();
</script>
