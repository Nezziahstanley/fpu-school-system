<!-- My Staff ID Card -->
<section class="greeting"><div class="who"><div class="avatar">🪪</div><div><h1>My ID Card</h1><div class="sub">Your official Federal Polytechnic Ugep staff identification</div></div></div></section>
<style>
.my-staff-id{width:100%;max-width:480px;aspect-ratio:1.58/1;margin:1rem auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px #0f172a24;border:1px solid #dbe4dc;position:relative}
.my-staff-id:after{content:"";position:absolute;inset:0;background:url('/images/logo.png') center/55% no-repeat;opacity:.045;pointer-events:none}
.my-staff-head{position:relative;z-index:1;background:linear-gradient(120deg,#064e3b,#059669);padding:12px 16px;color:#fff;display:flex;align-items:center;gap:12px}
.my-staff-head img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.my-staff-body{position:relative;z-index:1;display:flex;gap:14px;padding:16px}
.my-staff-body>img{width:100px;height:124px;object-fit:cover;border:2px solid #065f46;border-radius:7px;background:#f1f5f9}
.my-staff-foot{position:absolute;bottom:0;left:0;right:0;background:#064e3b;color:#fef3c7;padding:8px 14px;display:flex;justify-content:space-between;font-size:9px;font-weight:800;letter-spacing:1px}
.my-staff-fields{min-width:0;flex:1}.my-staff-fields small{display:block;font-size:8px;color:#64748b;font-weight:800;text-transform:uppercase;margin-top:5px}.my-staff-fields strong{display:block;font-size:11px;color:#0f172a;overflow-wrap:anywhere}
</style>
<div class="panel"><div class="panel-head"><h3>Official Staff Identity</h3><span class="badge" id="myid-status">Loading</span></div><div class="panel-body">
<div id="myid-loading" class="muted">Loading your ID card…</div><div id="myid-card" style="display:none">
<div class="my-staff-id"><div class="my-staff-head"><img src="/images/logo.png" alt="FPU"/><div><div style="font-size:12px;font-weight:900;letter-spacing:.6px">FEDERAL POLYTECHNIC UGEP</div><div id="myid-role" style="font-size:9px;color:#fef3c7;font-weight:800;letter-spacing:1px">STAFF IDENTIFICATION</div></div></div>
<div class="my-staff-body"><img id="myid-photo" src="" alt="Profile photo"/><div class="my-staff-fields"><small>Full name</small><strong id="myid-name">—</strong><small>Staff number</small><strong id="myid-number">—</strong><small>Department / School</small><strong id="myid-dept">—</strong><small>Designation</small><strong id="myid-rank">—</strong><small>Institutional email</small><strong id="myid-email">—</strong></div></div><div class="my-staff-foot"><span>OFFICIAL STAFF ID</span><span>FEDPOLYUGEB</span></div></div>
<div style="display:flex;justify-content:center;gap:.5rem;margin-top:1rem"><button class="btn btn-primary btn-sm" id="myid-print">Print ID Card</button><button class="btn btn-outline btn-sm" id="myid-refresh">Refresh</button></div></div>
</div></div>
<script>
(function(){'use strict';const core=window.FPU_PORTAL||{},$=id=>document.getElementById(id),esc=s=>core.escapeHtml?core.escapeHtml(s):String(s==null?'':s);
async function load(){ $('myid-loading').style.display='block';$('myid-card').style.display='none';try{const r=await core.portalFetch('/api/portal/id-card'),u=r.data||{};$('myid-name').textContent=[u.firstName,u.middleName,u.lastName].filter(Boolean).join(' ');$('myid-number').textContent=u.cardNumber||'—';$('myid-dept').textContent=[u.departmentName,u.schoolName].filter(Boolean).join(' · ')||'—';$('myid-rank').textContent=u.rank||u.specialization||u.role||'—';$('myid-email').textContent=u.email||'—';$('myid-role').textContent=(u.role||'STAFF').replace(/_/g,' ').toUpperCase()+' IDENTIFICATION';$('myid-status').textContent=u.isActive?'Active':'Inactive';$('myid-photo').src=u.photoUrl||'/images/logo.png';$('myid-loading').style.display='none';$('myid-card').style.display='block';}catch(e){$('myid-loading').textContent='Could not load ID card: '+e.message}}
$('myid-refresh').addEventListener('click',load);$('myid-print').addEventListener('click',()=>{const w=window.open('','_blank','width=700,height=500');if(!w)return;w.document.write('<!doctype html><html><head><title>FPU Staff ID</title><style>body{font-family:Arial;padding:25px}.my-staff-id{width:480px;height:304px;border:1px solid #ddd;border-radius:16px;overflow:hidden;position:relative}.my-staff-head{background:#064e3b;color:white;padding:12px;display:flex;gap:12px}.my-staff-head img{width:46px;height:46px;background:white;border-radius:50%}.my-staff-body{display:flex;gap:14px;padding:16px}.my-staff-body>img{width:100px;height:124px;object-fit:cover}.my-staff-foot{position:absolute;bottom:0;left:0;right:0;background:#064e3b;color:#fff;padding:8px;display:flex;justify-content:space-between}.my-staff-fields small{display:block;font-size:8px;color:#64748b;margin-top:5px}.my-staff-fields strong{display:block;font-size:11px}</style></head><body>'+document.querySelector('.my-staff-id').outerHTML+'<script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()});load()})();
</script>
