<!-- Shared → My Profile -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="pf-avatar" style="font-size:1.5rem;overflow:hidden;">U</div>
    <div>
      <h1 id="pf-name">My Profile</h1>
      <div class="sub" id="pf-sub">Loading…</div>
    </div>
  </div>
  <div class="meta">
    <strong id="pf-role-badge">—</strong>
    <span>Role</span>
  </div>
</section>

<!-- Tabs -->
<div class="filter-bar" style="padding:.5rem;gap:.25rem;">
  <button class="btn btn-primary btn-sm" data-tab="details">📝 My Details</button>
  <button class="btn btn-outline btn-sm" data-tab="photo">📷 Photo</button>
  <button class="btn btn-outline btn-sm" data-tab="password">🔒 Change Password</button>
</div>

<!-- ============ TAB: DETAILS ============ -->
<section class="panel" id="pf-tab-details">
  <div class="panel-head"><h3>Personal Information</h3></div>
  <div class="panel-body">
    <form id="pf-details-form" onsubmit="return false;">

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" name="firstName" required />
        </div>
        <div class="form-group">
          <label>Middle Name</label>
          <input type="text" name="middleName" />
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" name="lastName" required />
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div class="form-group">
          <label>🔒 Email <span class="locked-hint">(cannot be changed)</span></label>
          <input type="email" name="email" disabled readonly />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" name="phone" placeholder="+234…" />
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
        <div class="form-group">
          <label>Gender</label>
          <select name="gender">
            <option value="">— Select —</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" name="dateOfBirth" />
        </div>
        <div class="form-group">
          <label>Nationality</label>
          <input type="text" name="nationality" placeholder="Nigerian" />
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div class="form-group">
          <label>State of Origin</label>
          <input type="text" name="stateOfOrigin" placeholder="e.g. Cross River" />
        </div>
        <div class="form-group">
          <label>🔒 Department <span class="locked-hint">(assigned by admin)</span></label>
          <input type="text" name="departmentName" disabled readonly />
        </div>
      </div>

      <div class="form-group">
        <label>Address</label>
        <textarea name="address" rows="2" placeholder="Residential address…"></textarea>
      </div>

      <div class="quick-actions" style="margin-top:1rem;">
        <button class="btn btn-primary btn-sm" id="pf-save-btn">💾 Save Changes</button>
        <button class="btn btn-outline btn-sm" id="pf-reset-btn">↺ Reset</button>
      </div>
    </form>
  </div>
</section>

<!-- ============ TAB: PHOTO ============ -->
<section class="panel" id="pf-tab-photo" style="display:none;">
  <div class="panel-head"><h3>Profile Photo</h3></div>
  <div class="panel-body">
    <p class="muted small" style="margin-top:0;">This photo appears in the sidebar, topbar, and everywhere in the system.</p>

    <input type="file" id="pf-file" accept="image/jpeg,image/jpg,image/png,image/webp" style="display:none;" />

    <div id="pf-photo-wrap" style="text-align:center;padding:1rem 0;">
      <img id="pf-photo-img" src="" alt="" style="display:none;width:160px;height:160px;border-radius:50%;object-fit:cover;margin:0 auto;border:4px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.1);" />
      <div id="pf-photo-placeholder" style="width:160px;height:160px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:3rem;color:#94a3b8;">📷</div>
    </div>

    <div class="quick-actions" style="justify-content:center;">
      <button class="btn btn-primary btn-sm" id="pf-photo-upload">📁 Upload Photo</button>
      <button class="btn btn-outline btn-sm" id="pf-photo-remove" style="display:none;">🗑 Remove</button>
    </div>

    <div id="pf-photo-progress" style="display:none;margin-top:1rem;">
      <div style="height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;">
        <div id="pf-photo-progress-bar" style="height:100%;width:0%;background:var(--fpu-primary);transition:width .2s;"></div>
      </div>
      <div style="font-size:12px;color:#64748b;margin-top:.35rem;text-align:center;" id="pf-photo-progress-text">Uploading…</div>
    </div>
  </div>
</section>

<!-- ============ TAB: PASSWORD ============ -->
<section class="panel" id="pf-tab-password" style="display:none;">
  <div class="panel-head"><h3>Change Password</h3></div>
  <div class="panel-body">
    <form id="pf-password-form" onsubmit="return false;">

      <div class="form-group">
        <label>Current Password *</label>
        <input type="password" name="currentPassword" required autocomplete="current-password" />
      </div>

      <div class="form-group">
        <label>New Password *</label>
        <input type="password" name="newPassword" required minlength="8" autocomplete="new-password" />
        <div style="margin-top:.35rem;height:4px;background:#e5e7eb;border-radius:2px;overflow:hidden;">
          <div id="pf-strength-bar" style="height:100%;width:0%;background:#dc2626;transition:all .2s;"></div>
        </div>
        <div id="pf-strength-text" style="font-size:11.5px;color:#94a3b8;margin-top:.25rem;">Min 8 characters</div>
      </div>

      <div class="form-group">
        <label>Confirm New Password *</label>
        <input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password" />
      </div>

      <div class="quick-actions" style="margin-top:1rem;">
        <button class="btn btn-primary btn-sm" id="pf-password-btn">🔒 Update Password</button>
      </div>
    </form>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let USER = core.getPortalUser ? core.getPortalUser() : {};
  let ORIGINAL = {};

  // ---------------------------------------------------------
  // Tabs
  // ---------------------------------------------------------
  document.querySelectorAll('[data-tab]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.tab;
      document.querySelectorAll('[data-tab]').forEach((b) => {
        b.className = b.dataset.tab === tab ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      });
      ['details','photo','password'].forEach((t) => {
        const el = $('pf-tab-' + t);
        if (el) el.style.display = (t === tab) ? '' : 'none';
      });
    });
  });

  // ---------------------------------------------------------
  // Avatar / name header
  // ---------------------------------------------------------
  function refreshHeader(u) {
    if (!u) return;
    const name = `${u.firstName || ''} ${u.lastName || ''}`.trim() || 'My Profile';
    $('pf-name').textContent = name;
    const deptName = u.departmentName || (function () {
      try {
        const raw = localStorage.getItem('portal_user') || localStorage.getItem('fpu_portal_user');
        if (!raw) return '';
        return JSON.parse(raw).departmentName || '';
      } catch { return ''; }
    })();
    $('pf-sub').textContent = deptName
      ? `${deptName} · ${u.role || ''}`
      : (u.role || '');
    $('pf-role-badge').textContent = u.role || '—';
    if (window.FPU_PHOTO && window.FPU_PHOTO.renderMyAvatar) {
      window.FPU_PHOTO.renderMyAvatar($('pf-avatar'), u);
    } else {
      $('pf-avatar').textContent = (u.firstName || 'U')[0].toUpperCase();
    }
  }

  // ---------------------------------------------------------
  // Populate details form
  // ---------------------------------------------------------
  function fillForm(u) {
    const f = $('pf-details-form');
    if (!f || !u) return;
    f.firstName.value      = u.firstName || '';
    f.middleName.value     = u.middleName || '';
    f.lastName.value       = u.lastName || '';
    f.email.value          = u.email || '';
    f.phone.value          = u.phone || '';
    f.gender.value         = u.gender || '';
    f.dateOfBirth.value    = u.dateOfBirth ? String(u.dateOfBirth).slice(0, 10) : '';
    f.nationality.value    = u.nationality || '';
    f.stateOfOrigin.value  = u.stateOfOrigin || '';
    f.departmentName.value =
      u.departmentName ||
      (function () {
        try {
          const raw = localStorage.getItem('portal_user') || localStorage.getItem('fpu_portal_user');
          if (!raw) return '';
          const cached = JSON.parse(raw);
          return cached.departmentName || '';
        } catch { return ''; }
      })();
    f.address.value        = u.address || '';

    ORIGINAL = {
      firstName: u.firstName || '',
      middleName: u.middleName || '',
      lastName: u.lastName || '',
      phone: u.phone || '',
      gender: u.gender || '',
      dateOfBirth: u.dateOfBirth ? String(u.dateOfBirth).slice(0, 10) : '',
      nationality: u.nationality || '',
      stateOfOrigin: u.stateOfOrigin || '',
      address: u.address || '',
    };
  }

  // ---------------------------------------------------------
  // Load full profile from server
  // ---------------------------------------------------------
  async function loadProfile() {
    try {
      const res = await core.portalFetch('/api/portal/profile');
      const u = res.data || res;
      USER = u;
      refreshHeader(u);
      fillForm(u);

      // Load photo
      if (u.photoUrl) {
        $('pf-photo-img').src = u.photoUrl;
        $('pf-photo-img').style.display = 'block';
        $('pf-photo-placeholder').style.display = 'none';
        $('pf-photo-remove').style.display = 'inline-flex';
      } else {
        $('pf-photo-img').style.display = 'none';
        $('pf-photo-placeholder').style.display = 'flex';
        $('pf-photo-remove').style.display = 'none';
      }
    } catch (err) {
      core.showToast && core.showToast(err.message || 'Failed to load profile', 'error');
    }
  }

  // ---------------------------------------------------------
  // Save details
  // ---------------------------------------------------------
  $('pf-save-btn').addEventListener('click', async () => {
    const f = $('pf-details-form');
    const patch = {};
    const fields = ['firstName','middleName','lastName','phone','gender','dateOfBirth','nationality','stateOfOrigin','address'];

    fields.forEach((k) => {
      const v = f[k].value.trim();
      if (v !== (ORIGINAL[k] || '')) patch[k] = v;
    });

    if (!Object.keys(patch).length) {
      core.showToast && core.showToast('No changes to save', 'info');
      return;
    }

    const btn = $('pf-save-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await core.portalFetch('/api/portal/profile', {
        method: 'PATCH',
        body: patch,
      });
      const updated = res.data || res;
      USER = updated;

      // Update localStorage
      try {
        for (const k of ['portal_user', 'fpu_portal_user', 'fpu_admin_user']) {
          const raw = localStorage.getItem(k);
          if (!raw) continue;
          const u = JSON.parse(raw);
          Object.assign(u, patch);
          localStorage.setItem(k, JSON.stringify(u));
        }
      } catch {}

      refreshHeader(updated);
      fillForm(updated);
      core.showToast && core.showToast('Profile saved', 'success');
    } catch (err) {
      core.showToast && core.showToast(err.message || 'Save failed', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 Save Changes';
    }
  });

  // Reset button
  $('pf-reset-btn').addEventListener('click', () => fillForm(USER));

  // ---------------------------------------------------------
  // Photo tab
  // ---------------------------------------------------------
  $('pf-photo-upload').addEventListener('click', () => $('pf-file').click());

  $('pf-file').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;

    // Validate
    if (!['image/jpeg','image/jpg','image/png','image/webp'].includes(file.type)) {
      core.showToast && core.showToast('Invalid format. Use JPEG, PNG, or WebP.', 'error');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      core.showToast && core.showToast('File too large. Max 5 MB.', 'error');
      return;
    }

    // Show preview immediately
    const reader = new FileReader();
    reader.onload = (ev) => {
      $('pf-photo-img').src = ev.target.result;
      $('pf-photo-img').style.display = 'block';
      $('pf-photo-placeholder').style.display = 'none';
    };
    reader.readAsDataURL(file);

    // Upload
    const token = localStorage.getItem('fpu_portal_token') || localStorage.getItem('portal_token');
    const fd = new FormData();
    fd.append('photo', file);

    $('pf-photo-progress').style.display = 'block';
    $('pf-photo-progress-bar').style.width = '0%';
    $('pf-photo-progress-text').textContent = 'Uploading… 0%';

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/portal/profile/photo');
    if (token) xhr.setRequestHeader('Authorization', 'Bearer ' + token);

    xhr.upload.onprogress = (ev) => {
      if (ev.lengthComputable) {
        const pct = Math.round((ev.loaded / ev.total) * 100);
        $('pf-photo-progress-bar').style.width = pct + '%';
        $('pf-photo-progress-text').textContent = `Uploading… ${pct}%`;
      }
    };

    xhr.onload = () => {
      $('pf-photo-progress').style.display = 'none';
      let json = {};
      try { json = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status >= 200 && xhr.status < 300 && json.success) {
        const url = (json.data && json.data.photoUrl) || '';
        USER.photoUrl = url;
        refreshHeader(USER);

        try {
          for (const k of ['portal_user','fpu_portal_user','fpu_admin_user']) {
            const raw = localStorage.getItem(k);
            if (!raw) continue;
            const u = JSON.parse(raw);
            u.photoUrl = url;
            localStorage.setItem(k, JSON.stringify(u));
          }
        } catch {}

        // Refresh topbar
        const topbar = document.getElementById('topbar-avatar');
        if (topbar && window.FPU_PHOTO) window.FPU_PHOTO.renderMyAvatar(topbar, USER);

        $('pf-photo-remove').style.display = 'inline-flex';
        core.showToast && core.showToast('Photo updated', 'success');
      } else {
        core.showToast && core.showToast(json.error || 'Upload failed', 'error');
      }
    };

    xhr.onerror = () => {
      $('pf-photo-progress').style.display = 'none';
      core.showToast && core.showToast('Network error', 'error');
    };

    xhr.send(fd);
  });

  $('pf-photo-remove').addEventListener('click', async () => {
    if (!confirm('Remove your profile photo?')) return;
    try {
      await core.portalFetch('/api/portal/profile/photo', { method: 'DELETE' });
      USER.photoUrl = null;
      $('pf-photo-img').style.display = 'none';
      $('pf-photo-placeholder').style.display = 'flex';
      $('pf-photo-remove').style.display = 'none';
      refreshHeader(USER);

      try {
        for (const k of ['portal_user','fpu_portal_user','fpu_admin_user']) {
          const raw = localStorage.getItem(k);
          if (!raw) continue;
          const u = JSON.parse(raw);
          u.photoUrl = null;
          localStorage.setItem(k, JSON.stringify(u));
        }
      } catch {}

      const topbar = document.getElementById('topbar-avatar');
      if (topbar && window.FPU_PHOTO) window.FPU_PHOTO.renderMyAvatar(topbar, USER);

      core.showToast && core.showToast('Photo removed', 'success');
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  });

  // ---------------------------------------------------------
  // Password strength
  // ---------------------------------------------------------
  const pwInput = document.querySelector('#pf-password-form [name="newPassword"]');
  pwInput.addEventListener('input', () => {
    const v = pwInput.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[a-z]/.test(v)) score++;
    if (/\d/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    const bar = $('pf-strength-bar');
    const txt = $('pf-strength-text');
    const levels = [
      { w: '0%',   c: '#dc2626', t: 'Min 8 characters' },
      { w: '25%',  c: '#dc2626', t: 'Weak' },
      { w: '50%',  c: '#f59e0b', t: 'Fair' },
      { w: '75%',  c: '#10b981', t: 'Good' },
      { w: '100%', c: '#065f46', t: 'Strong' },
      { w: '100%', c: '#065f46', t: 'Very Strong' },
    ];
    const l = levels[score] || levels[0];
    bar.style.width = l.w;
    bar.style.background = l.c;
    txt.textContent = l.t;
    txt.style.color = l.c;
  });

  // ---------------------------------------------------------
  // Change password
  // ---------------------------------------------------------
  $('pf-password-btn').addEventListener('click', async () => {
    const f = $('pf-password-form');
    const currentPassword = f.currentPassword.value;
    const newPassword = f.newPassword.value;
    const confirmPassword = f.confirmPassword.value;

    if (!currentPassword || !newPassword || !confirmPassword) {
      core.showToast && core.showToast('Fill in all password fields', 'error');
      return;
    }
    if (newPassword !== confirmPassword) {
      core.showToast && core.showToast('New passwords do not match', 'error');
      return;
    }
    if (newPassword.length < 8) {
      core.showToast && core.showToast('New password must be at least 8 characters', 'error');
      return;
    }

    const btn = $('pf-password-btn');
    btn.disabled = true;
    btn.textContent = 'Updating…';

    try {
      await core.portalFetch('/api/portal/profile/change-password', {
        method: 'POST',
        body: { currentPassword, newPassword, confirmPassword },
      });
      f.reset();
      $('pf-strength-bar').style.width = '0%';
      $('pf-strength-text').textContent = 'Min 8 characters';
      $('pf-strength-text').style.color = '#94a3b8';
      core.showToast && core.showToast('Password updated successfully', 'success');
    } catch (err) {
      core.showToast && core.showToast(err.message || 'Update failed', 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '🔒 Update Password';
    }
  });

  // ---------------------------------------------------------
  // Go
  // ---------------------------------------------------------
  loadProfile();
})();
</script>
