<section class="greeting">
  <div class="who">
    <div class="avatar" id="pf-avatar">U</div>
    <div>
      <h1 id="pf-name">My Profile</h1>
      <div class="sub" id="pf-role">—</div>
    </div>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Account Details</h3></div>
  <div class="panel-body">
    <div class="fees-breakdown" id="pf-details">
      <div class="muted small">Loading…</div>
    </div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const u = core.getPortalUser() || {};
    document.getElementById('pf-name').textContent =
      `${u.firstName || ''} ${u.lastName || ''}`.trim() || 'My Profile';
    document.getElementById('pf-role').textContent = u.role || '';
    document.getElementById('pf-details').innerHTML = `
      <div class="fees-row"><span>Email</span><strong>${u.email || '—'}</strong></div>
      <div class="fees-row"><span>Role</span><strong>${u.role || '—'}</strong></div>
      <div class="fees-row"><span>Department</span><strong>${u.departmentName || '—'}</strong></div>
      <div class="fees-row"><span>ID</span><strong>${u.matricNumber || u.staffId || '—'}</strong></div>
    `;
  })();
</script>
