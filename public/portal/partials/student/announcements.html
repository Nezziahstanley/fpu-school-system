<!-- Portal → Student → Announcements -->
<section class="page-head">
  <div><h2>Announcements</h2><p class="muted small">News for students</p></div>
</section>

<div id="stud-ann-list" class="grid" style="gap:1rem;">
  <div class="loading"><span class="spinner"></span> Loading…</div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const box = document.getElementById('stud-ann-list');
    try {
      const res = await core.portalFetch('/api/portal/announcements');
      const rows = res.data || [];
      box.innerHTML = rows.length ? rows.map((r) => {
        const a = r.announcement || r;
        return `<article class="panel">
          <div class="panel-body">
            <span class="badge badge-${a.priority === 'high' ? 'danger' : a.priority === 'low' ? 'muted' : 'info'}">${core.escapeHtml(a.priority || 'normal')}</span>
            <h3 style="margin:.5rem 0 .3rem;">${core.escapeHtml(a.title)}</h3>
            <p>${core.escapeHtml(a.body || '')}</p>
            <div class="small muted">${core.formatDateTime(a.publishedAt)}</div>
          </div>
        </article>`;
      }).join('') : '<p class="muted">No announcements.</p>';
    } catch (err) { box.innerHTML = `<div class="alert alert-danger">${core.escapeHtml(err.message)}</div>`; }
  })();
</script>
