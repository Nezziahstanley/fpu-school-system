<!-- Portal → Student → Assignments -->
<section class="page-head" style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;">
  <div>
    <h2 style="margin:0;">My Assignments</h2>
    <p class="muted small" style="margin:.25rem 0 0;">Submit and track graded work</p>
  </div>
  <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
    <input type="search" id="sa-search" placeholder="🔍  Search…"
           style="max-width:200px;padding:.45rem .7rem;font-size:.85rem;border:1px solid #e5e7eb;border-radius:8px;" />
    <button class="btn btn-outline btn-sm" id="sa-refresh" style="display:flex;align-items:center;gap:.3rem;">↻ Refresh</button>
  </div>
</section>

<!-- Filter tabs -->
<div id="sa-tabs" style="display:flex;gap:.4rem;margin-bottom:1rem;flex-wrap:wrap;">
  <button class="sa-tab active" data-filter="all">All <span class="sa-count" id="cnt-all">0</span></button>
  <button class="sa-tab" data-filter="pending">📝 Pending <span class="sa-count" id="cnt-pending">0</span></button>
  <button class="sa-tab" data-filter="submitted">✅ Submitted <span class="sa-count" id="cnt-submitted">0</span></button>
  <button class="sa-tab" data-filter="overdue">⚠️ Overdue <span class="sa-count" id="cnt-overdue">0</span></button>
</div>

<!-- Summary bar -->
<div id="sa-summary" style="
  display:none;
  padding:.65rem .9rem;
  background:#fef3c7;
  border:1px solid #fde68a;
  border-radius:10px;
  font-size:.8rem;
  color:#78350f;
  margin-bottom:1rem;
  align-items:center;
  gap:.5rem;
"></div>

<!-- List -->
<div id="sa-list"></div>

<style>
  .sa-tab {
    padding:.4rem .8rem;
    font-size:.78rem;
    font-weight:600;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:99px;
    color:#64748b;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:.4rem;
    transition:all .15s;
  }
  .sa-tab:hover { background:#f9fafb; }
  .sa-tab.active {
    background:#065f46;
    color:#fff;
    border-color:#065f46;
  }
  .sa-tab.active .sa-count { background:rgba(255,255,255,.25); color:#fff; }
  .sa-count {
    display:inline-block;
    padding:1px 7px;
    font-size:.7rem;
    background:#f1f5f9;
    color:#64748b;
    border-radius:99px;
    font-weight:700;
  }
  .sa-card {
    position:relative;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:.75rem;
    overflow:hidden;
    transition:box-shadow .15s, transform .15s;
  }
  .sa-card:hover {
    box-shadow:0 8px 20px rgba(6,95,70,.08);
    transform:translateY(-1px);
  }
  .sa-card.overdue { border-left:5px solid #ef4444; }
  .sa-card.pending { border-left:5px solid #f59e0b; }
  .sa-card.submitted { border-left:5px solid #10b981; }
  .sa-card.graded { border-left:5px solid #3b82f6; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => core.formatDateTime ? core.formatDateTime(d) : (d ? new Date(d).toLocaleString() : '—');
  const timeAgo = (d) => core.timeAgo ? core.timeAgo(d) : '';

  let ALL = [];
  let CURRENT_FILTER = 'all';

  // ─── Compute assignment state ───
  function stateOf(row) {
    const a = row.assignment || {};
    const s = row.submission || null;
    const now = new Date();
    const due = a.dueDate ? new Date(a.dueDate) : null;

    if (s && s.score !== null && s.score !== undefined) return 'graded';
    if (s) return 'submitted';
    if (due && due < now) return 'overdue';
    return 'pending';
  }

  // ─── Days until / since due ───
  function dueLabel(dueDate) {
    if (!dueDate) return { text: '—', tone: 'muted' };
    const due = new Date(dueDate);
    const now = new Date();
    const ms = due - now;
    const days = Math.ceil(ms / (1000 * 60 * 60 * 24));

    if (ms < 0) {
      const past = Math.abs(days);
      return { text: `Overdue by ${past} day${past === 1 ? '' : 's'}`, tone: 'danger' };
    }
    if (days === 0) return { text: 'Due today', tone: 'warn' };
    if (days === 1) return { text: 'Due tomorrow', tone: 'warn' };
    if (days <= 3) return { text: `Due in ${days} days`, tone: 'warn' };
    return { text: `Due in ${days} days`, tone: 'ok' };
  }

  // ─── Render one assignment ───
  function renderAssignment(row) {
    const a = row.assignment || {};
    const s = row.submission || null;
    const state = stateOf(row);
    const due = dueLabel(a.dueDate);

    const stateBadge = {
      pending:   { text: '⏳ Pending', cls: 'background:#fef3c7;color:#92400e;' },
      submitted: { text: '✅ Submitted', cls: 'background:#d1fae5;color:#065f46;' },
      overdue:   { text: '⚠️ Overdue', cls: 'background:#fee2e2;color:#991b1b;' },
      graded:    { text: '🏆 Graded', cls: 'background:#dbeafe;color:#1e40af;' },
    }[state];

    const toneColor = { danger: '#dc2626', warn: '#d97706', ok: '#059669', muted: '#64748b' }[due.tone];

    // Graded score display
    const scoreBlock = (s && s.score !== null && s.score !== undefined) ? `
      <div style="
        margin-top:.6rem;padding:.6rem .75rem;
        background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;
        display:flex;align-items:center;gap:.75rem;
      ">
        <div style="
          width:44px;height:44px;border-radius:50%;
          background:#dbeafe;color:#1e40af;
          display:flex;align-items:center;justify-content:center;
          font-weight:800;font-size:.85rem;flex-shrink:0;
        ">${Number(s.score)}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:.8rem;color:#1e40af;font-weight:700;">
            Score: ${Number(s.score)} / ${a.maxScore || 100}
          </div>
          ${s.feedback ? `
            <div style="font-size:.75rem;color:#475569;margin-top:.15rem;line-height:1.4;">
              <strong>Feedback:</strong> ${esc(s.feedback)}
            </div>` : ''}
        </div>
      </div>` : '';

    // Existing submission info
    const submittedBlock = (s && !(s.score !== null && s.score !== undefined)) ? `
      <div style="
        margin-top:.6rem;padding:.55rem .75rem;
        background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;
        font-size:.78rem;color:#14532d;
      ">
        <strong>Submitted:</strong> ${esc(fmtDate(s.submittedAt))}
        ${s.submissionText ? `<div style="margin-top:.35rem;color:#374151;white-space:pre-wrap;">${esc(s.submissionText.slice(0, 300))}${s.submissionText.length > 300 ? '…' : ''}</div>` : ''}
        ${s.submissionUrl ? `<div style="margin-top:.35rem;"><a href="${esc(s.submissionUrl)}" target="_blank" rel="noopener" style="color:#065f46;">🔗 ${esc(s.submissionUrl.slice(0, 60))}</a></div>` : ''}
      </div>` : '';

    // Submission form (only if not yet graded)
    const submitForm = (state !== 'graded') ? `
      <details style="margin-top:.65rem;" ${!s ? '' : ''}>
        <summary style="
          cursor:pointer;font-size:.78rem;font-weight:700;color:#065f46;
          padding:.35rem 0;user-select:none;
          list-style:none;
        ">
          ${s ? '📝 Update submission' : '📤 Submit work'}
        </summary>
        <form class="sa-submit-form" data-id="${a.id}" style="margin-top:.5rem;">
          <textarea name="submissionText" rows="3" placeholder="Type your answer or paste a link…"
            style="
              width:100%;padding:.6rem .75rem;font-size:.8rem;
              border:1px solid #d1d5db;border-radius:8px;
              font-family:inherit;resize:vertical;line-height:1.5;
            ">${s ? esc(s.submissionText || '') : ''}</textarea>
          <div style="display:flex;gap:.5rem;margin-top:.5rem;">
            <input type="url" name="submissionUrl" placeholder="Or paste a URL (optional)"
              value="${s ? esc(s.submissionUrl || '') : ''}"
              style="
                flex:1;padding:.5rem .7rem;font-size:.78rem;
                border:1px solid #d1d5db;border-radius:8px;
              " />
            <button type="submit"
              style="
                padding:.5rem 1rem;font-size:.78rem;font-weight:700;
                background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;
                transition:background .15s;
              "
              onmouseover="this.style.background='#047857';"
              onmouseout="this.style.background='#065f46';">
              Submit
            </button>
          </div>
        </form>
      </details>` : '';

    return `
      <div class="sa-card ${state}" data-state="${state}" data-id="${a.id}"
           data-search="${esc((a.title + ' ' + (a.description || '')).toLowerCase())}">

        <!-- HEADER ROW -->
        <div style="
          display:flex;justify-content:space-between;align-items:flex-start;
          gap:.75rem;padding:.9rem 1rem .5rem;
        ">
          <div style="min-width:0;flex:1;">
            <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.35rem;">
              ${a.courseCode ? `
                <span style="
                  font-size:.65rem;font-weight:800;letter-spacing:.05em;
                  background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;
                  padding:2px 7px;border-radius:5px;
                ">${esc(a.courseCode)}</span>` : ''}
              <span style="
                font-size:.65rem;font-weight:800;letter-spacing:.05em;
                ${stateBadge.cls}
                padding:2px 8px;border-radius:99px;
              ">${stateBadge.text}</span>
            </div>
            <h3 style="margin:0;font-size:.95rem;color:#0f172a;line-height:1.3;">
              ${esc(a.title || 'Untitled assignment')}
            </h3>
          </div>
        </div>

        <!-- BODY -->
        <div style="padding:0 1rem 1rem;">

          ${a.description ? `
            <p style="margin:.35rem 0 0;font-size:.8rem;color:#64748b;line-height:1.5;">
              ${esc(a.description)}
            </p>` : ''}

          <!-- META ROW -->
          <div style="
            display:flex;gap:.75rem;flex-wrap:wrap;
            margin-top:.65rem;padding-top:.6rem;
            border-top:1px dashed #e5e7eb;
            font-size:.72rem;color:#64748b;
          ">
            <span style="display:flex;align-items:center;gap:.3rem;">
              📅 <strong style="color:${toneColor};font-weight:700;">${esc(due.text)}</strong>
            </span>
            <span style="display:flex;align-items:center;gap:.3rem;">
              🕐 Due ${esc(fmtDate(a.dueDate))}
            </span>
            <span style="display:flex;align-items:center;gap:.3rem;">
              🎯 Max ${esc(a.maxScore || 100)} pts
            </span>
          </div>

          ${scoreBlock}
          ${submittedBlock}
          ${submitForm}

        </div>
      </div>`;
  }

  // ─── Apply filter ───
  function applyFilter() {
    const q = ($('sa-search')?.value || '').trim().toLowerCase();
    const list = $('sa-list');

    let rows = ALL;
    if (CURRENT_FILTER !== 'all') {
      rows = rows.filter((r) => stateOf(r) === CURRENT_FILTER);
    }
    if (q) {
      rows = rows.filter((r) => {
        const a = r.assignment || {};
        const haystack = `${a.title || ''} ${a.description || ''} ${a.courseCode || ''}`.toLowerCase();
        return haystack.includes(q);
      });
    }

    if (!rows.length) {
      list.innerHTML = `
        <div style="
          text-align:center;padding:3rem 1rem;
          background:#fff;border:1px dashed #d1d5db;border-radius:14px;
        ">
          <div style="font-size:3rem;margin-bottom:.65rem;">${q || CURRENT_FILTER !== 'all' ? '🔍' : '📭'}</div>
          <h3 style="margin:0 0 .35rem;color:#0f172a;font-size:1rem;">
            ${q ? 'No matches' : CURRENT_FILTER !== 'all' ? `No ${CURRENT_FILTER} assignments` : 'No assignments yet'}
          </h3>
          <p class="muted small" style="margin:0;max-width:380px;margin:0 auto;line-height:1.55;">
            ${q
              ? 'Try a different search term.'
              : CURRENT_FILTER !== 'all'
                ? `You have no ${CURRENT_FILTER} assignments right now.`
                : 'Assignments will appear here once your lecturers create them for your registered courses.'}
          </p>
        </div>`;
      return;
    }

    list.innerHTML = rows.map(renderAssignment).join('');
    wireForms();
  }

  // ─── Wire up submission forms ───
  function wireForms() {
    document.querySelectorAll('.sa-submit-form').forEach((f) => {
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = f.dataset.id;
        const text = f.querySelector('[name="submissionText"]')?.value?.trim() || '';
        const url  = f.querySelector('[name="submissionUrl"]')?.value?.trim() || '';

        if (!text && !url) {
          core.showToast && core.showToast('Please enter text or a URL before submitting.', 'warning');
          return;
        }

        const btn = f.querySelector('button[type="submit"]');
        const original = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Submitting…';

        try {
          await core.portalFetch(`/api/student/assignments/${id}/submit`, {
            method: 'POST',
            body: { submissionText: text, submissionUrl: url },
          });
          core.showToast && core.showToast('Assignment submitted successfully.', 'success');
          load();
        } catch (err) {
          core.showToast && core.showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = original;
        }
      });
    });
  }

  // ─── Counts + summary bar ───
  function updateCounts() {
    const counts = { all: ALL.length, pending: 0, submitted: 0, overdue: 0, graded: 0 };
    for (const r of ALL) {
      const s = stateOf(r);
      if (s === 'graded') counts.submitted++; // count graded as submitted too
      else if (counts[s] !== undefined) counts[s]++;
    }

    $('cnt-all').textContent = counts.all;
    $('cnt-pending').textContent = counts.pending;
    $('cnt-submitted').textContent = counts.submitted;
    $('cnt-overdue').textContent = counts.overdue;

    // Summary bar with urgency
    const bar = $('sa-summary');
    const urgent = counts.overdue + counts.pending;
    if (!ALL.length) { bar.style.display = 'none'; return; }

    if (counts.overdue > 0) {
      bar.style.background = '#fef2f2';
      bar.style.borderColor = '#fecaca';
      bar.style.color = '#991b1b';
      bar.innerHTML = `🚨 You have <strong>${counts.overdue} overdue</strong> assignment${counts.overdue === 1 ? '' : 's'}. Submit as soon as possible.`;
      bar.style.display = 'flex';
    } else if (counts.pending > 0) {
      bar.style.background = '#fef3c7';
      bar.style.borderColor = '#fde68a';
      bar.style.color = '#78350f';
      bar.innerHTML = `⏳ You have <strong>${counts.pending} pending</strong> assignment${counts.pending === 1 ? '' : 's'} to submit.`;
      bar.style.display = 'flex';
    } else {
      bar.style.background = '#f0fdf4';
      bar.style.borderColor = '#bbf7d0';
      bar.style.color = '#14532d';
      bar.innerHTML = `✅ All caught up! You've submitted everything.`;
      bar.style.display = 'flex';
    }
  }

  // ─── Load ───
  async function load() {
    const list = $('sa-list');
    list.innerHTML = `
      <div style="text-align:center;padding:3rem 1rem;">
        <div style="
          width:36px;height:36px;border:3px solid #e2e8f0;
          border-top-color:#065f46;border-radius:50%;
          animation:spin .8s linear infinite;margin:0 auto;
        "></div>
        <p class="muted small" style="margin-top:.75rem;">Loading assignments…</p>
      </div>`;

    try {
      const res = await core.portalFetch('/api/student/assignments');
      ALL = res.data || [];
      updateCounts();
      applyFilter();
    } catch (err) {
      list.innerHTML = `
        <div style="
          padding:1rem;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;
          color:#991b1b;font-size:.85rem;
        ">
          ⚠️ ${esc(err.message)}
        </div>`;
    }
  }

  // ─── Spin keyframes ───
  if (!document.getElementById('sa-spin-style')) {
    const s = document.createElement('style');
    s.id = 'sa-spin-style';
    s.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
    document.head.appendChild(s);
  }

  // ─── Tabs ───
  document.querySelectorAll('.sa-tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.sa-tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      CURRENT_FILTER = btn.dataset.filter;
      applyFilter();
    });
  });

  // ─── Wire up ───
  $('sa-search')?.addEventListener('input', applyFilter);
  $('sa-refresh')?.addEventListener('click', load);

  window.__studAsgLoad = load;
  load();
})();
</script>
