<!-- Portal → Student → Assignments -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem;">
    <div>
      <h2 style="margin:0;font-size:1.4rem;font-weight:800;color:#0f172a;">My Assignments</h2>
      <p style="margin:.35rem 0 0;font-size:.85rem;color:#64748b;">Submit and track graded work</p>
    </div>
    <div style="display:flex;gap:.5rem;">
      <input type="search" id="asg-search" placeholder="Search…" style="padding:.55rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;width:200px;" />
      <button id="asg-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:flex;gap:.5rem;margin-bottom:1.25rem;flex-wrap:wrap;">
    <button class="filter-pill active" data-filter="all">All <span id="count-all">0</span></button>
    <button class="filter-pill" data-filter="pending">Pending <span id="count-pending">0</span></button>
    <button class="filter-pill" data-filter="submitted">Submitted <span id="count-submitted">0</span></button>
    <button class="filter-pill" data-filter="graded">Graded <span id="count-graded">0</span></button>
    <button class="filter-pill" data-filter="overdue">Overdue <span id="count-overdue">0</span></button>
  </div>

  <!-- ASSIGNMENTS LIST -->
  <div id="assignments-list" style="display:flex;flex-direction:column;gap:1rem;">
    <div style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading assignments…</div>
  </div>
</div>

<!-- MODAL: Submit Work -->
<div id="submit-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 id="submit-modal-title" style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Submit Assignment</h3>
      <button id="submit-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <input type="hidden" id="submit-assignment-id" />
      
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Notes / Text Answer (Optional)</label>
        <textarea id="submit-text" rows="3" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;resize:vertical;" placeholder="Type your answer here..."></textarea>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Upload File</label>
        <input type="file" id="submit-file" style="display:block;width:100%;padding:.75rem;border:1px dashed #cbd5e1;border-radius:8px;font-size:.85rem;" />
        <div style="font-size:.72rem;color:#94a3b8;margin-top:.3rem;">Upload a PDF, Word doc, or image of your work.</div>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="submit-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="submit-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Upload Submission</button>
      </div>
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block; width: 24px; height: 24px;
    border: 3px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .filter-pill {
    padding: .45rem .9rem; font-size: .8rem; font-weight: 700; border-radius: 99px;
    border: 1px solid #e5e7eb; background: #fff; cursor: pointer; color: #475569;
  }
  .filter-pill.active { background: #065f46; color: #fff; border-color: #065f46; }
  .filter-pill:hover:not(.active) { background: #f1f5f9; }

  .asg-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem;
  }
  .asg-card.pending { border-left: 4px solid #f59e0b; }
  .asg-card.submitted { border-left: 4px solid #3b82f6; }
  .asg-card.graded { border-left: 4px solid #10b981; }
  .asg-card.overdue { border-left: 4px solid #ef4444; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  let ALL = [];
  let CURRENT_FILTER = 'all';

  function getStatus(a) {
    if (a.submission?.gradedAt) return 'graded';
    if (a.submission?.submittedAt) return 'submitted';
    if (a.dueDate && new Date(a.dueDate) < new Date()) return 'overdue';
    return 'pending';
  }

  function render() {
    const q = ($('asg-search').value || '').toLowerCase();
    const now = new Date();

    // Count statuses
    let all = ALL.length, pending = 0, submitted = 0, graded = 0, overdue = 0;
    ALL.forEach(a => {
      const s = getStatus(a);
      if (s === 'pending') pending++;
      else if (s === 'submitted') submitted++;
      else if (s === 'graded') graded++;
      else if (s === 'overdue') overdue++;
    });

    $('count-all').textContent = all;
    $('count-pending').textContent = pending;
    $('count-submitted').textContent = submitted;
    $('count-graded').textContent = graded;
    $('count-overdue').textContent = overdue;

    // Filter
    const filtered = ALL.filter(a => {
      const status = getStatus(a);
      if (CURRENT_FILTER !== 'all' && status !== CURRENT_FILTER) return false;
      if (q) {
        const hay = `${a.title} ${a.description} ${a.courseCode}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const list = $('assignments-list');
    if (!filtered.length) {
      list.innerHTML = '<div style="padding:3rem;text-align:center;color:#94a3b8;">No assignments found.</div>';
      return;
    }

    list.innerHTML = filtered.map(a => {
      const status = getStatus(a);
      const statusLabel = {
        pending: '⏳ Pending',
        submitted: '📤 Submitted',
        graded: '✅ Graded',
        overdue: '⚠️ Overdue',
      }[status];

      const sub = a.submission;
      let submissionBlock = '';

      if (sub?.gradedAt) {
        submissionBlock = `
          <div style="background:#ecfdf5;border:1px solid #bbf7d0;border-radius:8px;padding:.75rem;margin-top:.75rem;">
            <div style="font-weight:700;color:#065f46;font-size:.82rem;">✅ Graded</div>
            <div style="font-size:.78rem;color:#065f46;margin-top:.25rem;">
              Score: <strong>${esc(sub.score)} / ${esc(a.maxScore)}</strong>
            </div>
            ${sub.feedback ? `<div style="font-size:.78rem;color:#047857;margin-top:.25rem;">Feedback: ${esc(sub.feedback)}</div>` : ''}
          </div>
        `;
      } else if (sub?.submittedAt) {
        submissionBlock = `
          <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:.75rem;margin-top:.75rem;">
            <div style="font-weight:700;color:#1e40af;font-size:.82rem;">📤 Submitted</div>
            <div style="font-size:.78rem;color:#1e40af;margin-top:.25rem;">
              Submitted on ${fmtDate(sub.submittedAt)} — awaiting grading
            </div>
            ${sub.submissionUrl ? `<a href="${esc(sub.submissionUrl)}" target="_blank" style="font-size:.78rem;color:#1e40af;font-weight:700;">View Submission →</a>` : ''}
          </div>
        `;
      }

      const dueClass = status === 'overdue' ? 'style="color:#991b1b;font-weight:700;"' : '';

      return `
        <div class="asg-card ${status}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;">
            <div style="flex:1;">
              <div style="display:inline-block;padding:2px 8px;font-size:.65rem;font-weight:800;background:#fef3c7;color:#92400e;border-radius:4px;margin-bottom:.4rem;text-transform:uppercase;">${statusLabel}</div>
              <div style="font-size:1.05rem;font-weight:800;color:#0f172a;">${esc(a.title)}</div>
              <div style="font-size:.8rem;color:#64748b;margin-top:.2rem;">${esc(a.courseCode)} — ${esc(a.courseTitle)}</div>
              ${a.description ? `<div style="font-size:.82rem;color:#475569;margin-top:.5rem;">${esc(a.description)}</div>` : ''}
              <div style="display:flex;gap:1rem;margin-top:.75rem;font-size:.78rem;color:#64748b;">
                <span ${dueClass}>📅 Due: ${fmtDate(a.dueDate)}</span>
                <span>🎯 Max: ${esc(a.maxScore)} pts</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:.5rem;">
              ${a.attachmentUrl ? `<a href="${esc(a.attachmentUrl)}" target="_blank" style="padding:.35rem .7rem;font-size:.72rem;font-weight:700;background:#f1f5f9;color:#475569;border-radius:6px;text-decoration:none;text-align:center;">📎 View File</a>` : ''}
              <button class="btn-submit" data-id="${a.id}" style="padding:.4rem .8rem;font-size:.75rem;font-weight:700;background:${status === 'graded' ? '#e5e7eb' : '#065f46'};color:${status === 'graded' ? '#94a3b8' : '#fff'};border:none;border-radius:6px;cursor:${status === 'graded' ? 'not-allowed' : 'pointer'};" ${status === 'graded' ? 'disabled' : ''}>
                ${status === 'submitted' ? 'Resubmit' : status === 'overdue' ? 'Submit Late' : 'Submit Work'}
              </button>
            </div>
          </div>
          ${submissionBlock}
        </div>
      `;
    }).join('');

    // Wire submit buttons
    list.querySelectorAll('.btn-submit').forEach(btn => {
      btn.addEventListener('click', () => openSubmitModal(Number(btn.dataset.id)));
    });
  }

  async function load() {
    try {
      const res = await core.portalFetch('/api/student/assignments');
      ALL = res.data || [];
      render();
    } catch (err) {
      $('assignments-list').innerHTML = `<div style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</div>`;
    }
  }

  function openSubmitModal(assignmentId) {
    const a = ALL.find(x => x.id === assignmentId);
    if (!a) return;

    $('submit-modal').style.display = 'flex';
    $('submit-modal-title').textContent = a.title;
    $('submit-assignment-id').value = assignmentId;
    $('submit-text').value = a.submission?.submissionText || '';
    $('submit-file').value = '';
  }

  function closeSubmitModal() {
    $('submit-modal').style.display = 'none';
  }

  async function uploadSubmission() {
    const assignmentId = $('submit-assignment-id').value;
    const text = $('submit-text').value.trim();
    const file = $('submit-file').files[0];

    if (!text && !file) {
      return core.showToast && core.showToast('Please provide text or upload a file.', 'warning');
    }

    const btn = $('submit-save');
    btn.disabled = true;
    btn.textContent = 'Uploading…';

    try {
      const formData = new FormData();
      if (text) formData.append('text', text);
      if (file) formData.append('file', file);

      const token = localStorage.getItem('fpu_portal_token') || localStorage.getItem('portal_token');
      const res = await fetch(`/api/student/assignments/${assignmentId}/submit`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });

      const json = await res.json();
      if (!res.ok) throw new Error(json.error || 'Failed to submit');

      core.showToast && core.showToast('Assignment submitted successfully!', 'success');
      closeSubmitModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Upload Submission';
    }
  }

  // Wiring
  document.querySelectorAll('.filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      CURRENT_FILTER = btn.dataset.filter;
      render();
    });
  });

  $('asg-search')?.addEventListener('input', render);
  $('asg-refresh')?.addEventListener('click', load);
  $('submit-modal-close')?.addEventListener('click', closeSubmitModal);
  $('submit-cancel')?.addEventListener('click', closeSubmitModal);
  $('submit-save')?.addEventListener('click', uploadSubmission);
  $('submit-modal')?.addEventListener('click', (e) => { if (e.target.id === 'submit-modal') closeSubmitModal(); });

  load();
})();
</script>
