<!-- Portal → Student → Clearance -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">✅</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">My Clearance</div>
        <div style="font-size:.82rem;color:#d1fae5;">Clearance status and requests</div>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <button id="clr-request" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">📋 Request Clearance</button>
    <button id="clr-refresh" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📋</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-total">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total Requests</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">⏳</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-pending">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Pending</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">✅</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-approved">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Approved</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;color:#991b1b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">❌</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-rejected">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Rejected</div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">Clearance Records</div>
      <span class="badge" id="clr-count" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Type</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Session</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Requested</th>
          </tr>
        </thead>
        <tbody id="clr-tbody">
          <tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading clearance records…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL: Request Clearance -->
<div id="clr-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Request Clearance</h3>
      <button id="clr-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Clearance Type</label>
        <select id="clr-type" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Select Type</option>
          <option value="academic">Academic Clearance</option>
          <option value="financial">Financial Clearance</option>
          <option value="departmental">Departmental Clearance</option>
          <option value="library">Library Clearance</option>
          <option value="graduation">Graduation Clearance</option>
        </select>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="clr-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="clr-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Submit Request</button>
      </div>
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  let ALL = [];

  function render() {
    $('clr-count').textContent = ALL.length;

    let pending = 0, approved = 0, rejected = 0;
    ALL.forEach(r => {
      if (r.status === 'pending') pending++;
      else if (r.status === 'approved' || r.status === 'cleared') approved++;
      else if (r.status === 'rejected') rejected++;
    });

    $('stat-total').textContent = ALL.length;
    $('stat-pending').textContent = pending;
    $('stat-approved').textContent = approved;
    $('stat-rejected').textContent = rejected;

    const tbody = $('clr-tbody');
    if (!ALL.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;">No clearance requests yet. Click "Request Clearance" to start.</td></tr>';
      return;
    }

    tbody.innerHTML = ALL.map(r => {
      let badge = '';
      if (r.status === 'pending') badge = '<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Pending</span>';
      else if (r.status === 'approved' || r.status === 'cleared') badge = '<span style="background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Approved</span>';
      else if (r.status === 'rejected') badge = '<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Rejected</span>';
      else badge = `<span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">${esc(r.status)}</span>`;

      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;text-transform:capitalize;">${esc(r.type)}</td>
          <td style="padding:.65rem .75rem;color:#475569;">${esc(r.sessionName || r.session || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${badge}</td>
          <td style="padding:.65rem .75rem;text-align:right;color:#64748b;font-size:.75rem;">${fmtDate(r.createdAt || r.requestedAt)}</td>
        </tr>
      `;
    }).join('');
  }

  async function load() {
    $('clr-tbody').innerHTML = '<tr><td colspan="4" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading clearance records…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/clearance');
      ALL = res.data || [];
      render();
    } catch (err) {
      $('clr-tbody').innerHTML = `<tr><td colspan="4" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function openModal() {
    $('clr-modal').style.display = 'flex';
    $('clr-type').value = '';
  }

  function closeModal() {
    $('clr-modal').style.display = 'none';
  }

  async function submitRequest() {
    const type = $('clr-type').value;
    if (!type) return core.showToast && core.showToast('Please select a clearance type.', 'warning');

    const btn = $('clr-save');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      await core.portalFetch('/api/student/clearance/request', {
        method: 'POST',
        body: { type }
      });
      core.showToast && core.showToast('Clearance request submitted!', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Request';
    }
  }

  $('clr-request')?.addEventListener('click', openModal);
  $('clr-refresh')?.addEventListener('click', load);
  $('clr-modal-close')?.addEventListener('click', closeModal);
  $('clr-cancel')?.addEventListener('click', closeModal);
  $('clr-save')?.addEventListener('click', submitRequest);
  $('clr-modal')?.addEventListener('click', (e) => { if (e.target.id === 'clr-modal') closeModal(); });

  load();
})();
</script>
