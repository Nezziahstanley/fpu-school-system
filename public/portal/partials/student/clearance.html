<!-- Portal → Student → Clearance -->
<section class="greeting">
  <div class="who">
    <div class="avatar">✔️</div>
    <div>
      <h1>My Clearance</h1>
      <div class="sub">Clearance status and requests</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-primary btn-sm" id="sc-request">📝 Request Clearance</button>
  <button class="btn btn-outline btn-sm" id="sc-refresh">Refresh</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>Clearance Records</h3><span class="badge" id="sc-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Type</th><th>Session</th><th>Status</th><th>Requested</th></tr></thead>
        <tbody id="sc-tbody">
          <tr><td colspan="4" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  function unwrap(r) {
    const c = r.clearance || r;
    return {
      id: c.id,
      type: c.type || 'semester',
      sessionName: r.session?.name || c.sessionName || `Session ${c.sessionId}`,
      status: (c.status || 'pending').toLowerCase(),
      requestedAt: c.requestedAt || c.createdAt,
    };
  }

  function render(list) {
    const tbody = $('sc-tbody'), countEl = $('sc-count');
    if (countEl) countEl.textContent = list.length;
    if (!tbody) return;

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">No clearance requests yet. Click <strong>Request Clearance</strong> to start.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map((c) => {
      const badge = c.status === 'cleared' || c.status === 'approved' ? 'badge-active'
                   : c.status === 'rejected' ? 'badge-inactive'
                   : 'badge-warning';
      return `
        <tr>
          <td><strong>${esc(c.type)}</strong></td>
          <td>${esc(c.sessionName)}</td>
          <td><span class="badge-status ${badge}">${esc(c.status)}</span></td>
          <td>${c.requestedAt ? new Date(c.requestedAt).toLocaleDateString() : '—'}</td>
        </tr>`;
    }).join('');
  }

  async function load() {
    const tbody = $('sc-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="4" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/clearance');
      const raw = res.data || res || [];
      render(raw.map(unwrap));
    } catch (err) {
      console.warn('[student-clearance]', err.message);
      render([]);
    }
  }

  async function request() {
    if (!confirm('Request clearance for the current session?')) return;
    try {
      await core.portalFetch('/api/student/clearance/request', {
        method: 'POST',
        body: { type: 'semester' },
      });
      core.showToast && core.showToast('Clearance requested', 'success');
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  }

  $('sc-request')?.addEventListener('click', request);
  $('sc-refresh')?.addEventListener('click', load);
  load();
})();
</script>
