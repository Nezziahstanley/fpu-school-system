<!-- Portal → Student → Clearance -->
<section class="page-head">
  <div><h2>My Clearance</h2><p class="muted small">Semester clearance status</p></div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.__studClrLoad()">Refresh</button>
    <button class="btn btn-primary btn-sm" id="stud-clr-request">Request Clearance</button>
  </div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Clearance Records</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Type</th><th>Status</th><th>Cleared At</th><th>Remarks</th></tr></thead>
        <tbody id="stud-clr-tbody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__studClrLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('stud-clr-tbody');
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/clearance');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((c) => `
        <tr>
          <td>${core.escapeHtml(c.type)}</td>
          <td><span class="badge badge-${c.status === 'cleared' ? 'success' : c.status === 'rejected' ? 'danger' : 'warning'}">${core.escapeHtml(c.status)}</span></td>
          <td>${core.formatDateTime(c.clearedAt)}</td>
          <td>${core.escapeHtml(c.remarks || '')}</td>
        </tr>
      `).join('') : '<tr><td colspan="4" class="empty">No clearances.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="4" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };

  document.getElementById('stud-clr-request').addEventListener('click', async () => {
    const core = window.FPU_PORTAL;
    try {
      await core.portalFetch('/api/student/clearance/request', { method: 'POST' });
      core.showToast('Clearance requested.', 'success');
      window.__studClrLoad();
    } catch (err) { core.showToast(err.message, 'error'); }
  });

  window.__studClrLoad();
</script>
