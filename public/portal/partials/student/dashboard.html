<!-- Portal → Student → Dashboard -->
<section class="greeting">
  <div class="who">
    <div class="avatar" id="stu-dash-avatar">S</div>
    <div>
      <h1>Welcome, <span id="stu-dash-name">Student</span></h1>
      <div class="sub" id="stu-dash-matric">—</div>
    </div>
  </div>
  <div class="meta">
    <strong id="stu-dash-level">—</strong>
    <span>Level</span>
  </div>
</section>

<div class="tile-grid">
  <div class="tile"><div class="tile-label">Registered Courses</div><div class="tile-value" id="stu-t-courses">—</div></div>
  <div class="tile tile-blue"><div class="tile-label">Current GPA</div><div class="tile-value" id="stu-t-gpa">—</div></div>
  <div class="tile tile-accent"><div class="tile-label">CGPA</div><div class="tile-value" id="stu-t-cgpa">—</div></div>
  <div class="tile tile-purple"><div class="tile-label">Outstanding Fees (₦)</div><div class="tile-value" id="stu-t-fees">—</div></div>
</div>

<div class="quick-actions">
  <a class="btn btn-primary btn-sm" href="#student-registration">📝 Register Courses</a>
  <a class="btn btn-outline btn-sm" href="#student-results">📊 My Results</a>
  <a class="btn btn-outline btn-sm" href="#student-fees">💰 Fees</a>
  <a class="btn btn-outline btn-sm" href="#student-timetable">📅 Timetable</a>
</div>

<div class="panel">
  <div class="panel-head"><h3>My Courses This Semester</h3></div>
  <div class="panel-body">
    <div id="stu-courses-list" class="muted small">Loading…</div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Recent Results</h3></div>
  <div class="panel-body">
    <div id="stu-results-list" class="muted small">Loading…</div>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Latest Announcements</h3></div>
  <div class="panel-body">
    <div id="stu-announcements" class="muted small">Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const photo = window.FPU_PHOTO;
    const user = core.getPortalUser() || {};
    try {
      document.getElementById('stu-dash-name').textContent = user.firstName || 'Student';
      document.getElementById('stu-dash-matric').textContent = user.matricNumber || 'No matric number';
      document.getElementById('stu-dash-level').textContent = user.level ? ('Level ' + user.level) : '—';
      if (photo) photo.renderMyAvatar(document.getElementById('stu-dash-avatar'), user);

      // Registered courses
      try {
        const r = await core.portalFetch('/api/registrations?studentId=' + user.id);
        const list = r.data || r || [];
        document.getElementById('stu-t-courses').textContent = list.length;
        document.getElementById('stu-courses-list').innerHTML = list.length
          ? list.slice(0,8).map(x =>
              `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
                 <strong>${x.courseCode || ''}</strong> — ${x.courseTitle || ''}
                 <span class="muted small">· ${x.units || 0} units · ${x.status || ''}</span>
               </div>`).join('')
          : '<em>You have not registered any courses yet.</em>';
      } catch {
        document.getElementById('stu-courses-list').innerHTML = '<em>Could not load courses.</em>';
      }

      // Results
      try {
        const r = await core.portalFetch('/api/results?studentId=' + user.id);
        const list = r.data || r || [];
        document.getElementById('stu-results-list').innerHTML = list.length
          ? list.slice(0,5).map(x =>
              `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
                 <strong>${x.courseCode || ''}</strong> — ${x.courseTitle || ''}
                 <span class="muted small">· ${x.grade || '—'} · ${x.sessionName || ''}</span>
               </div>`).join('')
          : '<em>No results published yet.</em>';
      } catch {
        document.getElementById('stu-results-list').innerHTML = '<em>Could not load results.</em>';
      }

      // CGPA/GPA
      try {
        const t = await core.portalFetch('/api/transcript/' + user.id);
        const d = t.data || t || {};
        document.getElementById('stu-t-gpa').textContent  = d.gpa  != null ? Number(d.gpa).toFixed(2)  : '—';
        document.getElementById('stu-t-cgpa').textContent = d.cgpa != null ? Number(d.cgpa).toFixed(2) : '—';
      } catch {
        document.getElementById('stu-t-gpa').textContent = '—';
        document.getElementById('stu-t-cgpa').textContent = '—';
      }

      // Outstanding fees
      try {
        const p = await core.portalFetch('/api/payments?studentId=' + user.id);
        const list = p.data || p || [];
        const due = list
          .filter(x => x.status !== 'verified' && x.status !== 'paid')
          .reduce((s, x) => s + Number(x.amount || 0), 0);
        document.getElementById('stu-t-fees').textContent = due.toLocaleString();
      } catch { document.getElementById('stu-t-fees').textContent = '—'; }

      // Announcements
      try {
        const a = await core.portalFetch('/api/announcements?limit=3');
        const list = a.data || a || [];
        document.getElementById('stu-announcements').innerHTML = list.length
          ? list.slice(0,3).map(x =>
              `<div style="padding:.5rem 0;border-bottom:1px solid #eee;">
                 <strong>${x.title || 'Announcement'}</strong>
                 <div class="muted small">${(x.body || '').slice(0,120)}…</div>
               </div>`).join('')
          : '<em>No announcements.</em>';
      } catch {
        document.getElementById('stu-announcements').innerHTML = '<em>Could not load announcements.</em>';
      }
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  })();
</script>
