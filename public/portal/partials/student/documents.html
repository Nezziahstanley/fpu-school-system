<!-- Portal → Student → Documents -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📁</div>
    <div>
      <h1>My Documents</h1>
      <div class="sub">Request and download official documents</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-outline btn-sm" id="sd2-refresh">Refresh</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>My Document Requests</h3><span class="badge" id="sd2-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Type</th><th>Title</th><th>Status</th><th>Requested</th><th>Action</th></tr></thead>
        <tbody id="sd2-tbody">
          <tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  function unwrap(r) {
    const d = r.document || r;
    return {
      id: d.id,
      type: d.type || '—',
      title: d.title || '—',
      status: (d.status || 'pending').toLowerCase(),
      requestedAt: d.requestedAt || d.createdAt,
      fileUrl: d.fileUrl,
    };
  }

  function render(list) {
    const tbody = $('sd2-tbody'), countEl = $('sd2-count');
    if (countEl) countEl.textContent = list.length;
    if (!tbody) return;

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No documents requested yet.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map((d) => {
      const badge = d.status === 'issued' ? 'badge-active'
                   : d.status === 'rejected' ? 'badge-inactive'
                   : 'badge-warning';
      const action = d.status === 'issued' && d.fileUrl
        ? `<a class="btn btn-outline btn-xs" href="${esc(d.fileUrl)}" target="_blank">Download</a>`
        : '<span class="muted small">—</span>';
      return `
        <tr>
          <td><span class="chip chip-${esc(d.type)}">${esc(d.type)}</span></td>
          <td><strong>${esc(d.title)}</strong></td>
          <td><span class="badge-status ${badge}">${esc(d.status)}</span></td>
          <td>${d.requestedAt ? new Date(d.requestedAt).toLocaleDateString() : '—'}</td>
          <td>${action}</td>
        </tr>`;
    }).join('');
  }

  async function load() {
    const tbody = $('sd2-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/documents');
      const raw = res.data || res || [];
      render(raw.map(unwrap));
    } catch (err) {
      console.warn('[student-documents]', err.message);
      render([]);
    }
  }

  $('sd2-refresh')?.addEventListener('click', load);
  load();
})();
</script>
