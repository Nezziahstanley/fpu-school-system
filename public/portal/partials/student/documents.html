<!-- Portal → Student → Documents -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📄</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">My Documents</div>
        <div style="font-size:.82rem;color:#d1fae5;">Request and download official documents</div>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <button id="doc-request" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">📄 Request Document</button>
    <button id="doc-refresh" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">My Document Requests</div>
      <span class="badge" id="doc-count" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Type</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Requested</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="doc-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading documents…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL: Request Document -->
<div id="doc-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Request Document</h3>
      <button id="doc-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Document Type</label>
        <select id="doc-type" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Select Type</option>
          <option value="transcript">Academic Transcript</option>
          <option value="certificate">Certificate</option>
          <option value="attestation">Attestation Letter</option>
          <option value="id-card">ID Card Replacement</option>
          <option value="clearance">Clearance Certificate</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Title / Reason</label>
        <input type="text" id="doc-title" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" placeholder="e.g. Transcript for job application" />
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="doc-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="doc-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Submit Request</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: View Document -->
<div id="view-doc-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.85);backdrop-filter:blur(4px);z-index:99999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#f1f5f9;border-radius:12px;max-width:900px;width:100%;height:92vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <!-- Modal Header -->
    <div style="padding:1rem 1.5rem;background:#fff;border-bottom:1px solid #e2e8f0;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.1rem;font-weight:800;">Your Document</h3>
      <div style="display:flex;gap:0.5rem;">
        <button onclick="window.print()" style="padding:.4rem .8rem;font-size:.8rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #065f46;border-radius:6px;cursor:pointer;">🖨 Print / Save</button>
        <button id="view-doc-close" type="button" style="background:transparent;border:none;font-size:1.5rem;cursor:pointer;color:#64748b;line-height:1;">✕</button>
      </div>
    </div>

    <!-- Document Body -->
    <div id="view-doc-body" style="flex-grow:1;overflow-y:auto;padding:2rem;display:flex;justify-content:center;align-items:flex-start;background: #e2e8f0;">
      <!-- Document injects here -->
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* EXACT CSS FROM ADMIN DASHBOARD */
  .official-doc { background: #fff; width: 210mm; min-height: 297mm; padding: 20mm; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; box-sizing: border-box; overflow: hidden; }
  .official-watermark { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 0; }
  .official-watermark img { width: 75%; max-width: 500px; opacity: 0.08; }
  .official-letterhead { display: flex; align-items: center; justify-content: center; gap: 20px; text-align: center; padding-bottom: 15px; border-bottom: 3px solid #065f46; margin-bottom: 40px; position: relative; z-index: 1; }
  .official-letterhead img { width: 90px; height: auto; }
  .official-letterhead .inst-name { font-size: 26px; font-weight: bold; color: #065f46; letter-spacing: 1px; font-family: 'Poppins', sans-serif; }
  .official-letterhead .inst-motto { font-size: 14px; color: #6b7280; font-style: italic; margin-top: 4px; }
  .official-title { text-align: center; font-size: 20px; font-weight: bold; text-decoration: underline; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 40px; position: relative; z-index: 1; }
  .official-body { line-height: 2; position: relative; z-index: 1; font-size: 16px; text-align: justify; font-family: 'Times New Roman', Times, serif; }
  .official-signatures { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; margin-top: 80px; position: relative; z-index: 1; }
  .official-sig-line { border-bottom: 1px solid #000; height: 30px; margin-bottom: 8px; }
  .official-sig-role { font-size: 14px; font-weight: bold; text-transform: uppercase; text-align: center; }

  .portal-id-container { display: flex; justify-content: center; align-items: center; padding: 40px 0; background: #f8fafc; border-radius: 8px; overflow: hidden; }
  .portal-id-card { width: 450px !important; height: 260px !important; flex-shrink: 0; background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; font-family: 'Poppins', sans-serif; position: relative; }
  .pic-header { background: #065f46; height: 50px; padding: 0 20px; display: flex; align-items: center; gap: 12px; color: #fff; flex-shrink: 0; }
  .pic-header img { width: 32px; height: 32px; background: #fff; border-radius: 50%; padding: 2px; object-fit: contain; }
  .pic-header-text { display: flex; flex-direction: column; line-height: 1.2; }
  .pic-header-text .inst { font-size: 13px; font-weight: 800; letter-spacing: 0.5px; }
  .pic-header-text .state { font-size: 9px; font-weight: 600; letter-spacing: 1px; opacity: 0.8; }
  .pic-body { display: flex; padding: 15px 20px; gap: 15px; flex: 1; overflow: hidden; }
  .pic-photo { width: 75px; height: 95px; flex-shrink: 0; background: #f1f5f9; border-radius: 6px; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pic-photo img { width: 100%; height: 100%; object-fit: cover; }
  .pic-details { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding-top: 0; }
  .pic-row { display: flex; flex-direction: column; margin-bottom: 2px; }
  .pic-row-flex { display: flex; gap: 20px; }
  .pic-label { font-size: 8px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .pic-value { font-size: 12px; font-weight: 700; color: #0f172a; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pic-qr { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 60px; flex-shrink: 0; margin-left: 5px; }
  .pic-footer { background: #065f46; height: 24px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 8px; font-weight: 700; letter-spacing: 0.5px; flex-shrink: 0; }

  @media print {
    body * { visibility: hidden; }
    #view-doc-body, #view-doc-body * { visibility: visible; }
    #view-doc-body { position: absolute; left: 0; top: 0; width: 100%; padding: 0 !important; margin: 0 !important; background: #fff !important; display: block !important; }
    #view-doc-modal { position: static !important; background: transparent !important; padding: 0 !important; }
    #view-doc-modal > div { box-shadow: none !important; border-radius: 0 !important; height: auto !important; max-width: 100% !important; }
    #view-doc-modal > div > div:first-child { display: none !important; }
    .official-doc { box-shadow: none !important; padding: 0 !important; width: 100% !important; min-height: auto !important; }
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  let ALL = [];

  function render() {
    $('doc-count').textContent = ALL.length;
    const tbody = $('doc-tbody');

    if (!ALL.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">No documents requested yet.</td></tr>';
      return;
    }

    tbody.innerHTML = ALL.map(d => {
      let badge = '';
      let actionHtml = '<span style="color:#94a3b8;">—</span>';
      
      if (d.status === 'pending') {
        badge = '<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Pending</span>';
      } else if (d.status === 'approved' || d.status === 'issued' || d.status === 'ready') {
        badge = '<span style="background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Ready</span>';
        // Force it to use the View Modal for ALL ready documents
        actionHtml = `<button onclick="window.viewStudentDoc(${d.id}, '${esc(d.type)}', '${esc(d.title)}')" style="padding:.3rem .6rem;font-size:.75rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;">👁 View</button>`;
      } else if (d.status === 'rejected') {
        badge = '<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Rejected</span>';
      } else {
        badge = `<span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">${esc(d.status)}</span>`;
      }

      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;text-transform:capitalize;">${esc(d.type)}</td>
          <td style="padding:.65rem .75rem;color:#475569;">${esc(d.title)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${badge}</td>
          <td style="padding:.65rem .75rem;text-align:right;color:#64748b;font-size:.75rem;">${fmtDate(d.createdAt)}</td>
          <td style="padding:.65rem .75rem;text-align:right;">${actionHtml}</td>
        </tr>
      `;
    }).join('');
  }

  async function load() {
    $('doc-tbody').innerHTML = '<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading documents…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/documents');
      ALL = res.data || [];
      render();
    } catch (err) {
      $('doc-tbody').innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function openModal() {
    $('doc-modal').style.display = 'flex';
    $('doc-type').value = '';
    $('doc-title').value = '';
  }

  function closeModal() {
    $('doc-modal').style.display = 'none';
  }

  async function submitRequest() {
    const type = $('doc-type').value;
    const title = $('doc-title').value.trim();
    if (!type || !title) return core.showToast && core.showToast('Please select a type and enter a title.', 'warning');

    const btn = $('doc-save');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      await core.portalFetch('/api/student/documents/request', {
        method: 'POST',
        body: { type, title }
      });
      core.showToast && core.showToast('Document request submitted!', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Request';
    }
  }

  // --- VIEW DOCUMENT LOGIC (EXACT MATCH TO ADMIN DASHBOARD) ---
  window.viewStudentDoc = async function(docId, type, title) {
    const modal = $('view-doc-modal');
    const body = $('view-doc-body');
    modal.style.display = 'flex';
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;"><span class="spinner"></span> Generating document...</div>';

    try {
      // Use the correct profile endpoint that is guaranteed to work
      const studentRes = await core.portalFetch('/api/student/profile'); 
      const student = studentRes.data || studentRes || {};
      
      const fullName = `${student.firstName || ''} ${student.lastName || ''}`.trim() || '—';
      const dateObj = new Date();
      const dateStr = dateObj.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      
      const progName = student.programmeName || student.programme?.name || '—';
      const deptName = student.departmentName || student.department?.name || '—';
      const level = student.level || 'ND';
      const sessionName = student.sessionName || '2025/2026';
      const idValue = student.matricNumber || '—';
      const t = String(type).toLowerCase();

      const a4Wrapper = (bodyHtml, includeWatermark = true) => `
        <div class="official-doc">
          ${includeWatermark ? `
            <div class="official-watermark">
              <img src="/images/logo.png" onerror="this.style.display='none'" />
            </div>
          ` : ''}
          <div style="position: relative; z-index: 1;">
            ${bodyHtml}
          </div>
        </div>
      `;

      let html = '';

      if (t.includes('attestation')) {
        html = a4Wrapper(`
          <div class="official-letterhead">
            <img src="/images/logo.png" onerror="this.style.display='none'" />
            <div><div class="inst-name">FEDERAL POLYTECHNIC Ugep</div><div class="inst-motto">P.M.B. 1038, Ugep, Cross River State, Nigeria</div></div>
          </div>
          <div class="official-title">ATTESTATION</div>
          <div class="official-body">
            <p>This is to certify that <strong>${esc(fullName)}</strong> with Matric Number <strong>${esc(idValue)}</strong> is a bona fide student of Federal Polytechnic Ugep, currently enrolled in the following programme:</p>
            <table style="width:100%; margin: 20px 0; font-size: 15px;">
              <tr><td style="color:#64748b; width:30%;">Programme:</td><td style="font-weight:bold;">${esc(progName)}</td></tr>
              <tr><td style="color:#64748b;">Department:</td><td style="font-weight:bold;">${esc(deptName)}</td></tr>
              <tr><td style="color:#64748b;">Level:</td><td style="font-weight:bold;">${esc(level)}</td></tr>
              <tr><td style="color:#64748b;">Session:</td><td style="font-weight:bold;">${esc(sessionName)}</td></tr>
            </table>
            <p>This document is issued at the request of the student for official purposes.</p>
            <br><p>Date: ${dateStr}</p>
          </div>
          <div class="official-signatures" style="grid-template-columns: 1fr; text-align:right; margin-top:40px;">
            <div style="display:inline-block; text-align:center;">
              <div class="official-sig-line" style="width:200px;"></div>
              <div class="official-sig-role">REGISTRAR</div>
            </div>
          </div>
        `);
      } 
      else if (t.includes('id-card') || t.includes('id card')) {
        const verifyUrl = `${window.location.origin}/verify.html?id=${encodeURIComponent(idValue)}`;
        const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(verifyUrl)}&color=065f46&bgcolor=ffffff&margin=1`;
        
        html = `
          <div class="portal-id-container">
            <div class="portal-id-card">
              <div class="pic-header">
                <img src="/images/logo.png" onerror="this.style.display='none'" />
                <div class="pic-header-text">
                  <div class="inst">FEDERAL POLYTECHNIC UGEP</div>
                  <div class="state">CROSS RIVER STATE</div>
                </div>
              </div>
              <div class="pic-body">
                <div class="pic-photo">
                  ${student.photoUrl ? `<img src="${esc(student.photoUrl)}" style="width: 100%; height: 100%; object-fit: cover;" />` : ''}
                </div>
                <div class="pic-details">
                  <div class="pic-row"><span class="pic-label">Student Name</span><span class="pic-value" style="font-size: 14px;">${esc(fullName)}</span></div>
                  <div class="pic-row"><span class="pic-label">Matric Number</span><span class="pic-value">${esc(idValue)}</span></div>
                  <div class="pic-row-flex" style="display:flex; gap:20px;">
                    <div class="pic-row" style="flex: 1;"><span class="pic-label">Level</span><span class="pic-value">${esc(level)}</span></div>
                    <div class="pic-row" style="flex: 1;"><span class="pic-label">Session</span><span class="pic-value">${esc(sessionName)}</span></div>
                  </div>
                  <div class="pic-row"><span class="pic-label">Programme</span><span class="pic-value">${esc(progName)}</span></div>
                  <div class="pic-row"><span class="pic-label">Department</span><span class="pic-value">${esc(deptName)}</span></div>
                </div>
                <div class="pic-qr">
                  <img src="${qrImageUrl}" style="width: 55px; height: 55px; border-radius: 4px; border: 1px solid #e2e8f0; padding: 2px;" />
                  <div style="font-size: 6px; color: #64748b; font-weight: 700; margin-top: 4px; text-align: center;">SCAN TO<br>VERIFY</div>
                </div>
              </div>
              <div class="pic-footer">
                <span>OFFICIAL STUDENT ID</span>
                <span>FPU/ID/${String(student.id || 0).padStart(4, '0')}</span>
              </div>
            </div>
          </div>
        `;
      } 
      else if (t.includes('transcript')) {
        html = a4Wrapper(`
          <div class="official-letterhead" style="border-bottom: 2px solid #065f46; padding-bottom: 16px; margin-bottom: 24px; display: flex; align-items: center; gap: 20px;">
            <img src="/images/logo.png" onerror="this.style.display='none'" style="width: 70px;" />
            <div style="text-align: left;">
              <div style="font-family:'Poppins', sans-serif; font-size: 22px; font-weight: 800; color: #065f46; letter-spacing: 1px;">FEDERAL POLYTECHNIC UGEP</div>
              <div style="font-size: 11px; color: #6b7280; font-style: italic;">Citadel of Technical Excellence</div>
              <div style="font-size: 12px; font-weight: 700; color: #0f172a; text-transform: uppercase; letter-spacing: 2px; margin-top: 2px;">Official Student Transcript</div>
            </div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 20px;">
            <div>
              <h2 style="font-family:'Poppins', sans-serif; font-size: 24px; font-weight: 800; color: #0f172a; margin: 0 0 6px 0;">${esc(fullName)}</h2>
              <div style="font-size: 13px; color: #475569; font-family: monospace; margin-bottom: 4px; background: #ecfdf5; color: #065f46; display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700;">
                ${esc(idValue)}
              </div>
              <div style="font-size: 12px; color: #64748b; margin-top: 4px;">
                ${esc(level)} · ${esc(progName)}<br>
                ${esc(student.email || '')} ${deptName !== '—' ? ' · ' + esc(deptName) : ''}
              </div>
            </div>
          </div>
          <div style="text-align: center; padding: 40px; background: #fffbeb; border: 1px solid #fef3c7; border-radius: 8px; color: #b45309; font-weight: 600;">
            Transcript data is being processed. Please check back later or contact the registry.
          </div>
          <div style="margin-top: 60px; display: flex; justify-content: space-between; padding: 0 20px;">
            <div style="text-align: center;"><div style="border-bottom: 1px solid #000; width: 180px; margin-bottom: 6px;"></div><div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #475569;">Registrar</div></div>
            <div style="text-align: center;"><div style="border-bottom: 1px solid #000; width: 180px; margin-bottom: 6px;"></div><div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: #475569;">Date</div></div>
          </div>
        `);
      } 
      else {
        // Generic Document (Certificate, Clearance)
        html = a4Wrapper(`
          <div class="official-letterhead">
            <img src="/images/logo.png" onerror="this.style.display='none'" />
            <div><div class="inst-name">FEDERAL POLYTECHNIC Ugep</div><div class="inst-motto">Office of the Registrar</div></div>
          </div>
          <div class="official-title">${t.replace('-', ' ')}</div>
          <div class="official-body">
            <p>This is to certify that <strong>${esc(fullName)}</strong> with Matric Number <strong>${esc(idValue)}</strong> has fulfilled the requirements for this document.</p>
            <p>The student is currently enrolled in the programme: <strong>${esc(progName)}</strong> in the <strong>${esc(deptName)}</strong> department.</p>
            <p>This document is valid for official use.</p>
            <div style="margin-top:60px; display:flex; justify-content:space-between;">
              <div style="text-align:center;"><div style="border-bottom:1px solid #000; width:200px; margin-bottom:10px;"></div><div style="font-size:14px; font-weight:bold;">Bursar</div></div>
              <div style="text-align:center;"><div style="border-bottom:1px solid #000; width:200px; margin-bottom:10px;"></div><div style="font-size:14px; font-weight:bold;">Registrar</div></div>
            </div>
            <p style="margin-top:50px; font-size:14px;">Date: ${dateStr}</p>
          </div>
        `);
      }

      body.innerHTML = html;
    } catch (err) {
      body.innerHTML = `<div style="color:#dc2626; padding:20px; background:#fee2e2; border-radius:8px;">Failed to generate document: ${err.message}</div>`;
    }
  };

  function closeViewModal() {
    $('view-doc-modal').style.display = 'none';
  }

  // Event Listeners
  $('doc-request')?.addEventListener('click', openModal);
  $('doc-refresh')?.addEventListener('click', load);
  $('doc-modal-close')?.addEventListener('click', closeModal);
  $('doc-cancel')?.addEventListener('click', closeModal);
  $('doc-save')?.addEventListener('click', submitRequest);
  $('doc-modal')?.addEventListener('click', (e) => { if (e.target.id === 'doc-modal') closeModal(); });
  
  $('view-doc-close')?.addEventListener('click', closeViewModal);
  $('view-doc-modal')?.addEventListener('click', (e) => { if (e.target.id === 'view-doc-modal') closeViewModal(); });

  load();
})();
</script>
