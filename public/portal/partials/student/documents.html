<!-- Portal → Student → Documents -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📄</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">My Documents</div>
        <div style="font-size:.82rem;color:#d1fae5;">Request and download official documents</div>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <button id="doc-request" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">📄 Request Document</button>
    <button id="doc-refresh" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">My Document Requests</div>
      <span class="badge" id="doc-count" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Type</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Requested</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="doc-tbody">
          <tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading documents…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL: Request Document -->
<div id="doc-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;max-width:500px;width:100%;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1.1rem 1.4rem;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.05rem;font-weight:800;">Request Document</h3>
      <button id="doc-modal-close" type="button" style="background:transparent;border:none;font-size:1.4rem;cursor:pointer;color:#64748b;">✕</button>
    </div>

    <div style="padding:1.25rem;">
      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Document Type</label>
        <select id="doc-type" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Select Type</option>
          <option value="transcript">Academic Transcript</option>
          <option value="certificate">Certificate</option>
          <option value="attestation">Attestation Letter</option>
          <option value="id-card">ID Card Replacement</option>
          <option value="clearance">Clearance Certificate</option>
        </select>
      </div>

      <div style="margin-bottom:1rem;">
        <label style="display:block;font-size:.68rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Title / Reason</label>
        <input type="text" id="doc-title" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" placeholder="e.g. Transcript for job application" />
      </div>

      <div style="display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;">
        <button id="doc-cancel" type="button" style="padding:.6rem 1rem;font-size:.85rem;font-weight:600;background:#f1f5f9;color:#475569;border:none;border-radius:8px;cursor:pointer;">Cancel</button>
        <button id="doc-save" type="button" style="padding:.6rem 1.25rem;font-size:.85rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">Submit Request</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: View Document -->
<div id="view-doc-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.8);backdrop-filter:blur(4px);z-index:99999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#f8fafc;border-radius:12px;max-width:800px;width:100%;height:90vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.3);">
    
    <div style="padding:1rem 1.5rem;background:#fff;border-bottom:1px solid #e2e8f0;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;">
      <h3 style="margin:0;color:#0f172a;font-size:1.1rem;font-weight:800;">Your Document</h3>
      <div style="display:flex;gap:0.5rem;">
        <button onclick="window.print()" style="padding:.4rem .8rem;font-size:.8rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #065f46;border-radius:6px;cursor:pointer;">🖨 Print / Save</button>
        <button id="view-doc-close" type="button" style="background:transparent;border:none;font-size:1.5rem;cursor:pointer;color:#64748b;line-height:1;">✕</button>
      </div>
    </div>

    <div id="view-doc-body" style="flex-grow:1;overflow-y:auto;padding:2rem;display:flex;justify-content:center;align-items:flex-start;">
      <!-- Document injects here -->
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Print Styles */
  @media print {
    body * { visibility: hidden; }
    #view-doc-body, #view-doc-body * { visibility: visible; }
    #view-doc-body { position: absolute; left: 0; top: 0; width: 100%; padding: 0 !important; margin: 0 !important; background: #fff !important; display: block !important; }
    #view-doc-modal { position: static !important; background: transparent !important; padding: 0 !important; }
    #view-doc-modal > div { box-shadow: none !important; border-radius: 0 !important; height: auto !important; max-width: 100% !important; }
    #view-doc-modal > div > div:first-child { display: none !important; }
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  let ALL = [];

  function render() {
    $('doc-count').textContent = ALL.length;
    const tbody = $('doc-tbody');

    if (!ALL.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;">No documents requested yet.</td></tr>';
      return;
    }

    tbody.innerHTML = ALL.map(d => {
      let badge = '';
      let actionHtml = '<span style="color:#94a3b8;">—</span>';
      
      if (d.status === 'pending') {
        badge = '<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Pending</span>';
      } else if (d.status === 'approved' || d.status === 'issued' || d.status === 'ready') {
        badge = '<span style="background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Ready</span>';
        // Add the View button for Ready documents
        actionHtml = `<button onclick="window.viewStudentDoc(${d.id}, '${esc(d.type)}', '${esc(d.title)}')" style="padding:.3rem .6rem;font-size:.75rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;cursor:pointer;">👁 View</button>`;
      } else if (d.status === 'rejected') {
        badge = '<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">Rejected</span>';
      } else {
        badge = `<span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:5px;font-weight:800;font-size:.68rem;text-transform:capitalize;">${esc(d.status)}</span>`;
      }

      // If there's a direct file URL (like a PDF upload), show a download link
      if (d.fileUrl && d.status !== 'pending' && d.status !== 'rejected') {
         actionHtml = `<a href="${esc(d.fileUrl)}" target="_blank" style="display:inline-block;padding:.3rem .6rem;font-size:.75rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:6px;text-decoration:none;">⬇ Download</a>`;
      }

      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;text-transform:capitalize;">${esc(d.type)}</td>
          <td style="padding:.65rem .75rem;color:#475569;">${esc(d.title)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${badge}</td>
          <td style="padding:.65rem .75rem;text-align:right;color:#64748b;font-size:.75rem;">${fmtDate(d.createdAt)}</td>
          <td style="padding:.65rem .75rem;text-align:right;">${actionHtml}</td>
        </tr>
      `;
    }).join('');
  }

  async function load() {
    $('doc-tbody').innerHTML = '<tr><td colspan="5" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading documents…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/documents');
      ALL = res.data || [];
      render();
    } catch (err) {
      $('doc-tbody').innerHTML = `<tr><td colspan="5" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function openModal() {
    $('doc-modal').style.display = 'flex';
    $('doc-type').value = '';
    $('doc-title').value = '';
  }

  function closeModal() {
    $('doc-modal').style.display = 'none';
  }

  async function submitRequest() {
    const type = $('doc-type').value;
    const title = $('doc-title').value.trim();
    if (!type || !title) return core.showToast && core.showToast('Please select a type and enter a title.', 'warning');

    const btn = $('doc-save');
    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      await core.portalFetch('/api/student/documents/request', {
        method: 'POST',
        body: { type, title }
      });
      core.showToast && core.showToast('Document request submitted!', 'success');
      closeModal();
      load();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Request';
    }
  }

  // --- VIEW DOCUMENT LOGIC ---
  window.viewStudentDoc = async function(docId, type, title) {
    const modal = $('view-doc-modal');
    const body = $('view-doc-body');
    modal.style.display = 'flex';
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;"><span class="spinner"></span> Loading document...</div>';

    try {
      const studentRes = await core.portalFetch('/api/student/id-card'); // Get student profile
      const student = studentRes.data || {};
      const fullName = `${student.firstName || ''} ${student.lastName || ''}`.trim() || '—';

      // Generate beautiful document HTML based on type
      let html = '';
      const t = String(type).toLowerCase();

      if (t.includes('id-card') || t.includes('id card') || t.includes('id-letter')) {
        html = `
          <div style="background:#fff; width:440px; height:280px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,0.15); overflow:hidden; display:flex; flex-direction:column; margin:auto; position:relative;">
            <div style="background:linear-gradient(135deg,#065f46,#059669); padding:12px 20px; display:flex; align-items:center; gap:12px;">
              <img src="/images/logo.png" style="width:36px; height:36px; background:#fff; border-radius:50%; padding:2px;" />
              <div>
                <div style="color:#fff; font-weight:900; font-size:14px; letter-spacing:0.5px;">FEDERAL POLYTECHNIC UGEP</div>
                <div style="color:#fef08a; font-size:9px; font-weight:700;">CROSS RIVER STATE</div>
              </div>
            </div>
            <div style="padding:16px 20px; display:flex; gap:16px; flex:1;">
              <div style="width:75px; height:95px; background:#f1f5f9; border:2px solid #065f46; border-radius:6px; overflow:hidden;">
                ${student.photoUrl ? `<img src="${student.photoUrl}" style="width:100%; height:100%; object-fit:cover;" />` : ''}
              </div>
              <div style="flex:1;">
                <div style="font-size:8px; color:#64748b; font-weight:700; text-transform:uppercase;">Student Name</div>
                <div style="font-size:15px; font-weight:900; color:#0f172a; margin-bottom:6px;">${fullName}</div>
                <div style="font-size:8px; color:#64748b; font-weight:700; text-transform:uppercase;">Matric Number</div>
                <div style="font-size:12px; font-weight:800; color:#065f46; font-family:monospace;">${student.matricNumber || 'N/A'}</div>
                <div style="font-size:8px; color:#64748b; font-weight:700; text-transform:uppercase; margin-top:6px;">Programme</div>
                <div style="font-size:11px; font-weight:700;">${student.programmeName || 'N/A'}</div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Generic Certificate/Transcript/Attestation style
        html = `
          <div style="background:#fff; padding:40px; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.1); width:100%; max-width:700px; min-height:800px; font-family:'Times New Roman', serif; text-align:center; border: 4px solid #065f46;">
            <h1 style="color:#065f46; font-size:28px; margin-bottom:30px;">FEDERAL POLYTECHNIC UGEP</h1>
            <h2 style="text-transform:uppercase; font-size:20px; margin-bottom:40px;">${t.replace('-', ' ')}</h2>
            
            <p style="font-size:18px; margin-bottom:20px;">This is to certify that</p>
            <h3 style="font-size:24px; margin-bottom:20px; border-bottom:1px solid #000; display:inline-block; padding:0 20px;">${fullName}</h3>
            <p style="font-size:18px;">with Matric Number <strong>${student.matricNumber || 'N/A'}</strong></p>
            <p style="font-size:18px; margin-bottom:40px;">has successfully fulfilled the requirements for the above document.</p>
            
            <div style="margin-top:60px; display:flex; justify-content:space-between;">
              <div style="text-align:center;">
                <div style="border-bottom:1px solid #000; width:150px; margin-bottom:5px;"></div>
                <div>Registrar</div>
              </div>
              <div style="text-align:center;">
                <div style="border-bottom:1px solid #000; width:150px; margin-bottom:5px;"></div>
                <div>Date</div>
              </div>
            </div>
          </div>
        `;
      }

      body.innerHTML = html;
    } catch (err) {
      body.innerHTML = `<div style="color:#dc2626; padding:20px; background:#fee2e2; border-radius:8px;">Failed to load document: ${err.message}</div>`;
    }
  };

  function closeViewModal() {
    $('view-doc-modal').style.display = 'none';
  }

  // Event Listeners
  $('doc-request')?.addEventListener('click', openModal);
  $('doc-refresh')?.addEventListener('click', load);
  $('doc-modal-close')?.addEventListener('click', closeModal);
  $('doc-cancel')?.addEventListener('click', closeModal);
  $('doc-save')?.addEventListener('click', submitRequest);
  $('doc-modal')?.addEventListener('click', (e) => { if (e.target.id === 'doc-modal') closeModal(); });
  
  $('view-doc-close')?.addEventListener('click', closeViewModal);
  $('view-doc-modal')?.addEventListener('click', (e) => { if (e.target.id === 'view-doc-modal') closeViewModal(); });

  load();
})();
</script>
