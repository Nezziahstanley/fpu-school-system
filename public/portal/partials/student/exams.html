<!-- Portal → Student → Exam Schedule -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📝</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">Exam Schedule</div>
        <div style="font-size:.82rem;color:#d1fae5;">Exams for your registered courses only</div>
      </div>
    </div>
  </div>

  <!-- FILTERS -->
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center;">
    <input type="search" id="exm-search" placeholder="Search course or venue…" style="flex:1;min-width:200px;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
    <select id="exm-semester" style="padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;">
      <option value="">All Semesters</option>
      <option value="first">First</option>
      <option value="second">Second</option>
    </select>
    <button id="exm-refresh" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
    <button id="exm-print" style="padding:.55rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">🖨 Print</button>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📅</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-total">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total Exams</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">⏰</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-upcoming">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Upcoming</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">✅</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-past">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Past</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#f3e8ff;color:#6b21a8;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📍</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-venues">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Venues</div>
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">My Exam Schedule</div>
      <span class="badge" id="exm-count" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Date</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Time</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Venue</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Semester</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
          </tr>
        </thead>
        <tbody id="exm-tbody">
          <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_EXAMS = [];

  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function render() {
    const q = ($('exm-search').value || '').toLowerCase();
    const sem = $('exm-semester').value;

    const filtered = ALL_EXAMS.filter(e => {
      if (q) {
        const hay = `${e.courseCode} ${e.courseTitle} ${e.venue}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (sem && String(e.semester || '').toLowerCase() !== sem) return false;
      return true;
    });

    $('exm-count').textContent = filtered.length;

    if (!filtered.length) {
      $('exm-tbody').innerHTML = '<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">No exams found.</td></tr>';
      return;
    }

    const now = new Date();
    $('exm-tbody').innerHTML = filtered.map(e => {
      const examDate = new Date(e.examDate);
      const isPast = examDate < now;
      const status = isPast 
        ? '<span style="display:inline-block;padding:2px 8px;background:#f1f5f9;color:#475569;border-radius:5px;font-weight:800;font-size:.68rem;">PAST</span>'
        : '<span style="display:inline-block;padding:2px 8px;background:#d1fae5;color:#065f46;border-radius:5px;font-weight:800;font-size:.68rem;">UPCOMING</span>';
      
      return `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;font-weight:700;color:#065f46;">${esc(e.courseCode)}</td>
          <td style="padding:.65rem .75rem;">${esc(e.courseTitle)}</td>
          <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(e.examDate)}</td>
          <td style="padding:.65rem .75rem;text-align:center;color:#475569;font-size:.78rem;">${esc(e.startTime)} – ${esc(e.endTime)}</td>
          <td style="padding:.65rem .75rem;color:#475569;">${esc(e.venue || '—')}</td>
          <td style="padding:.65rem .75rem;text-align:center;text-transform:capitalize;">${esc(e.semester)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${status}</td>
        </tr>
      `;
    }).join('');
  }

  function updateStats() {
    const now = new Date();
    const upcoming = ALL_EXAMS.filter(e => new Date(e.examDate) >= now).length;
    const past = ALL_EXAMS.length - upcoming;
    const uniqueVenues = new Set(ALL_EXAMS.map(e => e.venue).filter(Boolean)).size;

    $('stat-total').textContent = ALL_EXAMS.length;
    $('stat-upcoming').textContent = upcoming;
    $('stat-past').textContent = past;
    $('stat-venues').textContent = uniqueVenues;
  }

  async function load() {
    try {
      const res = await core.portalFetch('/api/student/exam-schedule');
      ALL_EXAMS = res.data || [];
      updateStats();
      render();
    } catch (err) {
      $('exm-tbody').innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  $('exm-search')?.addEventListener('input', render);
  $('exm-semester')?.addEventListener('change', render);
  $('exm-refresh')?.addEventListener('click', load);
  $('exm-print')?.addEventListener('click', () => window.print());

  load();
})();
</script>
