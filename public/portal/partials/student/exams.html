<!-- Portal → Student → Exams -->
<section class="page-head">
  <div><h2>Exam Schedule</h2><p class="muted small">My upcoming exams</p></div>
  <div class="actions"><button class="btn btn-outline btn-sm" onclick="window.__studExamsLoad()">Refresh</button></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Upcoming Exams</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin">
        <thead><tr><th>Course</th><th>Date</th><th>Time</th><th>Venue</th></tr></thead>
        <tbody id="stud-exams-tbody"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__studExamsLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('stud-exams-tbody');
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/exams');
      const rows = res.data || [];
      tbody.innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td>${core.escapeHtml(r.course?.code || '')} — ${core.escapeHtml(r.course?.title || '')}</td>
          <td>${core.formatDate(r.exam.examDate)}</td>
          <td>${core.escapeHtml(r.exam.startTime)} – ${core.escapeHtml(r.exam.endTime)}</td>
          <td>${core.escapeHtml(r.exam.venue || '')}</td>
        </tr>
      `).join('') : '<tr><td colspan="4" class="empty">No exams scheduled.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="4" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };
  window.__studExamsLoad();
</script>
