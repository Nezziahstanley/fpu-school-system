<!-- Portal → Student → Exams -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center; print-color-adjust: exact; -webkit-print-color-adjust: exact;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📝</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">Exam Schedule</div>
        <div style="font-size:.82rem;color:#d1fae5;">Your official examination timetable</div>
      </div>
    </div>
    <button id="ex-print" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:none;border-radius:8px;cursor:pointer;">🖨 Print Timetable</button>
  </div>

  <!-- FILTERS -->
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;">
    <input type="text" id="ex-search" placeholder="Search course or venue..." style="padding:.5rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;flex:1;min-width:200px;" />
    <select id="ex-semester" style="padding:.5rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;">
      <option value="">All Semesters</option>
      <option value="first">First Semester</option>
      <option value="second">Second Semester</option>
    </select>
    <button id="ex-refresh" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">↻ Refresh</button>
  </div>

  <!-- STATS -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#ecfdf5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📅</div>
      <div><div style="font-size:1.4rem;font-weight:800;color:#0f172a;" id="ex-stat-total">—</div><div style="font-size:.7rem;color:#64748b;font-weight:600;">TOTAL EXAMS</div></div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#b45309;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">⏳</div>
      <div><div style="font-size:1.4rem;font-weight:800;color:#0f172a;" id="ex-stat-upcoming">—</div><div style="font-size:.7rem;color:#64748b;font-weight:600;">UPCOMING</div></div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#dcfce7;color:#15803d;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">✅</div>
      <div><div style="font-size:1.4rem;font-weight:800;color:#0f172a;" id="ex-stat-past">—</div><div style="font-size:.7rem;color:#64748b;font-weight:600;">PAST</div></div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fce7f3;color:#be185d;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📍</div>
      <div><div style="font-size:1.4rem;font-weight:800;color:#0f172a;" id="ex-stat-venues">—</div><div style="font-size:.7rem;color:#64748b;font-weight:600;">VENUES</div></div>
    </div>
  </div>

  <!-- TIMETABLE SHEET (MATCHES ADMIN TEMPLATE) -->
  <div id="ex-timetable-container" style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:2rem;overflow-x:auto;">
    <!-- Dynamic Header -->
    <div style="text-align:center;margin-bottom:1.5rem;" id="ex-sheet-header">
      <h2 style="font-family:'Times New Roman', serif; font-size:1.2rem; font-weight:bold; text-transform:uppercase; margin:0; color:#000;">FEDERAL POLYTECHNIC UGEP,</h2>
      <h3 style="font-family:'Times New Roman', serif; font-size:1rem; font-weight:bold; text-transform:uppercase; margin:0; color:#000;" id="ex-school-name">SCHOOL OF SCIENCE AND TECHNOLOGY</h3>
      <h3 style="font-family:'Times New Roman', serif; font-size:1rem; font-weight:bold; text-transform:uppercase; margin:0; color:#000;" id="ex-dept-name">DEPARTMENT</h3>
      <h4 style="font-family:'Times New Roman', serif; font-size:1rem; font-weight:bold; text-transform:uppercase; margin:0; color:#000;" id="ex-level-name">FIRST SEMESTER EXAMINATION TIME TABLE</h4>
      <p style="font-family:'Times New Roman', serif; font-size:0.9rem; font-weight:bold; margin:0; color:#000;" id="ex-session-name">2025/2026 SESSION</p>
    </div>
    
    <!-- The generated table will inject here -->
    <div id="ex-table-container">
      <div style="text-align:center;padding:40px;color:#64748b;"><span class="spinner"></span> Loading timetable...</div>
    </div>
  </div>
</div>

<style>
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Styles for the Exam Sheet (Exact Match to Admin) */
  .exam-sheet-table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'Times New Roman', serif;
    font-size: 11px;
    color: #000;
  }
  .exam-sheet-table th, .exam-sheet-table td {
    border: 1px solid #000;
    padding: 4px 6px;
    text-align: left;
  }
  .exam-sheet-table thead th {
    background: #fff;
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    font-size: 11px;
  }
  .exam-sheet-table .week-header {
    background: #fff;
    color: #059669; /* Green text */
    font-weight: bold;
    text-align: center;
    text-transform: uppercase;
    font-size: 12px;
    padding: 6px;
  }
  .exam-sheet-table .time-header {
    background: #fff;
    font-weight: bold;
    text-align: center;
    font-size: 11px;
  }
  .exam-sheet-table .col-date { width: 80px; text-align: center; }
  .exam-sheet-table .col-time { width: 120px; text-align: center; }
  .exam-sheet-table .col-course { width: 200px; }
  .exam-sheet-table .col-venue { width: 100px; text-align: center; }
  .exam-sheet-table .col-invigilator { width: 150px; }

  @media print {
    @page { size: landscape; margin: 10mm; }
    body * { visibility: hidden; }
    #ex-timetable-container, #ex-timetable-container * { visibility: visible; }
    #ex-timetable-container { position: absolute; left: 0; top: 0; width: 100%; border: none; box-shadow: none; padding: 0; }
    .exam-sheet-table th, .exam-sheet-table td { border: 1px solid #000 !important; }
    #ex-timetable-container .week-header { color: #000 !important; }
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_EXAMS = [];

  async function load() {
    $('ex-table-container').innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;"><span class="spinner"></span> Loading timetable...</div>';
    
    try {
      // 1. Fetch the student's profile to update the headers
      const profileRes = await core.portalFetch('/api/student/id-card');
      const student = profileRes.data || profileRes || {};
      
      if (student.departmentName) $('ex-dept-name').textContent = `DEPARTMENT OF ${student.departmentName.toUpperCase()}`;
      if (student.schoolName) $('ex-school-name').textContent = `SCHOOL OF ${student.schoolName.toUpperCase()}`;
      if (student.level) $('ex-level-name').textContent = `(${student.level} I) FIRST SEMESTER EXAMINATION TIME TABLE`;
      if (student.sessionName) $('ex-session-name').textContent = `${student.sessionName} SESSION`;

      // 2. Fetch exams from the working admin endpoint
      const res = await core.portalFetch('/api/student/exam-schedule');
      const data = res.data || res || [];

      // The student API returns only approved schedules for this student's department.
      const filtered = data;
      
      const search = ($('ex-search').value || '').toLowerCase();
      const semester = $('ex-semester').value;

      ALL_EXAMS = filtered.filter(ex => {
        const matchSearch = !search || 
          String(ex.courseCode || ex.course?.code || '').toLowerCase().includes(search) ||
          String(ex.courseTitle || ex.course?.title || '').toLowerCase().includes(search) ||
          String(ex.venue || '').toLowerCase().includes(search);
        
        const matchSem = !semester || String(ex.semester || 'first').toLowerCase() === semester;
        
        return matchSearch && matchSem;
      });

      updateStats();
      renderTimetable();
    } catch (err) {
      $('ex-table-container').innerHTML = `<div style="color:#dc2626;padding:20px;text-align:center;">Failed to load exams: ${esc(err.message)}</div>`;
    }
  }

  function updateStats() {
    const now = new Date();
    let past = 0, upcoming = 0;
    const venues = new Set();

    ALL_EXAMS.forEach(ex => {
      const examDate = new Date(ex.examDate);
      if (examDate < now) past++;
      else upcoming++;
      if (ex.venue) venues.add(ex.venue);
    });

    $('ex-stat-total').textContent = ALL_EXAMS.length;
    $('ex-stat-upcoming').textContent = upcoming;
    $('ex-stat-past').textContent = past;
    $('ex-stat-venues').textContent = venues.size;
  }

  function renderTimetable() {
    if (!ALL_EXAMS.length) {
      $('ex-table-container').innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">No exams found.</div>';
      return;
    }

    // Group by Week
    const sorted = [...ALL_EXAMS].sort((a, b) => new Date(a.examDate) - new Date(b.examDate));
    
    function getMonday(d) {
      d = new Date(d);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    const weeks = {};
    sorted.forEach(ex => {
      const d = new Date(ex.examDate);
      const monday = getMonday(d);
      const weekKey = monday.toISOString().split('T')[0];
      
      if (!weeks[weekKey]) {
        weeks[weekKey] = { monday: monday, exams: [] };
      }
      weeks[weekKey].exams.push(ex);
    });

    const weekKeys = Object.keys(weeks).sort();
    let weekCounter = 1;

    let html = `
      <table class="exam-sheet-table">
        <thead>
          <tr>
            <th style="width:80px;">TIME</th>
            <th colspan="3" style="text-align:center; font-weight:bold;">9:00 A.M - 11:00 A.M</th>
            <th colspan="3" style="text-align:center; font-weight:bold;">12:00 NOON - 2:00 P.M</th>
          </tr>
          <tr>
            <th>DATE</th>
            <th>COURSE TITLE & CODE</th>
            <th>VENUE</th>
            <th>INVIGILATORS</th>
            <th>COURSE TITLE & CODE</th>
            <th>VENUE</th>
            <th>INVIGILATORS</th>
          </tr>
        </thead>
        <tbody>
    `;

    weekKeys.forEach(weekKey => {
      const week = weeks[weekKey];
      
      html += `<tr><td colspan="7" class="week-header">EXAMS - WEEK ${weekCounter}</td></tr>`;
      weekCounter++;

      const days = {};
      week.exams.forEach(ex => {
        const d = new Date(ex.examDate);
        const dayKey = d.toISOString().split('T')[0];
        if (!days[dayKey]) days[dayKey] = [];
        days[dayKey].push(ex);
      });

      const dayKeys = Object.keys(days).sort();

      dayKeys.forEach(dayKey => {
        const dayExams = days[dayKey];
        const d = new Date(dayKey);
        
        const dayNames = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
        const dayName = dayNames[d.getDay()];
        const dateStr = `${dayName} ${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth()+1).padStart(2, '0')}/${String(d.getFullYear()).slice(-2)}`;

        const morning = [];
        const afternoon = [];

        dayExams.forEach(ex => {
          const time = ex.startTime || '09:00';
          if (time < '11:00') morning.push(ex);
          else afternoon.push(ex);
        });

        const maxRows = Math.max(morning.length, afternoon.length, 1);

        for (let i = 0; i < maxRows; i++) {
          const m = morning[i];
          const a = afternoon[i];

          html += `<tr>`;
          
          if (i === 0) {
            html += `<td class="col-date" rowspan="${maxRows}">${dateStr}</td>`;
          }

          if (m) {
            const c = m.course || {};
            html += `
              <td>${esc(m.courseTitle || c.title || '')} (${esc(m.courseCode || c.code || '')})</td>
              <td class="col-venue">${esc(m.venue || '')}</td>
              <td>${esc(m.invigilators || '')}</td>
            `;
          } else {
            html += `<td></td><td></td><td></td>`;
          }

          if (a) {
            const c = a.course || {};
            html += `
              <td>${esc(a.courseTitle || c.title || '')} (${esc(a.courseCode || c.code || '')})</td>
              <td class="col-venue">${esc(a.venue || '')}</td>
              <td>${esc(a.invigilators || '')}</td>
            `;
          } else {
            html += `<td></td><td></td><td></td>`;
          }

          html += `</tr>`;
        }
      });
    });

    html += `
        </tbody>
      </table>
      <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: flex-end;">
        <div>
          <div style="font-family: 'Brush Script MT', cursive; font-size: 20px; color: #1e3a8a; transform: rotate(-5deg);">Martin Omini Arikpo</div>
          <div style="border-top: 1px solid #000; width: 180px; padding-top: 4px; font-weight: bold; font-family: 'Times New Roman', serif; font-size: 12px;">Sign: Martin Omini Arikpo</div>
        </div>
        <div style="text-align: right; font-weight: bold; font-family: 'Times New Roman', serif; font-size: 12px;">
          ................................<br>
          HOD, Computer Science
        </div>
      </div>
    `;

    $('ex-table-container').innerHTML = html;
  }

  $('ex-search')?.addEventListener('input', () => {
    clearTimeout(window.__exSearchTimer);
    window.__exSearchTimer = setTimeout(load, 300);
  });
  $('ex-semester')?.addEventListener('change', load);
  $('ex-refresh')?.addEventListener('click', load);
  $('ex-print')?.addEventListener('click', () => window.print());

  load();
})();
</script>
