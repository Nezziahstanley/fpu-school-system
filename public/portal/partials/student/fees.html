<!-- Portal → Student → Fees -->
<section class="greeting">
  <div class="who">
    <div class="avatar">💰</div>
    <div>
      <h1>My Fees</h1>
      <div class="sub">Fee payments and outstanding balance</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-outline btn-sm" id="sf-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="sf-print">🖨 Print</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Fees Due</span><span class="value" id="sf-due">—</span></div><div class="ic">💵</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Total Paid</span><span class="value" id="sf-paid">—</span></div><div class="ic">✅</div></div>
  <div class="stat red"><div class="meta"><span class="label">Balance</span><span class="value" id="sf-balance">—</span></div><div class="ic">⚠️</div></div>
  <div class="stat blue"><div class="meta"><span class="label">Payments</span><span class="value" id="sf-count">—</span></div><div class="ic">📋</div></div>
</div>

<section class="panel">
  <div class="panel-head"><h3>Payment History</h3><span class="badge" id="sf-pay-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Reference</th><th>Amount</th><th>Method</th><th>Status</th></tr></thead>
        <tbody id="sf-tbody">
          <tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  function fmtMoney(n) { return '₦' + Number(n || 0).toLocaleString(); }

  async function load() {
    const tbody = $('sf-tbody');
    if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/fees');
      const d = res.data || res || {};
      setText('sf-due', fmtMoney(d.totalDue));
      setText('sf-paid', fmtMoney(d.totalPaid));
      setText('sf-balance', fmtMoney(d.balance));

      const payments = d.payments || [];
      setText('sf-count', payments.length);
      setText('sf-pay-count', payments.length);

      if (tbody) {
        tbody.innerHTML = payments.length
          ? payments.map((p) => {
              const badge = p.status === 'verified' ? 'badge-active'
                           : p.status === 'rejected' ? 'badge-inactive'
                           : 'badge-warning';
              return `
                <tr>
                  <td>${p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '—'}</td>
                  <td><code>${esc(p.reference || '—')}</code></td>
                  <td><strong>${fmtMoney(p.amount)}</strong></td>
                  <td>${esc(p.method || '—')}</td>
                  <td><span class="badge-status ${badge}">${esc(p.status || 'pending')}</span></td>
                </tr>`;
            }).join('')
          : '<tr><td colspan="5" class="empty">No payments yet.</td></tr>';
      }
    } catch (err) {
      console.warn('[student-fees]', err.message);
      if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="empty">Could not load fees. (Backend fix pending.)</td></tr>';
    }
  }

  $('sf-refresh')?.addEventListener('click', load);
  $('sf-print')?.addEventListener('click', () => window.print());
  load();
})();
</script>
