<!-- Portal → Student → Graduation -->
<section class="page-head">
  <div><h2>Graduation</h2><p class="muted small">Your graduation queue status</p></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Status</h3></div>
  <div class="panel-body" id="stud-grad-body">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;
    const box = document.getElementById('stud-grad-body');
    try {
      const res = await core.portalFetch('/api/student/graduation');
      const g = res.data;
      if (!g) {
        box.innerHTML = '<p class="muted">You are not yet queued for graduation. Complete all your courses and clearances first.</p>';
      } else {
        box.innerHTML = `
          <div class="grid grid-2" style="gap:1rem;">
            <div><strong>Level:</strong> ${core.escapeHtml(g.level)}</div>
            <div><strong>CGPA:</strong> ${g.cgpa || '—'}</div>
            <div><strong>Classification:</strong> ${core.escapeHtml(g.classification || '—')}</div>
            <div><strong>Status:</strong> <span class="badge badge-${g.status === 'graduated' ? 'success' : g.status === 'rejected' ? 'danger' : 'warning'}">${core.escapeHtml(g.status)}</span></div>
            <div><strong>Queued:</strong> ${core.formatDate(g.createdAt)}</div>
            <div><strong>Approved:</strong> ${core.formatDate(g.approvedAt)}</div>
          </div>
        `;
      }
    } catch (err) { box.innerHTML = `<div class="alert alert-danger">${core.escapeHtml(err.message)}</div>`; }
  })();
</script>
