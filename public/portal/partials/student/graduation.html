<!-- Portal → Student → Graduation -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🎓</div>
    <div>
      <h1>Graduation Status</h1>
      <div class="sub">Your graduation clearance</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-outline btn-sm" id="sg-refresh">Refresh</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>Status</h3></div>
  <div class="panel-body" id="sg-content">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  async function load() {
    const box = $('sg-content');
    if (!box) return;
    box.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';
    try {
      const res = await core.portalFetch('/api/student/graduation');
      const d = res.data || res || null;

      if (!d) {
        box.innerHTML = `
          <div style="text-align:center;padding:2rem 1rem;">
            <div style="font-size:3rem;margin-bottom:.75rem;">🎓</div>
            <h3 style="margin:0 0 .5rem;color:#0f172a;">Not Yet a Graduation Candidate</h3>
            <p class="muted" style="max-width:400px;margin:0 auto;">
              You'll appear here once the Registrar queues you for graduation after your final results are published.
            </p>
          </div>`;
        return;
      }

      const badge = d.status === 'graduated' ? 'badge-active'
                   : d.status === 'rejected' ? 'badge-inactive'
                   : 'badge-warning';

      box.innerHTML = `
        <div class="fees-breakdown">
          <div class="fees-row"><span>Status</span><strong><span class="badge-status ${badge}">${esc(d.status || 'pending')}</span></strong></div>
          <div class="fees-row"><span>Level</span><strong>${esc(d.level || '—')}</strong></div>
          <div class="fees-row"><span>CGPA</span><strong>${d.cgpa != null ? Number(d.cgpa).toFixed(2) : '—'}</strong></div>
          <div class="fees-row"><span>Classification</span><strong>${esc(d.classification || '—')}</strong></div>
          <div class="fees-row"><span>Approved</span><strong>${d.approvedAt ? new Date(d.approvedAt).toLocaleDateString() : '—'}</strong></div>
          <div class="fees-row"><span>Remarks</span><strong>${esc(d.remarks || '—')}</strong></div>
        </div>`;
    } catch (err) {
      console.warn('[student-graduation]', err.message);
      box.innerHTML = '<p class="muted" style="text-align:center;padding:2rem;">Could not load graduation status.</p>';
    }
  }

  $('sg-refresh')?.addEventListener('click', load);
  load();
})();
</script>
