<!-- Portal → Student → ID Card -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🆔</div>
    <div>
      <h1>My ID Card</h1>
      <div class="sub">Your official student identification</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-outline btn-sm" id="si-refresh">Refresh</button>
  <button class="btn btn-primary btn-sm" id="si-print">🖨 Print</button>
  <button class="btn btn-outline btn-sm" id="si-flip">🔄 Flip Card</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>Student ID Card</h3></div>
  <div class="panel-body" id="si-card">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<section class="panel" id="si-lost-panel" style="display:none;">
  <div class="panel-head"><h3>🔍 Lost Card Lookup</h3></div>
  <div class="panel-body">
    <p class="muted small" style="margin-top:0;">
      If this card is lost, anyone can scan the QR code or visit the URL below to reach the owner's department.
    </p>
    <div class="form-group">
      <label>Public Lookup URL</label>
      <input type="text" id="si-lookup-url" readonly style="width:100%;max-width:560px;" />
    </div>
    <a class="btn btn-outline btn-sm" id="si-open-lookup" target="_blank">Open Lookup Page</a>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  const FPU = {
    primary: '#0a5c2f',       // deep FPU green (matches card border)
    accent:  '#f5b800',        // FPU yellow/gold
    accent2: '#10b981',
    dark:    '#063d1e',
    light:   '#d1fae5',
    pale:    '#ecfdf5',
    text:    '#0f172a',
    muted:   '#64748b',
    white:   '#ffffff',
  };

  // ─── Validity: 2 years from today ───
  function validTillLabel() {
    return String(new Date().getFullYear() + 2);
  }

  // ─── Signature generator (script-style rendering of the name) ───
  function signatureSvg(fullName) {
    const initials = fullName.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
    return `
      <svg viewBox="0 0 200 40" style="width:100%;height:100%;" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <style>
            .sig { font-family: 'Brush Script MT', 'Segoe Script', cursive; fill: #1e3a8a; font-style: italic; }
          </style>
        </defs>
        <path d="M5,32 Q20,5 40,20 T70,22 T100,18 T130,25 T160,20 T195,26"
              fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round"/>
        <text x="100" y="30" text-anchor="middle" font-size="14" class="sig">${initials}</text>
      </svg>`;
  }

  if (!document.getElementById('si-print-style')) {
    const style = document.createElement('style');
    style.id = 'si-print-style';
    style.textContent = `
      .si-card {
        position: relative;
        width: 340px;
        height: 540px;
        max-width: 100%;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(10,92,47,.30);
        border: 1px solid #e5e7eb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .si-front-wrap, .si-back-wrap { display: flex; justify-content: center; }
      .si-hidden { display: none; }

      /* ══════ FRONT DECOR ══════ */
      /* Vertical yellow "STUDENT ID CARD" tab on left */
      .si-card .si-left-tab {
        position: absolute;
        left: 0; top: 90px;
        width: 34px; height: 260px;
        background: linear-gradient(180deg, ${FPU.accent} 0%, #e5a800 100%);
        display: flex; align-items: center; justify-content: center;
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,.08);
      }
      .si-card .si-left-tab-text {
        transform: rotate(-90deg);
        white-space: nowrap;
        color: #fff;
        font-weight: 800;
        letter-spacing: .28em;
        font-size: 10px;
        text-shadow: 0 1px 1px rgba(0,0,0,.15);
      }

      /* Green top band */
      .si-card .si-top-band {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 68px;
        background: linear-gradient(135deg, ${FPU.primary} 0%, #0b7a3f 50%, ${FPU.primary} 100%);
        display: flex; align-items: center;
        padding: 0 1rem;
        gap: .6rem;
        z-index: 3;
      }
      /* Yellow accent line under the top band */
      .si-card .si-top-band::after {
        content: "";
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, ${FPU.accent}, #fbbf24, ${FPU.accent});
      }

      /* Diagonal yellow stripes at bottom (like the physical card) */
      .si-card .si-stripes {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 60px;
        overflow: hidden;
        pointer-events: none;
      }
      .si-card .si-stripes::before,
      .si-card .si-stripes::after {
        content: "";
        position: absolute;
        bottom: -20px;
        width: 200px; height: 60px;
        background: ${FPU.accent};
        transform: rotate(-15deg);
        opacity: .35;
      }
      .si-card .si-stripes::before { left: -40px; }
      .si-card .si-stripes::after { right: -40px; transform: rotate(-15deg) scaleX(-1); }

      /* Green side band on the right edge (bottom half) */
      .si-card .si-right-band {
        position: absolute;
        right: 0; bottom: 0;
        width: 34px; height: 200px;
        background: linear-gradient(180deg, ${FPU.primary} 0%, ${FPU.dark} 100%);
        clip-path: polygon(100% 0, 100% 100%, 0 100%, 40% 0);
      }

      .si-content {
        position: relative; z-index: 2; height: 100%;
        display: flex; flex-direction: column; padding: 0;
      }

      /* ══════ BACK DECOR ══════ */
      .si-card.back .si-back-bg {
        position: absolute; inset: 0;
        background:
          radial-gradient(circle at 20% 15%, rgba(245,184,0,.10), transparent 40%),
          radial-gradient(circle at 80% 85%, rgba(10,92,47,.08), transparent 40%);
      }
      .si-card.back .si-back-frame {
        position: absolute;
        inset: 18px;
        border: 2px solid ${FPU.primary};
        border-radius: 12px;
        overflow: hidden;
      }
      .si-card.back .si-back-frame::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, ${FPU.accent}, #fbbf24, ${FPU.accent});
      }
      /* Yellow wave bottom of back frame */
      .si-card.back .si-back-wave {
        position: absolute;
        bottom: -1px; left: -1px; right: -1px;
        height: 40px;
        background: ${FPU.accent};
        clip-path: polygon(0 60%, 20% 40%, 50% 55%, 80% 30%, 100% 45%, 100% 100%, 0 100%);
      }
      /* Green corner triangle */
      .si-card.back .si-back-tri {
        position: absolute;
        top: -1px; right: -1px;
        width: 0; height: 0;
        border-style: solid;
        border-width: 0 60px 60px 0;
        border-color: transparent ${FPU.primary} transparent transparent;
      }

      @media print {
        @page { size: auto; margin: 10mm; }
        body * { visibility: hidden; }
        #si-card, #si-card * { visibility: visible; }
        #si-card { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; }
        .filter-bar, .greeting, .panel-head, #si-lost-panel { display: none !important; }
        .si-front-wrap, .si-back-wrap { display: block !important; }
        .si-card {
          width: 54mm; height: 85.6mm;
          box-shadow: none; border: none; border-radius: 3mm;
          margin: 0 auto; page-break-inside: avoid;
        }
        .si-front-wrap { page-break-after: always; }
      }
    `;
    document.head.appendChild(style);
  }

  async function load() {
    const box = $('si-card');
    if (!box) return;
    box.innerHTML = '<div class="loading" style="text-align:center;padding:2rem;"><span class="spinner"></span> Loading…</div>';

    try {
      const res = await core.portalFetch('/api/student/id-card');
      const d = res.data || res || {};
      const inst = d.institution || {};

      const initials = ((d.firstName || '?')[0] + (d.lastName || '?')[0]).toUpperCase();
      const fullName = [d.firstName, d.middleName, d.lastName].filter(Boolean).join(' ').trim();

      const shortName    = (inst.short || 'FPU').toUpperCase();
      const fullInstName = 'FEDERAL POLYTECHNIC, UGEP';
      const address      = inst.address || 'Ugep, Cross River State, Nigeria';
      const state        = inst.state   || 'Cross River State';
      const phone        = inst.phone   || '07069096879';
      const email        = inst.email   || 'contact@fedpolyugep.edu.ng';
      const website      = (inst.website || 'https://fedpolyugep.edu.ng').replace(/^https?:\/\//, '');

      const validTill = validTillLabel();

      const photo = d.photoUrl
        ? `<img src="${esc(d.photoUrl)}?v=${Date.now()}" alt="" style="width:100%;height:100%;object-fit:cover;"
             onerror="this.parentNode.innerHTML='<span style=\\'font-size:2.2rem;color:#94a3b8;font-weight:700;\\'>${initials}</span>'" />`
        : `<span style="font-size:2.2rem;color:#94a3b8;font-weight:700;">${initials}</span>`;

      const qrImg = d.qrDataUrl
        ? `<img src="${d.qrDataUrl}" alt="QR code" style="width:100%;height:100%;display:block;" />`
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:7px;color:#94a3b8;">QR</div>`;

      const logoTop = `
        <img src="/images/logo.png" alt="Logo"
             style="width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🎓',style:'font-size:24px;color:#fff;'}))" />`;
      const logoBack = `
        <img src="/images/logo.png" alt="Logo"
             style="width:52px;height:52px;object-fit:contain;"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🎓',style:'font-size:34px;color:${FPU.primary};'}))" />`;

      box.innerHTML = `
        <div style="max-width:360px;margin:0 auto;">

          <!-- ══════════════════ FRONT ══════════════════ -->
          <div class="si-front-wrap">
            <div class="si-card">

              <!-- TOP GREEN BAND -->
              <div class="si-top-band">
                ${logoTop}
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:800;font-size:12px;color:#fff;letter-spacing:.05em;line-height:1.1;">
                    FEDERAL POLYTECHNIC, UGEP
                  </div>
                  <div style="font-size:8px;color:rgba(255,255,255,.85);letter-spacing:.10em;margin-top:.15rem;">
                    ${esc(state.toUpperCase())} · NIGERIA
                  </div>
                </div>
              </div>

              <!-- YELLOW VERTICAL STUDENT ID TAB -->
              <div class="si-left-tab">
                <div class="si-left-tab-text">STUDENT ID CARD</div>
              </div>

              <!-- BOTTOM DIAGONAL STRIPES -->
              <div class="si-stripes"></div>
              <div class="si-right-band"></div>

              <!-- CONTENT -->
              <div class="si-content" style="padding-top:78px;">

                <!-- PHOTO -->
                <div style="display:flex;justify-content:center;margin-bottom:.7rem;">
                  <div style="
                    width:132px;height:160px;
                    background:#f1f5f9;
                    border-radius:10px;
                    border:3px solid ${FPU.primary};
                    outline:2px solid ${FPU.accent};
                    outline-offset:-7px;
                    overflow:hidden;
                    display:flex;align-items:center;justify-content:center;
                    box-shadow:0 6px 14px rgba(10,92,47,.20);
                  ">
                    ${photo}
                  </div>
                </div>

                <!-- NAME -->
                <div style="text-align:center;padding:0 1rem;">
                  <div style="font-size:1rem;font-weight:800;color:${FPU.primary};line-height:1.15;text-transform:uppercase;letter-spacing:.03em;">
                    ${esc(fullName)}
                  </div>
                </div>

                <!-- DETAIL ROWS -->
                <div style="margin-top:.85rem;padding:0 1.25rem;flex:1;">
                  <div style="
                    display:grid;grid-template-columns:80px 1fr;
                    gap:.4rem .55rem;font-size:.72rem;align-items:center;
                  ">
                    <div style="color:${FPU.muted};font-size:.62rem;font-weight:700;letter-spacing:.10em;text-transform:uppercase;">Matric No.</div>
                    <div style="color:${FPU.primary};font-weight:800;font-family:ui-monospace,monospace;font-size:.75rem;">${esc(d.matricNumber || '—')}</div>

                    <div style="color:${FPU.muted};font-size:.62rem;font-weight:700;letter-spacing:.10em;text-transform:uppercase;">Department</div>
                    <div style="color:${FPU.text};font-weight:700;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.departmentName || '—')}</div>

                    <div style="color:${FPU.muted};font-size:.62rem;font-weight:700;letter-spacing:.10em;text-transform:uppercase;">Programme</div>
                    <div style="color:${FPU.text};font-weight:700;font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.programmeName || '—')}</div>

                    <div style="color:${FPU.muted};font-size:.62rem;font-weight:700;letter-spacing:.10em;text-transform:uppercase;">Level</div>
                    <div style="color:${FPU.text};font-weight:700;font-size:.72rem;">${esc(d.levelDisplay || d.level || '—')}</div>
                  </div>
                </div>

                <!-- SIGNATURE + QR ROW -->
                <div style="
                  display:flex;align-items:flex-end;justify-content:space-between;
                  padding:.5rem 1.25rem .75rem;gap:.75rem;
                ">
                  <div style="flex:1;min-width:0;">
                    <div style="border-top:1px solid #94a3b8;width:100%;height:34px;position:relative;">
                      <div style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;">
                        ${signatureSvg(fullName)}
                      </div>
                    </div>
                    <div style="font-size:.55rem;color:${FPU.muted};letter-spacing:.08em;text-transform:uppercase;text-align:center;margin-top:2px;">
                      Authorized Signature
                    </div>
                  </div>

                  <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
                    <div style="width:56px;height:56px;padding:3px;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 2px 4px rgba(0,0,0,.06);">
                      ${qrImg}
                    </div>
                    <div style="font-size:.5rem;color:${FPU.muted};margin-top:.2rem;text-align:center;letter-spacing:.05em;font-weight:700;">
                      SCAN TO<br/>VERIFY
                    </div>
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- ══════════════════ BACK ══════════════════ -->
          <div class="si-back-wrap si-hidden">
            <div class="si-card back">
              <div class="si-back-bg"></div>
              <div class="si-back-frame">
                <div class="si-back-tri"></div>
                <div class="si-back-wave"></div>
              </div>

              <div class="si-content" style="padding:1.5rem 1.5rem 1rem;display:flex;flex-direction:column;align-items:center;text-align:center;">

                <!-- LOGO + QR ROW -->
                <div style="display:flex;justify-content:space-between;align-items:center;width:100%;margin-bottom:.85rem;">
                  ${logoBack}
                  <div style="display:flex;flex-direction:column;align-items:center;">
                    <div style="width:56px;height:56px;padding:3px;background:#fff;border:2px solid ${FPU.primary};border-radius:6px;">
                      ${qrImg}
                    </div>
                    <div style="font-size:.5rem;color:${FPU.muted};margin-top:.2rem;letter-spacing:.05em;font-weight:700;">
                      SCAN ME
                    </div>
                  </div>
                </div>

                <!-- INSTITUTION NAME -->
                <div style="font-weight:800;font-size:11px;color:${FPU.primary};letter-spacing:.05em;text-transform:uppercase;line-height:1.2;margin-bottom:.9rem;">
                  FEDERAL POLYTECHNIC, UGEP
                </div>

                <!-- MAIN STATEMENT -->
                <p style="
                  margin:0 0 1rem;
                  font-size:.72rem;
                  color:#334155;
                  line-height:1.55;
                  max-width:260px;
                ">
                  The person whose Photograph appears overleaf is a Student of the above Mentioned
                  <strong style="color:${FPU.primary};">FEDERAL POLYTECHNIC, UGEP</strong>
                </p>

                <!-- RETURN INSTRUCTIONS -->
                <div style="font-size:.68rem;color:#334155;line-height:1.7;margin-bottom:.85rem;">
                  <div style="margin-bottom:.35rem;">If found, please return to the nearest police station</div>
                  <div style="font-weight:800;color:${FPU.primary};font-size:.72rem;letter-spacing:.1em;margin:.3rem 0;">OR</div>
                  <div>Contact <strong style="color:${FPU.primary};">${esc(phone)}</strong></div>
                  <div>Email: <strong style="color:${FPU.primary};">${esc(email)}</strong></div>
                </div>

                <!-- SPACER -->
                <div style="flex:1;"></div>

                <!-- SIGNATURE -->
                <div style="width:140px;margin-top:.5rem;">
                  <div style="border-bottom:1px solid #475569;height:26px;position:relative;">
                    <div style="position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;">
                      ${signatureSvg(fullInstName)}
                    </div>
                  </div>
                  <div style="font-size:.55rem;color:${FPU.muted};letter-spacing:.08em;text-transform:uppercase;margin-top:2px;">
                    Authorized Signature
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- ═══ INSTRUCTIONS CARD (outside the physical card) ═══ -->
          <div style="
            margin-top:1rem;
            padding:.9rem 1.1rem;
            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:12px;
            font-size:11px;
            color:#14532d;
            line-height:1.5;
          ">
            <div style="font-weight:800;font-size:11px;margin-bottom:.3rem;color:${FPU.primary};">
              📮 IF THIS CARD IS FOUND
            </div>
            <div>Return it to <strong>${esc(fullInstName)}</strong> or the nearest police station.</div>
            <div style="margin-top:.35rem;display:grid;grid-template-columns:1fr;gap:.15rem;">
              <div>📍 ${esc(address)}</div>
              <div>📞 ${esc(phone)}</div>
              <div>📧 ${esc(email)}</div>
              <div>🌐 ${esc(website)}</div>
              <div style="word-break:break-all;">🔗 ${esc(d.lookupUrl || '—')}</div>
            </div>
          </div>

        </div>
      `;

      if (d.lookupUrl) {
        $('si-lost-panel').style.display = 'block';
        $('si-lookup-url').value = d.lookupUrl;
        $('si-open-lookup').href = d.lookupUrl;
      }

      // Flip toggle
      let showingBack = false;
      const flipBtn = $('si-flip');
      if (flipBtn) {
        flipBtn.addEventListener('click', () => {
          showingBack = !showingBack;
          const front = document.querySelector('.si-front-wrap');
          const back  = document.querySelector('.si-back-wrap');
          if (showingBack) {
            front.classList.add('si-hidden');
            back.classList.remove('si-hidden');
            flipBtn.textContent = '🔄 Show Front';
          } else {
            back.classList.add('si-hidden');
            front.classList.remove('si-hidden');
            flipBtn.textContent = '🔄 Flip Card';
          }
        });
      }
    } catch (err) {
      console.warn('[student-id-card]', err.message);
      box.innerHTML = '<p class="muted" style="text-align:center;padding:2rem;">Could not load ID card. Please try again.</p>';
    }
  }

  $('si-refresh')?.addEventListener('click', load);
  $('si-print')?.addEventListener('click', () => window.print());
  load();
})();
</script>
