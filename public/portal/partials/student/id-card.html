<!-- Portal → Student → ID Card -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🆔</div>
    <div>
      <h1>My ID Card</h1>
      <div class="sub">Your official student identification</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-outline btn-sm" id="si-refresh">Refresh</button>
  <button class="btn btn-primary btn-sm" id="si-print">🖨 Print</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>Student ID Card</h3></div>
  <div class="panel-body" id="si-card">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<section class="panel" id="si-lost-panel" style="display:none;">
  <div class="panel-head"><h3>🔍 Lost Card Lookup</h3></div>
  <div class="panel-body">
    <p class="muted small" style="margin-top:0;">
      If this card is lost, anyone can scan the QR code or visit the URL below to reach the owner's department.
    </p>
    <div class="form-group">
      <label>Public Lookup URL</label>
      <input type="text" id="si-lookup-url" readonly style="width:100%;max-width:560px;" />
    </div>
    <a class="btn btn-outline btn-sm" id="si-open-lookup" target="_blank">Open Lookup Page</a>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  // ---- Print-only CSS: CR80 portrait (54mm × 85.6mm) ----
  if (!document.getElementById('si-print-style')) {
    const style = document.createElement('style');
    style.id = 'si-print-style';
    style.textContent = `
      @media print {
        @page { size: auto; margin: 10mm; }
        body * { visibility: hidden; }
        #si-card, #si-card * { visibility: visible; }
        #si-card { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; }
        .filter-bar, .greeting, .panel-head, #si-lost-panel { display: none !important; }
        #si-card > div > div:first-child {
          width: 54mm;
          height: 85.6mm;
          box-shadow: none;
          border: none;
          border-radius: 3mm;
          margin: 0 auto;
          page-break-inside: avoid;
        }
      }`;
    document.head.appendChild(style);
  }

  async function load() {
    const box = $('si-card');
    if (!box) return;
    box.innerHTML = '<div class="loading" style="text-align:center;padding:2rem;"><span class="spinner"></span> Loading…</div>';

    try {
      const res = await core.portalFetch('/api/student/id-card');
      const d = res.data || res || {};
      const inst = d.institution || {};

      const initials = ((d.firstName || '?')[0] + (d.lastName || '?')[0]).toUpperCase();
      const fullName = [d.firstName, d.middleName, d.lastName].filter(Boolean).join(' ').trim();

      const photo = d.photoUrl
        ? `<img src="${esc(d.photoUrl)}?v=${Date.now()}" alt="" style="width:100%;height:100%;object-fit:cover;"
             onerror="this.parentNode.innerHTML='<span style=\\'font-size:3rem;color:#94a3b8;font-weight:700;\\'>${initials}</span>'" />`
        : `<span style="font-size:3rem;color:#94a3b8;font-weight:700;">${initials}</span>`;

      const qrImg = d.qrDataUrl
        ? `<img src="${d.qrDataUrl}" alt="QR code" style="width:100%;height:100%;display:block;" />`
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:8px;color:#94a3b8;text-align:center;">QR<br/>n/a</div>`;

      const logoImg = `
        <img src="/images/logo.png" alt="Logo"
             style="width:32px;height:32px;object-fit:contain;"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🎓',style:'font-size:22px;'}))" />`;

      box.innerHTML = `
        <div style="max-width:340px;margin:0 auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">

          <!-- ═══════════ VERTICAL ID CARD (340×560, CR80 portrait ratio) ═══════════ -->
          <div style="
            background:#fff;
            border-radius:14px;
            overflow:hidden;
            box-shadow:0 20px 50px rgba(6,95,70,.25);
            border:1px solid #e5e7eb;
            width:340px;
            height:560px;
            max-width:100%;
            margin:0 auto;
            display:flex;
            flex-direction:column;
            position:relative;
          ">

            <!-- ── HEADER: logo + name left, QR right ── -->
            <div style="
              display:flex;
              align-items:flex-start;
              justify-content:space-between;
              padding:1rem 1rem .5rem;
              gap:.75rem;
            ">
              <div style="display:flex;align-items:center;gap:.6rem;flex:1;min-width:0;">
                ${logoImg}
                <div style="min-width:0;">
                  <div style="font-weight:800;font-size:12px;color:#065f46;letter-spacing:.02em;line-height:1.15;">
                    ${esc((inst.short || 'FPU').toUpperCase())}
                  </div>
                  <div style="font-size:8.5px;color:#64748b;letter-spacing:.05em;text-transform:uppercase;">
                    ${esc((inst.name || 'Federal Polytechnic Ugep').replace(/Federal Polytechnic/i, '').trim() || 'Polytechnic')}
                  </div>
                </div>
              </div>

              <div style="
                width:60px;height:60px;
                padding:3px;
                background:#fff;
                border:1px solid #e2e8f0;
                border-radius:6px;
                flex-shrink:0;
              ">
                ${qrImg}
              </div>
            </div>

            <!-- ── DIVIDER ── -->
            <div style="height:2px;background:linear-gradient(90deg,#065f46,#10b981,#065f46);margin:0 1rem;"></div>

            <!-- ── PHOTO (large, centered) ── -->
            <div style="padding:1rem 1rem .75rem;text-align:center;">
              <div style="
                width:130px;height:160px;
                background:#f1f5f9;
                border-radius:12px;
                border:3px solid #065f46;
                overflow:hidden;
                display:inline-flex;align-items:center;justify-content:center;
                box-shadow:0 8px 20px rgba(6,95,70,.15);
              ">
                ${photo}
              </div>
            </div>

            <!-- ── NAME + SUBTITLE ── -->
            <div style="text-align:center;padding:0 1rem .75rem;">
              <div style="font-size:1.15rem;font-weight:800;color:#0f172a;line-height:1.15;text-transform:uppercase;letter-spacing:.01em;">
                ${esc(fullName)}
              </div>
              <div style="font-size:10.5px;color:#065f46;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:.25rem;">
                ${esc(d.programmeName || 'Student')}
              </div>
            </div>

            <!-- ── DETAIL ROWS ── -->
            <div style="padding:0 1.25rem .75rem;flex:1;">
              <div style="
                display:grid;
                grid-template-columns:70px 1fr;
                gap:.4rem .6rem;
                font-size:10px;
                align-items:center;
              ">
                <div style="color:#64748b;letter-spacing:.05em;text-transform:uppercase;font-size:9px;font-weight:600;">Matric</div>
                <div style="color:#0f172a;font-weight:700;font-family:ui-monospace,monospace;">${esc(d.matricNumber || '—')}</div>

                <div style="color:#64748b;letter-spacing:.05em;text-transform:uppercase;font-size:9px;font-weight:600;">Dept</div>
                <div style="color:#0f172a;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.departmentName || '—')}</div>

                <div style="color:#64748b;letter-spacing:.05em;text-transform:uppercase;font-size:9px;font-weight:600;">Level</div>
                <div style="color:#0f172a;font-weight:700;">${esc(d.levelDisplay || d.level || '—')}</div>
              </div>
            </div>

            <!-- ── FOOTER ── -->
            <div style="
              background:linear-gradient(90deg,#065f46,#047857);
              color:#fff;
              padding:.55rem 1rem;
              display:flex;
              align-items:center;
              justify-content:space-between;
              font-size:8.5px;
              letter-spacing:.08em;
              text-transform:uppercase;
            ">
              <div style="display:flex;align-items:center;gap:.4rem;">
                ${logoImg.replace('width:32px;height:32px', 'width:18px;height:18px')}
                <span style="font-weight:700;">${esc(inst.short || 'FPU')}</span>
              </div>
              <div style="font-weight:700;">STUDENT</div>
              <div>${esc(d.session || '—')}</div>
            </div>

          </div>

          <!-- ── BACK / INSTRUCTIONS ── -->
          <div style="
            margin-top:1rem;
            padding:1rem 1.25rem;
            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:12px;
            font-size:11.5px;
            color:#14532d;
            line-height:1.55;
          ">
            <div style="font-weight:800;font-size:11.5px;margin-bottom:.35rem;color:#065f46;">
              📮 IF THIS CARD IS FOUND
            </div>
            <div>Please return it to <strong>${esc(inst.name || 'Federal Polytechnic Ugep')}</strong> or hand it to any staff member.</div>
            <div style="margin-top:.4rem;display:grid;grid-template-columns:1fr;gap:.2rem;">
              <div><span style="color:#64748b;">📞</span> ${esc(inst.phone || '+234-XXX-XXX-XXXX')}</div>
              <div><span style="color:#64748b;">📧</span> ${esc(inst.email || 'info@fedpolyugep.edu.ng')}</div>
              <div><span style="color:#64748b;">📍</span> ${esc(inst.address || 'Ugep, Cross River State, Nigeria')}</div>
              <div style="word-break:break-all;"><span style="color:#64748b;">🌐</span> ${esc(d.lookupUrl || '—')}</div>
            </div>
          </div>

        </div>
      `;

      if (d.lookupUrl) {
        $('si-lost-panel').style.display = 'block';
        $('si-lookup-url').value = d.lookupUrl;
        $('si-open-lookup').href = d.lookupUrl;
      }
    } catch (err) {
      console.warn('[student-id-card]', err.message);
      box.innerHTML = '<p class="muted" style="text-align:center;padding:2rem;">Could not load ID card. Please try again.</p>';
    }
  }

  $('si-refresh')?.addEventListener('click', load);
  $('si-print')?.addEventListener('click', () => window.print());
  load();
})();
</script>
