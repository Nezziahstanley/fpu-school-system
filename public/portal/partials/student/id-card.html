<!-- Portal → Student → ID Card -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🆔</div>
    <div>
      <h1>My ID Card</h1>
      <div class="sub">Your official student identification</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-outline btn-sm" id="si-refresh">Refresh</button>
  <button class="btn btn-primary btn-sm" id="si-print">🖨 Print</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>Student ID Card</h3></div>
  <div class="panel-body" id="si-card">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<section class="panel" id="si-lost-panel" style="display:none;">
  <div class="panel-head"><h3>🔍 Lost Card Lookup</h3></div>
  <div class="panel-body">
    <p class="muted small" style="margin-top:0;">
      If this card is lost, anyone can scan the QR code or visit the URL below to reach the owner's department.
    </p>
    <div class="form-group">
      <label>Public Lookup URL</label>
      <input type="text" id="si-lookup-url" readonly style="width:100%;max-width:560px;" />
    </div>
    <a class="btn btn-outline btn-sm" id="si-open-lookup" target="_blank">Open Lookup Page</a>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  // ---- Print CSS: exact CR80 (85.6 × 54 mm) ----
  if (!document.getElementById('si-print-style')) {
    const style = document.createElement('style');
    style.id = 'si-print-style';
    style.textContent = `
      @media print {
        @page { size: auto; margin: 10mm; }
        body * { visibility: hidden; }
        #si-card, #si-card * { visibility: visible; }
        #si-card { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; }
        .filter-bar, .greeting, .panel-head, #si-lost-panel { display: none !important; }
        #si-card > div > div:first-child {
          width: 85.6mm;
          height: 54mm;
          box-shadow: none;
          border: none;
          border-radius: 3mm;
          margin: 0 auto;
          page-break-inside: avoid;
        }
      }`;
    document.head.appendChild(style);
  }

  async function load() {
    const box = $('si-card');
    if (!box) return;
    box.innerHTML = '<div class="loading" style="text-align:center;padding:2rem;"><span class="spinner"></span> Loading…</div>';

    try {
      const res = await core.portalFetch('/api/student/id-card');
      const d = res.data || res || {};
      const inst = d.institution || {};

      // Prefer local logo, fall back to remote, fall back to emoji
      const logoHtml = `
        <img src="/images/logo.png"
             alt="Logo"
             style="width:36px;height:36px;object-fit:contain;border-radius:50%;background:#fff;padding:2px;"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🎓',style:'font-size:26px;line-height:1;'}))" />
      `;

      const initials = ((d.firstName || '?')[0] + (d.lastName || '?')[0]).toUpperCase();
      const fullName = [d.firstName, d.middleName, d.lastName].filter(Boolean).join(' ').trim();

      const photo = d.photoUrl
        ? `<img src="${esc(d.photoUrl)}?v=${Date.now()}" alt="" style="width:100%;height:100%;object-fit:cover;"
             onerror="this.parentNode.innerHTML='<span style=\\'font-size:2.5rem;color:#94a3b8;font-weight:700;\\'>${initials}</span>'" />`
        : `<span style="font-size:2.5rem;color:#94a3b8;font-weight:700;">${initials}</span>`;

      const qrImg = d.qrDataUrl
        ? `<img src="${d.qrDataUrl}" alt="QR code" style="width:100%;height:100%;display:block;" />`
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:8px;color:#94a3b8;text-align:center;padding:4px;">QR<br/>unavailable</div>`;

      box.innerHTML = `
        <div style="max-width:640px;margin:0 auto;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">

          <!-- ═══════════ ID CARD (CR80 600×378) ═══════════ -->
          <div style="
            display:flex;
            background:#fff;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 15px 40px rgba(6,95,70,.20);
            border:1px solid #e5e7eb;
            width:600px;
            height:378px;
            max-width:100%;
            margin:0 auto;
          ">

            <!-- VERTICAL STRIP -->
            <div style="
              width:34px;
              background:linear-gradient(180deg,#065f46 0%,#047857 100%);
              display:flex;
              align-items:center;
              justify-content:center;
              flex-shrink:0;
            ">
              <div style="
                transform:rotate(-90deg);
                white-space:nowrap;
                color:#fff;
                font-weight:800;
                letter-spacing:.28em;
                font-size:9.5px;
              ">STUDENT ID</div>
            </div>

            <!-- MAIN BODY -->
            <div style="flex:1;display:flex;flex-direction:column;min-width:0;">

              <!-- HEADER with logo on the LEFT -->
              <div style="
                background:linear-gradient(90deg,#065f46,#047857);
                color:#fff;
                padding:.5rem .8rem;
                display:flex;
                align-items:center;
                gap:.65rem;
              ">
                <!-- LOGO -->
                <div style="flex-shrink:0;">${logoHtml}</div>

                <!-- INSTITUTION NAME -->
                <div style="flex:1;min-width:0;">
                  <div style="font-weight:800;font-size:11.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                    ${esc((inst.name || 'FEDERAL POLYTECHNIC UGEP').toUpperCase())}
                  </div>
                  <div style="font-size:8.5px;opacity:.85;letter-spacing:.05em;">
                    ${esc(inst.motto || 'Citadel of Technical Excellence')}
                  </div>
                </div>

                <!-- SESSION -->
                <div style="text-align:right;font-size:9px;opacity:.9;flex-shrink:0;">
                  <div style="letter-spacing:.05em;">SESSION</div>
                  <div style="font-weight:700;font-size:10.5px;">${esc(d.session || '—')}</div>
                </div>
              </div>

              <!-- BODY: photo left, details middle, QR right -->
              <div style="flex:1;display:flex;gap:.65rem;padding:.65rem;">

                <!-- PHOTO -->
                <div style="
                  width:96px;height:120px;
                  background:#f1f5f9;
                  border-radius:8px;
                  border:2px solid #e2e8f0;
                  overflow:hidden;
                  display:flex;align-items:center;justify-content:center;
                  flex-shrink:0;
                ">
                  ${photo}
                </div>

                <!-- DETAILS — natural flow, no forced spacing -->
                <div style="flex:1;min-width:0;padding-top:.15rem;">

                  <div style="font-size:1rem;font-weight:800;color:#0f172a;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                    ${esc(fullName)}
                  </div>
                  <div style="font-size:10px;color:#065f46;font-weight:600;margin-top:.15rem;font-family:ui-monospace,monospace;">
                    ${esc(d.matricNumber || '—')}
                  </div>

                  <div style="margin-top:.55rem;font-size:10.5px;color:#334155;line-height:1.5;">
                    <div style="display:flex;gap:.4rem;">
                      <span style="color:#64748b;min-width:68px;">Programme</span>
                      <strong style="color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.programmeName || '—')}</strong>
                    </div>
                    <div style="display:flex;gap:.4rem;">
                      <span style="color:#64748b;min-width:68px;">Department</span>
                      <strong style="color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(d.departmentName || '—')}</strong>
                    </div>
                    <div style="display:flex;gap:.4rem;">
                      <span style="color:#64748b;min-width:68px;">Level</span>
                      <strong style="color:#0f172a;">${esc(d.levelDisplay || d.level || '—')}</strong>
                    </div>
                  </div>

                </div>

                <!-- QR -->
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;">
                  <div style="
                    width:80px;height:80px;
                    padding:3px;
                    background:#fff;
                    border:1px solid #e2e8f0;
                    border-radius:6px;
                  ">
                    ${qrImg}
                  </div>
                  <div style="font-size:7px;color:#64748b;margin-top:.2rem;text-align:center;letter-spacing:.03em;font-weight:600;">
                    SCAN TO<br/>VERIFY
                  </div>
                </div>

              </div>
            </div>
          </div>

          <!-- BACK / INSTRUCTIONS -->
          <div style="
            margin-top:.85rem;
            padding:.85rem 1rem;
            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:12px;
            font-size:11.5px;
            color:#14532d;
            line-height:1.55;
          ">
            <div style="font-weight:800;font-size:11.5px;margin-bottom:.35rem;color:#065f46;">
              📮 IF THIS CARD IS FOUND
            </div>
            <div>Please return it to <strong>${esc(inst.name || 'Federal Polytechnic Ugep')}</strong> or hand it to any staff member.</div>
            <div style="margin-top:.4rem;display:grid;grid-template-columns:1fr 1fr;gap:.2rem .75rem;">
              <div><span style="color:#64748b;">📞 Phone</span> ${esc(inst.phone || '+234-XXX-XXX-XXXX')}</div>
              <div><span style="color:#64748b;">📧 Email</span> ${esc(inst.email || 'info@fedpolyugep.edu.ng')}</div>
              <div style="grid-column:1 / -1;"><span style="color:#64748b;">📍 Address</span> ${esc(inst.address || 'Ugep, Cross River State, Nigeria')}</div>
              <div style="grid-column:1 / -1;word-break:break-all;">
                <span style="color:#64748b;">🌐 Verify at</span> ${esc(d.lookupUrl || '—')}
              </div>
            </div>
          </div>

        </div>
      `;

      if (d.lookupUrl) {
        $('si-lost-panel').style.display = 'block';
        $('si-lookup-url').value = d.lookupUrl;
        $('si-open-lookup').href = d.lookupUrl;
      }
    } catch (err) {
      console.warn('[student-id-card]', err.message);
      box.innerHTML = '<p class="muted" style="text-align:center;padding:2rem;">Could not load ID card. Please try again.</p>';
    }
  }

  $('si-refresh')?.addEventListener('click', load);
  $('si-print')?.addEventListener('click', () => window.print());
  load();
})();
</script>
