<!-- Portal → Student → ID Card -->
<section class="greeting">
  <div class="who">
    <div class="avatar">🆔</div>
    <div>
      <h1>My ID Card</h1>
      <div class="sub">Your official student identification</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-outline btn-sm" id="si-refresh">Refresh</button>
  <button class="btn btn-primary btn-sm" id="si-print">🖨 Print</button>
</div>

<section class="panel">
  <div class="panel-head"><h3>Student ID Card</h3></div>
  <div class="panel-body" id="si-card">
    <div class="loading"><span class="spinner"></span> Loading…</div>
  </div>
</section>

<section class="panel" id="si-lost-panel" style="display:none;">
  <div class="panel-head"><h3>🔍 Lost Card Lookup</h3></div>
  <div class="panel-body">
    <p class="muted small" style="margin-top:0;">
      If this card is lost, anyone can scan the QR code or visit the URL below to reach the owner's department.
    </p>
    <div class="form-group">
      <label>Public Lookup URL</label>
      <input type="text" id="si-lookup-url" readonly style="width:100%;max-width:560px;" />
    </div>
    <a class="btn btn-outline btn-sm" id="si-open-lookup" target="_blank">Open Lookup Page</a>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  // FPU colors
  const FPU = {
    primary: '#065f46',
    accent:  '#10b981',
    dark:    '#064e3b',
    light:   '#d1fae5',
    pale:    '#ecfdf5',
    text:    '#0f172a',
    muted:   '#64748b',
    white:   '#ffffff',
  };

  // -------- Inject card + print CSS once --------
  if (!document.getElementById('si-print-style')) {
    const style = document.createElement('style');
    style.id = 'si-print-style';
    style.textContent = `
      .si-card {
        position: relative;
        width: 340px;
        height: 540px;
        max-width: 100%;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(6,95,70,.22);
        border: 1px solid #e5e7eb;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      /* Big green rounded corner wave (top-right) */
      .si-card .si-wave-tr {
        position: absolute;
        top: -100px; right: -100px;
        width: 240px; height: 240px;
        border-radius: 50%;
        background: linear-gradient(135deg, ${FPU.primary}, ${FPU.accent});
        opacity: .12;
        pointer-events: none;
      }

      /* Big green diagonal sweep across bottom half */
      .si-card .si-sweep {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 45%;
        background: linear-gradient(135deg, ${FPU.primary} 0%, ${FPU.accent} 100%);
        clip-path: polygon(0 65%, 100% 20%, 100% 100%, 0 100%);
        pointer-events: none;
      }

      /* Small accent wave on top of sweep for a layered look */
      .si-card .si-sweep-2 {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 40%;
        background: linear-gradient(135deg, ${FPU.accent} 0%, ${FPU.primary} 100%);
        clip-path: polygon(0 80%, 100% 40%, 100% 100%, 0 100%);
        opacity: .35;
        pointer-events: none;
      }

      /* Bottom-left small solid triangle accent */
      .si-card .si-triangle {
        position: absolute;
        bottom: 0; left: 0;
        width: 0; height: 0;
        border-style: solid;
        border-width: 0 0 60px 100px;
        border-color: transparent transparent ${FPU.dark} transparent;
        opacity: .9;
        pointer-events: none;
      }

      .si-content {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 1rem;
      }

      @media print {
        @page { size: auto; margin: 10mm; }
        body * { visibility: hidden; }
        #si-card, #si-card * { visibility: visible; }
        #si-card { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; }
        .filter-bar, .greeting, .panel-head, #si-lost-panel { display: none !important; }
        .si-card {
          width: 54mm; height: 85.6mm;
          box-shadow: none; border: none; border-radius: 3mm;
          margin: 0 auto; page-break-inside: avoid;
        }
      }
    `;
    document.head.appendChild(style);
  }

  async function load() {
    const box = $('si-card');
    if (!box) return;
    box.innerHTML = '<div class="loading" style="text-align:center;padding:2rem;"><span class="spinner"></span> Loading…</div>';

    try {
      const res = await core.portalFetch('/api/student/id-card');
      const d = res.data || res || {};
      const inst = d.institution || {};

      const initials = ((d.firstName || '?')[0] + (d.lastName || '?')[0]).toUpperCase();
      const fullName = [d.firstName, d.middleName, d.lastName].filter(Boolean).join(' ').trim();
      const shortName = (inst.short || 'FPU').toUpperCase();
      const fullInstName = inst.name || 'Federal Polytechnic Ugep';
      const address = inst.address || 'Ugep, Cross River State, Nigeria';

      const photo = d.photoUrl
        ? `<img src="${esc(d.photoUrl)}?v=${Date.now()}" alt="" style="width:100%;height:100%;object-fit:cover;"
             onerror="this.parentNode.innerHTML='<span style=\\'font-size:2.4rem;color:#94a3b8;font-weight:700;\\'>${initials}</span>'" />`
        : `<span style="font-size:2.4rem;color:#94a3b8;font-weight:700;">${initials}</span>`;

      const qrImg = d.qrDataUrl
        ? `<img src="${d.qrDataUrl}" alt="QR code" style="width:100%;height:100%;display:block;" />`
        : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:7px;color:#94a3b8;">QR<br/>n/a</div>`;

      const logoTop = `
        <img src="/images/logo.png" alt="Logo"
             style="width:26px;height:26px;object-fit:contain;"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'🎓',style:'font-size:18px;'}))" />`;

      // Simple SVG icons
      const ICON = {
        id:    `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M13 10h5M13 14h5"/></svg>`,
        dept:  `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/></svg>`,
        level: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 4 2 10l10 6 10-6z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>`,
      };

      box.innerHTML = `
        <div style="max-width:360px;margin:0 auto;">

          <div class="si-card">

            <!-- Background decor -->
            <div class="si-wave-tr"></div>
            <div class="si-sweep"></div>
            <div class="si-sweep-2"></div>
            <div class="si-triangle"></div>

            <div class="si-content">

              <!-- ═══════ HEADER ═══════ -->
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">
                <div>
                  <div style="font-weight:800;font-size:12px;color:${FPU.primary};letter-spacing:.02em;line-height:1;">
                    ${esc(shortName)}
                  </div>
                  <div style="font-size:6.5px;color:${FPU.muted};letter-spacing:.16em;text-transform:uppercase;margin-top:.25rem;font-weight:600;">
                    Polytechnic
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:.5rem;">
                  <div style="text-align:right;">
                    <div style="font-size:6.5px;color:${FPU.primary};letter-spacing:.16em;text-transform:uppercase;font-weight:800;">
                      ${esc(shortName)}
                    </div>
                    <div style="font-size:5.5px;color:${FPU.muted};letter-spacing:.14em;text-transform:uppercase;margin-top:1px;">
                      Student ID
                    </div>
                  </div>
                  ${logoTop}
                </div>
              </div>

              <!-- ═══════ PHOTO (big, centered) ═══════ -->
              <div style="display:flex;justify-content:center;margin-bottom:.9rem;">
                <div style="
                  width:145px;height:165px;
                  background:#f1f5f9;
                  border-radius:14px;
                  border:3px solid ${FPU.primary};
                  overflow:hidden;
                  display:flex;align-items:center;justify-content:center;
                  box-shadow:0 8px 18px rgba(6,95,70,.20);
                ">
                  ${photo}
                </div>
              </div>

              <!-- ═══════ NAME + ROLE ═══════ -->
              <div style="text-align:center;margin-bottom:.85rem;">
                <div style="font-size:1.05rem;font-weight:800;color:${FPU.primary};line-height:1.1;text-transform:uppercase;letter-spacing:.02em;">
                  ${esc(fullName)}
                </div>
                <div style="font-size:7.5px;color:${FPU.muted};font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-top:.3rem;">
                  ${esc(d.programmeName || 'Student')}
                </div>
              </div>

              <!-- ═══════ ICON DETAIL ROWS ═══════ -->
              <div style="display:flex;flex-direction:column;gap:.5rem;padding-left:.5rem;">

                <div style="display:flex;align-items:center;gap:.5rem;">
                  <div style="width:22px;height:22px;border-radius:50%;background:${FPU.light};color:${FPU.primary};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    ${ICON.id}
                  </div>
                  <div style="min-width:0;">
                    <div style="font-size:6px;color:${FPU.muted};letter-spacing:.16em;text-transform:uppercase;font-weight:700;line-height:1;">Matric</div>
                    <div style="font-size:9px;color:${FPU.text};font-weight:700;font-family:ui-monospace,monospace;margin-top:2px;">${esc(d.matricNumber || '—')}</div>
                  </div>
                </div>

                <div style="display:flex;align-items:center;gap:.5rem;">
                  <div style="width:22px;height:22px;border-radius:50%;background:${FPU.light};color:${FPU.primary};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    ${ICON.dept}
                  </div>
                  <div style="min-width:0;">
                    <div style="font-size:6px;color:${FPU.muted};letter-spacing:.16em;text-transform:uppercase;font-weight:700;line-height:1;">Department</div>
                    <div style="font-size:9px;color:${FPU.text};font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">${esc(d.departmentName || '—')}</div>
                  </div>
                </div>

                <div style="display:flex;align-items:center;gap:.5rem;">
                  <div style="width:22px;height:22px;border-radius:50%;background:${FPU.light};color:${FPU.primary};display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    ${ICON.level}
                  </div>
                  <div style="min-width:0;">
                    <div style="font-size:6px;color:${FPU.muted};letter-spacing:.16em;text-transform:uppercase;font-weight:700;line-height:1;">Level</div>
                    <div style="font-size:9px;color:${FPU.text};font-weight:700;margin-top:2px;">${esc(d.levelDisplay || d.level || '—')}</div>
                  </div>
                </div>

              </div>

              <!-- ═══════ SPACER (QR sits on green band) ═══════ -->
              <div style="flex:1;"></div>

              <!-- ═══════ BOTTOM: session label + QR ═══════ -->
              <div style="display:flex;align-items:flex-end;justify-content:space-between;color:#fff;">
                <div style="font-size:6px;letter-spacing:.16em;text-transform:uppercase;opacity:.9;">
                  <div>Session</div>
                  <div style="font-weight:800;font-size:8.5px;margin-top:2px;">${esc(d.session || '—')}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;">
                  <div style="
                    width:62px;height:62px;
                    padding:4px;
                    background:#fff;
                    border-radius:8px;
                    box-shadow:0 4px 10px rgba(0,0,0,.20);
                  ">
                    ${qrImg}
                  </div>
                  <div style="font-size:5.5px;color:#fff;margin-top:.25rem;text-align:center;letter-spacing:.10em;font-weight:700;opacity:.9;line-height:1.2;">
                    SCAN TO<br/>VERIFY
                  </div>
                </div>
              </div>

            </div>
          </div>

          <!-- ═══ BACK (not displayed here — for print) ═══ -->
          <div class="si-card si-back" style="display:none;">
            <!-- Printed separately if needed -->
          </div>

          <!-- ═══ INSTRUCTIONS (outside the card) ═══ -->
          <div style="
            margin-top:1rem;
            padding:.9rem 1.1rem;
            background:#f0fdf4;
            border:1px solid #bbf7d0;
            border-radius:12px;
            font-size:11px;
            color:#14532d;
            line-height:1.5;
          ">
            <div style="font-weight:800;font-size:11px;margin-bottom:.3rem;color:#065f46;">
              📮 IF THIS CARD IS FOUND
            </div>
            <div>Return it to <strong>${esc(fullInstName)}</strong> or hand it to any staff member.</div>
            <div style="margin-top:.35rem;display:grid;grid-template-columns:1fr;gap:.15rem;">
              <div><span style="color:#64748b;">📍</span> ${esc(address)}</div>
              <div><span style="color:#64748b;">📞</span> ${esc(inst.phone || '+234-XXX-XXX-XXXX')}</div>
              <div><span style="color:#64748b;">📧</span> ${esc(inst.email || 'info@fedpolyugep.edu.ng')}</div>
              <div style="word-break:break-all;"><span style="color:#64748b;">🌐</span> ${esc(d.lookupUrl || '—')}</div>
            </div>
          </div>

        </div>
      `;

      if (d.lookupUrl) {
        $('si-lost-panel').style.display = 'block';
        $('si-lookup-url').value = d.lookupUrl;
        $('si-open-lookup').href = d.lookupUrl;
      }
    } catch (err) {
      console.warn('[student-id-card]', err.message);
      box.innerHTML = '<p class="muted" style="text-align:center;padding:2rem;">Could not load ID card. Please try again.</p>';
    }
  }

  $('si-refresh')?.addEventListener('click', load);
  $('si-print')?.addEventListener('click', () => window.print());
  load();
})();
</script>
