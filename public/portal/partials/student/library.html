<!-- Portal → Student → Library -->
<div style="padding:0;">

  <!-- HEADER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📚</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">My Library</div>
        <div style="font-size:.82rem;color:#d1fae5;">Browse books, borrow, and manage fines</div>
      </div>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📚</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-books">—</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Available Books</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📖</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-borrows">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">My Borrows</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;color:#991b1b;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">💰</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-fines">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Unpaid Fines</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">💸</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-owed">₦0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total Owed</div>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div style="display:flex;gap:.5rem;margin-bottom:1rem;">
    <button class="lib-tab active" data-tab="catalogue">📚 Catalogue</button>
    <button class="lib-tab" data-tab="borrows">📖 My Borrows</button>
    <button class="lib-tab" data-tab="fines">💰 Fines</button>
  </div>

  <!-- PANELS -->
  <div id="panel-catalogue">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
      <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="font-weight:800;font-size:.9rem;color:#0f172a;">Books for You</div>
          <span class="badge" id="count-catalogue" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
        </div>
      </div>
      <div style="padding:1rem;border-bottom:1px solid #f1f5f9;display:flex;gap:.5rem;flex-wrap:wrap;">
        <input type="search" id="lib-search" placeholder="Search title, author, category..." style="flex:1;min-width:200px;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;" />
        <select id="lib-category" style="padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;">
          <option value="">All Categories</option>
        </select>
        <button id="lib-refresh" style="padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">↻ Refresh</button>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Author</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Category</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Copies</th>
            </tr>
          </thead>
          <tbody id="catalogue-tbody">
            <tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="panel-borrows" style="display:none;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
      <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;">
        <div style="font-weight:800;font-size:.9rem;color:#0f172a;">My Borrowed Books</div>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Book</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Borrowed</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Due</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            </tr>
          </thead>
          <tbody id="borrows-tbody">
            <tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="panel-fines" style="display:none;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
      <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;">
        <div style="font-weight:800;font-size:.9rem;color:#0f172a;">My Fines</div>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
          <thead>
            <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Book</th>
              <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Reason</th>
              <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Amount</th>
              <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            </tr>
          </thead>
          <tbody id="fines-tbody">
            <tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<style>
  .lib-tab {
    padding: .5rem 1rem; font-size: .82rem; font-weight: 700;
    background: #fff; color: #475569; border: 1px solid #e5e7eb;
    border-radius: 8px; cursor: pointer;
  }
  .lib-tab.active { background: #065f46; color: #fff; border-color: #065f46; }
  .lib-tab:hover:not(.active) { background: #f1f5f9; }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—';
  const fmtMoney = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');

  let CATALOGUE = [];
  let BORROWS = [];
  let FINES = [];

  // ----- Catalogue -----
  async function loadCatalogue() {
    try {
      const res = await core.portalFetch('/api/student/library/catalogue');
      CATALOGUE = res.data || [];
      $('stat-books').textContent = CATALOGUE.length;
      renderCatalogue();
    } catch (err) {
      $('catalogue-tbody').innerHTML = `<tr><td colspan="4" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function renderCatalogue() {
    const q = ($('lib-search').value || '').toLowerCase();
    const cat = $('lib-category').value;

    const filtered = CATALOGUE.filter(b => {
      if (q) {
        const hay = `${b.title} ${b.author} ${b.category}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (cat && b.category !== cat) return false;
      return true;
    });

    $('count-catalogue').textContent = filtered.length;

    if (!filtered.length) {
      $('catalogue-tbody').innerHTML = '<tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">No books match your search.</td></tr>';
      return;
    }

    $('catalogue-tbody').innerHTML = filtered.map(b => `
      <tr style="border-bottom:1px solid #f1f5f9;">
        <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(b.title)}</td>
        <td style="padding:.65rem .75rem;color:#475569;">${esc(b.author || '—')}</td>
        <td style="padding:.65rem .75rem;color:#64748b;text-transform:capitalize;">${esc(b.category || '—')}</td>
        <td style="padding:.65rem .75rem;text-align:center;">
          <span style="padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;background:${b.copiesAvailable > 0 ? '#d1fae5' : '#fee2e2'};color:${b.copiesAvailable > 0 ? '#065f46' : '#991b1b'};">
            ${esc(b.copiesAvailable || 0)} / ${esc(b.copiesTotal || 0)}
          </span>
        </td>
      </tr>
    `).join('');
  }

  // ----- Borrows -----
  async function loadBorrows() {
    try {
      const res = await core.portalFetch('/api/student/library/borrows');
      BORROWS = res.data || [];
      $('stat-borrows').textContent = BORROWS.length;

      if (!BORROWS.length) {
        $('borrows-tbody').innerHTML = '<tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">You have not borrowed any books.</td></tr>';
        return;
      }

      const now = new Date();
      $('borrows-tbody').innerHTML = BORROWS.map(b => {
        const returned = b.returnedAt !== null;
        const overdue = !returned && new Date(b.dueAt) < now;
        let badge = '';
        if (returned) badge = '<span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">Returned</span>';
        else if (overdue) badge = '<span style="background:#fee2e2;color:#991b1b;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">Overdue</span>';
        else badge = '<span style="background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;">Active</span>';

        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(b.title)}</td>
            <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(b.borrowedAt)}</td>
            <td style="padding:.65rem .75rem;text-align:center;color:#475569;">${fmtDate(b.dueAt)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">${badge}</td>
          </tr>
        `;
      }).join('');
    } catch (err) {
      $('borrows-tbody').innerHTML = `<tr><td colspan="4" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  // ----- Fines -----
  async function loadFines() {
    try {
      const res = await core.portalFetch('/api/student/library/fines');
      FINES = res.data || [];
      const unpaid = FINES.filter(f => f.status === 'pending' || f.status === 'unpaid');
      $('stat-fines').textContent = unpaid.length;
      $('stat-owed').textContent = fmtMoney(unpaid.reduce((s, f) => s + Number(f.amount || 0), 0));

      if (!FINES.length) {
        $('fines-tbody').innerHTML = '<tr><td colspan="4" style="padding:2rem;text-align:center;color:#94a3b8;">No fines on record. 🎉</td></tr>';
        return;
      }

      $('fines-tbody').innerHTML = FINES.map(f => {
        const paid = f.status === 'paid';
        return `
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;font-weight:700;color:#0f172a;">${esc(f.title || '—')}</td>
            <td style="padding:.65rem .75rem;color:#475569;">${esc(f.reason || '—')}</td>
            <td style="padding:.65rem .75rem;text-align:right;font-weight:700;color:${paid ? '#065f46' : '#991b1b'};">${fmtMoney(f.amount)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">
              <span style="background:${paid ? '#d1fae5' : '#fef3c7'};color:${paid ? '#065f46' : '#92400e'};padding:2px 8px;border-radius:5px;font-size:.72rem;font-weight:800;text-transform:capitalize;">${esc(f.status)}</span>
            </td>
          </tr>
        `;
      }).join('');
    } catch (err) {
      $('fines-tbody').innerHTML = `<tr><td colspan="4" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  // ----- Tabs -----
  function switchTab(tab) {
    document.querySelectorAll('.lib-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    $('panel-catalogue').style.display = tab === 'catalogue' ? 'block' : 'none';
    $('panel-borrows').style.display = tab === 'borrows' ? 'block' : 'none';
    $('panel-fines').style.display = tab === 'fines' ? 'block' : 'none';
  }

  document.querySelectorAll('.lib-tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
  });

  // Populate categories from catalogue
  function populateCategories() {
    const cats = [...new Set(CATALOGUE.map(b => b.category).filter(Boolean))];
    const sel = $('lib-category');
    sel.innerHTML = '<option value="">All Categories</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  }

  // Wiring
  $('lib-search')?.addEventListener('input', renderCatalogue);
  $('lib-category')?.addEventListener('change', renderCatalogue);
  $('lib-refresh')?.addEventListener('click', () => {
    loadCatalogue().then(populateCategories);
    loadBorrows();
    loadFines();
  });

  // Initial load
  loadCatalogue().then(populateCategories);
  loadBorrows();
  loadFines();
})();
</script>
