<!-- Portal → Student → Library -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📚</div>
    <div>
      <h1>My Library</h1>
      <div class="sub">Browse books, borrow, and manage fines</div>
    </div>
  </div>
</section>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Available Books</span><span class="value" id="sl-avail">—</span></div><div class="ic">📚</div></div>
  <div class="stat blue"><div class="meta"><span class="label">My Borrows</span><span class="value" id="sl-borrows">—</span></div><div class="ic">📤</div></div>
  <div class="stat red"><div class="meta"><span class="label">Unpaid Fines</span><span class="value" id="sl-fines">—</span></div><div class="ic">💰</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Total Owed</span><span class="value" id="sl-owed">—</span></div><div class="ic">💵</div></div>
</div>

<!-- Tabs -->
<div class="filter-bar" style="padding:.5rem;gap:.25rem;">
  <button class="btn btn-primary btn-sm" data-slt="catalogue">📖 Catalogue</button>
  <button class="btn btn-outline btn-sm" data-slt="borrows">📤 My Borrows</button>
  <button class="btn btn-outline btn-sm" data-slt="fines">💰 Fines</button>
</div>

<!-- Catalogue -->
<section class="panel" id="sl-tab-catalogue">
  <div class="panel-head">
    <h3>Books for You</h3>
    <span class="badge" id="sl-cat-count">0</span>
  </div>
  <div class="panel-body">
    <div class="filter-bar" style="box-shadow:none;background:transparent;padding:0 .5rem .5rem 0;">
      <input type="search" id="sl-cat-search" placeholder="Search title, author, category…" />
      <select id="sl-cat-category"><option value="">All Categories</option></select>
      <button class="btn btn-outline btn-sm" id="sl-cat-refresh">Refresh</button>
    </div>
    <div class="table-wrap" style="margin-top:.5rem;">
      <table class="data-table">
        <thead><tr><th>Title</th><th>Author</th><th>Category</th><th>Copies</th><th>Action</th></tr></thead>
        <tbody id="sl-cat-tbody">
          <tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Borrows -->
<section class="panel" id="sl-tab-borrows" style="display:none;">
  <div class="panel-head"><h3>My Borrowed Books</h3><span class="badge" id="sl-b-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Book</th><th>Borrowed</th><th>Due</th><th>Returned</th><th>Status</th></tr></thead>
        <tbody id="sl-borrows-tbody">
          <tr><td colspan="5" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<!-- Fines -->
<section class="panel" id="sl-tab-fines" style="display:none;">
  <div class="panel-head"><h3>My Fines</h3><span class="badge" id="sl-f-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Amount</th><th>Reason</th><th>Status</th><th>Date</th></tr></thead>
        <tbody id="sl-fines-tbody">
          <tr><td colspan="4" class="empty">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';

  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => (core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s));
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  const fmtMoney = (n) => '₦' + Number(n || 0).toLocaleString('en-NG');
  const fmtDate = (d) => {
    if (!d) return '—';
    const dt = new Date(d);
    return isNaN(dt) ? '—' : dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  };

  // Student endpoints — no /admin prefix
  const API = '/api/student/library';

  let CATALOGUE = [];
  let CAT_FILTERED = [];

  // ---------- Tabs ----------
  function initTabs() {
    document.querySelectorAll('[data-slt]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.slt;
        document.querySelectorAll('[data-slt]').forEach((b) => {
          b.classList.toggle('btn-primary', b === btn);
          b.classList.toggle('btn-outline', b !== btn);
        });
        ['catalogue', 'borrows', 'fines'].forEach((t) => {
          const panel = $('sl-tab-' + t);
          if (panel) panel.style.display = t === tab ? '' : 'none';
        });
        if (tab === 'borrows') loadBorrows();
        if (tab === 'fines') loadFines();
      });
    });
  }

  // ---------- Stats ----------
  async function refreshStats() {
    try {
      const [borrowsRes, finesRes] = await Promise.all([
        core.portalFetch('/api/student/borrows').catch(() => ({ borrows: [], fines: [] })),
        Promise.resolve(null),
      ]);
      const borrows = (borrowsRes && borrowsRes.borrows) || [];
      const fines = (borrowsRes && borrowsRes.fines) || [];

      const activeBorrows = borrows.filter((b) => (b.borrow && b.borrow.status) === 'borrowed');
      setText('sl-borrows', activeBorrows.length);

      const unpaid = fines.filter((f) => !f.isPaid);
      setText('sl-fines', unpaid.length);

      const owed = unpaid.reduce((n, f) => n + Number(f.amount || 0), 0);
      setText('sl-owed', fmtMoney(owed));
    } catch {
      // leave em-dashes
    }
  }

  // ---------- Catalogue ----------
  async function loadCatalogue() {
    const tbody = $('sl-cat-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="5" class="empty"><span class="spinner"></span> Loading…</td></tr>';

    try {
      const json = await core.portalFetch('/api/student/library/catalogue');
      CATALOGUE = (json && json.data) || [];
      populateCategories(CATALOGUE);
      applyCatalogueFilters();

      const avail = CATALOGUE.reduce((n, b) => n + Number(b.copiesAvailable || 0), 0);
      setText('sl-avail', avail);
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">' + esc(err.message) + '</td></tr>';
    }
  }

  function populateCategories(rows) {
    const sel = $('sl-cat-category');
    if (!sel) return;
    const cats = [...new Set(rows.map((b) => b.category).filter(Boolean))].sort();
    sel.innerHTML =
      '<option value="">All Categories</option>' +
      cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  }

  function applyCatalogueFilters() {
    const q = ($('sl-cat-search')?.value || '').trim().toLowerCase();
    const cat = $('sl-cat-category')?.value || '';

    CAT_FILTERED = CATALOGUE.filter((b) => {
      if (cat && b.category !== cat) return false;
      if (!q) return true;
      return (
        (b.title || '').toLowerCase().includes(q) ||
        (b.author || '').toLowerCase().includes(q) ||
        (b.category || '').toLowerCase().includes(q)
      );
    });

    renderCatalogue(CAT_FILTERED);
    setText('sl-cat-count', CAT_FILTERED.length);
  }

  function renderCatalogue(rows) {
    const tbody = $('sl-cat-tbody');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">No books match your search.</td></tr>';
      return;
    }
    tbody.innerHTML = rows
      .map((b) => {
        const available = Number(b.copiesAvailable || 0) > 0;
        const tag = b._scope === 'general'
          ? ' <span class="badge" title="Open to all students">General</span>'
          : '';
        return `
          <tr>
            <td>${esc(b.title)}${tag}</td>
            <td>${esc(b.author || '—')}</td>
            <td>${esc(b.category || '—')}</td>
            <td>${b.copiesAvailable ?? 0} / ${b.copiesTotal ?? 0}</td>
            <td>
              <button class="btn btn-sm ${available ? 'btn-primary' : 'btn-outline'}"
                      data-borrow="${b.id}" ${available ? '' : 'disabled'}>
                ${available ? 'Borrow' : 'Unavailable'}
              </button>
            </td>
          </tr>`;
      })
      .join('');

    tbody.querySelectorAll('[data-borrow]').forEach((btn) => {
      btn.addEventListener('click', () => borrowBook(btn.dataset.borrow));
    });
  }

  async function borrowBook(bookId) {
    if (!confirm('Borrow this book?')) return;
    try {
      await core.portalFetch('/api/student/library/borrow', {
        method: 'POST',
        body: { bookId: Number(bookId) },
      });
      core.showToast && core.showToast('Book borrowed successfully.', 'success');
      loadCatalogue();
      refreshStats();
    } catch (err) {
      core.showToast ? core.showToast(err.message, 'error') : alert(err.message);
    }
  }

  // ---------- Borrows ----------
  async function loadBorrows() {
    const tbody = $('sl-borrows-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Loading…</td></tr>';

    try {
      const json = await core.portalFetch('/api/student/borrows');
      const rows = (json && json.borrows) || [];
      setText('sl-b-count', rows.length);

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No borrows yet.</td></tr>';
        return;
      }

      tbody.innerHTML = rows
        .map((entry) => {
          const b = entry.borrow || {};
          const book = entry.book || {};
          const overdue = b.status === 'borrowed' && b.dueAt && new Date(b.dueAt) < new Date();
          const badge = overdue
            ? '<span class="badge red">Overdue</span>'
            : b.status === 'returned'
            ? '<span class="badge">Returned</span>'
            : b.status === 'lost'
            ? '<span class="badge red">Lost</span>'
            : '<span class="badge blue">Borrowed</span>';
          return `
            <tr>
              <td>${esc(book.title || '—')}</td>
              <td>${fmtDate(b.borrowedAt)}</td>
              <td>${fmtDate(b.dueAt)}</td>
              <td>${b.returnedAt ? fmtDate(b.returnedAt) : '—'}</td>
              <td>${badge}</td>
            </tr>`;
        })
        .join('');
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">' + esc(err.message) + '</td></tr>';
    }
  }

  // ---------- Fines ----------
  async function loadFines() {
    const tbody = $('sl-fines-tbody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Loading…</td></tr>';

    try {
      const json = await core.portalFetch('/api/student/borrows');
      const rows = (json && json.fines) || [];
      setText('sl-f-count', rows.length);

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No fines. 🎉</td></tr>';
        return;
      }

      tbody.innerHTML = rows
        .map((f) => `
          <tr>
            <td>${fmtMoney(f.amount)}</td>
            <td>${esc(f.reason || '—')}</td>
            <td>${f.isPaid
              ? '<span class="badge">Paid</span>'
              : '<span class="badge red">Unpaid</span>'}</td>
            <td>${fmtDate(f.createdAt)}</td>
          </tr>`)
        .join('');
    } catch (err) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty">' + esc(err.message) + '</td></tr>';
    }
  }

  // ---------- Wire up ----------
  function init() {
    initTabs();
    $('sl-cat-search')?.addEventListener('input', applyCatalogueFilters);
    $('sl-cat-category')?.addEventListener('change', applyCatalogueFilters);
    $('sl-cat-refresh')?.addEventListener('click', () => {
      loadCatalogue();
      refreshStats();
    });

    loadCatalogue();
    refreshStats();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
