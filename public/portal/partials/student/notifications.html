<!-- Portal → Student → Notifications -->
<section class="page-head">
  <div><h2>Notifications</h2></div>
  <div class="actions"><button class="btn btn-ghost btn-sm" id="stud-notif-read-all">Mark all read</button></div>
</section>

<div class="panel">
  <div class="panel-body">
    <div id="stud-notif-list" class="grid" style="gap:.5rem;">
      <div class="loading"><span class="spinner"></span> Loading…</div>
    </div>
  </div>
</div>

<script>
  (function () {
    const core = window.FPU_PORTAL;

    async function load() {
      const box = document.getElementById('stud-notif-list');
      box.innerHTML = '<div class="loading"><span class="spinner"></span> Loading…</div>';
      try {
        const res = await core.portalFetch('/api/portal/notifications');
        const rows = res.data || [];
        box.innerHTML = rows.length ? rows.map((n) => `
          <div class="session-item ${n.isRead ? '' : 'current'}">
            <div class="meta"><strong>${core.escapeHtml(n.title)}</strong>${core.escapeHtml(n.body || '')}</div>
            <div class="small muted">${core.timeAgo(n.createdAt)}</div>
          </div>
        `).join('') : '<p class="muted">No notifications.</p>';
      } catch (err) { box.innerHTML = `<div class="alert alert-danger">${core.escapeHtml(err.message)}</div>`; }
    }

    document.getElementById('stud-notif-read-all').addEventListener('click', async () => {
      try { await core.portalFetch('/api/portal/notifications/read-all', { method: 'POST' }); core.showToast('Marked read.', 'success'); load(); }
      catch (err) { core.showToast(err.message, 'error'); }
    });

    load();
  })();
</script>
