<!-- Portal → Student → Registration -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📝</div>
    <div>
      <h1>Course Registration</h1>
      <div class="sub">Register for courses this semester</div>
    </div>
  </div>
  <div class="meta">
    <strong id="sr-units">0 / 24</strong>
    <span>Units</span>
  </div>
</section>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Registered Courses</span><span class="value" id="sr-total">—</span></div><div class="ic">📚</div></div>
  <div class="stat blue"><div class="meta"><span class="label">Total Units</span><span class="value" id="sr-units-tile">—</span></div><div class="ic">🎯</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Approved</span><span class="value" id="sr-approved">—</span></div><div class="ic">✅</div></div>
  <div class="stat purple"><div class="meta"><span class="label">Pending Approval</span><span class="value" id="sr-pending">—</span></div><div class="ic">⏳</div></div>
</div>

<section class="panel">
  <div class="panel-head">
    <h3>My Registered Courses</h3>
    <span class="badge" id="sr-count">0</span>
  </div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr><th>Code</th><th>Title</th><th>Units</th><th>Semester</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="sr-tbody">
          <tr><td colspan="6" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<section class="panel">
  <div class="panel-head">
    <h3>Register a New Course</h3>
    <span class="badge" id="sr-avail-count">0</span>
  </div>
  <div class="panel-body">
    <div class="form-group">
      <label>Select a course to register</label>
      <select id="sr-available" style="max-width:600px;">
        <option value="">— Loading available courses…</option>
      </select>
    </div>
    <div class="quick-actions">
      <button class="btn btn-primary btn-sm" id="sr-register-btn">📝 Register Course</button>
    </div>
    <div id="sr-alert" style="margin-top:.75rem;"></div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  const MAX_UNITS = 24;
  let REGISTERED = [];
  let AVAILABLE = [];

  async function loadRegistered() {
    const tbody = $('sr-tbody');
    try {
      const res = await core.portalFetch('/api/student/registered-courses');
      const raw = res.data || res || [];
      REGISTERED = raw.map((r) => {
        const reg = r.registration || r;
        const crs = r.course || {};
        return {
          regId: reg.id,
          courseId: crs.id,
          code: crs.code || '—',
          title: crs.title || '',
          units: crs.unit || 0,
          semester: reg.semester || '—',
          status: (reg.status || 'pending').toLowerCase(),
        };
      });

      const units = REGISTERED.reduce((s, c) => s + c.units, 0);
      setText('sr-total', REGISTERED.length);
      setText('sr-units-tile', units);
      setText('sr-units', `${units} / ${MAX_UNITS}`);
      setText('sr-approved', REGISTERED.filter((c) => c.status === 'approved').length);
      setText('sr-pending', REGISTERED.filter((c) => c.status === 'pending').length);
      setText('sr-count', REGISTERED.length);

      if (tbody) {
        tbody.innerHTML = REGISTERED.length
          ? REGISTERED.map((c) => {
              const badge = c.status === 'approved' ? 'badge-active' : c.status === 'rejected' ? 'badge-inactive' : 'badge-warning';
              const dropBtn = c.status !== 'approved'
                ? `<button class="btn btn-outline btn-xs" data-drop="${c.regId}">Drop</button>`
                : '<span class="muted small">—</span>';
              return `
                <tr>
                  <td><strong>${esc(c.code)}</strong></td>
                  <td>${esc(c.title)}</td>
                  <td>${c.units}</td>
                  <td>${esc(c.semester)}</td>
                  <td><span class="badge-status ${badge}">${esc(c.status)}</span></td>
                  <td>${dropBtn}</td>
                </tr>`;
            }).join('')
          : '<tr><td colspan="6" class="empty">You haven\'t registered for any courses yet.</td></tr>';

        tbody.querySelectorAll('[data-drop]').forEach((btn) => {
          btn.addEventListener('click', () => dropCourse(btn.dataset.drop));
        });
      }
    } catch (err) {
      console.error('[registration] registered:', err);
      if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  async function loadAvailable() {
    const sel = $('sr-available');
    const countEl = $('sr-avail-count');
    if (!sel) return;

    try {
      const res = await core.portalFetch('/api/student/available-courses');
      const raw = res.data || res || [];
      AVAILABLE = raw.map((c) => ({
        id: c.id,
        code: c.code || '—',
        title: c.title || '',
        units: c.unit || 0,
        level: c.level,
      }));

      if (countEl) countEl.textContent = AVAILABLE.length;

      sel.innerHTML = AVAILABLE.length
        ? '<option value="">— Select a course —</option>' + AVAILABLE.map((c) =>
            `<option value="${c.id}">${esc(c.code)} — ${esc(c.title)} (${c.units} units)</option>`
          ).join('')
        : '<option value="">No available courses to register</option>';
    } catch (err) {
      console.warn('[registration] available:', err.message);
      if (countEl) countEl.textContent = '0';
      sel.innerHTML = '<option value="">Could not load courses</option>';
    }
  }

  async function registerCourse() {
    const courseId = $('sr-available')?.value;
    const alert = $('sr-alert');
    if (!courseId) {
      if (alert) { alert.textContent = '⚠ Please select a course'; alert.className = 'alert alert-warning'; }
      return;
    }

    const btn = $('sr-register-btn');
    btn.disabled = true; btn.textContent = 'Registering…';
    try {
      await core.portalFetch('/api/student/register-course', {
        method: 'POST',
        body: { courseId: Number(courseId) },
      });
      if (alert) { alert.textContent = '✅ Course registered successfully'; alert.className = 'alert alert-success'; }
      await loadRegistered();
      await loadAvailable();
    } catch (err) {
      if (alert) { alert.textContent = '❌ ' + err.message; alert.className = 'alert alert-error'; }
    } finally {
      btn.disabled = false; btn.textContent = '📝 Register Course';
    }
  }

  async function dropCourse(regId) {
    if (!confirm('Drop this course? This cannot be undone.')) return;
    try {
      await core.portalFetch('/api/student/unregister-course/' + regId, { method: 'POST' });
      core.showToast && core.showToast('Course dropped', 'success');
      await loadRegistered();
      await loadAvailable();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  }

  $('sr-register-btn')?.addEventListener('click', registerCourse);

  (async () => {
    await loadRegistered();
    await loadAvailable();
  })();
})();
</script>
