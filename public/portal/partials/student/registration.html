<!-- Portal → Student → Course Registration -->
<div style="padding:0;">

  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📝</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">Course Registration</div>
        <div style="font-size:.82rem;color:#d1fae5;">Register for courses this semester</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:1.3rem;font-weight:800;" id="hdr-units">0 / 24</div>
      <div style="font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a7f3d0;">Units</div>
    </div>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📚</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-registered">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Registered Courses</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🎯</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-units">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total Units</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">✅</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-approved">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Approved</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef9c3;color:#854d0e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">⏳</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-pending">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Pending Approval</div>
      </div>
    </div>
  </div>

  <!-- REGISTERED COURSES TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:1.5rem;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">My Registered Courses</div>
      <span class="badge" id="count-registered" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Code</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Units</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Semester</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Status</th>
            <th style="padding:.6rem .75rem;text-align:right;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Action</th>
          </tr>
        </thead>
        <tbody id="registered-tbody">
          <tr><td colspan="6" style="padding:2rem;text-align:center;color:#94a3b8;">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- REGISTER NEW COURSE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;font-weight:800;font-size:.9rem;color:#0f172a;">Register a New Course</div>
    <div style="padding:1rem;display:flex;gap:.75rem;align-items:flex-end;flex-wrap:wrap;">
      <div style="flex:1;min-width:240px;">
        <label style="display:block;font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Select a course to register</label>
        <select id="new-course" style="width:100%;padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="">Loading…</option>
        </select>
      </div>
      <div>
        <label style="display:block;font-size:.7rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-bottom:.3rem;">Semester</label>
        <select id="new-semester" style="padding:.55rem .75rem;font-size:.85rem;border:1px solid #d1d5db;border-radius:8px;background:#fff;">
          <option value="first">First</option>
          <option value="second">Second</option>
        </select>
      </div>
      <button id="btn-register" style="padding:.55rem 1rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">📝 Register Course</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_REGISTERED = [];
  let ALL_AVAILABLE = [];

  async function loadRegistered() {
    const tbody = $('registered-tbody');
    tbody.innerHTML = '<tr><td colspan="6" style="padding:2rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading…</td></tr>';

    try {
      const res = await core.portalFetch('/api/student/registered-courses');
      ALL_REGISTERED = res.data || [];

      const totalUnits = ALL_REGISTERED.reduce((sum, c) => sum + Number(c.unit || 0), 0);
      const approved = ALL_REGISTERED.filter(c => c.status === 'approved').length;
      const pending = ALL_REGISTERED.filter(c => c.status === 'pending').length;

      $('stat-registered').textContent = ALL_REGISTERED.length;
      $('stat-units').textContent = totalUnits;
      $('stat-approved').textContent = approved;
      $('stat-pending').textContent = pending;
      $('count-registered').textContent = ALL_REGISTERED.length;
      $('hdr-units').textContent = `${totalUnits} / 24`;

      if (!ALL_REGISTERED.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:2rem;text-align:center;color:#94a3b8;">You have not registered for any courses yet.</td></tr>';
        return;
      }

      tbody.innerHTML = ALL_REGISTERED.map(c => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;"><strong>${esc(c.courseCode)}</strong></td>
          <td style="padding:.65rem .75rem;">${esc(c.courseTitle)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${esc(c.unit)}</td>
          <td style="padding:.65rem .75rem;text-align:center;text-transform:capitalize;">${esc(c.semester)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">
            <span class="chip" style="background:${c.status === 'approved' ? '#d1fae5' : '#fef9c3'};color:${c.status === 'approved' ? '#065f46' : '#854d0e'};font-size:.7rem;padding:2px 6px;border-radius:4px;font-weight:700;text-transform:capitalize;">${esc(c.status)}</span>
          </td>
          <td style="padding:.65rem .75rem;text-align:right;">
            <button class="btn-drop" data-id="${c.id}" style="background:#fee2e2;color:#991b1b;padding:.3rem .6rem;border-radius:4px;border:none;cursor:pointer;font-size:.7rem;font-weight:700;">Drop</button>
          </td>
        </tr>
      `).join('');

      tbody.querySelectorAll('.btn-drop').forEach(btn => {
        btn.addEventListener('click', () => dropCourse(btn.dataset.id, btn.dataset.code));
      });

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  async function loadAvailable() {
    const sel = $('new-course');
    sel.innerHTML = '<option value="">Loading…</option>';

    try {
      const res = await core.portalFetch('/api/student/available-courses');
      ALL_AVAILABLE = res.data || [];

      if (!ALL_AVAILABLE.length) {
        sel.innerHTML = '<option value="">No courses available</option>';
        return;
      }

      sel.innerHTML = '<option value="">Select Course</option>' + ALL_AVAILABLE.map(c => 
        `<option value="${c.id}">${esc(c.code)} - ${esc(c.title)} (${c.unit} units)</option>`
      ).join('');
    } catch (err) {
      sel.innerHTML = '<option value="">Error loading courses</option>';
    }
  }

  async function registerCourse() {
    const courseId = $('new-course').value;
    const semester = $('new-semester').value;

    if (!courseId) return core.showToast && core.showToast('Please select a course.', 'warning');

    const btn = $('btn-register');
    btn.disabled = true;
    btn.textContent = 'Registering…';

    try {
      await core.portalFetch('/api/student/register-course', {
        method: 'POST',
        body: { courseId: Number(courseId), semester }
      });
      core.showToast && core.showToast('Course registered successfully!', 'success');
      loadRegistered();
      loadAvailable();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.textContent = '📝 Register Course';
    }
  }

  async function dropCourse(regId, code) {
    if (!confirm(`Drop course ${code || ''}? This cannot be undone.`)) return;
    try {
      await core.portalFetch(`/api/student/drop-course/${regId}`, { method: 'DELETE' });
      core.showToast && core.showToast('Course dropped.', 'success');
      loadRegistered();
      loadAvailable();
    } catch (err) {
      core.showToast && core.showToast(err.message, 'error');
    }
  }

  $('btn-register')?.addEventListener('click', registerCourse);

  loadRegistered();
  loadAvailable();
})();
</script>
