<!-- Portal → Student → Results -->
<section class="page-head">
  <div><h2>My Results</h2><p class="muted small">Published results only</p></div>
  <div class="actions">
    <button class="btn btn-outline btn-sm" onclick="window.__studResultsLoad()">Refresh</button>
  </div>
</section>

<div class="gpa-summary">
  <div class="item"><div class="label">CGPA</div><div class="value" id="res-cgpa">—</div></div>
  <div class="item"><div class="label">Total Units</div><div class="value" id="res-units">—</div></div>
  <div class="item"><div class="label">Classification</div><div class="value" style="font-size:1.1rem;" id="res-class">—</div></div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Result Sheet</h3></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="table-admin result-table">
        <thead><tr><th>Code</th><th>Title</th><th>Unit</th><th>Score</th><th>Grade</th><th>Points</th><th>Semester</th></tr></thead>
        <tbody id="res-tbody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  window.__studResultsLoad = async function () {
    const core = window.FPU_PORTAL;
    const tbody = document.getElementById('res-tbody');
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Loading…</td></tr>';
    try {
      const res = await core.portalFetch('/api/student/results');
      const rows = res.data || [];
      const sum = res.summary || {};
      document.getElementById('res-cgpa').textContent = Number(sum.cgpa || 0).toFixed(2);
      document.getElementById('res-units').textContent = sum.totalUnits || 0;
      document.getElementById('res-class').textContent = sum.classification || '—';
      tbody.innerHTML = rows.length ? rows.map((r) => `
        <tr>
          <td>${core.escapeHtml(r.course?.code || '')}</td>
          <td>${core.escapeHtml(r.course?.title || '')}</td>
          <td class="num">${r.course?.unit || 0}</td>
          <td class="num">${r.result.score}</td>
          <td><span class="grade ${core.escapeHtml(r.result.grade || '')}">${core.escapeHtml(r.result.grade || '')}</span></td>
          <td class="num">${r.result.points}</td>
          <td>${core.escapeHtml(r.result.semester)}</td>
        </tr>
      `).join('') : '<tr><td colspan="7" class="empty">No published results yet.</td></tr>';
    } catch (err) { tbody.innerHTML = `<tr><td colspan="7" class="empty">${core.escapeHtml(err.message)}</td></tr>`; }
  };
  window.__studResultsLoad();
</script>
