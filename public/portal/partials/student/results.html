<!-- Portal → Student → Results -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📊</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">My Results</div>
        <div style="font-size:.82rem;color:#d1fae5;">Academic results and GPA</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:1.3rem;font-weight:800;" id="hdr-cgpa">—</div>
      <div style="font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a7f3d0;">CGPA</div>
    </div>
  </div>

  <!-- FILTERS -->
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center;">
    <select id="filter-session" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;">
      <option value="">All Sessions</option>
    </select>
    <select id="filter-semester" style="padding:.5rem .75rem;font-size:.82rem;border:1px solid #d1d5db;border-radius:8px;">
      <option value="">All Semesters</option>
      <option value="first">First</option>
      <option value="second">Second</option>
    </select>
    <button id="btn-print" style="margin-left:auto;padding:.5rem .9rem;font-size:.82rem;font-weight:700;background:#fff;color:#065f46;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;">🖨 Print</button>
  </div>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📚</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-total">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total Courses</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📊</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-gpa">—</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Current GPA</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🎯</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-cgpa">—</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">CGPA</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#f3e8ff;color:#6b21a8;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🏆</div>
      <div>
        <div style="font-size:1.1rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-classification">—</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Classification</div>
      </div>
    </div>
  </div>

  <!-- RESULTS TABLE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:1.5rem;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">Results</div>
      <span class="badge" id="count-results" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Code</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Course Title</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Units</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Points</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Semester</th>
          </tr>
        </thead>
        <tbody id="results-tbody">
          <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading results…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- GRADE SCALE REFERENCE -->
  <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;font-weight:800;font-size:.9rem;color:#0f172a;">Grade Scale Reference</div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score Range</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade Point</th>
          </tr>
        </thead>
        <tbody>
          <tr><td style="padding:.5rem .75rem;">75 – 100</td><td style="padding:.5rem .75rem;text-align:center;font-weight:800;color:#065f46;">A</td><td style="padding:.5rem .75rem;text-align:center;">4.0</td></tr>
          <tr><td style="padding:.5rem .75rem;">65 – 74</td><td style="padding:.5rem .75rem;text-align:center;font-weight:800;color:#065f46;">B</td><td style="padding:.5rem .75rem;text-align:center;">3.0</td></tr>
          <tr><td style="padding:.5rem .75rem;">55 – 64</td><td style="padding:.5rem .75rem;text-align:center;font-weight:800;color:#92400e;">C</td><td style="padding:.5rem .75rem;text-align:center;">2.0</td></tr>
          <tr><td style="padding:.5rem .75rem;">45 – 54</td><td style="padding:.5rem .75rem;text-align:center;font-weight:800;color:#92400e;">D</td><td style="padding:.5rem .75rem;text-align:center;">1.0</td></tr>
          <tr><td style="padding:.5rem .75rem;">0 – 44</td><td style="padding:.5rem .75rem;text-align:center;font-weight:800;color:#991b1b;">F</td><td style="padding:.5rem .75rem;text-align:center;">0.0</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let ALL_RESULTS = [];
  let CGPA = '0.00';
  let CLASSIFICATION = '—';

  async function load() {
    const tbody = $('results-tbody');
    tbody.innerHTML = '<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading results…</td></tr>';

    try {
      const res = await core.portalFetch('/api/student/results');
      const d = res.data || {};
      ALL_RESULTS = d.results || [];
      CGPA = d.cgpa || '0.00';
      CLASSIFICATION = d.classification || '—';

      $('hdr-cgpa').textContent = CGPA;
      $('stat-gpa').textContent = d.currentGpa || CGPA;
      $('stat-cgpa').textContent = CGPA;
      $('stat-classification').textContent = CLASSIFICATION;
      $('stat-total').textContent = ALL_RESULTS.length;

      // Populate session filter
      const sessions = [...new Set(ALL_RESULTS.map(r => r.sessionName).filter(Boolean))];
      const sesSel = $('filter-session');
      sesSel.innerHTML = '<option value="">All Sessions</option>' + 
        sessions.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');

      render();

    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function render() {
    const tbody = $('results-tbody');
    const ses = $('filter-session').value;
    const sem = $('filter-semester').value;

    const filtered = ALL_RESULTS.filter(r => {
      if (ses && r.sessionName !== ses) return false;
      if (sem && String(r.semester).toLowerCase() !== sem) return false;
      return true;
    });

    $('count-results').textContent = filtered.length;

    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">No results match your filters.</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(r => `
      <tr style="border-bottom:1px solid #f1f5f9;">
        <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong></td>
        <td style="padding:.65rem .75rem;">${esc(r.courseTitle)}</td>
        <td style="padding:.65rem .75rem;text-align:center;">${esc(r.unit)}</td>
        <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
        <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
        <td style="padding:.65rem .75rem;text-align:center;">${esc(r.points)}</td>
        <td style="padding:.65rem .75rem;text-align:center;text-transform:capitalize;">${esc(r.semester)}</td>
      </tr>
    `).join('');
  }

  $('filter-session')?.addEventListener('change', render);
  $('filter-semester')?.addEventListener('change', render);
  $('btn-print')?.addEventListener('click', () => window.print());

  load();
})();
</script>
