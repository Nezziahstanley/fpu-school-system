<!-- Portal → Student → Security -->
<section class="page-head">
  <div><h2>My Security</h2><p class="muted small">Password and active sessions</p></div>
</section>

<div class="panel">
  <div class="panel-head"><h3>Change Password</h3></div>
  <div class="panel-body">
    <form id="stud-sec-pwd">
      <div class="form-grid">
        <div class="form-group"><label class="form-label">Current Password</label><input class="form-control" type="password" name="currentPassword" required /></div>
        <div class="form-group"><label class="form-label">New Password</label><input class="form-control" type="password" name="newPassword" required /></div>
      </div>
      <div class="form-actions"><button type="submit" class="btn btn-primary">Update</button></div>
    </form>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Active Sessions</h3></div>
  <div class="panel-body">
    <div id="stud-sec-sessions" class="grid" style="gap:.5rem;">
      <div class="loading"><span class="spinner"></span> Loading…</div>
    </div>
  </div>
</div>

<script>
  (async function () {
    const core = window.FPU_PORTAL;

    document.getElementById('stud-sec-pwd').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await core.portalFetch('/api/portal/change-password', { method: 'POST', body: Object.fromEntries(fd) });
        core.showToast('Password updated.', 'success');
        e.target.reset();
      } catch (err) { core.showToast(err.message, 'error'); }
    });

    try {
      const res = await core.portalFetch('/api/portal/security');
      const sessions = (res.sessions || []).concat(res.adminSessions || []);
      document.getElementById('stud-sec-sessions').innerHTML = sessions.length ? sessions.map((s) => `
        <div class="session-item">
          <div class="meta"><strong>${core.escapeHtml((s.userAgent || 'Unknown device').slice(0, 60))}</strong>${core.escapeHtml(s.ipAddress || '')}</div>
          <div class="small muted">${core.formatDateTime(s.createdAt)}</div>
        </div>
      `).join('') : '<p class="muted">No active sessions.</p>';
    } catch (err) { core.showToast(err.message, 'error'); }
  })();
</script>
