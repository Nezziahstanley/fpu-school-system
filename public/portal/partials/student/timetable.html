<!-- Portal → Student → Timetable -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📅</div>
    <div>
      <h1>My Timetable</h1>
      <div class="sub">Weekly class schedule grouped by semester</div>
    </div>
  </div>
</section>

<div class="filter-bar">
  <select id="stt-semester">
    <option value="">All Semesters</option>
    <option value="first">First Semester</option>
    <option value="second">Second Semester</option>
  </select>
  <select id="stt-day">
    <option value="">All Days</option>
    <option value="Monday">Monday</option>
    <option value="Tuesday">Tuesday</option>
    <option value="Wednesday">Wednesday</option>
    <option value="Thursday">Thursday</option>
    <option value="Friday">Friday</option>
  </select>
  <button class="btn btn-outline btn-sm" id="stt-refresh">Refresh</button>
  <button class="btn btn-outline btn-sm" id="stt-print">🖨 Print</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Slots</span><span class="value" id="stt-total">—</span></div><div class="ic">📅</div></div>
  <div class="stat blue"><div class="meta"><span class="label">First Semester</span><span class="value" id="stt-first">—</span></div><div class="ic">1️⃣</div></div>
  <div class="stat accent"><div class="meta"><span class="label">Second Semester</span><span class="value" id="stt-second">—</span></div><div class="ic">2️⃣</div></div>
  <div class="stat purple"><div class="meta"><span class="label">Courses</span><span class="value" id="stt-courses">—</span></div><div class="ic">📚</div></div>
</div>

<!-- Two panels: First + Second semester -->
<div id="stt-content"></div>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  let ALL = [];

  function unwrap(r) {
    const s = r.slot || r;
    const crs = r.course || {};
    let sem = String(s.semester || '').trim();
    if (/^1$|first/i.test(sem)) sem = 'first';
    else if (/^2$|second/i.test(sem)) sem = 'second';
    return {
      id: s.id,
      day: s.dayOfWeek || '—',
      startTime: s.startTime || '',
      endTime: s.endTime || '',
      courseCode: crs.code || '—',
      courseTitle: crs.title || '',
      venue: s.venue || '—',
      level: crs.level || '—',
      semester: sem,
    };
  }

  function getTime(t) {
    if (!t.startTime) return '—';
    return t.endTime ? `${t.startTime} – ${t.endTime}` : t.startTime;
  }

  function sortSlots(list) {
    const dayOrder = Object.fromEntries(DAYS.map((d, i) => [d, i]));
    return list.sort((a, b) => {
      const d = (dayOrder[a.day] ?? 99) - (dayOrder[b.day] ?? 99);
      return d || (a.startTime || '').localeCompare(b.startTime || '');
    });
  }

  function renderTable(slots, title, badge) {
    if (!slots.length) {
      return `
        <section class="panel">
          <div class="panel-head"><h3>${esc(title)}</h3><span class="badge">0</span></div>
          <div class="panel-body"><p class="muted" style="text-align:center;padding:1.5rem;">No classes scheduled for this semester.</p></div>
        </section>`;
    }

    const rows = sortSlots(slots).map((t) => {
      const lvl = String(t.level).toUpperCase();
      const chipClass = 'chip-' + lvl.toLowerCase();
      return `
        <tr>
          <td><strong>${esc(t.day)}</strong></td>
          <td>${esc(getTime(t))}</td>
          <td><strong>${esc(t.courseCode)}</strong>${t.courseTitle ? `<div class="muted small">${esc(t.courseTitle)}</div>` : ''}</td>
          <td>${esc(t.venue)}</td>
          <td><span class="chip ${chipClass}">${esc(lvl)}</span></td>
        </tr>`;
    }).join('');

    return `
      <section class="panel">
        <div class="panel-head">
          <h3>${esc(title)}</h3>
          <span class="badge" style="background:${badge};">${slots.length}</span>
        </div>
        <div class="panel-body flush">
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr><th>Day</th><th>Time</th><th>Course</th><th>Venue</th><th>Level</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </section>`;
  }

  function render() {
    const semFilter = $('stt-semester')?.value || '';
    const dayFilter = $('stt-day')?.value || '';

    let filtered = ALL.slice();
    if (semFilter) filtered = filtered.filter((t) => t.semester === semFilter);
    if (dayFilter) filtered = filtered.filter((t) => t.day === dayFilter);

    const first = filtered.filter((t) => t.semester === 'first');
    const second = filtered.filter((t) => t.semester === 'second');
    const other = filtered.filter((t) => t.semester !== 'first' && t.semester !== 'second');

    const content = $('stt-content');
    if (!content) return;

    let html = '';
    if (first.length || !semFilter) html += renderTable(first, '📘 First Semester', '#065f46');
    if (second.length || !semFilter) html += renderTable(second, '📗 Second Semester', '#f59e0b');
    if (other.length) html += renderTable(other, '📅 Other Slots', '#64748b');

    content.innerHTML = html || '<p class="muted" style="text-align:center;padding:2rem;">No classes found.</p>';

    // Stats
    setText('stt-total', ALL.length);
    setText('stt-first', ALL.filter((t) => t.semester === 'first').length);
    setText('stt-second', ALL.filter((t) => t.semester === 'second').length);
    setText('stt-courses', new Set(ALL.map((t) => t.courseCode).filter((c) => c && c !== '—')).size);
  }

  async function load() {
    const content = $('stt-content');
    if (content) content.innerHTML = '<div class="loading" style="text-align:center;padding:2rem;"><span class="spinner"></span> Loading…</div>';
    try {
      const res = await core.portalFetch('/api/student/timetable');
      const raw = res.data || res || [];
      ALL = raw.map(unwrap);
      console.log('[student-timetable] Loaded', ALL.length, 'slots');
      render();
    } catch (err) {
      console.warn('[student-timetable]', err.message);
      ALL = [];
      render();
    }
  }

  $('stt-semester')?.addEventListener('change', render);
  $('stt-day')?.addEventListener('change', render);
  $('stt-refresh')?.addEventListener('click', load);
  $('stt-print')?.addEventListener('click', () => window.print());

  load();
})();
</script>
