<!-- Portal → Student → Transcript -->
<div style="padding:0;">

  <!-- HEADER BANNER -->
  <div style="background:linear-gradient(135deg, #065f46 0%, #059669 100%);border-radius:14px;padding:1.25rem 1.5rem;color:#fff;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:.75rem;">
      <div style="width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📜</div>
      <div>
        <div style="font-size:1.2rem;font-weight:800;">My Transcript</div>
        <div style="font-size:.82rem;color:#d1fae5;">Academic record</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:1.3rem;font-weight:800;" id="hdr-cgpa">—</div>
      <div style="font-size:.65rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#a7f3d0;">CGPA</div>
    </div>
  </div>

  <button id="tr-print" style="margin-bottom:1rem;padding:.65rem 1rem;font-size:.82rem;font-weight:700;background:#065f46;color:#fff;border:none;border-radius:8px;cursor:pointer;">🖨 Print Official Transcript</button><section id="tr-print-heading" style="display:none;text-align:center;margin-bottom:1rem;color:#0f172a;"><h1 style="margin:0;font-size:20px;">FEDERAL POLYTECHNIC, UGEP</h1><p style="font-size:11px;margin:.25rem 0">OFFICIAL ACADEMIC TRANSCRIPT</p><div id="tr-student-meta" style="text-align:left;font-size:11px;line-height:1.8;margin-top:12px"></div></section>

  <!-- STAT TILES -->
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;">
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#d1fae5;color:#065f46;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📚</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-courses">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total Courses</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;color:#1e40af;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🎯</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-units">0</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Total Units</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;color:#92400e;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📊</div>
      <div>
        <div style="font-size:1.35rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-cgpa">0.00</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">CGPA</div>
      </div>
    </div>
    <div style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:1rem;display:flex;align-items:center;gap:.75rem;">
      <div style="width:40px;height:40px;border-radius:10px;background:#f3e8ff;color:#6b21a8;display:flex;align-items:center;justify-content:center;font-size:1.2rem;">🏆</div>
      <div>
        <div style="font-size:1.05rem;font-weight:800;color:#0f172a;line-height:1;" id="stat-classification">—</div>
        <div style="font-size:.65rem;font-weight:700;color:#64748b;text-transform:uppercase;margin-top:.15rem;">Classification</div>
      </div>
    </div>
  </div>

  <!-- TRANSCRIPT TABLE -->
  <div id="tr-transcript-sheet" style="background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;">
    <div style="padding:.85rem 1rem;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-weight:800;font-size:.9rem;color:#0f172a;">Results by Course</div>
      <span class="badge" id="count-results" style="background:#065f46;color:#fff;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:800;">0</span>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:.82rem;">
        <thead>
          <tr style="background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Code</th>
            <th style="padding:.6rem .75rem;text-align:left;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Title</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Units</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Score</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Grade</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Points</th>
            <th style="padding:.6rem .75rem;text-align:center;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#64748b;">Semester / Session</th>
          </tr>
        </thead>
        <tbody id="tr-tbody">
          <tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<div id="student-transcript-print" class="tr-printable" aria-hidden="true"></div>

<style>
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid #e2e8f0; border-top-color: #065f46;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tr-printable { display:none; position:relative; padding:2rem; color:#0f172a; font-family:'Inter',system-ui,sans-serif; }
  .tr-printable .tr-watermark { display:none; }
  .tr-printable .tr-content { position:relative; z-index:1; }
  .tr-letterhead { text-align:center; padding-bottom:1rem; margin-bottom:1.25rem; border-bottom:2px solid #065f46; }
  .tr-letterhead img { height:60px; margin-bottom:.5rem; }
  .tr-letterhead h1 { font-size:1.2rem; margin:0; color:#065f46; letter-spacing:.5px; text-transform:uppercase; }
  .tr-letterhead p { margin:.25rem 0 0; font-size:.78rem; color:#64748b; }
  .tr-title { text-align:center; font-size:1rem; font-weight:800; letter-spacing:2px; text-transform:uppercase; text-decoration:underline; margin:1rem 0; color:#0f172a; }
  .tr-info-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.75rem; margin-bottom:1.25rem; font-size:.82rem; }
  .tr-info-grid > div > span { display:block; font-weight:700; text-transform:uppercase; font-size:.65rem; color:#64748b; letter-spacing:.05em; margin-bottom:.2rem; }
  .tr-info-grid > div > strong { font-weight:700; font-size:.85rem; color:#0f172a; }
  .tr-results-table { width:100%; border-collapse:collapse; font-size:.82rem; margin-bottom:1rem; }
  .tr-results-table th { background:#f0fdf4; padding:.55rem .75rem; border-bottom:2px solid #065f46; text-align:left; text-transform:uppercase; font-size:.65rem; letter-spacing:.05em; color:#065f46; font-weight:800; }
  .tr-results-table td { padding:.55rem .75rem; border-bottom:1px solid #e5e7eb; }
  .tr-results-table td.center { text-align:center; }
  .tr-summary { display:flex; justify-content:flex-end; gap:2rem; margin-top:1rem; padding-top:1rem; border-top:2px solid #065f46; font-size:.85rem; }
  .tr-summary .tr-cgpa-big { font-size:1.5rem; font-weight:800; color:#065f46; }
  .tr-footer { margin-top:1.5rem; padding-top:1rem; border-top:1px solid #e5e7eb; font-size:.72rem; text-align:center; color:#94a3b8; }
  .tr-signature { margin-top:2rem; display:flex; justify-content:space-between; font-size:.78rem; }
  .tr-signature .tr-sign-block { border-top:1px solid #0f172a; padding-top:.35rem; min-width:160px; text-align:center; }
  @page { size:A4 portrait; margin:14mm; }
  @media print {
    body * { visibility:hidden !important; }
    #student-transcript-print, #student-transcript-print * { visibility:visible !important; }
    #student-transcript-print { display:block !important; position:absolute !important; inset:0 auto auto 0 !important; width:100% !important; padding:0 !important; font-family:'Times New Roman',serif !important; }
    #student-transcript-print .tr-watermark { display:block; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-20deg); width:380px; height:380px; opacity:.08; z-index:0; pointer-events:none; }
    .tr-letterhead { border-bottom:3px double #065f46; }
    .tr-letterhead h1 { font-size:22px; } .tr-letterhead p { font-size:12px; }
    .tr-title { font-size:16px; letter-spacing:3px; }
    .tr-info-grid { gap:12px; margin-bottom:20px; }
    .tr-info-grid > div > span { font-size:9px; } .tr-info-grid > div > strong { font-size:13px; }
    .tr-results-table { font-size:11px; }
    .tr-results-table th { border:1px solid #000; padding:8px; background:#f0fdf4 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .tr-results-table td { border:1px solid #333; padding:6px 8px; }
    .tr-summary { font-size:12px; } .tr-summary .tr-cgpa-big { font-size:22px; }
    .tr-signature { font-size:11px; } .tr-signature .tr-sign-block { border-top:1px solid #000; }
    .tr-footer { border-top:1px solid #999; color:#666; font-size:10px; }
  }
</style>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  let LAST_TRANSCRIPT = null;

  async function load() {
    const tbody = $('tr-tbody');
    tbody.innerHTML = '<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;"><span class="spinner"></span> Loading…</td></tr>';

    try {
      const res = await core.portalFetch('/api/student/transcript');
      const d = res.data || {};
      LAST_TRANSCRIPT = d;
      const rows = d.results || [];

      // Update tiles
      const cgpaNumber = Number(d.cgpa);
      const cgpaText = Number.isFinite(cgpaNumber) ? cgpaNumber.toFixed(2) : '0.00';
      $('hdr-cgpa').textContent = cgpaText;
      $('stat-courses').textContent = rows.length;
      $('stat-units').textContent = d.totalUnits || 0;
      $('stat-cgpa').textContent = cgpaText;
      const student = d.student || {};
      $('tr-student-meta').innerHTML = '<strong>Student:</strong> '+esc([student.firstName,student.lastName].filter(Boolean).join(' '))+' &nbsp; <strong>Matric No:</strong> '+esc(student.matricNumber||'—')+'<br><strong>Department:</strong> '+esc(student.departmentName||'—')+' &nbsp; <strong>Programme:</strong> '+esc(student.programmeName||'—')+' &nbsp; <strong>Level:</strong> '+esc(student.level||'—')+'<br><strong>CGPA:</strong> '+esc(cgpaText)+' &nbsp; <strong>Classification:</strong> '+esc(d.classification||'—');
      $('stat-classification').textContent = d.classification || '—';
      $('count-results').textContent = rows.length;

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" style="padding:3rem;text-align:center;color:#94a3b8;">No transcript records yet.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(r => `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong></td>
          <td style="padding:.65rem .75rem;">${esc(r.courseTitle)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${esc(r.unit)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
          <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
          <td style="padding:.65rem .75rem;text-align:center;">${esc(r.points)}</td>
          <td style="padding:.65rem .75rem;text-align:center;text-transform:capitalize;">${esc(r.semester)} · ${esc(r.sessionName||'—')}</td>
        </tr>
      `).join('');

    } catch (err) {
      console.error('[student/transcript] Error:', err);
      tbody.innerHTML = `<tr><td colspan="7" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  function printTranscript() {
    if (!LAST_TRANSCRIPT) return;
    const d = LAST_TRANSCRIPT, s = d.student || {}, rows = d.results || [];
    const cgpa = Number.isFinite(Number(d.cgpa)) ? Number(d.cgpa).toFixed(2) : '0.00';
    const resultRows = rows.length ? rows.map(r => `
      <tr><td style="font-weight:700;">${esc(r.courseCode || '—')}</td><td>${esc(r.courseTitle || '—')}</td>
      <td class="center">${esc(r.unit ?? '0')}</td><td class="center">${esc(r.score ?? '—')}</td>
      <td class="center" style="font-weight:800;color:#065f46;">${esc(r.grade || '—')}</td>
      <td class="center">${esc(r.points ?? '—')}</td></tr>`).join('') :
      '<tr><td colspan="6" style="text-align:center;padding:2rem;">No published results found.</td></tr>';
    const issued = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    const printNode = $('student-transcript-print');
    printNode.innerHTML = `
      <img src="/images/logo.png" class="tr-watermark" alt="">
      <div class="tr-content">
        <div class="tr-letterhead"><img src="/images/logo.png" alt="FPU Logo"><h1>Federal Polytechnic Ugep</h1><p>P.M.B. 1038, Ugep, Cross River State, Nigeria</p></div>
        <div class="tr-title">Official Transcript</div>
        <div class="tr-info-grid">
          <div><span>Matric No.</span><strong>${esc(s.matricNumber || '—')}</strong></div>
          <div><span>Student Name</span><strong>${esc([s.firstName,s.middleName,s.lastName].filter(Boolean).join(' ') || '—')}</strong></div>
          <div><span>Level</span><strong>${esc(s.level || '—')}</strong></div>
          <div><span>Department</span><strong>${esc(s.departmentName || '—')}</strong></div>
          <div><span>Programme</span><strong>${esc(s.programmeName || '—')}</strong></div>
          <div><span>Date Issued</span><strong>${issued}</strong></div>
        </div>
        <table class="tr-results-table"><thead><tr><th style="width:10%">Code</th><th style="width:50%">Course Title</th><th style="width:8%;text-align:center">Units</th><th style="width:10%;text-align:center">Score</th><th style="width:10%;text-align:center">Grade</th><th style="width:12%;text-align:center">Points</th></tr></thead><tbody>${resultRows}</tbody></table>
        <div class="tr-summary"><div><div style="font-size:.65rem;font-weight:700;text-transform:uppercase;color:#64748b">Total Units</div><div style="font-size:1.1rem;font-weight:800">${esc(d.totalUnits || 0)}</div></div>
        <div style="text-align:right"><div style="font-size:.65rem;font-weight:700;text-transform:uppercase;color:#64748b">Cumulative GPA</div><div class="tr-cgpa-big">${cgpa}</div><div style="font-size:.78rem;font-weight:600">${esc(d.classification || '—')}</div></div></div>
        <div class="tr-signature"><div>Date: ${issued}</div><div class="tr-sign-block"><strong>REGISTRAR</strong><div style="font-size:.7rem;color:#64748b">Signature / Stamp</div></div></div>
        <div class="tr-footer">This is a computer-generated transcript and is valid without a physical signature.</div>
      </div>`;
    window.print();
  }
  $('tr-print')?.addEventListener('click', printTranscript);
  load();
})();
</script>
