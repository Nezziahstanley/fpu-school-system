<!-- Portal → Student → Transcript -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📄</div>
    <div>
      <h1>My Transcript</h1>
      <div class="sub" id="st-matric">Academic record</div>
    </div>
  </div>
  <div class="meta">
    <strong id="st-cgpa-badge">—</strong>
    <span>CGPA</span>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-primary btn-sm" id="st-print">🖨 Print Transcript</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Courses</span><span class="value" id="st-total">—</span></div><div class="ic">📚</div></div>
  <div class="stat blue"><div class="meta"><span class="label">Total Units</span><span class="value" id="st-units">—</span></div><div class="ic">🎯</div></div>
  <div class="stat accent"><div class="meta"><span class="label">CGPA</span><span class="value" id="st-cgpa">—</span></div><div class="ic">📊</div></div>
  <div class="stat purple"><div class="meta"><span class="label">Classification</span><span class="value" id="st-class">—</span></div><div class="ic">🏆</div></div>
</div>

<section class="panel">
  <div class="panel-head"><h3>Results by Course</h3><span class="badge" id="st-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Code</th><th>Title</th><th>Units</th><th>Score</th><th>Grade</th><th>Points</th><th>Session</th></tr></thead>
        <tbody id="st-tbody">
          <tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);

  async function load() {
    const tbody = $('tr-tbody');
    try {
      const res = await core.portalFetch('/api/student/transcript');
      const d = res.data || {};
      const s = d.student || {};
      const rows = d.results || [];

      // Header
      $('tr-st-name').textContent = `${s.firstName || ''} ${s.lastName || ''}`.trim() || '—';
      $('tr-st-matric').textContent = s.matricNumber || '—';
      $('tr-st-programme').textContent = s.programmeName || '—';
      $('tr-st-level').textContent = `Level ${s.level || '—'}`;

      // Stats
      $('tr-cgpa').textContent = d.cgpa || '0.00';
      $('tr-units').textContent = d.totalUnits || 0;
      $('tr-classification').textContent = d.classification || '—';
      
      // Header CGPA
      $('hdr-cgpa').textContent = d.cgpa || '0.00';

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="padding:3rem;text-align:center;color:#94a3b8;">No published results found.</td></tr>';
        return;
      }

      let lastSession = '';
      let lastSemester = '';

      tbody.innerHTML = rows.map(r => {
        const session = r.sessionName || '—';
        const sem = (r.semester || '—').toString().replace(/^\w/, c => c.toUpperCase());
        const showSession = session !== lastSession;
        const showSem = showSession || sem !== lastSemester;
        lastSession = session;
        lastSemester = sem;

        return `
          ${showSession ? `<tr><td colspan="8" style="padding:.5rem .75rem;background:#f1f5f9;font-weight:800;font-size:.72rem;color:#475569;text-transform:uppercase;">📅 ${esc(session)}</td></tr>` : ''}
          ${showSem ? `<tr><td colspan="8" style="padding:.35rem .75rem;background:#f8fafc;font-weight:700;font-size:.7rem;color:#64748b;font-style:italic;">${esc(sem)} Semester</td></tr>` : ''}
          <tr style="border-bottom:1px solid #f1f5f9;">
            <td style="padding:.65rem .75rem;color:#475569;font-size:.75rem;">${esc(session)}</td>
            <td style="padding:.65rem .75rem;text-align:center;text-transform:capitalize;font-size:.75rem;">${esc(sem)}</td>
            <td style="padding:.65rem .75rem;"><strong>${esc(r.courseCode)}</strong></td>
            <td style="padding:.65rem .75rem;">${esc(r.courseTitle)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">${esc(r.unit)}</td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:700;">${esc(r.score)}</td>
            <td style="padding:.65rem .75rem;text-align:center;font-weight:800;color:#065f46;">${esc(r.grade)}</td>
            <td style="padding:.65rem .75rem;text-align:center;">${esc(r.points)}</td>
          </tr>
        `;
      }).join('');

    } catch (err) {
      console.error('[student/transcript] Error:', err);
      tbody.innerHTML = `<tr><td colspan="8" style="padding:2rem;text-align:center;color:#991b1b;">⚠️ ${esc(err.message)}</td></tr>`;
    }
  }

  $('tr-print')?.addEventListener('click', () => window.print());
  load();
})();
</script>
