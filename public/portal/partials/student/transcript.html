<!-- Portal → Student → Transcript -->
<section class="greeting">
  <div class="who">
    <div class="avatar">📄</div>
    <div>
      <h1>My Transcript</h1>
      <div class="sub" id="st-matric">Academic record</div>
    </div>
  </div>
  <div class="meta">
    <strong id="st-cgpa-badge">—</strong>
    <span>CGPA</span>
  </div>
</section>

<div class="filter-bar">
  <button class="btn btn-primary btn-sm" id="st-print">🖨 Print Transcript</button>
</div>

<div class="stat-grid">
  <div class="stat"><div class="meta"><span class="label">Total Courses</span><span class="value" id="st-total">—</span></div><div class="ic">📚</div></div>
  <div class="stat blue"><div class="meta"><span class="label">Total Units</span><span class="value" id="st-units">—</span></div><div class="ic">🎯</div></div>
  <div class="stat accent"><div class="meta"><span class="label">CGPA</span><span class="value" id="st-cgpa">—</span></div><div class="ic">📊</div></div>
  <div class="stat purple"><div class="meta"><span class="label">Classification</span><span class="value" id="st-class">—</span></div><div class="ic">🏆</div></div>
</div>

<section class="panel">
  <div class="panel-head"><h3>Results by Course</h3><span class="badge" id="st-count">0</span></div>
  <div class="panel-body flush">
    <div class="table-wrap">
      <table class="data-table">
        <thead><tr><th>Code</th><th>Title</th><th>Units</th><th>Score</th><th>Grade</th><th>Points</th><th>Session</th></tr></thead>
        <tbody id="st-tbody">
          <tr><td colspan="7" class="empty"><span class="spinner"></span> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
(function () {
  'use strict';
  const core = window.FPU_PORTAL || {};
  const user = core.getPortalUser ? core.getPortalUser() : {};
  const $ = (id) => document.getElementById(id);
  const esc = (s) => core.escapeHtml ? core.escapeHtml(s) : String(s == null ? '' : s);
  const setText = (id, v) => { const el = $(id); if (el) el.textContent = v; };

  let ALL = [];

  function classify(cgpa) {
    if (cgpa == null) return '—';
    const g = Number(cgpa);
    if (g >= 3.50) return 'Distinction';
    if (g >= 3.00) return 'Upper Credit';
    if (g >= 2.50) return 'Lower Credit';
    if (g >= 2.00) return 'Pass';
    return 'Fail';
  }

  setText('st-matric', user.matricNumber || 'Academic record');

  async function load() {
    const tbody = $('st-tbody');
    try {
      const res = await core.portalFetch('/api/student/transcript');
      const payload = res.data || res || {};
      const raw = payload.rows || payload.data || (Array.isArray(payload) ? payload : []);

      ALL = raw.map((r) => {
        const rec = r.result || r;
        const crs = r.course || {};
        return {
          courseCode: crs.code || '—',
          courseTitle: crs.title || '',
          units: crs.unit || 0,
          score: rec.score != null ? Number(rec.score) : null,
          grade: rec.grade || '—',
          points: rec.points != null ? Number(rec.points) : 0,
          sessionId: rec.sessionId,
          semester: rec.semester || '—',
        };
      });

      // Compute totals
      const totalUnits = ALL.reduce((s, r) => s + r.units, 0);
      const totalPoints = ALL.reduce((s, r) => s + r.units * r.points, 0);
      const cgpa = totalUnits ? (totalPoints / totalUnits).toFixed(2) : '—';

      setText('st-total', ALL.length);
      setText('st-units', totalUnits);
      setText('st-cgpa', cgpa);
      setText('st-cgpa-badge', cgpa);
      setText('st-class', classify(cgpa));
      setText('st-count', ALL.length);

      if (tbody) {
        tbody.innerHTML = ALL.length
          ? ALL.map((r) => `
              <tr>
                <td><strong>${esc(r.courseCode)}</strong></td>
                <td>${esc(r.courseTitle)}</td>
                <td>${r.units}</td>
                <td>${r.score != null ? r.score.toFixed(0) : '—'}</td>
                <td><span class="chip">${esc(r.grade)}</span></td>
                <td>${r.points.toFixed(1)}</td>
                <td>${esc(r.semester)}</td>
              </tr>`).join('')
          : '<tr><td colspan="7" class="empty">No transcript records yet.</td></tr>';
      }
    } catch (err) {
      console.error('[student-transcript]', err);
      if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="empty">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  $('st-print')?.addEventListener('click', () => window.print());
  load();
})();
</script>
