<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirming Payment — Federal Polytechnic Ugep</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#f1f5f9;font-family:Arial,sans-serif;color:#0f172a}
    main{width:min(100%,480px);background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:2rem;text-align:center;box-shadow:0 16px 48px rgba(15,23,42,.08)}
    .mark{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#166534;font-size:1.8rem;margin:0 auto 1rem}
    h1{font-size:1.35rem;margin:.2rem 0 .6rem}p{color:#64748b;line-height:1.6;font-size:.92rem}
    a{display:inline-block;margin-top:1rem;padding:.7rem 1.1rem;border-radius:9px;background:#065f46;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="mark" id="mark">…</div>
    <h1 id="heading">Confirming your payment</h1>
    <p id="message">Please wait while we verify the transaction with Paystack. Do not close this page.</p>
    <a href="/portal/app.html" id="continue" style="display:none">Return to Student Portal</a>
  </main>
  <script src="/js/portal-core.js"></script>
  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const reference = params.get('reference') || params.get('trxref');
      const heading = document.getElementById('heading');
      const message = document.getElementById('message');
      const mark = document.getElementById('mark');
      const link = document.getElementById('continue');
      try {
        if (!reference) throw new Error('No payment reference was returned by the payment provider.');
        const core = window.FPU_PORTAL || {};
        if (typeof core.portalFetch !== 'function') throw new Error('Please sign in to the Student Portal, then check your payment history.');
        await core.portalFetch('/api/student/payments/paystack/verify', { method: 'POST', body: { reference } });
        mark.textContent = '✓';
        heading.textContent = 'Payment confirmed';
        message.textContent = 'Paystack has verified your payment. Your student fee balance has been updated.';
        setTimeout(function () { window.location.replace('/portal/app.html'); }, 2200);
      } catch (error) {
        mark.textContent = '!';
        heading.textContent = 'Payment not confirmed yet';
        message.textContent = error.message || 'We could not verify this transaction. Your account has not been credited. Sign in and check Fees & Payments again.';
        link.style.display = 'inline-block';
      }
    })();
  </script>
</body>
</html>
