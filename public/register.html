<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register — Federal Polytechnic Ugep</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="text-center mb-3"><img src="/images/logo.png" alt="FPU" style="height:60px;margin:0 auto .5rem;" /></div>
      <h1>Get Started</h1>
      <p class="subtitle">Request a verification token</p>

      <p class="muted" style="font-size:.9rem;">If you have been admitted and received your matric number, you will receive a registration email with a link to set your password. If you did not, use the form below to request a token.</p>

      <form id="register-token-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input class="form-control" type="email" name="email" required />
        </div>
        <div class="form-group">
          <label class="form-label">Purpose</label>
          <select class="form-select" name="purpose">
            <option value="verify">Verify my email</option>
            <option value="reset">Reset my password</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Send Token</button>
      </form>

      <div id="register-token-result" class="mt-3"></div>

      <div class="links mt-3"><a href="/login.html">← Back to sign in</a></div>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
