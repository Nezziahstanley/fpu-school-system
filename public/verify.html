<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Verification - FPU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #065f46;
      --primary-light: #059669;
      --accent: #fbbf24;
      --bg: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      /* Subtle background pattern */
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .verify-container {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
      overflow: hidden;
      position: relative;
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      padding: 32px 20px 40px;
      text-align: center;
      color: #fff;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 24px;
      background: #fff;
      border-radius: 24px 24px 0 0;
    }

    .logo-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 14px;
      background: #fff;
      border-radius: 50%;
      padding: 4px;
      border: 3px solid var(--accent);
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 0.8rem;
      color: #d1fae5;
      font-weight: 500;
    }

    /* BODY */
    .body {
      padding: 0 24px 24px;
      position: relative;
      z-index: 2;
    }

    .photo-container {
      text-align: center;
      margin-top: -55px;
      margin-bottom: 20px;
    }

    .student-photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 5px solid #fff;
      object-fit: cover;
      background: var(--bg);
      box-shadow: 0 8px 16px rgba(15, 23, 42, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--text-muted);
    }

    .student-name {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .matric-pill-wrap {
      text-align: center;
      margin-bottom: 24px;
    }

    .matric-pill {
      display: inline-block;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      background: #ecfdf5;
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid #a7f3d0;
      letter-spacing: 0.5px;
    }

    /* DETAILS LIST */
    .details-list {
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 4px 16px;
      margin-bottom: 24px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px dashed var(--border);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: right;
    }

    /* STATUS BADGE */
    .status-wrap {
      text-align: center;
      margin-bottom: 28px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #dcfce7;
      color: #15803d;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 800;
      border: 1px solid #bbf7d0;
      box-shadow: 0 4px 10px rgba(21, 128, 61, 0.1);
    }

    .status-badge svg {
      width: 18px;
      height: 18px;
    }

    /* INSTITUTION DETAILS */
    .institution-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .institution-card h3 {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .institution-card p {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 4px;
    }

    .institution-card strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* ACTIONS */
    .actions-wrap {
      text-align: center;
    }

    .scan-again-btn {
      display: inline-block;
      background: var(--primary);
      color: #fff;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .scan-again-btn:hover {
      background: var(--primary-light);
    }

    /* FOOTER */
    .footer {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
      padding: 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      line-height: 1.5;
    }

    /* LOADING / ERROR STATES */
    .loading-state, .error-state {
      padding: 60px 20px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state h2 {
      color: #b91c1c;
      font-size: 1.2rem;
      margin-bottom: 8px;
    }

    .error-state p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="verify-container" id="app">
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="color: var(--text-muted); font-weight: 600;">Verifying student details...</p>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const matricId = urlParams.get('id');
    const appContainer = document.getElementById('app');

    if (!matricId) {
      appContainer.innerHTML = `
        <div class="error-state">
          <h2>Invalid QR Code</h2>
          <p>No student ID was provided in the link.</p>
        </div>
      `;
    } else {
      fetch(`/api/public/verify?id=${encodeURIComponent(matricId)}`)
        .then(res => res.json().then(data => ({ status: res.status, data })))
        .then(({ status, data }) => {
          if (status !== 200 || !data.success) {
            throw new Error(data.error || 'Student not found');
          }

          const student = data.data;
          const fullName = `${student.firstName} ${student.lastName}`;
          
          const photoHtml = student.photoUrl 
            ? `<img src="${student.photoUrl}" class="student-photo" alt="Student Photo" onerror="this.outerHTML='<div class=\\'student-photo\\'>👤</div>'">` 
            : `<div class="student-photo">👤</div>`;

          appContainer.innerHTML = `
            <div class="header">
              <div class="logo-wrap">
                <img src="/images/logo.png" alt="FPU Logo" onerror="this.style.display='none'">
              </div>
              <h1>FEDERAL POLYTECHNIC UGEP</h1>
              <p>Official Student Verification</p>
            </div>
            
            <div class="body">
              <div class="photo-container">
                ${photoHtml}
              </div>
              
              <h2 class="student-name">${fullName}</h2>
              
              <div class="matric-pill-wrap">
                <span class="matric-pill">${student.matricNumber || 'N/A'}</span>
              </div>

              <div class="details-list">
                <div class="detail-row">
                  <span class="detail-label">Level</span>
                  <span class="detail-value">${student.level || 'N/A'}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Programme</span>
                  <span class="detail-value">${student.programmeName || 'N/A'}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Department</span>
                  <span class="detail-value">${student.departmentName || 'N/A'}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Session</span>
                  <span class="detail-value">${student.sessionName || '2025/2026'}</span>
                </div>
              </div>

              <div class="status-wrap">
                <div class="status-badge">
                  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                  </svg>
                  Verified Active Student
                </div>
              </div>

              <!-- Institution Details -->
              <div class="institution-card">
                <h3>
                  <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  Institution Details
                </h3>
                <p><strong>Address:</strong><br>P.M.B. 1038, Ugep, Cross River State, Nigeria</p>
                <p><strong>Phone:</strong> 07069096879</p>
                <p><strong>Email:</strong> contact@fedpolyugep.edu.ng</p>
              </div>

              <div class="actions-wrap">
                <a href="/verify.html" class="scan-again-btn">Scan Another ID</a>
              </div>
            </div>

            <div class="footer">
              This is a computer-generated verification page.<br>
              Valid without signature.
            </div>
          `;
        })
        .catch(err => {
          appContainer.innerHTML = `
            <div class="header">
              <div class="logo-wrap">
                <img src="/images/logo.png" alt="FPU Logo" onerror="this.style.display='none'">
              </div>
              <h1>Verification Failed</h1>
            </div>
            <div class="error-state">
              <h2>Record Not Found</h2>
              <p>${err.message}</p>
              <p style="margin-top: 12px; font-size: 0.8rem; color: #94a3b8;">The student record may have been deleted or the ID is incorrect.</p>
            </div>
            <div class="footer">
              <a href="/verify.html" style="color: var(--primary); font-weight: 700;">Try again</a>
            </div>
          `;
        });
    }
  </script>
</body>
</html>
